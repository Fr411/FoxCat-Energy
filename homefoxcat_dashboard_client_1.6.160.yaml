                            </div>
                            <div class="fcb-decision" style="color:${actionColor}">${action}</div>
                            <div class="fcb-note">BOOST 65 °C = solaire uniquement · réseau ≤ plafond = confort 45 °C</div>
                          </div>
                        </div>`;
                    ]]]
