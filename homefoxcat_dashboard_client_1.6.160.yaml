                        margin-top:12px;
                        font-size:16px;
                        font-weight:800;
                      ">
                        ${text}
                      </div>

                    </div>
                  `;
                ]]]
              pri: |
                [[[
                  const mode = states['input_select.ems_mode']?.state || '';

                  if (mode !== 'Economie énergie') return '';

                  const l1 = states['switch.l1_pri']?.state === 'on';
                  const l2 = states['switch.l2_pri']?.state === 'on';
                  const l3 = states['switch.l3_pri']?.state === 'on';
                  const l4 = states['switch.l4_pri']?.state === 'on';

                  let reduction = 0;
                  let active = 'AUCUN';

                  if (l4) {
                    reduction = 100;
                    active = 'L4';
                  } else if (l3) {
                    reduction = 75;
                    active = 'L3';
                  } else if (l2) {
                    reduction = 50;
                    active = 'L2';
                  } else if (l1) {
                    reduction = 25;
                    active = 'L1';
                  }

                  return `
                    <div style="
                      width:100%;
                      box-sizing:border-box;
                      padding:20px 16px;
                      border-radius:24px;
                      background:
                        radial-gradient(
                          circle at 100% 0%,
                          rgba(139,92,246,.16),
                          transparent 45%
                        ),
                        rgba(139,92,246,.06);
                      border:1px solid rgba(139,92,246,.25);
                    ">

                      <div style="
                        display:flex;
                        justify-content:space-between;
                        align-items:center;
                      ">

                        <div>
                          <div style="
                            font-size:14px;
                            font-weight:800;
                            letter-spacing:.08em;
                          ">
                            ⚡ PRI · ONDULEUR
