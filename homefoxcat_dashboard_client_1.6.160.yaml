# FoxCat Energy 1.6.160 — dashboard client · Accounting V2 + Dynamic Day-Ahead
# Prix actifs : entités natives FoxCat (Dynamic=Luminus Dynamic, HP/HC=ComfyFlex).
kiosk_mode:
  hide_header: '{{ is_state("input_boolean.hide_bar2", "on") }}'
  hide_sidebar: '{{ is_state("input_boolean.hide_sidebar2", "on") }}'
views:
  - type: sections
    max_columns: 4
    title: Accueil
    path: Emsdash
    icon: mdi:home
    show_icon_and_title: false
    sections:
      - type: grid
        cards:
          - type: custom:button-card
            entity: input_select.ems_mode
            show_name: false
            show_state: false
            show_icon: false
            custom_fields:
              title: |
                [[[
                  return `
                    <div style="
                      text-align:center;
                      width:100%;
                      box-sizing:border-box;
                      font-size:42px;
                      font-weight:900;
                      letter-spacing:.08em;
                      background:linear-gradient(90deg,#ffffff,#6ee7b7);
                      -webkit-background-clip:text;
                      -webkit-text-fill-color:transparent;
                    ">
                      ⚡ EMS ENERGY
                    </div>

                    <div style="
                      text-align:center;
                      width:100%;
                      margin-top:5px;
                      font-size:11px;
                      letter-spacing:.20em;
                      opacity:.4;
                    ">
                      HOMEFOXC​AT ENERGY
                    </div>
                  `;
                ]]]
              mode: |
                [[[
                  const mode = states['input_select.ems_mode']?.state || '-';

                  let icon = '⚡';

                  if (mode === 'Economie énergie') icon = '🌿';
                  if (mode === 'Réinjection autorisée') icon = '↗️';
                  if (mode === 'Réinjection refusée') icon = '⛔';
                  if (mode === 'Bihoraire') icon = '☀️';
                  if (mode === 'Manuel') icon = '🖐️';
                  if (mode === 'Confort') icon = '🏠';

                  return `
                    <div style="
                      width:100%;
                      box-sizing:border-box;
                      padding:18px 20px;
                      border-radius:22px;
                      background:rgba(139,92,246,.10);
                      border:1px solid rgba(139,92,246,.30);
                    ">

                      <div style="
                        font-size:11px;
                        opacity:.5;
                        text-transform:uppercase;
                        letter-spacing:.12em;
                      ">
                        Mode EMS · Sélection
                      </div>

                      <div style="
                        margin-top:6px;
                        font-size:25px;
                        font-weight:800;
                        color:#c4b5fd;
                      ">
                        ${icon} ${mode}
                      </div>

                      <div style="
                        margin-top:8px;
                        font-size:11px;
                        opacity:.4;
                      ">
                        Appuyer pour changer le mode
                      </div>

                    </div>
                  `;
                ]]]
            styles:
              grid:
                - grid-template-areas: |
                    "title"
                    "mode"
                - row-gap:14px
              card:
                - width:100%
                - box-sizing:border-box
                - border-radius:32px
                - padding:28px
                - color:white
                - background: |
                    radial-gradient(
                      circle at 90% 0%,
                      rgba(16,185,129,.14),
                      transparent 35%
                    ),
                    radial-gradient(
                      circle at 0% 100%,
                      rgba(139,92,246,.12),
                      transparent 35%
                    ),
                    linear-gradient(
                      145deg,
                      #070b14,
                      #101827 55%,
                      #080d16
                    )
                - box-shadow: |
                    inset 0 1px 0 rgba(255,255,255,.07),
                    0 25px 70px rgba(0,0,0,.45)
              custom_fields:
                title:
                  - grid-area:title
                  - width:100%
                mode:
                  - grid-area:mode
                  - width:100%
            tap_action:
              action: more-info
      - type: grid
        cards:
          - type: custom:button-card
            show_name: false
            show_state: false
            show_icon: false
            custom_fields:
              summary: |-
                [[[
                  const pv = parseFloat(states['sensor.homefoxcat_load_solaire']?.state || 0);
                  const house = parseFloat(states['sensor.consommation_reelle_maison']?.state || 0);
                  const prod = parseFloat(states['sensor.homefoxcat_total_production_today']?.state || 0);
                  const conso = parseFloat(states['sensor.homefoxcat_total_consumption_today']?.state || 0);
                  const inj = parseFloat(states['sensor.reinjection_jour']?.state || 0);
                  const prix = parseFloat(Object.values(states).find(e => (e.attributes?.friendly_name || '').toLowerCase().includes("prix d'achat actif"))?.state || 0);
                  const balance = pv - house;
                  const mode = states['input_select.ems_mode']?.state || '-';
                  return `
                    <div style="width:100%;box-sizing:border-box;padding:20px;border-radius:24px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07);">
                      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;">
                        <div>
                          <div style="font-size:11px;opacity:.45;letter-spacing:.12em;">SYSTÈME EMS</div>
                          <div style="margin-top:4px;font-size:20px;font-weight:900;color:#c4b5fd;">${mode}</div>
                        </div>
                        <div style="font-size:10px;font-weight:800;color:#34d399;">● SYSTÈME ACTIF</div>
                      </div>
                      <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:16px;">
                        <div style="padding:14px;text-align:center;border-radius:17px;background:rgba(16,185,129,.07);"><div style="font-size:9px;opacity:.45;">☀️ PRODUCTION</div><div style="font-size:24px;font-weight:900;margin-top:4px;">${Math.round(pv)} <span style="font-size:10px;opacity:.45;">W</span></div></div>
                        <div style="padding:14px;text-align:center;border-radius:17px;background:rgba(59,130,246,.07);"><div style="font-size:9px;opacity:.45;">🏠 MAISON</div><div style="font-size:24px;font-weight:900;margin-top:4px;">${Math.round(house)} <span style="font-size:10px;opacity:.45;">W</span></div></div>
                        <div style="padding:14px;text-align:center;border-radius:17px;background:rgba(250,204,21,.06);"><div style="font-size:9px;opacity:.45;">📅 PV AUJOURD'HUI</div><div style="font-size:21px;font-weight:900;margin-top:4px;">${prod.toFixed(1)} <span style="font-size:9px;opacity:.45;">kWh</span></div></div>
                        <div style="padding:14px;text-align:center;border-radius:17px;background:rgba(139,92,246,.07);"><div style="font-size:9px;opacity:.45;">📊 CONSO AUJOURD'HUI</div><div style="font-size:21px;font-weight:900;margin-top:4px;">${conso.toFixed(1)} <span style="font-size:9px;opacity:.45;">kWh</span></div></div>
                      </div>
                      <div style="display:flex;justify-content:space-between;gap:10px;margin-top:12px;font-size:10px;opacity:.55;">
                        <span>${balance >= 0 ? '☀️ Surplus '+Math.round(balance)+' W' : '⚡ Import '+Math.round(Math.abs(balance))+' W'}</span>
                        <span>↗️ ${inj.toFixed(2)} kWh injectés</span>
                        <span>💶 ${prix.toFixed(3)} €/kWh</span>
                      </div>
                    </div>`;
                ]]]
            styles:
              card:
                - 'padding: 0'
                - 'background: transparent'
                - 'box-shadow: none'
              custom_fields:
                summary:
                  - 'width: 100%'
