                            <div class="cell"><span>MOYENNE BALLON</span><b>${fmt(tempAvg,'°C')}</b></div>
                            <div class="cell"><span>PUISSANCE</span><b>${fmt(power,'W',0)}</b></div>
                            <div class="cell"><span>ÉNERGIE MANQUANTE</span><b>${fmt(Number(thermal?.state),'kWh',2)}</b></div>
                            <div class="cell"><span>DURÉE ESTIMÉE</span><b>${fmt(Number(duration?.state),'h',2)}</b></div>
                            <div class="cell"><span>EXÉCUTION</span><b>${exec?.state || '—'}</b></div>
