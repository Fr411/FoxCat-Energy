                            font-weight:900;
                            color:${power < 0 ? '#60a5fa' : '#c4b5fd'};
                          ">
                            ${Math.round(power)}
                            <span style="
                              font-size:15px;
                              opacity:.5;
                            ">
                              W
                            </span>
                          </div>
                        </div>

                        <div style="
                          font-size:12px;
                          font-weight:700;
                          opacity:.45;
                        ">
                          ${Math.round(percent)} %
                        </div>

                      </div>

                      <div style="
                        position:relative;
                        width:100%;
                        height:18px;
                        border-radius:20px;
                        overflow:hidden;
                        background:rgba(255,255,255,.07);
                      ">

                        <div style="
                          width:${percent}%;
                          height:100%;
                          border-radius:20px;
                          background:linear-gradient(
                            90deg,
                            #60a5fa 0%,
                            #8b5cf6 45%,
                            #a78bfa 70%,
                            #c4b5fd 100%
                          );
                          box-shadow:
                            0 0 12px rgba(139,92,246,.45);
                          transition:width .4s ease;
                        "></div>

                        <div style="
                          position:absolute;
                          left:calc(${percent}% - 5px);
                          top:-4px;
                          width:10px;
                          height:26px;
                          border-radius:8px;
                          background:white;
                          box-shadow:
                            0 0 8px white,
                            0 0 15px rgba(255,255,255,.8);
                        "></div>

                      </div>

                      <div style="
                        display:flex;
                        justify-content:space-between;
                        margin-top:7px;
                        font-size:9px;
                        font-weight:600;
                        opacity:.4;
                      ">
                        <span>-50 W</span>
                        <span>1000 W</span>
                        <span>2000 W</span>
                        <span>3000 W</span>
                        <span>4000 W</span>
                      </div>

                    </div>
                  `;
                ]]]
              active_level: |
                [[[
                  const levels = [
                    ['switch.l1_pri','Niveau 1',1000],
                    ['switch.l2_pri','Niveau 2',2000],
                    ['switch.l3_pri','Niveau 3',3000],
                    ['switch.l4_pri','Niveau 4',4000]
                  ];

                  let active = null;

                  for (const level of levels) {
                    if (states[level[0]]?.state === 'on') {
                      active = level;
                    }
                  }

                  if (!active) {
                    return `
                      <div style="
                        width:100%;
                        box-sizing:border-box;
                        padding:13px;
                        border-radius:16px;
                        text-align:center;
                        background:rgba(255,255,255,.035);
