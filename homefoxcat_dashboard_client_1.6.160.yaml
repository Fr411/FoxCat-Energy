                    `;
                  }

                  return `
                    <div style="
                      width:100%;
                      box-sizing:border-box;
                      padding:14px;
                      border-radius:17px;
                      text-align:center;
                      background:rgba(139,92,246,.10);
                      border:1px solid rgba(139,92,246,.25);
                    ">

                      <div style="
                        font-size:10px;
                        font-weight:700;
                        letter-spacing:.1em;
                        opacity:.45;
                      ">
                        NIVEAU ACTUEL
                      </div>

                      <div style="
                        margin-top:4px;
                        font-size:21px;
                        font-weight:900;
                        color:#c4b5fd;
                      ">
                        ${active[1]}
                      </div>

                      <div style="
                        margin-top:3px;
                        font-size:12px;
                        font-weight:700;
                        opacity:.6;
