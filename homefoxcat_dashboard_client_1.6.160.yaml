                      <div style="
                        position:relative;
                        width:100%;
                        height:18px;
                        border-radius:30px;
                        overflow:hidden;
                        background:linear-gradient(
                          90deg,
                          #2ecc71,
                          #f1c40f,
                          #e74c3c
                        );
                      ">

                        <div style="
                          position:absolute;
                          left:calc(${percent}% - 9px);
                          top:-5px;
                          width:18px;
                          height:28px;
                          border-radius:10px;
                          background:white;
                          box-shadow:
                            0 0 8px white,
                            0 0 18px white,
                            0 0 28px rgba(255,255,255,.8);
