          # Bonjour {{ user }}
          Voici la visualisation des données de consommation a seloignes 
    show_icon_and_title: false
  - type: sections
    max_columns: 4
    title: Day-Ahead
    path: day-ahead
    icon: mdi:chart-timeline-variant-shimmer
    sections:
      - type: grid
        cards:
          - type: custom:button-card
            show_name: false
            show_icon: false
            show_state: false
            triggers_update: all
            custom_fields:
              content: |
                [[[
                  const all=Object.values(states);
                  const find=n=>all.find(e=>(e.attributes?.friendly_name||'').toLowerCase().includes(n.toLowerCase()));
                  const buy=states['sensor.luminus_luminus_dynamic_wallonia_prix_actuel'];
                  const next=states['sensor.luminus_luminus_dynamic_wallonia_prix_heure_suivante'];
                  const tomorrow=states['binary_sensor.luminus_luminus_dynamic_wallonia_prix_de_demain_disponibles'];
                  const position=find('position sur la courbe dynamique');
                  const plan=find('planificateur day-ahead');
                  const p=Number(buy?.state),n=Number(next?.state),pos=Number(position?.state);
                  const fmt=v=>Number.isFinite(v)?v.toFixed(3).replace('.',',')+' €/kWh':'—';
                  const pct=v=>Number.isFinite(v)?v.toFixed(1).replace('.',',')+' %':'—';
                  const fav=plan?.attributes?.prix_favorable===true?'PRIX FAVORABLE':'PLANIFICATION';
                  return `<div style="text-align:center"><div style="font-size:22px;font-weight:800">MARCHÉ & TENDANCE</div><div style="opacity:.5;font-size:11px">Luminus Dynamic · FoxCat Day-Ahead</div><div style="font-size:35px;font-weight:800;margin:24px 0">${fmt(p)}</div><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:12px"><div class="b">H+1<br><b>${fmt(n)}</b></div><div class="b">POSITION<br><b>${pct(pos)}</b></div><div class="b">DAY-AHEAD<br><b>${tomorrow?.state==='on'?'DEMAIN OK':'EN ATTENTE'}</b></div><div class="b">ÉTAT<br><b>${fav}</b></div></div></div>`;
                ]]]
            styles:
              card:
                - padding: 24px
                - border-radius: 24px
                - background: linear-gradient(145deg,rgba(25,28,34,.98),rgba(12,14,18,.98))
                - border: 1px solid rgba(255,255,255,.08)
            extra_styles: |
              .b{padding:16px;border-radius:16px;background:rgba(255,255,255,.045);font-size:10px;opacity:.85}.b b{display:block;margin-top:6px;font-size:17px}
          - type: entities
            title: Réglages Dynamic · synchronisés
            show_header_toggle: false
            state_color: true
            entities:
              - entity: select.foxcat_energy_ems_mode_ems
                name: Mode EMS
              - entity: select.foxcat_energy_tarification_regime_tarifaire
                name: Régime tarifaire
              - entity: select.foxcat_energy_tarification_politique_reseau
                name: Politique réseau
              - entity: number.foxcat_seuil_prix_dynamique
                name: Seuil prix favorable Day-Ahead
              - entity: number.foxcat_energy_tarification_seuil_zone_pic_day_ahead
                name: Seuil zone pic / plafond Boiler
      - type: grid
        cards:
          - type: custom:apexcharts-card
            update_interval: 1min
            graph_span: 2d
            span: {start: day}
            now: {show: true, label: Maintenant}
            header: {show: true, title: Prix Luminus Dynamic, show_states: false}
            yaxis: [{decimals: 3}]
            apex_config:
              chart: {height: 350, toolbar: {show: true}, zoom: {enabled: true}}
              legend: {show: true, position: bottom}
              stroke: {curve: smooth}
              xaxis: {type: datetime, labels: {datetimeUTC: false}}
            series:
              - entity: sensor.luminus_luminus_dynamic_wallonia_prix_actuel
                name: Achat
                type: area
                unit: €/kWh
                stroke_width: 3
                opacity: 0.18
                data_generator: |
                  const rows=[...(entity.attributes.today||[]),...(entity.attributes.tomorrow||[])];return rows.filter(r=>r.start!=null&&Number.isFinite(Number(r.all_in))).map(r=>[new Date(r.start).getTime(),Number(r.all_in)]);
              - entity: sensor.luminus_luminus_dynamic_wallonia_prix_d_injection
                name: Réinjection
                type: line
                unit: €/kWh
                stroke_width: 2
                data_generator: |
                  const rows=[...(entity.attributes.today||[]),...(entity.attributes.tomorrow||[])];return rows.filter(r=>r.start!=null&&Number.isFinite(Number(r.injection))).map(r=>[new Date(r.start).getTime(),Number(r.injection)]);
      - type: grid
        cards:
          - type: custom:button-card
            show_name: false
            show_icon: false
            custom_fields:
              content: |
                [[[
                  const all=Object.values(states),find=n=>all.find(e=>(e.attributes?.friendly_name||'').toLowerCase().includes(n.toLowerCase()));
                  const ids=['Day-Ahead • Lave-linge','Day-Ahead • Sèche-linge','Day-Ahead • Lave-vaisselle'];
                  return `<div style="padding:6px"><b>PLANIFICATION APPAREILS</b>${ids.map(n=>{const e=find(n);return `<div style="margin-top:12px;padding:12px;border-radius:14px;background:rgba(255,255,255,.04)"><b>${n.replace('Day-Ahead • ','')}</b><br>${e?.state||'Indisponible'}<br><small>${e?.attributes?.reason||''}</small></div>`}).join('')}</div>`;
                ]]]
            styles:
              card: [padding: 18px, border-radius: 22px]
      - type: grid
        cards:
          - type: custom:button-card
            show_name: false
            show_icon: false
            custom_fields:
              content: |
                [[[
                  const all=Object.values(states),find=n=>all.find(e=>(e.attributes?.friendly_name||'').toLowerCase().includes(n.toLowerCase()));
                  const val=n=>{const e=find(n),v=Number(e?.state);return Number.isFinite(v)?v.toFixed(2):'—'};
                  return `<div style="padding:6px;text-align:center"><b>BILAN DYNAMIC · JOUR</b><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px"><div>PV total<br><b>${val('production aujourd’hui')} kWh</b></div><div>Consommation<br><b>${val('consommation aujourd’hui')} kWh</b></div><div>Import total<br><b>${val('prélèvement réseau aujourd’hui')} kWh</b></div><div>Réinjection totale<br><b>${val('réinjection aujourd’hui')} kWh</b></div><div>Import Dynamic<br><b>${val('Dynamic • Prélèvement')} kWh</b></div><div>Export Dynamic<br><b>${val('Dynamic • Réinjection')} kWh</b></div></div></div>`;
                ]]]
            styles:
              card: [padding: 18px, border-radius: 22px]
