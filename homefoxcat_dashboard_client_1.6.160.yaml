                    },
                    {
                      entity:'switch.l2_pri',
                      name:'Niveau 2',
                      power:2000
                    },
                    {
                      entity:'switch.l3_pri',
                      name:'Niveau 3',
                      power:3000
                    },
                    {
                      entity:'switch.l4_pri',
                      name:'Niveau 4',
                      power:4000
                    }
                  ];

                  return `
                    <div style="
                      width:100%;
                      box-sizing:border-box;
                      display:grid;
                      grid-template-columns:
                        repeat(2,minmax(0,1fr));
                      gap:10px;
                    ">

                      ${levels.map(level => {

                        const active =
                          states[level.entity]?.state === 'on';

                        return `
                          <div
                            data-entity="${level.entity}"
                            style="
                              width:100%;
                              min-width:0;
                              box-sizing:border-box;
                              padding:17px 8px;
                              border-radius:20px;
                              text-align:center;
                              cursor:pointer;

                              background:${active
                                ? 'linear-gradient(145deg,rgba(139,92,246,.28),rgba(96,165,250,.13))'
                                : 'rgba(255,255,255,.035)'};

                              border:1px solid ${active
                                ? 'rgba(167,139,250,.65)'
                                : 'rgba(255,255,255,.07)'};

                              box-shadow:${active
                                ? '0 0 25px rgba(139,92,246,.18), inset 0 1px 0 rgba(255,255,255,.08)'
                                : 'none'};

                              transition:all .25s ease;
                            "
                          >

                            <div style="
                              font-size:12px;
                              font-weight:900;
                              color:${active
                                ? '#c4b5fd'
                                : 'rgba(255,255,255,.55)'};
                            ">
                              ${level.name}
                            </div>

                            <div style="
                              margin-top:8px;
                              font-size:30px;
                              line-height:1;
                              font-weight:900;
                              color:${active
                                ? '#ffffff'
                                : 'rgba(255,255,255,.8)'};
