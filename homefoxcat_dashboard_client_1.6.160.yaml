                                ? '#a78bfa'
                                : 'rgba(255,255,255,.3)'};
                            ">
                              ${active
                                ? '● NIVEAU ACTIF'
                                : 'NIVEAU DISPONIBLE'}
                            </div>

                          </div>
                        `;

                      }).join('')}

                    </div>
                  `;
                ]]]
            styles:
              grid:
                - grid-template-areas: |
                    "header"
                    "inverter_power"
                    "active_level"
                    "levels"
                - row-gap:14px
              card:
                - width:100%
                - max-width:100%
                - box-sizing:border-box
                - overflow:hidden
                - border-radius:30px
                - padding:24px
                - color:white
                - background: |
                    radial-gradient(
                      circle at 100% 0%,
                      rgba(139,92,246,.16),
                      transparent 38%
                    ),
                    radial-gradient(
                      circle at 0% 100%,
                      rgba(59,130,246,.08),
                      transparent 38%
                    ),
                    linear-gradient(
                      145deg,
                      #070b14,
                      #101827 55%,
                      #080d16
                    )
                - box-shadow: |
                    inset 0 1px 0 rgba(255,255,255,.07),
                    0 20px 60px rgba(0,0,0,.4)
              custom_fields:
                header:
                  - grid-area:header
                  - width:100%
                inverter_power:
                  - grid-area:inverter_power
                  - width:100%
                active_level:
                  - grid-area:active_level
                  - width:100%
                levels:
                  - grid-area:levels
                  - width:100%
            tap_action:
              action: none
            extra_styles: |
              [[[
                const card = this;

                const levels = [
                  'switch.l1_pri',
                  'switch.l2_pri',
                  'switch.l3_pri',
                  'switch.l4_pri'
                ];

                const fields =
                  card.shadowRoot?.querySelectorAll(
                    '[data-entity]'
                  );

                if (fields) {

                  fields.forEach(el => {

                    el.addEventListener('click', async () => {

                      const entity =
                        el.dataset.entity;

                      if (!entity) return;

                      /*
                       * Un seul niveau actif à la fois.
                       */

                      for (const level of levels) {

                        if (level === entity) {

                          await hass.callService(
                            'switch',
                            'turn_on',
                            {
                              entity_id: level
                            }
                          );

                        } else {

                          await hass.callService(
                            'switch',
                            'turn_off',
                            {
                              entity_id: level
                            }
                          );

                        }

                      }

                    });

                  });

                }

              ]]]
