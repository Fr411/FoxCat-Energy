                    ), radial-gradient(
                      circle at 0% 100%,
                      rgba(99,102,241,.12),
                      transparent 30%
                    ), linear-gradient(
                      145deg,
                      #070b14,
                      #101827 55%,
                      #080d16
                    )
                - box-shadow: >
                    inset 0 1px 0 rgba(255,255,255,.07), 0 25px 70px
                    rgba(0,0,0,.45)
              custom_fields:
                header:
                  - grid-area: header
                  - width: 100%
                current_price:
                  - grid-area: current_price
