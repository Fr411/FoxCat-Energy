                   * réel de puissance de l'onduleur si nécessaire.
                   */
                  const power = parseFloat(
                    states['sensor.homefoxcat_total_production_active_power']?.state || 0
                  );

                  /*
                   * Plage :
                   * -50 W → 4000 W
                   */
                  const min = -50;
                  const max = 4000;

                  const clamped = Math.max(min, Math.min(power, max));

                  const percent =
                    ((clamped - min) / (max - min)) * 100;

                  return `
                    <div style="
                      width:100%;
                      box-sizing:border-box;
                      padding:18px 4px 8px;
                    ">

