      - type: grid
        column_span: 4
        cards:
          - type: custom:button-card
            show_name: false
            show_icon: false
            custom_fields:
              content: |
                [[[
                  const num=id=>{const v=Number(states[id]?.state);return Number.isFinite(v)?v:null};
                  const fmt=(v,u='°C')=>v==null?'—':v.toFixed(1).replace('.',',')+' '+u;
                  const est=num('[[foxcat:boiler.estimated_temperature]]'), low=num('[[foxcat:boiler.temperature_source]]'), top=num('[[foxcat:boiler.resistance_temperature_source]]'), p=num('[[foxcat:boiler.power]]');
                  const conf=num('[[foxcat:boiler.estimate_confidence]]'), st=states['[[foxcat:boiler.thermal_state]]']?.state??'—', origin=states['[[foxcat:boiler.origin]]']?.state??'—';
                  return `<div class="boilerhero"><div class="title"><div><span>CHARGE FLEXIBLE</span><h2>BOILER ECS</h2></div><div class="heat">${(p||0)>100?'● EN CHAUFFE':'○ EN ATTENTE'}</div></div><div class="bgrid"><div class="estimate"><small>TEMPÉRATURE ESTIMÉE</small><b>${fmt(est)}</b><em>confiance ${conf==null?'—':conf.toFixed(0)+' %'}</em></div><div><small>DOIGT DE GANT BAS</small><b>${fmt(low)}</b><small>CONTACT TÊTE CUVE</small><b>${fmt(top)}</b></div><div><small>PUISSANCE</small><b>${p==null?'—':Math.round(p)+' W'}</b><small>ÉTAT THERMIQUE</small><b>${st}</b></div><div><small>DÉCISION</small><b>${origin}</b><small>DEMANDE</small><b>${states['[[foxcat:boiler.demand]]']?.state??'—'}</b></div></div></div>`;
                ]]]
            styles:
              card: [padding: 25px, border-radius: 30px, background: 'linear-gradient(130deg,rgba(42,26,8,.91),rgba(9,15,22,.92))', border: '1px solid rgba(255,180,70,.18)', box-shadow: '0 22px 60px rgba(0,0,0,.30)']
            extra_styles: |
              .title{display:flex;justify-content:space-between;align-items:start}.title span{font-size:8px;letter-spacing:.16em;opacity:.5}.title h2{margin:4px 0 0;font-size:22px;letter-spacing:.08em}.heat{font-size:9px;font-weight:900;color:#ffc160;padding:8px 10px;border-radius:15px;background:rgba(255,181,70,.08)}.bgrid{display:grid;grid-template-columns:1.25fr 1fr 1fr 1.35fr;gap:10px;margin-top:20px}.bgrid>div{padding:14px;border-radius:17px;background:rgba(255,255,255,.035)}.bgrid small{display:block;font-size:8px;opacity:.42;margin:5px 0 2px}.bgrid b{font-size:13px}.estimate b{font-size:25px;color:#ffc15e}.estimate em{display:block;font-size:9px;font-style:normal;opacity:.45;margin-top:4px}@media(max-width:800px){.bgrid{grid-template-columns:repeat(2,1fr)}}
      - type: grid
        column_span: 3
        cards:
          - type: custom:apexcharts-card
            graph_span: 24h
            update_interval: 1min
            header: {show: true, title: Boiler · thermie et puissance, show_states: true}
            now: {show: true}
            apex_config:
              chart: {height: 330, toolbar: {show: true}}
              stroke: {curve: smooth}
              legend: {show: true, position: bottom}
            yaxis:
              - {id: temp, decimals: 1}
              - {id: power, opposite: true, decimals: 0}
            series:
              - {entity: '[[foxcat:boiler.estimated_temperature]]', name: Température estimée, yaxis_id: temp, stroke_width: 3}
              - {entity: '[[foxcat:boiler.temperature_source]]', name: Sonde bas / résistance, yaxis_id: temp, stroke_width: 1}
              - {entity: '[[foxcat:boiler.resistance_temperature_source]]', name: Contact tête cuve, yaxis_id: temp, stroke_width: 1}
              - {entity: '[[foxcat:boiler.power]]', name: Puissance, yaxis_id: power, type: area, opacity: 0.12, stroke_width: 2}
      - type: grid
        cards:
          - type: entities
            title: Commandes
            show_header_toggle: false
            entities:
              - {entity: '[[foxcat:boiler.enabled]]', name: Charge flexible active}
              - {entity: '[[foxcat:boiler.user_start]]', name: Démarrage utilisateur}
              - {entity: '[[foxcat:boiler.user_stop]]', name: Arrêt utilisateur}
              - {entity: '[[foxcat:boiler.user_auto]]', name: Retour automatique}
          - type: entities
            title: Réserve thermique
            show_header_toggle: false
            entities:
              - {entity: '[[foxcat:boiler.thermal_energy_missing]]', name: Énergie manquante}
              - {entity: '[[foxcat:boiler.heating_duration]]', name: Durée de chauffe estimée}
              - {entity: '[[foxcat:boiler.safety]]', name: Sécurité thermique}

