  # ============================================================
  # SOUS-VUE TECHNIQUE — véritable configurateur EMS
  # ============================================================
  - title: Technique
    path: technique
    icon: mdi:tune-vertical-variant
    subview: true
    type: sections
    max_columns: 4
    background: >-
      radial-gradient(circle at 7% 8%, rgba(255,160,39,.16), transparent 26%),
      radial-gradient(circle at 94% 9%, rgba(0,198,255,.18), transparent 29%),
      linear-gradient(150deg,#05080c,#0b121a 58%,#05070a)
    sections:
      - type: grid
        column_span: 4
        cards:
          - type: custom:button-card
            show_name: false
            show_icon: false
            custom_fields:
              content: |
                [[[
                  const mode=states['[[foxcat:ems.mode]]']?.state??'—', c=states['[[foxcat:pricing.regime]]']?.state??'—', d=states['[[foxcat:pricing.distribution_profile]]']?.state??'—', p=states['[[foxcat:pricing.network_policy]]']?.state??'—';
                  return `<div class="confighead"><span>FOXCAT ENERGY · 1.7.0</span><h2>EMS CONFIGURATOR</h2><p>Le comportement du moteur, le contrat d’énergie, la distribution et la politique réseau sont indépendants.</p><div><b>${mode}</b><b>${c}</b><b>${d}</b><b>${p}</b></div></div>`;
                ]]]
            styles:
              card: [padding: 27px, border-radius: 30px, background: 'linear-gradient(130deg,rgba(36,23,8,.75),rgba(5,31,46,.82))', border: '1px solid rgba(255,255,255,.10)', box-shadow: '0 20px 60px rgba(0,0,0,.28)']
            extra_styles: |
              .confighead>span{font-size:9px;font-weight:900;letter-spacing:.15em;opacity:.5}.confighead h2{font-size:24px;letter-spacing:.08em;margin:6px 0}.confighead p{font-size:11px;opacity:.55;max-width:700px}.confighead>div{display:flex;flex-wrap:wrap;gap:7px;margin-top:15px}.confighead b{font-size:10px;padding:8px 10px;border-radius:14px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.06)}

      - type: grid
        cards:
          - type: markdown
            content: |
              ### 1 · Comportement du moteur
              **Éco** applique les règles économiques de façon stricte. **Confort** conserve l’optimisation mais autorise davantage d’assouplissement. **Manuel** désactive les décisions automatiques, tout en conservant les sécurités.
          - type: entities
            show_header_toggle: false
            entities:
              - {entity: '[[foxcat:ems.mode]]', name: Comportement EMS}
              - {entity: '[[foxcat:ems.regulation_active]]', name: Régulation FoxCat}
              - {entity: '[[foxcat:pricing.behavior_relaxation]]', name: Assouplissement Confort}

      - type: grid
        cards:
          - type: markdown
            content: |
              ### 2 · Énergie, distribution et réseau
              Le **contrat énergie** détermine le prix d’achat. Le **profil distribution/comptage** décrit la structure du réseau belge. La **politique réseau** définit la façon dont FoxCat traite l’injection.
          - type: entities
            show_header_toggle: false
            entities:
              - {entity: '[[foxcat:pricing.regime]]', name: Contrat énergie}
              - {entity: '[[foxcat:pricing.distribution_profile]]', name: Profil distribution / comptage}
              - {entity: '[[foxcat:pricing.network_policy]]', name: Politique réseau}
              - {entity: '[[foxcat:pricing.distribution_period]]', name: Période distribution actuelle}

      - type: grid
        cards:
          - type: conditional
            conditions:
              - {entity: '[[foxcat:pricing.regime]]', state: Dynamique}
            card:
              type: vertical-stack
              cards:
                - type: markdown
                  content: |
                    ### 3 · Réglages Dynamic
                    Le **seuil favorable** définit le bas de la courbe Day-Ahead. Le **plafond acceptable** bloque les nouveaux achats flexibles au-delà de cette position. Le planificateur affiche aussi le temps restant dans le creux favorable courant.
                - type: entities
                  show_header_toggle: false
                  entities:
                    - {entity: '[[foxcat:pricing.day_ahead.threshold]]', name: Seuil favorable}
                    - {entity: '[[foxcat:pricing.day_ahead.peak_threshold]]', name: Plafond acceptable}
                    - {entity: '[[foxcat:pricing.predictive_enabled]]', name: Planification prix}
                    - {entity: '[[foxcat:pricing.solar_forecast_arbitrage]]', name: Arbitrage prévision solaire}

      - type: grid
        column_span: 2
        cards:
          - type: markdown
            content: |
              ### 4 · Boiler · charge flexible
              La sonde dans le **doigt de gant bas** est fiable pour la sécurité mais influencée par la résistance pendant la chauffe. Le capteur en **contact sur la tête de cuve** est utilisé surtout pour la tendance et la détection de puisage. FoxCat fusionne ces informations avec la puissance et l’historique pour estimer la réserve thermique.
          - type: entities
            show_header_toggle: false
            entities:
              - {entity: '[[foxcat:boiler.enabled]]', name: Charge flexible Boiler}
              - {entity: '[[foxcat:boiler.setting.start]]', name: Température de reprise}
              - {entity: '[[foxcat:boiler.setting.normal]]', name: Cible confort réseau}
              - {entity: '[[foxcat:boiler.setting.boost]]', name: Stockage solaire / boost}
              - {entity: '[[foxcat:boiler.setting.safety]]', name: Sécurité absolue}
              - {entity: '[[foxcat:boiler.setting.top_offset]]', name: Correction capteur tête cuve}
              - {entity: '[[foxcat:boiler.setting.heat_bias]]', name: Durée influence résistance}
              - {entity: '[[foxcat:boiler.setting.draw_drop]]', name: Chute de température = puisage}
              - {entity: '[[foxcat:boiler.setting.min_confidence]]', name: Confiance minimale fallback}

      - type: grid
        cards:
          - type: markdown
            content: |
              ### 5 · Onduleur / PRI
              Le PRI reste indépendant du comportement tarifaire. En **Zéro injection**, il vise une réinjection quasi nulle ; en **Compensation**, la production disponible reste libérée. Les seuils ci-dessous règlent la tolérance physique du réseau.
          - type: entities
            show_header_toggle: false
            entities:
              - {entity: '[[foxcat:inverter.enabled]]', name: Régulation PRI}
              - {entity: '[[foxcat:inverter.setting.export_max]]', name: Injection maximale tolérée}
              - {entity: '[[foxcat:inverter.setting.import_target]]', name: Import cible}
              - {entity: '[[foxcat:inverter.setting.import_max]]', name: Import maximal avant libération PV}
              - {entity: '[[foxcat:inverter.setting.pv_min]]', name: Production PV minimale PRI}

      - type: grid
        cards:
          - type: markdown
            content: |
              ### 6 · Maintenance
              La régénération du dashboard utilise le registre FoxCat et crée une sauvegarde du fichier existant avant remplacement. Le diagnostic ne modifie aucune règle de décision. Les plages détaillées LL / SL / LV restent configurables dans les options de l'intégration FoxCat Energy.
          - type: entities
            show_header_toggle: false
            entities:
              - {entity: '[[foxcat:diagnostic.dashboard_regenerate]]', name: Régénérer le dashboard}
              - {entity: '[[foxcat:diagnostic.button]]', name: Lancer diagnostic}
              - {entity: '[[foxcat:diagnostic.reset]]', name: Réinitialiser cycle EMS}

  # ============================================================
  # SOUS-VUE DIAGNOSTIC
  # ============================================================
  - title: Diagnostic
    path: diagnostic
    icon: mdi:stethoscope
    subview: true
    type: sections
    max_columns: 4
    background: >-
      radial-gradient(circle at 88% 8%, rgba(0,200,255,.16), transparent 28%),
      linear-gradient(145deg,#05080d,#0a1118 55%,#05070a)
    sections:
      - type: grid
        cards:
          - type: entities
            title: EMS Core
            show_header_toggle: false
            entities:
              - {entity: '[[foxcat:ems.phase]]', name: Phase}
              - {entity: '[[foxcat:ems.ack]]', name: ACK}
              - {entity: '[[foxcat:ems.reason]]', name: Dernière raison}
              - {entity: '[[foxcat:ems.last_frame]]', name: Dernière trame}
              - {entity: '[[foxcat:ems.last_action]]', name: Dernière action}
          - type: entities
            title: Energy Bus
            show_header_toggle: false
            entities:
              - {entity: '[[foxcat:energy_bus.state]]', name: État}
              - {entity: '[[foxcat:energy_bus.frame_id]]', name: Frame ID}
              - {entity: '[[foxcat:energy_bus.ack]]', name: ACK bus}
              - {entity: '[[foxcat:energy_bus.pending_count]]', name: Messages en attente}
          - type: entities
            title: Métronome
            show_header_toggle: false
            entities:
              - {entity: '[[foxcat:metronome.status]]', name: Statut}
              - {entity: '[[foxcat:metronome.source]]', name: Source}
              - {entity: '[[foxcat:metronome.counter]]', name: Battements du jour}
              - {entity: '[[foxcat:metronome.last_pulse]]', name: Dernier battement}
      - type: grid
        column_span: 2
        cards:
          - type: entities
            title: Registre & cohérence
            show_header_toggle: false
            entities:
              - {entity: '[[foxcat:diagnostic.registry]]', name: Registre des entités FoxCat}
              - {entity: '[[foxcat:diagnostic.legacy_conflict]]', name: Conflit legacy}
              - {entity: '[[foxcat:diagnostic.high_load]]', name: Haute consommation}
