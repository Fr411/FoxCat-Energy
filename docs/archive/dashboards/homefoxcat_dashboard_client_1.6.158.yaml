                          ['L2','50%',l2],
                          ['L3','75%',l3],
                          ['L4','100%',l4]
                        ].map(x => `
                          <div style="
                            min-width:0;
                            text-align:center;
                            padding:11px 3px;
                            border-radius:15px;
                            background:${x[2]
                              ? 'rgba(139,92,246,.18)'
                              : 'rgba(255,255,255,.035)'};
                            border:1px solid ${x[2]
