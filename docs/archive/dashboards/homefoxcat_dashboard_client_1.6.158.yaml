  - type: sections
    max_columns: 4
    title: Énergie
    path: energie
    icon: mdi:lightning-bolt
    subview: true
    show_icon_and_title: false
    sections:
      - type: grid
        cards:
          - type: custom:button-card
            show_name: false
            show_state: false
            show_icon: false
            custom_fields:
              greeting: |
                [[[
                  const hour = new Date().getHours();

                  if (hour < 6) return "🌙 Bonne nuit";
                  if (hour < 12) return "☀️ Bonjour";
                  if (hour < 18) return "👋 Bon après-midi";
                  return "🌙 Bonsoir";
                ]]]
              datetime: |
                [[[
                  return new Date().toLocaleString('fr-BE',{
                    weekday:'long',
                    day:'numeric',
                    month:'long',
                    year:'numeric',
                    hour:'2-digit',
                    minute:'2-digit'
                  });
                ]]]
              tarif: |
                [[[
                  const hour = new Date().getHours();

                  const hp =
                    (hour >= 7 && hour < 11) ||
                    (hour >= 17 && hour < 22);

                  return `
                    <div style="
                      width:100%;
                      box-sizing:border-box;
                      padding:16px 18px;
                      border-radius:20px;
                      background:${hp
                        ? 'rgba(245,158,11,.10)'
                        : 'rgba(16,185,129,.10)'};
                      border:1px solid ${hp
                        ? 'rgba(245,158,11,.25)'
                        : 'rgba(16,185,129,.25)'};
                    ">

                      <div style="
                        font-size:11px;
                        opacity:.5;
                        letter-spacing:.1em;
                      ">
                        TARIF AIESH
                      </div>

                      <div style="
                        margin-top:4px;
                        font-size:22px;
                        font-weight:800;
                        color:${hp ? '#fbbf24' : '#34d399'};
                      ">
                        ${hp ? '🟠 Heures Pleines' : '🟢 Heures Creuses'}
                      </div>

                      <div style="
                        margin-top:4px;
                        font-size:11px;
                        opacity:.4;
                      ">
                        HP 07–11 / 17–22 · HC 11–17 / 22–07
                      </div>

                    </div>
                  `;
                ]]]
              prix: |
                [[[
                  const value = parseFloat(
                    Object.values(states).find(e => (e.attributes?.friendly_name || '').toLowerCase().includes("prix d'achat actif"))?.state || 0
                  );

                  return `
                    <div style="
                      width:100%;
                      box-sizing:border-box;
                      text-align:center;
                      padding:17px 10px;
                      border-radius:20px;
                      background:rgba(255,255,255,.045);
                      border:1px solid rgba(255,255,255,.08);
                    ">

                      <div style="font-size:11px;opacity:.45;">
                        💰 PRIX ACTUEL
                      </div>

                      <div style="
                        margin-top:5px;
                        font-size:26px;
                        font-weight:800;
                        color:#c4b5fd;
                      ">
                        ${value.toFixed(3)}
                        <span style="font-size:12px;opacity:.45;">
                          €/kWh
                        </span>
                      </div>

                    </div>
                  `;
                ]]]
              next_price: |
                [[[
                  const value = parseFloat(
                    Object.values(states).find(e => (e.attributes?.friendly_name || '').toLowerCase().includes("prix d'achat suivant"))?.state || 0
                  );

                  return `
                    <div style="
                      width:100%;
                      box-sizing:border-box;
                      text-align:center;
                      padding:17px 10px;
                      border-radius:20px;
                      background:rgba(255,255,255,.045);
                      border:1px solid rgba(255,255,255,.08);
                    ">

                      <div style="font-size:11px;opacity:.45;">
                        ➡️ PROCHAINE HEURE
                      </div>

                      <div style="
                        margin-top:5px;
                        font-size:26px;
                        font-weight:800;
                        color:#60a5fa;
                      ">
                        ${value.toFixed(3)}
                        <span style="font-size:12px;opacity:.45;">
                          €/kWh
                        </span>
                      </div>

                    </div>
                  `;
                ]]]
              energy_flow: |
                [[[
                  const pv = parseFloat(states['sensor.homefoxcat_load_solaire']?.state || 0);
                  const house = parseFloat(states['sensor.consommation_reelle_maison']?.state || 0);
                  const grid = parseFloat(states['sensor.retourne_au_reseau']?.state || 0);

                  const surplus = pv - house;

                  const importPower = surplus < 0
                    ? Math.abs(surplus)
                    : 0;

                  const solarCover = house > 0
                    ? Math.min((pv / house) * 100,100)
                    : 0;

                  return `
                    <div style="
                      width:100%;
                      box-sizing:border-box;
                      padding:20px 16px;
                      border-radius:24px;
                      background:
                        linear-gradient(
                          135deg,
                          rgba(16,185,129,.09),
                          rgba(59,130,246,.07)
                        );
                      border:1px solid rgba(255,255,255,.08);
                    ">

                      <div style="
                        text-align:center;
                        font-size:12px;
                        opacity:.5;
                        letter-spacing:.12em;
                      ">
                        FLUX ÉNERGÉTIQUE ACTUEL
                      </div>

                      <div style="
                        text-align:center;
                        margin-top:8px;
                        font-size:22px;
                        font-weight:800;
                        color:${surplus >= 0 ? '#34d399' : '#fb923c'};
                      ">
                        ${surplus >= 0
                          ? `☀️ Surplus photovoltaïque · ${Math.round(surplus)} W`
                          : `⚡ Import réseau · ${Math.round(importPower)} W`
                        }
                      </div>

                      <div style="
                        display:grid;
                        grid-template-columns:repeat(3,minmax(0,1fr));
                        gap:8px;
                        margin-top:18px;
                      ">

                        <div style="
                          min-width:0;
                          text-align:center;
                          padding:12px 4px;
                          border-radius:16px;
                          background:rgba(16,185,129,.08);
                        ">
                          <div style="font-size:20px;">☀️</div>
                          <div style="font-size:21px;font-weight:800;">
                            ${Math.round(pv)}
                          </div>
                          <div style="font-size:9px;opacity:.45;">
                            PV · W
                          </div>
                        </div>

                        <div style="
                          min-width:0;
                          text-align:center;
                          padding:12px 4px;
                          border-radius:16px;
                          background:rgba(59,130,246,.08);
                        ">
                          <div style="font-size:20px;">🏠</div>
                          <div style="font-size:21px;font-weight:800;">
                            ${Math.round(house)}
                          </div>
                          <div style="font-size:9px;opacity:.45;">
                            MAISON · W
                          </div>
                        </div>

                        <div style="
                          min-width:0;
                          text-align:center;
                          padding:12px 4px;
                          border-radius:16px;
                          background:rgba(139,92,246,.08);
                        ">
                          <div style="font-size:20px;">🔄</div>
                          <div style="font-size:21px;font-weight:800;">
                            ${Math.round(grid)}
                          </div>
                          <div style="font-size:9px;opacity:.45;">
                            RÉSEAU · W
                          </div>
                        </div>

                      </div>

                      <div style="margin-top:18px;">

                        <div style="
                          display:flex;
                          justify-content:space-between;
                          font-size:12px;
                          margin-bottom:8px;
                        ">
                          <span>⚡ Couverture solaire</span>
                          <b>${Math.round(solarCover)}%</b>
                        </div>

                        <div style="
                          width:100%;
                          height:12px;
                          border-radius:20px;
                          background:rgba(255,255,255,.07);
                          overflow:hidden;
                        ">
                          <div style="
                            width:${solarCover}%;
                            height:100%;
                            border-radius:20px;
                            background:linear-gradient(
                              90deg,
                              #ef4444,
                              #f59e0b,
                              #10b981
                            );
                          "></div>
                        </div>

                      </div>

                    </div>
                  `;
                ]]]
              power: |
                [[[
                  const power = parseFloat(
                    states['sensor.consommation_reelle_maison']?.state || 0
                  );

                  return `
                    <div style="
                      width:100%;
                      box-sizing:border-box;
                      text-align:center;
                      padding:12px 0;
                    ">

                      <div style="
                        font-size:72px;
                        line-height:1;
                        font-weight:900;
                        background:linear-gradient(90deg,#ffffff,#60a5fa);
                        -webkit-background-clip:text;
                        -webkit-text-fill-color:transparent;
                      ">
                        ${Math.round(power)}
                        <span style="
                          font-size:20px;
                          -webkit-text-fill-color:rgba(255,255,255,.4);
                        ">
                          W
                        </span>
                      </div>

                      <div style="
                        margin-top:8px;
                        font-size:15px;
                        opacity:.55;
                        letter-spacing:.08em;
                      ">
                        ⚡ BESOIN RÉEL DE LA MAISON
                      </div>

                    </div>
                  `;
                ]]]
              gauge: |
                [[[
                  const power = parseFloat(
                    states['sensor.consommation_reelle_maison']?.state || 0
                  );

                  const percent = Math.min((power / 6000) * 100,100);

                  let text = '🟢 ÉCONOMIE D’ÉNERGIE';

                  if (power >= 1000 && power < 2500)
                    text = '🟡 CONSOMMATION MODÉRÉE';

                  if (power >= 2500 && power < 4000)
                    text = '🟠 CONSOMMATION ÉLEVÉE';

                  if (power >= 4000)
                    text = '🔴 FORTE CONSOMMATION';

                  return `
                    <div style="
                      width:100%;
                      box-sizing:border-box;
                      padding:18px 4px;
                    ">

                      <div style="
                        display:flex;
                        justify-content:space-between;
                        font-size:11px;
                        opacity:.55;
                        margin-bottom:10px;
                      ">
                        <span>ÉCO</span>
                        <span>NORMAL</span>
                        <span>INTENSIF</span>
                      </div>

                      <div style="
                        position:relative;
                        width:100%;
                        height:18px;
                        border-radius:30px;
                        overflow:hidden;
                        background:linear-gradient(
                          90deg,
                          #2ecc71,
                          #f1c40f,
                          #e74c3c
                        );
                      ">

                        <div style="
                          position:absolute;
