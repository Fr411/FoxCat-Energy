                  label:
                    - 'font-size: 10px'
                    - 'opacity: .48'
                    - 'color: white'
              - type: custom:button-card
                name: Boiler ECS
                icon: mdi:water-boiler
                label: Température · Chauffe · Historique
                show_label: true
                tap_action:
                  action: navigate
                  navigation_path: |-
                    [[[
                      const base = window.location.pathname.replace(/\/[^\/]*$/, '');
                      return `${base}/boiler`;
                    ]]]
                styles:
                  card:
                    - 'height: 132px'
                    - 'border-radius: 24px'
                    - 'padding: 16px'
                    - 'background: linear-gradient(145deg,#0b1220,#111c2e)'
                    - 'border: 1px solid rgba(255,255,255,.08)'
                    - 'box-shadow: inset 0 1px 0 rgba(255,255,255,.04), 0 12px 30px rgba(0,0,0,.20)'
                  icon:
                    - 'width: 42px'
                    - 'color: #fb923c'
                  name:
                    - 'font-size: 18px'
                    - 'font-weight: 800'
