                                : 'rgba(255,255,255,.5)'};
                            ">
                              ${x[0]}
                            </div>

                            <div style="
                              margin-top:3px;
                              font-size:13px;
                              font-weight:800;
                            ">
                              ${x[1]}
                            </div>
                          </div>
                        `).join('')}

                      </div>

                    </div>
                  `;
                ]]]
              machines: |
                [[[
                  const machines = [
                    {
                      name:'Lave-linge',
                      icon:'🧺',
                      entity:'input_boolean.lave_linge_en_cours'
                    },
                    {
                      name:'Sèche-linge',
                      icon:'👕',
                      entity:'input_boolean.seche_linge_en_cours'
                    },
                    {
                      name:'Lave-vaisselle',
                      icon:'🍽️',
                      entity:'input_boolean.lave_vaisselle_en_cours'
                    }
                  ];

                  const running = machines.filter(m =>
                    states[m.entity]?.state === 'on'
                  );

                  if (running.length === 0) {
                    return `
                      <div style="
                        width:100%;
                        box-sizing:border-box;
                        padding:18px;
                        text-align:center;
                        border-radius:22px;
                        background:rgba(255,255,255,.035);
                        border:1px solid rgba(255,255,255,.07);
                      ">
                        <div style="
                          font-size:14px;
                          font-weight:800;
                        ">
                          ⚙️ APPAREILS
                        </div>

                        <div style="
                          margin-top:8px;
                          font-size:12px;
                          opacity:.45;
                        ">
                          Aucun appareil en fonctionnement
                        </div>
                      </div>
                    `;
                  }

                  return `
                    <div style="
                      width:100%;
                      box-sizing:border-box;
                      padding:18px 14px;
                      border-radius:22px;
                      background:rgba(255,255,255,.035);
                      border:1px solid rgba(255,255,255,.07);
                    ">

                      <div style="
                        font-size:13px;
                        font-weight:800;
                        letter-spacing:.08em;
                        margin-bottom:12px;
                      ">
                        ⚙️ APPAREILS EN FONCTIONNEMENT
                      </div>

                      <div style="
                        display:grid;
                        grid-template-columns:repeat(
                          ${Math.min(running.length,3)},
                          minmax(0,1fr)
                        );
                        gap:8px;
                      ">

                        ${running.map(m => `
                          <div style="
                            min-width:0;
                            text-align:center;
                            padding:15px 5px;
                            border-radius:17px;
                            background:rgba(16,185,129,.08);
                            border:1px solid rgba(16,185,129,.22);
                          ">

                            <div style="font-size:25px;">
                              ${m.icon}
                            </div>

                            <div style="
                              margin-top:7px;
                              font-size:11px;
                              font-weight:800;
                            ">
                              ${m.name}
                            </div>

                            <div style="
                              margin-top:5px;
                              color:#34d399;
                              font-size:9px;
                              font-weight:800;
                            ">
                              ● EN COURS
                            </div>

                          </div>
                        `).join('')}

                      </div>

                    </div>
                  `;
                ]]]
              couverture: |
                [[[
                  const pv = parseFloat(
                    states['sensor.homefoxcat_load_solaire']?.state || 0
                  );

                  const maison = parseFloat(
                    states['sensor.consommation_reelle_maison']?.state || 0
                  );

                  const couverture = maison > 0
                    ? Math.min((pv / maison) * 100,100)
                    : 0;

                  return `
                    <div style="
                      width:100%;
                      box-sizing:border-box;
                      padding:18px 16px;
                      border-radius:22px;
                      background:rgba(255,255,255,.035);
                      border:1px solid rgba(255,255,255,.07);
                    ">

                      <div style="
                        display:flex;
                        justify-content:space-between;
                        font-size:14px;
                        margin-bottom:10px;
                      ">
                        <span>⚡ Couverture énergétique</span>
                        <b>${Math.round(couverture)}%</b>
                      </div>

                      <div style="
                        height:14px;
                        border-radius:30px;
                        overflow:hidden;
                        background:rgba(255,255,255,.07);
                      ">
                        <div style="
                          width:${couverture}%;
                          height:100%;
                          border-radius:30px;
                          background:linear-gradient(
                            90deg,
                            #ef4444,
                            #f59e0b,
                            #10b981
                          );
                        "></div>
                      </div>

                      <div style="
                        text-align:center;
                        margin-top:10px;
                        font-size:12px;
                        opacity:.5;
                      ">
                        ${Math.round(pv)} W photovoltaïque
                        pour ${Math.round(maison)} W consommés
                      </div>

                    </div>
                  `;
                ]]]
            styles:
              grid:
                - grid-template-areas: |
                    "greeting greeting"
                    "datetime datetime"
                    "tarif tarif"
                    "prix next_price"
                    "energy_flow energy_flow"
                    "power power"
                    "gauge gauge"
                    "pri pri"
                    "machines machines"
                    "couverture couverture"
                - grid-template-columns: minmax(0,1fr) minmax(0,1fr)
