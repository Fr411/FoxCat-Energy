              inverter_power: |
                [[[
                  /*
                   * IMPORTANT :
                   * Remplace l'entité ci-dessous par ton capteur
                   * réel de puissance de l'onduleur si nécessaire.
                   */
                  const power = parseFloat(
                    states['sensor.homefoxcat_total_production_active_power']?.state || 0
                  );

                  /*
                   * Plage :
                   * -50 W → 4000 W
                   */
                  const min = -50;
                  const max = 4000;

                  const clamped = Math.max(min, Math.min(power, max));

                  const percent =
                    ((clamped - min) / (max - min)) * 100;

                  return `
                    <div style="
                      width:100%;
                      box-sizing:border-box;
                      padding:18px 4px 8px;
                    ">

                      <div style="
                        display:flex;
                        justify-content:space-between;
                        align-items:flex-end;
                        margin-bottom:10px;
                      ">

                        <div>
                          <div style="
                            font-size:11px;
                            font-weight:700;
                            letter-spacing:.1em;
                            opacity:.45;
                          ">
                            PUISSANCE ONDULEUR
                          </div>

                          <div style="
                            margin-top:3px;
                            font-size:34px;
                            line-height:1;
                            font-weight:900;
