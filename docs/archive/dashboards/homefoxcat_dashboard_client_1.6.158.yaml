                            font-size:10px;
                            opacity:.45;
                          ">
                            RÉDUCTION DE PUISSANCE
                          </div>
                        </div>

                        <div style="
                          padding:8px 13px;
                          border-radius:12px;
                          background:rgba(139,92,246,.15);
                          color:#c4b5fd;
                          font-size:13px;
                          font-weight:800;
