                  navigation_path: |-
                    [[[
                      const base = window.location.pathname.replace(/\/[^\/]*$/, '');
                      return `${base}/technique`;
                    ]]]
                styles:
                  card:
                    - 'height: 132px'
                    - 'border-radius: 24px'
