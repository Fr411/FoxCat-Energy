                          ">
                            ${Math.round(power)}
                            <span style="
                              font-size:15px;
                              opacity:.5;
                            ">
                              W
                            </span>
                          </div>
                        </div>

                        <div style="
                          font-size:12px;
                          font-weight:700;
                          opacity:.45;
                        ">
                          ${Math.round(percent)} %
                        </div>

                      </div>

                      <div style="
                        position:relative;
                        width:100%;
                        height:18px;
                        border-radius:20px;
                        overflow:hidden;
                        background:rgba(255,255,255,.07);
                      ">

                        <div style="
                          width:${percent}%;
                          height:100%;
                          border-radius:20px;
                          background:linear-gradient(
                            90deg,
                            #60a5fa 0%,
                            #8b5cf6 45%,
                            #a78bfa 70%,
                            #c4b5fd 100%
                          );
                          box-shadow:
                            0 0 12px rgba(139,92,246,.45);
                          transition:width .4s ease;
                        "></div>

                        <div style="
                          position:absolute;
                          left:calc(${percent}% - 5px);
                          top:-4px;
                          width:10px;
                          height:26px;
                          border-radius:8px;
                          background:white;
                          box-shadow:
                            0 0 8px white,
                            0 0 15px rgba(255,255,255,.8);
                        "></div>

                      </div>

                      <div style="
                        display:flex;
                        justify-content:space-between;
                        margin-top:7px;
                        font-size:9px;
                        font-weight:600;
                        opacity:.4;
                      ">
                        <span>-50 W</span>
                        <span>1000 W</span>
                        <span>2000 W</span>
                        <span>3000 W</span>
                        <span>4000 W</span>
                      </div>

                    </div>
                  `;
                ]]]
              active_level: |
                [[[
                  const levels = [
                    ['switch.l1_pri','Niveau 1',1000],
                    ['switch.l2_pri','Niveau 2',2000],
                    ['switch.l3_pri','Niveau 3',3000],
                    ['switch.l4_pri','Niveau 4',4000]
                  ];

                  let active = null;

                  for (const level of levels) {
                    if (states[level[0]]?.state === 'on') {
                      active = level;
                    }
                  }

                  if (!active) {
                    return `
                      <div style="
                        width:100%;
                        box-sizing:border-box;
                        padding:13px;
                        border-radius:16px;
                        text-align:center;
                        background:rgba(255,255,255,.035);
                        border:1px solid rgba(255,255,255,.07);
                        font-size:12px;
                        font-weight:700;
                        opacity:.5;
                      ">
                        ⚪ Aucun niveau actif
                      </div>
                    `;
                  }

                  return `
                    <div style="
                      width:100%;
                      box-sizing:border-box;
                      padding:14px;
                      border-radius:17px;
                      text-align:center;
                      background:rgba(139,92,246,.10);
                      border:1px solid rgba(139,92,246,.25);
                    ">

                      <div style="
                        font-size:10px;
                        font-weight:700;
                        letter-spacing:.1em;
                        opacity:.45;
                      ">
                        NIVEAU ACTUEL
                      </div>

                      <div style="
                        margin-top:4px;
                        font-size:21px;
                        font-weight:900;
                        color:#c4b5fd;
                      ">
                        ${active[1]}
                      </div>

                      <div style="
                        margin-top:3px;
                        font-size:12px;
                        font-weight:700;
                        opacity:.6;
                      ">
                        Puissance ${active[2]} W
                      </div>

                    </div>
                  `;
                ]]]
              levels: |
                [[[
                  const levels = [
                    {
                      entity:'switch.l1_pri',
                      name:'Niveau 1',
                      power:1000
                    },
                    {
                      entity:'switch.l2_pri',
                      name:'Niveau 2',
                      power:2000
                    },
                    {
                      entity:'switch.l3_pri',
                      name:'Niveau 3',
                      power:3000
                    },
                    {
                      entity:'switch.l4_pri',
                      name:'Niveau 4',
                      power:4000
                    }
                  ];

                  return `
                    <div style="
                      width:100%;
                      box-sizing:border-box;
                      display:grid;
                      grid-template-columns:
                        repeat(2,minmax(0,1fr));
                      gap:10px;
                    ">

                      ${levels.map(level => {

                        const active =
                          states[level.entity]?.state === 'on';

                        return `
                          <div
                            data-entity="${level.entity}"
                            style="
                              width:100%;
                              min-width:0;
                              box-sizing:border-box;
                              padding:17px 8px;
                              border-radius:20px;
                              text-align:center;
                              cursor:pointer;

                              background:${active
                                ? 'linear-gradient(145deg,rgba(139,92,246,.28),rgba(96,165,250,.13))'
                                : 'rgba(255,255,255,.035)'};

                              border:1px solid ${active
                                ? 'rgba(167,139,250,.65)'
                                : 'rgba(255,255,255,.07)'};

                              box-shadow:${active
                                ? '0 0 25px rgba(139,92,246,.18), inset 0 1px 0 rgba(255,255,255,.08)'
                                : 'none'};

                              transition:all .25s ease;
                            "
                          >

                            <div style="
                              font-size:12px;
                              font-weight:900;
                              color:${active
                                ? '#c4b5fd'
                                : 'rgba(255,255,255,.55)'};
                            ">
                              ${level.name}
                            </div>

                            <div style="
                              margin-top:8px;
                              font-size:30px;
                              line-height:1;
                              font-weight:900;
                              color:${active
                                ? '#ffffff'
                                : 'rgba(255,255,255,.8)'};
                            ">
                              ${level.power}
                              <span style="
                                font-size:12px;
                                opacity:.45;
                              ">
                                W
                              </span>
                            </div>

                            <div style="
                              margin-top:8px;
                              font-size:9px;
                              font-weight:800;
                              color:${active
                                ? '#a78bfa'
                                : 'rgba(255,255,255,.3)'};
                            ">
                              ${active
                                ? '● NIVEAU ACTIF'
                                : 'NIVEAU DISPONIBLE'}
                            </div>

                          </div>
                        `;

                      }).join('')}

                    </div>
                  `;
                ]]]
            styles:
              grid:
                - grid-template-areas: |
                    "header"
                    "inverter_power"
                    "active_level"
                    "levels"
                - row-gap:14px
              card:
                - width:100%
                - max-width:100%
                - box-sizing:border-box
                - overflow:hidden
                - border-radius:30px
                - padding:24px
                - color:white
                - background: |
                    radial-gradient(
                      circle at 100% 0%,
                      rgba(139,92,246,.16),
                      transparent 38%
                    ),
                    radial-gradient(
                      circle at 0% 100%,
                      rgba(59,130,246,.08),
                      transparent 38%
                    ),
                    linear-gradient(
                      145deg,
                      #070b14,
                      #101827 55%,
                      #080d16
                    )
                - box-shadow: |
                    inset 0 1px 0 rgba(255,255,255,.07),
                    0 20px 60px rgba(0,0,0,.4)
              custom_fields:
                header:
                  - grid-area:header
                  - width:100%
                inverter_power:
                  - grid-area:inverter_power
                  - width:100%
                active_level:
                  - grid-area:active_level
                  - width:100%
                levels:
                  - grid-area:levels
                  - width:100%
            tap_action:
              action: none
            extra_styles: |
              [[[
                const card = this;

                const levels = [
                  'switch.l1_pri',
                  'switch.l2_pri',
                  'switch.l3_pri',
                  'switch.l4_pri'
                ];

                const fields =
                  card.shadowRoot?.querySelectorAll(
                    '[data-entity]'
                  );

                if (fields) {

                  fields.forEach(el => {

                    el.addEventListener('click', async () => {

                      const entity =
                        el.dataset.entity;

                      if (!entity) return;

                      /*
                       * Un seul niveau actif à la fois.
                       */

                      for (const level of levels) {

                        if (level === entity) {

                          await hass.callService(
                            'switch',
                            'turn_on',
                            {
                              entity_id: level
                            }
                          );

                        } else {

                          await hass.callService(
                            'switch',
                            'turn_off',
                            {
                              entity_id: level
                            }
                          );

                        }

                      }

                    });

                  });

                }

              ]]]
    subview: true
    cards: []
  - type: sections
    max_columns: 4
    icon: mdi:water-boiler
    path: boiler
    sections:
      - type: grid
        cards:
          - type: custom:button-card
            show_name: false
            show_state: false
            show_icon: false
            tap_action:
              action: none
            hold_action:
              action: none
            double_tap_action:
              action: none
            custom_fields:
              greeting: |
                [[[
                  const hour = new Date().getHours();

                  if (hour < 6) return "🌙 Bonne nuit";
                  if (hour < 12) return "☀️ Bonjour";
                  if (hour < 18) return "👋 Bon après-midi";

                  return "🌙 Bonsoir ";
                ]]]
              datetime: |
                [[[
                  return new Date().toLocaleString('fr-BE',{
                    weekday:'long',
                    day:'numeric',
                    month:'long',
                    year:'numeric',
                    hour:'2-digit',
                    minute:'2-digit'
                  });
                ]]]
              title: |
                [[[
                  return "🔥 EMS BOILER";
                ]]]
              mode_select: |
                [[[
                  let current = states['input_select.ems_mode']?.state || '-';
                  let options = states['input_select.ems_mode']?.attributes?.options || [];

                  let pills = options.map(o => {
                    let active = o === current;
                    let safe = o.replace(/'/g, "\\'");
                    return `
                    <div
                      onclick="
                        event.stopPropagation();
                        document.querySelector('home-assistant').hass.callService(
                          'input_select','select_option',
                          { entity_id:'input_select.ems_mode', option:'${safe}' }
                        );
                      "
                      style="
                        padding:10px 16px;
                        border-radius:14px;
                        font-size:14px;
                        font-weight:600;
                        text-align:center;
                        cursor:pointer;
                        background:${active ? '#00c8ff' : '#1c1c1c'};
                        color:${active ? '#000' : '#ccc'};
                        border:1px solid ${active ? '#00c8ff' : 'rgba(255,255,255,0.15)'};
                      "
                    >${o}</div>
                    `;
                  }).join('');

                  return `
                  <div style="width:100%;">
                    <div style="
                      color:#4CAF50;
                      font-weight:700;
                      font-size:16px;
                      margin-bottom:10px;
                    ">
                      Mode actuel : <span style="color:white;">${current}</span>
                    </div>
                    <div style="
                      display:flex;
                      flex-wrap:wrap;
                      gap:8px;
                    ">
                      ${pills}
                    </div>
                  </div>
                  `;
                ]]]
              tarif: |
                [[[
                  let hour = new Date().getHours();

                  if ((hour >= 7 && hour < 11) || (hour >= 17 && hour < 22))
                    return "🟠 Heures Pleines";

                  return "🟢 Heures Creuses";
                ]]]
              boiler_status: |
                [[[
                  let climate = states['climate.buanderie_boiler_chauffe_eau'];
                  let hvac = climate?.state || 'off';
                  let setpoint = parseFloat(climate?.attributes?.temperature || 0);
                  let sonde_temp = parseFloat(
                    states['sensor.garage_boiler_sonde_temperature_temperature']?.state || 0
                  );
                  let seuil = 45;

                  let label, color, icon;

                  if (hvac === 'off') {
                    label = 'OFF';
                    icon = '⏹️';
                    color = '#555555';
                  } else if (setpoint === 65) {
                    label = 'BOOST 65°C';
                    icon = '🔥';
                    color = '#e74c3c';
                  } else {
                    label = 'NORMAL ' + (setpoint || 45) + '°C';
                    icon = '🌙';
                    color = '#2ecc71';
                  }

                  let percent = Math.min((sonde_temp / 70) * 100, 100);
                  let seuil_percent = (seuil / 70) * 100;
                  let atteint = sonde_temp >= seuil;

                  return `
                  <div style="width:100%;">

                    <div style="
                      display:flex;
                      align-items:center;
                      justify-content:center;
                      gap:12px;
                      padding:16px;
                      border-radius:20px;
                      background:${color}22;
                      border:1px solid ${color}66;
                      margin-bottom:16px;
                    ">
                      <span style="font-size:28px;">${icon}</span>
                      <span style="font-size:24px;font-weight:bold;color:${color};">
                        Boiler ${label}
                      </span>
                    </div>

                    <div style="
                      display:flex;
                      justify-content:space-between;
                      margin-bottom:8px;
                      font-size:16px;
                    ">
                      <span>🌡️ Sonde boiler</span>
                      <span><b>${sonde_temp.toFixed(1)} °C</b></span>
                    </div>

                    <div style="
                      position:relative;
                      width:100%;
                      height:22px;
                      border-radius:30px;
                      overflow:hidden;
                      background:
                      linear-gradient(
                        90deg,
                        #3498db 0%,
                        #2ecc71 60%,
                        #e74c3c 100%
                      );
                    ">
                      <div style="
                        position:absolute;
                        left:${seuil_percent}%;
                        top:0;
                        width:2px;
                        height:100%;
                        background:white;
                        opacity:0.6;
                      "></div>

                      <div style="
                        position:absolute;
                        left:calc(${percent}% - 10px);
                        top:-4px;
                        width:20px;
                        height:30px;
                        border-radius:10px;
                        background:white;
                        box-shadow:
                          0 0 8px white,
                          0 0 15px white,
                          0 0 25px rgba(255,255,255,0.9);
                      "></div>
                    </div>

                    <div style="
                      text-align:center;
                      margin-top:8px;
                      font-size:14px;
                      opacity:0.85;
                    ">
                      Seuil "cuve chaude" : ${seuil}°C
                      ${atteint ? '✅ atteint' : '❌ pas encore atteint'}
                    </div>

                  </div>
                  `;
                ]]]
              surplus_boost: |
                [[[
                  let pv = parseFloat(states['sensor.homefoxcat_load_solaire']?.state || 0);
                  let besoin_maison = parseFloat(states['sensor.consommation_reelle_maison']?.state || 0);
                  let surplus_pv = pv - besoin_maison;

                  let hour = new Date().getHours();
                  let heure_pleine = (hour >= 7 && hour < 11) || (hour >= 17 && hour < 22);

                  let ems_mode = states['input_select.ems_mode']?.state || '-';

                  let seuil_boiler_hp = 1000;
                  let boost_autorise, seuil_texte;

                  if (ems_mode === 'ECS solaire') {
                    boost_autorise = surplus_pv >= seuil_boiler_hp;
                    seuil_texte = `≥ ${seuil_boiler_hp}W (mode ECS solaire)`;
                  } else if (ems_mode === 'Réinjection refusée') {
                    boost_autorise = surplus_pv >= 500;
                    seuil_texte = `≥ 500W (mode Réinjection refusée)`;
                  } else {
                    boost_autorise = heure_pleine && surplus_pv >= seuil_boiler_hp;
                    seuil_texte = heure_pleine
                      ? `≥ ${seuil_boiler_hp}W en heure pleine`
                      : `heure creuse — boost impossible`;
                  }

                  let color = boost_autorise ? '#2ecc71' : '#e74c3c';
                  let icon = boost_autorise ? '✅' : '❌';

                  return `
                  <div style="
                    width:100%;
                    padding:14px;
                    border-radius:16px;
                    background:${color}18;
                    border:1px solid ${color}55;
                  ">
                    <div style="
                      display:flex;
                      justify-content:space-between;
                      font-size:16px;
                      margin-bottom:6px;
                    ">
                      <span>☀️ Surplus solaire réel</span>
                      <span><b>${Math.round(surplus_pv)} W</b></span>
                    </div>
                    <div style="font-size:14px;opacity:0.85;">
                      PV ${Math.round(pv)}W − Maison ${Math.round(besoin_maison)}W
                    </div>
                    <div style="
                      margin-top:8px;
                      font-size:15px;
                      font-weight:600;
                      color:${color};
                    ">
                      ${icon} Boost autorisé : ${seuil_texte}
                    </div>
                  </div>
                  `;
                ]]]
              cuve_states: |
                [[[
                  let now = Date.now() / 1000;

                  let sonde_temp = parseFloat(
                    states['sensor.garage_boiler_sonde_temperature_temperature']?.state || 0
                  );
                  let boiler_puissance = parseFloat(states['sensor.boiler_puissance']?.state || 0);

                  let climate = states['climate.buanderie_boiler_chauffe_eau'];
                  let hvac = climate?.state || 'off';
                  let setpoint = parseFloat(climate?.attributes?.temperature || 0);
                  let boiler_on = setpoint === 65;

                  let power_lc = states['sensor.boiler_puissance']?.last_changed;
                  let puissance_nulle_depuis = power_lc ? (now - new Date(power_lc).getTime() / 1000) : 0;

                  let climate_lc = climate?.last_changed;
                  let depuis_activation_chauffe = climate_lc ? (now - new Date(climate_lc).getTime() / 1000) : 0;

                  let seuil_temp_chaud = 45;
                  let tolerance = 5;

                  let cuve_chaude = boiler_on && sonde_temp >= seuil_temp_chaud &&
                    boiler_puissance <= tolerance &&
                    puissance_nulle_depuis >= 120 && depuis_activation_chauffe >= 120;

                  let cuve_satisfaite_normal = !boiler_on && hvac !== 'off' &&
                    boiler_puissance <= tolerance &&
                    puissance_nulle_depuis >= 60 && depuis_activation_chauffe >= 60;

                  function badge(active, relevant, text) {
                    let color = active ? '#2ecc71' : (relevant ? '#f1c40f' : '#555555');
                    let icon = active ? '✅' : (relevant ? '⏳' : '⚪');
                    let opacity = relevant ? 1 : 0.4;
                    return `
                    <div style="
                      flex:1;
                      padding:12px;
                      border-radius:14px;
                      background:${color}18;
                      border:1px solid ${color}55;
                      opacity:${opacity};
                      text-align:center;
                    ">
                      <div style="font-size:22px;">${icon}</div>
                      <div style="font-size:13px;margin-top:4px;">${text}</div>
                    </div>
                    `;
                  }

                  return `
                  <div style="width:100%;">
                    <div style="font-size:15px;margin-bottom:8px;">
                      🧯 Détection de saturation
                    </div>
                    <div style="display:flex;gap:10px;">
                      ${badge(cuve_chaude, boiler_on, 'Cuve chaude<br>(arrêt saturation)')}
                      ${badge(cuve_satisfaite_normal, !boiler_on && hvac !== 'off', 'Cuve satisfaite<br>(arrêt normal)')}
                    </div>
                  </div>
                  `;
                ]]]
              pri_stage: |
                [[[
                  function on(id) { return states[id]?.state === 'on'; }

                  let pv = parseFloat(states['sensor.homefoxcat_load_solaire']?.state || 0);
                  let besoin_maison = parseFloat(states['sensor.consommation_reelle_maison']?.state || 0);
                  let reinjection = parseFloat(states['sensor.retourne_au_reseau']?.state || 0);
                  let ems_mode = states['input_select.ems_mode']?.state || '-';

                  let stage_pri = on('switch.l1_pri') ? 25
                    : on('switch.l2_pri') ? 50
                    : on('switch.l3_pri') ? 75
                    : on('switch.l4_pri') ? 100
                    : 100;

                  let besoin_total = ems_mode === 'Réinjection refusée'
                    ? besoin_maison + reinjection
                    : besoin_maison;

                  let pv_fin = 200;
                  let target_pri;

                  if (['Réinjection autorisée', 'ECS solaire'].includes(ems_mode)) {
                    target_pri = 100;
                  } else if (pv < pv_fin) {
                    target_pri = 100;
                  } else if (stage_pri === 25) {
                    target_pri = besoin_total >= 1500 ? 50 : 25;
                  } else if (stage_pri === 50) {
                    target_pri = besoin_total >= 2500 ? 75 : (besoin_total < 1000 ? 25 : 50);
                  } else if (stage_pri === 75) {
                    target_pri = besoin_total >= 3500 ? 100 : (besoin_total < 2000 ? 50 : 75);
                  } else {
                    target_pri = besoin_total < 3000 ? 75 : 100;
                  }

                  let stages = [25, 50, 75, 100];
                  let cols = stages.map(s => {
                    let isCurrent = s === stage_pri;
                    let isTarget = s === target_pri;
                    let bg = isCurrent ? '#00c8ff' : '#333';
                    let border = isTarget ? '2px solid white' : '2px solid transparent';
                    return `
                    <div style="
                      flex:1;
                      text-align:center;
                      padding:10px 4px;
                      border-radius:10px;
                      background:${bg};
                      border:${border};
                      font-size:13px;
                      font-weight:${isCurrent ? 'bold' : 'normal'};
                      color:${isCurrent ? '#000' : '#ccc'};
                    ">
                      ${s}%
                    </div>
                    `;
                  }).join('');

                  return `
                  <div style="width:100%;">
                    <div style="font-size:15px;margin-bottom:8px;">
                      🔌 Étage PRI (routeur solaire)
                    </div>
                    <div style="display:flex;gap:6px;">
                      ${cols}
                    </div>
                    <div style="text-align:center;margin-top:8px;font-size:13px;opacity:0.8;">
                      Actuel : ${stage_pri}% — Cible : ${target_pri}%
                      ${stage_pri !== target_pri ? '🔄 transition en cours' : '✅ stable'}
                    </div>
                  </div>
                  `;
                ]]]
            styles:
              grid:
                - grid-template-areas: |
                    "greeting greeting"
                    "datetime datetime"

                    "title title"

                    "mode_select mode_select"

                    "tarif tarif"

                    "boiler_status boiler_status"

                    "surplus_boost surplus_boost"

                    "cuve_states cuve_states"

                    "pri_stage pri_stage"
                - row-gap: 18px
              card:
                - border-radius: 30px
                - padding: 35px
                - color: white
                - min-height: 700px
                - background: |
                    linear-gradient(
                      135deg,
                      rgba(15,15,15,0.98),
                      rgba(40,40,40,0.92)
                    )
                - box-shadow: |
                    0 0 225px rgba(255,200,0,0.12)
              custom_fields:
                greeting:
                  - justify-self: start
                  - font-size: 34px
                  - font-weight: bold
                datetime:
                  - justify-self: start
                  - font-size: 18px
                  - opacity: 0.5
                title:
                  - justify-self: start
                  - font-size: 34px
                  - font-weight: bold
                  - margin-top: 10px
                mode_select:
                  - justify-self: stretch
                  - width: 100%
                tarif:
                  - justify-self: start
                  - font-size: 18px
                  - font-weight: 600
                boiler_status:
                  - justify-self: stretch
                  - width: 100%
                surplus_boost:
                  - justify-self: stretch
                  - width: 100%
                cuve_states:
                  - justify-self: stretch
                  - width: 100%
                pri_stage:
                  - justify-self: stretch
                  - width: 100%
      - type: grid
        cards:
          - type: vertical-stack
            cards:
              - type: entities
                title: 🌡️ État du Boiler
                state_color: true
                entities:
                  - entity: switch.boiler_prise_1
                    name: Relais d'alimentation
                    icon: mdi:power-plug
                  - entity: sensor.boiler_puissance
                    name: Puissance instantanée
