      - type: grid
        cards:
          - type: custom:button-card
            show_name: false
            show_state: false
            show_icon: false
            custom_fields:
              header: |
                [[[
                  return `
                    <div class="bilan-header">
                      <div class="bilan-title">
                        ⚡ BILAN ÉNERGÉTIQUE
                      </div>

                      <div class="bilan-subtitle">
                        AUJOURD'HUI · HOMEFOXCAT ENERGY
                      </div>
                    </div>
                  `;
                ]]]
              energy: |
                [[[
                  const consumption = parseFloat(
                    states['sensor.homefoxcat_total_consumption_today']?.state || 0
                  );

                  const production = parseFloat(
                    states['sensor.homefoxcat_total_production_today']?.state || 0
                  );

                  const injection = parseFloat(
                    states['sensor.reinjection_jour']?.state || 0
                  );

                  const grid = parseFloat(
                    states['sensor.consommation_reseau_jour']?.state || 0
                  );

                  const selfConsumed =
                    Math.max(production - injection, 0);

                  const autoConsumption =
                    production > 0
                      ? Math.min((selfConsumed / production) * 100, 100)
                      : 0;

                  const autonomy =
                    consumption > 0
                      ? Math.min((selfConsumed / consumption) * 100, 100)
                      : 0;

                  return `
                    <div class="energy-box">

                      <div class="section-label">
                        ÉNERGIE
                      </div>

                      <div class="energy-grid">

                        <div class="metric solar">
                          <span>☀️</span>
                          <b>${production.toFixed(2)}</b>
                          <small>kWh</small>
                          <label>Production PV</label>
                        </div>

                        <div class="metric house">
                          <span>🏠</span>
                          <b>${consumption.toFixed(2)}</b>
                          <small>kWh</small>
                          <label>Consommation</label>
                        </div>

                        <div class="metric grid">
                          <span>⚡</span>
                          <b>${grid.toFixed(2)}</b>
                          <small>kWh</small>
                          <label>Acheté réseau</label>
                        </div>

                        <div class="metric export">
                          <span>↗️</span>
                          <b>${injection.toFixed(2)}</b>
                          <small>kWh</small>
                          <label>Réinjecté</label>
                        </div>

                      </div>

                      <div class="solar-use">

                        <div>
                          <span>☀️ Solaire autoconsommé</span>
                          <b>${selfConsumed.toFixed(2)} kWh</b>
                        </div>

                        <div>
                          <span>Autoconsommation PV</span>
                          <b>${autoConsumption.toFixed(0)} %</b>
                        </div>

                        <div>
                          <span>Autonomie maison</span>
                          <b>${autonomy.toFixed(0)} %</b>
                        </div>

                      </div>

                    </div>
                  `;
                ]]]
              money: |
                [[[
                  const gridCost = parseFloat(
                    states['sensor.cout_reseau_jour']?.state || 0
                  );

                  const solarSaving = parseFloat(
                    states['sensor.economie_solaire_jour']?.state || 0
                  );

                  const exportRevenue = parseFloat(
                    states['sensor.revenu_reinjection_jour']?.state || 0
                  );

                  const solarValue =
                    solarSaving + exportRevenue;

                  const netGridCost =
                    gridCost - exportRevenue;

                  return `
                    <div class="money-box">

                      <div class="section-label">
                        BILAN FINANCIER RÉEL
                      </div>

                      <div class="main-money">

                        <div class="main-money-label">
                          COÛT NET ÉLECTRICITÉ
                        </div>

                        <div class="main-money-value">
                          ${netGridCost.toFixed(2)}
                          <span>€</span>
                        </div>

                        <div class="main-money-note">
                          achat réseau − revenu de réinjection
                        </div>

                      </div>

                      <div class="money-grid">

                        <div class="money-card cost">
                          <div class="money-icon">🏠</div>

                          <div class="money-label">
                            COÛT RÉSEAU
                          </div>

                          <div class="money-value">
                            ${gridCost.toFixed(2)} €
                          </div>

                          <div class="money-note">
                            réellement acheté
                          </div>
                        </div>

                        <div class="money-card saving">
                          <div class="money-icon">☀️</div>

                          <div class="money-label">
                            ÉCONOMIE SOLAIRE
                          </div>

                          <div class="money-value">
                            +${solarSaving.toFixed(2)} €
                          </div>

                          <div class="money-note">
                            achat réseau évité
                          </div>
                        </div>

                        <div class="money-card export">
                          <div class="money-icon">↗️</div>

                          <div class="money-label">
                            RÉINJECTION
                          </div>

                          <div class="money-value">
                            +${exportRevenue.toFixed(2)} €
                          </div>

                          <div class="money-note">
                            revenu injection
                          </div>
                        </div>

                        <div class="money-card total">
                          <div class="money-icon">💶</div>

                          <div class="money-label">
                            VALEUR DU SOLAIRE
                          </div>

                          <div class="money-value">
                            +${solarValue.toFixed(2)} €
                          </div>

                          <div class="money-note">
                            autoconsommation + injection
                          </div>
                        </div>

                      </div>

                    </div>
                  `;
                ]]]
              prices: |
                [[[
                  const buy = parseFloat(
                    Object.values(states).find(e => (e.attributes?.friendly_name || '').toLowerCase().includes("prix d'achat actif"))?.state || 0
                  );

                  const inject = parseFloat(
                    Object.values(states).find(e => (e.attributes?.friendly_name || '').toLowerCase().includes("valeur économique de la réinjection"))?.state || 0
                  );

                  return `
                    <div class="prices">

                      <div>
                        <span>💰 Achat actuel</span>
                        <b>${buy.toFixed(3)} €/kWh</b>
                      </div>

                      <div>
                        <span>↗️ Injection actuelle</span>
                        <b>${inject.toFixed(3)} €/kWh</b>
                      </div>

                    </div>
                  `;
                ]]]
