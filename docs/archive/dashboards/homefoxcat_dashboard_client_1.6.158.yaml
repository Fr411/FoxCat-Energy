              }

              .price-down {
                margin-left: 5px;
                color: #34d399;
              }

              .price-up {
                margin-left: 5px;
                color: #fb7185;
              }

              .price-stable {
                margin-left: 5px;
                color: #facc15;
              }


              /* TARIFF */

              .tariff-card {
                display: flex;
