              /* APPLIANCES */

              .appliances-box {
                padding: 15px;

                border-radius: 20px;

                background:
                  rgba(255,255,255,.035);

                border:
                  1px solid rgba(255,255,255,.06);
              }

              .section-title {
                margin-bottom: 10px;

