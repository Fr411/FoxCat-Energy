  - type: sections
    max_columns: 4
    title: Coûts
    path: couts
    icon: mdi:currency-eur
    subview: true
    show_icon_and_title: false
    sections:
      - type: grid
        cards:
          - type: custom:button-card
            show_name: false
            show_state: false
            show_icon: false
            custom_fields:
              header: |
                [[[
                  return `
                    <div class="cost-header">

                      <div class="cost-brand">
                        <div class="cost-icon">💶</div>

                        <div>
                          <div class="cost-title">
                            ENERGY COST
                          </div>

                          <div class="cost-subtitle">
                            HOMEFOXC​AR ENERGY · REAL TIME
                          </div>
                        </div>
                      </div>

                      <div class="live">
                        <span class="live-dot"></span>
                        LIVE
                      </div>

                    </div>
                  `;
                ]]]
              current_price: |
                [[[
                  const price = parseFloat(
                    Object.values(states).find(e => (e.attributes?.friendly_name || '').toLowerCase().includes("prix d'achat actif"))?.state || 0
                  );

                  const nextPrice = parseFloat(
                    Object.values(states).find(e => (e.attributes?.friendly_name || '').toLowerCase().includes("prix d'achat suivant"))?.state || 0
                  );

                  let level = 'NORMAL';
                  let levelClass = 'normal';

                  if (price < 0.15) {
                    level = 'TRÈS BON';
                    levelClass = 'cheap';
                  }
                  else if (price < 0.25) {
                    level = 'BON';
                    levelClass = 'good';
                  }
                  else if (price > 0.40) {
                    level = 'ÉLEVÉ';
                    levelClass = 'expensive';
                  }

                  const difference = nextPrice - price;

                  let evolution = '';

                  if (difference < -0.001) {
                    evolution = `
                      <span class="price-down">
                        ↓ ${Math.abs(difference).toFixed(3)} €/kWh
                      </span>
                    `;
                  }
                  else if (difference > 0.001) {
                    evolution = `
                      <span class="price-up">
                        ↑ ${difference.toFixed(3)} €/kWh
                      </span>
                    `;
                  }
                  else {
                    evolution = `
                      <span class="price-stable">
                        → STABLE
                      </span>
                    `;
                  }

                  return `
                    <div class="price-main">

                      <div class="price-label">
                        PRIX ÉLECTRICITÉ ACTUEL
                      </div>

                      <div class="price-number">
                        ${price.toFixed(3)}
                        <span>€/kWh</span>
                      </div>

                      <div class="price-status ${levelClass}">
                        ${level}
                      </div>

                      <div class="price-next">
                        Prochaine heure :
                        <b>${nextPrice.toFixed(3)} €/kWh</b>
                        ${evolution}
                      </div>

                    </div>
                  `;
                ]]]
              tariff: |
                [[[
                  const tariffHour = new Date().getHours();

                  const hp =
                    (tariffHour >= 7 && tariffHour < 11) ||
                    (tariffHour >= 17 && tariffHour < 22);

                  const tariffName = hp
                    ? 'HEURES PLEINES'
                    : 'HEURES CREUSES';

                  const tariffIcon = hp
                    ? '🟠'
                    : '🟢';

                  const tariffColor = hp
                    ? '#f59e0b'
                    : '#10b981';

                  return `
                    <div class="tariff-card"
                         style="border-color:${tariffColor}44;">

                      <div class="tariff-icon"
                           style="background:${tariffColor}18;">
                        ${tariffIcon}
                      </div>

                      <div>

                        <div class="small-label">
                          TARIF ACTUEL
                        </div>

                        <div class="tariff-name"
                             style="color:${tariffColor};">
                          ${tariffName}
                        </div>

                        <div class="tariff-hours">
                          HP : 07–11 / 17–22
                          · HC : 11–17 / 22–07
                        </div>

                      </div>

                    </div>
                  `;
                ]]]
              house_cost: |
                [[[
                  const housePower = parseFloat(
                    states[
                      'sensor.consommation_reelle_maison'
                    ]?.state || 0
                  );

                  const price = parseFloat(
                    Object.values(states).find(e => (e.attributes?.friendly_name || '').toLowerCase().includes("prix d'achat actif"))?.state || 0
                  );

                  const costHour =
                    (housePower / 1000) * price;

                  const costMinute =
                    costHour / 60;

                  return `
                    <div class="cost-card house">

                      <div class="cost-card-top">

                        <div class="cost-card-icon">
                          🏠
                        </div>

                        <div>
                          <div class="small-label">
                            MAISON
                          </div>

                          <div class="cost-card-title">
                            COÛT ÉNERGÉTIQUE
                          </div>
                        </div>

                      </div>

                      <div class="cost-big">
                        ${costHour.toFixed(3)}
                        <span>€/h</span>
                      </div>

                      <div class="cost-detail">
                        ${Math.round(housePower)} W
                        · ${costMinute.toFixed(4)} €/min
                      </div>

                    </div>
                  `;
                ]]]
              boiler_cost: |
                [[[
                  const boilerPower = parseFloat(
                    states[
                      'sensor.boiler_puissance'
                    ]?.state || 0
                  );

                  const boilerTemp = parseFloat(
                    states[
                      'sensor.garage_boiler_sonde_temperature_temperature'
                    ]?.state || 0
                  );

                  const price = parseFloat(
                    Object.values(states).find(e => (e.attributes?.friendly_name || '').toLowerCase().includes("prix d'achat actif"))?.state || 0
                  );

                  const boilerCostHour =
                    (boilerPower / 1000) * price;

                  const boilerRunning =
                    boilerPower > 50;

                  return `
                    <div class="
                      cost-card
                      boiler
                      ${boilerRunning ? 'running' : ''}
                    ">

                      <div class="cost-card-top">

                        <div class="cost-card-icon">
                          ♨️
                        </div>

                        <div>
                          <div class="small-label">
                            ECS
                          </div>

                          <div class="cost-card-title">
                            BOILER
                          </div>
                        </div>

                        <div class="boiler-status">
                          ${boilerRunning ? '● RUN' : '● OFF'}
                        </div>

                      </div>

                      <div class="boiler-data">

                        <div>
                          <span>
                            🌡️
                          </span>

                          <b>
                            ${boilerTemp.toFixed(1)}°C
                          </b>
                        </div>

                        <div>
                          <span>
                            ⚡
                          </span>

                          <b>
                            ${Math.round(boilerPower)} W
                          </b>
                        </div>

                      </div>

                      <div class="cost-big">
                        ${boilerCostHour.toFixed(3)}
                        <span>€/h</span>
                      </div>

                      <div class="cost-detail">
                        coût si fonctionnement continu
                      </div>

                    </div>
                  `;
                ]]]
              appliances: |
                [[[
                  const currentPrice = parseFloat(
                    Object.values(states).find(e => (e.attributes?.friendly_name || '').toLowerCase().includes("prix d'achat actif"))?.state || 0
                  );

                  const appliances = [

                    {
                      name: 'Lave-linge',
                      icon: '🧺',
                      entity: 'input_boolean.lave_linge_en_cours',
                      power: 0
                    },

                    {
                      name: 'Sèche-linge',
                      icon: '👕',
                      entity: 'input_boolean.seche_linge_en_cours',
                      power: 0
                    },

                    {
                      name: 'Lave-vaisselle',
                      icon: '🍽️',
                      entity: 'input_boolean.lave_vaisselle_en_cours',
                      power: 0
                    }

                  ];

                  let htmlContent = '';

                  appliances.forEach(device => {

                    const running =
                      states[device.entity]?.state === 'on';

                    /*
                     * Pas de capteur de puissance fourni
                     * pour ces machines.
                     *
                     * On affiche donc uniquement leur état.
                     */

                    htmlContent += `
                      <div class="
                        appliance
                        ${running ? 'appliance-running' : ''}
                      ">

                        <div class="appliance-icon">
                          ${device.icon}
                        </div>

                        <div class="appliance-name">
                          ${device.name}
                        </div>

                        <div class="
                          appliance-state
                          ${running ? 'running' : ''}
                        ">
                          ${running ? 'RUN' : 'OFF'}
                        </div>

                      </div>
                    `;
                  });

                  return `
                    <div class="appliances-box">

                      <div class="section-title">
                        ⚙️ APPAREILS EN COURS
                      </div>

                      <div class="appliances-grid">
                        ${htmlContent}
                      </div>

                    </div>
                  `;
                ]]]
              daily: |
                [[[
                  const dailyConsumption = parseFloat(
                    states[
                      'sensor.consommation_jour'
                    ]?.state || 0
                  );

                  const currentPrice = parseFloat(
                    Object.values(states).find(e => (e.attributes?.friendly_name || '').toLowerCase().includes("prix d'achat actif"))?.state || 0
                  );

                  /*
                   * Estimation simple basée sur le prix actuel.
                   * Ce n'est PAS le coût réel historique.
                   */

                  const estimatedCost =
                    dailyConsumption * currentPrice;

                  return `
                    <div class="daily-card">

                      <div class="daily-left">

                        <div class="daily-icon">
                          📅
                        </div>

                        <div>

                          <div class="small-label">
                            AUJOURD'HUI
                          </div>

                          <div class="daily-title">
                            CONSOMMATION
                          </div>

                        </div>

                      </div>

                      <div class="daily-values">

                        <div>
                          <b>
                            ${dailyConsumption.toFixed(1)}
                          </b>
                          <small>
                            kWh
                          </small>
                        </div>

                        <div>
                          <b>
                            ${estimatedCost.toFixed(2)}
                          </b>
                          <small>
                            €*
                          </small>
                        </div>

                      </div>

                    </div>
                  `;
                ]]]
              comparison: |
                [[[
                  const currentPrice = parseFloat(
                    Object.values(states).find(e => (e.attributes?.friendly_name || '').toLowerCase().includes("prix d'achat actif"))?.state || 0
                  );

                  const nextPrice = parseFloat(
                    Object.values(states).find(e => (e.attributes?.friendly_name || '').toLowerCase().includes("prix d'achat suivant"))?.state || 0
                  );

                  const difference = nextPrice - currentPrice;

                  let message = '';
                  let icon = '';

                  if (difference < -0.005) {
                    icon = '🟢';
                    message = 'Le prix va diminuer';
                  }
                  else if (difference > 0.005) {
                    icon = '🔴';
                    message = 'Le prix va augmenter';
                  }
                  else {
                    icon = '🟡';
                    message = 'Prix relativement stable';
                  }

                  return `
                    <div class="comparison">

                      <div class="comparison-icon">
                        ${icon}
                      </div>

                      <div>

                        <div class="comparison-title">
                          ${message}
                        </div>

                        <div class="comparison-detail">
                          ${currentPrice.toFixed(3)}
                          €/kWh
                          →
                          ${nextPrice.toFixed(3)}
                          €/kWh
                        </div>

                      </div>

                    </div>
                  `;
                ]]]
            styles:
              grid:
                - grid-template-areas: |
