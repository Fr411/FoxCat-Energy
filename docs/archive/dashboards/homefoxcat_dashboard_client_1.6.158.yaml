      - type: grid
        cards:
          - type: custom:button-card
            show_name: false
            show_state: false
            show_icon: false
            custom_fields:
              panel: |-
                [[[
                  const devices = [
                    {name:'Lave-linge',icon:'🧺',run:'input_boolean.lave_linge_en_cours',sw:'switch.lave_linge_prise_1'},
                    {name:'Sèche-linge',icon:'👕',run:'input_boolean.seche_linge_en_cours',sw:'switch.seche_linge_prise_1'},
                    {name:'Lave-vaisselle',icon:'🍽️',run:'input_boolean.lave_vaisselle_en_cours',sw:'switch.lave_vaisselle_prise_1'}
                  ];
                  const rows = devices.map(d => {
                    const running = states[d.run]?.state === 'on';
                    const powered = states[d.sw]?.state === 'on';
                    const status = running ? 'CYCLE EN COURS' : powered ? 'PRISE ACTIVE' : 'ARRÊT';
                    const color = running ? '#34d399' : powered ? '#facc15' : '#64748b';
                    return `<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px;border-radius:18px;background:${running?'rgba(52,211,153,.06)':'rgba(255,255,255,.03)'};border:1px solid ${running?'rgba(52,211,153,.20)':'rgba(255,255,255,.06)'};"><div style="display:flex;align-items:center;gap:12px;"><div style="font-size:25px;">${d.icon}</div><div><div style="font-size:14px;font-weight:900;">${d.name}</div><div style="font-size:9px;margin-top:3px;color:${color};font-weight:800;">● ${status}</div></div></div><div style="font-size:10px;font-weight:900;color:${color};">${running?'RUN':powered?'ON':'OFF'}</div></div>`;
                  }).join('');
                  return `<div style="width:100%;box-sizing:border-box;padding:22px;border-radius:28px;background:linear-gradient(145deg,#070b14,#101827 55%,#080d16);border:1px solid rgba(255,255,255,.07);"><div style="text-align:center;font-size:24px;font-weight:900;letter-spacing:.08em;">⚙️ APPAREILS</div><div style="text-align:center;margin-top:4px;font-size:9px;opacity:.4;letter-spacing:.14em;">HOMEFOXCAT ENERGY</div><div style="display:grid;grid-template-columns:1fr;gap:9px;margin-top:18px;">${rows}</div></div>`;
                ]]]
