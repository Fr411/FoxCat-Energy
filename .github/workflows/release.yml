name: Publier une release

# Crée le tag et la release GitHub à la demande (Actions → « Publier une release » → Run workflow).
# Sans numéro saisi, la version suivante de la série V1.7.N est calculée à partir de la dernière release publiée.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Tag à créer (ex. V1.7.665). Vide : dernière release V1.7.N + 1"
        required: false
        default: ""
      target:
        description: "Branche ou commit à publier"
        required: false
        default: "main"
      prerelease:
        description: "Marquer comme pré-release"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.target }}

      - name: Vérifier le manifeste
        run: python3 -c "import json; json.load(open('custom_components/foxcat_energy/manifest.json'))"

      - name: Calculer la version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          # Dernière release PUBLIÉE (pas le plus grand numéro de tag : d'anciens tags
          # hors série, comme V1.7.4023, fausseraient le calcul).
          PREVIOUS=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // ""')
          if [ -n "$REQUESTED" ]; then
            VERSION="$REQUESTED"
          else
            if ! [[ "$PREVIOUS" =~ ^V1\.7\.([0-9]+)$ ]]; then
              echo "Dernière release « $PREVIOUS » hors série V1.7.N : saisissez la version à la main." >&2
              exit 1
            fi
            VERSION="V1.7.$(( ${BASH_REMATCH[1]} + 1 ))"
          fi
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "Le tag $VERSION existe déjà." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "previous=$PREVIOUS" >> "$GITHUB_OUTPUT"

      - name: Préparer les notes
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          {
            echo "Détail des changements : [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md) · [JOURNAL_VERSIONS.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/JOURNAL_VERSIONS.md)"
            echo
          } > notes.md

      - name: Créer le tag et la release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
          PREVIOUS: ${{ steps.ver.outputs.previous }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          ARGS=(--target "$(git rev-parse HEAD)" --title "Foxcat Energy $VERSION" --notes-file notes.md --generate-notes)
          if [ -n "$PREVIOUS" ]; then ARGS+=(--notes-start-tag "$PREVIOUS"); fi
          if [ "$PRERELEASE" = "true" ]; then ARGS+=(--prerelease); fi
          gh release create "$VERSION" "${ARGS[@]}"
          echo "Release $VERSION créée." >> "$GITHUB_STEP_SUMMARY"
