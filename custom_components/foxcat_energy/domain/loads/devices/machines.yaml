# Chaque machine configurée dans Home Assistant conserve son réglage indépendant.
# Les prises associées sont pilotées par le flux d'intégration FoxCat Energy.
device:
  id: machines
  name: Machines et prises
  category: machines
  enabled_setting: device_machines_enabled
  machine_setting_keys:
    - washer_enabled
    - dryer_enabled
    - dishwasher_enabled
  disable_strategy: reconcile_machines
