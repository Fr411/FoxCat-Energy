                  <div class="sb">${srcSum > 0 ? `<i class="s" style="width:${solPct * 100}%"></i><i class="g" style="width:${(1 - solPct) * 100}%"></i>` : ''}</div>
                  <div class="lb"><span><ha-icon icon="mdi:transmission-tower" style="color:#60a5fa"></ha-icon>Réseau <b class="mono">${kwh(ET.grid)} kWh</b></span><span class="mono" style="color:#60a5fa">${srcSum > 0 ? (100 - solP) + ' %' : '—'}</span></div>
