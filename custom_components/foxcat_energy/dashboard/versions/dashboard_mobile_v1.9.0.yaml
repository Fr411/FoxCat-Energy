kiosk_mode:
  hide_header: '{{ is_state("[[foxcat:legacy.input_boolean_ems_head_menu]]", "on") }}'
  hide_sidebar: '{{ is_state("[[foxcat:legacy.input_boolean_ems_head_lateral]]", "on") }}'
views:
- type: sections
  max_columns: 4
  title: Accueil
  path: Emsdash
  icon: mdi:home
  show_icon_and_title: false
  sections:
  - type: grid
    cards:
    - type: custom:button-card
      show_name: false
      show_icon: false
      show_state: false
      custom_fields:
        header: |
          [[[
            return `
              <div class="hfc-header">

                <div class="hfc-logo">
                  <div class="fox-glow"></div>
                  <ha-icon icon="mdi:cat"></ha-icon>
                </div>

                <div class="hfc-name">

                  <div class="hfc-title">
                    <span class="home"></span><span class="fox">FOX</span><span class="cat">CAT</span>
                    <span class="energy">ENERGY</span>
                  </div>

                  <div class="hfc-subtitle">
                    ENERGY MANAGEMENT SYSTEM
                  </div>

                </div>

                <div class="hfc-line">
                  <span class="line-orange"></span>
                  <span class="line-blue"></span>
                </div>

              </div>
            `;
          ]]]
      styles:
        card:
        - padding: 17px 22px
        - border-radius: 20px
        - overflow: hidden
        - background: |
            radial-gradient(
              circle at 3% 50%,
              rgba(255,120,20,0.15),
              transparent 24%
            ), radial-gradient(
              circle at 95% 30%,
              rgba(0,210,255,0.11),
              transparent 28%
            ), linear-gradient(
              135deg,
              #080d16 0%,
              #0a1420 48%,
              #071827 100%
            )
        - border: 1px solid rgba(255,255,255,0.08)
        - box-shadow: |
            0 10px 30px rgba(0,0,0,0.30), inset 0 1px 0 rgba(255,255,255,0.035)
        grid:
        - grid-template-areas: '"header"'
        - grid-template-columns: 1fr
        - grid-template-rows: auto
        custom_fields:
          header:
          - width: 100%
      extra_styles: |2

        .hfc-header {
          position: relative;

          width: 100%;

          display: flex;
          align-items: center;

          gap: 16px;

          box-sizing: border-box;
        }


        /* ==========================================
           LOGO
           ========================================== */

        .hfc-logo {
          position: relative;

          width: 54px;
          height: 54px;

          flex: 0 0 54px;

          display: flex;
          align-items: center;
          justify-content: center;

          border-radius: 16px;

          background:
            linear-gradient(
              135deg,
              rgba(255,126,25,0.15),
              rgba(0,211,255,0.12)
            );

          border: 1px solid rgba(255,255,255,0.10);

          box-shadow:
            -5px 0 20px rgba(255,110,15,0.12),
            5px 0 20px rgba(0,210,255,0.12);
        }


        .hfc-logo::before {
          content: "";

          position: absolute;

          inset: 3px;

          border-radius: 13px;

          border-top:
            1px solid rgba(255,137,37,0.45);

          border-right:
            1px solid rgba(0,216,255,0.40);
        }


        .hfc-logo ha-icon {
          position: relative;

          color: #ffffff;

          --mdc-icon-size: 31px;

          filter:
            drop-shadow(-3px 0 5px rgba(255,110,20,0.55))
            drop-shadow(3px 0 5px rgba(0,210,255,0.50));
        }


        /* ==========================================
           NOM
           ========================================== */

        .hfc-name {
          display: flex;
          flex-direction: column;

          justify-content: center;
        }


        .hfc-title {
          white-space: nowrap;

          font-size: 24px;
          font-weight: 850;

          line-height: 1;

          letter-spacing: 0.055em;
        }


        .hfc-title .home {
          color: #ffffff;
        }


        /* RENARD */

        .hfc-title .fox {
          color: #ff8a26;

          text-shadow:
            0 0 12px rgba(255,120,20,0.25);
        }


        /* CHAT */

        .hfc-title .cat {
          color: #19d8ff;

          text-shadow:
            0 0 12px rgba(0,210,255,0.25);
        }


        /* ENERGY */

        .hfc-title .energy {
          margin-left: 9px;

          color: #a9bdcc;

          font-weight: 600;
        }


        /* ==========================================
           SOUS-TITRE
           ========================================== */

        .hfc-subtitle {
          margin-top: 7px;

          color: #71899d;

          font-size: 8px;
          font-weight: 600;

          letter-spacing: 0.28em;
        }


        /* ==========================================
           LIGNE SIGNATURE
           ========================================== */

        .hfc-line {
          height: 2px;

          flex: 1;

          min-width: 60px;

          margin-left: 12px;

          display: flex;

          border-radius: 10px;

          overflow: hidden;

          opacity: 0.75;
        }


        .line-orange {
          width: 38%;

          background:
            linear-gradient(
              90deg,
              rgba(255,130,25,0),
              #ff8125
            );

          box-shadow:
            0 0 10px rgba(255,120,20,0.40);
        }


        .line-blue {
          flex: 1;

          background:
            linear-gradient(
              90deg,
              #00d8ff,
              rgba(0,216,255,0)
            );

          box-shadow:
            0 0 10px rgba(0,216,255,0.40);
        }
  - type: grid
    cards:
    - type: custom:button-card
      show_name: false
      show_state: false
      show_icon: false
      grid_options:
        columns: full
      triggers_update:
      - [[foxcat:ems.mode]]
      - [[foxcat:ems.regulation_active]]
      - binary_sensor.foxcat_energy_energie_donnees_energetiques_valides
      - [[foxcat:ems.phase]]
      - [[foxcat:ems.ack]]
      - [[foxcat:legacy.sensor_foxcat_energy_ems_derniere_decision_ems]]
      - [[foxcat:legacy.sensor_foxcat_energy_energie_puissance_de_production_photovoltaique]]
      - [[foxcat:legacy.sensor_foxcat_energy_energie_puissance_de_consommation_maison]]
      - [[foxcat:legacy.sensor_foxcat_energy_energie_puissance_reinjectee_au_reseau]]
      - [[foxcat:legacy.sensor_foxcat_energy_energie_puissance_prelevee_au_reseau]]
      - sensor.foxcat_energy_energie_puissance_reseau_signee_prelevement_reinjection
      - sensor.foxcat_energy_energy_bus_energy_bus_ack_inter_corps
      - sensor.foxcat_energy_energy_bus_energy_bus_ack_par
      - sensor.homefoxcat_load_chauffe_eau
      - [[foxcat:legacy.sensor_lave_linge_puissance]]
      - [[foxcat:legacy.sensor_seche_linge_puissance]]
      - [[foxcat:legacy.sensor_lave_vaisselle_puissance]]
      - [[foxcat:legacy.sensor_foxcat_energy_tarification_prix_d_achat_actif]]
      - sensor.foxcat_energy_tarification_periode_tarifaire
      - sensor.foxcat_energy_tarification_statut_du_prix
      - sensor.foxcat_energy_tarification_maison_cout_net_aujourdhui
      - sensor.foxcat_energy_tarification_decision_economique_ems
      - sensor.foxcat_energy_tarification_meilleur_creneau_economique
      - sensor.foxcat_energy_energie_pv_production_aujourdhui
      - sensor.foxcat_energy_energie_maison_consommation_aujourdhui
      - sensor.foxcat_energy_energie_pv_reinjection_aujourdhui
      - sensor.foxcat_energy_energie_pv_energie_autoconsommee_aujourdhui
      - sensor.foxcat_energy_energie_pv_taux_dautoconsommation_aujourdhui
      - sensor.foxcat_energy_systeme_sante_foxcat_alertes_de_panne
      - binary_sensor.foxcat_energy_systeme_internet_en_ligne
      - binary_sensor.foxcat_energy_systeme_mode_backup_actif
      - sensor.foxcat_energy_tarification_flux_de_prix_en_ligne_tampon_local
      tap_action:
        action: none
      hold_action:
        action: none
      double_tap_action:
        action: none
      styles:
        card:
        - padding: 0
        - border-radius: 30px
        - overflow: hidden
        - border: 1px solid rgba(255,255,255,0.09)
        - box-shadow: 0 24px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.06)
        - background: 'radial-gradient(110% 70% at 0% 0%, rgba(250,204,21,0.10), transparent 50%), radial-gradient(100% 70% at 100% 0%, rgba(34,211,238,0.10), transparent 50%), radial-gradient(100% 60% at 50% 100%, rgba(251,146,60,0.08), transparent 55%), #060a13'
        grid:
        - grid-template-areas: '"main"'
        - grid-template-columns: 1fr
        custom_fields:
          main:
          - width: 100%
      custom_fields:
        main: |
          [[[
            /* ==============================================================
               FOXCAT ENERGY — COCKPIT EMS (page d'accueil)
               Mêmes entités que la version précédente.
               Les entités à null ne sont pas encore exposées par FoxCat :
               renseigne-les ici quand elles existeront.
               ============================================================== */
            const E = {
              mode: '[[foxcat:ems.mode]]',
              regulation: '[[foxcat:ems.regulation_active]]',
              dataValid: 'binary_sensor.foxcat_energy_energie_donnees_energetiques_valides',
              phase: '[[foxcat:ems.phase]]',
              coreAck: '[[foxcat:ems.ack]]',
              lastDecision: '[[foxcat:legacy.sensor_foxcat_energy_ems_derniere_decision_ems]]',

              pv: '[[foxcat:legacy.sensor_foxcat_energy_energie_puissance_de_production_photovoltaique]]',
              house: '[[foxcat:legacy.sensor_foxcat_energy_energie_puissance_de_consommation_maison]]',
              export: '[[foxcat:legacy.sensor_foxcat_energy_energie_puissance_reinjectee_au_reseau]]',
              import: '[[foxcat:legacy.sensor_foxcat_energy_energie_puissance_prelevee_au_reseau]]',
              gridNet: 'sensor.foxcat_energy_energie_puissance_reseau_signee_prelevement_reinjection',

              priLevel: null,
              priTarget: null,
              priDirection: null,
              priCode: null,
              priAckRrcr: 'sensor.foxcat_energy_energy_bus_energy_bus_ack_inter_corps',
              priAckInverter: 'sensor.foxcat_energy_energy_bus_energy_bus_ack_par',
              priAckGrid: null,

              buyPrice: '[[foxcat:legacy.sensor_foxcat_energy_tarification_prix_d_achat_actif]]',
              tariffPeriod: 'sensor.foxcat_energy_tarification_periode_tarifaire',
              priceStatus: 'sensor.foxcat_energy_tarification_statut_du_prix',
              netCostToday: 'sensor.foxcat_energy_tarification_maison_cout_net_aujourdhui',
              economicDecision: 'sensor.foxcat_energy_tarification_decision_economique_ems',
              bestSlot: 'sensor.foxcat_energy_tarification_meilleur_creneau_economique',

              prodToday: 'sensor.foxcat_energy_energie_pv_production_aujourdhui',
              consToday: 'sensor.foxcat_energy_energie_maison_consommation_aujourdhui',
              injToday: 'sensor.foxcat_energy_energie_pv_reinjection_aujourdhui',
              selfConsToday: 'sensor.foxcat_energy_energie_pv_energie_autoconsommee_aujourdhui',
              selfConsPctToday: 'sensor.foxcat_energy_energie_pv_taux_dautoconsommation_aujourdhui'
            };

            /* Appareils suivis pour le bandeau « En marche » (seuil 20 W) */
            const APPS = [
              { name: 'Boiler', icon: 'mdi:water-boiler', col: '#fb923c', pw: 'sensor.homefoxcat_load_chauffe_eau' },
              { name: 'Lave-linge', icon: 'mdi:washing-machine', col: '#60a5fa', pw: '[[foxcat:legacy.sensor_lave_linge_puissance]]' },
              { name: 'Sèche-linge', icon: 'mdi:tumble-dryer', col: '#c4b5fd', pw: '[[foxcat:legacy.sensor_seche_linge_puissance]]' },
              { name: 'Lave-vaisselle', icon: 'mdi:dishwasher', col: '#34d399', pw: '[[foxcat:legacy.sensor_lave_vaisselle_puissance]]' }
            ];

            /* ---------- outils ---------- */
            const BAD = ['', 'unknown', 'unavailable', 'none', 'None'];
            const S = (id, fb = '—') => { const v = id && states[id] ? states[id].state : null; return (v == null || BAD.includes(v)) ? fb : v; };
            const N = (id, fb = 0) => { const v = parseFloat(S(id, '')); return isFinite(v) ? v : fb; };
            const has = (id) => !!id && !!states[id];
            const isOn = (id) => !!id && states[id]?.state === 'on';
            const clamp = (v, a, b) => Math.min(b, Math.max(a, Number(v) || 0));
            const esc = (t) => String(t ?? '').replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
            const W = (v) => { const a = Math.abs(Number(v) || 0); return a >= 1000 ? [(a / 1000).toFixed(2), 'kW'] : [String(Math.round(a)), 'W']; };
            const Ws = (v) => W(v).join(' ');
            const dec = (v, d = 1) => (Number(v) || 0).toFixed(d).replace('.', ',');

            /* animations calées sur l'horloge : pas d'à-coup quand la carte se redessine */
            const NOW = Date.now() / 1000;
            const ph = (d, o = 0) => `-${((((NOW + o) % d) + d) % d).toFixed(2)}s`;
            const AA = (n, d, tf = 'linear', o = 0, x = 'infinite') => `animation:${n} ${d}s ${tf} ${ph(d, o)} ${x};`;

            /* ---------- mesures ---------- */
            const pv = Math.max(N(E.pv), 0);
            const house = Math.max(N(E.house), 0);
            const gExp = Math.max(N(E.export), 0);
            const gImp = Math.max(N(E.import), 0);
            const gNet = has(E.gridNet) ? N(E.gridNet, gExp - gImp) : gExp - gImp;
            const pvSelf = Math.max(0, pv - gExp);
            const solarCover = house > 0 ? clamp((pvSelf / house) * 100, 0, 100) : (pv > 0 ? 100 : 0);

            const priLevel = clamp(N(E.priLevel, 100), 0, 100);
            const priTarget = clamp(N(E.priTarget, priLevel), 0, 100);
            const priDirection = S(E.priDirection, 'maintien');
            const priCode = S(E.priCode, '—');
            const acks = [['RRCR', S(E.priAckRrcr)], ['ONDULEUR', S(E.priAckInverter)], ['RÉSEAU', S(E.priAckGrid)]];

            const mode = S(E.mode, 'Inconnu');
            const regOn = has(E.regulation) ? isOn(E.regulation) : true;
            const dataOk = has(E.dataValid) ? isOn(E.dataValid) : true;
            const phase = S(E.phase);
            const coreAck = S(E.coreAck);
            const lastDecision = S(E.lastDecision, 'Aucune décision EMS disponible.');

            const buyPrice = N(E.buyPrice);
            const period = S(E.tariffPeriod);
            const priceStatus = S(E.priceStatus);
            const costToday = N(E.netCostToday);
            const ecoDecision = S(E.economicDecision);
            const bestSlot = S(E.bestSlot, 'Maintenant');

            const prodT = Math.max(N(E.prodToday), 0);
            const consT = Math.max(N(E.consToday), 0);
            const injT = Math.max(N(E.injToday), 0);
            const selfT = Math.max(N(E.selfConsToday), 0);
            const selfPct = clamp(N(E.selfConsPctToday), 0, 100);
            const gridT = Math.max(0, consT - selfT);

            /* ---------- couleurs / états ---------- */
            const MODES = {
              'Économie énergie': ['mdi:leaf', '#34d399'], 'Economie énergie': ['mdi:leaf', '#34d399'],
              'Bihoraire': ['mdi:clock-time-four-outline', '#fb923c'],
              'Zéro injection': ['mdi:transmission-tower-off', '#fb7185'],
              'Dynamique': ['mdi:chart-line', '#a78bfa'],
              'Manuel': ['mdi:hand-back-right-outline', '#60a5fa']
            };
            const [modeIcon, modeCol] = MODES[mode] || ['mdi:flash', '#c4b5fd'];
            const sysOk = regOn && dataOk;
            const sysCol = sysOk ? '#34d399' : '#fb7185';
            const sysTxt = regOn ? (dataOk ? 'EMS ACTIF' : 'DONNÉES INVALIDES') : 'EMS EN VEILLE';

            const exporting = gExp > 20, importing = gImp > 20;
            const [gIcon, gLabel, gCol, gVal] = exporting ? ['mdi:transmission-tower-export', 'Réinjection', '#34d399', gExp]
              : importing ? ['mdi:transmission-tower-import', 'Prélèvement', '#fb7185', gImp]
              : ['mdi:transmission-tower', 'Équilibre', '#94a3b8', 0];

            const ackCol = (v) => { const u = String(v).toUpperCase(); return u.includes('FAIL') ? '#fb7185' : u.includes('PENDING') ? '#60a5fa' : (u === 'OK' || u.includes('ACK') || u.includes('SUCCESS') || u === 'DONE') ? '#34d399' : '#94a3b8'; };
            let priCol = priLevel < 100 ? '#facc15' : '#34d399';
            if (acks.some(([, v]) => String(v).toUpperCase().includes('FAIL'))) priCol = '#fb7185';
            else if (String(acks[2][1]).toUpperCase().includes('PENDING')) priCol = '#60a5fa';
            const priArrow = priTarget > priLevel ? 'mdi:arrow-up-bold' : priTarget < priLevel ? 'mdi:arrow-down-bold' : 'mdi:arrow-right-bold';

            const running = APPS.map(a => ({ ...a, w: N(a.pw) })).filter(a => a.w > 20);

            /* ---------- schéma de flux : deux dispositions (large / étroite) ---------- */
            const LAY = {
              d: { w: 640, h: 200, nr: 46, lab: [320, 12],
                   P: { pv: [100, 115], home: [320, 115], grid: [540, 115] },
                   PATHS: { pvHome: 'M146 115 H274', pvGrid: 'M118 73 C 190 15, 450 15, 522 73', gridHome: 'M494 115 H366', homeGrid: 'M366 115 H494' } },
              m: { w: 360, h: 290, nr: 48, lab: [180, 44],
                   P: { pv: [80, 80], home: [180, 222], grid: [280, 80] },
                   PATHS: { pvHome: 'M108 119 L152 183', pvGrid: 'M128 80 H232', gridHome: 'M252 119 L208 183', homeGrid: 'M208 183 L252 119' } }
            };
            const flowBlock = (key) => {
              const L = LAY[key];
              const pc = (x, y) => `left:${(x / L.w * 100).toFixed(2)}%;top:${(y / L.h * 100).toFixed(2)}%`;
              const flow = (k, p, col) => {
                const act = p > 20;
                const n = act ? 1 + Math.min(4, Math.round(p / 900)) : 0;
                const d = +clamp(3.2 - p / 1500, 1, 3.2).toFixed(1);
                const dots = Array.from({ length: n }, (_, i) => `<circle r="4" fill="#fff" style="filter:drop-shadow(0 0 4px ${col}) drop-shadow(0 0 8px ${col})"><animateMotion dur="${d}s" repeatCount="indefinite" begin="${ph(d, i * d / n)}" path="${L.PATHS[k]}"/></circle>`).join('');
                return `<path d="${L.PATHS[k]}" class="ln"/>${act ? `<path d="${L.PATHS[k]}" class="ln on" style="stroke:${col};filter:drop-shadow(0 0 5px ${col})"/>${dots}` : ''}`;
              };
              const ring = (k, pct, col) => {
                const [x, y] = L.P[k], C = 2 * Math.PI * L.nr;
                return `<circle cx="${x}" cy="${y}" r="${L.nr}" class="nb"/><circle cx="${x}" cy="${y}" r="${L.nr}" fill="none" stroke="${col}" stroke-width="4" stroke-linecap="round" stroke-dasharray="${(C * clamp(pct, 0, 100) / 100).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 ${x} ${y})" style="filter:drop-shadow(0 0 4px ${col}88)"/>`;
              };
              const node = (k, col, icon, val, unit, label, active, cls = '') => `
                <div class="nd ${active ? 'act' : ''} ${cls}" style="${pc(...L.P[k])};width:${(L.nr * 2 / L.w * 100).toFixed(2)}%;--c:${col}">
                  <ha-icon icon="${icon}"></ha-icon>
                  <div class="nv mono">${val}<small>${unit}</small></div>
                  <div class="nl">${label}</div>
                </div>`;
              const halo = (k, col) => `<div class="halo" style="${pc(...L.P[k])};width:${(L.nr * 2.8 / L.w * 100).toFixed(2)}%;--c:${col}"></div>`;
              return `
              <div class="flow ${key}" style="aspect-ratio:${L.w}/${L.h}">
                ${pv > 20 ? halo('pv', '#facc15') : ''}
                <svg viewBox="0 0 ${L.w} ${L.h}">
                  ${flow('pvHome', Math.min(pvSelf, house || pvSelf), '#facc15')}
                  ${flow('pvGrid', exporting ? gExp : 0, '#34d399')}
                  ${importing ? flow('gridHome', gImp, '#fb7185') : flow('homeGrid', 0, '#94a3b8')}
                  ${ring('pv', solarCover, '#facc15')}
                  ${ring('home', solarCover, '#22d3ee')}
                  ${ring('grid', (exporting || importing) ? 100 : 0, gCol)}
                </svg>
                ${exporting ? `<div class="flab" style="${pc(...L.lab)};--c:#34d399">↗ ${Ws(gExp)} réinjectés</div>` : ''}
                ${node('pv', '#facc15', 'mdi:white-balance-sunny', pvV, pvU, 'Solaire', pv > 20, 'sun')}
                ${node('home', '#22d3ee', 'mdi:home-lightning-bolt-outline', hV, hU, Math.round(solarCover) + ' % solaire', house > 20)}
                ${node('grid', gCol, gIcon, gV, gU, gLabel, exporting || importing)}
              </div>`;
            };
            const [pvV, pvU] = W(pv), [hV, hU] = W(house), [gV, gU] = W(gVal);

            /* ---------- briques ---------- */
            const chip = (txt, col, icon = '') => `<span class="chip" style="--c:${col}">${icon ? `<ha-icon icon="${icon}"></ha-icon>` : ''}${esc(txt)}</span>`;
            const kv = (k, v, col = '') => `<div class="kv"><span>${k}</span><b ${col ? `style="color:${col}"` : ''}>${esc(v)}</b></div>`;
            const pctOf = (a, b) => b > 0 ? clamp(a / b * 100, 0, 100) : 0;

            return `
            <style>
              .fx{container-type:inline-size;position:relative;padding:22px;font-family:'Inter','Segoe UI',system-ui,sans-serif;color:#e2e8f0}
              .fx *{box-sizing:border-box}
              .fx ha-icon{display:inline-flex}
              .fx .mono{font-family:'JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
              .fx .scan{position:absolute;left:0;right:0;height:90px;pointer-events:none;background:linear-gradient(180deg,transparent,rgba(34,211,238,.045),transparent);${AA('fx-scan', 7)}}

              /* en-tête */
              .fx .hd{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
              .fx .brand{font-size:23px;font-weight:900;letter-spacing:.06em;color:#f8fafc}
              .fx .brand .cat{color:#fb923c}
              .fx .brand .en{margin-left:8px;font-size:11px;letter-spacing:.3em;color:#22d3ee;vertical-align:middle}
              .fx .tag{margin-top:4px;font-size:10.5px;font-weight:700;letter-spacing:.2em;color:#64748b}
              .fx .sys{display:flex;align-items:center;gap:8px;padding:8px 13px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.1em;color:${sysCol};background:${sysCol}14;border:1px solid ${sysCol}45}
              .fx .dot{position:relative;width:8px;height:8px;border-radius:50%;background:${sysCol};box-shadow:0 0 10px ${sysCol}}
              .fx .dot::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid ${sysCol};${AA('fx-ping', sysOk ? 2 : 1, 'ease-out')}}

              .fx .modebar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:18px;padding:12px 14px;border-radius:18px;background:linear-gradient(90deg,${modeCol}1c,rgba(255,255,255,.02));border:1px solid ${modeCol}40}
              .fx .mode{display:flex;align-items:center;gap:12px}
              .fx .mode-ic{position:relative;width:42px;height:42px;border-radius:13px;display:grid;place-items:center;color:${modeCol};background:${modeCol}1f;overflow:hidden}
              .fx .mode-ic::before{content:"";position:absolute;inset:-50%;background:conic-gradient(from 0deg,transparent 0 60%,${modeCol} 85%,transparent 100%);${AA('fx-spin', 5)}}
              .fx .mode-ic::after{content:"";position:absolute;inset:1.5px;border-radius:11.5px;background:#0b1220}
              .fx .mode-ic ha-icon{position:relative;z-index:1;--mdc-icon-size:22px}
              .fx .k{font-size:10px;font-weight:800;letter-spacing:.18em;color:#64748b}
              .fx .mode-v{margin-top:2px;font-size:19px;font-weight:800;color:${modeCol}}
              .fx .core{display:flex;gap:8px;flex-wrap:wrap}
              .fx .chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font-size:11px;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent);border:1px solid color-mix(in srgb,var(--c) 32%,transparent);white-space:nowrap}
              .fx .chip ha-icon{--mdc-icon-size:14px}

              /* schéma de flux */
              .fx .flow{position:relative;width:100%;margin-top:14px;container-type:inline-size}
              .fx .flow.m{display:none;max-width:420px;margin-left:auto;margin-right:auto}
              .fx .flow svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
              .fx .ln{fill:none;stroke:rgba(255,255,255,.08);stroke-width:3;stroke-linecap:round}
              .fx .ln.on{stroke-width:2.5;stroke-dasharray:2 10;${AA('fx-dash', .7)}}
              .fx .nb{fill:rgba(8,13,24,.92);stroke:rgba(255,255,255,.08);stroke-width:4}
              .fx .nd{position:absolute;aspect-ratio:1;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border-radius:50%}
              .fx .nd ha-icon{--mdc-icon-size:clamp(14px,3.6cqw,30px);color:var(--c);opacity:.55}
              .fx .nd.act ha-icon{opacity:1;filter:drop-shadow(0 0 6px var(--c))}
              .fx .nd.sun.act ha-icon{${AA('fx-spin', 12)}}
              .fx .nv{margin-top:.3cqw;font-size:clamp(11px,2.9cqw,24px);font-weight:700;line-height:1;color:#f8fafc}
              .fx .nd:not(.act) .nv{color:#94a3b8}
              .fx .nv small{margin-left:2px;font-size:.55em;color:var(--c)}
              .fx .nl{margin-top:.4cqw;font-size:clamp(8px,1.5cqw,11px);font-weight:800;letter-spacing:.12em;color:#64748b;text-transform:uppercase}
              .fx .halo{position:absolute;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,var(--c),transparent 65%);opacity:.18;pointer-events:none;${AA('fx-breath', 3, 'ease-in-out')}}
              .fx .flow.m .nd ha-icon{--mdc-icon-size:clamp(16px,6.5cqw,28px)}
              .fx .flow.m .nv{font-size:clamp(13px,5.2cqw,22px)}
              .fx .flow.m .nl{font-size:clamp(8.5px,2.6cqw,11px);letter-spacing:.06em;max-width:90%;line-height:1.15}
              .fx .flab{position:absolute;transform:translate(-50%,-50%);font-size:clamp(10px,1.6cqw,12px);text-transform:uppercase;font-weight:800;letter-spacing:.08em;color:var(--c);white-space:nowrap}

              /* bandeau en marche */
              .fx .run{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:10px;padding:10px 14px;border-radius:16px;background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.06)}
              .fx .run-l{display:flex;align-items:center;gap:6px;flex:none;font-size:10px;font-weight:800;letter-spacing:.16em;color:#64748b}
              .fx .run-l ha-icon{--mdc-icon-size:15px}
              .fx .run-c{display:flex;flex-wrap:wrap;gap:8px;min-width:0}
              .fx .ra{position:relative;display:inline-flex;align-items:center;gap:7px;padding:6px 12px 6px 10px;border-radius:999px;font-size:12px;font-weight:700;color:#e2e8f0;background:color-mix(in srgb,var(--c) 13%,transparent);border:1px solid color-mix(in srgb,var(--c) 40%,transparent)}
              .fx .ra ha-icon{--mdc-icon-size:16px;color:var(--c);${AA('fx-flick', 1.6, 'ease-in-out')}}
              .fx .ra b{font-weight:700;color:var(--c)}
              .fx .none{font-size:12px;color:#64748b}

              /* sections */
              .fx .cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}
              .fx .stack{display:flex;flex-direction:column;gap:12px;min-width:0}
              .fx .pan{position:relative;overflow:hidden;min-width:0;padding:16px;border-radius:20px;background:linear-gradient(135deg,rgba(255,255,255,.04),rgba(255,255,255,.012));border:1px solid rgba(255,255,255,.07)}
              .fx .pan::after{content:"";position:absolute;top:0;bottom:0;left:-40%;width:25%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.04),transparent);transform:skewX(-20deg);pointer-events:none;${AA('fx-sweep', 9, 'ease-in-out')}}
              .fx .ph{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
              .fx .pt{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:.16em;color:#94a3b8}
              .fx .pt ha-icon{--mdc-icon-size:17px}
              .fx .big{font-size:30px;font-weight:700;line-height:1;color:#f8fafc}
              .fx .big small{margin-left:4px;font-size:13px;font-weight:700;color:#64748b}
              .fx .bar{position:relative;height:7px;margin-top:12px;border-radius:7px;overflow:hidden;background:rgba(255,255,255,.07)}
              .fx .bar i{position:absolute;top:0;bottom:0;left:0;border-radius:7px}
              .fx .kv{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:8px 0;border-top:1px solid rgba(255,255,255,.05);font-size:12px}
              .fx .kv:first-of-type{border-top:none}
              .fx .kv span{color:#64748b}
              .fx .kv b{min-width:0;font-weight:700;color:#e2e8f0;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
              .fx .acks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:10px}
              .fx .ack{padding:7px 4px;border-radius:10px;text-align:center;background:color-mix(in srgb,var(--c) 10%,transparent);border:1px solid color-mix(in srgb,var(--c) 28%,transparent)}
              .fx .ack span{display:block;font-size:9px;font-weight:800;letter-spacing:.12em;color:#64748b}
              .fx .ack b{display:block;margin-top:2px;font-size:11px;font-weight:800;color:var(--c);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
              .fx .cell{min-width:0;padding:9px 6px;border-radius:12px;text-align:center;background:rgba(255,255,255,.03)}
              .fx .cell span{display:block;font-size:9.5px;font-weight:700;color:#64748b}
              .fx .cell b{display:block;margin-top:3px;font-size:12px;font-weight:700;color:#e2e8f0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
              .fx .note{margin-top:10px;font-size:12px;line-height:1.45;color:#94a3b8}
              .fx .price{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
              .fx .slot{display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px 12px;border-radius:14px;background:rgba(34,211,238,.07);border:1px solid rgba(34,211,238,.2);font-size:12.5px;color:#cffafe}
              .fx .slot ha-icon{--mdc-icon-size:18px;color:#22d3ee;${AA('fx-tick', 4, 'steps(4)')}}

              /* aujourd'hui */
              .fx .today{margin-top:12px}
              .fx .kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
              .fx .kpi{min-width:0;padding:12px 8px;border-radius:14px;text-align:center;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05)}
              .fx .kpi ha-icon{--mdc-icon-size:18px;color:var(--c)}
              .fx .kpi b{display:block;margin-top:6px;font-size:17px;font-weight:700;color:#f8fafc;white-space:nowrap}
              .fx .kpi b small{margin-left:3px;font-size:10px;color:#64748b}
              .fx .kpi span{display:block;margin-top:3px;font-size:10px;font-weight:700;letter-spacing:.06em;color:#64748b}
              .fx .split{margin-top:14px;display:grid;gap:10px}
              .fx .sl{display:flex;justify-content:space-between;gap:10px;font-size:11px;font-weight:700;color:#94a3b8;margin-bottom:5px}
              .fx .sb{display:flex;height:10px;border-radius:10px;overflow:hidden;background:rgba(255,255,255,.06)}
              .fx .sb i{display:block;height:100%;background-image:repeating-linear-gradient(-45deg,rgba(255,255,255,.14) 0 5px,transparent 5px 10px);background-size:14px 14px;${AA('fx-stripes', 1.6)}}

              /* bandeau décision */
              .fx .tick{display:flex;align-items:center;gap:12px;margin-top:14px;padding:10px 14px;border-radius:14px;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.06);overflow:hidden}
              .fx .tick .lbl{flex:none;display:flex;align-items:center;gap:6px;font-size:10px;font-weight:800;letter-spacing:.16em;color:#22d3ee}
              .fx .tick .lbl i{width:6px;height:6px;border-radius:50%;background:#22d3ee;${AA('fx-blink', 1.2, 'ease-in-out')}}
              .fx .tick .win{position:relative;flex:1;min-width:0;overflow:hidden;white-space:nowrap;mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
              .fx .tick .win span{display:inline-block;padding-left:100%;font-size:12px;color:#cbd5e1;${AA('fx-marq', 22)}}
              .fx .foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:12px;font-size:10px;font-weight:700;letter-spacing:.12em;color:#475569}

              @container (max-width:620px){
                .fx{padding:16px}
                .fx .flow.d{display:none}
                .fx .flow.m{display:block}
                .fx .cols{grid-template-columns:1fr}
                .fx .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
                .fx .kpis .kpi:last-child{grid-column:1/-1}
                .fx .brand{font-size:19px}
              }
              @media (prefers-reduced-motion:reduce){.fx *,.fx *::before,.fx *::after{animation:none!important}}

              @keyframes fx-scan{from{top:-90px}to{top:100%}}
              @keyframes fx-ping{0%{transform:scale(.6);opacity:1}100%{transform:scale(2.6);opacity:0}}
              @keyframes fx-spin{to{transform:rotate(360deg)}}
              @keyframes fx-dash{to{stroke-dashoffset:-12}}
              @keyframes fx-flick{0%,100%{transform:scale(1);opacity:1}35%{transform:scale(.92);opacity:.8}65%{transform:scale(1.08)}}
              @keyframes fx-breath{0%,100%{opacity:.12}50%{opacity:.3}}
              @keyframes fx-sweep{0%,60%{left:-40%}100%{left:130%}}
              @keyframes fx-tick{to{transform:rotate(360deg)}}
              @keyframes fx-stripes{to{background-position:14px 0}}
              @keyframes fx-blink{0%,100%{opacity:1}50%{opacity:.25}}
              @keyframes fx-marq{to{transform:translateX(-100%)}}
              .fx .hs{margin-top:10px;padding:8px 12px;border-radius:16px;background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.06)}.fx .hs ha-icon{display:block;width:16px!important;height:16px!important;--mdc-icon-size:16px!important;flex:none}.fx .hs ha-icon svg{width:16px!important;height:16px!important}.fx .hs .hr{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.fx .hs .hi{width:28px;height:28px;flex:0 0 28px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);border:1px solid color-mix(in srgb,var(--c) 40%,transparent)}.fx .hs .hv{font-size:15px;font-weight:850;color:var(--c);line-height:1.1}.fx .hs .hd2{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap;font-size:10px;font-weight:700;color:#94a3b8}.fx .hs .hd2 span{display:flex;align-items:center;gap:4px;white-space:nowrap}.fx .hs .hd2 i{width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 6px var(--c)}.fx .hs .hal{margin-top:8px;padding:6px 10px;border-radius:10px;font-size:11px;line-height:1.5;color:#fb7185;background:rgba(251,113,133,.09);border:1px solid rgba(251,113,133,.3)}
              .fx .det{margin-top:12px}.fx .det summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:20px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);font-size:11px;font-weight:800;letter-spacing:.16em;color:#94a3b8}.fx .det summary::-webkit-details-marker{display:none}.fx .det summary em{margin-left:auto;font-style:normal;font-size:10px;letter-spacing:.04em;color:#64748b;font-weight:600}.fx .det .ar{display:inline-block;transition:transform .2s}.fx .det[open] .ar{transform:rotate(90deg)}.fx .det .cols{margin-top:10px}
              @container (max-width:620px){.fx .kpis{grid-template-columns:repeat(4,minmax(0,1fr))}.fx .kpis .kpi:last-child{display:none}.fx .kpi{padding:8px 2px}.fx .kpi b{font-size:14px}.fx .kpi span{font-size:8px;letter-spacing:0}.fx .pan{padding:12px}}
            </style>

            <div class="fx">
              <div class="scan"></div>

              <div class="hd">
                <div>
                  <div class="brand">FOX<span class="cat">CAT</span><span class="en">ENERGY</span></div>
                  <div class="tag">EMS V1.3.200 · COCKPIT TEMPS RÉEL</div>
                </div>
                <div class="sys"><span class="dot"></span>${sysTxt}</div>
              </div>

              <div class="modebar">
                <div class="mode">
                  <div class="mode-ic"><ha-icon icon="${modeIcon}"></ha-icon></div>
                  <div><div class="k">MODE ACTUEL</div><div class="mode-v">${esc(mode)}</div></div>
                </div>
                <div class="core">
                  ${chip('CORE · ' + phase, '#22d3ee', 'mdi:cpu-64-bit')}
                  ${chip('ACK · ' + coreAck, '#a78bfa', 'mdi:check-decagram-outline')}
                </div>
              </div>

              ${flowBlock('d')}
              ${flowBlock('m')}

              <div class="run">
                <div class="run-l"><ha-icon icon="mdi:power-plug-outline"></ha-icon>EN MARCHE</div>
                <div class="run-c">${running.length ? running.map((a, i) => `<span class="ra" style="--c:${a.col}"><ha-icon icon="${a.icon}"></ha-icon>${a.name}<b class="mono">${Ws(a.w)}</b></span>`).join('') : '<span class="none">Aucun appareil piloté en marche</span>'}</div>
              </div>

              <div class="hs-wrap">${(()=>{const H='sensor.foxcat_energy_systeme_sante_foxcat_alertes_de_panne';const st=(i)=>states[i]?.state;const hs=(st(H)&&!['unknown','unavailable'].includes(st(H)))?st(H):'INCONNU';const hc={OK:'#35e59d',MAJEUR:'#fbbf24',CRITIQUE:'#fb7185'}[hs]||'#94a3b8';const n=Number(states[H]?.attributes?.nombre_alertes||0);let al=states[H]?.attributes?.alertes||[];if(!Array.isArray(al))al=[al];const tx=al.map(a=>typeof a==='object'?(a.message||a.titre||a.nom||JSON.stringify(a)):a);const feed=st('sensor.foxcat_energy_tarification_flux_de_prix_en_ligne_tampon_local')||'—';const fcol={EN_LIGNE:'#35e59d',TAMPON:'#fbbf24',DEGRADE:'#fb923c',LOCAL:'#19d8ff'}[feed]||'#94a3b8';const net=st('binary_sensor.foxcat_energy_systeme_internet_en_ligne')==='on';const bak=st('binary_sensor.foxcat_energy_systeme_mode_backup_actif')==='on';const D=[['Internet',net?'#35e59d':'#fb7185'],['Backup',bak?'#fbbf24':'#64748b'],['Prix '+feed,fcol]];return `<div class="hs" style="--c:${hc}"><div class="hr"><div class="hi"><ha-icon icon="mdi:heart-pulse"></ha-icon></div><div><div class="k">SANTÉ FOXCAT</div><div class="hv">${esc(hs)}</div></div><div class="hd2">${D.map(([l,c])=>`<span style="--c:${c}"><i></i>${esc(l)}</span>`).join('')}</div></div>${n>0?`<div class="hal">${tx.slice(0,4).map(t=>`<div>${esc(t)}</div>`).join('')}</div>`:''}</div>`;})()}</div>

              <div class="pan today">
                <div class="ph"><div class="pt"><ha-icon icon="mdi:calendar-today" style="color:#22d3ee"></ha-icon>AUJOURD’HUI</div><span class="k">BILAN ÉNERGÉTIQUE & FINANCIER</span></div>
                <div class="kpis">
                  <div class="kpi" style="--c:#facc15"><ha-icon icon="mdi:solar-power"></ha-icon><b class="mono">${dec(prodT)}<small>kWh</small></b><span>Production</span></div>
                  <div class="kpi" style="--c:#22d3ee"><ha-icon icon="mdi:home-outline"></ha-icon><b class="mono">${dec(consT)}<small>kWh</small></b><span>Consommation</span></div>
                  <div class="kpi" style="--c:#34d399"><ha-icon icon="mdi:transmission-tower-export"></ha-icon><b class="mono">${dec(injT)}<small>kWh</small></b><span>Injection</span></div>
                  <div class="kpi" style="--c:#a78bfa"><ha-icon icon="mdi:recycle"></ha-icon><b class="mono">${Math.round(selfPct)}<small>%</small></b><span>Autoconsommation</span></div>
                  <div class="kpi" style="--c:${costToday > 0 ? '#fb7185' : '#34d399'}"><ha-icon icon="mdi:cash"></ha-icon><b class="mono">${dec(costToday, 2)}<small>€</small></b><span>Coût net</span></div>
                </div>
                <div class="split">
                  <div>
                    <div class="sl"><span>Production ${dec(prodT)} kWh</span><span><b style="color:#a78bfa">${dec(selfT)} autoconsommés</b> · <b style="color:#34d399">${dec(injT)} injectés</b></span></div>
                    <div class="sb"><i style="width:${pctOf(selfT, prodT)}%;background-color:#a78bfa"></i><i style="width:${pctOf(injT, prodT)}%;background-color:#34d399"></i></div>
                  </div>
                  <div>
                    <div class="sl"><span>Consommation ${dec(consT)} kWh</span><span><b style="color:#facc15">${dec(selfT)} solaire</b> · <b style="color:#fb7185">${dec(gridT)} réseau</b></span></div>
                    <div class="sb"><i style="width:${pctOf(selfT, consT)}%;background-color:#facc15"></i><i style="width:${pctOf(gridT, consT)}%;background-color:#fb7185"></i></div>
                  </div>
                </div>
              </div>

              <details class="det" ${window.__fxDet?'open':''} ontoggle="window.__fxDet=this.open"><summary><span class="ar">▸</span>DÉTAILS<em>Onduleur · Tarif &amp; économie</em></summary><div class="cols">
                <div class="stack">
                  <div class="pan">
                    <div class="ph"><div class="pt"><ha-icon icon="mdi:solar-power-variant" style="color:#a78bfa"></ha-icon>ONDULEUR SOLAREDGE</div>${chip('PRI', priCol)}</div>
                    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px">
                      <div class="big mono" style="color:${priCol}">${Math.round(priLevel)}<small>%</small></div>
                      <div class="chip" style="--c:#cbd5e1"><ha-icon icon="${priArrow}"></ha-icon>cible ${Math.round(priTarget)} %</div>
                    </div>
                    <div class="bar"><i style="width:${priLevel}%;background:linear-gradient(90deg,${priCol}88,${priCol});box-shadow:0 0 10px ${priCol}"></i></div>
                    <div style="margin-top:8px">${kv('Direction', priDirection)}${kv('Code RRCR', priCode)}</div>
                    <div class="acks">${acks.map(([k, v]) => `<div class="ack" style="--c:${ackCol(v)}"><span>${k}</span><b>${esc(v)}</b></div>`).join('')}</div>
                  </div>

                </div>

                <div class="stack">
                  <div class="pan">
                    <div class="ph"><div class="pt"><ha-icon icon="mdi:currency-eur" style="color:#34d399"></ha-icon>TARIF & ÉCONOMIE</div>${chip(period, '#22d3ee', 'mdi:clock-outline')}</div>
                    <div class="price">
                      <div><div class="k">PRIX D'ACHAT ACTIF</div><div class="big mono" style="margin-top:4px">${dec(buyPrice, 3)}<small>€/kWh</small></div></div>
                      ${chip(priceStatus, '#fbbf24', 'mdi:tag-outline')}
                    </div>
                    <div style="margin-top:12px">${kv('Coût net aujourd’hui', dec(costToday, 2) + ' €', costToday > 0 ? '#fb7185' : '#34d399')}</div>
                    <div class="k" style="margin-top:12px">DÉCISION ÉCONOMIQUE</div>
                    <div class="note" style="margin-top:4px;color:#e2e8f0">${esc(ecoDecision)}</div>
                    <div class="slot"><ha-icon icon="mdi:clock-star-four-points-outline"></ha-icon><div><div class="k" style="color:#22d3ee">MEILLEUR CRÉNEAU</div>${esc(bestSlot)}</div></div>
                  </div>

                </div>
              </div>

              </details>

              <div class="tick">
                <div class="lbl"><i></i>DÉCISION EMS</div>
                <div class="win"><span>${esc(lastDecision)}</span></div>
              </div>

              <div class="foot"><span>FOXCAT ENERGY V1.3.200</span><span>Réseau net ${gNet >= 0 ? '+' : '−'}${Ws(gNet)} · comptabilité signée</span></div>
            </div>`;
          ]]]
  - type: grid
    cards:
    - square: false
      type: grid
      cards:
