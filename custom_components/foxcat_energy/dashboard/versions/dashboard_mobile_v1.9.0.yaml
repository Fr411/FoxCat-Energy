                          - animation: '[[[ return (states[''[[foxcat:pricing.network_policy]]'']?.state === states[''[[foxcat:pricing.network_policy]]'']?.attributes?.options?.[4]) ? ''segOn 2.4s ease-in-out infinite'' : ''none'' ]]]'
