                cout_jour: 'sensor.foxcat_energy_tarification_lave_linge_cout_aujourdhui',
                consommation_hp_jour: 'sensor.foxcat_energy_energie_lave_linge_consommation_hp_aujourdhui',
                consommation_hc_jour: 'sensor.foxcat_energy_energie_lave_linge_consommation_hc_aujourdhui',
