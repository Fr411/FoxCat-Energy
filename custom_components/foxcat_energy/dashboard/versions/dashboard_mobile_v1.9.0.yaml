    - type: custom:button-card
      show_name: false
      show_icon: false
      show_state: false
      triggers_update: all
      grid_options:
        columns: full
      styles:
        card:
        - padding: 0
        - border-radius: 30px
        - overflow: hidden
        - border: 1px solid rgba(255,255,255,0.09)
        - box-shadow: 0 24px 60px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.06)
        - background: 'radial-gradient(110% 70% at 0% 0%, rgba(255,173,66,0.12), transparent 52%), radial-gradient(100% 70% at 100% 0%, rgba(25,216,255,0.10), transparent 52%), radial-gradient(90% 60% at 50% 120%, rgba(54,229,155,0.07), transparent 60%), linear-gradient(160deg, #0c1628 0%, #070d18 100%)'
        grid:
        - grid-template-areas: '"content"'
        - grid-template-columns: 1fr
        custom_fields:
          content:
          - width: 100%
      custom_fields:
        content: |
          [[[
            /* ==========================================================
               FOXCAT ENERGY — ONDULEUR SOLAREDGE (PREMIUM, FLUX ANIMÉ)
               ========================================================== */

            /* ---------- RÉGLAGES ---------- */
            const NOMINAL_FALLBACK = 4000;   /* production max (W) si l'entité « puissance nominale » est absente */

            const E = {
              /* SolarEdge */
              ac_power: 'sensor.solaredge_ac_power',
              ac_current: 'sensor.solaredge_ac_current',
              ac_current_a: 'sensor.solaredge_ac_current_a',
              ac_current_b: 'sensor.solaredge_ac_current_b',
              ac_current_c: 'sensor.solaredge_ac_current_c',
              ac_energy: 'sensor.solaredge_ac_energy_kwh',
              ac_freq: 'sensor.solaredge_ac_frequency',
              ac_pf: 'sensor.solaredge_ac_pf',
              ac_va: 'sensor.solaredge_ac_va',
              ac_var: 'sensor.solaredge_ac_var',
              u_ab: 'sensor.solaredge_ac_voltage_ab',
              u_bc: 'sensor.solaredge_ac_voltage_bc',
              u_ca: 'sensor.solaredge_ac_voltage_ca',
              u_an: 'sensor.solaredge_ac_voltage_an',
              u_bn: 'sensor.solaredge_ac_voltage_bn',
              u_cn: 'sensor.solaredge_ac_voltage_cn',
              dc_power: 'sensor.solaredge_dc_power',
              dc_current: 'sensor.solaredge_dc_current',
              dc_voltage: 'sensor.solaredge_dc_voltage',
              status: 'sensor.solaredge_status',
              status_vendor: 'sensor.solaredge_status_vendor',
              temp: 'sensor.solaredge_temp_sink',

              /* FoxCat */
              house: '[[foxcat:legacy.sensor_foxcat_energy_energie_puissance_de_consommation_maison]]',
              pv: '[[foxcat:legacy.sensor_foxcat_energy_energie_puissance_de_production_photovoltaique]]',
              export: '[[foxcat:legacy.sensor_foxcat_energy_energie_puissance_reinjectee_au_reseau]]',
              import: '[[foxcat:legacy.sensor_foxcat_energy_energie_puissance_prelevee_au_reseau]]',
              policy: 'sensor.foxcat_energy_tarification_politique_reseau_active',
              reasonEms: '[[foxcat:legacy.sensor_foxcat_energy_ems_derniere_decision_ems]]',
              lastFrame: 'sensor.foxcat_energy_ems_derniere_trame_energetique',

              /* FoxCat · module onduleur */
              ackRrcr: 'sensor.foxcat_energy_onduleur_ack_rrcr',
              ackInverter: 'sensor.foxcat_energy_onduleur_ack_onduleur',
              ackGrid: 'sensor.foxcat_energy_onduleur_ack_reseau',
              code: 'sensor.foxcat_energy_onduleur_code_rrcr',
              reason: 'sensor.foxcat_energy_onduleur_derniere_decision_pri',
              direction: 'sensor.foxcat_energy_onduleur_direction_pri',
              priCurrent: 'sensor.foxcat_energy_onduleur_niveau_de_puissance_pri_actuel',
              priTarget: 'sensor.foxcat_energy_onduleur_niveau_de_puissance_pri_cible',
              scoreCur: 'sensor.foxcat_energy_onduleur_score_pri_actuel',
              scoreTgt: 'sensor.foxcat_energy_onduleur_score_pri_cible',
              pvTarget: 'sensor.foxcat_energy_onduleur_puissance_pv_cible_pri',
              importPlanned: 'sensor.foxcat_energy_onduleur_import_reseau_prevu_au_palier_cible',
              exportPlanned: 'sensor.foxcat_energy_onduleur_reinjection_prevue_au_palier_cible',
              houseEst: 'sensor.foxcat_energy_onduleur_charge_maison_estimee_par_bilan_reseau',
              emsState: '[[foxcat:legacy.sensor_foxcat_energy_onduleur_ems_onduleur_etat]]',
              ceilingPv: 'sensor.foxcat_energy_onduleur_ems_onduleur_plafond_pv',
              ceilingUse: 'sensor.foxcat_energy_onduleur_ems_onduleur_utilisation_plafond',
              potential: 'sensor.foxcat_energy_onduleur_ems_onduleur_potentiel_solaire',
              actuator: 'sensor.foxcat_energy_onduleur_onduleur_actionneur_rrcr',
              actuatorTarget: 'sensor.foxcat_energy_onduleur_onduleur_cible_actionneur_rrcr',
              frames: 'sensor.foxcat_energy_onduleur_onduleur_core_trames_traitees',
              nominal: 'number.foxcat_energy_onduleur_puissance_nominale_onduleur',
              activeSwitch: 'switch.foxcat_energy_onduleur_onduleur_active',
              reductionSwitch: 'switch.foxcat_energy_onduleur_reduction_de_puissance_onduleur',
              logoOnline: 'binary_sensor.nodered_1d123579a843e073',
              ackLogo: 'sensor.foxcat_energy_onduleur_ack_logo_retour_relais',
              availability: 'sensor.foxcat_energy_onduleur_onduleur_disponibilite_commande'
            };

            /* ---------- OUTILS ---------- */
            const BAD = ['unknown','unavailable','none',''];
            const raw = (id) => {
              const s = id ? states[id] : null;
              if (!s || BAD.includes(String(s.state).toLowerCase())) return null;
              const v = Number.parseFloat(s.state);
              return Number.isFinite(v) ? { v, u: String(s.attributes?.unit_of_measurement || '') } : null;
            };
            const has = (id) => !!raw(id);
            const plain = (id, fb = 0) => { const r = raw(id); return r ? r.v : fb; };
            const scaled = (id, fb = 0) => {
              const r = raw(id); if (!r) return fb;
              const p = r.u.charAt(0);
              if (r.u.length > 1 && p === 'k') return r.v * 1e3;
              if (r.u.length > 1 && p === 'M') return r.v * 1e6;
              return r.v;
            };
            const kwh = (id) => { const r = raw(id); if (!r) return null; return r.u === 'Wh' ? r.v / 1e3 : r.u === 'MWh' ? r.v * 1e3 : r.v; };
            const text = (id, fb = '—') => {
              const s = id ? states[id] : null;
              return (!s || BAD.includes(String(s.state).toLowerCase())) ? fb : s.state;
            };
            const clamp = (n, a = 0, b = 100) => Math.min(b, Math.max(a, Number(n) || 0));
            const norm = (v) => String(v ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
            const esc = (v) => String(v ?? '—').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
            const nf = (n, d = 1) => Number(n).toLocaleString('fr-BE', { minimumFractionDigits: d, maximumFractionDigits: d });
            const pw = (v) => { const n = Math.abs(Number(v) || 0); return n >= 1000 ? `${nf(n / 1000, 2)} kW` : `${Math.round(n)} W`; };
            const va = (v, unit) => { const n = Math.abs(Number(v) || 0); return n >= 1000 ? `${nf(n / 1000, 2)} k${unit}` : `${Math.round(n)} ${unit}`; };

            /* ---------- MESURES ---------- */
            const NOMINAL_W = Math.max(500, scaled(E.nominal, NOMINAL_FALLBACK));
            const acW = Math.max(0, scaled(E.ac_power));
            const dcW = Math.max(0, scaled(E.dc_power));
            const dcV = plain(E.dc_voltage), dcA = plain(E.dc_current);
            const exp = Math.max(0, scaled(E.export)), imp = Math.max(0, scaled(E.import));
            const houseW = Math.max(0, scaled(E.house));
            const toHouse = Math.max(0, acW - exp);

            const eff = dcW > 50 ? clamp((acW / dcW) * 100, 0, 100) : 0;
            const temp = plain(E.temp, NaN);
            const freq = plain(E.ac_freq, NaN);
            const pfRaw = plain(E.ac_pf, NaN);
            const pf = Number.isFinite(pfRaw) ? (Math.abs(pfRaw) > 1.5 ? pfRaw / 100 : pfRaw) : NaN;
            const sVA = scaled(E.ac_va, 0), qVar = scaled(E.ac_var, 0);
            const eTot = kwh(E.ac_energy);

            const I = [plain(E.ac_current_a), plain(E.ac_current_b), plain(E.ac_current_c)];
            const Iavg = (I[0] + I[1] + I[2]) / 3;
            const imbalance = Iavg > 0.5 ? ((Math.max(...I) - Math.min(...I)) / Iavg) * 100 : 0;
            const nominalA = NOMINAL_W / (Math.sqrt(3) * (((plain(E.u_ab, NaN) + plain(E.u_bc, NaN) + plain(E.u_ca, NaN)) / 3) || 400));
            /* Réseau tétra : tensions composées (AB/BC/CA) ~ 400 V ; tensions simples (AN/BN/CN) ~ 230 V. */
            const U = [plain(E.u_ab, NaN), plain(E.u_bc, NaN), plain(E.u_ca, NaN)];
            const Un = [plain(E.u_an, NaN), plain(E.u_bn, NaN), plain(E.u_cn, NaN)];
            const pairs = ['AB', 'BC', 'CA'];

            /* ---------- STATUT ---------- */
            const stRaw = text(E.status, '—');
            const numMap = { 1:'off', 2:'sleep', 3:'start', 4:'prod', 5:'throttle', 6:'stop', 7:'fault', 8:'standby' };
            const stN = /^\d+$/.test(String(stRaw)) ? (numMap[Number(stRaw)] || 'unk') : norm(stRaw);
            const kind =
              (stN.includes('mppt') || stN.includes('produc') || stN === 'prod') ? 'prod' :
              (stN.includes('throttl') || stN.includes('brid') || stN.includes('limit')) ? 'throttle' :
              (stN.includes('sleep') || stN.includes('veille') || stN.includes('night')) ? 'sleep' :
              (stN.includes('fault') || stN.includes('defaut') || stN.includes('erreur')) ? 'fault' :
              (stN.includes('start') || stN.includes('demarr')) ? 'start' :
              (stN.includes('standby') || stN.includes('attente')) ? 'standby' :
              (stN.includes('shut') || stN.includes('stop')) ? 'stop' :
              (stN.includes('off') || stN.includes('arret')) ? 'off' : 'unk';
            const STAT = {
              prod:     ['Production',        '#36e59b', 'mdi:solar-power-variant'],
              throttle: ['Production bridée', '#ffad42', 'mdi:speedometer-slow'],
              sleep:    ['Veille',            '#64748b', 'mdi:weather-night'],
              start:    ['Démarrage',         '#19d8ff', 'mdi:power-plug'],
              standby:  ['Attente',           '#8b9bb0', 'mdi:pause-circle-outline'],
              stop:     ['Arrêt en cours',    '#8b9bb0', 'mdi:power-sleep'],
              off:      ['Arrêté',            '#64748b', 'mdi:power-off'],
              fault:    ['Défaut',            '#fb7185', 'mdi:alert-octagon'],
              maxprod:  ['Production max',    '#36e59b', 'mdi:solar-power-variant'],
              unk:      [String(stRaw),       '#19d8ff', 'mdi:help-circle-outline']
            };
            /* ---- PRI / bridage : on ne parle de « bridée » que si la réduction PRI est réellement active ---- */
            const hasPri = has(E.priCurrent);
            const priCur = hasPri ? clamp(plain(E.priCurrent)) : 100;
            const priTgt = has(E.priTarget) ? clamp(plain(E.priTarget)) : priCur;
            const capW = NOMINAL_W * (priCur / 100);                    /* plafond effectif imposé par le PRI */
            const priReducing = priCur < 99.5;                          /* une réduction est appliquée */
            const atPriCap = priReducing && acW >= 0.92 * capW;         /* la production touche ce plafond */
            const atHwMax = acW >= 0.92 * NOMINAL_W;                    /* la production touche le max matériel */
            let effKind = kind, stNote = '';
            if (atPriCap) {
              effKind = 'throttle';
              stNote = `Plafond PRI ${Math.round(priCur)} % · ${pw(capW)}`;
            } else if (kind === 'throttle') {
              /* SolarEdge annonce « bridé » mais le PRI ne limite pas : plafond matériel ou autre cause */
              effKind = atHwMax ? 'maxprod' : 'prod';
              stNote = atHwMax ? `Maximum de l'onduleur : ${pw(NOMINAL_W)}` : 'Statut SolarEdge « bridé » sans réduction PRI';
            } else if (priReducing && kind === 'prod') {
              stNote = `PRI à ${Math.round(priCur)} % · plafond ${pw(capW)} non atteint`;
            } else if (kind === 'prod' && atHwMax) {
              effKind = 'maxprod';
              stNote = `Maximum de l'onduleur : ${pw(NOMINAL_W)}`;
            }
            const [stLabel, stColor, stIcon] = STAT[effKind];
            const producing = effKind === 'prod' || effKind === 'throttle' || effKind === 'maxprod' || acW > 30;

            /* ---------- RÉSEAU ---------- */
            let gridLabel = 'ÉQUILIBRE', gridW = 0, gridColor = '#94a3b8', gridIcon = 'mdi:transmission-tower', gridDir = 'none';
            if (exp > 30 && exp >= imp) { gridLabel = 'RÉINJECTION'; gridW = exp; gridColor = '#36e59b'; gridIcon = 'mdi:transmission-tower-export'; gridDir = 'out'; }
            else if (imp > 30) { gridLabel = 'PRÉLÈVEMENT'; gridW = imp; gridColor = '#fb7185'; gridIcon = 'mdi:transmission-tower-import'; gridDir = 'in'; }

            /* ---------- FLUX ANIMÉS ---------- */
            const flow = (id, d, w, color) => {
              const on = w > 30;
              const ratio = clamp(w / NOMINAL_W, 0, 1);
              const dur = (2.6 - ratio * 2.1).toFixed(2);
              const sw = (3 + ratio * 4).toFixed(1);
              return `
                <path d="${d}" class="track"/>
                <path d="${d}" class="dots ${on ? 'live' : 'idle'}" style="stroke:${color};stroke-width:${sw};animation-duration:${dur}s"/>`;
            };
            const pvPath = 'M160,150 L300,150';
            const acPath = 'M500,150 C575,150 575,70 640,70';
            const gridPath = gridDir === 'in' ? 'M715,180 L715,120' : 'M715,120 L715,180';

            /* ---------- TEMPÉRATURE / FRÉQUENCE ---------- */
            const tempColor = !Number.isFinite(temp) ? '#64748b' : temp < 55 ? '#36e59b' : temp < 70 ? '#ffad42' : '#fb7185';
            const freqColor = !Number.isFinite(freq) ? '#64748b' : (freq >= 49.8 && freq <= 50.2) ? '#36e59b' : '#ffad42';
            const pfColor = !Number.isFinite(pf) ? '#64748b' : Math.abs(pf) >= 0.95 ? '#36e59b' : '#ffad42';
            const effColor = eff >= 95 ? '#36e59b' : eff >= 90 ? '#facc15' : '#ffad42';

            /* ---------- COMPOSANTS ---------- */
            const R = 28, C = 2 * Math.PI * R;
            const ring = (pct, color) => `
              <svg viewBox="0 0 72 72" class="ring">
                <circle cx="36" cy="36" r="${R}" class="ring-bg"/>
                <circle cx="36" cy="36" r="${R}" class="ring-fg" transform="rotate(-90 36 36)" style="stroke:${color};stroke-dasharray:${(pct / 100 * C).toFixed(1)} ${C.toFixed(1)}"/>
                <text x="36" y="41" class="ring-num">${pct.toFixed(0)}<tspan class="ring-pct">%</tspan></text>
              </svg>`;

            const kpi = (icon, label, value, sub, color, bar = null) => `
              <div class="kpi" style="--c:${color}">
                <div class="k-top"><ha-icon icon="${icon}"></ha-icon><span>${label}</span></div>
                <div class="k-value">${value}</div>
                <div class="k-sub">${sub}</div>
                ${bar === null ? '' : `<div class="k-bar"><div style="width:${clamp(bar)}%"></div></div>`}
              </div>`;

            const phase = (i) => {
              const L = ['A', 'B', 'C'][i];
              const pct = clamp((I[i] / nominalA) * 100);
              const col = ['#ffad42', '#19d8ff', '#a78bfa'][i];
              return `
                <div class="ph" style="--c:${col}">
                  <div class="ph-head"><span class="ph-l">PHASE ${L}</span><span class="ph-u">${'ABC'[i]}N · ${Number.isFinite(Un[i]) ? nf(Un[i], 0) + ' V' : '—'}</span></div>
                  <div class="ph-i">${nf(I[i], 1)}<small> A</small></div>
                  <div class="ph-bar"><div style="width:${pct}%"></div></div>
                  <div class="ph-foot"><span>${nf(I[i] * (Number.isFinite(Un[i]) ? Un[i] : 0), 0)} VA/ph</span>${Number.isFinite(U[i]) ? `<span>U<sub>${pairs[i]}</sub> ${nf(U[i], 0)} V</span>` : ''}</div>
                </div>`;
            };

            const ackColor = (v) => { const n = norm(v); if (n.startsWith('nok') || n.includes('fail') || n.includes('erreur') || n.includes('indispon') || n.includes('absent') || n.includes('bloque')) return '#fb7185'; if (n.includes('pend') || n.includes('attente') || n.includes('queue') || n.includes('degrad')) return '#facc15'; if (n === 'ok' || n.includes('success') || n.includes('dispon')) return '#36e59b'; return '#8b9bb0'; };
            const ack = (label, v) => `
              <div class="ack"><span class="ack-l">${label}</span><i style="background:${ackColor(v)};box-shadow:0 0 9px ${ackColor(v)}"></i><strong style="color:${ackColor(v)}">${esc(v)}</strong></div>`;

            const ceilW = Math.max(0, scaled(E.ceilingPv, 0));
            const ceilUse = has(E.ceilingUse) ? clamp(plain(E.ceilingUse)) : (ceilW > 0 ? clamp((acW / ceilW) * 100) : 0);
            const dirTxt = text(E.direction, '—');
            const onOff = (id) => states[id]?.state === 'on';
            const chipSw = (label, id) => `<span class="sw ${onOff(id) ? 'on' : ''}"><i></i>${label}</span>`;
            const cell = (label, value, color) => `<div class="pw" style="--c:${color}"><span>${label}</span><strong>${value}</strong></div>`;
            const sc = (id) => has(id) ? nf(plain(id), 0) : '—';

            const decision = text(E.reason, text(E.reasonEms, 'Aucune décision EMS disponible.'));
            const frame = text(E.lastFrame, 'Aucune trame disponible');
            const policy = text(E.policy, 'Non renseignée');

            /* ==========================================================
               RENDU
               ========================================================== */
            return `
              <style>
                *{box-sizing:border-box}
                ha-icon{display:inline-flex}
                .fc{padding:26px;color:#f1f6ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif}

                /* header */
                .head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:20px}
                .brand{display:flex;align-items:center;gap:14px;min-width:0}
                .logo{width:54px;height:54px;flex:none;display:grid;place-items:center;border-radius:18px;color:#ffad42;background:linear-gradient(135deg,rgba(255,173,66,.18),rgba(25,216,255,.14));border:1px solid rgba(255,255,255,.12);box-shadow:0 0 30px rgba(255,173,66,.16),inset 0 1px 0 rgba(255,255,255,.12)}
                .logo ha-icon{--mdc-icon-size:28px}
                .eyebrow{color:#19d8ff;font-size:11px;font-weight:800;letter-spacing:.22em}
                .title{margin-top:4px;font-size:26px;font-weight:800;letter-spacing:-.02em;background:linear-gradient(90deg,#fff,#a9bbd0);-webkit-background-clip:text;background-clip:text;color:transparent}
                .sub{margin-top:3px;color:#64748b;font-size:12px}
                .status{display:flex;align-items:center;gap:9px;padding:10px 15px;border-radius:999px;border:1px solid ${stColor}50;background:${stColor}14;color:${stColor};font-size:12px;font-weight:800;letter-spacing:.06em;white-space:nowrap;box-shadow:0 0 24px ${stColor}1c}
                .status ha-icon{--mdc-icon-size:18px}
                .status i{width:7px;height:7px;border-radius:50%;background:${stColor};box-shadow:0 0 10px ${stColor};animation:pulse 2s infinite}

                /* scène de flux */
                .stage-wrap{padding:14px;border-radius:26px;background:linear-gradient(160deg,rgba(255,255,255,.045),rgba(255,255,255,.012));border:1px solid rgba(255,255,255,.08);box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
                .stage-top{display:flex;justify-content:space-between;align-items:center;padding:4px 8px 10px}
                .stage-top span{color:#8493a8;font-size:11px;font-weight:800;letter-spacing:.2em}
                .live{display:flex;align-items:center;gap:7px;color:#36e59b;font-size:10px;font-weight:800;letter-spacing:.12em}
                .live i{width:7px;height:7px;border-radius:50%;background:#36e59b;box-shadow:0 0 10px #36e59b;animation:pulse 2s infinite}
                .stage{position:relative;width:100%;aspect-ratio:800/300;container-type:inline-size}
                .stage svg.lines{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
                .track{fill:none;stroke:rgba(255,255,255,.07);stroke-width:6;stroke-linecap:round}
                .dots{fill:none;stroke-linecap:round;stroke-dasharray:1 15;filter:drop-shadow(0 0 5px currentColor)}
                .dots.live{animation:flow linear infinite}
                .dots.idle{opacity:.12}

                .node{position:absolute;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:1%;border-radius:20px;background:linear-gradient(160deg,rgba(12,22,38,.92),rgba(8,14,26,.92));border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(6px)}
                .node ha-icon{--mdc-icon-size:22px;color:var(--c)}
                .n-label{margin-top:3px;color:#7c8ba1;font-size:9px;font-weight:800;letter-spacing:.14em}
                .n-value{margin-top:3px;color:var(--c);font-size:16px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
                .n-sub{margin-top:3px;color:#64748b;font-size:10px;white-space:nowrap}
                .pv{left:1.25%;top:31.7%;width:18.75%;height:36.7%;--c:#ffad42;box-shadow:0 0 28px rgba(255,173,66,.12)}
                .inv{left:37.5%;top:23.3%;width:25%;height:53.3%;--c:${stColor};border-color:${stColor}55;box-shadow:0 0 40px ${stColor}22}
                .inv.on{animation:glow 3s ease-in-out infinite}
                .house{left:80%;top:6.7%;width:18.75%;height:33.3%;--c:#21d7ff;box-shadow:0 0 28px rgba(33,215,255,.1)}
                .grid{left:80%;top:60%;width:18.75%;height:33.3%;--c:${gridColor};box-shadow:0 0 28px ${gridColor}18}
                .inv .big{margin-top:2px;font-size:22px;font-weight:800;letter-spacing:-.03em;color:#fff;text-shadow:0 0 22px ${stColor}66}
                .inv .mini{display:flex;gap:10px;margin-top:5px;color:#8b9bb0;font-size:10px;font-weight:700}
                .inv .mini b{color:#e2e8f0}

                @supports (font-size:1cqw){
                  .node ha-icon{--mdc-icon-size:clamp(14px,3.3cqw,28px)}
                  .n-label{font-size:clamp(7px,1.25cqw,11px)}
                  .n-value{font-size:clamp(11px,2.5cqw,21px)}
                  .n-sub{font-size:clamp(7px,1.35cqw,12px)}
                  .inv .big{font-size:clamp(14px,3.6cqw,30px)}
                  .inv .mini{font-size:clamp(7px,1.4cqw,12px);gap:1.2cqw}
                }

                /* KPI */
                .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:14px}
                .kpi{position:relative;overflow:hidden;min-width:0;padding:16px;border-radius:20px;background:linear-gradient(160deg,rgba(255,255,255,.04),rgba(255,255,255,.012));border:1px solid rgba(255,255,255,.07);transition:transform .25s,border-color .25s}
                .kpi:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.14)}
                .kpi::before{content:"";position:absolute;inset:0 0 auto 0;height:2px;background:linear-gradient(90deg,var(--c),transparent 85%)}
                .k-top{display:flex;align-items:center;gap:8px;color:#7c8ba1;font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
                .k-top ha-icon{--mdc-icon-size:18px;color:var(--c)}
                .k-value{margin-top:12px;color:var(--c);font-size:26px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
                .k-value small{font-size:13px;color:#8b9bb0;font-weight:700}
                .k-sub{margin-top:4px;color:#64748b;font-size:11px}
                .k-bar{height:6px;margin-top:11px;border-radius:999px;background:rgba(255,255,255,.06);overflow:hidden}
                .k-bar div{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--c),#fff);box-shadow:0 0 10px var(--c);transition:width .8s}
                .eff{display:flex;align-items:center;gap:12px}
                .ring{width:62px;height:62px;flex:none}
                .ring-bg{fill:none;stroke:rgba(255,255,255,.07);stroke-width:6}
                .ring-fg{fill:none;stroke-width:6;stroke-linecap:round;transition:stroke-dasharray .8s}
                .ring-num{fill:#f8fafc;font-size:15px;font-weight:800;text-anchor:middle}
                .ring-pct{font-size:8px;fill:#94a3b8}

                /* sections */
                .sec{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:26px 2px 12px}
                .sec span{color:#8493a8;font-size:11px;font-weight:800;letter-spacing:.2em}
                .sec small{color:#475569;font-size:10px;font-weight:700;letter-spacing:.1em}

                .phases{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
                .ph{padding:16px;border-radius:20px;background:linear-gradient(160deg,rgba(255,255,255,.04),rgba(255,255,255,.012));border:1px solid rgba(255,255,255,.07)}
                .ph-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
                .ph-l{color:var(--c);font-size:11px;font-weight:800;letter-spacing:.14em}
                .ph-u{color:#64748b;font-size:11px;font-weight:600}
                .ph-i{margin-top:10px;font-size:30px;font-weight:800;letter-spacing:-.03em}
                .ph-i small{font-size:14px;color:#8b9bb0}
                .ph-bar{height:7px;margin-top:10px;border-radius:999px;background:rgba(255,255,255,.06);overflow:hidden}
                .ph-bar div{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--c),#fff);box-shadow:0 0 12px var(--c);transition:width .8s}
                .ph-foot{display:flex;justify-content:space-between;margin-top:9px;color:#64748b;font-size:11px}
                .bal{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;padding:12px 16px;border-radius:16px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);color:#7c8ba1;font-size:12px}
                .bal strong{font-size:13px}

                .power{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
                .pw{padding:15px;border-radius:18px;background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.06)}
                .pw span{display:block;color:#7c8ba1;font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
                .pw strong{display:block;margin-top:7px;color:var(--c);font-size:18px;font-weight:800}

                .pri{padding:20px;margin-bottom:6px;border-radius:22px;border:1px solid rgba(250,204,21,.18);background:linear-gradient(120deg,rgba(250,204,21,.08),rgba(255,255,255,.015) 60%,rgba(25,216,255,.05))}
                .pri-top{display:flex;justify-content:space-between;align-items:flex-end}
                .pri-top .l{color:#8293aa;font-size:11px;font-weight:800;letter-spacing:.14em}
                .pri-top .v{margin-top:6px;font-size:44px;line-height:1;font-weight:800;color:#facc15;letter-spacing:-.03em}
                .pri-top .t{text-align:right;font-size:22px;font-weight:800}
                .pri-bar{height:10px;margin-top:16px;border-radius:999px;background:rgba(255,255,255,.07);overflow:hidden}
                .pri-bar div{height:100%;border-radius:999px;background:linear-gradient(90deg,#fb7185,#facc15 52%,#36e59b)}
                .pri-foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-top:12px;color:#7c8ba1;font-size:12px}
                .pri-foot b{color:#e2e8f0}
                .sws{display:flex;flex-wrap:wrap;gap:8px}
                .sw{display:flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.06em;color:#64748b;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06)}
                .sw i{width:7px;height:7px;border-radius:50%;background:#475569}
                .sw.on{color:#36e59b;border-color:rgba(54,229,155,.25);background:rgba(54,229,155,.07)}
                .sw.on i{background:#36e59b;box-shadow:0 0 9px #36e59b}

                .acks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
                .ack{display:flex;align-items:center;gap:9px;padding:13px 14px;border-radius:15px;background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.06)}
                .ack-l{color:#8293aa;font-size:10px;font-weight:800;letter-spacing:.08em}
                .ack i{width:7px;height:7px;border-radius:50%;flex:none}
                .ack strong{margin-left:auto;font-size:11px;text-align:right;overflow-wrap:anywhere}

                .dec{display:flex;gap:15px;align-items:flex-start;margin-top:14px;padding:18px;border-radius:20px;border:1px solid ${stColor}30;background:linear-gradient(135deg,${stColor}12,${stColor}04)}
                .dec-ico{width:46px;height:46px;flex:none;display:grid;place-items:center;border-radius:14px;color:${stColor};background:${stColor}18;box-shadow:0 0 22px ${stColor}28}
                .dec-ico ha-icon{--mdc-icon-size:24px}
                .dec-t{color:${stColor};font-size:11px;font-weight:800;letter-spacing:.16em}
                .dec-x{margin-top:6px;color:#cbd5e1;font-size:13px;line-height:1.55;overflow-wrap:anywhere}

                .foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-top:18px;padding-top:14px;border-top:1px solid rgba(255,255,255,.05);color:#475569;font-size:10px;letter-spacing:.08em;line-height:1.5}

                @keyframes flow{to{stroke-dashoffset:-16}}
                @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.8)}}
                @keyframes glow{0%,100%{box-shadow:0 0 34px ${stColor}1a}50%{box-shadow:0 0 56px ${stColor}40}}

                @media(max-width:850px){.kpis,.power{grid-template-columns:repeat(2,minmax(0,1fr))}}
                @media(max-width:650px){
                  .fc{padding:16px}
                  .title{font-size:21px}
                  .head{align-items:flex-start;flex-direction:column}
                  .phases,.acks{grid-template-columns:1fr}
                  .stage-wrap{padding:8px}
                  .node{border-radius:12px}
                }
                @media(prefers-reduced-motion:reduce){.dots.live,.inv.on,.status i,.live i{animation:none}}
              </style>

              <div class="fc">

                <div class="head">
                  <div class="brand">
                    <div class="logo"><ha-icon icon="mdi:solar-power-variant"></ha-icon></div>
                    <div>
                      <div class="eyebrow">FOXCAT ENERGY</div>
                      <div class="title">Onduleur SolarEdge</div>
                      <div class="sub">EMS Core · SolarEdge · RRCR${stNote ? ' · ' + esc(stNote) : ''}</div>
                    </div>
                  </div>
                  <div class="status"><ha-icon icon="${stIcon}"></ha-icon>${esc(stLabel.toUpperCase())}<i></i></div>
                </div>

                ${hasPri ? `
                <div class="pri">
                  <div class="pri-top">
                    <div><div class="l">NIVEAU ONDULEUR ACTUEL</div><div class="v">${Math.round(priCur)}<small style="font-size:18px"> %</small></div></div>
                    <div><div class="l" style="text-align:right">CIBLE EMS</div><div class="t">${Math.round(priTgt)} %</div></div>
                  </div>
                  <div class="pri-bar"><div style="width:${priCur}%"></div></div>
                  <div class="pri-foot"><span>Direction <b>${esc(dirTxt)}</b></span><span>Plafond effectif <b>${pw(capW)}</b></span><span>Max onduleur <b>${pw(NOMINAL_W)}</b></span></div>
                </div>` : ''}

                <div class="stage-wrap">
                  <div class="stage-top">
                    <span>FLUX D'ÉNERGIE</span>
                    <div class="live"><i></i>TEMPS RÉEL</div>
                  </div>
                  <div class="stage">
                    <svg class="lines" viewBox="0 0 800 300" preserveAspectRatio="none">
                      ${flow('pv', pvPath, dcW, '#ffad42')}
                      ${flow('ac', acPath, toHouse, '#21d7ff')}
                      ${flow('grid', gridPath, gridW, gridColor)}
                    </svg>

                    <div class="node pv">
                      <ha-icon icon="mdi:solar-panel-large"></ha-icon>
                      <div class="n-label">CHAMP PV · DC</div>
                      <div class="n-value">${pw(dcW)}</div>
                      <div class="n-sub">${nf(dcV, 0)} V · ${nf(dcA, 1)} A</div>
                    </div>

                    <div class="node inv ${producing ? 'on' : ''}">
                      <ha-icon icon="mdi:current-ac"></ha-icon>
                      <div class="n-label">SORTIE AC</div>
                      <div class="big">${pw(acW)}</div>
                      <div class="mini"><span>η <b>${eff > 0 ? nf(eff, 1) + ' %' : '—'}</b></span><span><b>${Number.isFinite(temp) ? nf(temp, 0) + ' °C' : '—'}</b></span></div>
                    </div>

                    <div class="node house">
                      <ha-icon icon="mdi:home-lightning-bolt"></ha-icon>
                      <div class="n-label">MAISON</div>
                      <div class="n-value">${pw(houseW)}</div>
                      <div class="n-sub">${toHouse > 30 ? 'solaire ' + pw(toHouse) : 'pas de solaire'}</div>
                    </div>

                    <div class="node grid">
                      <ha-icon icon="${gridIcon}"></ha-icon>
                      <div class="n-label">${gridLabel}</div>
                      <div class="n-value">${pw(gridW)}</div>
                      <div class="n-sub">${esc(policy)}</div>
                    </div>
                  </div>
                </div>

                <div class="kpis">
                  <div class="kpi" style="--c:${effColor}">
                    <div class="k-top"><ha-icon icon="mdi:swap-horizontal-bold"></ha-icon><span>Rendement</span></div>
                    <div class="eff">${ring(eff, effColor)}<div><div class="k-sub" style="margin:0">DC ${pw(dcW)}</div><div class="k-sub">AC ${pw(acW)}</div></div></div>
                  </div>
                  ${kpi('mdi:thermometer', 'Dissipateur', Number.isFinite(temp) ? `${nf(temp, 1)}<small> °C</small>` : '—', !Number.isFinite(temp) ? 'Sonde indisponible' : temp < 55 ? 'Température normale' : temp < 70 ? 'Température élevée' : 'Surchauffe', tempColor, Number.isFinite(temp) ? (temp / 90) * 100 : 0)}
                  ${kpi('mdi:sine-wave', 'Fréquence', Number.isFinite(freq) ? `${nf(freq, 2)}<small> Hz</small>` : '—', !Number.isFinite(freq) ? 'Mesure indisponible' : (freq >= 49.8 && freq <= 50.2) ? 'Réseau stable' : 'Hors plage nominale', freqColor)}
                  ${kpi('mdi:angle-acute', 'Facteur de puissance', Number.isFinite(pf) ? nf(pf, 2) : '—', 'cos φ', pfColor, Number.isFinite(pf) ? Math.abs(pf) * 100 : 0)}
                </div>

                <div class="sec"><span>COURANTS PAR PHASE</span><small>RÉSEAU TÉTRA · TENSIONS COMPOSÉES</small></div>
                <div class="phases">${phase(0)}${phase(1)}${phase(2)}</div>
                <div class="bal">
                  <span>Déséquilibre des phases</span>
                  <strong style="color:${imbalance < 10 ? '#36e59b' : imbalance < 25 ? '#facc15' : '#fb7185'}">${nf(imbalance, 1)} % · I<sub>moy</sub> ${nf(Iavg, 1)} A</strong>
                </div>

                <div class="sec"><span>QUALITÉ DU COURANT AC</span><small>PUISSANCES &amp; ÉNERGIE</small></div>
                <div class="power">
                  <div class="pw" style="--c:#21d7ff"><span>Active</span><strong>${pw(acW)}</strong></div>
                  <div class="pw" style="--c:#a78bfa"><span>Apparente</span><strong>${va(sVA, 'VA')}</strong></div>
                  <div class="pw" style="--c:#facc15"><span>Réactive</span><strong>${va(qVar, 'var')}</strong></div>
                  <div class="pw" style="--c:#36e59b"><span>Énergie AC cumulée</span><strong>${eTot === null ? '—' : eTot >= 1000 ? nf(eTot / 1000, 2) + ' MWh' : nf(eTot, 1) + ' kWh'}</strong></div>
                </div>

                <div class="sec"><span>PILOTAGE PRI</span><small>EMS ONDULEUR</small></div>
                <div class="sws">
                  ${chipSw('Onduleur actif', E.activeSwitch)}
                  ${chipSw('Réduction de puissance', E.reductionSwitch)}
                  ${chipSw('LOGO en ligne', E.logoOnline)}
                </div>
                <div class="bal" style="margin-top:12px">
                  <span>Utilisation du plafond PV · ${pw(ceilW)}</span>
                  <strong style="color:#21d7ff">${nf(ceilUse, 0)} %</strong>
                </div>
                <div class="k-bar" style="--c:#21d7ff;margin:8px 2px 14px"><div style="width:${ceilUse}%"></div></div>
                <div class="power">
                  ${cell('État EMS', esc(text(E.emsState)), stColor)}
                  ${cell('Potentiel solaire', esc(text(E.potential)), '#ffad42')}
                  ${cell('Score PRI', `${sc(E.scoreCur)} → ${sc(E.scoreTgt)}`, '#a78bfa')}
                  ${cell('PV cible PRI', pw(scaled(E.pvTarget, 0)), '#facc15')}
                  ${cell('Import prévu (palier cible)', pw(scaled(E.importPlanned, 0)), '#fb7185')}
                  ${cell('Réinjection prévue (palier cible)', pw(scaled(E.exportPlanned, 0)), '#36e59b')}
                  ${cell('Charge maison estimée', pw(scaled(E.houseEst, 0)), '#21d7ff')}
                  ${cell('Actionneur RRCR', `${esc(text(E.actuator))} → ${esc(text(E.actuatorTarget))}`, '#8b9bb0')}
                </div>

                <div class="sec"><span>COMMUNICATION ENERGYBUS</span><small>ACQUITTEMENTS</small></div>
                <div class="acks">
                  ${ack('ACK RRCR', text(E.ackRrcr))}
                  ${ack('ACK ONDULEUR', text(E.ackInverter))}
                  ${ack('ACK RÉSEAU', text(E.ackGrid))}
                  ${ack('ACK LOGO', text(E.ackLogo))}
                  ${ack('COMMANDE', text(E.availability))}
                </div>

                <div class="dec">
                  <div class="dec-ico"><ha-icon icon="mdi:brain"></ha-icon></div>
                  <div>
                    <div class="dec-t">DÉCISION EMS ONDULEUR</div>
                    <div class="dec-x">${esc(decision)}</div>
                  </div>
                </div>

                <div class="foot">
                  <span>EMS Core ↔ EnergyBus ↔ EMS Onduleur · Code vendeur ${esc(text(E.status_vendor))}${has(E.code) ? ' · RRCR ' + esc(text(E.code)) : ''}</span>
                  <span>Trames traitées : ${esc(text(E.frames))} · Dernière trame : ${esc(frame)}</span>
                </div>

              </div>
            `;
          ]]]
      tap_action:
        action: none
      hold_action:
        action: none
      double_tap_action:
        action: none
