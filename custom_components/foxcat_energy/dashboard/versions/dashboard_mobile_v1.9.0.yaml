          } else if (CFG.kind === 'dryer') {
            scene = `
              <clipPath id="${uid}c"><circle cx="50" cy="50" r="31"/></clipPath>
              <radialGradient id="${uid}g"><stop offset="0" stop-color="${col}" stop-opacity="${running ? .55 : .12}"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></radialGradient>
              <circle cx="50" cy="50" r="36" fill="rgba(255,255,255,.05)" stroke="${col}" stroke-opacity=".55" stroke-width="2.4"/>
              <g fill="${col}" opacity=".5" style="${rot(14, true)}">${holes(33.6, 12, .9)}</g>
              <circle cx="50" cy="50" r="31" fill="#07101d"/>
              <circle cx="50" cy="50" r="31" fill="url(#${uid}g)" style="${running ? AA('fx-breath', 1.8, 'ease-in-out') : 'opacity:.5'}"/>
              <g clip-path="url(#${uid}c)">
                <g stroke="rgba(255,255,255,.14)" stroke-width="2.2" stroke-linecap="round" style="${rot(sp)}">
                  <path d="M50 19 V30 M76.8 65.5 L67.3 60 M23.2 65.5 L32.7 60"/>
                </g>
                ${clothes}
                ${running ? [0,1,2].map(i => `<path d="M${36+i*14} 74 q4 -6 0 -12 t0 -12" fill="none" stroke="${col}" stroke-width="2" stroke-linecap="round" style="${A('fx-heat', 2, 'ease-in-out', i * .5)}"/>`).join('') : ''}
                ${parts(6, 28, 72, 78, 40, 1.4, '#fde68a')}
                ${glint}
              </g>
              ${rim}`;
          } else if (CFG.kind === 'dish') {
            scene = `
              <clipPath id="${uid}c"><rect x="17" y="17" width="66" height="66" rx="12"/></clipPath>
              <rect x="15" y="15" width="70" height="70" rx="14" fill="rgba(255,255,255,.05)" stroke="${col}" stroke-opacity=".55" stroke-width="2.4"/>
              <rect x="17" y="17" width="66" height="66" rx="12" fill="#07101d"/>
              <g clip-path="url(#${uid}c)">
                <g opacity="${running ? .12 : 0}"><rect x="17" y="17" width="66" height="66" fill="${col}" style="${running ? AA('fx-breath', 2.2, 'ease-in-out') : ''}"/></g>
                <rect x="17" y="62" width="66" height="22" fill="${col}" opacity="${running ? .2 : .06}"/>
                <g style="${A('fx-wave', 2.4)}">${wave(80, col + '44')}</g>
                <g stroke="rgba(255,255,255,.35)" stroke-width="1.4" fill="none" stroke-linecap="round">
                  <path d="M24 66 h52"/><path d="M26 66 v-10 M34 66 v-10 M42 66 v-10 M58 66 v-10 M66 66 v-10 M74 66 v-10"/>
                  <ellipse cx="30" cy="56" rx="2" ry="9"/><ellipse cx="46" cy="56" rx="2" ry="9"/><ellipse cx="62" cy="56" rx="2" ry="9"/><ellipse cx="72" cy="56" rx="2" ry="9"/>
                </g>
                <g style="${rot(+(sp * .7).toFixed(1), false, 50, 41.7)}">
                  <rect x="24" y="40" width="52" height="3.4" rx="1.7" fill="${col}"/>
                  <circle cx="50" cy="41.7" r="3.4" fill="#fff" opacity=".9"/>
                  ${running ? `<path d="M25 40 q-2 -5 2 -9 M75 43.4 q2 5 -2 9" stroke="${col}" stroke-width="1.2" stroke-dasharray="1.5 2" fill="none" stroke-linecap="round" style="${A('fx-flow', .5)}"/>` : ''}
                </g>
                ${running ? Array.from({ length: 10 }, (_, i) => `<circle cx="${(22 + i * 6.2).toFixed(1)}" cy="44" r="1.4" fill="${col}" style="${A('fx-drop', 1.5, 'ease-in', i * .19)}"/>`).join('') : ''}
                ${parts(6, 22, 78, 82, 14, 1.6)}
                ${running ? steam([36, 50, 64], 30) : ''}
                ${glint}
              </g>
              <circle cx="50" cy="80" r="1.8" fill="${running ? scol : 'rgba(255,255,255,.3)'}" style="${running ? AA('fx-dot', 1.2, 'ease-in-out') : ''}"/>`;
          } else {
            scene = `
              <clipPath id="${uid}c"><rect x="29" y="14" width="42" height="72" rx="14"/></clipPath>
              ${steamOn ? steam([42, 50, 58], 9) : ''}
              <rect x="27" y="12" width="46" height="76" rx="16" fill="rgba(255,255,255,.05)" stroke="${col}" stroke-opacity=".55" stroke-width="2.4"/>
              <rect x="29" y="14" width="42" height="72" rx="14" fill="#07101d"/>
              <g clip-path="url(#${uid}c)">
                <g style="${AA('fx-wave', running ? 2.2 : 4.5)}">${wave(36, wcol + '99')}</g>
                <g style="${AA('fx-wave', running ? 3.4 : 6.5, 'linear', 0, 'infinite reverse')}">${wave(41, wcol + '55')}</g>
                <g opacity="${running ? .6 : 0}"><ellipse cx="50" cy="74" rx="17" ry="9" fill="${col}" style="filter:blur(3px);${running ? AA('fx-breath', 1.6, 'ease-in-out') : ''}"/></g>
                ${running ? `<path d="M50 68 C 44 58, 56 50, 50 42" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1.2" stroke-dasharray="2 5" stroke-linecap="round" style="${A('fx-flow', .9)}"/>` : ''}
                <path d="M36 74 h6 l3 -7 l6 14 l6 -14 l3 7 h6" fill="none" stroke="${running ? col : 'rgba(255,255,255,.35)'}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="${running ? 'filter:drop-shadow(0 0 2px ' + col + ');' + A('fx-zig', 1.2, 'ease-in-out') : ''}"/>
                ${running ? `<path d="M36 74 h6 l3 -7 l6 14 l6 -14 l3 7 h6" fill="none" stroke="#fff7d6" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 50" style="${A('fx-coil', 1.2)}"/>` : ''}
                ${parts(7, 34, 66, 70, 34, 1.6)}
                ${glint}
              </g>
              <path d="M36 22 q-1 12 0 22" stroke="rgba(255,255,255,.3)" stroke-width="2" fill="none" stroke-linecap="round"/>`;
          }

          /* ---------- ANNEAU DE PUISSANCE ---------- */
          const ring = `
            <circle cx="50" cy="50" r="${R}" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="3" style="${!running && !unavailable ? AA('fx-idle', 4, 'ease-in-out') : ''}"/>
            <circle cx="50" cy="50" r="${R}" fill="none" stroke="${col}" stroke-width="3" stroke-linecap="round"
              stroke-dasharray="${(C*pct).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 50 50)" style="${running ? 'filter:drop-shadow(0 0 3px ' + col + ')' : ''}"/>
            ${running ? `
            <circle cx="50" cy="50" r="51" fill="none" stroke="${col}" stroke-opacity=".4" stroke-width=".8" stroke-dasharray="1.5 4" style="${rot(10, true)}"/>
            <circle cx="50" cy="50" r="${R}" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-dasharray="0.1 ${C.toFixed(1)}" style="filter:drop-shadow(0 0 3px ${col});${rot(2.4)}"/>` : ''}`;

          const chip = (label, v, c) => `
            <div class="fx-chip">
              <div style="font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:rgba(226,232,240,.55);font-weight:700">${label}</div>
              <div style="font-size:13px;font-weight:700;color:${c||'#f1f5f9'};margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${v}</div>
            </div>`;
          const chips = [
            V.temp ? chip('Température', tC == null ? '—' : tC.toFixed(1) + ' °C', '#fb923c') : '',
            CFG.energy ? chip('Énergie jour', kwh == null ? '—' : kwh.toFixed(2) + ' kWh') : '',
            CFG.cycle ? chip('Cycle', esc(cycleRaw == null ? '—' : cycleRaw)) : '',
            cmdTxt ? chip('Commande', cmdTxt, '#a78bfa') : '',
            chip('Prise', plugOn == null ? '—' : (plugOn ? 'ON' : 'OFF'), plugOn ? '#34d399' : '#fb7185')
          ].filter(Boolean).slice(0,3).join('');

          return `
          <style>
            .${uid},.${uid} *{box-sizing:border-box}
            .${uid}{position:relative;overflow:hidden;margin:6px;padding:1.5px;border-radius:24px;background:rgba(255,255,255,.07);font-family:'Inter','Segoe UI',system-ui,sans-serif;color:#f1f5f9;transition:transform .25s}
            .${uid}:hover{transform:translateY(-2px)}
            .${uid}.on{background:${col}30;box-shadow:0 0 30px ${col}26}
            .${uid}.on::before{content:"";position:absolute;inset:-60%;background:conic-gradient(from 0deg,transparent 0 62%,${col} 82%,#fff 86%,transparent 92%);${AA('fx-spin', 4.5)}}
            .${uid} .fx-in{position:relative;z-index:1;border-radius:22.5px;padding:16px 14px 14px;background:radial-gradient(110% 70% at 50% 0%, ${col}22, transparent 60%),linear-gradient(180deg,#0d1828,#0a1220);box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
            .${uid} .fx-led{position:relative;flex:none;width:6px;height:6px;border-radius:50%;background:${scol};box-shadow:0 0 8px ${scol}}
            .${uid} .fx-led::after{content:"";position:absolute;inset:0;border-radius:50%;border:1.5px solid ${scol};${running ? AA('fx-ping', 1.4, 'ease-out') : 'display:none'}}
            .${uid} .fx-num{font-size:40px;line-height:1;font-weight:800;letter-spacing:-.03em;color:${running ? '#fff' : 'rgba(241,245,249,.7)'};${running ? AA('fx-num', 2.4, 'ease-in-out') : ''}}
            .${uid} .fx-bar{margin:12px 0;height:6px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;position:relative}
            .${uid} .fx-fill{height:100%;width:${(pct*100).toFixed(0)}%;border-radius:99px;background:repeating-linear-gradient(-45deg,rgba(255,255,255,${running ? .2 : 0}) 0 5px,transparent 5px 10px),linear-gradient(90deg,${col}99,${col});background-size:14px 14px,100% 100%;transition:width .8s ease;${running ? AA('fx-stripes', .7) : ''}}
            .${uid} .fx-sheen{position:absolute;top:0;bottom:0;left:-30%;width:30%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);${AA('fx-sheen', 2.2)}}
            .${uid} .fx-chip{position:relative;overflow:hidden;flex:1;min-width:0;padding:8px 10px;border-radius:13px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.07)}
            .${uid} .fx-chip::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.07),transparent);transform:skewX(-20deg);${AA('fx-gleam', 7, 'ease-in-out')}}
            .${uid} .fx-chip:nth-child(2)::after{animation-delay:${ph(7, 1.2)}}
            .${uid} .fx-chip:nth-child(3)::after{animation-delay:${ph(7, 2.4)}}
            .${uid} .fx-stm{transform-box:fill-box;transform-origin:center;filter:blur(1.5px)}
            @keyframes fx-spin{to{transform:rotate(360deg)}}
            @keyframes fx-spinr{to{transform:rotate(-360deg)}}
            @keyframes fx-wave{from{transform:translateX(0)}to{transform:translateX(-50px)}}
            @keyframes fx-slosh{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
            @keyframes fx-bub{0%{transform:translate(0,0);opacity:0}15%{opacity:.75}50%{transform:translate(1.5px,calc(var(--h) * .5))}100%{transform:translate(-1px,var(--h));opacity:0}}
            @keyframes fx-heat{0%{transform:translateY(6px);opacity:0}30%{opacity:.9}100%{transform:translateY(-10px);opacity:0}}
            @keyframes fx-drop{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(30px);opacity:0}}
            @keyframes fx-steam{0%{transform:translate(0,4px) scale(.5);opacity:0}30%{opacity:.5}100%{transform:translate(2px,-14px) scale(1.7);opacity:0}}
            @keyframes fx-glint{0%,60%{transform:translateX(0) skewX(-18deg)}100%{transform:translateX(150px) skewX(-18deg)}}
            @keyframes fx-breath{0%,100%{opacity:.45}50%{opacity:1}}
            @keyframes fx-coil{from{stroke-dashoffset:60}to{stroke-dashoffset:0}}
            @keyframes fx-flow{to{stroke-dashoffset:-7}}
            @keyframes fx-zig{0%,100%{opacity:.75}50%{opacity:1}}
            @keyframes fx-shake{0%,100%{transform:translate(0,0)}25%{transform:translate(-.6px,.4px)}50%{transform:translate(.5px,-.5px)}75%{transform:translate(-.4px,-.3px)}}
            @keyframes fx-glow{0%,100%{filter:drop-shadow(0 0 3px var(--c))}50%{filter:drop-shadow(0 0 11px var(--c))}}
            @keyframes fx-ping{0%{transform:scale(.6);opacity:1}100%{transform:scale(2.6);opacity:0}}
            @keyframes fx-dot{0%,100%{opacity:1}50%{opacity:.35}}
            @keyframes fx-idle{0%,100%{opacity:.5}50%{opacity:1}}
            @keyframes fx-num{0%,100%{text-shadow:0 0 8px var(--cg)}50%{text-shadow:0 0 24px var(--c)}}
            @keyframes fx-stripes{to{background-position:14px 0,0 0}}
            @keyframes fx-sheen{from{left:-30%}to{left:100%}}
            @keyframes fx-gleam{0%,70%{left:-60%}100%{left:130%}}
            @media (prefers-reduced-motion: reduce){.${uid} *,.${uid}::before,.${uid} *::after{animation:none!important}}
          </style>
          <div class="fxT ${uid} ${running ? 'on' : ''}" style="--c:${col};--cg:${col}55">
            <div class="fx-in">
              <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap">
                <div style="min-width:0">
                  <div style="font-size:17px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(CFG.name)}</div>
                  <div style="font-size:11.5px;color:rgba(226,232,240,.6);margin-top:2px">${esc(CFG.sub)}</div>
                </div>
                <div style="display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:${scol}1f;border:1px solid ${scol}55;font-size:10px;font-weight:800;letter-spacing:.08em;color:${scol};white-space:nowrap">
                  <span class="fx-led"></span>${status}
                </div>
              </div>
              <div style="display:flex;justify-content:center;margin:8px 0 2px">
                <svg viewBox="0 0 100 100" width="168" height="168" style="max-width:100%;overflow:visible;${running ? AA('fx-glow', 2.6, 'ease-in-out') : ''}">${ring}<g style="${shake ? A('fx-shake', .22) : ''}">${scene}</g></svg>
              </div>
              <div style="text-align:center">
                <div style="display:inline-flex;align-items:baseline;gap:6px">
                  <span class="fx-num">${wTxt}</span>
                  <span style="font-size:16px;font-weight:700;color:${col}">${wUnit}</span>
                </div>
                <div style="font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:rgba(226,232,240,.5);font-weight:700;margin-top:3px">Puissance · ${(pct*100).toFixed(0)} % de ${CFG.maxW} W</div>
              </div>
              <div class="fx-bar"><div class="fx-fill"></div>${running ? '<div class="fx-sheen"></div>' : ''}</div>
              <div style="display:flex;gap:7px">${chips}</div>
            </div>
          </div>`;
        ]]]
      t4: |-
        [[[
          /* ===== À MODIFIER : entités de cet appareil ===== */
          const V = {name: "Lave-vaisselle", sub: "Cycle vaisselle", icon: "mdi:dishwasher", col: "#34d399", cy: "sensor.lave_vaisselle_cycle", pw: "[[foxcat:legacy.sensor_lave_vaisselle_puissance]]", sw: "[[foxcat:machines.dishwasher.switch]]", max: 2200, spin: false, energy: "", cmd_sensor: "sensor.foxcat_energy_fonctions_utilisateur_lave_vaisselle_commande_utilisateur", kind: "dish"};
          /* ===== fin ===== */

          const CFG = {
            name: V.name, sub: V.sub, icon: V.icon, kind: V.kind, color: V.col || '#60a5fa', maxW: Number(V.max) || 2200,
            power: V.pw, energy: V.energy || '', cycle: V.cy || '', plug: V.sw || '', cmd: V.cmd_sensor || '',
            idle: ['idle','off','none','unknown','unavailable','standby','ready','','termine','terminé','fin']
          };
          const st = (id) => (id && states[id]) ? states[id] : null;
          const val = (id) => { const s = st(id); return s ? s.state : null; };
          const num = (id) => { const v = parseFloat(val(id)); return isFinite(v) ? v : null; };
          const clamp = (x,a,b) => Math.min(b, Math.max(a, x));
          const esc = (t) => String(t ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
          const w = num(CFG.power), kwh = num(CFG.energy);
          const cycleRaw = val(CFG.cycle), cmdRaw = val(CFG.cmd);
          const plugOn = st(CFG.plug) ? val(CFG.plug) === 'on' : null;
          const cycleActive = cycleRaw != null && !CFG.idle.includes(String(cycleRaw).toLowerCase());
          const running = (w != null && w > 20) || cycleActive;
          const unavailable = [CFG.power, CFG.plug].filter(Boolean).every(id => !st(id) || val(id) === 'unavailable');
          let status, scol;
          if (unavailable)          { status = 'INDISPONIBLE'; scol = '#94a3b8'; }
          else if (plugOn === false){ status = 'PRISE OFF';    scol = '#fb7185'; }
          else if (running)         { status = 'EN COURS';     scol = CFG.color; }
          else                      { status = 'PRÊT';         scol = '#34d399'; }
          const col = CFG.color;
          const pct = w != null ? clamp(w / CFG.maxW, 0, 1) : 0;
          const R = 47, C = 2 * Math.PI * R;
          const wTxt = w == null ? '—' : (w >= 1000 ? (w/1000).toFixed(2) : Math.round(w));
          const wUnit = w != null && w >= 1000 ? 'kW' : 'W';
          const cmdMap = { auto:'AUTO', off:'OFF', start:'DÉMARRAGE', demarrage:'DÉMARRAGE', on:'ON' };
          const cmdTxt = (cmdRaw == null || ['unknown','unavailable'].includes(cmdRaw)) ? null : (cmdMap[String(cmdRaw).toLowerCase()] || String(cmdRaw).toUpperCase());
          const uid = 'fx' + String(CFG.kind).replace(/\W/g,'');

          /* ---------- ANIMATIONS EN PHASE ----------
             Délai négatif calé sur l'horloge : quand la puissance se met à jour et que
             la tuile se redessine, les animations continuent sans repartir de zéro. */
          const NOW = Date.now() / 1000;
          const ph = (d, o = 0) => `-${((NOW + o) % d).toFixed(2)}s`;
          const PS = running ? 'running' : 'paused';
          const A  = (n, d, tf = 'linear', o = 0, x = 'infinite') => `animation:${n} ${d}s ${tf} ${ph(d, o)} ${x};animation-play-state:${PS};`;
          const AA = (n, d, tf = 'linear', o = 0, x = 'infinite') => `animation:${n} ${d}s ${tf} ${ph(d, o)} ${x};`;
          const rot = (d, rev = false, ox = 50, oy = 50) => `transform-origin:${ox}px ${oy}px;${A(rev ? 'fx-spinr' : 'fx-spin', d)}`;

          /* vitesse du tambour / du bras selon la puissance (paliers de 0,2 s) */
          const sp = running ? Math.max(0.8, Math.round((3.4 - 2.6 * pct) * 5) / 5) : 3.4;
          const shake = running && pct > 0.6 && CFG.kind === 'washer';

          /* boiler : couleur de l'eau selon la température */
          const tC = num(V.temp);
          const heat = (v) => v == null ? col : v < 35 ? '#38bdf8' : v < 45 ? '#22d3ee' : v < 55 ? '#fbbf24' : v < 65 ? '#fb923c' : '#f87171';
          const wcol = CFG.kind === 'boiler' ? heat(tC) : col;
          const steamOn = running || (tC != null && tC >= 50);

          /* ---------- BRIQUES SVG ---------- */
          const wave = (y, fill) => `<path d="M-50 ${y} q12.5 -5 25 0 t25 0 t25 0 t25 0 t25 0 t25 0 t25 0 t25 0 V110 H-50 Z" fill="${fill}"/>`;
          const parts = (n, x0, x1, y, h, d0, fill = '#fff') => !running ? '' : Array.from({ length: n }, (_, i) => {
            const x = x0 + (((i * 37) % 100) / 100) * (x1 - x0);
            const d = +(d0 + ((i * 53) % 10) / 10).toFixed(1);
            return `<circle cx="${x.toFixed(1)}" cy="${y}" r="${(1.2 + (i % 3) * .6).toFixed(1)}" fill="${fill}" style="--h:-${h}px;${A('fx-bub', d, 'ease-in', i * .7)}"/>`;
          }).join('');
          const steam = (xs, y) => xs.map((x, i) => `<ellipse class="fx-stm" cx="${x}" cy="${y}" rx="3" ry="5" fill="#e2e8f0" style="${AA('fx-steam', +(3 + i * .5).toFixed(1), 'ease-out', i * 1.1)}"/>`).join('');
          const holes = (r, n, rr) => Array.from({ length: n }, (_, i) => { const a = i / n * 2 * Math.PI; return `<circle cx="${(50 + r * Math.cos(a)).toFixed(1)}" cy="${(50 + r * Math.sin(a)).toFixed(1)}" r="${rr}"/>`; }).join('');
          const glint = `<rect x="-24" y="0" width="9" height="100" fill="#fff" opacity=".09" style="${AA('fx-glint', 7, 'ease-in-out')}"/>`;
          const rim = `<circle cx="50" cy="50" r="31" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="1"/>
              <path d="M30 36 A26 26 0 0 1 46 24" stroke="rgba(255,255,255,.35)" stroke-width="2" fill="none" stroke-linecap="round"/>`;
          const clothes = `<g style="${rot(sp)}">
              <circle cx="50" cy="26" r="7" fill="#f472b6" opacity=".9"/><circle cx="73" cy="58" r="6" fill="#fbbf24" opacity=".9"/>
              <circle cx="30" cy="62" r="7.5" fill="#60a5fa" opacity=".9"/><circle cx="58" cy="44" r="5" fill="#a78bfa" opacity=".85"/></g>`;

          /* ---------- SCÈNES ANIMÉES (viewBox 100×100) ---------- */
          let scene = '';
          if (CFG.kind === 'washer') {
            scene = `
              <clipPath id="${uid}c"><circle cx="50" cy="50" r="31"/></clipPath>
              <circle cx="50" cy="50" r="36" fill="rgba(255,255,255,.05)" stroke="${col}" stroke-opacity=".55" stroke-width="2.4"/>
              <g fill="${col}" opacity=".5" style="${rot(14, true)}">${holes(33.6, 12, .9)}</g>
              <circle cx="50" cy="50" r="31" fill="#07101d"/>
              <g clip-path="url(#${uid}c)">
                <g fill="rgba(255,255,255,.07)" style="${rot(sp)}">${holes(26, 14, 1.3)}${holes(17, 9, 1.1)}</g>
                <g style="transform:translateY(${running ? 0 : 6}px);transition:transform 1s">
                  <g style="transform-origin:50px 50px;${A('fx-slosh', 2.4, 'ease-in-out', 0, 'infinite alternate')}">
                    <g style="${A('fx-wave', 2.6)}">${wave(52, col + '88')}</g>
                    <g style="${A('fx-wave', 3.8, 'linear', 0, 'infinite reverse')}">${wave(56, col + '55')}</g>
                  </g>
                </g>
                ${clothes}
                ${parts(8, 26, 74, 76, 34, 1.8)}
                ${glint}
              </g>
              ${rim}`;
          } else if (CFG.kind === 'dryer') {
            scene = `
              <clipPath id="${uid}c"><circle cx="50" cy="50" r="31"/></clipPath>
              <radialGradient id="${uid}g"><stop offset="0" stop-color="${col}" stop-opacity="${running ? .55 : .12}"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></radialGradient>
              <circle cx="50" cy="50" r="36" fill="rgba(255,255,255,.05)" stroke="${col}" stroke-opacity=".55" stroke-width="2.4"/>
              <g fill="${col}" opacity=".5" style="${rot(14, true)}">${holes(33.6, 12, .9)}</g>
              <circle cx="50" cy="50" r="31" fill="#07101d"/>
              <circle cx="50" cy="50" r="31" fill="url(#${uid}g)" style="${running ? AA('fx-breath', 1.8, 'ease-in-out') : 'opacity:.5'}"/>
              <g clip-path="url(#${uid}c)">
                <g stroke="rgba(255,255,255,.14)" stroke-width="2.2" stroke-linecap="round" style="${rot(sp)}">
                  <path d="M50 19 V30 M76.8 65.5 L67.3 60 M23.2 65.5 L32.7 60"/>
                </g>
                ${clothes}
                ${running ? [0,1,2].map(i => `<path d="M${36+i*14} 74 q4 -6 0 -12 t0 -12" fill="none" stroke="${col}" stroke-width="2" stroke-linecap="round" style="${A('fx-heat', 2, 'ease-in-out', i * .5)}"/>`).join('') : ''}
                ${parts(6, 28, 72, 78, 40, 1.4, '#fde68a')}
                ${glint}
              </g>
              ${rim}`;
          } else if (CFG.kind === 'dish') {
            scene = `
              <clipPath id="${uid}c"><rect x="17" y="17" width="66" height="66" rx="12"/></clipPath>
              <rect x="15" y="15" width="70" height="70" rx="14" fill="rgba(255,255,255,.05)" stroke="${col}" stroke-opacity=".55" stroke-width="2.4"/>
              <rect x="17" y="17" width="66" height="66" rx="12" fill="#07101d"/>
              <g clip-path="url(#${uid}c)">
                <g opacity="${running ? .12 : 0}"><rect x="17" y="17" width="66" height="66" fill="${col}" style="${running ? AA('fx-breath', 2.2, 'ease-in-out') : ''}"/></g>
                <rect x="17" y="62" width="66" height="22" fill="${col}" opacity="${running ? .2 : .06}"/>
                <g style="${A('fx-wave', 2.4)}">${wave(80, col + '44')}</g>
                <g stroke="rgba(255,255,255,.35)" stroke-width="1.4" fill="none" stroke-linecap="round">
                  <path d="M24 66 h52"/><path d="M26 66 v-10 M34 66 v-10 M42 66 v-10 M58 66 v-10 M66 66 v-10 M74 66 v-10"/>
                  <ellipse cx="30" cy="56" rx="2" ry="9"/><ellipse cx="46" cy="56" rx="2" ry="9"/><ellipse cx="62" cy="56" rx="2" ry="9"/><ellipse cx="72" cy="56" rx="2" ry="9"/>
                </g>
                <g style="${rot(+(sp * .7).toFixed(1), false, 50, 41.7)}">
                  <rect x="24" y="40" width="52" height="3.4" rx="1.7" fill="${col}"/>
                  <circle cx="50" cy="41.7" r="3.4" fill="#fff" opacity=".9"/>
                  ${running ? `<path d="M25 40 q-2 -5 2 -9 M75 43.4 q2 5 -2 9" stroke="${col}" stroke-width="1.2" stroke-dasharray="1.5 2" fill="none" stroke-linecap="round" style="${A('fx-flow', .5)}"/>` : ''}
                </g>
                ${running ? Array.from({ length: 10 }, (_, i) => `<circle cx="${(22 + i * 6.2).toFixed(1)}" cy="44" r="1.4" fill="${col}" style="${A('fx-drop', 1.5, 'ease-in', i * .19)}"/>`).join('') : ''}
                ${parts(6, 22, 78, 82, 14, 1.6)}
                ${running ? steam([36, 50, 64], 30) : ''}
                ${glint}
              </g>
              <circle cx="50" cy="80" r="1.8" fill="${running ? scol : 'rgba(255,255,255,.3)'}" style="${running ? AA('fx-dot', 1.2, 'ease-in-out') : ''}"/>`;
          } else {
            scene = `
              <clipPath id="${uid}c"><rect x="29" y="14" width="42" height="72" rx="14"/></clipPath>
              ${steamOn ? steam([42, 50, 58], 9) : ''}
              <rect x="27" y="12" width="46" height="76" rx="16" fill="rgba(255,255,255,.05)" stroke="${col}" stroke-opacity=".55" stroke-width="2.4"/>
              <rect x="29" y="14" width="42" height="72" rx="14" fill="#07101d"/>
              <g clip-path="url(#${uid}c)">
                <g style="${AA('fx-wave', running ? 2.2 : 4.5)}">${wave(36, wcol + '99')}</g>
                <g style="${AA('fx-wave', running ? 3.4 : 6.5, 'linear', 0, 'infinite reverse')}">${wave(41, wcol + '55')}</g>
                <g opacity="${running ? .6 : 0}"><ellipse cx="50" cy="74" rx="17" ry="9" fill="${col}" style="filter:blur(3px);${running ? AA('fx-breath', 1.6, 'ease-in-out') : ''}"/></g>
                ${running ? `<path d="M50 68 C 44 58, 56 50, 50 42" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1.2" stroke-dasharray="2 5" stroke-linecap="round" style="${A('fx-flow', .9)}"/>` : ''}
                <path d="M36 74 h6 l3 -7 l6 14 l6 -14 l3 7 h6" fill="none" stroke="${running ? col : 'rgba(255,255,255,.35)'}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="${running ? 'filter:drop-shadow(0 0 2px ' + col + ');' + A('fx-zig', 1.2, 'ease-in-out') : ''}"/>
                ${running ? `<path d="M36 74 h6 l3 -7 l6 14 l6 -14 l3 7 h6" fill="none" stroke="#fff7d6" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 50" style="${A('fx-coil', 1.2)}"/>` : ''}
                ${parts(7, 34, 66, 70, 34, 1.6)}
                ${glint}
              </g>
              <path d="M36 22 q-1 12 0 22" stroke="rgba(255,255,255,.3)" stroke-width="2" fill="none" stroke-linecap="round"/>`;
          }

          /* ---------- ANNEAU DE PUISSANCE ---------- */
          const ring = `
            <circle cx="50" cy="50" r="${R}" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="3" style="${!running && !unavailable ? AA('fx-idle', 4, 'ease-in-out') : ''}"/>
            <circle cx="50" cy="50" r="${R}" fill="none" stroke="${col}" stroke-width="3" stroke-linecap="round"
              stroke-dasharray="${(C*pct).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 50 50)" style="${running ? 'filter:drop-shadow(0 0 3px ' + col + ')' : ''}"/>
            ${running ? `
            <circle cx="50" cy="50" r="51" fill="none" stroke="${col}" stroke-opacity=".4" stroke-width=".8" stroke-dasharray="1.5 4" style="${rot(10, true)}"/>
            <circle cx="50" cy="50" r="${R}" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-dasharray="0.1 ${C.toFixed(1)}" style="filter:drop-shadow(0 0 3px ${col});${rot(2.4)}"/>` : ''}`;

          const chip = (label, v, c) => `
            <div class="fx-chip">
              <div style="font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:rgba(226,232,240,.55);font-weight:700">${label}</div>
              <div style="font-size:13px;font-weight:700;color:${c||'#f1f5f9'};margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${v}</div>
            </div>`;
          const chips = [
            V.temp ? chip('Température', tC == null ? '—' : tC.toFixed(1) + ' °C', '#fb923c') : '',
            CFG.energy ? chip('Énergie jour', kwh == null ? '—' : kwh.toFixed(2) + ' kWh') : '',
            CFG.cycle ? chip('Cycle', esc(cycleRaw == null ? '—' : cycleRaw)) : '',
            cmdTxt ? chip('Commande', cmdTxt, '#a78bfa') : '',
            chip('Prise', plugOn == null ? '—' : (plugOn ? 'ON' : 'OFF'), plugOn ? '#34d399' : '#fb7185')
          ].filter(Boolean).slice(0,3).join('');

          return `
          <style>
            .${uid},.${uid} *{box-sizing:border-box}
            .${uid}{position:relative;overflow:hidden;margin:6px;padding:1.5px;border-radius:24px;background:rgba(255,255,255,.07);font-family:'Inter','Segoe UI',system-ui,sans-serif;color:#f1f5f9;transition:transform .25s}
            .${uid}:hover{transform:translateY(-2px)}
            .${uid}.on{background:${col}30;box-shadow:0 0 30px ${col}26}
            .${uid}.on::before{content:"";position:absolute;inset:-60%;background:conic-gradient(from 0deg,transparent 0 62%,${col} 82%,#fff 86%,transparent 92%);${AA('fx-spin', 4.5)}}
            .${uid} .fx-in{position:relative;z-index:1;border-radius:22.5px;padding:16px 14px 14px;background:radial-gradient(110% 70% at 50% 0%, ${col}22, transparent 60%),linear-gradient(180deg,#0d1828,#0a1220);box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
            .${uid} .fx-led{position:relative;flex:none;width:6px;height:6px;border-radius:50%;background:${scol};box-shadow:0 0 8px ${scol}}
            .${uid} .fx-led::after{content:"";position:absolute;inset:0;border-radius:50%;border:1.5px solid ${scol};${running ? AA('fx-ping', 1.4, 'ease-out') : 'display:none'}}
            .${uid} .fx-num{font-size:40px;line-height:1;font-weight:800;letter-spacing:-.03em;color:${running ? '#fff' : 'rgba(241,245,249,.7)'};${running ? AA('fx-num', 2.4, 'ease-in-out') : ''}}
            .${uid} .fx-bar{margin:12px 0;height:6px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;position:relative}
            .${uid} .fx-fill{height:100%;width:${(pct*100).toFixed(0)}%;border-radius:99px;background:repeating-linear-gradient(-45deg,rgba(255,255,255,${running ? .2 : 0}) 0 5px,transparent 5px 10px),linear-gradient(90deg,${col}99,${col});background-size:14px 14px,100% 100%;transition:width .8s ease;${running ? AA('fx-stripes', .7) : ''}}
            .${uid} .fx-sheen{position:absolute;top:0;bottom:0;left:-30%;width:30%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);${AA('fx-sheen', 2.2)}}
            .${uid} .fx-chip{position:relative;overflow:hidden;flex:1;min-width:0;padding:8px 10px;border-radius:13px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.07)}
            .${uid} .fx-chip::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.07),transparent);transform:skewX(-20deg);${AA('fx-gleam', 7, 'ease-in-out')}}
            .${uid} .fx-chip:nth-child(2)::after{animation-delay:${ph(7, 1.2)}}
            .${uid} .fx-chip:nth-child(3)::after{animation-delay:${ph(7, 2.4)}}
            .${uid} .fx-stm{transform-box:fill-box;transform-origin:center;filter:blur(1.5px)}
            @keyframes fx-spin{to{transform:rotate(360deg)}}
            @keyframes fx-spinr{to{transform:rotate(-360deg)}}
            @keyframes fx-wave{from{transform:translateX(0)}to{transform:translateX(-50px)}}
            @keyframes fx-slosh{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
            @keyframes fx-bub{0%{transform:translate(0,0);opacity:0}15%{opacity:.75}50%{transform:translate(1.5px,calc(var(--h) * .5))}100%{transform:translate(-1px,var(--h));opacity:0}}
            @keyframes fx-heat{0%{transform:translateY(6px);opacity:0}30%{opacity:.9}100%{transform:translateY(-10px);opacity:0}}
            @keyframes fx-drop{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(30px);opacity:0}}
            @keyframes fx-steam{0%{transform:translate(0,4px) scale(.5);opacity:0}30%{opacity:.5}100%{transform:translate(2px,-14px) scale(1.7);opacity:0}}
            @keyframes fx-glint{0%,60%{transform:translateX(0) skewX(-18deg)}100%{transform:translateX(150px) skewX(-18deg)}}
            @keyframes fx-breath{0%,100%{opacity:.45}50%{opacity:1}}
            @keyframes fx-coil{from{stroke-dashoffset:60}to{stroke-dashoffset:0}}
            @keyframes fx-flow{to{stroke-dashoffset:-7}}
            @keyframes fx-zig{0%,100%{opacity:.75}50%{opacity:1}}
            @keyframes fx-shake{0%,100%{transform:translate(0,0)}25%{transform:translate(-.6px,.4px)}50%{transform:translate(.5px,-.5px)}75%{transform:translate(-.4px,-.3px)}}
            @keyframes fx-glow{0%,100%{filter:drop-shadow(0 0 3px var(--c))}50%{filter:drop-shadow(0 0 11px var(--c))}}
            @keyframes fx-ping{0%{transform:scale(.6);opacity:1}100%{transform:scale(2.6);opacity:0}}
            @keyframes fx-dot{0%,100%{opacity:1}50%{opacity:.35}}
            @keyframes fx-idle{0%,100%{opacity:.5}50%{opacity:1}}
            @keyframes fx-num{0%,100%{text-shadow:0 0 8px var(--cg)}50%{text-shadow:0 0 24px var(--c)}}
            @keyframes fx-stripes{to{background-position:14px 0,0 0}}
            @keyframes fx-sheen{from{left:-30%}to{left:100%}}
            @keyframes fx-gleam{0%,70%{left:-60%}100%{left:130%}}
            @media (prefers-reduced-motion: reduce){.${uid} *,.${uid}::before,.${uid} *::after{animation:none!important}}
          </style>
          <div class="fxT ${uid} ${running ? 'on' : ''}" style="--c:${col};--cg:${col}55">
            <div class="fx-in">
              <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap">
                <div style="min-width:0">
                  <div style="font-size:17px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(CFG.name)}</div>
                  <div style="font-size:11.5px;color:rgba(226,232,240,.6);margin-top:2px">${esc(CFG.sub)}</div>
                </div>
                <div style="display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:${scol}1f;border:1px solid ${scol}55;font-size:10px;font-weight:800;letter-spacing:.08em;color:${scol};white-space:nowrap">
                  <span class="fx-led"></span>${status}
                </div>
              </div>
              <div style="display:flex;justify-content:center;margin:8px 0 2px">
                <svg viewBox="0 0 100 100" width="168" height="168" style="max-width:100%;overflow:visible;${running ? AA('fx-glow', 2.6, 'ease-in-out') : ''}">${ring}<g style="${shake ? A('fx-shake', .22) : ''}">${scene}</g></svg>
              </div>
              <div style="text-align:center">
                <div style="display:inline-flex;align-items:baseline;gap:6px">
                  <span class="fx-num">${wTxt}</span>
                  <span style="font-size:16px;font-weight:700;color:${col}">${wUnit}</span>
                </div>
                <div style="font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:rgba(226,232,240,.5);font-weight:700;margin-top:3px">Puissance · ${(pct*100).toFixed(0)} % de ${CFG.maxW} W</div>
              </div>
              <div class="fx-bar"><div class="fx-fill"></div>${running ? '<div class="fx-sheen"></div>' : ''}</div>
              <div style="display:flex;gap:7px">${chips}</div>
            </div>
          </div>`;
        ]]]
  - type: custom:button-card
    show_name: false
    show_icon: false
    show_state: false
    triggers_update:
    - sensor.homefoxcat_load_chauffe_eau
    - [[foxcat:legacy.switch_chauffe_eau]]
    - sensor.foxcat_energy_fonctions_utilisateur_boiler_commande_utilisateur
    - sensor.foxcat_energy_boiler_temperature_chauffe_eau
    - [[foxcat:legacy.sensor_lave_linge_puissance]]
    - [[foxcat:machines.washer.switch]]
    - sensor.foxcat_energy_fonctions_utilisateur_lave_linge_commande_utilisateur
    - sensor.lave_linge_cycle
    - [[foxcat:legacy.sensor_seche_linge_puissance]]
    - [[foxcat:machines.dryer.switch]]
    - sensor.foxcat_energy_fonctions_utilisateur_seche_linge_commande_utilisateur
    - sensor.seche_linge_cycle
    - [[foxcat:legacy.sensor_lave_vaisselle_puissance]]
    - [[foxcat:machines.dishwasher.switch]]
    - sensor.foxcat_energy_fonctions_utilisateur_lave_vaisselle_commande_utilisateur
    - sensor.lave_vaisselle_cycle
    tap_action:
      action: none
    styles:
      card:
      - padding: 0
      - border-radius: 28px
      - overflow: hidden
      - border: 1px solid rgba(255,255,255,0.09)
      - box-shadow: 0 24px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.06)
      - background: 'radial-gradient(120% 80% at 0% 0%, rgba(96,165,250,0.14), transparent 55%), radial-gradient(100% 70% at 100% 100%, rgba(167,139,250,0.10), transparent 55%), #060a13'
      grid:
      - grid-template-areas: '"main"'
      - grid-template-columns: 1fr
      custom_fields:
        main:
        - width: 100%
    custom_fields:
      main: |-
        [[[
          /* ==============================================================
             FOXCAT ENERGY — CHARGES PILOTÉES · VISUALISATION
             Pour ajouter ou modifier un appareil : liste DEV ci-dessous.
             kind : boiler | washer | dryer | dish
             ============================================================== */
          const DEV = [
            { key: 'boiler', name: 'Boiler ECS', kind: 'boiler', col: '#fb923c', max: 3000,
              pw: 'sensor.homefoxcat_load_chauffe_eau', sw: '[[foxcat:legacy.switch_chauffe_eau]]', cy: '',
              cmd: 'sensor.foxcat_energy_fonctions_utilisateur_boiler_commande_utilisateur',
              temp: 'sensor.foxcat_energy_boiler_temperature_chauffe_eau' },
            { key: 'washer', name: 'Lave-linge', kind: 'washer', col: '#60a5fa', max: 2200,
              pw: '[[foxcat:legacy.sensor_lave_linge_puissance]]', sw: '[[foxcat:machines.washer.switch]]', cy: 'sensor.lave_linge_cycle',
              cmd: 'sensor.foxcat_energy_fonctions_utilisateur_lave_linge_commande_utilisateur' },
            { key: 'dryer', name: 'Sèche-linge', kind: 'dryer', col: '#c4b5fd', max: 2800,
              pw: '[[foxcat:legacy.sensor_seche_linge_puissance]]', sw: '[[foxcat:machines.dryer.switch]]', cy: 'sensor.seche_linge_cycle',
              cmd: 'sensor.foxcat_energy_fonctions_utilisateur_seche_linge_commande_utilisateur' },
            { key: 'dish', name: 'Lave-vaisselle', kind: 'dish', col: '#34d399', max: 2200,
              pw: '[[foxcat:legacy.sensor_lave_vaisselle_puissance]]', sw: '[[foxcat:machines.dishwasher.switch]]', cy: 'sensor.lave_vaisselle_cycle',
              cmd: 'sensor.foxcat_energy_fonctions_utilisateur_lave_vaisselle_commande_utilisateur' }
          ];
          const IDLE = ['idle','off','none','unknown','unavailable','standby','ready','','termine','terminé','fin'];
          const CMD = { auto: 'AUTO', off: 'ARRÊT', arret: 'ARRÊT', start: 'MARCHE', demarrage: 'MARCHE', on: 'MARCHE', marche: 'MARCHE' };

          /* ---------- outils ---------- */
          const st = (id) => (id && states[id]) ? states[id] : null;
          const val = (id) => st(id)?.state ?? null;
          const num = (id) => { const v = parseFloat(val(id)); return isFinite(v) ? v : null; };
          const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
          const esc = (t) => String(t ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
          const fmt = (w) => w == null ? ['—', ''] : w >= 1000 ? [(w / 1000).toFixed(2), 'kW'] : [String(Math.round(w)), 'W'];
          const heat = (v) => v == null ? null : v < 35 ? '#38bdf8' : v < 45 ? '#22d3ee' : v < 55 ? '#fbbf24' : v < 65 ? '#fb923c' : '#f87171';

          /* animations calées sur l'horloge : elles continuent sans à-coup entre deux re-rendus */
          const NOW = Date.now() / 1000;
          const ph = (d, o = 0) => `-${((((NOW + o) % d) + d) % d).toFixed(2)}s`;
          const AA = (n, d, tf = 'linear', o = 0, x = 'infinite') => `animation:${n} ${d}s ${tf} ${ph(d, o)} ${x};`;

          /* ---------- état de chaque appareil ---------- */
          const R = DEV.map((d) => {
            const w = num(d.pw), cyc = val(d.cy), cr = val(d.cmd);
            const plug = st(d.sw) ? val(d.sw) === 'on' : null;
            const cycleOn = cyc != null && !IDLE.includes(String(cyc).toLowerCase());
            const on = (w != null && w > 20) || cycleOn;
            const dead = [d.pw, d.sw].filter(Boolean).every(id => !st(id) || val(id) === 'unavailable');
            const [status, scol] = dead ? ['INDISPONIBLE', '#94a3b8'] : plug === false ? ['PRISE COUPÉE', '#fb7185'] : on ? ['EN MARCHE', d.col] : ['EN VEILLE', '#64748b'];
            const cmd = (cr == null || ['unknown','unavailable'].includes(cr)) ? null : (CMD[String(cr).toLowerCase()] || String(cr).toUpperCase());
            return { ...d, w, cyc, cycleOn, plug, on, dead, status, scol, cmd, pct: w != null ? clamp(w / d.max, 0, 1) : 0, t: num(d.temp) };
          });
          const total = R.reduce((s, r) => s + (r.w > 0 ? r.w : 0), 0);
          const nOn = R.filter(r => r.on).length;
          const live = nOn > 0;

          /* ---------- mini-scènes animées (viewBox 100×100) ---------- */
          const scene = (r) => {
            const { col, on, pct, kind } = r;
            const uid = 'fc' + r.key;
            const A = (n, d, tf = 'linear', o = 0, x = 'infinite') => on ? AA(n, d, tf, o, x) : '';
            const sp = on ? Math.max(0.8, Math.round((3.4 - 2.6 * pct) * 5) / 5) : 3.4;
            const rot = (d, rev = false, ox = 50, oy = 50) => `transform-origin:${ox}px ${oy}px;${A(rev ? 'fc-spinr' : 'fc-spin', d)}`;
            const wave = (y, fill) => `<path d="M-50 ${y} q12.5 -5 25 0 t25 0 t25 0 t25 0 t25 0 t25 0 t25 0 t25 0 V110 H-50 Z" fill="${fill}"/>`;
            const parts = (n, x0, x1, y, h, d0, fill = '#fff') => !on ? '' : Array.from({ length: n }, (_, i) => {
              const x = x0 + (((i * 37) % 100) / 100) * (x1 - x0);
              return `<circle cx="${x.toFixed(1)}" cy="${y}" r="${(1.4 + (i % 3) * .7).toFixed(1)}" fill="${fill}" style="--h:-${h}px;${A('fc-bub', +(d0 + ((i * 53) % 10) / 10).toFixed(1), 'ease-in', i * .7)}"/>`;
            }).join('');
            const steam = (xs, y) => xs.map((x, i) => `<ellipse class="stm" cx="${x}" cy="${y}" rx="3.5" ry="6" fill="#e2e8f0" style="${AA('fc-steam', +(3 + i * .5).toFixed(1), 'ease-out', i * 1.1)}"/>`).join('');
            const holes = (rr, n, s) => Array.from({ length: n }, (_, i) => { const a = i / n * 2 * Math.PI; return `<circle cx="${(50 + rr * Math.cos(a)).toFixed(1)}" cy="${(50 + rr * Math.sin(a)).toFixed(1)}" r="${s}"/>`; }).join('');
            const glint = `<rect x="-24" y="0" width="9" height="100" fill="#fff" opacity=".08" style="${AA('fc-glint', 7, 'ease-in-out', r.key.length)}"/>`;
            const rim = `<circle cx="50" cy="50" r="31" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="1"/><path d="M30 36 A26 26 0 0 1 46 24" stroke="rgba(255,255,255,.35)" stroke-width="2" fill="none" stroke-linecap="round"/>`;
            const clothes = `<g style="${rot(sp)}"><circle cx="50" cy="26" r="7" fill="#f472b6" opacity=".9"/><circle cx="73" cy="58" r="6" fill="#fbbf24" opacity=".9"/><circle cx="30" cy="62" r="7.5" fill="#60a5fa" opacity=".9"/><circle cx="58" cy="44" r="5" fill="#a78bfa" opacity=".85"/></g>`;

            if (kind === 'washer') return `
              <clipPath id="${uid}c"><circle cx="50" cy="50" r="31"/></clipPath>
              <circle cx="50" cy="50" r="36" fill="rgba(255,255,255,.05)" stroke="${col}" stroke-opacity=".6" stroke-width="2.6"/>
              <g fill="${col}" opacity=".5" style="${rot(14, true)}">${holes(33.6, 12, .9)}</g>
              <circle cx="50" cy="50" r="31" fill="#07101d"/>
              <g clip-path="url(#${uid}c)">
                <g fill="rgba(255,255,255,.08)" style="${rot(sp)}">${holes(26, 14, 1.3)}${holes(17, 9, 1.1)}</g>
                <g style="transform:translateY(${on ? 0 : 6}px)">
                  <g style="transform-origin:50px 50px;${A('fc-slosh', 2.4, 'ease-in-out', 0, 'infinite alternate')}">
                    <g style="${A('fc-wave', 2.6)}">${wave(52, col + '88')}</g>
                    <g style="${A('fc-wave', 3.8, 'linear', 0, 'infinite reverse')}">${wave(56, col + '55')}</g>
                  </g>
                </g>
                ${clothes}${parts(8, 26, 74, 76, 34, 1.8)}${glint}
              </g>${rim}`;

            if (kind === 'dryer') return `
              <clipPath id="${uid}c"><circle cx="50" cy="50" r="31"/></clipPath>
              <radialGradient id="${uid}g"><stop offset="0" stop-color="${col}" stop-opacity="${on ? .6 : .12}"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></radialGradient>
              <circle cx="50" cy="50" r="36" fill="rgba(255,255,255,.05)" stroke="${col}" stroke-opacity=".6" stroke-width="2.6"/>
              <g fill="${col}" opacity=".5" style="${rot(14, true)}">${holes(33.6, 12, .9)}</g>
              <circle cx="50" cy="50" r="31" fill="#07101d"/>
              <circle cx="50" cy="50" r="31" fill="url(#${uid}g)" style="${on ? AA('fc-breath', 1.8, 'ease-in-out') : 'opacity:.5'}"/>
              <g clip-path="url(#${uid}c)">
                <g stroke="rgba(255,255,255,.15)" stroke-width="2.2" stroke-linecap="round" style="${rot(sp)}"><path d="M50 19 V30 M76.8 65.5 L67.3 60 M23.2 65.5 L32.7 60"/></g>
                ${clothes}
                ${on ? [0, 1, 2].map(i => `<path d="M${36 + i * 14} 74 q4 -6 0 -12 t0 -12" fill="none" stroke="${col}" stroke-width="2" stroke-linecap="round" style="${A('fc-heat', 2, 'ease-in-out', i * .5)}"/>`).join('') : ''}
                ${parts(6, 28, 72, 78, 40, 1.4, '#fde68a')}${glint}
              </g>${rim}`;

            if (kind === 'dish') return `
              <clipPath id="${uid}c"><rect x="17" y="17" width="66" height="66" rx="12"/></clipPath>
              <rect x="15" y="15" width="70" height="70" rx="14" fill="rgba(255,255,255,.05)" stroke="${col}" stroke-opacity=".6" stroke-width="2.6"/>
              <rect x="17" y="17" width="66" height="66" rx="12" fill="#07101d"/>
              <g clip-path="url(#${uid}c)">
                <g opacity="${on ? .12 : 0}"><rect x="17" y="17" width="66" height="66" fill="${col}" style="${on ? AA('fc-breath', 2.2, 'ease-in-out') : ''}"/></g>
                <rect x="17" y="62" width="66" height="22" fill="${col}" opacity="${on ? .2 : .06}"/>
                <g style="${A('fc-wave', 2.4)}">${wave(80, col + '44')}</g>
                <g stroke="rgba(255,255,255,.35)" stroke-width="1.4" fill="none" stroke-linecap="round">
                  <path d="M24 66 h52"/><path d="M26 66 v-10 M34 66 v-10 M42 66 v-10 M58 66 v-10 M66 66 v-10 M74 66 v-10"/>
                  <ellipse cx="30" cy="56" rx="2" ry="9"/><ellipse cx="46" cy="56" rx="2" ry="9"/><ellipse cx="62" cy="56" rx="2" ry="9"/><ellipse cx="72" cy="56" rx="2" ry="9"/>
                </g>
                <g style="${rot(+(sp * .7).toFixed(1), false, 50, 41.7)}">
                  <rect x="24" y="40" width="52" height="3.4" rx="1.7" fill="${col}"/>
                  <circle cx="50" cy="41.7" r="3.4" fill="#fff" opacity=".9"/>
                  ${on ? `<path d="M25 40 q-2 -5 2 -9 M75 43.4 q2 5 -2 9" stroke="${col}" stroke-width="1.2" stroke-dasharray="1.5 2" fill="none" stroke-linecap="round" style="${A('fc-flow', .5)}"/>` : ''}
                </g>
                ${on ? Array.from({ length: 10 }, (_, i) => `<circle cx="${(22 + i * 6.2).toFixed(1)}" cy="44" r="1.4" fill="${col}" style="${A('fc-drop', 1.5, 'ease-in', i * .19)}"/>`).join('') : ''}
                ${parts(6, 22, 78, 82, 14, 1.6)}${on ? steam([36, 50, 64], 30) : ''}${glint}
              </g>
              <circle cx="50" cy="80" r="1.8" fill="${on ? col : 'rgba(255,255,255,.3)'}" style="${on ? AA('fc-dot', 1.2, 'ease-in-out') : ''}"/>`;

            /* boiler : couleur de l'eau selon la température */
            const wcol = heat(r.t) || col;
            const steamOn = on || (r.t != null && r.t >= 50);
            return `
              <clipPath id="${uid}c"><rect x="29" y="14" width="42" height="72" rx="14"/></clipPath>
              ${steamOn ? steam([42, 50, 58], 9) : ''}
              <rect x="27" y="12" width="46" height="76" rx="16" fill="rgba(255,255,255,.05)" stroke="${col}" stroke-opacity=".6" stroke-width="2.6"/>
              <rect x="29" y="14" width="42" height="72" rx="14" fill="#07101d"/>
              <g clip-path="url(#${uid}c)">
                <g style="${AA('fc-wave', on ? 2.2 : 4.5)}">${wave(36, wcol + '99')}</g>
                <g style="${AA('fc-wave', on ? 3.4 : 6.5, 'linear', 0, 'infinite reverse')}">${wave(41, wcol + '55')}</g>
                <g opacity="${on ? .6 : 0}"><ellipse cx="50" cy="74" rx="17" ry="9" fill="${col}" style="filter:blur(3px);${on ? AA('fc-breath', 1.6, 'ease-in-out') : ''}"/></g>
                ${on ? `<path d="M50 68 C 44 58, 56 50, 50 42" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1.2" stroke-dasharray="2 5" stroke-linecap="round" style="${A('fc-flow', .9)}"/>` : ''}
                <path d="M36 74 h6 l3 -7 l6 14 l6 -14 l3 7 h6" fill="none" stroke="${on ? col : 'rgba(255,255,255,.35)'}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="${on ? 'filter:drop-shadow(0 0 2px ' + col + ');' + A('fc-zig', 1.2, 'ease-in-out') : ''}"/>
                ${on ? `<path d="M36 74 h6 l3 -7 l6 14 l6 -14 l3 7 h6" fill="none" stroke="#fff7d6" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 50" style="${A('fc-coil', 1.2)}"/>` : ''}
                ${parts(7, 34, 66, 70, 34, 1.6)}${glint}
              </g>
              <path d="M36 22 q-1 12 0 22" stroke="rgba(255,255,255,.3)" stroke-width="2" fill="none" stroke-linecap="round"/>`;
          };

          /* ---------- briques de ligne ---------- */
          const N = 20;
          const led = (r) => {
            const lit = r.on ? Math.max(1, Math.round(r.pct * N)) : Math.round(r.pct * N);
            return Array.from({ length: N }, (_, i) => i < lit
              ? `<i class="on" style="opacity:${(.45 + .55 * i / N).toFixed(2)};${r.on ? AA('fc-led', 1.4, 'ease-in-out', i * .07) : ''}"></i>`
              : '<i></i>').join('');
          };
          const lane = (r) => {
            const n = r.on ? 1 + Math.round(r.pct * 4) : 0;
            const d = +(2.4 - 1.5 * r.pct).toFixed(1);
            return `<div class="lane ${r.on ? 'on' : ''}"><div class="trk"></div>${Array.from({ length: n }, (_, i) => `<span class="pt" style="${AA('fc-lane', d, 'linear', i * d / n)}"></span>`).join('')}</div>`;
          };
          const meta = (r) => [
            r.temp ? `<span class="m" style="color:${heat(r.t) || '#94a3b8'}"><ha-icon icon="mdi:thermometer"></ha-icon>${r.t == null ? '—' : r.t.toFixed(1).replace('.', ',') + ' °C'}</span>` : '',
            r.cy ? `<span class="m ${r.cycleOn ? 'spin' : ''}"><ha-icon icon="mdi:sync"></ha-icon>${esc(r.cyc == null || ['unknown','unavailable'].includes(r.cyc) ? '—' : r.cyc)}</span>` : '',
            r.sw ? `<span class="m" style="color:${r.plug ? '#34d399' : r.plug === false ? '#fb7185' : '#94a3b8'}"><ha-icon icon="mdi:power-socket-eu"></ha-icon>${r.plug == null ? '—' : r.plug ? 'ON' : 'OFF'}</span>` : '',
            `<span class="m" style="color:${r.cmd === 'AUTO' ? '#a78bfa' : r.cmd ? '#fbbf24' : '#64748b'}"><ha-icon icon="${r.cmd === 'AUTO' ? 'mdi:robot-outline' : 'mdi:hand-back-right-outline'}"></ha-icon>${r.cmd || '—'}</span>`
          ].join('');

          /* ---------- anneau de répartition ---------- */
          const DR = 30, DC = 2 * Math.PI * DR;
          let acc = 0;
          const act = R.filter(r => r.on && r.w > 0);
          const tAct = act.reduce((s, r) => s + r.w, 0);
          const arcs = tAct > 0 ? act.map(r => {
            const len = (r.w / tAct) * DC;
            const s = `<circle cx="40" cy="40" r="${DR}" fill="none" stroke="${r.col}" stroke-width="7" stroke-dasharray="${Math.max(0, len - 2).toFixed(1)} ${DC.toFixed(1)}" stroke-dashoffset="${(-acc).toFixed(1)}" transform="rotate(-90 40 40)" style="filter:drop-shadow(0 0 4px ${r.col}88)"/>`;
            acc += len; return s;
          }).join('') : '';

          const rows = R.map((r) => {
            const [v, u] = fmt(r.w);
            return `
            <div class="row ${r.on ? 'on' : ''} ${r.dead ? 'dead' : ''}" style="--c:${r.col}">
              ${lane(r)}
              <div class="cell">
                <div class="node"><svg viewBox="4 2 92 92" class="sc"><g style="${r.on && r.kind === 'washer' && r.pct > .6 ? AA('fc-shake', .22) : ''}">${scene(r)}</g></svg></div>
                <div class="info">
                  <div class="nm"><span>${esc(r.name)}</span><em style="--s:${r.scol}"><b></b>${r.status}</em></div>
                  <div class="meta">${meta(r)}</div>
                  <div class="led">${led(r)}</div>
                </div>
                <div class="pw"><div class="v mono">${v}<small>${u}</small></div><div class="p mono">${Math.round(r.pct * 100)} % · ${r.max} W</div></div>
              </div>
            </div>`;
          }).join('');

          const [tv, tu] = fmt(total);
          return `
          <style>
            .fc{container-type:inline-size;position:relative;padding:22px 20px 20px;font-family:'Inter','Segoe UI',system-ui,sans-serif;color:#e2e8f0}
            .fc *{box-sizing:border-box}
            .fc ha-icon{display:inline-flex}
            .fc .mono{font-family:'JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
            .fc .scan{position:absolute;left:0;right:0;height:80px;background:linear-gradient(180deg,transparent,rgba(96,165,250,.05),transparent);pointer-events:none;${AA('fc-scan', live ? 5 : 9)}}

            .fc .hd{position:relative;display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}
            .fc .eye{font-size:10.5px;font-weight:800;letter-spacing:.24em;color:#60a5fa}
            .fc .h1{margin-top:4px;font-size:27px;font-weight:800;letter-spacing:-.03em;color:#f8fafc}
            .fc .sub{display:flex;align-items:center;gap:8px;margin-top:5px;font-size:12px;color:#64748b}
            .fc .live{position:relative;width:7px;height:7px;border-radius:50%;background:${live ? '#34d399' : '#475569'};box-shadow:0 0 ${live ? 8 : 0}px #34d399}
            .fc .live::after{content:"";position:absolute;inset:0;border-radius:50%;border:1.5px solid #34d399;${live ? AA('fc-ping', 1.6, 'ease-out') : 'display:none'}}
            .fc .tot{display:flex;align-items:center;gap:14px}
            .fc .donut{width:80px;height:80px;flex:none;overflow:visible}
            .fc .dspin{transform-origin:40px 40px;${live ? AA('fc-spin', 14) : ''}}
            .fc .dn{fill:#f8fafc;font-size:17px;font-weight:800;text-anchor:middle}
            .fc .dl{fill:#64748b;font-size:7px;font-weight:800;letter-spacing:.12em;text-anchor:middle}
            .fc .k{font-size:10px;font-weight:800;letter-spacing:.18em;color:#64748b;text-align:right}
            .fc .tv{margin-top:2px;font-size:36px;font-weight:700;line-height:1.05;text-align:right;color:${live ? '#f8fafc' : '#94a3b8'};${live ? AA('fc-glow', 2.6, 'ease-in-out') : ''}}
            .fc .tv small{margin-left:5px;font-size:15px;font-weight:700;color:#60a5fa}

            .fc .board{position:relative;display:flex;flex-direction:column;gap:10px;padding-left:10px}
            .fc .bus{position:absolute;left:8px;top:-8px;bottom:-8px;width:4px;border-radius:4px;background:linear-gradient(180deg,#60a5fa,#a78bfa,#34d399);opacity:${live ? .9 : .25};box-shadow:0 0 ${live ? 14 : 0}px rgba(96,165,250,.55);overflow:hidden}
            .fc .bus::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(180deg,rgba(255,255,255,.75) 0 5px,transparent 5px 22px);${live ? AA('fc-bus', .8) : 'display:none'}}
            .fc .bus-tag{position:absolute;left:-2px;top:-30px;display:flex;align-items:center;gap:4px;font-size:9px;font-weight:800;letter-spacing:.16em;color:#60a5fa}
            .fc .bus-tag ha-icon{--mdc-icon-size:14px;${live ? AA('fc-dot', 1.4, 'ease-in-out') : ''}}

            .fc .row{display:grid;grid-template-columns:44px minmax(0,1fr);align-items:center}
            .fc .lane{position:relative;height:20px}
            .fc .lane::before{content:"";position:absolute;left:-6px;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:50%;background:var(--c);opacity:.35;box-shadow:0 0 0 3px #060a13}
            .fc .lane.on::before{opacity:1;box-shadow:0 0 0 3px #060a13,0 0 10px var(--c)}
            .fc .trk{position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.14) 0 4px,transparent 4px 8px)}
            .fc .lane.on .trk{height:3px;margin-top:-1.5px;background:linear-gradient(90deg,rgba(255,255,255,.3),var(--c));box-shadow:0 0 10px var(--c)}
            .fc .pt{position:absolute;top:50%;left:0;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:50%;background:#fff;box-shadow:0 0 6px var(--c),0 0 14px var(--c)}

            .fc .cell{position:relative;overflow:hidden;display:grid;grid-template-columns:84px minmax(0,1fr) auto;align-items:center;gap:16px;padding:10px 18px 10px 10px;border-radius:22px;background:linear-gradient(135deg,rgba(255,255,255,.035),rgba(255,255,255,.01));border:1px solid rgba(255,255,255,.07);transition:transform .25s,border-color .3s}
            .fc .cell:hover{transform:translateX(3px)}
            .fc .row.on .cell{border-color:color-mix(in srgb,var(--c) 45%,transparent);background:radial-gradient(120% 140% at 0% 50%,color-mix(in srgb,var(--c) 16%,transparent),transparent 60%),linear-gradient(135deg,rgba(255,255,255,.04),rgba(255,255,255,.01));box-shadow:0 0 28px color-mix(in srgb,var(--c) 14%,transparent)}
            .fc .row.on .cell::after{content:"";position:absolute;top:0;bottom:0;left:-30%;width:25%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent);transform:skewX(-20deg);pointer-events:none;${AA('fc-sweep', 4.5, 'ease-in-out')}}
            ${R.map((r, i) => `.fc .row:nth-child(${i + 2}) .cell::after{animation-delay:${ph(4.5, i * 1.1)}}`).join('')}
            .fc .row.dead .cell{opacity:.5;filter:grayscale(.7)}

            .fc .node{position:relative;width:84px;height:84px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,rgba(255,255,255,.07),rgba(0,0,0,.3));border:1px solid rgba(255,255,255,.08)}
            .fc .row.on .node::before{content:"";position:absolute;inset:-3px;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 55%,var(--c) 85%,#fff 90%,transparent 100%);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2.5px),#000 calc(100% - 2.5px));mask:radial-gradient(farthest-side,transparent calc(100% - 2.5px),#000 calc(100% - 2.5px));${AA('fc-spin', 2.4)}}
            .fc .sc{position:relative;width:76px;height:76px;overflow:visible}
            .fc .stm{transform-box:fill-box;transform-origin:center;filter:blur(1.5px)}

            .fc .info{min-width:0}
            .fc .nm{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
            .fc .nm span{font-size:16px;font-weight:800;letter-spacing:-.01em;color:#f8fafc}
            .fc .nm em{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-style:normal;font-size:9.5px;font-weight:800;letter-spacing:.1em;color:var(--s);background:color-mix(in srgb,var(--s) 12%,transparent);border:1px solid color-mix(in srgb,var(--s) 35%,transparent)}
            .fc .nm em b{position:relative;width:6px;height:6px;border-radius:50%;background:var(--s)}
            .fc .row.on .nm em b::after{content:"";position:absolute;inset:0;border-radius:50%;border:1.5px solid var(--s);${AA('fc-ping', 1.4, 'ease-out')}}
            .fc .meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:6px}
            .fc .m{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:#94a3b8}
            .fc .m ha-icon{--mdc-icon-size:14px;opacity:.85}
            .fc .m.spin ha-icon{${AA('fc-spin', 2.2)}}
            .fc .led{display:flex;gap:3px;max-width:280px;margin-top:9px}
            .fc .led i{flex:1;height:7px;border-radius:2px;background:rgba(255,255,255,.07)}
            .fc .led i.on{background:var(--c);box-shadow:0 0 6px color-mix(in srgb,var(--c) 60%,transparent)}

            .fc .pw{min-width:96px;text-align:right}
            .fc .pw .v{font-size:31px;font-weight:700;line-height:1;color:#f8fafc}
            .fc .row:not(.on) .pw .v{color:#475569}
            .fc .pw small{margin-left:4px;font-size:13px;font-weight:700;color:var(--c)}
            .fc .pw .p{margin-top:6px;font-size:10.5px;font-weight:600;color:#64748b}

            @container (max-width:560px){
              .fc{padding:16px 12px}
              .fc .hd{flex-wrap:wrap}
              .fc .h1{font-size:22px}
              .fc .tv{font-size:28px}
              .fc .row{grid-template-columns:22px minmax(0,1fr)}
              .fc .cell{grid-template-columns:62px minmax(0,1fr);grid-template-areas:"n i" "n p";gap:4px 12px;padding:10px 12px 10px 8px}
              .fc .node{grid-area:n;width:62px;height:62px}
              .fc .sc{width:56px;height:56px}
              .fc .info{grid-area:i}
              .fc .pw{grid-area:p;display:flex;align-items:baseline;gap:10px;min-width:0;text-align:left}
              .fc .pw .v{font-size:22px}
              .fc .pw .p{margin-top:0}
            }
            @media (prefers-reduced-motion:reduce){.fc *,.fc *::before,.fc *::after{animation:none!important}}

            @keyframes fc-spin{to{transform:rotate(360deg)}}
            @keyframes fc-spinr{to{transform:rotate(-360deg)}}
            @keyframes fc-wave{from{transform:translateX(0)}to{transform:translateX(-50px)}}
            @keyframes fc-slosh{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
            @keyframes fc-bub{0%{transform:translate(0,0);opacity:0}15%{opacity:.75}50%{transform:translate(1.5px,calc(var(--h) * .5))}100%{transform:translate(-1px,var(--h));opacity:0}}
            @keyframes fc-heat{0%{transform:translateY(6px);opacity:0}30%{opacity:.9}100%{transform:translateY(-10px);opacity:0}}
