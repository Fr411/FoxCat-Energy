                legacy_hc_2: 'sensor.foxcat_energy_energie_seche_linge_consommation_hc_aujourdhui',
                legacy_hp: '[[foxcat:legacy.sensor_seche_linge_puissance_hp_energy]]',
                legacy_hp_2: 'sensor.foxcat_energy_energie_seche_linge_consommation_hp_aujourdhui'
              },

              lave_vaisselle: {
                gestion: '[[foxcat:legacy.switch_foxcat_energy_machines_gestion_lave_vaisselle]]',
                energie_jour: 'sensor.foxcat_energy_energie_lave_vaisselle_energie_aujourdhui',
                part_solaire_jour: 'sensor.foxcat_energy_energie_lave_vaisselle_part_solaire_aujourdhui',
                part_reseau_jour: 'sensor.foxcat_energy_energie_lave_vaisselle_part_reseau_aujourdhui',
                cout_jour: 'sensor.foxcat_energy_tarification_lave_vaisselle_cout_aujourdhui',
                consommation_hp_jour: 'sensor.foxcat_energy_energie_lave_vaisselle_consommation_hp_aujourdhui',
                consommation_hc_jour: 'sensor.foxcat_energy_energie_lave_vaisselle_consommation_hc_aujourdhui',
                tarif_actuel: 'sensor.foxcat_energy_tarification_lave_vaisselle_tarif_actuel',
                puissance: '',
                cycle: '',
                boutons: {
                  demarrer: 'button.foxcat_energy_fonctions_utilisateur_demarrage_utilisateur_lave_vaisselle',
