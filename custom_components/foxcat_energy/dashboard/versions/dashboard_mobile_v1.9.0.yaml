                cout_jour: 'sensor.foxcat_energy_tarification_seche_linge_cout_aujourdhui',
                consommation_hp_jour: 'sensor.foxcat_energy_energie_seche_linge_consommation_hp_aujourdhui',
                consommation_hc_jour: 'sensor.foxcat_energy_energie_seche_linge_consommation_hc_aujourdhui',
                tarif_actuel: 'sensor.foxcat_energy_tarification_seche_linge_tarif_actuel',
                puissance: '',
                cycle: '',
                boutons: {
                  demarrer: 'button.foxcat_energy_fonctions_utilisateur_demarrage_utilisateur_seche_linge',
                  arreter: 'button.foxcat_energy_fonctions_utilisateur_arret_utilisateur_seche_linge',
                  auto: ''
                },
