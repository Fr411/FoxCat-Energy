                    o6:
                      card:
                        type: custom:button-card
                        show_icon: false
                        show_state: false
                        name: '[[[ return states[''[[foxcat:pricing.network_policy]]'']?.attributes?.options?.[5] ?? '''' ]]]'
                        triggers_update:
                        - [[foxcat:pricing.network_policy]]
                        tap_action:
