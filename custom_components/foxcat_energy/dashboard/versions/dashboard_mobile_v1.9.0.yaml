    - type: custom:button-card
      show_name: false
      show_icon: false
      show_state: false
      triggers_update: all
      styles:
        card:
        - padding: 0
        - border-radius: 26px
        - overflow: hidden
        - box-sizing: border-box
        - width: 100%
        - max-width: 350px
        - margin: 0 auto
        - background: radial-gradient(120% 60% at 0% 0%, rgba(25,216,255,0.08), transparent 55%), linear-gradient(160deg,#070b14,#0b1626 60%,#08101c)
        - border: 1px solid rgba(255,255,255,0.09)
        - box-shadow: 0 16px 40px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.06)
        grid:
        - grid-template-areas: '"content"'
        - grid-template-columns: 1fr
        custom_fields:
          content:
          - width: 100%
      custom_fields:
        content: |-
          [[[
          /* FOXCAT · TARIFICATION DÉTAILLÉE — 350px */
          const BAD = ['unknown', 'unavailable', 'none', ''];
          const raw = (id) => { const s = id ? states[id] : null; return (!s || s.state == null || BAD.includes(String(s.state))) ? null : s; };
          const num = (id, fb = null) => { const s = raw(id); if (!s) return fb; const v = parseFloat(s.state); return Number.isFinite(v) ? v : fb; };
          const txt = (id, fb = '—') => { const s = raw(id); return s ? s.state : fb; };
          const unit = (id) => String(raw(id)?.attributes?.unit_of_measurement ?? '');
          const norm = (v) => String(v ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
          const fin = Number.isFinite;
          const clamp = (v, a, b) => Math.min(Math.max(v, a), b);

          const fmtPrice = (v) => fin(v) ? `${v.toFixed(4)} €/kWh` : '—';
          const fmtRate = (v) => fin(v) ? `${v.toFixed(3)} €/h` : '—';
          const fmtEuro = (v) => fin(v) ? `${v.toFixed(2)} €` : '—';
          const fmtKwh = (v) => fin(v) ? `${Math.max(0, v).toFixed(2)} kWh` : '—';
          const fmtSav = (id) => {
            const v = num(id);
            if (!fin(v)) return '—';
            const u = unit(id);
            return (u.includes('€') || u === 'EUR') ? fmtEuro(v) : `${v.toFixed(2)} ${u || 'kWh'}`;
          };

          const E = {
            regime: 'sensor.foxcat_energy_tarification_regime_tarifaire_actif',
            period: 'sensor.foxcat_energy_tarification_periode_tarifaire',
            status: 'sensor.foxcat_energy_tarification_statut_du_prix',
            model: 'sensor.foxcat_energy_tarification_modele_de_cout',
            activeBuy: '[[foxcat:legacy.sensor_foxcat_energy_tarification_prix_d_achat_actif]]',
            hp: 'sensor.foxcat_energy_tarification_prix_heures_pleines_hp',
            hc: 'sensor.foxcat_energy_tarification_prix_heures_creuses_hc',
            hpSrc: 'sensor.foxcat_energy_tarification_source_prix_heures_pleines',
            hcSrc: 'sensor.foxcat_energy_tarification_source_prix_heures_creuses',
            fixedInj: 'sensor.foxcat_energy_tarification_prix_fixe_de_reinjection',
            dynCur: 'sensor.foxcat_energy_tarification_prix_dynamique_actuel',
            dynNext: 'sensor.foxcat_energy_tarification_prix_dynamique_heure_suivante',
            dynExport: 'sensor.foxcat_energy_tarification_valeur_economique_de_la_reinjection',
            dynGross: 'sensor.foxcat_energy_tarification_dynamic_cout_achat_aujourdhui',
            negative: 'sensor.foxcat_energy_tarification_prix_dynamique_negatif_actif',
            importRate: 'sensor.foxcat_energy_tarification_cout_instantane_du_prelevement',
            exportRate: 'sensor.foxcat_energy_tarification_valeur_instantanee_de_la_reinjection',
            netRate: 'sensor.foxcat_energy_tarification_solde_financier_instantane_reseau',
            importDay: 'sensor.foxcat_energy_energie_maison_prelevement_reseau_aujourdhui',
            exportDay: 'sensor.foxcat_energy_energie_pv_reinjection_aujourdhui',
            selfDay: 'sensor.foxcat_energy_energie_pv_energie_autoconsommee_aujourdhui',
            netCostDay: 'sensor.foxcat_energy_tarification_maison_cout_net_aujourdhui',
            exportValueDay: 'sensor.foxcat_energy_tarification_pv_valeur_reinjection_aujourdhui',
            exportCostDay: 'sensor.foxcat_energy_tarification_pv_cout_reinjection_aujourdhui',
            pvBenefit: 'sensor.foxcat_energy_tarification_pv_gain_solaire_estime_aujourdhui',
            savDay: 'sensor.foxcat_energy_energie_economiser_avec_foxcat_energy_aujourdhui',
            savMonth: 'sensor.foxcat_energy_energie_economiser_avec_foxcat_energy_ce_mois',
            savYear: 'sensor.foxcat_energy_energie_economiser_avec_foxcat_energy_cette_annee'
          };

          /* ---------- RÉGIME ---------- */
          const regime = txt(E.regime, 'Compensation');
          const nr = norm(regime);
          const isDyn = nr.includes('dynamique');
          const isTou = nr.includes('bi horaire') || nr.includes('hp hc');
          const period = txt(E.period, '—');
          const isHP = period === 'HP';
          const primary = isDyn ? '#a78bfa' : isTou ? (isHP ? '#ff922b' : '#19d8ff') : '#35e59d';
          const pill = isDyn ? 'DYNAMIQUE · TEMPS RÉEL' : isTou ? `HP / HC · ${period}` : 'COMPENSATION';
          const secTag = isDyn ? 'TEMPS RÉEL' : isTou ? `PÉRIODE ${period}` : 'COMPENSATION';
          const method = isDyn ? 'DYNAMIQUE · INTÉGRÉ' : isTou ? 'HP / HC · INTÉGRÉ' : 'COMPENSATION · SUIVI';

          /* ---------- PRIX ---------- */
          const hp = num(E.hp), hc = num(E.hc), fixedInj = num(E.fixedInj);
          const dynCur = num(E.dynCur), dynNext = num(E.dynNext), dynExport = num(E.dynExport);
          let buy = num(E.activeBuy);
          if (!fin(buy)) buy = isDyn ? dynCur : (isHP ? hp : hc);
          const negative = txt(E.negative, 'NON') === 'OUI';

          let trend = 'STABLE', trendIcon = '→', trendColor = '#94a3b8', delta = null;
          if (fin(dynCur) && fin(dynNext)) {
            delta = dynNext - dynCur;
            if (delta > 0.01) { trend = 'HAUSSE'; trendIcon = '↗'; trendColor = '#fb7185'; }
            else if (delta < -0.01) { trend = 'BAISSE'; trendIcon = '↘'; trendColor = '#35e59d'; }
          }
          const subLine = isDyn
            ? `${trendIcon} ${trend}${delta == null ? '' : ` · ${delta > 0 ? '+' : ''}${delta.toFixed(4)} €/kWh`}`
            : isTou ? `Tarif ${isHP ? 'HP' : 'HC'} appliqué`
            : 'Réinjection compensée sur le prélèvement';

          /* ---------- STATUT ---------- */
          const statusTxt = txt(E.status);
          const sn = norm(statusTxt);
          const statusColor = (sn.includes('avantage') || sn.includes('bas') || sn.includes('negatif')) ? '#35e59d'
                            : (sn.includes('eleve') || sn.includes('cher')) ? '#fb7185' : '#facc15';

          /* ---------- IMPACT INSTANTANÉ ---------- */
          const impRate = num(E.importRate), expRate = num(E.exportRate), netRate = num(E.netRate);
          const netColor = fin(netRate) && netRate <= 0 ? '#35e59d' : '#19d8ff';

          /* ---------- JOURNÉE ---------- */
          const importDay = Math.max(num(E.importDay, 0), 0);
          const exportDay = Math.max(num(E.exportDay, 0), 0);
          const selfDay = Math.max(num(E.selfDay, 0), 0);
          const netCostDay = num(E.netCostDay, 0);
          const exportValueDay = num(E.exportValueDay, 0);
          const exportRevenueDay = Math.max(exportValueDay, 0);
          const exportCostDay = Math.max(num(E.exportCostDay, Math.max(-exportValueDay, 0)), 0);
          const dynGross = num(E.dynGross);
          const grossDay = (isDyn && fin(dynGross)) ? Math.max(dynGross, 0)
                         : Math.max(netCostDay - exportCostDay + exportRevenueDay, 0);
          const pvBenefit = num(E.pvBenefit, 0);
          const solarSaving = Math.max(pvBenefit - exportRevenueDay + exportCostDay, 0);
          const noPv = Math.max(grossDay + solarSaving, 0);
          const houseTotal = Math.max(selfDay + importDay, 0.0001);
          const pSelf = clamp(selfDay / houseTotal * 100, 0, 100);
          const pGrid = 100 - pSelf;

          /* ---------- ÉCONOMIES ---------- */
          const savMonthV = num(E.savMonth), savYearV = num(E.savYear);
          const savPct = (fin(savMonthV) && fin(savYearV) && savYearV > 0) ? clamp(savMonthV / savYearV * 100, 0, 100) : 0;

          /* ---------- ANALYSE ---------- */
          let aTitle, aText, aColor = primary;
          if (isDyn) {
            if (negative) { aTitle = 'Prix négatif actif'; aColor = '#35e59d'; aText = `Prix d'achat négatif : ${fmtPrice(dynCur)}.`; }
            else if (trend === 'HAUSSE') { aTitle = 'Hausse prévue'; aColor = '#fb7185'; aText = `${fmtPrice(dynCur)} → ${fmtPrice(dynNext)} à l'heure suivante.`; }
            else if (trend === 'BAISSE') { aTitle = 'Baisse prévue'; aColor = '#35e59d'; aText = `${fmtPrice(dynCur)} → ${fmtPrice(dynNext)} à l'heure suivante.`; }
            else { aTitle = 'Prix relativement stable'; aText = 'Prix actuel et heure suivante proches.'; }
          } else if (isTou) {
            aTitle = isHP ? 'Heures pleines actives' : 'Heures creuses actives';
            aText = `Tarif ${isHP ? 'HP' : 'HC'} appliqué : ${fmtPrice(buy)}.`;
          } else {
            aTitle = 'Régime compensation';
            aText = 'FoxCat utilise le modèle de compensation pour le bilan réseau.';
          }

          /* ---------- COMPOSANTS ---------- */
          const tile = (label, price, sub, accent, on) => `
            <div class="tile${on ? ' on' : ''}" style="--a:${accent}">
              <span>${label}</span><strong>${price}</strong><em>${sub}</em>
            </div>`;

          let tariffHtml;
          if (isTou) {
            tariffHtml = `
              <div class="grid2">
                ${tile('HEURES PLEINES', fmtPrice(hp), `Source · ${txt(E.hpSrc)}`, '#ff922b', isHP)}
                ${tile('HEURES CREUSES', fmtPrice(hc), `Source · ${txt(E.hcSrc)}`, '#19d8ff', !isHP && period !== '—')}
              </div>`;
          } else if (isDyn) {
            tariffHtml = `
              <div class="grid2">
                ${tile('ACTUEL', fmtPrice(dynCur), `${trendIcon} ${trend}`, trendColor, true)}
                ${tile('HEURE SUIVANTE', fmtPrice(dynNext), delta == null ? '—' : `${delta > 0 ? '+' : ''}${delta.toFixed(4)} €/kWh`, '#a78bfa', false)}
              </div>
              <div class="row gap"><span>RÉINJECTION (VALEUR)</span><strong style="color:#35e59d">${fmtPrice(dynExport)}</strong></div>`;
          } else {
            tariffHtml = `
              <div class="row"><span>PRIX ACHAT ACTIF</span><strong style="color:${primary}">${fmtPrice(buy)}</strong></div>
              <div class="row gap"><span>RÉINJECTION</span><strong>${fmtPrice(fixedInj)}</strong></div>`;
          }

          return `
          <style>
            .c{padding:16px;color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif}
            .lbl{color:#7c8ba1;font-size:9.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
            .head{display:flex;justify-content:space-between;align-items:center;gap:8px}
            .pill{padding:4px 9px;border-radius:999px;font-size:9.5px;font-weight:900;letter-spacing:.06em;white-space:nowrap;color:${primary};background:${primary}1a;border:1px solid ${primary}40}
            .hero{margin-top:12px;padding:14px;border-radius:18px;background:linear-gradient(135deg,${primary}16,rgba(255,255,255,.02));border:1px solid ${primary}33}
            .big{margin-top:4px;font-size:30px;font-weight:900;letter-spacing:-.02em;color:${primary};white-space:nowrap}
            .big small{font-size:12px;color:#64748b;font-weight:700;margin-left:6px;letter-spacing:0}
            .sub{margin-top:4px;font-size:10.5px;color:#64748b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
            .sec{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:16px 2px 8px;color:#8a9ab0;font-size:9.5px;font-weight:800;letter-spacing:.14em}
            .sec span{color:#64748b;font-size:9px;letter-spacing:.08em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
            .gap{margin-top:8px}
            .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
            .tile{min-width:0;padding:11px 12px;border-radius:14px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07)}
            .tile.on{border-color:var(--a);background:linear-gradient(145deg,color-mix(in srgb,var(--a) 12%,transparent),rgba(255,255,255,.02))}
            .tile span{display:block;color:var(--a);font-size:9px;font-weight:800;letter-spacing:.08em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
            .tile strong{display:block;margin-top:5px;font-size:14px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
            .tile em{display:block;margin-top:3px;font-style:normal;color:#64748b;font-size:9.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
            .row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.05);min-width:0}
            .row span{color:#7c8ba1;font-size:9.5px;font-weight:800;letter-spacing:.08em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
            .row strong{font-size:13px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
            .box{min-width:0;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06)}
            .box span{display:block;color:#7c8ba1;font-size:9px;font-weight:800;letter-spacing:.08em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
            .box strong{display:block;margin-top:4px;font-size:14px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
            .bar{margin-top:10px}
            .bar-track{display:flex;height:8px;border-radius:99px;overflow:hidden;background:rgba(255,255,255,.06)}
            .bar-legend{display:flex;justify-content:space-between;gap:8px;margin-top:6px;font-size:9.5px;font-weight:700;white-space:nowrap}
            .bar-legend span{overflow:hidden;text-overflow:ellipsis}
            .daily{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px;border-radius:18px;background:radial-gradient(circle at 100% 0%,rgba(53,229,157,.12),transparent 50%),linear-gradient(135deg,rgba(25,216,255,.06),rgba(255,255,255,.02));border:1px solid rgba(25,216,255,.2)}
            .daily-val{margin-top:4px;font-size:30px;font-weight:900;color:#35e59d;letter-spacing:-.02em;white-space:nowrap}
            .method{display:inline-block;margin-top:8px;padding:3px 8px;border-radius:7px;color:#94a3b8;background:rgba(255,255,255,.05);font-size:9px;font-weight:800;letter-spacing:.08em}
            .analysis{margin-top:14px;padding:12px 14px;border-radius:16px;background:${aColor}12;border:1px solid ${aColor}33}
            .analysis b{display:block;color:${aColor};font-size:12.5px;font-weight:900}
            .analysis p{margin:4px 0 0;color:#94a3b8;font-size:10.5px;line-height:1.45}
            .foot{display:flex;justify-content:space-between;gap:8px;margin-top:14px;padding-top:10px;border-top:1px solid rgba(255,255,255,.06);font-size:9.5px;color:#64748b;white-space:nowrap}
            .foot span{overflow:hidden;text-overflow:ellipsis}
            .foot strong{color:#94a3b8}
          </style>
          <div class="c">

            <div class="head"><span class="lbl">FoxCat · Tarification</span><span class="pill">${pill}</span></div>

            <div class="hero">
              <div class="lbl">Prix d'achat actif</div>
              <div class="big">${fin(buy) ? buy.toFixed(4) : '—'}<small>€/kWh</small></div>
              <div class="sub">${subLine}</div>
            </div>

            <div class="sec">TARIFICATION<span>${secTag}</span></div>
            ${tariffHtml}

            <div class="sec">IMPACT INSTANTANÉ<span>€ / h</span></div>
            <div class="row"><span>PRÉLÈVEMENT</span><strong style="color:#fb7185">${fmtRate(impRate)}</strong></div>
            <div class="row gap"><span>RÉINJECTION</span><strong style="color:#35e59d">${fmtRate(expRate)}</strong></div>
            <div class="row gap"><span>SOLDE RÉSEAU</span><strong style="color:${netColor}">${fmtRate(netRate)}</strong></div>

            <div class="sec">COÛT DU JOUR<span>DEPUIS 00:00</span></div>
            <div class="daily">
              <div>
                <div class="lbl">Coût net</div>
                <div class="daily-val">${fmtEuro(netCostDay)}</div>
                <div class="method">${method}</div>
              </div>
              <div style="text-align:right;min-width:0">
                <div class="lbl">Prélèvement</div>
                <strong style="display:block;margin-top:6px;font-size:16px;font-weight:900;white-space:nowrap">${fmtKwh(importDay)}</strong>
              </div>
            </div>
            <div class="grid2 gap">
              <div class="box"><span>COÛT BRUT RÉSEAU</span><strong>${fmtEuro(grossDay)}</strong></div>
              <div class="box"><span>GAIN SOLAIRE PV</span><strong style="color:#ff922b">${fmtEuro(pvBenefit)}</strong></div>
              <div class="box"><span>RÉINJECTÉ</span><strong style="color:#35e59d">${fmtKwh(exportDay)}</strong></div>
              <div class="box"><span>COÛT SANS PV</span><strong style="color:#19d8ff">${fmtEuro(noPv)}</strong></div>
            </div>
            <div class="bar">
              <div class="bar-track">
                <div style="width:${pSelf}%;background:linear-gradient(90deg,#ff922b,#ffc46b)"></div>
                <div style="width:${pGrid}%;background:linear-gradient(90deg,#fb7185,#f43f5e)"></div>
              </div>
              <div class="bar-legend">
                <span style="color:#ff922b">Autoconso ${fmtKwh(selfDay)} · ${pSelf.toFixed(0)} %</span>
                <span style="color:#fb7185">Réseau ${fmtKwh(importDay)} · ${pGrid.toFixed(0)} %</span>
              </div>
            </div>

            <div class="sec">ÉCONOMIES FOXCAT<span>OPTIMISATION</span></div>
            <div class="row"><span>ÉCONOMISÉ AUJOURD'HUI</span><strong style="color:#facc15">${fmtSav(E.savDay)}</strong></div>
            <div class="grid2 gap">
              <div class="box"><span>CE MOIS</span><strong style="color:#facc15">${fmtSav(E.savMonth)}</strong></div>
              <div class="box"><span>CETTE ANNÉE</span><strong style="color:#facc15">${fmtSav(E.savYear)}</strong></div>
            </div>
            <div class="bar">
              <div class="bar-track"><div style="width:${savPct}%;background:linear-gradient(90deg,#facc15,#35e59d)"></div></div>
              <div class="bar-legend"><span>Part du mois dans l'année</span><span style="color:#facc15">${savPct.toFixed(0)} %</span></div>
            </div>

            <div class="analysis">
              <b>${aTitle}</b>
              <p>${aText}</p>
            </div>

            <div class="foot">
              <span>Modèle · <strong>${txt(E.model)}</strong></span>
              <span>Statut · <strong style="color:${statusColor}">${statusTxt}</strong></span>
            </div>

          </div>`;
          ]]]
      tap_action:
        action: none
      hold_action:
        action: none
      double_tap_action:
        action: none
    column_span: 2
  - type: grid
    cards: []
