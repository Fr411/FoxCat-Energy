          [[[
          /* ==========================================================
          FOXCAT ENERGY V1.5.0 — CONSOMMATION APPAREILS (PREMIUM)
          Même logique que la version précédente, rendu repensé.
          Les entités se modifient dans le registre ENTITIES.
          ========================================================== */
            /* ---------- OUTILS ---------- */
            const norm = (v) => String(v ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
            const validState = (id) => { const s = id ? states[id] : null; return !!s && !['unknown','unavailable','none',''].includes(String(s.state)); };
            const stateOf = (id, fb = '—') => validState(id) ? states[id].state : fb;
            const numberOf = (id, fb = 0) => { if (!validState(id)) return fb; const v = Number.parseFloat(states[id].state); return Number.isFinite(v) ? v : fb; };
            const isOn = (id) => !!id && states[id]?.state === 'on';
            const clamp = (v, a, b) => Math.min(Math.max(Number(v) || 0, a), b);
            const fmtEnergy = (v) => `${Math.max(0, Number(v) || 0).toFixed(2)} kWh`;
            const fmtEuro = (v) => `${Number(v || 0).toFixed(2)} €`;
            const fmtPrice = (v) => Number.isFinite(Number(v)) ? `${Number(v).toFixed(4)} €/kWh` : '—';
            const fmtPower = (v) => { const x = Math.max(0, Number(v) || 0); return x >= 1000 ? `${(x / 1000).toFixed(2)} kW` : `${Math.round(x)} W`; };

            /* ==========================================================
               REGISTRE CENTRAL DES ENTITÉS — C'EST ICI QU'ON MODIFIE
               '' = recherche automatique FoxCat
               ========================================================== */
            const ENTITIES = {
