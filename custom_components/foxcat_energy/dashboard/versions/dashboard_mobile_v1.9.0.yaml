        - color: '#e8f1fb'
        - background: 'radial-gradient(circle at 3% 0%, rgba(255,120,20,0.12), transparent 30%), radial-gradient(circle at 95% 10%, rgba(0,210,255,0.10), transparent 34%), linear-gradient(135deg, #080d16 0%, #0a1420 48%, #071827 100%)'
        - border: 1px solid rgba(255,255,255,0.08)
        grid:
