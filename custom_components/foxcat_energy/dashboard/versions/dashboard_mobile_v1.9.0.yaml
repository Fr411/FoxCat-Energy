                  auto: ''
                },
                legacy_gestion: '[[foxcat:legacy.switch_foxcat_energy_machines_gestion_lave_vaisselle]]',
                legacy_puissance: '[[foxcat:legacy.sensor_lave_vaisselle_puissance]]',
                legacy_puissance_2: '[[foxcat:legacy.sensor_lave_vaisselle_power]]',
                legacy_cycle: '[[foxcat:machines.dishwasher.cycle]]',
                legacy_cycle_2: '[[foxcat:legacy.binary_sensor_lave_vaisselle_en_cours]]',
                legacy_energie: 'sensor.foxcat_energy_energie_lave_vaisselle_energie_aujourdhui',
                legacy_energie_2: 'sensor.foxcat_energy_energie_lave_vaisselle_energie_aujourdhui',
                legacy_cout: 'sensor.foxcat_energy_tarification_lave_vaisselle_cout_aujourdhui',
                legacy_cout_2: 'sensor.foxcat_energy_tarification_lave_vaisselle_cout_aujourdhui',
                legacy_hc: '[[foxcat:legacy.sensor_lave_vaisselle_puissance_hc_energy]]',
                legacy_hc_2: 'sensor.foxcat_energy_energie_lave_vaisselle_consommation_hc_aujourdhui',
                legacy_hp: '[[foxcat:legacy.sensor_lave_vaisselle_puissance_hp_energy]]',
                legacy_hp_2: 'sensor.foxcat_energy_energie_lave_vaisselle_consommation_hp_aujourdhui'
              }
            };

            /* ---------- OUTILS DU REGISTRE ---------- */
            const entityList = (...values) => values.flat(Infinity).filter((id) => typeof id === 'string' && id.trim() !== '');
            const firstExisting = (...values) => entityList(...values).find((id) => !!states[id]) || null;
            const entityText = (id) => norm(`${id} ${states[id]?.attributes?.friendly_name || ''}`);

            const findFox = (domain, words = [], candidates = [], rejectedWords = []) => {
              for (const id of candidates) { if (states[id]) return id; }
              const wanted = words.map(norm).filter(Boolean);
              const rejected = rejectedWords.map(norm).filter(Boolean);
              return Object.keys(states)
                .filter((id) => id.startsWith(`${domain}.`))
                .find((id) => {
                  const t = entityText(id);
                  const fox = t.includes('foxcat energy') || norm(id).includes('foxcat energy');
                  return fox && wanted.every((w) => t.includes(w)) && !rejected.some((w) => t.includes(w));
                }) || null;
            };

            const findPowerSensor = (deviceWords = [], candidates = []) => {
              for (const id of candidates) { if (states[id]) return id; }
              const wanted = deviceWords.map(norm).filter(Boolean);
              return Object.keys(states)
                .filter((id) => id.startsWith('sensor.'))
                .find((id) => {
                  const s = states[id];
                  const t = entityText(id);
                  const unit = s?.attributes?.unit_of_measurement || '';
                  const cls = s?.attributes?.device_class || '';
                  return wanted.some((w) => t.includes(w)) && (cls === 'power' || unit === 'W' || unit === 'kW');
                }) || null;
            };

            const management = (words, legacy = null, preferred = null) => {
              const native = findFox('switch', words, entityList(preferred));
              if (native) return { entity: native, enabled: isOn(native), native: true };
              const legacyEntity = firstExisting(legacy);
              if (legacyEntity) return { entity: legacyEntity, enabled: isOn(legacyEntity), native: false };
              return { entity: null, enabled: false, native: false };
            };

            /* ---------- CONTEXTE FOXCAT ---------- */
            const F = ENTITIES.foxcat;
            const modeEntity = findFox('select', ['mode','ems'], entityList(F.mode_ems));
            const tariffEntity = findFox('select', ['regime','tarifaire'], entityList(F.regime_tarifaire));
            const tariffActiveEntity = findFox('sensor', ['regime','tarifaire','actif'], entityList(F.regime_tarifaire_actif));
            const periodEntity = findFox('sensor', ['periode','tarifaire'], entityList(F.periode_tarifaire));
            const activePriceEntity = findFox('sensor', ['prix','achat','actif'], entityList(F.prix_achat_actif));
            const priceStatusEntity = findFox('sensor', ['statut','prix'], entityList(F.statut_prix));
            const machineWindowEntity = findFox('binary_sensor', ['fenetre','machines'], entityList(F.fenetre_machines));
            const protectedMachineEntity = findFox('binary_sensor', ['machine','protegee','active'], entityList(F.machine_protegee_active));
            const highLoadEntity = findFox('binary_sensor', ['delestage','haute','consommation','actif'], entityList(F.delestage_haute_consommation_actif));
            const loadSheddingStatusEntity = findFox('sensor', ['statut','delestage','haute','consommation'], entityList(F.statut_delestage_haute_consommation));

            const mode = stateOf(modeEntity, '—');
            const tariff = stateOf(tariffEntity, stateOf(tariffActiveEntity, '—'));
            const tariffPeriod = stateOf(periodEntity, '—');
            const activePrice = numberOf(activePriceEntity, numberOf(ENTITIES.external.prix_luminus_fallback, 0));
            const priceStatus = stateOf(priceStatusEntity, '—');
            const machineWindow = isOn(machineWindowEntity);
            const protectedMachine = isOn(protectedMachineEntity);
            const highLoad = isOn(highLoadEntity);
            const loadSheddingStatus = stateOf(loadSheddingStatusEntity, highLoad ? 'ACTIF' : 'NORMAL');

            const houseAccountingEntity = findFox('sensor', ['maison','consommation','aujourd'], entityList(F.consommation_maison_aujourdhui));
            const houseCostEntity = findFox('sensor', ['maison','cout','net','aujourd'], entityList(F.cout_net_maison_aujourdhui));
            const totalHouseEnergy = numberOf(houseAccountingEntity, 0);
            const totalHouseCost = numberOf(houseCostEntity, 0);

            /* ---------- CONFIGURATION DES APPAREILS ---------- */
            const mk = (id, reg, nativeNames, name, icon, color, words, legacyGestion, powerKeys, cycleKeys) => ({
              id, registry: reg, nativeNames, name, icon, color,
              buttons: reg.boutons || {},
              management: management(words, legacyGestion, reg.gestion),
              powerCandidates: entityList(powerKeys.map((k) => reg[k])),
              cycleCandidates: entityList(cycleKeys.map((k) => reg[k])),
              legacy: {
                energy: entityList(reg.legacy_energie, reg.legacy_energie_2),
                cost: entityList(reg.legacy_cout, reg.legacy_cout_2),
                hc: entityList(reg.legacy_hc, reg.legacy_hc_2),
                hp: entityList(reg.legacy_hp, reg.legacy_hp_2)
              }
            });

            const devices = [
              mk('boiler', ENTITIES.boiler, ['chauffe eau','boiler'], 'Boiler ECS', 'mdi:water-boiler', '#ff922b',
                 ['boiler','gere','foxcat'], ENTITIES.boiler.legacy_gestion,
                 ['puissance','legacy_puissance'], ['cycle','legacy_cycle_2','legacy_cycle']),
              mk('washer', ENTITIES.lave_linge, ['lave linge','washer'], 'Lave-linge', 'mdi:washing-machine', '#19d8ff',
                 ['gestion','lave linge'], ENTITIES.lave_linge.legacy_gestion,
                 ['puissance','legacy_puissance','legacy_puissance_2'], ['cycle','legacy_cycle','legacy_cycle_2']),
              mk('dryer', ENTITIES.seche_linge, ['seche linge','dryer'], 'Sèche-linge', 'mdi:tumble-dryer', '#a78bfa',
                 ['gestion','seche linge'], ENTITIES.seche_linge.legacy_gestion,
                 ['puissance','legacy_puissance','legacy_puissance_2'], ['cycle','legacy_cycle','legacy_cycle_2']),
              mk('dishwasher', ENTITIES.lave_vaisselle, ['lave vaisselle','dishwasher'], 'Lave-vaisselle', 'mdi:dishwasher', '#35e59d',
                 ['gestion','lave vaisselle'], ENTITIES.lave_vaisselle.legacy_gestion,
                 ['puissance','legacy_puissance','legacy_puissance_2'], ['cycle','legacy_cycle','legacy_cycle_2'])
            ];

            const nativeApplianceSensor = (device, metricWords, rejected = []) => {
              for (const w of device.nativeNames) {
                const id = findFox('sensor', [w, ...metricWords], [], rejected);
                if (id) return id;
              }
              return null;
            };
            const legacyCandidate = (ids = []) => ids.find((id) => states[id]) || null;

            /* ---------- CONSTRUCTION DES DONNÉES ---------- */
            const activeDevices = devices
              .filter((d) => d.management.enabled)
              .map((d) => {
                const r = d.registry;
                const energyEntity = firstExisting(r.energie_jour) || nativeApplianceSensor(d, ['energie','aujourd']) || legacyCandidate(d.legacy.energy);
                const solarEntity = firstExisting(r.part_solaire_jour) || nativeApplianceSensor(d, ['part','solaire','aujourd']);
                const gridEntity = firstExisting(r.part_reseau_jour) || nativeApplianceSensor(d, ['part','reseau','aujourd']);
                const costEntity = firstExisting(r.cout_jour) || nativeApplianceSensor(d, ['cout','aujourd']) || legacyCandidate(d.legacy.cost);
                const hpEntity = firstExisting(r.consommation_hp_jour) || nativeApplianceSensor(d, ['consommation','hp','aujourd']) || legacyCandidate(d.legacy.hp);
                const hcEntity = firstExisting(r.consommation_hc_jour) || nativeApplianceSensor(d, ['consommation','hc','aujourd']) || legacyCandidate(d.legacy.hc);
                const tariffNowEntity = firstExisting(r.tarif_actuel) || nativeApplianceSensor(d, ['tarif','actuel']);

                const powerEntity = d.id === 'boiler'
                  ? (findFox('sensor', ['puissance','chauffe','eau'], entityList(r.puissance)) || findPowerSensor(d.nativeNames, d.powerCandidates))
                  : findPowerSensor(d.nativeNames, d.powerCandidates);

                const cycleEntity = d.id === 'boiler'
                  ? (findFox('binary_sensor', ['boiler','physique'], entityList(r.cycle)) || d.cycleCandidates.find((id) => states[id]) || null)
                  : (d.cycleCandidates.find((id) => states[id]) || null);

                const energy = Math.max(numberOf(energyEntity, 0), 0);
                const solar = Math.max(numberOf(solarEntity, 0), 0);
                const grid = Math.max(numberOf(gridEntity, Math.max(energy - solar, 0)), 0);
                const hp = Math.max(numberOf(hpEntity, 0), 0);
                const hc = Math.max(numberOf(hcEntity, 0), 0);
                const cost = Math.max(numberOf(costEntity, energy * Math.max(activePrice, 0)), 0);
                const power = Math.max(numberOf(powerEntity, 0), 0);
                const tariffNow = stateOf(tariffNowEntity, tariffPeriod);
                const running = (cycleEntity && isOn(cycleEntity)) || power > 20;
                const tariffTotal = hp + hc;
                const partHC = tariffTotal > 0 ? clamp((hc / tariffTotal) * 100, 0, 100) : 0;
                const partHP = tariffTotal > 0 ? clamp((hp / tariffTotal) * 100, 0, 100) : 0;
                const solarShare = energy > 0 ? clamp((solar / energy) * 100, 0, 100) : 0;
                const gridShare = energy > 0 ? clamp((grid / energy) * 100, 0, 100) : 0;
                const avgPrice = energy > 0 ? cost / energy : 0;
                const nativeAccounting = !!(
                  firstExisting(r.energie_jour, r.part_solaire_jour, r.part_reseau_jour, r.cout_jour, r.consommation_hp_jour, r.consommation_hc_jour, r.tarif_actuel)
                  || solarEntity || gridEntity
                  || (costEntity && norm(costEntity).includes('foxcat energy'))
                );

                return { ...d, hpEntity, hcEntity, powerEntity, cycleEntity, energy, solar, grid, hp, hc, cost, power, tariffNow,
                         running, partHC, partHP, solarShare, gridShare, avgPrice, nativeAccounting };
              });

            /* ---------- TOTAUX ---------- */
            const sum = (k) => activeDevices.reduce((s, d) => s + d[k], 0);
            const activeEnergy = sum('energy');
            const activeSolar = sum('solar');
            const activeGrid = sum('grid');
            const activeCost = sum('cost');
            const runningCount = activeDevices.filter((d) => d.running).length;
            const totalSolarShare = activeEnergy > 0 ? clamp((activeSolar / activeEnergy) * 100, 0, 100) : 0;
            const totalGridShare = activeEnergy > 0 ? clamp((activeGrid / activeEnergy) * 100, 0, 100) : 0;
            const totalAvg = activeEnergy > 0 ? activeCost / activeEnergy : 0;

            const priceColor = (() => {
              const p = norm(priceStatus);
              if (p.includes('avantage') || p.includes('bas') || p.includes('negatif')) return '#35e59d';
              if (p.includes('eleve') || p.includes('cher')) return '#fb7185';
              return '#facc15';
            })();

            /* ---------- COMPOSANTS VISUELS ---------- */
            const C = 2 * Math.PI * 34;
            const ring = (pct, color) => `
              <svg viewBox="0 0 80 80" class="ring">
                <circle cx="40" cy="40" r="34" class="ring-bg"></circle>
                <circle cx="40" cy="40" r="34" class="ring-fg" transform="rotate(-90 40 40)"
                  style="stroke:${color};stroke-dasharray:${(pct / 100 * C).toFixed(1)} ${C.toFixed(1)}"></circle>
                <text x="40" y="42" class="ring-num">${pct.toFixed(0)}<tspan class="ring-pct">%</tspan></text>
                <text x="40" y="55" class="ring-cap">SOLAIRE</text>
              </svg>`;

            const chip = (icon, label, value, color = '#e2e8f0') => `
              <div class="chip">
                <ha-icon icon="${icon}"></ha-icon>
                <div><span>${label}</span><strong style="color:${color}">${value}</strong></div>
              </div>`;

            const pill = (label, value, color) => `
              <div class="pill"><i style="background:${color};box-shadow:0 0 8px ${color}"></i>${label}<strong style="color:${color}">${value}</strong></div>`;

            /* ---------- BOUTONS D'UNE TUILE ---------- */
            const actionsHtml = (d) => {
              const B = d.buttons || {};
              const defs = [
                { id: B.demarrer, label: 'Démarrer', icon: 'mdi:play', color: '#35e59d', confirm: '' },
                { id: B.arreter, label: 'Off', icon: 'mdi:stop', color: '#fb7185', confirm: `Arrêter : ${d.name} ?` },
                { id: B.auto, label: 'Auto', icon: 'mdi:auto-mode', color: '#a78bfa', confirm: '' }
              ].filter((b) => b.id);
              if (!defs.length) return '';
              const btn = (b) => states[b.id]
                ? `<button class="act" style="--c:${b.color}" onclick="event.stopPropagation();window.__foxcatPress(this,'${b.id}',${b.confirm ? `'${b.confirm}'` : 'null'})"><ha-icon icon="${b.icon}"></ha-icon>${b.label}</button>`
                : `<button class="act" style="--c:${b.color}" disabled title="Entité introuvable : ${b.id}"><ha-icon icon="${b.icon}"></ha-icon>${b.label}</button>`;
              return `<div class="actions" style="--n:${defs.length}">${defs.map(btn).join('')}</div>`;
            };

            /* ---------- CARTES APPAREILS ---------- */
            const cardHtml = activeDevices.map((d) => {
              const tariffColor = isPeak(d.tariffNow) ? '#ff922b' : '#19d8ff';
              const hasSplit = d.hpEntity || d.hcEntity || (d.hp + d.hc) > 0;
              const powerPct = clamp((d.power / 3000) * 100, 0, 100);

              return `
              <div class="device ${d.running ? 'is-running' : ''}" style="--device:${d.color}">

                <div class="device-top">
                  <div class="device-icon"><ha-icon icon="${d.icon}"></ha-icon></div>
                  <div class="device-id">
                    <div class="device-name">${d.name}</div>
                    <div class="device-src">
                      <i></i>${d.management.native ? 'Gestion FoxCat' : 'Gestion legacy'}
                      · ${d.nativeAccounting ? 'Comptabilité native' : 'Estimation'}
                    </div>
                  </div>
                  <div class="badge ${d.running ? 'on' : 'off'}">
                    <i></i>${d.running ? 'En cours' : 'En attente'}
                  </div>
                </div>

                <div class="device-body">
                  ${ring(d.solarShare, d.color)}
                  <div class="device-figures">
                    <div class="fig">
                      <span>Énergie du jour</span>
                      <strong class="big" style="color:${d.color}">${fmtEnergy(d.energy)}</strong>
                    </div>
                    <div class="fig">
                      <span>Coût du jour</span>
                      <strong class="big money">${fmtEuro(d.cost)}</strong>
                    </div>
                  </div>
                </div>

                <div class="power">
                  <div class="power-head">
                    <span>Puissance instantanée</span>
                    <strong>${fmtPower(d.power)}</strong>
                  </div>
                  <div class="track"><div class="power-fill" style="width:${powerPct}%"></div></div>
                </div>

                <div class="split">
                  <div>
                    <span class="lbl solar">Part solaire</span>
                    <strong>${fmtEnergy(d.solar)}</strong>
                    <small>${d.solarShare.toFixed(0)} %</small>
                  </div>
                  <div class="right">
                    <span class="lbl grid">Part réseau</span>
                    <strong>${fmtEnergy(d.grid)}</strong>
                    <small>${d.gridShare.toFixed(0)} %</small>
                  </div>
                </div>
                <div class="track duo">
                  <div style="width:${d.solarShare}%;background:linear-gradient(90deg,#ff922b,#ffc46b)"></div>
                  <div style="width:${d.gridShare}%;background:linear-gradient(90deg,#fb7185,#f43f5e)"></div>
                </div>

                ${hasSplit ? `
                  <div class="split tight">
                    <div>
                      <span class="lbl hc">Heures creuses</span>
                      <strong>${fmtEnergy(d.hc)}</strong>
                      <small>${d.partHC.toFixed(1)} %</small>
                    </div>
                    <div class="right">
                      <span class="lbl hp">Heures pleines</span>
                      <strong>${fmtEnergy(d.hp)}</strong>
                      <small>${d.partHP.toFixed(1)} %</small>
                    </div>
                  </div>
                  <div class="track duo">
                    <div style="width:${d.partHC}%;background:linear-gradient(90deg,#19d8ff,#7be8ff)"></div>
                    <div style="width:${d.partHP}%;background:linear-gradient(90deg,#ff922b,#ffc46b)"></div>
                  </div>
                ` : `<div class="nosplit">Aucune répartition HP / HC enregistrée aujourd'hui</div>`}

                <div class="device-foot">
                  <div><span>Tarif appareil</span><strong style="color:${tariffColor}">${d.tariffNow}</strong></div>
                  <div class="right"><span>Prix moyen</span><strong>${d.energy > 0 ? `${d.avgPrice.toFixed(3)} €/kWh` : '—'}</strong></div>
                </div>

                ${actionsHtml(d)}
              </div>`;
            }).join('');

            const emptyHtml = `
              <div class="empty">
                <ha-icon icon="mdi:power-plug-off-outline"></ha-icon>
                <div>
                  <strong>Aucun appareil géré par FoxCat</strong>
                  <span>Active la gestion d'un appareil dans FoxCat EMS pour afficher sa comptabilité énergétique.</span>
                </div>
              </div>`;

            /* ==========================================================
               RENDU
               ========================================================== */
            return `
              <style>
                * { box-sizing:border-box; }
                .wrap { padding:26px; color:#f8fafc; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif; }
                ha-icon { display:inline-flex; }

                /* HEADER */
                .header { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:20px; }
                .brand { display:flex; align-items:center; gap:14px; min-width:0; }
                .logo { width:54px; height:54px; flex:none; display:flex; align-items:center; justify-content:center; border-radius:18px; color:#19d8ff;
                  background:linear-gradient(135deg,rgba(255,146,43,.16),rgba(25,216,255,.16));
                  border:1px solid rgba(255,255,255,.12); box-shadow:0 0 28px rgba(25,216,255,.18), inset 0 1px 0 rgba(255,255,255,.12); }
                .logo ha-icon { --mdc-icon-size:28px; }
                .eyebrow { color:#19d8ff; font-size:11px; font-weight:800; letter-spacing:.22em; }
                .title { margin-top:4px; font-size:26px; font-weight:800; letter-spacing:-.02em;
                  background:linear-gradient(90deg,#fff,#a9bbd0); -webkit-background-clip:text; background-clip:text; color:transparent; }
                .subtitle { margin-top:3px; color:#64748b; font-size:12px; }
                .count { display:flex; align-items:center; gap:8px; padding:9px 14px; border-radius:999px; color:#35e59d; white-space:nowrap;
                  background:rgba(53,229,157,.07); border:1px solid rgba(53,229,157,.2); font-size:11px; font-weight:800; letter-spacing:.08em; }
                .count i { width:7px; height:7px; border-radius:50%; background:#35e59d; box-shadow:0 0 10px #35e59d; animation:pulse 2s infinite; }

                /* CONTEXTE */
                .context { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; margin-bottom:14px; }
                .chip { display:flex; align-items:center; gap:11px; min-width:0; padding:12px 14px; border-radius:16px;
                  background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.06); backdrop-filter:blur(8px); }
                .chip ha-icon { --mdc-icon-size:20px; color:#19d8ff; flex:none; opacity:.9; }
                .chip div { min-width:0; }
                .chip span { display:block; color:#64748b; font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; }
                .chip strong { display:block; margin-top:3px; font-size:13px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

                /* HÉROS */
                .hero { position:relative; overflow:hidden; display:grid; grid-template-columns:1.3fr 1fr; gap:22px; padding:22px; margin-bottom:14px; border-radius:22px;
                  background:linear-gradient(135deg,rgba(53,229,157,.07),rgba(25,216,255,.05) 50%,rgba(255,146,43,.06));
                  border:1px solid rgba(255,255,255,.08); box-shadow:inset 0 1px 0 rgba(255,255,255,.06); }
                .hero::after { content:""; position:absolute; inset:-40% -10% auto auto; width:260px; height:260px; border-radius:50%;
                  background:radial-gradient(circle,rgba(25,216,255,.16),transparent 70%); pointer-events:none; }
                .hero-label { color:#7c8ba1; font-size:11px; font-weight:800; letter-spacing:.16em; text-transform:uppercase; }
                .hero-cost { margin-top:8px; font-size:44px; line-height:1; font-weight:800; letter-spacing:-.03em; color:#35e59d; text-shadow:0 0 30px rgba(53,229,157,.25); }
                .hero-sub { margin-top:10px; color:#94a3b8; font-size:13px; }
                .hero-sub b { color:#e2e8f0; font-weight:700; }
                .hero-right { display:flex; flex-direction:column; justify-content:center; gap:12px; position:relative; z-index:1; }
                .hero-row { display:flex; justify-content:space-between; align-items:baseline; font-size:12px; color:#7c8ba1; }
                .hero-row strong { font-size:16px; font-weight:800; }
                .hero-row.solar strong { color:#ffa94d; }
                .hero-row.grid strong { color:#fb7185; }
                .hero-bar { display:flex; height:10px; border-radius:999px; overflow:hidden; background:rgba(255,255,255,.06); }

                /* BANDEAU ÉTAT */
                .pills { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px; }
                .pill { display:flex; align-items:center; gap:8px; padding:8px 13px; border-radius:999px; color:#7c8ba1; font-size:12px;
                  background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.06); }
                .pill i { width:7px; height:7px; border-radius:50%; }
                .pill strong { font-size:12px; font-weight:800; letter-spacing:.04em; }

                /* GRILLE */
                .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(290px,1fr)); gap:14px; }

                .device { position:relative; overflow:hidden; padding:18px; border-radius:22px;
                  background:linear-gradient(160deg,rgba(255,255,255,.045),rgba(255,255,255,.015));
                  border:1px solid rgba(255,255,255,.07); box-shadow:0 10px 30px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.05);
                  transition:transform .25s ease, border-color .25s ease, box-shadow .25s ease; }
                .device::before { content:""; position:absolute; inset:0 0 auto 0; height:3px; background:linear-gradient(90deg,var(--device),transparent 85%); opacity:.9; }
                .device::after { content:""; position:absolute; top:-70px; right:-70px; width:190px; height:190px; border-radius:50%;
                  background:radial-gradient(circle,var(--device),transparent 70%); opacity:.07; pointer-events:none; transition:opacity .4s; }
                .device:hover { transform:translateY(-2px); border-color:rgba(255,255,255,.14); }
                .device.is-running { border-color:rgba(53,229,157,.35); box-shadow:0 10px 34px rgba(0,0,0,.3), 0 0 0 1px rgba(53,229,157,.08), 0 0 34px rgba(53,229,157,.10); }
                .device.is-running::after { opacity:.16; }

                .device-top { display:flex; align-items:center; gap:12px; }
                .device-icon { width:44px; height:44px; flex:none; display:flex; align-items:center; justify-content:center; border-radius:14px; color:var(--device);
                  background:rgba(255,255,255,.045); border:1px solid rgba(255,255,255,.08); box-shadow:0 0 20px color-mix(in srgb,var(--device) 25%,transparent); }
                .device-icon ha-icon { --mdc-icon-size:23px; }
                .device-id { flex:1; min-width:0; }
                .device-name { font-size:16px; font-weight:800; letter-spacing:-.01em; }
                .device-src { display:flex; align-items:center; gap:6px; margin-top:4px; color:#64748b; font-size:10.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
                .device-src i { width:6px; height:6px; flex:none; border-radius:50%; background:#35e59d; box-shadow:0 0 8px rgba(53,229,157,.8); }
                .badge { display:flex; align-items:center; gap:6px; flex:none; padding:6px 10px; border-radius:999px; font-size:10px; font-weight:800; letter-spacing:.07em; text-transform:uppercase; }
                .badge i { width:6px; height:6px; border-radius:50%; background:currentColor; }
                .badge.on { color:#35e59d; background:rgba(53,229,157,.1); border:1px solid rgba(53,229,157,.25); }
                .badge.on i { animation:pulse 1.4s infinite; box-shadow:0 0 8px currentColor; }
                .badge.off { color:#64748b; background:rgba(100,116,139,.08); border:1px solid rgba(100,116,139,.18); }

                .device-body { display:flex; align-items:center; gap:18px; margin-top:18px; }
                .ring { width:96px; height:96px; flex:none; filter:drop-shadow(0 0 10px rgba(255,255,255,.05)); }
                .ring-bg { fill:none; stroke:rgba(255,255,255,.07); stroke-width:6; }
                .ring-fg { fill:none; stroke-width:6; stroke-linecap:round; transition:stroke-dasharray .8s cubic-bezier(.4,0,.2,1); }
                .ring-num { fill:#f8fafc; font-size:19px; font-weight:800; text-anchor:middle; }
                .ring-pct { font-size:9px; fill:#94a3b8; }
                .ring-cap { fill:#64748b; font-size:5.6px; font-weight:800; letter-spacing:.14em; text-anchor:middle; }
                .device-figures { flex:1; display:flex; flex-direction:column; gap:12px; min-width:0; }
                .fig span { display:block; color:#7c8ba1; font-size:10px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; }
                .big { display:block; margin-top:3px; font-size:24px; font-weight:800; letter-spacing:-.02em; }
                .big.money { color:#35e59d; }

                .power { margin-top:18px; padding-top:14px; border-top:1px solid rgba(255,255,255,.06); }
                .power-head { display:flex; justify-content:space-between; align-items:baseline; color:#7c8ba1; font-size:12px; }
                .power-head strong { color:#f1f5f9; font-size:14px; font-weight:800; }
                .track { display:flex; height:7px; margin-top:9px; overflow:hidden; border-radius:999px; background:rgba(255,255,255,.06); }
                .track.duo > div { height:100%; transition:width .8s cubic-bezier(.4,0,.2,1); }
                .power-fill { height:100%; border-radius:999px; background:linear-gradient(90deg,var(--device),#fff); transition:width .8s; box-shadow:0 0 12px var(--device); }

                .split { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:16px; }
                .split.tight { margin-top:14px; }
                .split > div { display:flex; flex-direction:column; }
                .split .right { text-align:right; }
                .lbl { font-size:10px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; }
                .lbl.solar { color:#ffa94d; } .lbl.grid { color:#fb7185; } .lbl.hc { color:#19d8ff; } .lbl.hp { color:#ffa94d; }
                .split strong { margin-top:4px; color:#f1f5f9; font-size:15px; font-weight:800; }
                .split small { margin-top:2px; color:#64748b; font-size:11px; }

                .nosplit { margin-top:14px; padding:10px; border-radius:12px; text-align:center; color:#64748b; font-size:11px; background:rgba(255,255,255,.02); border:1px dashed rgba(255,255,255,.08); }

                .device-foot { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:16px; padding-top:13px; border-top:1px solid rgba(255,255,255,.06); }
                .device-foot .right { text-align:right; }
                .device-foot span { display:block; color:#64748b; font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; }
                .device-foot strong { display:block; margin-top:4px; color:#cbd5e1; font-size:13px; font-weight:700; }

                /* BOUTONS */
                .actions { position:relative; z-index:1; display:grid; grid-template-columns:repeat(var(--n),minmax(0,1fr)); gap:8px; margin-top:14px; padding-top:13px; border-top:1px solid rgba(255,255,255,.06); }
                .act { display:flex; align-items:center; justify-content:center; gap:6px; padding:10px 6px; border-radius:14px; cursor:pointer;
                  font-family:inherit; font-size:12px; font-weight:800; letter-spacing:.04em; color:var(--c);
                  background:linear-gradient(160deg,color-mix(in srgb,var(--c) 16%,transparent),color-mix(in srgb,var(--c) 5%,transparent));
                  border:1px solid color-mix(in srgb,var(--c) 38%,transparent);
                  transition:transform .15s ease, box-shadow .2s ease, border-color .2s ease; -webkit-tap-highlight-color:transparent; }
                .act ha-icon { --mdc-icon-size:18px; }
                .act:hover { border-color:color-mix(in srgb,var(--c) 60%,transparent); box-shadow:0 0 18px color-mix(in srgb,var(--c) 22%,transparent); }
                .act:active { transform:scale(.96); }
                .act.busy { opacity:.55; pointer-events:none; }
                .act[disabled] { opacity:.35; cursor:not-allowed; box-shadow:none; }

                .empty { display:flex; align-items:center; gap:14px; padding:20px; border-radius:20px; color:#64748b; background:rgba(255,255,255,.025); border:1px dashed rgba(255,255,255,.1); }
                .empty ha-icon { --mdc-icon-size:30px; color:#475569; flex:none; }
                .empty strong { display:block; color:#94a3b8; font-size:14px; }
                .empty span { display:block; margin-top:4px; font-size:12px; line-height:1.45; }

                .house { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-top:16px; padding:14px 18px; border-radius:16px;
                  background:rgba(255,255,255,.025); border:1px solid rgba(255,255,255,.06); color:#7c8ba1; font-size:12px; }
                .house strong { color:#e2e8f0; font-size:14px; font-weight:800; margin-left:6px; }

                @keyframes pulse { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:.45; transform:scale(.8); } }

                @media(max-width:850px) { .context { grid-template-columns:repeat(2,minmax(0,1fr)); } .hero { grid-template-columns:1fr; } }
                @media(max-width:600px) {
                  .wrap { padding:16px; }
                  .title { font-size:21px; }
                  .hero-cost { font-size:36px; }
                  .grid { grid-template-columns:1fr; }
                  .big { font-size:21px; }
                  .count { display:none; }
                }
              </style>

              <div class="wrap">

                <div class="header">
                  <div class="brand">
                    <div class="logo"><ha-icon icon="mdi:home-lightning-bolt-outline"></ha-icon></div>
                    <div>
                      <div class="eyebrow">HOMEFOXCAT ENERGY</div>
                      <div class="title">Consommation appareils</div>
                      <div class="subtitle">Comptabilité native FoxCat Energy V1.5.0</div>
                    </div>
                  </div>
                  <div class="count">
                    <i></i>${activeDevices.length} APPAREIL${activeDevices.length > 1 ? 'S' : ''} GÉRÉ${activeDevices.length > 1 ? 'S' : ''}
                  </div>
                </div>

                <div class="context">
                  ${chip('mdi:brain', 'Mode EMS', mode)}
                  ${chip('mdi:calendar-clock', 'Régime tarifaire', tariff)}
                  ${chip('mdi:clock-time-four-outline', 'Période actuelle', tariffPeriod, isPeak(tariffPeriod) ? '#ff922b' : '#19d8ff')}
                  ${chip('mdi:cash-multiple', "Prix d'achat actif", fmtPrice(activePrice), priceColor)}
                </div>

                ${activeDevices.length > 0 ? `

                  <div class="hero">
                    <div>
                      <div class="hero-label">Coût appareils aujourd'hui</div>
                      <div class="hero-cost">${fmtEuro(activeCost)}</div>
                      <div class="hero-sub">
                        <b>${fmtEnergy(activeEnergy)}</b> consommés
                        ${activeEnergy > 0 ? ` · prix moyen <b>${totalAvg.toFixed(3)} €/kWh</b>` : ''}
                      </div>
                    </div>
                    <div class="hero-right">
                      <div class="hero-row solar"><span>Part solaire · ${totalSolarShare.toFixed(0)} %</span><strong>${fmtEnergy(activeSolar)}</strong></div>
                      <div class="hero-bar">
                        <div style="width:${totalSolarShare}%;background:linear-gradient(90deg,#ff922b,#ffc46b)"></div>
                        <div style="width:${totalGridShare}%;background:linear-gradient(90deg,#fb7185,#f43f5e)"></div>
                      </div>
                      <div class="hero-row grid"><span>Part réseau · ${totalGridShare.toFixed(0)} %</span><strong>${fmtEnergy(activeGrid)}</strong></div>
                    </div>
                  </div>

                  <div class="pills">
                    ${pill('Fenêtre machines', machineWindow ? 'OUVERTE' : 'FERMÉE', machineWindow ? '#35e59d' : '#64748b')}
                    ${pill('Machine protégée', protectedMachine ? 'OUI' : 'NON', protectedMachine ? '#facc15' : '#64748b')}
                    ${pill('En fonctionnement', String(runningCount), runningCount > 0 ? '#35e59d' : '#64748b')}
                    ${pill('Prix', priceStatus, priceColor)}
                    ${pill('Délestage', loadSheddingStatus, highLoad ? '#fb7185' : '#35e59d')}
                  </div>

                  <div class="grid">${cardHtml}</div>

                ` : emptyHtml}

                ${(totalHouseEnergy > 0 || totalHouseCost !== 0) ? `
                  <div class="house">
                    <span>Bilan maison FoxCat<strong>${fmtEnergy(totalHouseEnergy)}</strong></span>
                    <span>Coût net maison<strong style="color:#35e59d">${fmtEuro(totalHouseCost)}</strong></span>
                  </div>
                ` : ''}

              </div>
            `;
          ]]]
      tap_action:
        action: none
      hold_action:
        action: none
      double_tap_action:
        action: none
  - type: grid
    cards:
    - type: heading
      heading: Nouvelle section
    - type: custom:button-card
      show_name: false
      show_icon: false
      show_state: false
      triggers_update: all
      styles:
        card:
        - padding: 0
        - border-radius: 28px
        - overflow: hidden
        - background: radial-gradient(120% 80% at 0% 0%, rgba(25,216,255,0.10), transparent 55%), radial-gradient(100% 70% at 100% 100%, rgba(255,146,43,0.09), transparent 55%), linear-gradient(160deg,
        - border: 1px solid rgba(255,255,255,0.09)
        - box-shadow: 0 24px 60px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.06)
        grid:
        - grid-template-areas: '"content"'
        - grid-template-columns: 1fr
        custom_fields:
          content:
          - width: 100%
      custom_fields:
        content: |
          [[[
            /* ==========================================================
               FOXCAT ENERGY V1.5.0 — CONSOMMATION APPAREILS (PREMIUM)
               Même logique que la version précédente, rendu repensé.
               Les entités se modifient dans le registre ENTITIES.
               ========================================================== */

            /* ---------- OUTILS ---------- */
            const norm = (v) => String(v ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
            const validState = (id) => { const s = id ? states[id] : null; return !!s && !['unknown','unavailable','none',''].includes(String(s.state)); };
            const stateOf = (id, fb = '—') => validState(id) ? states[id].state : fb;
            const numberOf = (id, fb = 0) => { if (!validState(id)) return fb; const v = Number.parseFloat(states[id].state); return Number.isFinite(v) ? v : fb; };
            const isOn = (id) => !!id && states[id]?.state === 'on';
            const clamp = (v, a, b) => Math.min(Math.max(Number(v) || 0, a), b);
            const fmtEnergy = (v) => `${Math.max(0, Number(v) || 0).toFixed(2)} kWh`;
            const fmtEuro = (v) => `${Number(v || 0).toFixed(2)} €`;
            const fmtPrice = (v) => Number.isFinite(Number(v)) ? `${Number(v).toFixed(4)} €/kWh` : '—';
            const fmtPower = (v) => { const x = Math.max(0, Number(v) || 0); return x >= 1000 ? `${(x / 1000).toFixed(2)} kW` : `${Math.round(x)} W`; };

            /* ==========================================================
               REGISTRE CENTRAL DES ENTITÉS — C'EST ICI QU'ON MODIFIE
               '' = recherche automatique FoxCat
               ========================================================== */
            const ENTITIES = {
              foxcat: {
                mode_ems: '[[foxcat:ems.mode]]',
                regime_tarifaire: '[[foxcat:pricing.regime]]',
                regime_tarifaire_actif: 'sensor.foxcat_energy_tarification_regime_tarifaire_actif',
                periode_tarifaire: 'sensor.foxcat_energy_tarification_periode_tarifaire',
                prix_achat_actif: '[[foxcat:legacy.sensor_foxcat_energy_tarification_prix_d_achat_actif]]',
                statut_prix: 'sensor.foxcat_energy_tarification_statut_du_prix',
                fenetre_machines: 'binary_sensor.foxcat_energy_machines_fenetre_alimentation_machines',
                machine_protegee_active: 'binary_sensor.foxcat_energy_machines_machine_protegee_active',
                delestage_haute_consommation_actif: 'binary_sensor.foxcat_energy_ems_delestage_haute_consommation_actif',
                statut_delestage_haute_consommation: 'sensor.foxcat_energy_ems_statut_delestage_haute_consommation',
                consommation_maison_aujourdhui: 'sensor.foxcat_energy_energie_maison_consommation_aujourdhui',
                cout_net_maison_aujourdhui: 'sensor.foxcat_energy_tarification_maison_cout_net_aujourdhui'
              },
              external: { prix_luminus_fallback: '' },

              boiler: {
                gestion: '[[foxcat:legacy.switch_foxcat_energy_boiler_boiler_gere_par_foxcat]]',
                energie_jour: 'sensor.foxcat_energy_energie_chauffe_eau_energie_aujourdhui',
                part_solaire_jour: 'sensor.foxcat_energy_energie_chauffe_eau_part_solaire_aujourdhui',
                part_reseau_jour: 'sensor.foxcat_energy_energie_chauffe_eau_part_reseau_aujourdhui',
                cout_jour: 'sensor.foxcat_energy_tarification_chauffe_eau_cout_aujourdhui',
                consommation_hp_jour: 'sensor.foxcat_energy_energie_chauffe_eau_consommation_hp_aujourdhui',
                consommation_hc_jour: 'sensor.foxcat_energy_energie_chauffe_eau_consommation_hc_aujourdhui',
                tarif_actuel: 'sensor.foxcat_energy_tarification_chauffe_eau_tarif_actuel',
                puissance: '[[foxcat:legacy.sensor_foxcat_energy_boiler_puissance_chauffe_eau]]',
                cycle: '[[foxcat:legacy.binary_sensor_foxcat_energy_boiler_boiler_physique]]',
                legacy_gestion: '[[foxcat:legacy.switch_foxcat_energy_boiler_boiler_ecs_active]]',
                legacy_puissance: 'sensor.foxcat_energy_boiler_source_securite_thermique',
                legacy_cycle: '[[foxcat:boiler.binary_source]]',
                legacy_cycle_2: '[[foxcat:legacy.binary_sensor_foxcat_energy_boiler_boiler_physique]]',
                legacy_energie: 'sensor.foxcat_energy_energie_chauffe_eau_energie_aujourdhui',
                legacy_cout: 'sensor.foxcat_energy_tarification_chauffe_eau_cout_aujourdhui',
                legacy_hc: 'sensor.foxcat_energy_energie_chauffe_eau_consommation_hc_aujourdhui',
                legacy_hp: 'sensor.foxcat_energy_energie_chauffe_eau_consommation_hp_aujourdhui'
              },

              lave_linge: {
                gestion: '[[foxcat:legacy.switch_foxcat_energy_machines_gestion_lave_linge]]',
                energie_jour: 'sensor.foxcat_energy_energie_lave_linge_energie_aujourdhui',
                part_solaire_jour: 'sensor.foxcat_energy_energie_lave_linge_part_solaire_aujourdhui',
                part_reseau_jour: 'sensor.foxcat_energy_energie_lave_linge_part_reseau_aujourdhui',
                cout_jour: 'sensor.foxcat_energy_tarification_lave_linge_cout_aujourdhui',
                consommation_hp_jour: 'sensor.foxcat_energy_energie_lave_linge_consommation_hp_aujourdhui',
                consommation_hc_jour: 'sensor.foxcat_energy_energie_lave_linge_consommation_hc_aujourdhui',
                tarif_actuel: 'sensor.foxcat_energy_tarification_lave_linge_tarif_actuel',
                puissance: '',
                cycle: '',
                legacy_gestion: '[[foxcat:legacy.switch_foxcat_energy_machines_gestion_lave_linge]]',
                legacy_puissance: '[[foxcat:legacy.sensor_lave_linge_puissance]]',
                legacy_puissance_2: '[[foxcat:legacy.sensor_lave_linge_power]]',
                legacy_cycle: '[[foxcat:machines.washer.cycle]]',
                legacy_cycle_2: '[[foxcat:legacy.binary_sensor_lave_linge_en_cours]]',
                legacy_energie: 'sensor.foxcat_energy_energie_lave_linge_energie_aujourdhui',
                legacy_energie_2: 'sensor.foxcat_energy_energie_lave_linge_energie_aujourdhui',
                legacy_cout: 'sensor.foxcat_energy_tarification_lave_linge_cout_aujourdhui',
                legacy_cout_2: 'sensor.foxcat_energy_tarification_lave_linge_cout_aujourdhui',
                legacy_hc: '[[foxcat:legacy.sensor_lave_linge_puissance_hc_energy]]',
                legacy_hc_2: 'sensor.foxcat_energy_energie_lave_linge_consommation_hc_aujourdhui',
                legacy_hp: '[[foxcat:legacy.sensor_lave_linge_puissance_hp_energy]]',
                legacy_hp_2: 'sensor.foxcat_energy_energie_lave_linge_consommation_hp_aujourdhui'
              },

              seche_linge: {
                gestion: '[[foxcat:legacy.switch_foxcat_energy_machines_gestion_seche_linge]]',
                energie_jour: 'sensor.foxcat_energy_energie_seche_linge_energie_aujourdhui',
                part_solaire_jour: 'sensor.foxcat_energy_energie_seche_linge_part_solaire_aujourdhui',
                part_reseau_jour: 'sensor.foxcat_energy_energie_seche_linge_part_reseau_aujourdhui',
                cout_jour: 'sensor.foxcat_energy_tarification_seche_linge_cout_aujourdhui',
                consommation_hp_jour: 'sensor.foxcat_energy_energie_seche_linge_consommation_hp_aujourdhui',
                consommation_hc_jour: 'sensor.foxcat_energy_energie_seche_linge_consommation_hc_aujourdhui',
                tarif_actuel: 'sensor.foxcat_energy_tarification_seche_linge_tarif_actuel',
                puissance: '',
                cycle: '',
                legacy_gestion: '[[foxcat:legacy.switch_foxcat_energy_machines_gestion_seche_linge]]',
                legacy_puissance: '[[foxcat:legacy.sensor_seche_linge_puissance]]',
                legacy_puissance_2: '[[foxcat:legacy.sensor_seche_linge_power]]',
                legacy_cycle: '[[foxcat:machines.dryer.cycle]]',
                legacy_cycle_2: '[[foxcat:legacy.binary_sensor_seche_linge_en_cours]]',
                legacy_energie: 'sensor.foxcat_energy_energie_seche_linge_energie_aujourdhui',
                legacy_energie_2: 'sensor.foxcat_energy_energie_seche_linge_energie_aujourdhui',
                legacy_cout: 'sensor.foxcat_energy_tarification_seche_linge_cout_aujourdhui',
                legacy_cout_2: 'sensor.foxcat_energy_tarification_seche_linge_cout_aujourdhui',
                legacy_hc: '[[foxcat:legacy.sensor_seche_linge_puissance_hc_energy]]',
                legacy_hc_2: 'sensor.foxcat_energy_energie_seche_linge_consommation_hc_aujourdhui',
                legacy_hp: '[[foxcat:legacy.sensor_seche_linge_puissance_hp_energy]]',
                legacy_hp_2: 'sensor.foxcat_energy_energie_seche_linge_consommation_hp_aujourdhui'
              },

              lave_vaisselle: {
                gestion: '[[foxcat:legacy.switch_foxcat_energy_machines_gestion_lave_vaisselle]]',
                energie_jour: 'sensor.foxcat_energy_energie_lave_vaisselle_energie_aujourdhui',
                part_solaire_jour: 'sensor.foxcat_energy_energie_lave_vaisselle_part_solaire_aujourdhui',
                part_reseau_jour: 'sensor.foxcat_energy_energie_lave_vaisselle_part_reseau_aujourdhui',
                cout_jour: 'sensor.foxcat_energy_tarification_lave_vaisselle_cout_aujourdhui',
                consommation_hp_jour: 'sensor.foxcat_energy_energie_lave_vaisselle_consommation_hp_aujourdhui',
                consommation_hc_jour: 'sensor.foxcat_energy_energie_lave_vaisselle_consommation_hc_aujourdhui',
                tarif_actuel: 'sensor.foxcat_energy_tarification_lave_vaisselle_tarif_actuel',
                puissance: '',
                cycle: '',
                legacy_gestion: '[[foxcat:legacy.switch_foxcat_energy_machines_gestion_lave_vaisselle]]',
                legacy_puissance: '[[foxcat:legacy.sensor_lave_vaisselle_puissance]]',
                legacy_puissance_2: '[[foxcat:legacy.sensor_lave_vaisselle_power]]',
                legacy_cycle: '[[foxcat:machines.dishwasher.cycle]]',
                legacy_cycle_2: '[[foxcat:legacy.binary_sensor_lave_vaisselle_en_cours]]',
                legacy_energie: 'sensor.foxcat_energy_energie_lave_vaisselle_energie_aujourdhui',
                legacy_energie_2: 'sensor.foxcat_energy_energie_lave_vaisselle_energie_aujourdhui',
                legacy_cout: 'sensor.foxcat_energy_tarification_lave_vaisselle_cout_aujourdhui',
                legacy_cout_2: 'sensor.foxcat_energy_tarification_lave_vaisselle_cout_aujourdhui',
                legacy_hc: '[[foxcat:legacy.sensor_lave_vaisselle_puissance_hc_energy]]',
                legacy_hc_2: 'sensor.foxcat_energy_energie_lave_vaisselle_consommation_hc_aujourdhui',
                legacy_hp: '[[foxcat:legacy.sensor_lave_vaisselle_puissance_hp_energy]]',
                legacy_hp_2: 'sensor.foxcat_energy_energie_lave_vaisselle_consommation_hp_aujourdhui'
              }
            };

            /* ---------- OUTILS DU REGISTRE ---------- */
            const entityList = (...values) => values.flat(Infinity).filter((id) => typeof id === 'string' && id.trim() !== '');
            const firstExisting = (...values) => entityList(...values).find((id) => !!states[id]) || null;
            const entityText = (id) => norm(`${id} ${states[id]?.attributes?.friendly_name || ''}`);

            const findFox = (domain, words = [], candidates = [], rejectedWords = []) => {
              for (const id of candidates) { if (states[id]) return id; }
              const wanted = words.map(norm).filter(Boolean);
              const rejected = rejectedWords.map(norm).filter(Boolean);
              return Object.keys(states)
                .filter((id) => id.startsWith(`${domain}.`))
                .find((id) => {
                  const t = entityText(id);
                  const fox = t.includes('foxcat energy') || norm(id).includes('foxcat energy');
                  return fox && wanted.every((w) => t.includes(w)) && !rejected.some((w) => t.includes(w));
                }) || null;
            };

            const findPowerSensor = (deviceWords = [], candidates = []) => {
              for (const id of candidates) { if (states[id]) return id; }
              const wanted = deviceWords.map(norm).filter(Boolean);
              return Object.keys(states)
                .filter((id) => id.startsWith('sensor.'))
                .find((id) => {
                  const s = states[id];
                  const t = entityText(id);
                  const unit = s?.attributes?.unit_of_measurement || '';
                  const cls = s?.attributes?.device_class || '';
                  return wanted.some((w) => t.includes(w)) && (cls === 'power' || unit === 'W' || unit === 'kW');
                }) || null;
            };

            const management = (words, legacy = null, preferred = null) => {
              const native = findFox('switch', words, entityList(preferred));
              if (native) return { entity: native, enabled: isOn(native), native: true };
              const legacyEntity = firstExisting(legacy);
              if (legacyEntity) return { entity: legacyEntity, enabled: isOn(legacyEntity), native: false };
              return { entity: null, enabled: false, native: false };
            };

            /* ---------- CONTEXTE FOXCAT ---------- */
            const F = ENTITIES.foxcat;
            const modeEntity = findFox('select', ['mode','ems'], entityList(F.mode_ems));
            const tariffEntity = findFox('select', ['regime','tarifaire'], entityList(F.regime_tarifaire));
            const tariffActiveEntity = findFox('sensor', ['regime','tarifaire','actif'], entityList(F.regime_tarifaire_actif));
            const periodEntity = findFox('sensor', ['periode','tarifaire'], entityList(F.periode_tarifaire));
            const activePriceEntity = findFox('sensor', ['prix','achat','actif'], entityList(F.prix_achat_actif));
            const priceStatusEntity = findFox('sensor', ['statut','prix'], entityList(F.statut_prix));
            const machineWindowEntity = findFox('binary_sensor', ['fenetre','machines'], entityList(F.fenetre_machines));
            const protectedMachineEntity = findFox('binary_sensor', ['machine','protegee','active'], entityList(F.machine_protegee_active));
            const highLoadEntity = findFox('binary_sensor', ['delestage','haute','consommation','actif'], entityList(F.delestage_haute_consommation_actif));
            const loadSheddingStatusEntity = findFox('sensor', ['statut','delestage','haute','consommation'], entityList(F.statut_delestage_haute_consommation));

            const mode = stateOf(modeEntity, '—');
            const tariff = stateOf(tariffEntity, stateOf(tariffActiveEntity, '—'));
            const tariffPeriod = stateOf(periodEntity, '—');
            const activePrice = numberOf(activePriceEntity, numberOf(ENTITIES.external.prix_luminus_fallback, 0));
            const priceStatus = stateOf(priceStatusEntity, '—');
            const machineWindow = isOn(machineWindowEntity);
            const protectedMachine = isOn(protectedMachineEntity);
            const highLoad = isOn(highLoadEntity);
            const loadSheddingStatus = stateOf(loadSheddingStatusEntity, highLoad ? 'ACTIF' : 'NORMAL');

            const houseAccountingEntity = findFox('sensor', ['maison','consommation','aujourd'], entityList(F.consommation_maison_aujourdhui));
            const houseCostEntity = findFox('sensor', ['maison','cout','net','aujourd'], entityList(F.cout_net_maison_aujourdhui));
            const totalHouseEnergy = numberOf(houseAccountingEntity, 0);
            const totalHouseCost = numberOf(houseCostEntity, 0);

            /* ---------- CONFIGURATION DES APPAREILS ---------- */
            const mk = (id, reg, nativeNames, name, icon, color, words, legacyGestion, powerKeys, cycleKeys) => ({
              id, registry: reg, nativeNames, name, icon, color,
              management: management(words, legacyGestion, reg.gestion),
              powerCandidates: entityList(powerKeys.map((k) => reg[k])),
              cycleCandidates: entityList(cycleKeys.map((k) => reg[k])),
              legacy: {
                energy: entityList(reg.legacy_energie, reg.legacy_energie_2),
                cost: entityList(reg.legacy_cout, reg.legacy_cout_2),
                hc: entityList(reg.legacy_hc, reg.legacy_hc_2),
                hp: entityList(reg.legacy_hp, reg.legacy_hp_2)
              }
            });

            const devices = [
              mk('boiler', ENTITIES.boiler, ['chauffe eau','boiler'], 'Boiler ECS', 'mdi:water-boiler', '#ff922b',
                 ['boiler','gere','foxcat'], ENTITIES.boiler.legacy_gestion,
                 ['puissance','legacy_puissance'], ['cycle','legacy_cycle_2','legacy_cycle']),
              mk('washer', ENTITIES.lave_linge, ['lave linge','washer'], 'Lave-linge', 'mdi:washing-machine', '#19d8ff',
                 ['gestion','lave linge'], ENTITIES.lave_linge.legacy_gestion,
                 ['puissance','legacy_puissance','legacy_puissance_2'], ['cycle','legacy_cycle','legacy_cycle_2']),
              mk('dryer', ENTITIES.seche_linge, ['seche linge','dryer'], 'Sèche-linge', 'mdi:tumble-dryer', '#a78bfa',
                 ['gestion','seche linge'], ENTITIES.seche_linge.legacy_gestion,
                 ['puissance','legacy_puissance','legacy_puissance_2'], ['cycle','legacy_cycle','legacy_cycle_2']),
              mk('dishwasher', ENTITIES.lave_vaisselle, ['lave vaisselle','dishwasher'], 'Lave-vaisselle', 'mdi:dishwasher', '#35e59d',
                 ['gestion','lave vaisselle'], ENTITIES.lave_vaisselle.legacy_gestion,
                 ['puissance','legacy_puissance','legacy_puissance_2'], ['cycle','legacy_cycle','legacy_cycle_2'])
            ];

            const nativeApplianceSensor = (device, metricWords, rejected = []) => {
              for (const w of device.nativeNames) {
                const id = findFox('sensor', [w, ...metricWords], [], rejected);
                if (id) return id;
              }
              return null;
            };
            const legacyCandidate = (ids = []) => ids.find((id) => states[id]) || null;

            /* ---------- CONSTRUCTION DES DONNÉES ---------- */
            const activeDevices = devices
              .filter((d) => d.management.enabled)
              .map((d) => {
                const r = d.registry;
                const energyEntity = firstExisting(r.energie_jour) || nativeApplianceSensor(d, ['energie','aujourd']) || legacyCandidate(d.legacy.energy);
                const solarEntity = firstExisting(r.part_solaire_jour) || nativeApplianceSensor(d, ['part','solaire','aujourd']);
                const gridEntity = firstExisting(r.part_reseau_jour) || nativeApplianceSensor(d, ['part','reseau','aujourd']);
                const costEntity = firstExisting(r.cout_jour) || nativeApplianceSensor(d, ['cout','aujourd']) || legacyCandidate(d.legacy.cost);
                const hpEntity = firstExisting(r.consommation_hp_jour) || nativeApplianceSensor(d, ['consommation','hp','aujourd']) || legacyCandidate(d.legacy.hp);
                const hcEntity = firstExisting(r.consommation_hc_jour) || nativeApplianceSensor(d, ['consommation','hc','aujourd']) || legacyCandidate(d.legacy.hc);
                const tariffNowEntity = firstExisting(r.tarif_actuel) || nativeApplianceSensor(d, ['tarif','actuel']);

                const powerEntity = d.id === 'boiler'
                  ? (findFox('sensor', ['puissance','chauffe','eau'], entityList(r.puissance)) || findPowerSensor(d.nativeNames, d.powerCandidates))
                  : findPowerSensor(d.nativeNames, d.powerCandidates);

                const cycleEntity = d.id === 'boiler'
                  ? (findFox('binary_sensor', ['boiler','physique'], entityList(r.cycle)) || d.cycleCandidates.find((id) => states[id]) || null)
                  : (d.cycleCandidates.find((id) => states[id]) || null);

                const energy = Math.max(numberOf(energyEntity, 0), 0);
                const solar = Math.max(numberOf(solarEntity, 0), 0);
                const grid = Math.max(numberOf(gridEntity, Math.max(energy - solar, 0)), 0);
                const hp = Math.max(numberOf(hpEntity, 0), 0);
                const hc = Math.max(numberOf(hcEntity, 0), 0);
                const cost = Math.max(numberOf(costEntity, energy * Math.max(activePrice, 0)), 0);
                const power = Math.max(numberOf(powerEntity, 0), 0);
                const tariffNow = stateOf(tariffNowEntity, tariffPeriod);
                const running = (cycleEntity && isOn(cycleEntity)) || power > 20;
                const tariffTotal = hp + hc;
                const partHC = tariffTotal > 0 ? clamp((hc / tariffTotal) * 100, 0, 100) : 0;
                const partHP = tariffTotal > 0 ? clamp((hp / tariffTotal) * 100, 0, 100) : 0;
                const solarShare = energy > 0 ? clamp((solar / energy) * 100, 0, 100) : 0;
                const gridShare = energy > 0 ? clamp((grid / energy) * 100, 0, 100) : 0;
                const avgPrice = energy > 0 ? cost / energy : 0;
                const nativeAccounting = !!(
                  firstExisting(r.energie_jour, r.part_solaire_jour, r.part_reseau_jour, r.cout_jour, r.consommation_hp_jour, r.consommation_hc_jour, r.tarif_actuel)
                  || solarEntity || gridEntity
                  || (costEntity && norm(costEntity).includes('foxcat energy'))
                );

                return { ...d, hpEntity, hcEntity, powerEntity, cycleEntity, energy, solar, grid, hp, hc, cost, power, tariffNow,
                         running, partHC, partHP, solarShare, gridShare, avgPrice, nativeAccounting };
              });

            /* ---------- TOTAUX ---------- */
            const sum = (k) => activeDevices.reduce((s, d) => s + d[k], 0);
            const activeEnergy = sum('energy');
            const activeSolar = sum('solar');
            const activeGrid = sum('grid');
            const activeCost = sum('cost');
            const runningCount = activeDevices.filter((d) => d.running).length;
            const totalSolarShare = activeEnergy > 0 ? clamp((activeSolar / activeEnergy) * 100, 0, 100) : 0;
            const totalGridShare = activeEnergy > 0 ? clamp((activeGrid / activeEnergy) * 100, 0, 100) : 0;
            const totalAvg = activeEnergy > 0 ? activeCost / activeEnergy : 0;

            const priceColor = (() => {
              const p = norm(priceStatus);
              if (p.includes('avantage') || p.includes('bas') || p.includes('negatif')) return '#35e59d';
              if (p.includes('eleve') || p.includes('cher')) return '#fb7185';
              return '#facc15';
            })();

            /* ---------- COMPOSANTS VISUELS ---------- */
            const C = 2 * Math.PI * 34;
            const ring = (pct, color) => `
              <svg viewBox="0 0 80 80" class="ring">
                <circle cx="40" cy="40" r="34" class="ring-bg"></circle>
                <circle cx="40" cy="40" r="34" class="ring-fg" transform="rotate(-90 40 40)"
                  style="stroke:${color};stroke-dasharray:${(pct / 100 * C).toFixed(1)} ${C.toFixed(1)}"></circle>
                <text x="40" y="42" class="ring-num">${pct.toFixed(0)}<tspan class="ring-pct">%</tspan></text>
                <text x="40" y="55" class="ring-cap">SOLAIRE</text>
              </svg>`;

            const chip = (icon, label, value, color = '#e2e8f0') => `
              <div class="chip">
                <ha-icon icon="${icon}"></ha-icon>
                <div><span>${label}</span><strong style="color:${color}">${value}</strong></div>
              </div>`;

            const pill = (label, value, color) => `
              <div class="pill"><i style="background:${color};box-shadow:0 0 8px ${color}"></i>${label}<strong style="color:${color}">${value}</strong></div>`;

            /* ---------- CARTES APPAREILS ---------- */
            const cardHtml = activeDevices.map((d) => {
              const tariffColor = norm(d.tariffNow).includes('hp') ? '#ff922b' : '#19d8ff';
              const hasSplit = d.hpEntity || d.hcEntity || (d.hp + d.hc) > 0;
              const powerPct = clamp((d.power / 3000) * 100, 0, 100);

              return `
              <div class="device ${d.running ? 'is-running' : ''}" style="--device:${d.color}">

                <div class="device-top">
                  <div class="device-icon"><ha-icon icon="${d.icon}"></ha-icon></div>
                  <div class="device-id">
                    <div class="device-name">${d.name}</div>
                    <div class="device-src">
                      <i></i>${d.management.native ? 'Gestion FoxCat' : 'Gestion legacy'}
                      · ${d.nativeAccounting ? 'Comptabilité native' : 'Estimation'}
                    </div>
                  </div>
                  <div class="badge ${d.running ? 'on' : 'off'}">
                    <i></i>${d.running ? 'En cours' : 'En attente'}
                  </div>
                </div>

                <div class="device-body">
                  ${ring(d.solarShare, d.color)}
                  <div class="device-figures">
                    <div class="fig">
                      <span>Énergie du jour</span>
                      <strong class="big" style="color:${d.color}">${fmtEnergy(d.energy)}</strong>
                    </div>
                    <div class="fig">
                      <span>Coût du jour</span>
                      <strong class="big money">${fmtEuro(d.cost)}</strong>
                    </div>
                  </div>
                </div>

                <div class="power">
                  <div class="power-head">
                    <span>Puissance instantanée</span>
                    <strong>${fmtPower(d.power)}</strong>
                  </div>
                  <div class="track"><div class="power-fill" style="width:${powerPct}%"></div></div>
                </div>

                <div class="split">
                  <div>
                    <span class="lbl solar">Part solaire</span>
                    <strong>${fmtEnergy(d.solar)}</strong>
                    <small>${d.solarShare.toFixed(0)} %</small>
                  </div>
                  <div class="right">
                    <span class="lbl grid">Part réseau</span>
                    <strong>${fmtEnergy(d.grid)}</strong>
                    <small>${d.gridShare.toFixed(0)} %</small>
                  </div>
                </div>
                <div class="track duo">
                  <div style="width:${d.solarShare}%;background:linear-gradient(90deg,#ff922b,#ffc46b)"></div>
                  <div style="width:${d.gridShare}%;background:linear-gradient(90deg,#fb7185,#f43f5e)"></div>
                </div>

                ${hasSplit ? `
                  <div class="split tight">
                    <div>
                      <span class="lbl hc">Heures creuses</span>
                      <strong>${fmtEnergy(d.hc)}</strong>
                      <small>${d.partHC.toFixed(1)} %</small>
                    </div>
                    <div class="right">
                      <span class="lbl hp">Heures pleines</span>
                      <strong>${fmtEnergy(d.hp)}</strong>
                      <small>${d.partHP.toFixed(1)} %</small>
                    </div>
                  </div>
                  <div class="track duo">
                    <div style="width:${d.partHC}%;background:linear-gradient(90deg,#19d8ff,#7be8ff)"></div>
                    <div style="width:${d.partHP}%;background:linear-gradient(90deg,#ff922b,#ffc46b)"></div>
                  </div>
                ` : `<div class="nosplit">Aucune répartition HP / HC enregistrée aujourd'hui</div>`}

                <div class="device-foot">
                  <div><span>Tarif appareil</span><strong style="color:${tariffColor}">${d.tariffNow}</strong></div>
                  <div class="right"><span>Prix moyen</span><strong>${d.energy > 0 ? `${d.avgPrice.toFixed(3)} €/kWh` : '—'}</strong></div>
                </div>
              </div>`;
            }).join('');

            const emptyHtml = `
              <div class="empty">
                <ha-icon icon="mdi:power-plug-off-outline"></ha-icon>
                <div>
                  <strong>Aucun appareil géré par FoxCat</strong>
                  <span>Active la gestion d'un appareil dans FoxCat EMS pour afficher sa comptabilité énergétique.</span>
                </div>
              </div>`;

            /* ==========================================================
               RENDU
               ========================================================== */
            return `
              <style>
                * { box-sizing:border-box; }
                .wrap { padding:26px; color:#f8fafc; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif; }
                ha-icon { display:inline-flex; }

                /* HEADER */
                .header { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:20px; }
                .brand { display:flex; align-items:center; gap:14px; min-width:0; }
                .logo { width:54px; height:54px; flex:none; display:flex; align-items:center; justify-content:center; border-radius:18px; color:#19d8ff;
                  background:linear-gradient(135deg,rgba(255,146,43,.16),rgba(25,216,255,.16));
                  border:1px solid rgba(255,255,255,.12); box-shadow:0 0 28px rgba(25,216,255,.18), inset 0 1px 0 rgba(255,255,255,.12); }
                .logo ha-icon { --mdc-icon-size:28px; }
                .eyebrow { color:#19d8ff; font-size:11px; font-weight:800; letter-spacing:.22em; }
                .title { margin-top:4px; font-size:26px; font-weight:800; letter-spacing:-.02em;
                  background:linear-gradient(90deg,#fff,#a9bbd0); -webkit-background-clip:text; background-clip:text; color:transparent; }
                .subtitle { margin-top:3px; color:#64748b; font-size:12px; }
                .count { display:flex; align-items:center; gap:8px; padding:9px 14px; border-radius:999px; color:#35e59d; white-space:nowrap;
                  background:rgba(53,229,157,.07); border:1px solid rgba(53,229,157,.2); font-size:11px; font-weight:800; letter-spacing:.08em; }
                .count i { width:7px; height:7px; border-radius:50%; background:#35e59d; box-shadow:0 0 10px #35e59d; animation:pulse 2s infinite; }

                /* CONTEXTE */
                .context { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; margin-bottom:14px; }
                .chip { display:flex; align-items:center; gap:11px; min-width:0; padding:12px 14px; border-radius:16px;
                  background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.06); backdrop-filter:blur(8px); }
                .chip ha-icon { --mdc-icon-size:20px; color:#19d8ff; flex:none; opacity:.9; }
                .chip div { min-width:0; }
                .chip span { display:block; color:#64748b; font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; }
                .chip strong { display:block; margin-top:3px; font-size:13px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

                /* HÉROS */
                .hero { position:relative; overflow:hidden; display:grid; grid-template-columns:1.3fr 1fr; gap:22px; padding:22px; margin-bottom:14px; border-radius:22px;
                  background:linear-gradient(135deg,rgba(53,229,157,.07),rgba(25,216,255,.05) 50%,rgba(255,146,43,.06));
                  border:1px solid rgba(255,255,255,.08); box-shadow:inset 0 1px 0 rgba(255,255,255,.06); }
                .hero::after { content:""; position:absolute; inset:-40% -10% auto auto; width:260px; height:260px; border-radius:50%;
                  background:radial-gradient(circle,rgba(25,216,255,.16),transparent 70%); pointer-events:none; }
                .hero-label { color:#7c8ba1; font-size:11px; font-weight:800; letter-spacing:.16em; text-transform:uppercase; }
                .hero-cost { margin-top:8px; font-size:44px; line-height:1; font-weight:800; letter-spacing:-.03em; color:#35e59d; text-shadow:0 0 30px rgba(53,229,157,.25); }
                .hero-sub { margin-top:10px; color:#94a3b8; font-size:13px; }
                .hero-sub b { color:#e2e8f0; font-weight:700; }
                .hero-right { display:flex; flex-direction:column; justify-content:center; gap:12px; position:relative; z-index:1; }
                .hero-row { display:flex; justify-content:space-between; align-items:baseline; font-size:12px; color:#7c8ba1; }
                .hero-row strong { font-size:16px; font-weight:800; }
                .hero-row.solar strong { color:#ffa94d; }
                .hero-row.grid strong { color:#fb7185; }
                .hero-bar { display:flex; height:10px; border-radius:999px; overflow:hidden; background:rgba(255,255,255,.06); }

                /* BANDEAU ÉTAT */
                .pills { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px; }
                .pill { display:flex; align-items:center; gap:8px; padding:8px 13px; border-radius:999px; color:#7c8ba1; font-size:12px;
                  background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.06); }
                .pill i { width:7px; height:7px; border-radius:50%; }
                .pill strong { font-size:12px; font-weight:800; letter-spacing:.04em; }

                /* GRILLE */
                .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(290px,1fr)); gap:14px; }

                .device { position:relative; overflow:hidden; padding:18px; border-radius:22px;
                  background:linear-gradient(160deg,rgba(255,255,255,.045),rgba(255,255,255,.015));
                  border:1px solid rgba(255,255,255,.07); box-shadow:0 10px 30px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.05);
                  transition:transform .25s ease, border-color .25s ease, box-shadow .25s ease; }
                .device::before { content:""; position:absolute; inset:0 0 auto 0; height:3px; background:linear-gradient(90deg,var(--device),transparent 85%); opacity:.9; }
                .device::after { content:""; position:absolute; top:-70px; right:-70px; width:190px; height:190px; border-radius:50%;
                  background:radial-gradient(circle,var(--device),transparent 70%); opacity:.07; pointer-events:none; transition:opacity .4s; }
                .device:hover { transform:translateY(-2px); border-color:rgba(255,255,255,.14); }
                .device.is-running { border-color:rgba(53,229,157,.35); box-shadow:0 10px 34px rgba(0,0,0,.3), 0 0 0 1px rgba(53,229,157,.08), 0 0 34px rgba(53,229,157,.10); }
                .device.is-running::after { opacity:.16; }

                .device-top { display:flex; align-items:center; gap:12px; }
                .device-icon { width:44px; height:44px; flex:none; display:flex; align-items:center; justify-content:center; border-radius:14px; color:var(--device);
                  background:rgba(255,255,255,.045); border:1px solid rgba(255,255,255,.08); box-shadow:0 0 20px color-mix(in srgb,var(--device) 25%,transparent); }
                .device-icon ha-icon { --mdc-icon-size:23px; }
                .device-id { flex:1; min-width:0; }
                .device-name { font-size:16px; font-weight:800; letter-spacing:-.01em; }
                .device-src { display:flex; align-items:center; gap:6px; margin-top:4px; color:#64748b; font-size:10.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
                .device-src i { width:6px; height:6px; flex:none; border-radius:50%; background:#35e59d; box-shadow:0 0 8px rgba(53,229,157,.8); }
                .badge { display:flex; align-items:center; gap:6px; flex:none; padding:6px 10px; border-radius:999px; font-size:10px; font-weight:800; letter-spacing:.07em; text-transform:uppercase; }
                .badge i { width:6px; height:6px; border-radius:50%; background:currentColor; }
                .badge.on { color:#35e59d; background:rgba(53,229,157,.1); border:1px solid rgba(53,229,157,.25); }
                .badge.on i { animation:pulse 1.4s infinite; box-shadow:0 0 8px currentColor; }
                .badge.off { color:#64748b; background:rgba(100,116,139,.08); border:1px solid rgba(100,116,139,.18); }

                .device-body { display:flex; align-items:center; gap:18px; margin-top:18px; }
                .ring { width:96px; height:96px; flex:none; filter:drop-shadow(0 0 10px rgba(255,255,255,.05)); }
                .ring-bg { fill:none; stroke:rgba(255,255,255,.07); stroke-width:6; }
                .ring-fg { fill:none; stroke-width:6; stroke-linecap:round; transition:stroke-dasharray .8s cubic-bezier(.4,0,.2,1); }
                .ring-num { fill:#f8fafc; font-size:19px; font-weight:800; text-anchor:middle; }
                .ring-pct { font-size:9px; fill:#94a3b8; }
                .ring-cap { fill:#64748b; font-size:5.6px; font-weight:800; letter-spacing:.14em; text-anchor:middle; }
                .device-figures { flex:1; display:flex; flex-direction:column; gap:12px; min-width:0; }
                .fig span { display:block; color:#7c8ba1; font-size:10px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; }
                .big { display:block; margin-top:3px; font-size:24px; font-weight:800; letter-spacing:-.02em; }
                .big.money { color:#35e59d; }

                .power { margin-top:18px; padding-top:14px; border-top:1px solid rgba(255,255,255,.06); }
                .power-head { display:flex; justify-content:space-between; align-items:baseline; color:#7c8ba1; font-size:12px; }
                .power-head strong { color:#f1f5f9; font-size:14px; font-weight:800; }
                .track { display:flex; height:7px; margin-top:9px; overflow:hidden; border-radius:999px; background:rgba(255,255,255,.06); }
                .track.duo > div { height:100%; transition:width .8s cubic-bezier(.4,0,.2,1); }
                .power-fill { height:100%; border-radius:999px; background:linear-gradient(90deg,var(--device),#fff); transition:width .8s; box-shadow:0 0 12px var(--device); }

                .split { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:16px; }
                .split.tight { margin-top:14px; }
                .split > div { display:flex; flex-direction:column; }
                .split .right { text-align:right; }
                .lbl { font-size:10px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; }
                .lbl.solar { color:#ffa94d; } .lbl.grid { color:#fb7185; } .lbl.hc { color:#19d8ff; } .lbl.hp { color:#ffa94d; }
                .split strong { margin-top:4px; color:#f1f5f9; font-size:15px; font-weight:800; }
                .split small { margin-top:2px; color:#64748b; font-size:11px; }

                .nosplit { margin-top:14px; padding:10px; border-radius:12px; text-align:center; color:#64748b; font-size:11px; background:rgba(255,255,255,.02); border:1px dashed rgba(255,255,255,.08); }

                .device-foot { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:16px; padding-top:13px; border-top:1px solid rgba(255,255,255,.06); }
                .device-foot .right { text-align:right; }
                .device-foot span { display:block; color:#64748b; font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; }
                .device-foot strong { display:block; margin-top:4px; color:#cbd5e1; font-size:13px; font-weight:700; }

                .empty { display:flex; align-items:center; gap:14px; padding:20px; border-radius:20px; color:#64748b; background:rgba(255,255,255,.025); border:1px dashed rgba(255,255,255,.1); }
                .empty ha-icon { --mdc-icon-size:30px; color:#475569; flex:none; }
                .empty strong { display:block; color:#94a3b8; font-size:14px; }
                .empty span { display:block; margin-top:4px; font-size:12px; line-height:1.45; }

                .house { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-top:16px; padding:14px 18px; border-radius:16px;
                  background:rgba(255,255,255,.025); border:1px solid rgba(255,255,255,.06); color:#7c8ba1; font-size:12px; }
                .house strong { color:#e2e8f0; font-size:14px; font-weight:800; margin-left:6px; }

                @keyframes pulse { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:.45; transform:scale(.8); } }

                @media(max-width:850px) { .context { grid-template-columns:repeat(2,minmax(0,1fr)); } .hero { grid-template-columns:1fr; } }
                @media(max-width:600px) {
                  .wrap { padding:16px; }
                  .title { font-size:21px; }
                  .hero-cost { font-size:36px; }
                  .grid { grid-template-columns:1fr; }
                  .big { font-size:21px; }
                  .count { display:none; }
                }
              </style>

              <div class="wrap">

                <div class="header">
                  <div class="brand">
                    <div class="logo"><ha-icon icon="mdi:home-lightning-bolt-outline"></ha-icon></div>
                    <div>
                      <div class="eyebrow">HOMEFOXCAT ENERGY</div>
                      <div class="title">Consommation appareils</div>
                      <div class="subtitle">Comptabilité native FoxCat Energy V1.5.0</div>
                    </div>
                  </div>
                  <div class="count">
                    <i></i>${activeDevices.length} APPAREIL${activeDevices.length > 1 ? 'S' : ''} GÉRÉ${activeDevices.length > 1 ? 'S' : ''}
                  </div>
                </div>

                <div class="context">
                  ${chip('mdi:brain', 'Mode EMS', mode)}
                  ${chip('mdi:calendar-clock', 'Régime tarifaire', tariff)}
                  ${chip('mdi:clock-time-four-outline', 'Période actuelle', tariffPeriod, tariffPeriod.toString().toLowerCase().includes('hp') ? '#ff922b' : '#19d8ff')}
                  ${chip('mdi:cash-multiple', "Prix d'achat actif", fmtPrice(activePrice), priceColor)}
                </div>

                ${activeDevices.length > 0 ? `

                  <div class="hero">
                    <div>
                      <div class="hero-label">Coût appareils aujourd'hui</div>
                      <div class="hero-cost">${fmtEuro(activeCost)}</div>
                      <div class="hero-sub">
                        <b>${fmtEnergy(activeEnergy)}</b> consommés
                        ${activeEnergy > 0 ? ` · prix moyen <b>${totalAvg.toFixed(3)} €/kWh</b>` : ''}
                      </div>
                    </div>
                    <div class="hero-right">
                      <div class="hero-row solar"><span>Part solaire · ${totalSolarShare.toFixed(0)} %</span><strong>${fmtEnergy(activeSolar)}</strong></div>
                      <div class="hero-bar">
                        <div style="width:${totalSolarShare}%;background:linear-gradient(90deg,#ff922b,#ffc46b)"></div>
                        <div style="width:${totalGridShare}%;background:linear-gradient(90deg,#fb7185,#f43f5e)"></div>
                      </div>
                      <div class="hero-row grid"><span>Part réseau · ${totalGridShare.toFixed(0)} %</span><strong>${fmtEnergy(activeGrid)}</strong></div>
                    </div>
                  </div>

                  <div class="pills">
                    ${pill('Fenêtre machines', machineWindow ? 'OUVERTE' : 'FERMÉE', machineWindow ? '#35e59d' : '#64748b')}
                    ${pill('Machine protégée', protectedMachine ? 'OUI' : 'NON', protectedMachine ? '#facc15' : '#64748b')}
                    ${pill('En fonctionnement', String(runningCount), runningCount > 0 ? '#35e59d' : '#64748b')}
                    ${pill('Prix', priceStatus, priceColor)}
                    ${pill('Délestage', loadSheddingStatus, highLoad ? '#fb7185' : '#35e59d')}
                  </div>

                  <div class="grid">${cardHtml}</div>

                ` : emptyHtml}

                ${(totalHouseEnergy > 0 || totalHouseCost !== 0) ? `
                  <div class="house">
                    <span>Bilan maison FoxCat<strong>${fmtEnergy(totalHouseEnergy)}</strong></span>
                    <span>Coût net maison<strong style="color:#35e59d">${fmtEuro(totalHouseCost)}</strong></span>
                  </div>
                ` : ''}

              </div>
            `;
          ]]]
      tap_action:
        action: none
      hold_action:
        action: none
      double_tap_action:
        action: none
- type: sections
  max_columns: 1
  title: Planificateur
  path: planificateur
  icon: mdi:calendar-clock
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Planificateur · tarifs et machines
      heading_style: title
      icon: mdi:calendar-clock
    - type: custom:button-card
      show_name: false
      show_icon: false
      show_state: false
      triggers_update: all
      variables:
        mobile: true
      custom_fields:
        c: |
          [[[
            const esc = (t) => String(t ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
            const num = (v) => { const n = Number(v); return Number.isFinite(n) ? n : null; };
            const act = (s) => (s && !['INACTIF', 'unknown', 'unavailable', 'none', ''].includes(s.state)) ? s : null;
            const dynS = act(states['[[foxcat:pricing.dynamic_planner]]']);
            const biS = act(states['[[foxcat:pricing.bihoraire_planner]]']);
            const src = dynS || biS;
            const box = (inner) => `<div class="p" style="padding:18px 20px">${inner}</div>`;
            if (!src) {
              return box(`<div style="display:flex;align-items:center;gap:12px;color:#8fa6bf"><ha-icon icon="mdi:calendar-clock"></ha-icon><div><b style="color:#e8f1fb">Planificateur inactif</b><div style="font-size:12px;margin-top:3px">Il se met en route avec un contrat <b>dynamique</b> ou <b>bi-horaire</b>. Aucune donnée à afficher.</div></div></div>`);
            }
            const isBi = !dynS;
            const P = src.attributes || {};
            const title = isBi ? 'Planificateur bi-horaire' : 'Planificateur dynamique';
            if (src.state === 'ATTENTE_PRIX' || !Array.isArray(P.slots) || P.slots.length < 2) {
              return box(`<div style="display:flex;align-items:center;gap:12px;color:#8fa6bf"><ha-icon icon="mdi:timer-sand"></ha-icon><div><b style="color:#e8f1fb">${title} · en attente des prix</b><div style="font-size:12px;margin-top:3px">${esc(P.reason || 'Courbe de prix indisponible.')}</div></div></div>`);
            }

            // ---------- données ----------
            const COL = { dishwasher: '#34d399', washer: '#60a5fa', dryer: '#c4b5fd', boiler: '#fb923c' };
            const EXTRA = ['#f472b6', '#2dd4bf', '#facc15', '#a3e635'];
            const ICON = { dishwasher: 'mdi:dishwasher', washer: 'mdi:washing-machine', dryer: 'mdi:tumble-dryer', boiler: 'mdi:water-boiler' };
            const BAND = { NEGATIF: ['#22d3ee', 'Prix négatif'], TRES_BAS: ['#34d399', 'Très bas'], BAS: ['#86efac', 'Bas'], NORMAL: ['#fbbf24', 'Normal'], ELEVE: ['#fb923c', 'Élevé'], PIC: ['#f87171', 'Pic'], HC: ['#34d399', 'Heures creuses'], HP: ['#fb923c', 'Heures pleines'] };
            const DEC = {
              START_NOW: ['Démarrage autorisé', '#34d399'], WAIT: ['En attente du créneau', '#fbbf24'], CONTINUE: ['Cycle en cours', '#60a5fa'],
              HC: ['Heures creuses autorisées', '#34d399'], USER_CONTROL: ['Gestion manuelle', '#8fa6bf'], SAFETY_OVERRIDE: ['Sécurité active', '#f87171'], STOP_WHEN_SAFE: ['Besoin satisfait', '#8fa6bf'],
            };
            const slots = P.slots.map(s => ({ t: s[0], p: Number(s[1]), b: s[2] })).filter(s => Number.isFinite(s.t) && Number.isFinite(s.p));
            const stepS = slots.length > 1 ? Math.max(300, slots[slots.length - 1].t - slots[slots.length - 2].t) : 3600;
            const t0 = slots[0].t, t1 = slots[slots.length - 1].t + stepS;
            const nowT = num(P.now_ts) ?? Math.floor(Date.now() / 1000);
            // Mise en page mobile (téléphone) : frise plus étroite, nom du couloir au-dessus de la barre.
            const MOB = !!(variables && variables.mobile) || (typeof window !== 'undefined' && window.innerWidth < 720);
            const W = MOB ? 390 : 1000, X0 = MOB ? 34 : 168, X1 = W - (MOB ? 8 : 14), PW = X1 - X0;
            const x = (t) => X0 + Math.min(1, Math.max(0, (t - t0) / (t1 - t0))) * PW;
            const fmtT = (t) => new Date(t * 1000).toLocaleTimeString('fr-BE', { hour: '2-digit', minute: '2-digit' });
            const fmtD = (t) => new Date(t * 1000).toLocaleDateString('fr-BE', { weekday: 'short', day: 'numeric', month: 'short' });
            const dayKey = (t) => new Date(t * 1000).toDateString();
            const fmtDT = (t) => (dayKey(t) === dayKey(nowT) ? '' : new Date(t * 1000).toLocaleDateString('fr-BE', { weekday: 'short' }) + ' ') + fmtT(t);
            const fmtP = (v) => v == null ? '—' : v.toFixed(3).replace('.', ',');
            const fmtE = (v) => v == null ? '—' : v.toFixed(2).replace('.', ',') + ' €';
            const iso = (s) => { const d = Date.parse(s); return Number.isFinite(d) ? Math.floor(d / 1000) : null; };

            // ---------- couloirs : boiler (rang 1) puis machines par rang ----------
            const mergeRuns = (runs) => runs.filter(r => r[0] && r[1]).sort((p, q) => p[0] - q[0]).reduce((acc, r) => { const last = acc[acc.length - 1]; if (last && r[0] <= last[1] + 60) last[1] = Math.max(last[1], r[1]); else acc.push([r[0], r[1]]); return acc; }, []);
            const lanes = [];
            const BOILER_HC = 'HEURES_CREUSES';
            const bo = P.boiler;
            if (bo) lanes.push({ id: 'boiler', rank: 1, name: 'Boiler', dec: bo.source === BOILER_HC ? 'HC' : bo.decision, reason: bo.source === BOILER_HC ? (bo.windows && bo.windows.length ? 'Chauffe réseau limitée aux heures creuses ; le solaire reste prioritaire.' : 'Chauffe réseau non autorisée en heures creuses (réglage du boiler).') : bo.reason, windows: bo.windows, runs: mergeRuns((bo.segments || []).map(s => [s[0], s[1]])), isBoiler: true });
            let extraIdx = 0;
            Object.entries(P.machines || {}).forEach(([id, m]) => {
              const a = iso(m.planned_start), b = iso(m.planned_end);
              let runs = Array.isArray(m.segments) && m.segments.length ? m.segments.map(s => [iso(s.start), iso(s.end)]) : (a && b ? [[a, b]] : []);
              runs = mergeRuns(runs);
              lanes.push({ id, rank: m.priority_rank || 9, name: m.name || id, dec: m.decision, reason: m.reason, windows: m.windows, runs, m, color: COL[id] || EXTRA[extraIdx++ % EXTRA.length] });
            });
            lanes.sort((p, q) => p.rank - q.rank);
            lanes.forEach(l => { l.color = l.color || COL[l.id] || '#fb923c'; });

            // ---------- géométrie ----------
            const CH_TOP = 34, CH_H = MOB ? 84 : 118, CH_BOT = CH_TOP + CH_H;
            const LANE_TOP = CH_BOT + 34, LANE_H = MOB ? 58 : 50, LANE_GAP = MOB ? 8 : 10;
            const BAR_Y = MOB ? 22 : 8, BAR_H = MOB ? 28 : LANE_H - 16;
            const H = LANE_TOP + lanes.length * (LANE_H + LANE_GAP) + 22;
            const pmin = Math.min(0, ...slots.map(s => s.p)), pmax = Math.max(...slots.map(s => s.p));
            const py = (p) => CH_BOT - ((p - pmin) / Math.max(pmax - pmin, 1e-6)) * (CH_H - 14);

            let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;font-family:inherit" role="img" aria-label="${title}">`;
            svg += `<defs><clipPath id="clipP"><rect x="${X0}" y="${CH_TOP - 6}" width="${PW}" height="${H - CH_TOP}"/></clipPath></defs>`;

            // bandes de fond (superposées au graphique ET aux couloirs)
            let ri = 0;
            while (ri < slots.length) {
              let rj = ri; while (rj + 1 < slots.length && slots[rj + 1].b === slots[ri].b) rj++;
              const col = (BAND[slots[ri].b] || ['#8fa6bf'])[0];
              const xa = x(slots[ri].t), xb = x(slots[rj].t + stepS);
              svg += `<rect x="${xa.toFixed(1)}" y="${CH_TOP - 6}" width="${(xb - xa).toFixed(1)}" height="${(LANE_TOP + lanes.length * (LANE_H + LANE_GAP) - CH_TOP + 6)}" fill="${col}" opacity="0.07"/>`;
              ri = rj + 1;
            }
            // grille horaire
            for (let t = Math.ceil(t0 / 3600) * 3600; t < t1; t += 3600) {
              const d = new Date(t * 1000), h = d.getHours();
              if (h % (MOB ? 6 : 3)) continue;
              const xx = x(t).toFixed(1), mid = h === 0;
              svg += `<line x1="${xx}" y1="${CH_TOP - 6}" x2="${xx}" y2="${H - 22}" stroke="#fff" stroke-opacity="${mid ? 0.28 : 0.09}" stroke-dasharray="${mid ? '' : '3 4'}"/>`;
              svg += `<text x="${xx}" y="${H - 8}" fill="#8fa6bf" font-size="${MOB ? 9.5 : 11}" text-anchor="${x(t) > X1 - 26 ? 'end' : 'middle'}">${mid ? fmtD(t) : String(h).padStart(2, '0') + ' h'}</text>`;
            }
            // courbe de prix : barres par créneau + trait
            slots.forEach(s => {
              const col = (BAND[s.b] || ['#8fa6bf'])[0];
              const xa = x(s.t), xb = x(s.t + stepS), y = py(s.p), y0 = py(0);
              svg += `<rect x="${xa.toFixed(1)}" y="${Math.min(y, y0).toFixed(1)}" width="${Math.max(xb - xa - (xb - xa > 7 ? 0.6 : 0), 0.6).toFixed(1)}" height="${Math.max(Math.abs(y0 - y), 1.5).toFixed(1)}" fill="${col}" opacity="0.62" rx="1.5"/>`;
            });
            const path = slots.map((s, i) => `${i ? 'L' : 'M'}${x(s.t).toFixed(1)},${py(s.p).toFixed(1)} L${x(s.t + stepS).toFixed(1)},${py(s.p).toFixed(1)}`).join(' ');
            svg += `<path d="${path}" fill="none" stroke="#e8f1fb" stroke-width="1.6" stroke-opacity="0.9"/>`;
            svg += `<text x="${X0 - (MOB ? 3 : 10)}" y="${py(pmax) + 4}" fill="#8fa6bf" font-size="${MOB ? 9 : 11}" text-anchor="end">${fmtP(pmax)}</text>`;
            svg += `<text x="${X0 - (MOB ? 3 : 10)}" y="${py(pmin) + 4}" fill="#8fa6bf" font-size="${MOB ? 9 : 11}" text-anchor="end">${fmtP(pmin)}</text>`;
            if (MOB) svg += `<text x="${X0 + 6}" y="${CH_TOP + 10}" fill="#e8f1fb" font-size="10.5" font-weight="700" paint-order="stroke" stroke="#080d16" stroke-width="3">Tarif · €/kWh</text>`;
            else svg += `<text x="12" y="${CH_TOP + 12}" fill="#e8f1fb" font-size="13" font-weight="700">Tarif</text><text x="12" y="${CH_TOP + 27}" fill="#8fa6bf" font-size="11">€/kWh</text>`;
            if (pmin < 0) svg += `<line x1="${X0}" y1="${py(0).toFixed(1)}" x2="${X1}" y2="${py(0).toFixed(1)}" stroke="#fff" stroke-opacity="0.35"/>`;

            // couloirs
            svg += `<text x="${MOB ? 4 : 12}" y="${LANE_TOP - 12}" fill="#8fa6bf" font-size="${MOB ? 9.5 : 11}" letter-spacing=".06em">${MOB ? 'PRIORITÉ · FENÊTRES · DÉPART' : 'PRIORITÉ · FENÊTRES AUTORISÉES · DÉPART PLANIFIÉ'}</text>`;
            lanes.forEach((l, i) => {
              const y = LANE_TOP + i * (LANE_H + LANE_GAP), c = l.color;
              svg += `<rect x="${X0}" y="${y}" width="${PW}" height="${LANE_H}" rx="10" fill="#fff" opacity="0.035"/>`;
              if (MOB) {
                svg += `<circle cx="17" cy="${y + LANE_H / 2}" r="11" fill="${c}" opacity="0.18" stroke="${c}" stroke-opacity="0.8"/>`;
                svg += `<text x="17" y="${y + LANE_H / 2 + 4.5}" fill="${c}" font-size="12" font-weight="800" text-anchor="middle">${l.rank}</text>`;
                svg += `<text x="${X0 + 7}" y="${y + 15}" fill="#e8f1fb" font-size="10.5" font-weight="700" paint-order="stroke" stroke="#080d16" stroke-width="3">${esc(l.name)}</text>`;
              } else {
                svg += `<circle cx="26" cy="${y + LANE_H / 2}" r="13" fill="${c}" opacity="0.18" stroke="${c}" stroke-opacity="0.8"/>`;
                svg += `<text x="26" y="${y + LANE_H / 2 + 5}" fill="${c}" font-size="14" font-weight="800" text-anchor="middle">${l.rank}</text>`;
                svg += `<text x="48" y="${y + LANE_H / 2 - 3}" fill="#e8f1fb" font-size="13" font-weight="700">${esc(l.name)}</text>`;
                const d = DEC[l.dec] || [l.dec || '—', '#8fa6bf'];
                svg += `<text x="48" y="${y + LANE_H / 2 + 13}" fill="${d[1]}" font-size="10.5">${esc(d[0])}</text>`;
              }
              // fenêtres autorisées
              const wins = l.windows == null ? [[t0, t1]] : l.windows;
              wins.forEach(w => {
                const xa = x(w[0]), xb = x(w[1]);
                if (xb - xa < 1) return;
                svg += `<rect x="${xa.toFixed(1)}" y="${y + 4}" width="${(xb - xa).toFixed(1)}" height="${LANE_H - 8}" rx="8" fill="${c}" opacity="0.16" stroke="${c}" stroke-opacity="0.55" stroke-dasharray="4 3"/>`;
              });
              if (l.windows != null && l.windows.length === 0) svg += `<text x="${X0 + 12}" y="${y + (MOB ? 40 : LANE_H / 2 + 4)}" fill="#8fa6bf" font-size="11">Aucune fenêtre autorisée</text>`;
              // départs planifiés
              l.runs.forEach((r, k) => {
                const xa = x(r[0]), xb = x(r[1]), wd = Math.max(xb - xa, 3);
                svg += `<rect x="${xa.toFixed(1)}" y="${y + BAR_Y}" width="${wd.toFixed(1)}" height="${BAR_H}" rx="8" fill="${c}" opacity="0.92"/>`;
                const prof = l.m && Array.isArray(l.m.profile) && l.runs.length === 1 ? l.m.profile : null;
                if (prof && wd > 40) {
                  const mx = Math.max(...prof, 1e-6), bw = wd / prof.length;
                  prof.forEach((v, q) => { const hh = Math.max(1.5, (BAR_H - 10) * v / mx); svg += `<rect x="${(xa + q * bw + 0.5).toFixed(1)}" y="${(y + BAR_Y + BAR_H - 5 - hh).toFixed(1)}" width="${Math.max(bw - 1, 1).toFixed(1)}" height="${hh.toFixed(1)}" rx="1.5" fill="#0b1220" opacity="0.38"/>`; });
                }
                if (wd > (MOB ? 84 : 92) && (k === 0 || l.runs.length === 1)) svg += `<text x="${(xa + wd / 2).toFixed(1)}" y="${y + BAR_Y + BAR_H / 2 + 4}" fill="#0b1220" font-size="11.5" font-weight="800" text-anchor="middle">${fmtT(r[0])} → ${fmtT(r[1])}</text>`;
                else if (k === 0) svg += `<text x="${(xb + 6 > X1 - 70 ? Math.max(xa - 6, X0 + 2) : xb + 6).toFixed(1)}" text-anchor="${xb + 6 > X1 - 70 ? 'end' : 'start'}" y="${y + BAR_Y + BAR_H / 2 + 4}" fill="${c}" font-size="11.5" font-weight="700">${fmtT(r[0])} → ${fmtT(r[1])}</text>`;
              });
            });
            // maintenant
            const xn = x(nowT).toFixed(1);
            svg += `<line x1="${xn}" y1="${CH_TOP - 12}" x2="${xn}" y2="${H - 22}" stroke="#19d8ff" stroke-width="2"/>`;
            svg += `<rect x="${Math.max(2, x(nowT) - 38).toFixed(1)}" y="${CH_TOP - 24}" width="76" height="16" rx="8" fill="#19d8ff"/><text x="${Math.max(2, x(nowT) - 38) + 38}" y="${CH_TOP - 12}" fill="#06202b" font-size="10.5" font-weight="800" text-anchor="middle">MAINTENANT</text>`;
            svg += `</svg>`;

            // ---------- en-tête ----------
            const chip = (txt, col) => `<span style="display:inline-block;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:700;letter-spacing:.04em;color:${col};background:${col}22;border:1px solid ${col}66">${txt}</span>`;
            const pilot = src.state === 'PILOTE';
            const curB = BAND[isBi ? P.period : P.current_band] || ['#8fa6bf', P.current_band || '—'];
            const stat = (k, v, sub) => `<div style="min-width:${MOB ? 140 : 130}px"><div class="k" style="font-size:11px">${k}</div><div style="font-size:19px;font-weight:800;line-height:1.25">${v}</div>${sub ? `<div class="k" style="font-size:11px">${sub}</div>` : ''}</div>`;
            const valley = isBi ? P.next_hc : P.next_valley;
            const peak = isBi ? P.next_hp : P.next_peak;
            const rng = (b) => b ? `${fmtDT(iso(b.start))} → ${fmtDT(iso(b.end))}` : '—';
            const saving = num(P.total_expected_saving_eur);
            const head = `
            <div style="${MOB ? 'display:grid;grid-template-columns:1fr 1fr;gap:10px 14px' : 'display:flex;flex-wrap:wrap;align-items:center;gap:22px'};margin-bottom:10px">
              <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;${MOB ? 'grid-column:1 / -1' : ''}"><ha-icon icon="mdi:calendar-clock" style="color:#19d8ff"></ha-icon><div style="font-size:16px;font-weight:800">${title}</div>${chip(pilot ? 'PILOTE LES MACHINES' : 'OBSERVATION', pilot ? '#34d399' : '#fbbf24')}</div>
              ${stat('Prix actuel', `${fmtP(num(P.current_price_eur_kwh))} <span style="font-size:11px;font-weight:600">€/kWh</span>`, `<span style="color:${curB[0]};font-weight:700">${esc(curB[1])}</span>${isBi ? ` · HP ${fmtP(num(P.hp_price_eur_kwh))} / HC ${fmtP(num(P.hc_price_eur_kwh))}` : ''}`)}
              ${stat(isBi ? 'Prochaines heures creuses' : 'Prochaine vallée', rng(valley), valley && !isBi ? `moy. ${fmtP(num(valley.average_price_eur_kwh))} €/kWh` : (isBi && P.spread_eur_kwh != null ? `écart HP–HC ${fmtP(num(P.spread_eur_kwh))} €/kWh` : ''))}
              ${stat(isBi ? 'Prochaines heures pleines' : 'Prochain pic', rng(peak), peak && !isBi ? `moy. ${fmtP(num(peak.average_price_eur_kwh))} €/kWh` : '')}
              ${stat('Économie attendue', saving != null ? fmtE(saving) : '—', 'en décalant les cycles en attente')}
            </div>`;
            const legendKeys = isBi ? ['HC', 'HP'] : ['NEGATIF', 'TRES_BAS', 'BAS', 'NORMAL', 'ELEVE', 'PIC'];
            const legend = `<div style="display:flex;flex-wrap:wrap;gap:14px;margin:6px 0 2px;font-size:11px;color:#8fa6bf">${legendKeys.map(k => `<span style="display:inline-flex;align-items:center;gap:6px"><i style="width:11px;height:11px;border-radius:3px;background:${BAND[k][0]};opacity:.75"></i>${BAND[k][1]}</span>`).join('')}<span style="display:inline-flex;align-items:center;gap:6px"><i style="width:18px;height:11px;border-radius:4px;border:1px dashed #cbd5e1;opacity:.8"></i>Fenêtre autorisée</span><span style="display:inline-flex;align-items:center;gap:6px"><i style="width:18px;height:11px;border-radius:4px;background:#cbd5e1"></i>Cycle planifié</span></div>`;

            // ---------- cartes par couloir ----------
            const cards = lanes.map(l => {
              const d = DEC[l.dec] || [l.dec || '—', '#8fa6bf'];
              const m = l.m || {};
              const run = l.runs[0];
              const when = run ? `${fmtD(run[0])} · ${fmtT(run[0])} → ${fmtT(l.runs[l.runs.length - 1][1])}` : (l.isBoiler ? (isBi ? 'Selon le solaire et les heures creuses' : 'Décision du boiler dynamique') : '—');
              const sav = num(m.expected_saving_eur), pct = num(m.expected_saving_pct);
              const fmtH = (h) => { const mm = Math.round(h * 60); return Math.floor(mm / 60) + ' h ' + String(mm % 60).padStart(2, '0'); };
              const learned = m.duration_source === 'APPRENTISSAGE_10_CYCLES';
              const learnLine = l.isBoiler ? '' : `<div class="k" style="font-size:11.5px;margin-top:6px;display:flex;align-items:center;gap:6px"><ha-icon icon="mdi:brain" style="--mdc-icon-size:15px;color:${learned ? '#a78bfa' : '#64748b'}"></ha-icon><span>${learned ? `Appris sur <b style="color:#e8f1fb">${m.learning_cycles || '?'} cycles</b>` : 'Réglages (apprentissage insuffisant)'} · ${m.duration_h != null ? fmtH(m.duration_h) : '—'} · ${m.energy_kwh != null ? Number(m.energy_kwh).toFixed(2).replace('.', ',') + ' kWh' : '—'}${m.profile ? ' · forme de consommation apprise' : ''}</span></div>`;
              return `<div style="flex:1 1 ${MOB ? '100%' : '220px'};min-width:${MOB ? 0 : 220}px;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.035);border:1px solid ${l.color}44">
                <div style="display:flex;align-items:center;gap:10px"><span style="width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:${l.color}22;color:${l.color};font-weight:800;border:1px solid ${l.color}99">${l.rank}</span>
                  <ha-icon icon="${ICON[l.id] || 'mdi:flash'}" style="color:${l.color};--mdc-icon-size:20px"></ha-icon><b style="font-size:14px">${esc(l.name)}</b></div>
                <div style="margin:8px 0 6px">${chip(esc(d[0]), d[1])}</div>
                <div style="font-size:13px;font-weight:700">${when}</div>
                ${sav != null ? `<div class="k" style="font-size:12px;margin-top:3px">Économie attendue <b style="color:#34d399">${fmtE(sav)}</b>${pct != null ? ` (${Math.round(pct)} %)` : ''}${m.estimated_cost_eur != null ? ` · coût du cycle ${fmtE(num(m.estimated_cost_eur))}` : ''}</div>` : ''}
                ${learnLine}
                <div class="k" style="font-size:11.5px;margin-top:5px;line-height:1.35">${esc(l.reason || '')}</div>
              </div>`;
            }).join('');

            return `<div class="p" style="padding:16px 18px">${head}${svg}${legend}<div style="display:flex;flex-wrap:wrap;gap:12px;margin-top:14px">${cards}</div></div>`;
          ]]]
      styles:
        card:
        - padding: 0
