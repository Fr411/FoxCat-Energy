                        extra_styles: |
                          @keyframes segOn { 0%,100% { box-shadow: inset 0 0 0 1px color-mix(in srgb, #35e59d 70%, transparent), 0 0 8px color-mix(in srgb, #35e59d 25%, transparent); } 50% { box-shadow: inset 0 0 0 1px #35e59d, 0 0 18px color-mix(in srgb, #35e59d 50%, transparent); } }
                          @media (prefers-reduced-motion: reduce) { ha-card { animation: none !important; } }
                        styles:
                          card:
