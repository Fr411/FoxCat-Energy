                legacy_energie: 'sensor.foxcat_energy_energie_seche_linge_energie_aujourdhui',
                legacy_energie_2: 'sensor.foxcat_energy_energie_seche_linge_energie_aujourdhui',
                legacy_cout: 'sensor.foxcat_energy_tarification_seche_linge_cout_aujourdhui',
