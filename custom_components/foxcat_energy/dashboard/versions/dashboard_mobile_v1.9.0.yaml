        show:
          in_header: false
        data_generator: |
          const rows=[...(entity.attributes.today||[]),...(entity.attributes.tomorrow||[])]
            .filter(r=>r.start!=null&&Number.isFinite(Number(r.all_in))).map(r=>({time:new Date(r.start).getTime(),price:Number(r.all_in)})).sort((a,b)=>a.time-b.time);
          return rows.map((r,i)=>{const w=rows.slice(Math.max(0,i-1),Math.min(rows.length,i+2));return [r.time,w.reduce((s,x)=>s+x.price,0)/w.length];});
