        - border: 1px solid rgba(255,255,255,.09)
        - box-shadow: 0 20px 50px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.06)
        - background: radial-gradient(120% 70% at 0% 0%, rgba(25,216,255,.11), transparent 55%), radial-gradient(100% 70% at 100% 100%, rgba(255,146,43,.09), transparent 55%), linear-gradient(160deg,#070b14,#0b1626 60%,#08101c)
