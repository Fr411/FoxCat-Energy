                ${clothes}
                ${running ? [0,1,2].map(i => `<path d="M${36+i*14} 74 q4 -6 0 -12 t0 -12" fill="none" stroke="${col}" stroke-width="2" stroke-linecap="round" style="${A('fx-heat', 2, 'ease-in-out', i * .5)}"/>`).join('') : ''}
                ${parts(6, 28, 72, 78, 40, 1.4, '#fde68a')}
                ${glint}
              </g>
              ${rim}`;
          } else if (CFG.kind === 'dish') {
            scene = `
              <clipPath id="${uid}c"><rect x="17" y="17" width="66" height="66" rx="12"/></clipPath>
              <rect x="15" y="15" width="70" height="70" rx="14" fill="rgba(255,255,255,.05)" stroke="${col}" stroke-opacity=".55" stroke-width="2.4"/>
              <rect x="17" y="17" width="66" height="66" rx="12" fill="#07101d"/>
              <g clip-path="url(#${uid}c)">
                <g opacity="${running ? .12 : 0}"><rect x="17" y="17" width="66" height="66" fill="${col}" style="${running ? AA('fx-breath', 2.2, 'ease-in-out') : ''}"/></g>
                <rect x="17" y="62" width="66" height="22" fill="${col}" opacity="${running ? .2 : .06}"/>
                <g style="${A('fx-wave', 2.4)}">${wave(80, col + '44')}</g>
                <g stroke="rgba(255,255,255,.35)" stroke-width="1.4" fill="none" stroke-linecap="round">
                  <path d="M24 66 h52"/><path d="M26 66 v-10 M34 66 v-10 M42 66 v-10 M58 66 v-10 M66 66 v-10 M74 66 v-10"/>
                  <ellipse cx="30" cy="56" rx="2" ry="9"/><ellipse cx="46" cy="56" rx="2" ry="9"/><ellipse cx="62" cy="56" rx="2" ry="9"/><ellipse cx="72" cy="56" rx="2" ry="9"/>
                </g>
                <g style="${rot(+(sp * .7).toFixed(1), false, 50, 41.7)}">
                  <rect x="24" y="40" width="52" height="3.4" rx="1.7" fill="${col}"/>
                  <circle cx="50" cy="41.7" r="3.4" fill="#fff" opacity=".9"/>
                  ${running ? `<path d="M25 40 q-2 -5 2 -9 M75 43.4 q2 5 -2 9" stroke="${col}" stroke-width="1.2" stroke-dasharray="1.5 2" fill="none" stroke-linecap="round" style="${A('fx-flow', .5)}"/>` : ''}
                </g>
                ${running ? Array.from({ length: 10 }, (_, i) => `<circle cx="${(22 + i * 6.2).toFixed(1)}" cy="44" r="1.4" fill="${col}" style="${A('fx-drop', 1.5, 'ease-in', i * .19)}"/>`).join('') : ''}
                ${parts(6, 22, 78, 82, 14, 1.6)}
                ${running ? steam([36, 50, 64], 30) : ''}
                ${glint}
              </g>
              <circle cx="50" cy="80" r="1.8" fill="${running ? scol : 'rgba(255,255,255,.3)'}" style="${running ? AA('fx-dot', 1.2, 'ease-in-out') : ''}"/>`;
          } else {
            scene = `
              <clipPath id="${uid}c"><rect x="29" y="14" width="42" height="72" rx="14"/></clipPath>
              ${steamOn ? steam([42, 50, 58], 9) : ''}
              <rect x="27" y="12" width="46" height="76" rx="16" fill="rgba(255,255,255,.05)" stroke="${col}" stroke-opacity=".55" stroke-width="2.4"/>
              <rect x="29" y="14" width="42" height="72" rx="14" fill="#07101d"/>
              <g clip-path="url(#${uid}c)">
                <g style="${AA('fx-wave', running ? 2.2 : 4.5)}">${wave(36, wcol + '99')}</g>
                <g style="${AA('fx-wave', running ? 3.4 : 6.5, 'linear', 0, 'infinite reverse')}">${wave(41, wcol + '55')}</g>
                <g opacity="${running ? .6 : 0}"><ellipse cx="50" cy="74" rx="17" ry="9" fill="${col}" style="filter:blur(3px);${running ? AA('fx-breath', 1.6, 'ease-in-out') : ''}"/></g>
                ${running ? `<path d="M50 68 C 44 58, 56 50, 50 42" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1.2" stroke-dasharray="2 5" stroke-linecap="round" style="${A('fx-flow', .9)}"/>` : ''}
                <path d="M36 74 h6 l3 -7 l6 14 l6 -14 l3 7 h6" fill="none" stroke="${running ? col : 'rgba(255,255,255,.35)'}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="${running ? 'filter:drop-shadow(0 0 2px ' + col + ');' + A('fx-zig', 1.2, 'ease-in-out') : ''}"/>
                ${running ? `<path d="M36 74 h6 l3 -7 l6 14 l6 -14 l3 7 h6" fill="none" stroke="#fff7d6" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 50" style="${A('fx-coil', 1.2)}"/>` : ''}
                ${parts(7, 34, 66, 70, 34, 1.6)}
                ${glint}
              </g>
              <path d="M36 22 q-1 12 0 22" stroke="rgba(255,255,255,.3)" stroke-width="2" fill="none" stroke-linecap="round"/>`;
          }

          /* ---------- ANNEAU DE PUISSANCE ---------- */
          const ring = `
            <circle cx="50" cy="50" r="${R}" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="3" style="${!running && !unavailable ? AA('fx-idle', 4, 'ease-in-out') : ''}"/>
            <circle cx="50" cy="50" r="${R}" fill="none" stroke="${col}" stroke-width="3" stroke-linecap="round"
              stroke-dasharray="${(C*pct).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 50 50)" style="${running ? 'filter:drop-shadow(0 0 3px ' + col + ')' : ''}"/>
            ${running ? `
            <circle cx="50" cy="50" r="51" fill="none" stroke="${col}" stroke-opacity=".4" stroke-width=".8" stroke-dasharray="1.5 4" style="${rot(10, true)}"/>
            <circle cx="50" cy="50" r="${R}" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-dasharray="0.1 ${C.toFixed(1)}" style="filter:drop-shadow(0 0 3px ${col});${rot(2.4)}"/>` : ''}`;

          const chip = (label, v, c) => `
            <div class="fx-chip">
              <div style="font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:rgba(226,232,240,.55);font-weight:700">${label}</div>
              <div style="font-size:13px;font-weight:700;color:${c||'#f1f5f9'};margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${v}</div>
            </div>`;
          const chips = [
            V.temp ? chip('Température', tC == null ? '—' : tC.toFixed(1) + ' °C', '#fb923c') : '',
            CFG.energy ? chip('Énergie jour', kwh == null ? '—' : kwh.toFixed(2) + ' kWh') : '',
            CFG.cycle ? chip('Cycle', esc(cycleRaw == null ? '—' : cycleRaw)) : '',
            cmdTxt ? chip('Commande', cmdTxt, '#a78bfa') : '',
            chip('Prise', plugOn == null ? '—' : (plugOn ? 'ON' : 'OFF'), plugOn ? '#34d399' : '#fb7185')
          ].filter(Boolean).slice(0,3).join('');

          return `
          <style>
            .${uid},.${uid} *{box-sizing:border-box}
            .${uid}{position:relative;overflow:hidden;margin:6px;padding:1.5px;border-radius:24px;background:rgba(255,255,255,.07);font-family:'Inter','Segoe UI',system-ui,sans-serif;color:#f1f5f9;transition:transform .25s}
            .${uid}:hover{transform:translateY(-2px)}
            .${uid}.on{background:${col}30;box-shadow:0 0 30px ${col}26}
            .${uid}.on::before{content:"";position:absolute;inset:-60%;background:conic-gradient(from 0deg,transparent 0 62%,${col} 82%,#fff 86%,transparent 92%);${AA('fx-spin', 4.5)}}
            .${uid} .fx-in{position:relative;z-index:1;border-radius:22.5px;padding:16px 14px 14px;background:radial-gradient(110% 70% at 50% 0%, ${col}22, transparent 60%),linear-gradient(180deg,#0d1828,#0a1220);box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
            .${uid} .fx-led{position:relative;flex:none;width:6px;height:6px;border-radius:50%;background:${scol};box-shadow:0 0 8px ${scol}}
            .${uid} .fx-led::after{content:"";position:absolute;inset:0;border-radius:50%;border:1.5px solid ${scol};${running ? AA('fx-ping', 1.4, 'ease-out') : 'display:none'}}
            .${uid} .fx-num{font-size:40px;line-height:1;font-weight:800;letter-spacing:-.03em;color:${running ? '#fff' : 'rgba(241,245,249,.7)'};${running ? AA('fx-num', 2.4, 'ease-in-out') : ''}}
            .${uid} .fx-bar{margin:12px 0;height:6px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;position:relative}
            .${uid} .fx-fill{height:100%;width:${(pct*100).toFixed(0)}%;border-radius:99px;background:repeating-linear-gradient(-45deg,rgba(255,255,255,${running ? .2 : 0}) 0 5px,transparent 5px 10px),linear-gradient(90deg,${col}99,${col});background-size:14px 14px,100% 100%;transition:width .8s ease;${running ? AA('fx-stripes', .7) : ''}}
            .${uid} .fx-sheen{position:absolute;top:0;bottom:0;left:-30%;width:30%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);${AA('fx-sheen', 2.2)}}
            .${uid} .fx-chip{position:relative;overflow:hidden;flex:1;min-width:0;padding:8px 10px;border-radius:13px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.07)}
            .${uid} .fx-chip::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.07),transparent);transform:skewX(-20deg);${AA('fx-gleam', 7, 'ease-in-out')}}
            .${uid} .fx-chip:nth-child(2)::after{animation-delay:${ph(7, 1.2)}}
            .${uid} .fx-chip:nth-child(3)::after{animation-delay:${ph(7, 2.4)}}
            .${uid} .fx-stm{transform-box:fill-box;transform-origin:center;filter:blur(1.5px)}
            @keyframes fx-spin{to{transform:rotate(360deg)}}
            @keyframes fx-spinr{to{transform:rotate(-360deg)}}
            @keyframes fx-wave{from{transform:translateX(0)}to{transform:translateX(-50px)}}
            @keyframes fx-slosh{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
            @keyframes fx-bub{0%{transform:translate(0,0);opacity:0}15%{opacity:.75}50%{transform:translate(1.5px,calc(var(--h) * .5))}100%{transform:translate(-1px,var(--h));opacity:0}}
            @keyframes fx-heat{0%{transform:translateY(6px);opacity:0}30%{opacity:.9}100%{transform:translateY(-10px);opacity:0}}
            @keyframes fx-drop{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(30px);opacity:0}}
            @keyframes fx-steam{0%{transform:translate(0,4px) scale(.5);opacity:0}30%{opacity:.5}100%{transform:translate(2px,-14px) scale(1.7);opacity:0}}
            @keyframes fx-glint{0%,60%{transform:translateX(0) skewX(-18deg)}100%{transform:translateX(150px) skewX(-18deg)}}
            @keyframes fx-breath{0%,100%{opacity:.45}50%{opacity:1}}
            @keyframes fx-coil{from{stroke-dashoffset:60}to{stroke-dashoffset:0}}
            @keyframes fx-flow{to{stroke-dashoffset:-7}}
            @keyframes fx-zig{0%,100%{opacity:.75}50%{opacity:1}}
            @keyframes fx-shake{0%,100%{transform:translate(0,0)}25%{transform:translate(-.6px,.4px)}50%{transform:translate(.5px,-.5px)}75%{transform:translate(-.4px,-.3px)}}
            @keyframes fx-glow{0%,100%{filter:drop-shadow(0 0 3px var(--c))}50%{filter:drop-shadow(0 0 11px var(--c))}}
            @keyframes fx-ping{0%{transform:scale(.6);opacity:1}100%{transform:scale(2.6);opacity:0}}
            @keyframes fx-dot{0%,100%{opacity:1}50%{opacity:.35}}
            @keyframes fx-idle{0%,100%{opacity:.5}50%{opacity:1}}
            @keyframes fx-num{0%,100%{text-shadow:0 0 8px var(--cg)}50%{text-shadow:0 0 24px var(--c)}}
            @keyframes fx-stripes{to{background-position:14px 0,0 0}}
            @keyframes fx-sheen{from{left:-30%}to{left:100%}}
            @keyframes fx-gleam{0%,70%{left:-60%}100%{left:130%}}
            @media (prefers-reduced-motion: reduce){.${uid} *,.${uid}::before,.${uid} *::after{animation:none!important}}
          </style>
          <div class="fxT ${uid} ${running ? 'on' : ''}" style="--c:${col};--cg:${col}55">
            <div class="fx-in">
              <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap">
                <div style="min-width:0">
                  <div style="font-size:17px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(CFG.name)}</div>
                  <div style="font-size:11.5px;color:rgba(226,232,240,.6);margin-top:2px">${esc(CFG.sub)}</div>
                </div>
                <div style="display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:${scol}1f;border:1px solid ${scol}55;font-size:10px;font-weight:800;letter-spacing:.08em;color:${scol};white-space:nowrap">
                  <span class="fx-led"></span>${status}
                </div>
              </div>
              <div style="display:flex;justify-content:center;margin:8px 0 2px">
                <svg viewBox="0 0 100 100" width="168" height="168" style="max-width:100%;overflow:visible;${running ? AA('fx-glow', 2.6, 'ease-in-out') : ''}">${ring}<g style="${shake ? A('fx-shake', .22) : ''}">${scene}</g></svg>
              </div>
              <div style="text-align:center">
                <div style="display:inline-flex;align-items:baseline;gap:6px">
                  <span class="fx-num">${wTxt}</span>
                  <span style="font-size:16px;font-weight:700;color:${col}">${wUnit}</span>
                </div>
                <div style="font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:rgba(226,232,240,.5);font-weight:700;margin-top:3px">Puissance · ${(pct*100).toFixed(0)} % de ${CFG.maxW} W</div>
              </div>
              <div class="fx-bar"><div class="fx-fill"></div>${running ? '<div class="fx-sheen"></div>' : ''}</div>
              <div style="display:flex;gap:7px">${chips}</div>
            </div>
          </div>`;
        ]]]
      t2: |-
        [[[
          /* ===== À MODIFIER : entités de cet appareil ===== */
          const V = {name: "Lave-linge", sub: "Machine à laver", icon: "mdi:washing-machine", col: "#60a5fa", cy: "sensor.lave_linge_cycle", pw: "[[foxcat:legacy.sensor_lave_linge_puissance]]", sw: "[[foxcat:machines.washer.switch]]", max: 2200, spin: true, energy: "", cmd_sensor: "sensor.foxcat_energy_fonctions_utilisateur_lave_linge_commande_utilisateur", kind: "washer"};
          /* ===== fin ===== */

          const CFG = {
            name: V.name, sub: V.sub, icon: V.icon, kind: V.kind, color: V.col || '#60a5fa', maxW: Number(V.max) || 2200,
            power: V.pw, energy: V.energy || '', cycle: V.cy || '', plug: V.sw || '', cmd: V.cmd_sensor || '',
            idle: ['idle','off','none','unknown','unavailable','standby','ready','','termine','terminé','fin']
          };
          const st = (id) => (id && states[id]) ? states[id] : null;
          const val = (id) => { const s = st(id); return s ? s.state : null; };
          const num = (id) => { const v = parseFloat(val(id)); return isFinite(v) ? v : null; };
          const clamp = (x,a,b) => Math.min(b, Math.max(a, x));
          const esc = (t) => String(t ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
          const w = num(CFG.power), kwh = num(CFG.energy);
          const cycleRaw = val(CFG.cycle), cmdRaw = val(CFG.cmd);
          const plugOn = st(CFG.plug) ? val(CFG.plug) === 'on' : null;
          const cycleActive = cycleRaw != null && !CFG.idle.includes(String(cycleRaw).toLowerCase());
          const running = (w != null && w > 20) || cycleActive;
          const unavailable = [CFG.power, CFG.plug].filter(Boolean).every(id => !st(id) || val(id) === 'unavailable');
          let status, scol;
          if (unavailable)          { status = 'INDISPONIBLE'; scol = '#94a3b8'; }
          else if (plugOn === false){ status = 'PRISE OFF';    scol = '#fb7185'; }
          else if (running)         { status = 'EN COURS';     scol = CFG.color; }
          else                      { status = 'PRÊT';         scol = '#34d399'; }
          const col = CFG.color;
          const pct = w != null ? clamp(w / CFG.maxW, 0, 1) : 0;
          const R = 47, C = 2 * Math.PI * R;
          const wTxt = w == null ? '—' : (w >= 1000 ? (w/1000).toFixed(2) : Math.round(w));
          const wUnit = w != null && w >= 1000 ? 'kW' : 'W';
          const cmdMap = { auto:'AUTO', off:'OFF', start:'DÉMARRAGE', demarrage:'DÉMARRAGE', on:'ON' };
          const cmdTxt = (cmdRaw == null || ['unknown','unavailable'].includes(cmdRaw)) ? null : (cmdMap[String(cmdRaw).toLowerCase()] || String(cmdRaw).toUpperCase());
          const uid = 'fx' + String(CFG.kind).replace(/\W/g,'');

          /* ---------- ANIMATIONS EN PHASE ----------
             Délai négatif calé sur l'horloge : quand la puissance se met à jour et que
             la tuile se redessine, les animations continuent sans repartir de zéro. */
          const NOW = Date.now() / 1000;
          const ph = (d, o = 0) => `-${((NOW + o) % d).toFixed(2)}s`;
          const PS = running ? 'running' : 'paused';
          const A  = (n, d, tf = 'linear', o = 0, x = 'infinite') => `animation:${n} ${d}s ${tf} ${ph(d, o)} ${x};animation-play-state:${PS};`;
          const AA = (n, d, tf = 'linear', o = 0, x = 'infinite') => `animation:${n} ${d}s ${tf} ${ph(d, o)} ${x};`;
          const rot = (d, rev = false, ox = 50, oy = 50) => `transform-origin:${ox}px ${oy}px;${A(rev ? 'fx-spinr' : 'fx-spin', d)}`;

          /* vitesse du tambour / du bras selon la puissance (paliers de 0,2 s) */
          const sp = running ? Math.max(0.8, Math.round((3.4 - 2.6 * pct) * 5) / 5) : 3.4;
          const shake = running && pct > 0.6 && CFG.kind === 'washer';

          /* boiler : couleur de l'eau selon la température */
          const tC = num(V.temp);
          const heat = (v) => v == null ? col : v < 35 ? '#38bdf8' : v < 45 ? '#22d3ee' : v < 55 ? '#fbbf24' : v < 65 ? '#fb923c' : '#f87171';
          const wcol = CFG.kind === 'boiler' ? heat(tC) : col;
          const steamOn = running || (tC != null && tC >= 50);

          /* ---------- BRIQUES SVG ---------- */
          const wave = (y, fill) => `<path d="M-50 ${y} q12.5 -5 25 0 t25 0 t25 0 t25 0 t25 0 t25 0 t25 0 t25 0 V110 H-50 Z" fill="${fill}"/>`;
          const parts = (n, x0, x1, y, h, d0, fill = '#fff') => !running ? '' : Array.from({ length: n }, (_, i) => {
            const x = x0 + (((i * 37) % 100) / 100) * (x1 - x0);
            const d = +(d0 + ((i * 53) % 10) / 10).toFixed(1);
            return `<circle cx="${x.toFixed(1)}" cy="${y}" r="${(1.2 + (i % 3) * .6).toFixed(1)}" fill="${fill}" style="--h:-${h}px;${A('fx-bub', d, 'ease-in', i * .7)}"/>`;
          }).join('');
          const steam = (xs, y) => xs.map((x, i) => `<ellipse class="fx-stm" cx="${x}" cy="${y}" rx="3" ry="5" fill="#e2e8f0" style="${AA('fx-steam', +(3 + i * .5).toFixed(1), 'ease-out', i * 1.1)}"/>`).join('');
          const holes = (r, n, rr) => Array.from({ length: n }, (_, i) => { const a = i / n * 2 * Math.PI; return `<circle cx="${(50 + r * Math.cos(a)).toFixed(1)}" cy="${(50 + r * Math.sin(a)).toFixed(1)}" r="${rr}"/>`; }).join('');
          const glint = `<rect x="-24" y="0" width="9" height="100" fill="#fff" opacity=".09" style="${AA('fx-glint', 7, 'ease-in-out')}"/>`;
          const rim = `<circle cx="50" cy="50" r="31" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="1"/>
              <path d="M30 36 A26 26 0 0 1 46 24" stroke="rgba(255,255,255,.35)" stroke-width="2" fill="none" stroke-linecap="round"/>`;
          const clothes = `<g style="${rot(sp)}">
              <circle cx="50" cy="26" r="7" fill="#f472b6" opacity=".9"/><circle cx="73" cy="58" r="6" fill="#fbbf24" opacity=".9"/>
              <circle cx="30" cy="62" r="7.5" fill="#60a5fa" opacity=".9"/><circle cx="58" cy="44" r="5" fill="#a78bfa" opacity=".85"/></g>`;

          /* ---------- SCÈNES ANIMÉES (viewBox 100×100) ---------- */
          let scene = '';
          if (CFG.kind === 'washer') {
            scene = `
              <clipPath id="${uid}c"><circle cx="50" cy="50" r="31"/></clipPath>
              <circle cx="50" cy="50" r="36" fill="rgba(255,255,255,.05)" stroke="${col}" stroke-opacity=".55" stroke-width="2.4"/>
              <g fill="${col}" opacity=".5" style="${rot(14, true)}">${holes(33.6, 12, .9)}</g>
              <circle cx="50" cy="50" r="31" fill="#07101d"/>
              <g clip-path="url(#${uid}c)">
                <g fill="rgba(255,255,255,.07)" style="${rot(sp)}">${holes(26, 14, 1.3)}${holes(17, 9, 1.1)}</g>
                <g style="transform:translateY(${running ? 0 : 6}px);transition:transform 1s">
                  <g style="transform-origin:50px 50px;${A('fx-slosh', 2.4, 'ease-in-out', 0, 'infinite alternate')}">
                    <g style="${A('fx-wave', 2.6)}">${wave(52, col + '88')}</g>
                    <g style="${A('fx-wave', 3.8, 'linear', 0, 'infinite reverse')}">${wave(56, col + '55')}</g>
                  </g>
                </g>
                ${clothes}
                ${parts(8, 26, 74, 76, 34, 1.8)}
                ${glint}
              </g>
              ${rim}`;
          } else if (CFG.kind === 'dryer') {
            scene = `
              <clipPath id="${uid}c"><circle cx="50" cy="50" r="31"/></clipPath>
              <radialGradient id="${uid}g"><stop offset="0" stop-color="${col}" stop-opacity="${running ? .55 : .12}"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></radialGradient>
              <circle cx="50" cy="50" r="36" fill="rgba(255,255,255,.05)" stroke="${col}" stroke-opacity=".55" stroke-width="2.4"/>
              <g fill="${col}" opacity=".5" style="${rot(14, true)}">${holes(33.6, 12, .9)}</g>
              <circle cx="50" cy="50" r="31" fill="#07101d"/>
              <circle cx="50" cy="50" r="31" fill="url(#${uid}g)" style="${running ? AA('fx-breath', 1.8, 'ease-in-out') : 'opacity:.5'}"/>
              <g clip-path="url(#${uid}c)">
                <g stroke="rgba(255,255,255,.14)" stroke-width="2.2" stroke-linecap="round" style="${rot(sp)}">
                  <path d="M50 19 V30 M76.8 65.5 L67.3 60 M23.2 65.5 L32.7 60"/>
                </g>
                ${clothes}
                ${running ? [0,1,2].map(i => `<path d="M${36+i*14} 74 q4 -6 0 -12 t0 -12" fill="none" stroke="${col}" stroke-width="2" stroke-linecap="round" style="${A('fx-heat', 2, 'ease-in-out', i * .5)}"/>`).join('') : ''}
                ${parts(6, 28, 72, 78, 40, 1.4, '#fde68a')}
                ${glint}
              </g>
              ${rim}`;
          } else if (CFG.kind === 'dish') {
            scene = `
              <clipPath id="${uid}c"><rect x="17" y="17" width="66" height="66" rx="12"/></clipPath>
              <rect x="15" y="15" width="70" height="70" rx="14" fill="rgba(255,255,255,.05)" stroke="${col}" stroke-opacity=".55" stroke-width="2.4"/>
              <rect x="17" y="17" width="66" height="66" rx="12" fill="#07101d"/>
              <g clip-path="url(#${uid}c)">
                <g opacity="${running ? .12 : 0}"><rect x="17" y="17" width="66" height="66" fill="${col}" style="${running ? AA('fx-breath', 2.2, 'ease-in-out') : ''}"/></g>
                <rect x="17" y="62" width="66" height="22" fill="${col}" opacity="${running ? .2 : .06}"/>
                <g style="${A('fx-wave', 2.4)}">${wave(80, col + '44')}</g>
                <g stroke="rgba(255,255,255,.35)" stroke-width="1.4" fill="none" stroke-linecap="round">
                  <path d="M24 66 h52"/><path d="M26 66 v-10 M34 66 v-10 M42 66 v-10 M58 66 v-10 M66 66 v-10 M74 66 v-10"/>
                  <ellipse cx="30" cy="56" rx="2" ry="9"/><ellipse cx="46" cy="56" rx="2" ry="9"/><ellipse cx="62" cy="56" rx="2" ry="9"/><ellipse cx="72" cy="56" rx="2" ry="9"/>
                </g>
                <g style="${rot(+(sp * .7).toFixed(1), false, 50, 41.7)}">
                  <rect x="24" y="40" width="52" height="3.4" rx="1.7" fill="${col}"/>
                  <circle cx="50" cy="41.7" r="3.4" fill="#fff" opacity=".9"/>
                  ${running ? `<path d="M25 40 q-2 -5 2 -9 M75 43.4 q2 5 -2 9" stroke="${col}" stroke-width="1.2" stroke-dasharray="1.5 2" fill="none" stroke-linecap="round" style="${A('fx-flow', .5)}"/>` : ''}
                </g>
                ${running ? Array.from({ length: 10 }, (_, i) => `<circle cx="${(22 + i * 6.2).toFixed(1)}" cy="44" r="1.4" fill="${col}" style="${A('fx-drop', 1.5, 'ease-in', i * .19)}"/>`).join('') : ''}
                ${parts(6, 22, 78, 82, 14, 1.6)}
                ${running ? steam([36, 50, 64], 30) : ''}
                ${glint}
              </g>
              <circle cx="50" cy="80" r="1.8" fill="${running ? scol : 'rgba(255,255,255,.3)'}" style="${running ? AA('fx-dot', 1.2, 'ease-in-out') : ''}"/>`;
          } else {
            scene = `
              <clipPath id="${uid}c"><rect x="29" y="14" width="42" height="72" rx="14"/></clipPath>
              ${steamOn ? steam([42, 50, 58], 9) : ''}
              <rect x="27" y="12" width="46" height="76" rx="16" fill="rgba(255,255,255,.05)" stroke="${col}" stroke-opacity=".55" stroke-width="2.4"/>
              <rect x="29" y="14" width="42" height="72" rx="14" fill="#07101d"/>
              <g clip-path="url(#${uid}c)">
                <g style="${AA('fx-wave', running ? 2.2 : 4.5)}">${wave(36, wcol + '99')}</g>
                <g style="${AA('fx-wave', running ? 3.4 : 6.5, 'linear', 0, 'infinite reverse')}">${wave(41, wcol + '55')}</g>
                <g opacity="${running ? .6 : 0}"><ellipse cx="50" cy="74" rx="17" ry="9" fill="${col}" style="filter:blur(3px);${running ? AA('fx-breath', 1.6, 'ease-in-out') : ''}"/></g>
                ${running ? `<path d="M50 68 C 44 58, 56 50, 50 42" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1.2" stroke-dasharray="2 5" stroke-linecap="round" style="${A('fx-flow', .9)}"/>` : ''}
                <path d="M36 74 h6 l3 -7 l6 14 l6 -14 l3 7 h6" fill="none" stroke="${running ? col : 'rgba(255,255,255,.35)'}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="${running ? 'filter:drop-shadow(0 0 2px ' + col + ');' + A('fx-zig', 1.2, 'ease-in-out') : ''}"/>
                ${running ? `<path d="M36 74 h6 l3 -7 l6 14 l6 -14 l3 7 h6" fill="none" stroke="#fff7d6" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 50" style="${A('fx-coil', 1.2)}"/>` : ''}
                ${parts(7, 34, 66, 70, 34, 1.6)}
                ${glint}
              </g>
              <path d="M36 22 q-1 12 0 22" stroke="rgba(255,255,255,.3)" stroke-width="2" fill="none" stroke-linecap="round"/>`;
          }

          /* ---------- ANNEAU DE PUISSANCE ---------- */
          const ring = `
            <circle cx="50" cy="50" r="${R}" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="3" style="${!running && !unavailable ? AA('fx-idle', 4, 'ease-in-out') : ''}"/>
            <circle cx="50" cy="50" r="${R}" fill="none" stroke="${col}" stroke-width="3" stroke-linecap="round"
              stroke-dasharray="${(C*pct).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 50 50)" style="${running ? 'filter:drop-shadow(0 0 3px ' + col + ')' : ''}"/>
            ${running ? `
            <circle cx="50" cy="50" r="51" fill="none" stroke="${col}" stroke-opacity=".4" stroke-width=".8" stroke-dasharray="1.5 4" style="${rot(10, true)}"/>
            <circle cx="50" cy="50" r="${R}" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-dasharray="0.1 ${C.toFixed(1)}" style="filter:drop-shadow(0 0 3px ${col});${rot(2.4)}"/>` : ''}`;

          const chip = (label, v, c) => `
            <div class="fx-chip">
              <div style="font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:rgba(226,232,240,.55);font-weight:700">${label}</div>
              <div style="font-size:13px;font-weight:700;color:${c||'#f1f5f9'};margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${v}</div>
            </div>`;
          const chips = [
            V.temp ? chip('Température', tC == null ? '—' : tC.toFixed(1) + ' °C', '#fb923c') : '',
            CFG.energy ? chip('Énergie jour', kwh == null ? '—' : kwh.toFixed(2) + ' kWh') : '',
            CFG.cycle ? chip('Cycle', esc(cycleRaw == null ? '—' : cycleRaw)) : '',
            cmdTxt ? chip('Commande', cmdTxt, '#a78bfa') : '',
            chip('Prise', plugOn == null ? '—' : (plugOn ? 'ON' : 'OFF'), plugOn ? '#34d399' : '#fb7185')
          ].filter(Boolean).slice(0,3).join('');

          return `
          <style>
            .${uid},.${uid} *{box-sizing:border-box}
            .${uid}{position:relative;overflow:hidden;margin:6px;padding:1.5px;border-radius:24px;background:rgba(255,255,255,.07);font-family:'Inter','Segoe UI',system-ui,sans-serif;color:#f1f5f9;transition:transform .25s}
            .${uid}:hover{transform:translateY(-2px)}
            .${uid}.on{background:${col}30;box-shadow:0 0 30px ${col}26}
            .${uid}.on::before{content:"";position:absolute;inset:-60%;background:conic-gradient(from 0deg,transparent 0 62%,${col} 82%,#fff 86%,transparent 92%);${AA('fx-spin', 4.5)}}
            .${uid} .fx-in{position:relative;z-index:1;border-radius:22.5px;padding:16px 14px 14px;background:radial-gradient(110% 70% at 50% 0%, ${col}22, transparent 60%),linear-gradient(180deg,#0d1828,#0a1220);box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
            .${uid} .fx-led{position:relative;flex:none;width:6px;height:6px;border-radius:50%;background:${scol};box-shadow:0 0 8px ${scol}}
            .${uid} .fx-led::after{content:"";position:absolute;inset:0;border-radius:50%;border:1.5px solid ${scol};${running ? AA('fx-ping', 1.4, 'ease-out') : 'display:none'}}
            .${uid} .fx-num{font-size:40px;line-height:1;font-weight:800;letter-spacing:-.03em;color:${running ? '#fff' : 'rgba(241,245,249,.7)'};${running ? AA('fx-num', 2.4, 'ease-in-out') : ''}}
            .${uid} .fx-bar{margin:12px 0;height:6px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;position:relative}
            .${uid} .fx-fill{height:100%;width:${(pct*100).toFixed(0)}%;border-radius:99px;background:repeating-linear-gradient(-45deg,rgba(255,255,255,${running ? .2 : 0}) 0 5px,transparent 5px 10px),linear-gradient(90deg,${col}99,${col});background-size:14px 14px,100% 100%;transition:width .8s ease;${running ? AA('fx-stripes', .7) : ''}}
            .${uid} .fx-sheen{position:absolute;top:0;bottom:0;left:-30%;width:30%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);${AA('fx-sheen', 2.2)}}
            .${uid} .fx-chip{position:relative;overflow:hidden;flex:1;min-width:0;padding:8px 10px;border-radius:13px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.07)}
            .${uid} .fx-chip::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.07),transparent);transform:skewX(-20deg);${AA('fx-gleam', 7, 'ease-in-out')}}
            .${uid} .fx-chip:nth-child(2)::after{animation-delay:${ph(7, 1.2)}}
            .${uid} .fx-chip:nth-child(3)::after{animation-delay:${ph(7, 2.4)}}
            .${uid} .fx-stm{transform-box:fill-box;transform-origin:center;filter:blur(1.5px)}
            @keyframes fx-spin{to{transform:rotate(360deg)}}
            @keyframes fx-spinr{to{transform:rotate(-360deg)}}
            @keyframes fx-wave{from{transform:translateX(0)}to{transform:translateX(-50px)}}
            @keyframes fx-slosh{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
            @keyframes fx-bub{0%{transform:translate(0,0);opacity:0}15%{opacity:.75}50%{transform:translate(1.5px,calc(var(--h) * .5))}100%{transform:translate(-1px,var(--h));opacity:0}}
            @keyframes fx-heat{0%{transform:translateY(6px);opacity:0}30%{opacity:.9}100%{transform:translateY(-10px);opacity:0}}
            @keyframes fx-drop{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(30px);opacity:0}}
            @keyframes fx-steam{0%{transform:translate(0,4px) scale(.5);opacity:0}30%{opacity:.5}100%{transform:translate(2px,-14px) scale(1.7);opacity:0}}
            @keyframes fx-glint{0%,60%{transform:translateX(0) skewX(-18deg)}100%{transform:translateX(150px) skewX(-18deg)}}
            @keyframes fx-breath{0%,100%{opacity:.45}50%{opacity:1}}
            @keyframes fx-coil{from{stroke-dashoffset:60}to{stroke-dashoffset:0}}
            @keyframes fx-flow{to{stroke-dashoffset:-7}}
            @keyframes fx-zig{0%,100%{opacity:.75}50%{opacity:1}}
            @keyframes fx-shake{0%,100%{transform:translate(0,0)}25%{transform:translate(-.6px,.4px)}50%{transform:translate(.5px,-.5px)}75%{transform:translate(-.4px,-.3px)}}
            @keyframes fx-glow{0%,100%{filter:drop-shadow(0 0 3px var(--c))}50%{filter:drop-shadow(0 0 11px var(--c))}}
            @keyframes fx-ping{0%{transform:scale(.6);opacity:1}100%{transform:scale(2.6);opacity:0}}
            @keyframes fx-dot{0%,100%{opacity:1}50%{opacity:.35}}
            @keyframes fx-idle{0%,100%{opacity:.5}50%{opacity:1}}
            @keyframes fx-num{0%,100%{text-shadow:0 0 8px var(--cg)}50%{text-shadow:0 0 24px var(--c)}}
            @keyframes fx-stripes{to{background-position:14px 0,0 0}}
            @keyframes fx-sheen{from{left:-30%}to{left:100%}}
            @keyframes fx-gleam{0%,70%{left:-60%}100%{left:130%}}
            @media (prefers-reduced-motion: reduce){.${uid} *,.${uid}::before,.${uid} *::after{animation:none!important}}
          </style>
          <div class="fxT ${uid} ${running ? 'on' : ''}" style="--c:${col};--cg:${col}55">
            <div class="fx-in">
              <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap">
                <div style="min-width:0">
                  <div style="font-size:17px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(CFG.name)}</div>
                  <div style="font-size:11.5px;color:rgba(226,232,240,.6);margin-top:2px">${esc(CFG.sub)}</div>
                </div>
                <div style="display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:${scol}1f;border:1px solid ${scol}55;font-size:10px;font-weight:800;letter-spacing:.08em;color:${scol};white-space:nowrap">
                  <span class="fx-led"></span>${status}
                </div>
              </div>
              <div style="display:flex;justify-content:center;margin:8px 0 2px">
                <svg viewBox="0 0 100 100" width="168" height="168" style="max-width:100%;overflow:visible;${running ? AA('fx-glow', 2.6, 'ease-in-out') : ''}">${ring}<g style="${shake ? A('fx-shake', .22) : ''}">${scene}</g></svg>
              </div>
              <div style="text-align:center">
                <div style="display:inline-flex;align-items:baseline;gap:6px">
                  <span class="fx-num">${wTxt}</span>
                  <span style="font-size:16px;font-weight:700;color:${col}">${wUnit}</span>
                </div>
                <div style="font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:rgba(226,232,240,.5);font-weight:700;margin-top:3px">Puissance · ${(pct*100).toFixed(0)} % de ${CFG.maxW} W</div>
              </div>
              <div class="fx-bar"><div class="fx-fill"></div>${running ? '<div class="fx-sheen"></div>' : ''}</div>
              <div style="display:flex;gap:7px">${chips}</div>
            </div>
          </div>`;
        ]]]
      t3: |-
        [[[
          /* ===== À MODIFIER : entités de cet appareil ===== */
          const V = {name: "Sèche-linge", sub: "Séchoir", icon: "mdi:tumble-dryer", col: "#c4b5fd", cy: "sensor.seche_linge_cycle", pw: "[[foxcat:legacy.sensor_seche_linge_puissance]]", sw: "[[foxcat:machines.dryer.switch]]", max: 2800, spin: true, energy: "", cmd_sensor: "sensor.foxcat_energy_fonctions_utilisateur_seche_linge_commande_utilisateur", kind: "dryer"};
          /* ===== fin ===== */

          const CFG = {
            name: V.name, sub: V.sub, icon: V.icon, kind: V.kind, color: V.col || '#60a5fa', maxW: Number(V.max) || 2200,
            power: V.pw, energy: V.energy || '', cycle: V.cy || '', plug: V.sw || '', cmd: V.cmd_sensor || '',
            idle: ['idle','off','none','unknown','unavailable','standby','ready','','termine','terminé','fin']
          };
          const st = (id) => (id && states[id]) ? states[id] : null;
          const val = (id) => { const s = st(id); return s ? s.state : null; };
          const num = (id) => { const v = parseFloat(val(id)); return isFinite(v) ? v : null; };
          const clamp = (x,a,b) => Math.min(b, Math.max(a, x));
          const esc = (t) => String(t ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
          const w = num(CFG.power), kwh = num(CFG.energy);
          const cycleRaw = val(CFG.cycle), cmdRaw = val(CFG.cmd);
          const plugOn = st(CFG.plug) ? val(CFG.plug) === 'on' : null;
          const cycleActive = cycleRaw != null && !CFG.idle.includes(String(cycleRaw).toLowerCase());
          const running = (w != null && w > 20) || cycleActive;
          const unavailable = [CFG.power, CFG.plug].filter(Boolean).every(id => !st(id) || val(id) === 'unavailable');
          let status, scol;
          if (unavailable)          { status = 'INDISPONIBLE'; scol = '#94a3b8'; }
          else if (plugOn === false){ status = 'PRISE OFF';    scol = '#fb7185'; }
          else if (running)         { status = 'EN COURS';     scol = CFG.color; }
          else                      { status = 'PRÊT';         scol = '#34d399'; }
          const col = CFG.color;
          const pct = w != null ? clamp(w / CFG.maxW, 0, 1) : 0;
          const R = 47, C = 2 * Math.PI * R;
          const wTxt = w == null ? '—' : (w >= 1000 ? (w/1000).toFixed(2) : Math.round(w));
          const wUnit = w != null && w >= 1000 ? 'kW' : 'W';
          const cmdMap = { auto:'AUTO', off:'OFF', start:'DÉMARRAGE', demarrage:'DÉMARRAGE', on:'ON' };
          const cmdTxt = (cmdRaw == null || ['unknown','unavailable'].includes(cmdRaw)) ? null : (cmdMap[String(cmdRaw).toLowerCase()] || String(cmdRaw).toUpperCase());
          const uid = 'fx' + String(CFG.kind).replace(/\W/g,'');

          /* ---------- ANIMATIONS EN PHASE ----------
             Délai négatif calé sur l'horloge : quand la puissance se met à jour et que
             la tuile se redessine, les animations continuent sans repartir de zéro. */
          const NOW = Date.now() / 1000;
          const ph = (d, o = 0) => `-${((NOW + o) % d).toFixed(2)}s`;
          const PS = running ? 'running' : 'paused';
          const A  = (n, d, tf = 'linear', o = 0, x = 'infinite') => `animation:${n} ${d}s ${tf} ${ph(d, o)} ${x};animation-play-state:${PS};`;
          const AA = (n, d, tf = 'linear', o = 0, x = 'infinite') => `animation:${n} ${d}s ${tf} ${ph(d, o)} ${x};`;
          const rot = (d, rev = false, ox = 50, oy = 50) => `transform-origin:${ox}px ${oy}px;${A(rev ? 'fx-spinr' : 'fx-spin', d)}`;

          /* vitesse du tambour / du bras selon la puissance (paliers de 0,2 s) */
          const sp = running ? Math.max(0.8, Math.round((3.4 - 2.6 * pct) * 5) / 5) : 3.4;
          const shake = running && pct > 0.6 && CFG.kind === 'washer';

          /* boiler : couleur de l'eau selon la température */
          const tC = num(V.temp);
          const heat = (v) => v == null ? col : v < 35 ? '#38bdf8' : v < 45 ? '#22d3ee' : v < 55 ? '#fbbf24' : v < 65 ? '#fb923c' : '#f87171';
          const wcol = CFG.kind === 'boiler' ? heat(tC) : col;
          const steamOn = running || (tC != null && tC >= 50);

          /* ---------- BRIQUES SVG ---------- */
          const wave = (y, fill) => `<path d="M-50 ${y} q12.5 -5 25 0 t25 0 t25 0 t25 0 t25 0 t25 0 t25 0 t25 0 V110 H-50 Z" fill="${fill}"/>`;
          const parts = (n, x0, x1, y, h, d0, fill = '#fff') => !running ? '' : Array.from({ length: n }, (_, i) => {
            const x = x0 + (((i * 37) % 100) / 100) * (x1 - x0);
            const d = +(d0 + ((i * 53) % 10) / 10).toFixed(1);
            return `<circle cx="${x.toFixed(1)}" cy="${y}" r="${(1.2 + (i % 3) * .6).toFixed(1)}" fill="${fill}" style="--h:-${h}px;${A('fx-bub', d, 'ease-in', i * .7)}"/>`;
          }).join('');
          const steam = (xs, y) => xs.map((x, i) => `<ellipse class="fx-stm" cx="${x}" cy="${y}" rx="3" ry="5" fill="#e2e8f0" style="${AA('fx-steam', +(3 + i * .5).toFixed(1), 'ease-out', i * 1.1)}"/>`).join('');
          const holes = (r, n, rr) => Array.from({ length: n }, (_, i) => { const a = i / n * 2 * Math.PI; return `<circle cx="${(50 + r * Math.cos(a)).toFixed(1)}" cy="${(50 + r * Math.sin(a)).toFixed(1)}" r="${rr}"/>`; }).join('');
          const glint = `<rect x="-24" y="0" width="9" height="100" fill="#fff" opacity=".09" style="${AA('fx-glint', 7, 'ease-in-out')}"/>`;
          const rim = `<circle cx="50" cy="50" r="31" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="1"/>
              <path d="M30 36 A26 26 0 0 1 46 24" stroke="rgba(255,255,255,.35)" stroke-width="2" fill="none" stroke-linecap="round"/>`;
          const clothes = `<g style="${rot(sp)}">
              <circle cx="50" cy="26" r="7" fill="#f472b6" opacity=".9"/><circle cx="73" cy="58" r="6" fill="#fbbf24" opacity=".9"/>
              <circle cx="30" cy="62" r="7.5" fill="#60a5fa" opacity=".9"/><circle cx="58" cy="44" r="5" fill="#a78bfa" opacity=".85"/></g>`;

          /* ---------- SCÈNES ANIMÉES (viewBox 100×100) ---------- */
          let scene = '';
          if (CFG.kind === 'washer') {
            scene = `
              <clipPath id="${uid}c"><circle cx="50" cy="50" r="31"/></clipPath>
              <circle cx="50" cy="50" r="36" fill="rgba(255,255,255,.05)" stroke="${col}" stroke-opacity=".55" stroke-width="2.4"/>
              <g fill="${col}" opacity=".5" style="${rot(14, true)}">${holes(33.6, 12, .9)}</g>
              <circle cx="50" cy="50" r="31" fill="#07101d"/>
              <g clip-path="url(#${uid}c)">
                <g fill="rgba(255,255,255,.07)" style="${rot(sp)}">${holes(26, 14, 1.3)}${holes(17, 9, 1.1)}</g>
                <g style="transform:translateY(${running ? 0 : 6}px);transition:transform 1s">
                  <g style="transform-origin:50px 50px;${A('fx-slosh', 2.4, 'ease-in-out', 0, 'infinite alternate')}">
                    <g style="${A('fx-wave', 2.6)}">${wave(52, col + '88')}</g>
                    <g style="${A('fx-wave', 3.8, 'linear', 0, 'infinite reverse')}">${wave(56, col + '55')}</g>
