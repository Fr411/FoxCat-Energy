  subview: true
  cards: []
- type: sections
  max_columns: 4
  icon: mdi:flash
  path: energie
  sections:
  - type: grid
    cards:
    - type: custom:button-card
      show_name: false
      show_icon: false
      show_state: false
      grid_options:
        columns: full
      custom_fields:
        panel: |
          [[[
            /* =========================================================
               FOXCAT ENERGY V1.3.200 — ONGLET ÉNERGIE (PREMIUM)
               Même logique et mêmes entités que la version précédente.
               ========================================================= */

            /* ---------- OUTILS ---------- */
            const norm = (v) => String(v ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
            const stateOf = (id, fb = '—') => {
              if (!id || !states[id]) return fb;
              const v = states[id].state;
              return (v === undefined || v === null || v === '' || v === 'unknown' || v === 'unavailable' || v === 'none') ? fb : v;
            };
            const numberOf = (id, fb = 0) => { const v = Number.parseFloat(stateOf(id, '')); return Number.isFinite(v) ? v : fb; };
            const isOn = (id) => id && states[id]?.state === 'on';
            const clamp = (v, a, b) => Math.min(Math.max(Number(v) || 0, a), b);
            const fmtPower = (v) => { const x = Math.abs(Number(v) || 0); return x >= 1000 ? `${(x / 1000).toFixed(2)} kW` : `${Math.round(x)} W`; };
            const fmtEnergy = (v) => Number.isFinite(Number(v)) ? `${Number(v).toFixed(2)} kWh` : '—';
            const fmtPercent = (v) => `${clamp(v, 0, 100).toFixed(0)} %`;
            const fmtEuro = (v) => `${Number(v || 0).toFixed(2)} €`;

            /* ---------- ENTITÉS FOXCAT ---------- */
            const E = {
              mode: '[[foxcat:ems.mode]]',
              pv: '[[foxcat:legacy.sensor_foxcat_energy_energie_puissance_de_production_photovoltaique]]',
              house: '[[foxcat:legacy.sensor_foxcat_energy_energie_puissance_de_consommation_maison]]',
              export: '[[foxcat:legacy.sensor_foxcat_energy_energie_puissance_reinjectee_au_reseau]]',
              import: '[[foxcat:legacy.sensor_foxcat_energy_energie_puissance_prelevee_au_reseau]]',
              balance: 'sensor.foxcat_energy_energie_puissance_reseau_signee_prelevement_reinjection',
              priLevel: 'sensor.foxcat_energy_onduleur_niveau_de_puissance_pri_actuel',
              priTarget: 'sensor.foxcat_energy_onduleur_niveau_de_puissance_pri_cible',
              priDirection: 'sensor.foxcat_energy_onduleur_direction_pri',
              priAckGrid: 'sensor.foxcat_energy_onduleur_ack_reseau',
              priReason: '[[foxcat:legacy.sensor_foxcat_energy_ems_derniere_decision_ems]]',
              boilerTemp: 'sensor.foxcat_energy_boiler_temperature_chauffe_eau',
              boilerPower: '[[foxcat:legacy.sensor_foxcat_energy_boiler_puissance_chauffe_eau]]',
              boilerDemand: '[[foxcat:legacy.sensor_foxcat_energy_boiler_demande_chauffe_eau]]',
              boilerOrigin: '[[foxcat:legacy.sensor_foxcat_energy_boiler_origine_de_la_demande_chauffe_eau]]',
              boilerPhysical: '[[foxcat:legacy.binary_sensor_foxcat_energy_boiler_boiler_physique]]',
              solarConfidence: 'sensor.foxcat_energy_ia_confiance_solaire',
              solarPotential: 'sensor.foxcat_energy_ia_potentiel_solaire',
              solarTrend: 'sensor.foxcat_energy_ia_tendance_solaire',
              currentPrice: 'sensor.foxcat_energy_tarification_prix_dynamique_actuel',
              nextPrice: 'sensor.foxcat_energy_tarification_prix_dynamique_heure_suivante'
            };

            /* ---------- PUISSANCES INSTANTANÉES ---------- */
            const pvPower = Math.max(numberOf(E.pv, numberOf('sensor.foxcat_energy_sources_energetiques_source_production_photovoltaique', 0)), 0);
            const housePower = Math.max(numberOf(E.house, numberOf('[[foxcat:legacy.sensor_consommation_reelle_maison]]', 0)), 0);
            const importPower = Math.max(numberOf(E.import, numberOf('sensor.foxcat_energy_energie_puissance_reseau_signee_prelevement_reinjection', 0)), 0);
            const exportPower = Math.max(numberOf(E.export, numberOf('sensor.foxcat_energy_sources_energetiques_source_puissance_reseau_active', 0)), 0);
            const solarCoverage = housePower > 0 ? clamp((pvPower / housePower) * 100, 0, 100) : (pvPower > 0 ? 100 : 0);

            /* ---------- COMPTEURS JOUR ---------- */
            const consumptionDay = Math.max(numberOf('sensor.foxcat_energy_energie_maison_consommation_aujourdhui', 0), 0);
            const gridDay = Math.max(numberOf('sensor.foxcat_energy_energie_maison_prelevement_reseau_aujourdhui', 0), 0);
            const exportDay = Math.max(numberOf('sensor.foxcat_energy_energie_pv_reinjection_aujourdhui', 0), 0);
            const pvDay = Math.max(numberOf('sensor.foxcat_energy_energie_pv_production_aujourdhui', 0), 0);
            const solarSelfConsumed = Math.max(numberOf('sensor.foxcat_energy_energie_pv_energie_autoconsommee_aujourdhui', 0), 0);
            /* Correctif : le capteur est en kWh, le taux se calcule donc sur la production du jour. */
            const selfConsumptionRate = pvDay > 0 ? clamp((solarSelfConsumed / pvDay) * 100, 0, 100) : 0;
            const autonomyRate = clamp(numberOf('sensor.foxcat_energy_energie_maison_taux_dautonomie_aujourdhui', 0), 0, 100);

            /* ---------- PRIX ---------- */
            const currentPrice = numberOf('[[foxcat:legacy.sensor_foxcat_energy_tarification_prix_d_achat_actif]]', 0);
            const nextPrice = numberOf('sensor.foxcat_energy_tarification_prix_d_achat_suivant', currentPrice);
            const activePriceLabel = stateOf('sensor.foxcat_energy_tarification_libelle_prix_actif', 'TARIF ACTIF');
            const nextPriceLabel = stateOf('sensor.foxcat_energy_tarification_libelle_prix_suivant', 'TARIF SUIVANT');
            const estimatedCost = Math.max(numberOf('sensor.foxcat_energy_tarification_dynamic_cout_achat_aujourdhui', 0), 0);
            const solarSaving = Math.max(numberOf('sensor.foxcat_energy_tarification_pv_gain_solaire_estime_aujourdhui', 0), 0);
            const economicDecision = stateOf('sensor.foxcat_energy_tarification_decision_economique_ems', '—');
            const economicBestSlot = stateOf('sensor.foxcat_energy_tarification_meilleur_creneau_economique', 'Maintenant');
            const economicSaving = Math.max(numberOf('sensor.foxcat_energy_tarification_economie_potentielle_en_reportant', 0), 0);

            const priceState = stateOf('sensor.foxcat_energy_tarification_statut_du_prix', 'NORMAL');
            let priceColor = '#facc15';
            const pn = norm(priceState);
            if (pn.includes('avantage') || pn.includes('bas') || pn.includes('hc') || pn.includes('negatif')) priceColor = '#34d399';
            else if (pn.includes('eleve') || pn.includes('cher')) priceColor = '#fb7185';
            else if (pn.includes('hp')) priceColor = '#fb923c';

            const priceDelta = nextPrice - currentPrice;
            let nextTrend = '→ stable', nextTrendColor = '#94a3b8';
            if (priceDelta > 0.01) { nextTrend = '↗ hausse'; nextTrendColor = '#fb7185'; }
            else if (priceDelta < -0.01) { nextTrend = '↘ baisse'; nextTrendColor = '#34d399'; }

            /* ---------- ÉTAT RÉSEAU ---------- */
            let gridState = 'ÉQUILIBRE', gridPower = 0, gridClass = 'neutral', gridIcon = 'mdi:transmission-tower', gridArrow = '↔';
            if (exportPower > 30 && exportPower >= importPower) {
              gridState = 'RÉINJECTION'; gridPower = exportPower; gridClass = 'export'; gridIcon = 'mdi:transmission-tower-export'; gridArrow = '↑';
            } else if (importPower > 30) {
              gridState = 'PRÉLÈVEMENT'; gridPower = importPower; gridClass = 'import'; gridIcon = 'mdi:transmission-tower-import'; gridArrow = '↓';
            }
            const pvActive = pvPower > 30;

            /* ---------- PRI ---------- */
            const hasPri = !!(E.priLevel && states[E.priLevel]);
            const priLevel = clamp(numberOf(E.priLevel, 100), 0, 100);
            const priTarget = clamp(numberOf(E.priTarget, priLevel), 0, 100);
            const priDirection = stateOf(E.priDirection, 'maintien');
            const priAckGrid = stateOf(E.priAckGrid, '—');

            /* ---------- BOILER ---------- */
            const boilerTemp = numberOf(E.boilerTemp, 0);
            const boilerPower = Math.max(numberOf(E.boilerPower, 0), 0);
            const boilerRunning = E.boilerPhysical ? isOn(E.boilerPhysical) : boilerPower > 200;
            const boilerDemand = stateOf(E.boilerDemand, 'AUCUNE');
            const boilerOrigin = stateOf(E.boilerOrigin, 'AUCUNE');

            /* ---------- EMS ---------- */
            const mode = stateOf(E.mode, 'Inconnu');
            const solarConfidence = clamp(numberOf(E.solarConfidence, 0), 0, 100);
            const solarPotential = stateOf(E.solarPotential, '—');
            const solarTrend = stateOf(E.solarTrend, '—');

            const modeMap = {
              'Économie énergie': ['🌿', '#34d399'],
              'Economie énergie': ['🌿', '#34d399'],
              'Zéro injection': ['⛔', '#fb7185'],
              'Bihoraire': ['♨️', '#fb923c'],
              'Dynamique': ['📈', '#a78bfa'],
              'Confort': ['🏠', '#38bdf8'],
              'Manuel': ['🖐️', '#60a5fa']
            };
            const [modeIcon, modeColor] = modeMap[mode] || ['⚡', '#c4b5fd'];

            /* ---------- SYNTHÈSE ---------- */
            let summary = 'Équilibre énergétique stable.', summaryColor = '#60a5fa', summaryIcon = 'mdi:chart-line';
            if (exportPower > 150) {
              summary = `Surplus solaire : ${fmtPower(exportPower)} sont actuellement réinjectés.`; summaryColor = '#34d399'; summaryIcon = 'mdi:solar-power-variant';
            } else if (importPower > 500) {
              summary = `La maison prélève actuellement ${fmtPower(importPower)} sur le réseau.`; summaryColor = '#fb7185'; summaryIcon = 'mdi:transmission-tower-import';
            } else if (pvPower > 50 && solarCoverage >= 95) {
              summary = 'Le solaire couvre pratiquement toute la consommation actuelle.'; summaryColor = '#facc15'; summaryIcon = 'mdi:white-balance-sunny';
            } else if (pvPower > 50) {
              summary = `Le photovoltaïque couvre actuellement ${fmtPercent(solarCoverage)} des besoins de la maison.`; summaryColor = '#22d3ee'; summaryIcon = 'mdi:solar-power';
            }

            /* ---------- COMPOSANTS ---------- */
            const R = 30, CIRC = 2 * Math.PI * R;
            const ring = (pct, color, label, sub) => `
              <div class="ring-box">
                <svg viewBox="0 0 76 76" class="ring">
                  <circle cx="38" cy="38" r="${R}" class="ring-bg"></circle>
                  <circle cx="38" cy="38" r="${R}" class="ring-fg" transform="rotate(-90 38 38)"
                    style="stroke:${color};stroke-dasharray:${(pct / 100 * CIRC).toFixed(1)} ${CIRC.toFixed(1)}"></circle>
                  <text x="38" y="43" class="ring-num">${pct.toFixed(0)}<tspan class="ring-pct">%</tspan></text>
                </svg>
                <div class="ring-label">${label}</div>
                <div class="ring-sub">${sub}</div>
              </div>`;

            const kpi = (cls, icon, label, value, foot) => `
              <div class="kpi ${cls}">
                <div class="kpi-icon"><ha-icon icon="${icon}"></ha-icon></div>
                <div class="kpi-label">${label}</div>
                <div class="kpi-value">${value}</div>
                <div class="kpi-foot">${foot}</div>
              </div>`;

            /* ==========================================================
               RENDU
               ========================================================== */
            return `
              <div class="energy-card">

                <!-- HEADER -->
                <div class="header">
                  <div class="brand">
                    <div class="brand-icon"><ha-icon icon="mdi:lightning-bolt"></ha-icon></div>
                    <div>
                      <div class="brand-name"><span class="fox">FOX</span><span class="cat">CAT</span><span class="energy-name">ENERGY</span></div>
                      <div class="brand-subtitle">ENERGY MANAGEMENT SYSTEM</div>
                    </div>
                  </div>
                  <div class="mode-pill" style="color:${modeColor};border-color:${modeColor}45;background:${modeColor}14;box-shadow:0 0 22px ${modeColor}18">
                    ${modeIcon} ${mode}
                  </div>
                </div>

                <!-- FLUX -->
                <div class="flow-card">
                  <div class="flow-title-row">
                    <div>
                      <div class="section-kicker">FLUX ÉNERGÉTIQUE</div>
                      <div class="flow-summary">Situation instantanée de l'installation</div>
                    </div>
                    <div class="live"><span class="live-dot"></span>TEMPS RÉEL</div>
                  </div>

                  <div class="flow-grid">
                    <div class="flow-node solar-node ${pvActive ? 'active' : ''}">
                      <div class="flow-icon"><ha-icon icon="mdi:solar-power"></ha-icon></div>
                      <div class="flow-label">SOLAIRE</div>
                      <div class="flow-value">${fmtPower(pvPower)}</div>
                    </div>

                    <div class="link ${pvActive ? 'flow-on to-right' : ''}"><i></i></div>

                    <div class="flow-node house-node active">
                      <div class="flow-icon"><ha-icon icon="mdi:home-lightning-bolt"></ha-icon></div>
                      <div class="flow-label">MAISON</div>
                      <div class="flow-value">${fmtPower(housePower)}</div>
                    </div>

                    <div class="link ${gridClass === 'export' ? 'flow-on to-right export' : gridClass === 'import' ? 'flow-on to-left import' : ''}"><i></i></div>

                    <div class="flow-node grid-node ${gridClass} ${gridClass !== 'neutral' ? 'active' : ''}">
                      <div class="flow-icon"><ha-icon icon="${gridIcon}"></ha-icon></div>
                      <div class="flow-label">RÉSEAU</div>
                      <div class="flow-value">${fmtPower(gridPower)}</div>
                    </div>
                  </div>

                  <div class="network-line ${gridClass}">
                    <div><span>ÉCHANGE RÉSEAU</span><strong>${gridState}</strong></div>
                    <div class="network-balance">${gridArrow} ${fmtPower(gridPower)}</div>
                  </div>
                </div>

                <!-- AUJOURD'HUI -->
                <div class="section-title"><span>AUJOURD'HUI</span><small>BILAN ÉNERGÉTIQUE</small></div>

                <div class="kpi-grid">
                  ${kpi('solar', 'mdi:white-balance-sunny', 'Production PV', fmtEnergy(pvDay), "Énergie produite aujourd'hui")}
                  ${kpi('consumption', 'mdi:home-lightning-bolt-outline', 'Consommation', fmtEnergy(consumptionDay), 'Énergie consommée par la maison')}
                  ${kpi('import', 'mdi:transmission-tower-import', 'Réseau prélevé', fmtEnergy(gridDay), "Prélevé au réseau aujourd'hui")}
                  ${kpi('self', 'mdi:home-battery-outline', 'Autoconsommé', fmtEnergy(solarSelfConsumed), 'Solaire utilisé directement')}
                  ${kpi('export', 'mdi:transmission-tower-export', 'Réinjection', fmtEnergy(exportDay), 'Énergie envoyée vers le réseau')}
                </div>

                <!-- PERFORMANCE + COÛT -->
                <div class="double-grid">

                  <div class="panel">
                    <div class="panel-title">PERFORMANCE SOLAIRE</div>
                    <div class="rings">
                      ${ring(solarCoverage, '#21d7ff', 'Couverture', 'instantanée')}
                      ${ring(selfConsumptionRate, '#ff982f', 'Autoconso.', 'du jour')}
                      ${ring(autonomyRate, '#34d399', 'Autonomie', 'du jour')}
                    </div>
                  </div>

                  <div class="panel cost-panel">
                    <div class="panel-title">COÛT ÉNERGIE</div>
                    <div class="cost-hero">
                      <div class="cost-value">${fmtEuro(estimatedCost)}</div>
                      <div class="cost-caption">coût réseau intégré aujourd'hui</div>
                    </div>

                    <div class="row"><span>Réseau prélevé</span><strong>${fmtEnergy(gridDay)}</strong></div>
                    <div class="row"><span>${activePriceLabel}</span><strong>${currentPrice.toFixed(3)} €/kWh</strong></div>
                    <div class="row"><span>${nextPriceLabel}</span><strong style="color:${nextTrendColor}">${nextPrice.toFixed(3)} €/kWh ${nextTrend}</strong></div>
                    <div class="row"><span>Décision économique EMS</span><strong>${economicDecision}</strong></div>
                    <div class="row"><span>Meilleur créneau</span><strong>${economicBestSlot}${economicSaving > 0 ? ` · ${economicSaving.toFixed(3)} €/kWh` : ''}</strong></div>
                    <div class="row saving-row"><span>Économie solaire</span><strong>${fmtEuro(solarSaving)}</strong></div>

                    <div class="price-badge" style="color:${priceColor};background:${priceColor}14;border-color:${priceColor}40">
                      ${priceState}
                    </div>
                  </div>

                </div>

                <!-- FOXCAT -->
                <div class="section-title"><span>FOXCAT ENERGY</span><small>EMS · PRI · ECS</small></div>

                <div class="foxcat-grid">

                  <div class="mini pri">
                    <div class="mini-top"><span>ONDULEUR SOLAREDGE</span><ha-icon icon="mdi:solar-power-variant"></ha-icon></div>
                    <div class="mini-main">${hasPri ? `${Math.round(priLevel)} %` : '—'}</div>
                    <div class="mini-sub">Cible <strong>${hasPri ? `${Math.round(priTarget)} %` : '—'}</strong> · ${priDirection}</div>
                    <div class="mini-bar"><div style="width:${hasPri ? priLevel : 0}%"></div></div>
                    <div class="mini-foot">ACK réseau : ${priAckGrid}</div>
                  </div>

                  <div class="mini boiler ${boilerRunning ? 'hot' : ''}">
                    <div class="mini-top"><span>BOILER</span><ha-icon icon="mdi:water-boiler"></ha-icon></div>
                    <div class="mini-main">${boilerTemp.toFixed(1)} °C</div>
                    <div class="mini-sub">
                      <span class="state-dot ${boilerRunning ? 'on' : ''}"></span>${boilerRunning ? 'Chauffe' : 'Attente'} · ${fmtPower(boilerPower)}
                    </div>
                    <div class="mini-foot">Demande : ${boilerDemand}<br>Origine : ${boilerOrigin}</div>
                  </div>

                  <div class="mini forecast">
                    <div class="mini-top"><span>IA SOLAIRE</span><ha-icon icon="mdi:weather-sunny-alert"></ha-icon></div>
                    <div class="mini-main">${Math.round(solarConfidence)} %</div>
                    <div class="mini-sub">Potentiel : ${solarPotential}</div>
                    <div class="mini-bar forecast-bar"><div style="width:${solarConfidence}%"></div></div>
                    <div class="mini-foot">Tendance : ${solarTrend}</div>
                  </div>

                </div>

                <!-- SYNTHÈSE -->
                <div class="summary" style="border-color:${summaryColor}30;background:linear-gradient(135deg,${summaryColor}14,${summaryColor}05)">
                  <div class="summary-icon" style="color:${summaryColor};background:${summaryColor}18;box-shadow:0 0 22px ${summaryColor}25">
                    <ha-icon icon="${summaryIcon}"></ha-icon>
                  </div>
                  <div>
                    <div class="summary-label">ANALYSE ÉNERGÉTIQUE</div>
                    <div class="summary-value">${summary}</div>
                  </div>
                </div>

                <!-- FOOTER -->
                <div class="footer">
                  <span>FOXCAT ENERGY V1.3.200</span>
                  <span>Production · Consommation · Optimisation</span>
                </div>

              </div>
            `;
          ]]]
      styles:
        card:
        - padding: 0
        - overflow: hidden
        - border-radius: 30px
        - border: 1px solid rgba(255,255,255,.09)
        - background: |
            radial-gradient(120% 70% at 0% 0%, rgba(255,132,28,.12), transparent 50%),
            radial-gradient(100% 70% at 100% 0%, rgba(22,211,255,.10), transparent 50%),
            radial-gradient(90% 60% at 50% 120%, rgba(52,211,153,.07), transparent 60%),
            linear-gradient(160deg, #070b14 0%, #0b1421 55%, #07101b 100%)
        - box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 24px 60px rgba(0,0,0,.45)
        grid:
        - grid-template-areas: '"panel"'
        - grid-template-columns: 1fr
        custom_fields:
          panel:
          - width: 100%
      extra_styles: |2

        * { box-sizing: border-box; }
        ha-icon { display: inline-flex; }

        .energy-card {
          width: 100%;
          padding: 28px;
          color: #f8fafc;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
        }

        /* ===================== HEADER ===================== */
        .header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 22px; }
        .brand { display: flex; align-items: center; gap: 16px; min-width: 0; }
        .brand-icon {
          width: 58px; height: 58px; flex: none; display: flex; align-items: center; justify-content: center; border-radius: 19px;
          background: linear-gradient(135deg, rgba(255,138,38,.18), rgba(25,216,255,.16));
          border: 1px solid rgba(255,255,255,.12);
          box-shadow: 0 0 34px rgba(25,216,255,.14), inset 0 1px 0 rgba(255,255,255,.12);
        }
        .brand-icon ha-icon {
          --mdc-icon-size: 30px; color: #f8fafc;
          filter: drop-shadow(-3px 0 7px rgba(255,138,38,.5)) drop-shadow(3px 0 7px rgba(25,216,255,.5));
        }
        .brand-name { font-size: 24px; line-height: 1; font-weight: 900; letter-spacing: .05em; white-space: nowrap; }
        .fox { color: #ff8a26; text-shadow: 0 0 20px rgba(255,138,38,.35); }
        .cat { color: #19d8ff; text-shadow: 0 0 20px rgba(25,216,255,.35); }
        .energy-name { margin-left: 8px; color: #94a3b8; font-weight: 600; }
        .brand-subtitle { margin-top: 8px; color: #64748b; font-size: 10px; font-weight: 700; letter-spacing: .26em; }
        .mode-pill { padding: 10px 16px; border-radius: 999px; border: 1px solid; font-size: 12px; font-weight: 800; letter-spacing: .03em; white-space: nowrap; }

        /* ===================== FLUX ===================== */
        .flow-card {
          padding: 22px; border-radius: 26px;
          background: linear-gradient(160deg, rgba(255,255,255,.045), rgba(255,255,255,.015));
          border: 1px solid rgba(255,255,255,.08);
          box-shadow: inset 0 1px 0 rgba(255,255,255,.05);
        }
        .flow-title-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
        .section-kicker { color: #94a3b8; font-size: 11px; font-weight: 800; letter-spacing: .18em; }
        .flow-summary { margin-top: 5px; color: #64748b; font-size: 12px; }
        .live {
          display: flex; align-items: center; gap: 8px; padding: 8px 13px; border-radius: 999px; color: #34d399;
          background: rgba(52,211,153,.07); border: 1px solid rgba(52,211,153,.2); font-size: 10px; font-weight: 800; letter-spacing: .1em;
        }
        .live-dot { width: 7px; height: 7px; border-radius: 50%; background: #34d399; box-shadow: 0 0 10px #34d399; animation: pulse 2s infinite; }

        .flow-grid { display: grid; grid-template-columns: 1fr 56px 1fr 56px 1fr; align-items: center; margin-top: 22px; }
        .flow-node {
          position: relative; min-width: 0; padding: 20px 10px; border-radius: 22px; text-align: center;
          background: rgba(255,255,255,.025); border: 1px solid rgba(255,255,255,.06); transition: all .3s;
        }
        .flow-node.active { background: rgba(255,255,255,.04); }
        .flow-icon { height: 36px; display: flex; align-items: center; justify-content: center; }
        .flow-icon ha-icon { --mdc-icon-size: 30px; }
        .flow-label { margin-top: 8px; color: #7c8ba1; font-size: 10px; font-weight: 800; letter-spacing: .14em; }
        .flow-value { margin-top: 5px; font-size: 24px; font-weight: 800; letter-spacing: -.02em; white-space: nowrap; }

        .solar-node .flow-icon, .solar-node .flow-value { color: #ff982f; }
        .solar-node.active { border-color: rgba(255,152,47,.35); box-shadow: 0 0 30px rgba(255,152,47,.14); }
        .house-node .flow-icon, .house-node .flow-value { color: #21d7ff; }
        .house-node.active { border-color: rgba(33,215,255,.3); box-shadow: 0 0 30px rgba(33,215,255,.12); }
        .grid-node .flow-icon, .grid-node .flow-value { color: #94a3b8; }
        .grid-node.export .flow-icon, .grid-node.export .flow-value { color: #34d399; }
        .grid-node.export.active { border-color: rgba(52,211,153,.35); box-shadow: 0 0 30px rgba(52,211,153,.14); }
        .grid-node.import .flow-icon, .grid-node.import .flow-value { color: #fb7185; }
        .grid-node.import.active { border-color: rgba(251,113,133,.35); box-shadow: 0 0 30px rgba(251,113,133,.14); }

        /* connecteurs animés */
        .link { position: relative; height: 4px; margin: 0 6px; border-radius: 4px; background: rgba(255,255,255,.07); overflow: hidden; }
        .link i { position: absolute; inset: 0; opacity: 0; }
        .link.flow-on i {
          opacity: 1; background-size: 28px 100%;
          background-image: linear-gradient(90deg, transparent 0 40%, var(--lc, #ff982f) 40% 100%);
          animation: slide-r 1s linear infinite;
        }
        .link.flow-on.to-left i { animation-name: slide-l; }
        .link.export { --lc: #34d399; }
        .link.import { --lc: #fb7185; }

        .network-line {
          display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 16px; padding: 13px 16px; border-radius: 16px;
          background: rgba(255,255,255,.025); border: 1px solid rgba(255,255,255,.06);
        }
        .network-line span { display: block; color: #64748b; font-size: 10px; font-weight: 800; letter-spacing: .14em; }
        .network-line strong { display: block; margin-top: 3px; color: #cbd5e1; font-size: 14px; font-weight: 800; }
        .network-balance { color: #94a3b8; font-size: 16px; font-weight: 800; }
        .network-line.export strong, .network-line.export .network-balance { color: #34d399; }
        .network-line.import strong, .network-line.import .network-balance { color: #fb7185; }

        /* ===================== TITRES ===================== */
        .section-title { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 28px 2px 12px; }
        .section-title span { color: #8493a8; font-size: 11px; font-weight: 800; letter-spacing: .2em; }
        .section-title small { color: #475569; font-size: 10px; font-weight: 700; letter-spacing: .1em; }

        /* ===================== KPI ===================== */
        .kpi-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
        .kpi {
          position: relative; overflow: hidden; min-width: 0; padding: 18px; border-radius: 20px;
          background: linear-gradient(160deg, rgba(255,255,255,.04), rgba(255,255,255,.012));
          border: 1px solid rgba(255,255,255,.07); transition: transform .25s, border-color .25s;
        }
        .kpi:hover { transform: translateY(-2px); border-color: rgba(255,255,255,.14); }
        .kpi::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 2px; background: linear-gradient(90deg, var(--k), transparent 85%); opacity: .85; }
        .kpi-icon {
          width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; border-radius: 12px; color: var(--k);
          background: rgba(255,255,255,.045); box-shadow: 0 0 18px color-mix(in srgb, var(--k) 22%, transparent);
        }
        .kpi-icon ha-icon { --mdc-icon-size: 21px; }
        .kpi-label { margin-top: 14px; color: #7c8ba1; font-size: 10px; font-weight: 800; letter-spacing: .11em; text-transform: uppercase; }
        .kpi-value { margin-top: 5px; color: var(--k); font-size: 22px; font-weight: 800; letter-spacing: -.02em; white-space: nowrap; }
        .kpi-foot { margin-top: 5px; color: #526174; font-size: 11px; line-height: 1.35; }
        .kpi.solar { --k: #ff982f; } .kpi.consumption { --k: #21d7ff; } .kpi.import { --k: #fb7185; } .kpi.self { --k: #facc15; } .kpi.export { --k: #34d399; }

        /* ===================== PANNEAUX ===================== */
        .double-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
        .panel {
          padding: 20px; border-radius: 22px;
          background: linear-gradient(160deg, rgba(255,255,255,.04), rgba(255,255,255,.012));
          border: 1px solid rgba(255,255,255,.07);
        }
        .panel-title { color: #8493a8; font-size: 11px; font-weight: 800; letter-spacing: .16em; }

        .rings { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 18px; }
        .ring-box { display: flex; flex-direction: column; align-items: center; text-align: center; }
        .ring { width: 92px; height: 92px; filter: drop-shadow(0 0 10px rgba(255,255,255,.05)); }
        .ring-bg { fill: none; stroke: rgba(255,255,255,.07); stroke-width: 6; }
        .ring-fg { fill: none; stroke-width: 6; stroke-linecap: round; transition: stroke-dasharray .8s cubic-bezier(.4,0,.2,1); }
        .ring-num { fill: #f8fafc; font-size: 17px; font-weight: 800; text-anchor: middle; }
        .ring-pct { font-size: 9px; fill: #94a3b8; }
        .ring-label { margin-top: 8px; color: #e2e8f0; font-size: 12px; font-weight: 700; }
        .ring-sub { margin-top: 2px; color: #64748b; font-size: 10px; }

        .cost-panel { background: radial-gradient(circle at 100% 0%, rgba(52,211,153,.10), transparent 55%), linear-gradient(160deg, rgba(255,255,255,.04), rgba(255,255,255,.012)); }
        .cost-hero { margin: 14px 0 14px; text-align: center; }
        .cost-value { color: #34d399; font-size: 40px; line-height: 1; font-weight: 800; letter-spacing: -.03em; text-shadow: 0 0 30px rgba(52,211,153,.25); }
        .cost-caption { margin-top: 6px; color: #64748b; font-size: 12px; }
        .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 9px; padding-top: 9px; border-top: 1px solid rgba(255,255,255,.05); color: #7c8ba1; font-size: 12px; }
        .row strong { color: #e2e8f0; text-align: right; font-size: 12px; font-weight: 700; }
        .saving-row strong { color: #34d399; }
        .price-badge { margin-top: 14px; padding: 9px 11px; border-radius: 12px; border: 1px solid; text-align: center; font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }

        /* ===================== FOXCAT ===================== */
        .foxcat-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
        .mini {
          position: relative; overflow: hidden; min-width: 0; padding: 18px; border-radius: 20px;
          background: linear-gradient(160deg, rgba(255,255,255,.04), rgba(255,255,255,.012));
          border: 1px solid rgba(255,255,255,.07); transition: border-color .3s, box-shadow .3s;
        }
        .mini::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 2px; background: linear-gradient(90deg, var(--m), transparent 85%); opacity: .85; }
        .mini.pri { --m: #facc15; } .mini.boiler { --m: #fb923c; } .mini.forecast { --m: #21d7ff; }
        .mini.hot { border-color: rgba(251,146,60,.4); box-shadow: 0 0 34px rgba(251,146,60,.14); }
        .mini-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: #8493a8; font-size: 10px; font-weight: 800; letter-spacing: .13em; }
        .mini-top ha-icon { --mdc-icon-size: 20px; color: var(--m); }
        .mini-main { margin-top: 12px; color: #f8fafc; font-size: 32px; font-weight: 800; letter-spacing: -.03em; }
        .mini-sub { display: flex; align-items: center; gap: 6px; margin-top: 4px; color: #7c8ba1; font-size: 12px; line-height: 1.4; }
        .mini-sub strong { color: #e2e8f0; }
        .state-dot { width: 8px; height: 8px; border-radius: 50%; background: #64748b; }
        .state-dot.on { background: #fb923c; box-shadow: 0 0 10px #fb923c; animation: pulse 1.4s infinite; }
        .mini-bar { height: 7px; margin-top: 14px; overflow: hidden; border-radius: 999px; background: rgba(255,255,255,.06); }
        .mini-bar > div { height: 100%; border-radius: 999px; background: linear-gradient(90deg, #facc15, #fde68a); box-shadow: 0 0 12px rgba(250,204,21,.4); transition: width .8s; }
        .forecast-bar > div { background: linear-gradient(90deg, #21d7ff, #7be8ff); box-shadow: 0 0 12px rgba(33,215,255,.4); }
        .mini-foot { margin-top: 12px; color: #64748b; font-size: 11px; line-height: 1.5; }

        /* ===================== SYNTHÈSE ===================== */
        .summary { display: flex; align-items: center; gap: 15px; margin-top: 16px; padding: 17px 18px; border-radius: 20px; border: 1px solid; }
        .summary-icon { flex: none; width: 46px; height: 46px; display: flex; align-items: center; justify-content: center; border-radius: 14px; }
        .summary-icon ha-icon { --mdc-icon-size: 24px; }
        .summary-label { color: #7c8ba1; font-size: 10px; font-weight: 800; letter-spacing: .16em; }
        .summary-value { margin-top: 5px; color: #e2e8f0; font-size: 14px; font-weight: 600; line-height: 1.45; }

        /* ===================== FOOTER ===================== */
        .footer { display: flex; justify-content: space-between; gap: 10px; margin-top: 20px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.05); color: #475569; font-size: 10px; letter-spacing: .1em; }

        /* ===================== ANIMATIONS ===================== */
        @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .45; transform: scale(.8); } }
        @keyframes slide-r { from { background-position: 0 0; } to { background-position: 28px 0; } }
        @keyframes slide-l { from { background-position: 28px 0; } to { background-position: 0 0; } }

        /* ===================== RESPONSIVE ===================== */
        @media (max-width: 1000px) {
          .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }
        @media (max-width: 700px) {
          .energy-card { padding: 18px; }
          .header { align-items: flex-start; flex-direction: column; }
          .brand-name { font-size: 19px; }
          .flow-grid { grid-template-columns: 1fr 26px 1fr 26px 1fr; }
          .link { margin: 0 2px; }
          .flow-value { font-size: 16px; }
          .flow-node { padding: 14px 4px; }
          .double-grid, .foxcat-grid { grid-template-columns: 1fr; }
          .cost-value { font-size: 34px; }
          .footer { flex-direction: column; }
        }

        /* ===== Mobile compact (FoxCat) ===== */
        @media (max-width: 700px) {
          .energy-card { padding: 14px; }
          .header { flex-direction: row; align-items: center; margin-bottom: 14px; }
          .brand { gap: 10px; }
          .brand-icon { width: 38px; height: 38px; border-radius: 12px; }
          .brand-icon ha-icon { --mdc-icon-size: 20px; }
          .brand-name { font-size: 18px; }
          .brand-subtitle { margin-top: 3px; font-size: 9px; }
          .mode-pill { padding: 6px 12px; font-size: 11px; }
          .flow-card { padding: 14px; border-radius: 20px; }
          .section-title { margin: 18px 2px 8px; }
          .kpi-grid { grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
          .kpi { grid-column: span 2; padding: 10px; border-radius: 16px; }
          .kpi:nth-child(n+4) { grid-column: span 3; }
          .kpi-icon, .kpi-foot { display: none; }
          .kpi-label { margin-top: 0; font-size: 8px; }
          .kpi-value { font-size: 15px; }
          .panel { padding: 14px; border-radius: 20px; }
          .ring { width: 70px; height: 70px; }
          .foxcat-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
          .mini { padding: 10px; border-radius: 16px; }
          .mini-top { font-size: 8px; letter-spacing: .08em; }
          .mini-top ha-icon { --mdc-icon-size: 14px; }
          .mini-main { margin-top: 6px; font-size: 19px; }
          .mini-sub { flex-wrap: wrap; font-size: 9px; }
          .mini-foot { margin-top: 6px; font-size: 9px; }
          .mini-bar { height: 5px; margin-top: 8px; }
        }
      tap_action:
        action: none
      hold_action:
        action: none
      double_tap_action:
        action: none
  background: radial-gradient(circle at 7% 8%, rgba(255,160,39,.16), transparent 26%), radial-gradient(circle at 94% 9%, rgba(0,198,255,.18), transparent 29%), linear-gradient(150deg,#05080c,#0b121a 58%,#05070a)
  cards: []
  subview: true
- type: sections
  max_columns: 4
  title: Day-Ahead
  path: day-ahead
  icon: mdi:chart-timeline-variant-shimmer
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Dynamic · Marché & tendance
      heading_style: title
      icon: mdi:chart-line
    - type: custom:button-card
      show_name: false
      show_icon: false
      show_state: false
      triggers_update: all
      custom_fields:
        content: |
          [[[
            const BUY='[[foxcat:pricing.source.current]]';
            const NEXT='[[foxcat:pricing.source.next]]';
            const TOMORROW='[[foxcat:pricing.source.tomorrow_available]]';
            const POS='sensor.foxcat_energy_tarification_position_sur_la_courbe_dynamique';
            const PLAN='sensor.foxcat_energy_tarification_planificateur_day_ahead';

            const buy=states[BUY], next=states[NEXT], tomorrow=states[TOMORROW];
            const pos=Number(states[POS]?.state);
            const plan=states[PLAN];
            const now=Date.now();

            const rows=[...(buy?.attributes?.today||[]),...(buy?.attributes?.tomorrow||[])]
              .map(r=>({time:new Date(r.start).getTime(),price:Number(r.all_in)}))
              .filter(r=>Number.isFinite(r.time)&&Number.isFinite(r.price))
              .sort((a,b)=>a.time-b.time);

            const currentPrice=Number(buy?.state), nextPrice=Number(next?.state);
            const future=rows.filter(r=>r.time>=now);

            /* ---- tendance (logique inchangée) ---- */
            let trend='Stable', trendIcon='mdi:trending-neutral', trendColor='#94a3b8';
            if(Number.isFinite(currentPrice)&&future.length){
              const u=future.slice(0,3).map(r=>r.price);
              const mean=u.reduce((a,b)=>a+b,0)/u.length;
              const delta=currentPrice!==0?(mean-currentPrice)/Math.abs(currentPrice):0;
              if(delta>0.04){trend='Hausse';trendIcon='mdi:trending-up';trendColor='#fb7185';}
              else if(delta<-0.04){trend='Baisse';trendIcon='mdi:trending-down';trendColor='#34d399';}
            }

            const low=plan?.attributes?.prochain_creux;
            const high=plan?.attributes?.prochain_pic;
            const fmt=v=>Number.isFinite(v)?v.toFixed(3).replace('.',',')+' €/kWh':'—';
            const pct=v=>Number.isFinite(v)?v.toFixed(1).replace('.',',')+' %':'—';
            const hour=v=>{const raw=(v&&typeof v==='object')?v.start:v;if(!raw)return '—';const d=new Date(raw);return Number.isNaN(d.getTime())?'—':d.toLocaleTimeString('fr-BE',{hour:'2-digit',minute:'2-digit'});};
            const tomorrowOn=tomorrow?.state==='on';
            const favorableOn=plan?.attributes?.prix_favorable===true;

            /* ---- couleur selon la position sur la courbe ---- */
            const posC=Number.isFinite(pos)?Math.min(Math.max(pos,0),100):null;
            const zoneColor=posC===null?'#facc15':posC<=30?'#34d399':posC>=70?'#fb7185':'#facc15';
            const zoneLabel=posC===null?'—':posC<=30?'ZONE BASSE':posC>=70?'ZONE HAUTE':'ZONE MOYENNE';

            /* ---- sparkline SVG : -1 h → +24 h ---- */
            const win=rows.filter(r=>r.time>=now-3600e3&&r.time<=now+24*3600e3);
            let spark='';
            if(win.length>2){
              const W=520,H=90,t0=win[0].time,t1=win[win.length-1].time;
              const ps=win.map(r=>r.price),mn=Math.min(...ps),mx=Math.max(...ps),rg=(mx-mn)||1;
              const X=t=>((t-t0)/((t1-t0)||1))*W, Y=p=>H-6-((p-mn)/rg)*(H-16);
              const pts=win.map(r=>`${X(r.time).toFixed(1)},${Y(r.price).toFixed(1)}`);
              const line='M'+pts.join(' L');
              const area=`${line} L${W},${H} L0,${H} Z`;
              const nx=X(Math.min(Math.max(now,t0),t1)).toFixed(1);
              const ny=Number.isFinite(currentPrice)?Y(currentPrice).toFixed(1):(H/2);
              spark=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" class="spark">
                <defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0" stop-color="#19d8ff" stop-opacity=".35"/><stop offset="1" stop-color="#19d8ff" stop-opacity="0"/>
                </linearGradient></defs>
                <path d="${area}" fill="url(#sg)"/>
                <path d="${line}" fill="none" stroke="#19d8ff" stroke-width="2.2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
                <line x1="${nx}" y1="0" x2="${nx}" y2="${H}" stroke="rgba(255,255,255,.25)" stroke-dasharray="3 4" vector-effect="non-scaling-stroke"/>
                <circle cx="${nx}" cy="${ny}" r="5" fill="#ff922b" stroke="#fff" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
              </svg>`;
            }

            const tile=(icon,label,value,note,color='#f1f5f9')=>`
              <div class="tile"><div class="t-ico"><ha-icon icon="${icon}"></ha-icon></div>
                <div class="t-label">${label}</div><div class="t-value" style="color:${color}">${value}</div><div class="t-note">${note}</div></div>`;

            return `<div class="wrap">
              <div class="head">
                <div>
                  <div class="eyebrow">LUMINUS DYNAMIC · WALLONIE</div>
                  <div class="title">Marché & tendance</div>
                  <div class="sub">Référence financière FoxCat</div>
                </div>
                <div class="zone" style="color:${zoneColor};border-color:${zoneColor}45;background:${zoneColor}12"><i style="background:${zoneColor}"></i>${zoneLabel}</div>
              </div>

              <div class="hero">
                <div class="h-label">PRIX ACTUEL</div>
                <div class="h-price">${fmt(currentPrice)}</div>
                <div class="h-trend" style="color:${trendColor}"><ha-icon icon="${trendIcon}"></ha-icon>${trend}</div>
                <div class="spark-box">${spark}<div class="spark-cap"><span>−1 h</span><span>MAINTENANT</span><span>+24 h</span></div></div>
              </div>

              <div class="pos">
                <div class="pos-top"><span>POSITION SUR LA COURBE</span><strong style="color:${zoneColor}">${pct(pos)}</strong></div>
                <div class="pos-bar"><div class="pos-fill" style="width:${posC??0}%"></div><div class="pos-dot" style="left:${posC??0}%;background:${zoneColor};box-shadow:0 0 12px ${zoneColor}"></div></div>
                <div class="pos-scale"><span>Bas</span><span>Haut</span></div>
              </div>

              <div class="tiles">
                ${tile('mdi:clock-fast','Heure suivante',fmt(nextPrice),'Luminus Dynamic')}
                ${tile('mdi:arrow-collapse-down','Prochain creux',hour(low),'Fenêtre favorable','#34d399')}
                ${tile('mdi:arrow-collapse-up','Prochain pic',hour(high),'Zone à éviter','#fb7185')}
                ${tile('mdi:calendar-clock','Day-Ahead',tomorrowOn?'Demain dispo':'Demain en attente',favorableOn?'FAVORABLE':'ATTENTE',favorableOn?'#34d399':'#facc15')}
              </div>
            </div>`;
          ]]]
      styles:
