    - type: custom:button-card
      show_name: false
      show_icon: false
      show_state: false
      triggers_update: all
      custom_fields:
        content: |
          [[[
            const num=id=>{const v=Number.parseFloat(states[id]?.state);return Number.isFinite(v)?v:0;};
            const kwh=v=>`${v.toFixed(2).replace('.',',')} kWh`;
            const eur=v=>`${v.toFixed(2).replace('.',',')} €`;

            const pv=num('sensor.foxcat_energy_energie_pv_production_aujourdhui');
            const conso=num('sensor.foxcat_energy_energie_maison_consommation_aujourdhui');
            const imp=num('sensor.foxcat_energy_energie_maison_prelevement_reseau_aujourdhui');
            const exp=num('sensor.foxcat_energy_energie_pv_reinjection_aujourdhui');

            const impDyn=num('sensor.foxcat_energy_energie_dynamic_prelevement_reseau_aujourdhui');
            const expDyn=num('sensor.foxcat_energy_energie_pv_reinjection_aujourdhui');
            const costBuy=num('sensor.foxcat_energy_tarification_dynamic_cout_achat_aujourdhui');
            const revInj=num('sensor.foxcat_energy_tarification_pv_valeur_reinjection_aujourdhui');
            const costInj=num('sensor.foxcat_energy_tarification_pv_cout_reinjection_aujourdhui');
            const net=num('sensor.foxcat_energy_tarification_maison_cout_net_aujourdhui');

            const netColor=net<=0?'#34d399':'#fb7185';
            const dynShare=imp>0?Math.min(Math.max(impDyn/imp*100,0),100):0;

            const tile=(icon,label,value,color)=>`
              <div class="tile" style="--c:${color}">
                <div class="t-ico"><ha-icon icon="${icon}"></ha-icon></div>
                <div class="t-label">${label}</div>
                <div class="t-value">${value}</div>
              </div>`;
            const row=(label,value,color='#e2e8f0')=>`<div class="row"><span>${label}</span><strong style="color:${color}">${value}</strong></div>`;

            return `<div class="wrap">
              <div class="eyebrow">TOTAUX PHYSIQUES</div>
              <div class="tiles">
                ${tile('mdi:solar-power','PV total jour',kwh(pv),'#ff982f')}
                ${tile('mdi:home-lightning-bolt-outline','Consommation',kwh(conso),'#21d7ff')}
                ${tile('mdi:transmission-tower-import','Import réseau',kwh(imp),'#fb7185')}
                ${tile('mdi:transmission-tower-export','Réinjection',kwh(exp),'#34d399')}
              </div>

              <div class="eyebrow" style="margin-top:22px">VENTILATION DYNAMIC</div>
              <div class="net">
                <div class="n-label">COÛT NET DYNAMIC</div>
                <div class="n-value" style="color:${netColor};text-shadow:0 0 30px ${netColor}40">${eur(net)}</div>
                <div class="n-sub">${net<=0?'Bilan positif : la maison gagne de l’argent':'Coût net de la journée'}</div>
              </div>

              <div class="share">
                <div class="s-top"><span>Import Dynamic / import total</span><strong>${dynShare.toFixed(0)} %</strong></div>
                <div class="s-bar"><div style="width:${dynShare}%"></div></div>
              </div>

              <div class="rows">
                ${row('Import Dynamic',kwh(impDyn))}
                ${row('Réinjection Dynamic',kwh(expDyn))}
                ${row('Coût achat Dynamic','− '+eur(costBuy),'#fb7185')}
                ${row('Revenu réinjection Dynamic','+ '+eur(revInj),'#34d399')}
                ${row('Coût réinjection Dynamic',eur(costInj),'#fbbf24')}
              </div>
            </div>`;
          ]]]
