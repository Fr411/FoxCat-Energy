                  <defs>
                    <linearGradient id="sft" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cbd5e1"/><stop offset="1" stop-color="#64748b"/></linearGradient>
                    <linearGradient id="sfh" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="${HOT}" stop-opacity="${(I * .5).toFixed(2)}"/><stop offset="1" stop-color="${HOT}" stop-opacity="0"/></linearGradient>
                    <linearGradient id="sfp" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="${heating ? '#f97316' : pipeCol}"/><stop offset="1" stop-color="${pipeCol}"/></linearGradient>
                    <pattern id="sfi" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#1e293b"/><line x1="0" y1="0" x2="0" y2="6" stroke="#334155" stroke-width="2"/></pattern>
                  </defs>
                  <rect x="6" y="0" width="188" height="52" fill="url(#sfh)"/>
                  ${waves}
                  ${tiles}
                  <rect x="6" y="64" width="188" height="52" rx="3" fill="#1f2937" stroke="rgba(255,255,255,.06)"/>
                  <path d="${pipe}" fill="none" stroke="#0b1220" stroke-width="7" stroke-linecap="round"/>
                  <path d="${pipe}" fill="none" stroke="url(#sfp)" stroke-width="3.5" stroke-linecap="round" opacity="${heating ? 1 : .7}" style="filter:drop-shadow(0 0 ${heating ? 4 : 1.5}px ${pipeCol})"/>
                  ${heating ? `<path d="${pipe}" fill="none" stroke="#fde68a" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="6 14" opacity=".85" style="${AA('sp-flow', 1.6)}"/>` : ''}
                  <rect x="6" y="118" width="188" height="12" rx="2" fill="url(#sfi)"/>
                  <rect x="6" y="132" width="188" height="16" rx="3" fill="#111827"/>
                  <text class="lbl" x="194" y="126" text-anchor="end">ISOLANT</text>
                  <text class="lbl" x="194" y="143" text-anchor="end">DALLE</text>
                </svg>
              </div>
              <div>
                <div class="gauge">
                  <svg viewBox="0 0 140 140">
                    <circle cx="70" cy="70" r="${R}" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${(C * ARC).toFixed(1)} ${C.toFixed(1)}" transform="rotate(135 70 70)"/>
                    ${tgt != null && mode !== 'off' ? `<circle cx="70" cy="70" r="${R}" fill="none" stroke="${gCol}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${(C * ARC * tgtP).toFixed(1)} ${C.toFixed(1)}" transform="rotate(135 70 70)" style="filter:drop-shadow(0 0 5px ${gCol}aa)"/>` : ''}
                    ${cur != null ? `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="6" fill="#fff" stroke="#0b1220" stroke-width="3"/>` : ''}
                  </svg>
                  <div class="gc">
                    <div class="gl">SALLE DE DOUCHE</div>
                    <div class="gv mono">${dec(cur)}<small>°C</small></div>
                    <div class="gt"><ha-icon icon="mdi:target"></ha-icon>${mode === 'off' ? 'Consigne —' : 'Consigne ' + dec(tgt) + ' °C'}</div>
                  </div>
                </div>
                <div class="meta">
                  ${gap != null && mode !== 'off' ? `<span>Écart <b>${gap > 0 ? '+' : ''}${dec(gap)}°</b></span>` : ''}
                  ${hum != null ? `<span><ha-icon icon="mdi:water-percent"></ha-icon> <b>${Math.round(hum)} %</b></span>` : ''}
                  <span>Relais <b>${heating ? 'ON' : 'OFF'}</b></span>
                  <span class="au ${auto ? 'on' : !schOn ? 'off' : ''}"><ha-icon icon="mdi:calendar-clock"></ha-icon>${plage}</span>
                </div>
              </div>
            </div>

            <div class="sec">ÉNERGIE · AUJOURD’HUI</div>
            <div class="kpis">
              ${kpi('mdi:lightning-bolt', 'Énergie', dec(tot, 2), uT, 'Depuis minuit', tot > 0 ? HOT : '#64748b')}
              ${kpi('mdi:solar-power-variant', 'Solaire', dec(sol, 2), unit(E.sol), solPct != null ? Math.round(solPct) + ' % du total' : '—', sol > 0 ? SUN : '#64748b')}
              ${kpi('mdi:transmission-tower', 'Réseau', dec(res, 2), unit(E.res), resPct != null ? Math.round(resPct) + ' % du total' : '—', res > 0 ? COOL : '#64748b')}
              ${kpi('mdi:leaf', 'Taux solaire', solPct != null ? Math.round(solPct) : '—', '%', 'Couverture photovoltaïque', solPct >= 50 ? '#4ade80' : solPct > 0 ? SUN : '#64748b')}
            </div>

            <div class="row2">
              <div class="box">
                <div class="sec" style="margin-top:0">ORIGINE</div>
                <div class="bar">
                  ${solPct != null && solPct > 0 ? `<i style="width:${solPct.toFixed(1)}%;background:linear-gradient(90deg,${SUN}99,${SUN})"></i>` : ''}
                  ${resPct != null && resPct > 0 ? `<i style="width:${resPct.toFixed(1)}%;background:linear-gradient(90deg,${COOL}99,${COOL})"></i>` : ''}
                </div>
                ${line(SUN, 'Solaire', sol, unit(E.sol))}
                ${line(COOL, 'Réseau', res, unit(E.res))}
              </div>
              <div class="box">
                <div class="sec" style="margin-top:0">TARIFS</div>
                <div class="bar">${seg(hp, HOT)}${seg(hc, COOL)}${seg(dyn, DYN)}</div>
                ${line(HOT, 'Heures pleines', hp, unit(E.hp), ` <small>· ${pctOf(hp)}</small>`)}
                ${line(COOL, 'Heures creuses', hc, unit(E.hc), ` <small>· ${pctOf(hc)}</small>`)}
                ${line(DYN, 'Dynamique', dyn, unit(E.dyn), ` <small>· ${pctOf(dyn)}</small>`)}
              </div>
            </div>
            <div class="note">Plage programmée via Scheduler · énergie calculée par FoxCat Energy, remise à zéro à minuit.</div>
          </div>`;
        ]]]
      minus:
