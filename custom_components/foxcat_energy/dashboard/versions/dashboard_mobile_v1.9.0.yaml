  - type: custom:button-card
    entity: [[foxcat:legacy.climate_chauffage_sol_2]]
    show_name: false
    show_icon: false
    show_state: false
    triggers_update:
    - [[foxcat:legacy.climate_chauffage_sol_2]]
    - input_boolean.chauffage_sol
    - switch.schedule_4168cf
    - sensor.foxcat_energy_energie_chauffage_sdb_energie_aujourdhui
    - sensor.foxcat_energy_energie_chauffage_sdb_part_solaire_aujourdhui
    - sensor.foxcat_energy_energie_chauffage_sdb_part_reseau_aujourdhui
    - sensor.foxcat_energy_energie_chauffage_sdb_consommation_hp_aujourdhui
    - sensor.foxcat_energy_energie_chauffage_sdb_consommation_hc_aujourdhui
    - sensor.foxcat_energy_energie_chauffage_sdb_consommation_dynamic_aujourdhui
    grid_options:
      columns: 12
    tap_action:
      action: more-info
    hold_action:
      action: more-info
    extra_styles: |
      @container (max-width: 480px) {
        #container { grid-template-areas: "main main" "minus plus" "modes modes" !important; grid-template-columns: 1fr 1fr !important; }
      }
    styles:
      card:
      - container-type: inline-size
      - padding: 0 14px 14px
      - border-radius: 28px
      - overflow: hidden
      - border: 1px solid rgba(255,255,255,.09)
      - background: rgba(10,16,28,.32)
      - backdrop-filter: blur(16px) saturate(140%)
      - -webkit-backdrop-filter: blur(16px) saturate(140%)
      - box-shadow: 0 10px 30px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.08)
      grid:
      - grid-template-areas: '"main main main" "minus modes plus"'
      - grid-template-columns: 64px minmax(0, 1fr) 64px
      - gap: 10px
      custom_fields:
        main:
        - width: 100%
        modes:
        - min-width: 0
    custom_fields:
      main: |-
        [[[
          const ID = '[[foxcat:legacy.climate_chauffage_sol_2]]', SW = 'input_boolean.chauffage_sol', SCH = 'switch.schedule_4168cf';
          const NAME = 'Chauffage sol', ROOM = 'Salle de douche';
          const P = 'sensor.foxcat_energy_energie_chauffage_sdb_';
          const E = {
            tot: P + 'energie_aujourdhui',
            sol: P + 'part_solaire_aujourdhui',
            res: P + 'part_reseau_aujourdhui',
            hp:  P + 'consommation_hp_aujourdhui',
            hc:  P + 'consommation_hc_aujourdhui',
            dyn: P + 'consommation_dynamic_aujourdhui'
          };

          const s = states[ID];
          const a = s?.attributes || {};
          const ok = !!s && !['unknown','unavailable'].includes(s.state);
          const mode = ok ? s.state : 'off';
          const raw = (id) => { const e = states[id]; return (!e || ['unknown','unavailable'].includes(e.state)) ? null : e.state; };
          const num = (id) => { const v = parseFloat(raw(id)); return isFinite(v) ? v : null; };
          const on = (id) => raw(id) === 'on';
          const unit = (id) => states[id]?.attributes?.unit_of_measurement || '';
          const f = (v) => { const n = parseFloat(v); return isFinite(n) ? n : null; };
          const cur = f(a.current_temperature), tgt = f(a.temperature), hum = f(a.current_humidity);
          const tmin = f(a.min_temp) ?? 5, tmax = f(a.max_temp) ?? 35;
          const clamp = (x, lo, hi) => Math.min(hi, Math.max(lo, x));
          const dec = (v, d = 1) => v == null ? '—' : Number(v).toFixed(d).replace('.', ',');
          const esc = (t) => String(t ?? '').replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
          const NOW = Date.now() / 1000;
          const ph = (d, o = 0) => `-${((((NOW + o) % d) + d) % d).toFixed(2)}s`;
          const AA = (n, d, tf = 'linear', o = 0, x = 'infinite') => `animation:${n} ${d}s ${tf} ${ph(d, o)} ${x};`;

          /* ── état ──────────────────────────────────────────────── */
          const auto = on(SW);
          const schOn = raw(SCH) !== 'off';
          const nt = states[SCH]?.attributes?.next_trigger;
          const nxt = nt ? new Date(nt).toLocaleTimeString('fr-BE', { hour: '2-digit', minute: '2-digit' }) : null;
          const heating = ok && mode !== 'off' && (a.hvac_action ? a.hvac_action === 'heating' : (cur != null && tgt != null && cur < tgt));
          const HOT = '#fb7185', COOL = '#38bdf8';
          let phase, stCol;
          if (!ok)                 { phase = 'INDISPONIBLE';       stCol = '#64748b'; }
          else if (mode === 'off') { phase = 'ÉTEINT';             stCol = '#64748b'; }
          else if (heating)        { phase = 'EN CHAUFFE';         stCol = HOT; }
          else                     { phase = 'CONSIGNE ATTEINTE';  stCol = COOL; }
          const I = heating ? 1 : (ok && mode !== 'off' ? .25 : 0);
          const pipeCol = heating ? HOT : (ok && mode !== 'off' ? COOL : '#475569');
          const gap = cur != null && tgt != null ? tgt - cur : null;
          const plage = auto ? 'Plage <b>en cours</b>'
            : !schOn ? 'Programme <b>désactivé</b>'
            : nxt ? 'Prochaine plage <b>' + nxt + '</b>'
            : 'Hors <b>plage</b>';

          /* ── énergie du jour ───────────────────────────────────── */
          const tot = num(E.tot), sol = num(E.sol), res = num(E.res);
          const hp = num(E.hp), hc = num(E.hc), dyn = num(E.dyn);
          const uT = unit(E.tot) || 'kWh';
          const sr = (sol ?? 0) + (res ?? 0);
          const solPct = unit(E.sol) === '%' ? sol : (sr > 0 ? (sol ?? 0) / sr * 100 : null);
          const resPct = solPct != null ? 100 - solPct : null;
          const tSum = (hp ?? 0) + (hc ?? 0) + (dyn ?? 0);
          const seg = (v, c) => tSum > 0 && v > 0 ? `<i style="width:${(v / tSum * 100).toFixed(1)}%;background:linear-gradient(90deg,${c}99,${c})"></i>` : '';
          const pctOf = (v) => tSum > 0 && v != null ? Math.round(v / tSum * 100) + ' %' : '—';
          const SUN = '#fbbf24', DYN = '#a78bfa';

          /* ── visuel plancher ───────────────────────────────────── */
          const pipe = 'M14 76 H182 Q190 76 190 84 Q190 92 182 92 H18 Q10 92 10 100 Q10 108 18 108 H186';
          const waves = heating ? [0,1,2,3].map((i) => `<path d="M${40 + i * 40} 46 q6 -7 0 -14 t0 -14" fill="none" stroke="${HOT}" stroke-width="2" stroke-linecap="round" opacity="0" style="${AA('sp-heat', 2.4, 'ease-in-out', i * .6)}"/>`).join('') : '';
          const tiles = Array.from({ length: 6 }, (_, i) => `
            <rect x="${8 + i * 31}" y="52" width="29" height="10" rx="2" fill="url(#sft)" opacity=".85"/>
            <rect x="${8 + i * 31}" y="52" width="29" height="10" rx="2" fill="${HOT}" opacity="${(I * .3).toFixed(2)}" style="${heating ? AA('sp-glow', 2.2, 'ease-in-out', i * .25) : ''}"/>`).join('');

          const R = 52, C = 2 * Math.PI * R, ARC = .75;
          const pc = (v) => clamp((v - tmin) / (tmax - tmin), 0, 1);
          const tgtP = tgt != null ? pc(tgt) : 0, curP = cur != null ? pc(cur) : 0;
          const ang = (pp) => (135 + 270 * pp) * Math.PI / 180;
          const [cx, cy] = [70 + R * Math.cos(ang(curP)), 70 + R * Math.sin(ang(curP))];
          const gCol = heating ? HOT : COOL;

          const kpi = (icon, label, val, u, sub, col = '#e2e8f0') => `
            <div class="k"><div class="kl"><ha-icon icon="${icon}"></ha-icon>${label}</div>
            <div class="kv mono" style="color:${col}">${val}<small>${u}</small></div><div class="ks">${sub}</div></div>`;
          const line = (dot, lbl, v, u, extra = '') => `<div class="line"><span><i class="dot" style="background:${dot}"></i>${lbl}</span><b>${dec(v, 2)} ${u}${extra}</b></div>`;

          return `
          <style>
            .sf{container-type:inline-size;position:relative;padding:20px 8px 4px;font-family:Inter,'Segoe UI',system-ui,sans-serif;color:#e2e8f0}
            .sf *{box-sizing:border-box}
            .sf ha-icon{display:inline-flex}
            .sf .mono{font-family:'JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
            .sf .hd{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
            .sf .lg{position:relative;flex:none;width:46px;height:46px;border-radius:15px;display:grid;place-items:center;overflow:hidden;color:${heating ? HOT : COOL}}
            .sf .lg::before{content:"";position:absolute;inset:-50%;background:conic-gradient(from 0deg,transparent 0 55%,${heating ? HOT : COOL} 80%,#fde68a 88%,transparent 98%);${AA('sp-spin', heating ? 2.6 : 9)}${I > .1 ? '' : ';opacity:.3'}}
            .sf .lg::after{content:"";position:absolute;inset:1.5px;border-radius:13.5px;background:linear-gradient(135deg,#2a121a,#0f172a)}
            .sf .lg ha-icon{position:relative;z-index:1;--mdc-icon-size:25px;${heating ? AA('sp-pulse', 1.6, 'ease-in-out') : ''}}
            .sf .eye{font-size:10.5px;font-weight:800;letter-spacing:.24em;color:${HOT}}
            .sf .h1{margin-top:3px;font-size:24px;font-weight:800;letter-spacing:-.02em;color:#f8fafc}
            .sf .sub{margin-top:2px;font-size:12px;color:#64748b}
            .sf .st{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:999px;font-size:10.5px;font-weight:800;letter-spacing:.1em;color:${stCol};background:${stCol}16;border:1px solid ${stCol}45;white-space:nowrap}
            .sf .st i{position:relative;width:7px;height:7px;border-radius:50%;background:${stCol};box-shadow:0 0 8px ${stCol}}
            .sf .st i::after{content:"";position:absolute;inset:0;border-radius:50%;border:1.5px solid ${stCol};${I > .1 ? AA('sp-ping', heating ? 1.3 : 2.4, 'ease-out') : 'display:none'}}

            .sf .body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:center;margin-top:14px}
            .sf .floor{position:relative;display:flex;justify-content:center;padding:6px 0}
