            return `<div style="display:flex;align-items:center;gap:14px;padding:16px 20px;font-family:Inter,'Segoe UI',system-ui,sans-serif;color:#f8fafc"> <div style="width:46px;height:46px;border-radius:15px;display:grid;place-items:center;color:${col};background:${col}1a;border:1px solid ${col}40;box-shadow:0 0 24px ${col}2a"> <ha-icon icon="${ico}" style="--mdc-icon-size:24px;display:inline-flex"></ha-icon></div> <div style="flex:1;min-width:0"><div style="font-size:11px;font-weight:800;letter-spacing:.2em;color:#19d8ff">GRAPHIQUES TARIFICATION</div> <div style="font-size:21px;font-weight:800;letter-spacing:-.02em">Mode ${sel}</div> <div style="font-size:12px;color:#64748b;margin-top:2px">${txt}</div></div> <div style="flex:none;padding:6px 12px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.08em;color:${col};background:${col}14;border:1px solid ${col}40">${dyn ? 'DYNAMIQUE' : (tou ? 'HP / HC' : 'COMPENSATION')}</div></div>`;
