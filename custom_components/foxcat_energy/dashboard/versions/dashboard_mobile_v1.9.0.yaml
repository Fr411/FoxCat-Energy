  - type: custom:html-template-card
    ignore_line_breaks: true
    content: |
      <style>
        .fc { position:relative; background:radial-gradient(circle at top right, rgba(0,200,255,.08), transparent 60%), #13161d; color:#e8ecf3; border:1px solid #232a38; border-radius:16px; padding:16px; font-family:'DM Mono',monospace; font-size:13px; transition: border-color .6s ease; }
        .fc.alert { border-color:#ff4d5e; animation: glow 1.6s ease-in-out infinite; }
        @keyframes glow { 0%,100% { box-shadow:0 0 6px rgba(255,77,94,.2); } 50% { box-shadow:0 0 22px rgba(255,77,94,.5); } }
        .fc-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
        .fc-title { font-size:13px; letter-spacing:.5px; color:#00c8ff; text-transform:uppercase; }
        .fc-pill { padding:4px 10px; border-radius:999px; font-size:11px; border:1px solid; transition: all .5s ease; }
        .fc-pill.on { color:#ff4d5e; border-color:#ff4d5e; background:rgba(255,77,94,.12); }
        .fc-pill.off { color:#00c8ff; border-color:#00c8ff; background:rgba(0,200,255,.08); }
        .fc-dot { display:inline-block; width:7px; height:7px; border-radius:50%; background:#ff4d5e; margin-right:6px; }
        .fc-dot.blink { animation: blink 1s steps(2, start) infinite; }
        @keyframes blink { to { visibility:hidden; } }
        .fc-main { display:flex; gap:16px; align-items:center; }
        .fc-gauge { position:relative; width:120px; height:120px; flex:0 0 120px; }
        .fc-gauge svg { width:120px; height:120px; }
        .fc-ring { transition: stroke-dasharray 1.2s ease, stroke .6s ease; }
        .fc-gauge-txt { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
        .fc-pct { font-size:22px; }
        .fc-pct small { font-size:11px; color:#7d8799; }
        .fc-sub { font-size:10px; color:#7d8799; text-transform:uppercase; letter-spacing:.6px; }
        .fc-side { flex:1; display:flex; flex-direction:column; gap:10px; min-width:0; }
        .fc-row { display:flex; justify-content:space-between; align-items:baseline; }
        .fc-lbl { font-size:10px; color:#7d8799; text-transform:uppercase; letter-spacing:.6px; }
        .fc-val { font-size:15px; }
        .fc-u { font-size:11px; color:#7d8799; margin-left:3px; }
        .fc-bar { height:6px; background:#232a38; border-radius:4px; overflow:hidden; margin-top:4px; }
        .fc-bar > i { display:block; height:100%; border-radius:4px; transition: width 1.2s ease, background .6s ease; }
        .fc-foot { margin-top:14px; padding-top:10px; border-top:1px solid #232a38; display:flex; justify-content:space-between; font-size:11px; color:#7d8799; }
        .fc-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px; }
        .fc-tile { background:#1a1e28; border-radius:10px; padding:8px 10px; }
      </style>
      {% set _tick = states('sensor.ticker_seconde') %}
      {% set actif = is_state('binary_sensor.foxcat_energy_ems_delestage_haute_consommation_actif', 'on') %}
      {% set inten = states('sensor.foxcat_energy_ems_intensite_reseau') | float(0) %}
      {% set seuil = states('number.foxcat_energy_ems_seuil_haute_consommation') | float(0) %}
      {% set pct = ([ (inten / seuil * 100) if seuil > 0 else 0, 100 ] | min) | round(0) %}
      {% set charge = [ states('sensor.foxcat_energy_ems_charge_du_disjoncteur_principal') | float(0), 100 ] | min %}
      {% set col = '#ff4d5e' if (actif or pct >= 100) else ('#ffb020' if pct >= 80 else '#00c8ff') %}
      {% set circ = 2 * 3.14159 * 52 %}
      {% set ch = 'sensor.foxcat_energy_ems_charge_du_disjoncteur_principal' %}
      {% set ii = 'sensor.foxcat_energy_ems_intensite_reseau' %}
      <div class="fc {{ 'alert' if actif else '' }}">
        <div class="fc-head">
          <span class="fc-title">Délestage haute conso</span>
          <span class="fc-pill {{ 'on' if actif else 'off' }}">
            {% if actif %}<span class="fc-dot blink"></span>{% endif %}{{ 'ACTIF' if actif else 'INACTIF' }}
          </span>
        </div>

        <div class="fc-main">
          <div class="fc-gauge">
            <svg viewBox="0 0 120 120">
              <circle cx="60" cy="60" r="52" fill="none" stroke="#232a38" stroke-width="10"/>
              <circle class="fc-ring" cx="60" cy="60" r="52" fill="none" stroke="{{ col }}" stroke-width="10" stroke-linecap="round"
                stroke-dasharray="{{ (pct * circ / 100) | round(1) }} {{ circ | round(1) }}" transform="rotate(-90 60 60)"/>
            </svg>
            <div class="fc-gauge-txt">
              <div class="fc-pct" style="color:{{ col }}">{{ pct | int }}<small>%</small></div>
              <div class="fc-sub">du seuil</div>
            </div>
          </div>

          <div class="fc-side">
            <div>
              <div class="fc-row">
                <span class="fc-lbl">Intensité réseau</span>
                <span class="fc-val">{{ states(ii) }}<span class="fc-u">{{ state_attr(ii, 'unit_of_measurement') or '' }}</span></span>
              </div>
              <div class="fc-row" style="margin-top:4px">
                <span class="fc-lbl">Seuil</span>
                <span class="fc-val">{{ states('number.foxcat_energy_ems_seuil_haute_consommation') }}<span class="fc-u">{{ state_attr('number.foxcat_energy_ems_seuil_haute_consommation', 'unit_of_measurement') or '' }}</span></span>
              </div>
            </div>
            <div>
              <div class="fc-row">
                <span class="fc-lbl">Charge disjoncteur</span>
                <span class="fc-val">{{ charge | round(0) | int }}<span class="fc-u">%</span></span>
              </div>
              <div class="fc-bar"><i style="width:{{ charge }}%; background:{{ '#ff4d5e' if charge >= 90 else ('#ffb020' if charge >= 70 else '#00c8ff') }}"></i></div>
            </div>
          </div>
        </div>

        <div class="fc-grid">
          <div class="fc-tile">
            <div class="fc-lbl">Décharge batterie</div>
            <div class="fc-val">{{ states('sensor.foxcat_energy_ems_peak_shaving_decharge_batterie_demandee') }}<span class="fc-u">{{ state_attr('sensor.foxcat_energy_ems_peak_shaving_decharge_batterie_demandee', 'unit_of_measurement') or '' }}</span></div>
          </div>
          <div class="fc-tile">
            <div class="fc-lbl">Statut</div>
            <div class="fc-val">{{ states('sensor.foxcat_energy_ems_statut_delestage_haute_consommation') }}</div>
          </div>
          <div class="fc-tile">
            <div class="fc-lbl">Réarmement sous</div>
            <div class="fc-val">{{ states('number.foxcat_energy_ems_seuil_de_rearmement_apres_haute_consommation') }}<span class="fc-u">{{ state_attr('number.foxcat_energy_ems_seuil_de_rearmement_apres_haute_consommation', 'unit_of_measurement') or '' }}</span></div>
          </div>
          <div class="fc-tile">
            <div class="fc-lbl">Temporisation réarm.</div>
            <div class="fc-val">{{ states('number.foxcat_energy_ems_temporisation_de_rearmement_du_delestage') }}<span class="fc-u">{{ state_attr('number.foxcat_energy_ems_temporisation_de_rearmement_du_delestage', 'unit_of_measurement') or '' }}</span></div>
          </div>
        </div>

        <div class="fc-foot">
          <span>Calibre {{ states('number.foxcat_energy_ems_calibre_du_disjoncteur_principal') }}{{ state_attr('number.foxcat_energy_ems_calibre_du_disjoncteur_principal', 'unit_of_measurement') or '' }}</span>
          <span>Dernier changement : {{ relative_time(states.binary_sensor.foxcat_energy_ems_delestage_haute_consommation_actif.last_changed) }}</span>
        </div>
      </div>
  theme: ios-dark-mode-blue-red
