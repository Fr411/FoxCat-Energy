      custom_fields:
        content: |
          [[[
            /* Vérifie les entités : le sèche-linge pointait sur l'entité du lave-linge dans l'ancienne vue. */
            const items=[
              {name:'Lave-linge',   icon:'mdi:washing-machine', color:'#19d8ff', id:'sensor.foxcat_energy_machines_day_ahead_lave_linge'},
              {name:'Sèche-linge',  icon:'mdi:tumble-dryer',    color:'#a78bfa', id:'sensor.foxcat_energy_machines_day_ahead_seche_linge'},
              {name:'Lave-vaisselle',icon:'mdi:dishwasher',     color:'#35e59d', id:'sensor.foxcat_energy_machines_day_ahead_lave_vaisselle'}
            ];
            const bad=['unknown','unavailable','none',''];
            const skip=['friendly_name','icon','device_class','unit_of_measurement','state_class','attribution','supported_features','entity_picture','restored'];
            const nice=k=>k.replace(/_/g,' ').replace(/^./,c=>c.toUpperCase());
            const val=v=>{
              if(v===null||v===undefined)return '—';
              if(typeof v==='boolean')return v?'Oui':'Non';
              if(typeof v==='object'){const raw=v.start||v.debut||v.time;if(raw){const d=new Date(raw);if(!Number.isNaN(d.getTime()))return d.toLocaleTimeString('fr-BE',{hour:'2-digit',minute:'2-digit'});}return '…';}
              const s=String(v);
              if(/^\d{4}-\d{2}-\d{2}T/.test(s)){const d=new Date(s);if(!Number.isNaN(d.getTime()))return d.toLocaleTimeString('fr-BE',{hour:'2-digit',minute:'2-digit'});}
              return s.length>28?s.slice(0,27)+'…':s;
            };

            const cards=items.map(it=>{
              const s=states[it.id];
              const ok=!!s&&!bad.includes(String(s.state));
              const state=ok?String(s.state):'—';
              const attrs=ok?Object.entries(s.attributes||{}).filter(([k,v])=>!skip.includes(k)&&v!==null&&v!==''&&typeof v!=='object').slice(0,3):[];
              return `<div class="m" style="--c:${it.color}">
                <div class="m-ico"><ha-icon icon="${it.icon}"></ha-icon></div>
                <div class="m-body">
                  <div class="m-name">${it.name}</div>
                  <div class="m-state ${ok?'':'off'}">${state}</div>
                  ${attrs.length?`<div class="m-attrs">${attrs.map(([k,v])=>`<span>${nice(k)} <b>${val(v)}</b></span>`).join('')}</div>`:''}
                </div>
                <div class="m-dot ${ok?'on':''}"></div>
              </div>`;
            }).join('');

            return `<div class="wrap">
              <div class="eyebrow">FENÊTRES OPTIMALES</div>
              <div class="title">Plages utilisateur souveraines</div>
              <div class="list">${cards}</div>
            </div>`;
          ]]]
