                  <div class="sb">${tSum > 0 ? TB.filter((t) => t[1] > 0).map((t) => `<i style="width:${t[1] / tSum * 100}%;background:${t[2]}"></i>`).join('') : ''}</div>
                  <div class="tc">${TB.map((t) => `<span style="--c:${t[2]}"><ha-icon icon="${t[3]}"></ha-icon>${t[0]} <b class="mono">${kwh(t[1])}</b></span>`).join('')}</div>
                </div>
