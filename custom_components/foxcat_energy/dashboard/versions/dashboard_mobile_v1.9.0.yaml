                legacy_energie: 'sensor.foxcat_energy_energie_seche_linge_energie_aujourdhui',
                legacy_energie_2: 'sensor.foxcat_energy_energie_seche_linge_energie_aujourdhui',
                legacy_cout: 'sensor.foxcat_energy_tarification_seche_linge_cout_aujourdhui',
                legacy_cout_2: 'sensor.foxcat_energy_tarification_seche_linge_cout_aujourdhui',
                legacy_hc: '[[foxcat:legacy.sensor_seche_linge_puissance_hc_energy]]',
                legacy_hc_2: 'sensor.foxcat_energy_energie_seche_linge_consommation_hc_aujourdhui',
                legacy_hp: '[[foxcat:legacy.sensor_seche_linge_puissance_hp_energy]]',
