                    - border: none
                    - transition: background .3s
                    - background: '[[[ return [''off'',''arret''].includes(String(states[''sensor.foxcat_energy_fonctions_utilisateur_lave_vaisselle_commande_utilisateur'']?.state).toLowerCase()) ? ''linear-gradient(180deg, color-mix(in srgb, #fb7185 34%, transparent), color-mix(in srgb, #fb7185 12%, transparent))'' : ''transparent'' ]]]'
                    - box-shadow: none
                    - animation: '[[[ return [''off'',''arret''].includes(String(states[''sensor.foxcat_energy_fonctions_utilisateur_lave_vaisselle_commande_utilisateur'']?.state).toLowerCase()) ? ''segOn 2.4s ease-in-out infinite'' : ''none'' ]]]'
                    icon:
                    - width: 19px
                    - color: '[[[ return [''off'',''arret''].includes(String(states[''sensor.foxcat_energy_fonctions_utilisateur_lave_vaisselle_commande_utilisateur'']?.state).toLowerCase()) ? ''#fb7185'' : ''rgba(148,163,184,.5)'' ]]]'
                    name:
                    - margin-top: 3px
                    - font-size: 10.5px
                    - font-weight: '800'
                    - letter-spacing: .08em
                    - text-transform: uppercase
                    - color: '[[[ return [''off'',''arret''].includes(String(states[''sensor.foxcat_energy_fonctions_utilisateur_lave_vaisselle_commande_utilisateur'']?.state).toLowerCase()) ? ''#fb7185'' : ''rgba(148,163,184,.7)'' ]]]'
  - type: custom:button-card
    show_name: false
    show_icon: false
    show_state: false
    variables:
      zone: |-
        [[[
          return (ID, NAME, ICON) => {
            /* ── Configuration (garder cohérent avec le head) ── */
            const POWER = { etage: '[[foxcat:legacy.sensor_homefoxcat_load_autre]]', rez: 'sensor.homefoxcat_load_toshiba_rez' };
            const GRP = {
              etage: ['[[foxcat:legacy.climate_chambre_parentale]]', '[[foxcat:legacy.climate_chambre_natheo_2]]', '[[foxcat:legacy.climate_salle_de_bain_2]]'],
              rez: ['climate.salon_salle_a_manger']
            };
            const IUM = 'Haori B10', IUC = '2,5', IUH = '3,2', IUMAX = 1230;

            const BAD = ['', 'unknown', 'unavailable'];
            const RUN = ['heating', 'cooling', 'drying', 'preheating', 'defrosting'];
            const fnum = (v) => { const x = parseFloat(v); return isFinite(x) ? x : null; };
            const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
            const esc = (t) => String(t ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
            const dec = (v, d = 1) => v == null ? '—' : v.toFixed(d).replace('.', ',');
            const NOW = Date.now() / 1000;
            const ph = (d, o = 0) => `-${((((NOW + o) % d) + d) % d).toFixed(2)}s`;
            const AA = (n, d, tf = 'linear', o = 0) => `animation:${n} ${d}s ${tf} ${ph(d, o)} infinite;`;
            const MODE = {
              heat: ['Chauffage', '#fb923c', 'mdi:fire'], cool: ['Clim', '#38bdf8', 'mdi:snowflake'],
              heat_cool: ['Auto', '#a78bfa', 'mdi:sun-snowflake-variant'], auto: ['Auto', '#a78bfa', 'mdi:sun-snowflake-variant'],
              dry: ['Déshumid.', '#2dd4bf', 'mdi:water-percent'], fan_only: ['Ventilation', '#94a3b8', 'mdi:fan'],
              off: ['Arrêt', '#475569', 'mdi:power']
            };
            const ACT = {
              heating: ['Chauffe', '#fb923c'], cooling: ['Refroidit', '#38bdf8'], drying: ['Déshumidifie', '#2dd4bf'],
              fan: ['Ventile', '#94a3b8'], idle: ['Au repos', '#64748b'], off: ['Éteint', '#475569'],
              preheating: ['Préchauffe', '#fb923c'], defrosting: ['Dégivrage', '#e0f2fe']
            };
            const isRun = (id) => {
              const z = states[id];
              if (!z || BAD.includes(z.state)) return false;
              const ac = z.attributes?.hvac_action;
              return ac ? RUN.includes(ac) : !['off', 'fan_only'].includes(z.state);
            };

            const s = states[ID];
            const ok = !!s && !BAD.includes(s.state);
            const at = ok ? (s.attributes || {}) : {};
            const mode = ok ? s.state : 'off';
            const m = ok ? (MODE[mode] || [mode, '#94a3b8', 'mdi:thermostat']) : ['Indisponible', '#475569', 'mdi:lan-disconnect'];
            const act = ok ? (at.hvac_action || (mode === 'off' ? 'off' : null)) : null;
            const on = ok && mode !== 'off';
            const running = isRun(ID);
            const cur = fnum(at.current_temperature), hum = fnum(at.current_humidity);
            const lo = fnum(at.target_temp_low), hi = fnum(at.target_temp_high), t1 = fnum(at.temperature);
            const tgt = t1 ?? (lo != null && hi != null ? (lo + hi) / 2 : null);
            const tgtTxt = t1 != null ? dec(t1) + '°' : (lo != null && hi != null ? dec(lo, 0) + '–' + dec(hi, 0) + '°' : '—');
            const fan = at.fan_mode ?? null;
            const col = m[1];
            const a = act ? (ACT[act] || [act, '#94a3b8']) : [m[0], on ? col : '#475569'];
            const diff = cur != null && tgt != null ? cur - tgt : null;
            const pos = (v) => clamp((v - 14) / 16 * 100, 0, 100);
            const flowCol = running ? col : 'rgba(148,163,184,.4)';
            const fl = running || mode === 'fan_only';
            const sp = { low: 1.6, quiet: 1.8, medium: 1.1, mid: 1.1, high: .7, auto: 1.1 }[String(fan).toLowerCase()] || 1.2;

            /* ── Puissance de la pièce ── */
            const gk = GRP.rez.includes(ID) ? 'rez' : 'etage';
            const gw = fnum(states[POWER[gk]]?.state);
            const solo = GRP[gk].length === 1;
            const nR = GRP[gk].filter(isRun).length;
            const zw = solo ? gw : (!running ? 0 : gw == null ? null : nR ? (gw > 20 ? gw / nR : 0) : 0);
            const zp = zw != null ? clamp(zw / IUMAX, 0, 1) : 0;
            const zwTxt = zw == null ? '—' : zw >= 1000 ? (zw / 1000).toFixed(2).replace('.', ',') + ' kW' : Math.round(zw) + ' W';
            const zSrc = solo ? 'mesuré' : 'réparti';
            const zOn = zw != null && zw > 20;

            return `
            <style>
              .zn{position:relative;overflow:hidden;height:100%;padding:14px;border-radius:20px;font-family:Inter,'Segoe UI',system-ui,sans-serif;color:#e2e8f0;cursor:pointer;box-sizing:border-box;
                  background:${running ? `radial-gradient(120% 90% at 0% 0%,${col}24,transparent 60%),rgba(255,255,255,.03)` : 'rgba(255,255,255,.025)'};
                  border:1px solid ${running ? col + '60' : 'rgba(255,255,255,.07)'};transition:transform .2s,border-color .3s;${running ? AA('zn-glow', 3, 'ease-in-out') : ''}}
              .zn:hover{transform:translateY(-2px)}
              .zn *{box-sizing:border-box}
              .zn ha-icon{display:inline-flex}
              .zn .mono{font-family:'JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
              .zn .t{display:flex;align-items:center;justify-content:space-between;gap:8px}
              .zn .nm{display:flex;align-items:center;gap:8px;min-width:0}
              .zn .nm ha-icon{--mdc-icon-size:18px;color:#94a3b8}
              .zn .nm b{font-size:14px;font-weight:800;color:#f8fafc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
              .zn .sm{margin-top:3px;font-size:10.5px;color:#64748b}
              .zn .md{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:999px;font-size:10px;font-weight:800;letter-spacing:.06em;color:${col};background:${col}1c;border:1px solid ${col}45;white-space:nowrap}
              .zn .md ha-icon{--mdc-icon-size:13px;${running ? (mode === 'heat' ? AA('zn-flick', 1.3, 'ease-in-out') : mode === 'cool' ? AA('zn-spin', 6) : '') : ''}}
              .zn .ac{position:relative;margin-top:10px;height:34px;border-radius:10px 10px 14px 14px;background:linear-gradient(180deg,#e5e9f0,#c4ccd8);box-shadow:inset 0 -3px 0 rgba(0,0,0,.12),0 4px 10px rgba(0,0,0,.3);${on ? '' : 'filter:brightness(.5)'}}
              .zn .ac::before{content:"";position:absolute;left:10%;right:10%;bottom:6px;height:3px;border-radius:2px;background:rgba(0,0,0,.25)}
              .zn .ac .l{position:absolute;right:10px;top:8px;width:5px;height:5px;border-radius:50%;background:${on ? col : '#64748b'};box-shadow:${on ? '0 0 6px ' + col : 'none'}}
              .zn .ac .d{position:absolute;left:10px;top:7px;font-size:10px;font-weight:700;color:#0f172a}
              .zn .air{position:relative;height:30px;overflow:hidden;margin:0 8%}
              .zn .air i{position:absolute;top:0;width:2px;height:16px;border-radius:2px;background:linear-gradient(180deg,${flowCol},transparent);opacity:0}
              .zn .v{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:2px}
              .zn .cur{font-size:30px;font-weight:700;line-height:1;color:#f8fafc}
              .zn .cur small{font-size:14px;color:#64748b;margin-left:2px}
              .zn .tg{text-align:right;font-size:10px;font-weight:800;letter-spacing:.1em;color:#64748b}
              .zn .tg b{display:block;margin-top:1px;font-size:16px;letter-spacing:-.02em;color:${col}}
              .zn .bar{position:relative;height:6px;margin-top:10px;border-radius:6px;background:linear-gradient(90deg,#38bdf8,#22d3ee 30%,#34d399 50%,#fbbf24 70%,#fb7185)}
              .zn .bar .c{position:absolute;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px #0b1220,0 0 8px #fff}
              .zn .bar .g{position:absolute;top:-4px;width:2px;height:14px;margin-left:-1px;border-radius:2px;background:${col};box-shadow:0 0 6px ${col}}
              .zn .pw{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:11px;color:#64748b}
              .zn .pw span{display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
              .zn .pw ha-icon{--mdc-icon-size:13px;color:${zOn ? col : '#475569'}}
              .zn .pw b{color:${zOn ? '#e2e8f0' : '#64748b'}}
              .zn .pw em{font-style:normal;font-size:9.5px;opacity:.7}
              .zn .pb{flex:1;height:4px;border-radius:4px;background:rgba(255,255,255,.07);overflow:hidden}
              .zn .pb i{display:block;height:100%;background:${col};box-shadow:0 0 6px ${col};transition:width .6s}
              .zn .ft{display:flex;justify-content:space-between;gap:8px;margin-top:8px;font-size:11px;color:#64748b}
              .zn .ft b{color:${a[1]}}
              .zn .ft span:last-child{white-space:nowrap}
              @media (prefers-reduced-motion:reduce){.zn,.zn *{animation:none!important}}
              @keyframes zn-glow{0%,100%{box-shadow:0 0 0 0 ${col}00}50%{box-shadow:0 0 22px 0 ${col}38}}
              @keyframes zn-flick{0%,100%{transform:scale(1);opacity:1}40%{transform:scale(.9);opacity:.75}70%{transform:scale(1.1)}}
              @keyframes zn-spin{to{transform:rotate(360deg)}}
              @keyframes zn-air{0%{transform:translateY(-6px);opacity:0}25%{opacity:.9}100%{transform:translateY(24px);opacity:0}}
            </style>
            <div class="zn">
              <div class="t">
                <div class="nm"><ha-icon icon="${ICON}"></ha-icon><b>${esc(NAME)}</b></div>
                <span class="md"><ha-icon icon="${m[2]}"></ha-icon>${esc(m[0])}</span>
              </div>
              <div class="sm">${IUM} · ${IUC} / ${IUH} kW</div>
              <div class="ac"><span class="d mono">${on && tgt != null ? dec(tgt) + '°' : ''}</span><span class="l"></span></div>
              <div class="air">${fl ? Array.from({ length: 9 }, (_, k) => `<i style="left:${6 + k * 11}%;${AA('zn-air', +(sp + (k % 3) * .25).toFixed(2), 'ease-in', k * .17)}"></i>`).join('') : ''}</div>
              <div class="v">
                <div class="cur mono">${dec(cur)}<small>°C</small></div>
                <div class="tg">CONSIGNE<b class="mono">${on ? tgtTxt : '—'}</b></div>
              </div>
              <div class="bar">
                ${tgt != null && on ? `<span class="g" style="left:${pos(tgt)}%"></span>` : ''}
                ${cur != null ? `<span class="c" style="left:${pos(cur)}%"></span>` : ''}
              </div>
              <div class="pw">
                <span><ha-icon icon="mdi:lightning-bolt"></ha-icon>${solo ? '' : '≈ '}<b class="mono">${zwTxt}</b>&nbsp;<em>${zSrc}</em></span>
                <div class="pb"><i style="width:${zp * 100}%"></i></div>
              </div>
              <div class="ft">
                <span><b>${esc(a[0])}</b>${diff != null && on ? ` · ${diff > 0 ? '+' : ''}${dec(diff)}°` : ''}</span>
                <span>${hum != null ? `<ha-icon icon="mdi:water-percent" style="--mdc-icon-size:13px;vertical-align:-2px"></ha-icon> ${Math.round(hum)} %` : ''}${fan ? ` · <ha-icon icon="mdi:fan" style="--mdc-icon-size:13px;vertical-align:-2px"></ha-icon> ${esc(fan)}` : ''}</span>
              </div>
            </div>`;
          };
        ]]]
    triggers_update:
    - [[foxcat:legacy.sensor_homefoxcat_load_autre]]
    - sensor.homefoxcat_load_toshiba_rez
    - sensor.foxcat_energy_tarification_toshiba_cout_aujourdhui
    - sensor.foxcat_energy_tarification_toshiba_tarif_actuel
    - sensor.temperature_exterieure
    - sensor.foxcat_energy_energie_toshiba_etage_energie_aujourdhui
    - sensor.foxcat_energy_energie_toshiba_etage_part_solaire_aujourdhui
    - sensor.foxcat_energy_energie_toshiba_etage_part_reseau_aujourdhui
    - sensor.foxcat_energy_energie_toshiba_etage_consommation_hp_aujourdhui
    - sensor.foxcat_energy_energie_toshiba_etage_consommation_hc_aujourdhui
    - sensor.foxcat_energy_energie_toshiba_etage_consommation_dynamic_aujourdhui
    - sensor.foxcat_energy_energie_toshiba_rez_energie_aujourdhui
    - sensor.foxcat_energy_energie_toshiba_rez_part_solaire_aujourdhui
    - sensor.foxcat_energy_energie_toshiba_rez_part_reseau_aujourdhui
    - sensor.foxcat_energy_energie_toshiba_rez_consommation_hp_aujourdhui
    - sensor.foxcat_energy_energie_toshiba_rez_consommation_hc_aujourdhui
    - sensor.foxcat_energy_energie_toshiba_rez_consommation_dynamic_aujourdhui
    - [[foxcat:legacy.climate_chambre_parentale]]
    - [[foxcat:legacy.climate_chambre_natheo_2]]
    - [[foxcat:legacy.climate_salle_de_bain_2]]
    - climate.salon_salle_a_manger
    tap_action:
      action: more-info
      entity: [[foxcat:legacy.sensor_homefoxcat_load_autre]]
    extra_styles: |
      @container (max-width: 700px) {
        #container { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; grid-template-areas: "head head" "z1 z2" "z3 z4" !important; }
      }
      @container (max-width: 380px) {
        #container { grid-template-columns: 1fr !important; grid-template-areas: "head" "z1" "z2" "z3" "z4" !important; }
      }
    styles:
      card:
      - container-type: inline-size
      - padding: 0 14px 14px
      - border-radius: 28px
      - overflow: hidden
      - border: 1px solid rgba(255,255,255,.09)
      - box-shadow: 0 24px 60px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.06)
      - background: 'radial-gradient(110% 70% at 0% 0%, rgba(56,189,248,.12), transparent 55%), radial-gradient(100% 70% at 100% 100%, rgba(251,146,60,.09), transparent 55%), #060a13'
      grid:
      - grid-template-areas: '"head head head head" "z1 z2 z3 z4"'
      - grid-template-columns: repeat(4, minmax(0, 1fr))
      - gap: 10px
      - align-items: stretch
      custom_fields:
        head:
        - width: 100%
        z1:
        - height: 100%
        - min-width: 0
        z2:
        - height: 100%
        - min-width: 0
        z3:
        - height: 100%
        - min-width: 0
        z4:
        - height: 100%
        - min-width: 0
    custom_fields:
      head: |-
        [[[
          /* ── Configuration matériel ── */
          const OU = { model: 'RAS-3M18G3AVG-E', ports: 3, heat: 6.8, cool: 5.2, heatR: '1,9–8,3', coolR: '2,0–7,5' };
          const IU = { model: 'Haori B10', heat: 3.2, cool: 2.5 };
          const SHORT = 400;   /* W : groupe en demande sous ce seuil → basse charge */

          /* ── Capteurs dédiés par groupe extérieur ── */
          const POWER = { etage: '[[foxcat:legacy.sensor_homefoxcat_load_autre]]', rez: 'sensor.homefoxcat_load_toshiba_rez' };
          const EP = 'sensor.foxcat_energy_energie_toshiba_';   /* + etage_ / rez_ + suffixe */

          const G = [
            { name: 'Groupe 1', sub: 'Étage', key: 'etage', maxW: 2500, zones: [
              { e: '[[foxcat:legacy.climate_chambre_parentale]]', s: 'Parents' },
              { e: '[[foxcat:legacy.climate_chambre_natheo_2]]', s: 'Nathéo' },
              { e: '[[foxcat:legacy.climate_salle_de_bain_2]]', s: 'SdB' } ] },
            { name: 'Groupe 2', sub: 'Rez-de-chaussée', key: 'rez', maxW: 1500, zones: [
              { e: 'climate.salon_salle_a_manger', s: 'Salon' } ] }
          ];
          const COST = 'sensor.foxcat_energy_tarification_toshiba_cout_aujourdhui';
          const TARIF = 'sensor.foxcat_energy_tarification_toshiba_tarif_actuel';
          const TEXT = 'sensor.temperature_exterieure';
          const MAXW = G.reduce((s, g) => s + g.maxW, 0);
          const GCOL = { etage: '#818cf8', rez: '#2dd4bf' };

          /* ── Outils ── */
          const BAD = ['', 'unknown', 'unavailable'];
          const num = (id) => { const v = parseFloat(states[id]?.state); return isFinite(v) ? v : null; };
          const kv = (id) => { const v = num(id); if (v == null) return null; return states[id]?.attributes?.unit_of_measurement === 'Wh' ? v / 1000 : v; };
          const add = (...v) => v.every((x) => x == null) ? null : v.reduce((s, x) => s + (x ?? 0), 0);
          const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
          const esc = (t) => String(t ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
          const dec = (v, d = 1) => v == null ? '—' : v.toFixed(d).replace('.', ',');
          const kwh = (v) => v == null ? '—' : v.toFixed(v < 10 ? 2 : 1).replace('.', ',');
          const eur = (v) => v == null ? '—' : v.toFixed(2).replace('.', ',') + ' €';
          const fmtW = (v) => v == null ? ['—', ''] : v >= 1000 ? [(v / 1000).toFixed(2).replace('.', ','), 'kW'] : [String(Math.round(v)), 'W'];
          const NOW = Date.now() / 1000;
          const ph = (d, o = 0) => `-${((((NOW + o) % d) + d) % d).toFixed(2)}s`;
          const AA = (n, d, tf = 'linear', o = 0) => `animation:${n} ${d}s ${tf} ${ph(d, o)} infinite;`;

          /* mode HVAC → [couleur, icône] */
          const MC = {
            heat: ['#fb923c', 'mdi:fire'], cool: ['#38bdf8', 'mdi:snowflake'],
            heat_cool: ['#a78bfa', 'mdi:sun-snowflake-variant'], auto: ['#a78bfa', 'mdi:sun-snowflake-variant'],
            dry: ['#2dd4bf', 'mdi:water-percent'], fan_only: ['#94a3b8', 'mdi:fan'], off: ['#475569', 'mdi:power']
          };
          const zinfo = (id) => {
            const s = states[id];
            if (!s || BAD.includes(s.state)) return { mode: 'off', act: null, on: false, running: false, c: ['#475569', 'mdi:lan-disconnect'] };
            const mode = s.state, act = s.attributes?.hvac_action ?? null;
            const running = act ? ['heating', 'cooling', 'drying', 'preheating', 'defrosting'].includes(act) : !['off', 'fan_only'].includes(mode);
            return { mode, act, on: mode !== 'off', running, c: MC[mode] || ['#94a3b8', 'mdi:thermostat'] };
          };

          /* ── Puissance ── */
          const PW = { etage: num(POWER.etage), rez: num(POWER.rez) };
          const w = add(PW.etage, PW.rez);
          const cost = num(COST), tarif = num(TARIF), text = num(TEXT);
          const live = w != null && w > 40;
          const pct = w != null ? clamp(w / MAXW, 0, 1) : 0;
          const [wv, wu] = fmtW(w);

          /* ── Énergie du jour par groupe ── */
          const eg = (k) => ({
            tot: kv(`${EP}${k}_energie_aujourdhui`), sol: kv(`${EP}${k}_part_solaire_aujourdhui`), grid: kv(`${EP}${k}_part_reseau_aujourdhui`),
            hp: kv(`${EP}${k}_consommation_hp_aujourdhui`), hc: kv(`${EP}${k}_consommation_hc_aujourdhui`), dyn: kv(`${EP}${k}_consommation_dynamic_aujourdhui`)
          });
          const E = { etage: eg('etage'), rez: eg('rez') };
          const ET = Object.fromEntries(['tot', 'sol', 'grid', 'hp', 'hc', 'dyn'].map((f) => [f, add(E.etage[f], E.rez[f])]));
          const srcSum = (ET.sol ?? 0) + (ET.grid ?? 0);
          const solPct = srcSum > 0 ? (ET.sol ?? 0) / srcSum : 0;
          const solP = Math.round(solPct * 100);
          const costKwh = cost != null && ET.tot > 0 ? cost / ET.tot : null;
          const TB = [['HP', ET.hp, '#fb7185', 'mdi:weather-sunny'], ['HC', ET.hc, '#34d399', 'mdi:weather-night'], ['Dynamique', ET.dyn, '#a78bfa', 'mdi:chart-timeline-variant']].filter((t) => t[1] != null);
          const tSum = TB.reduce((s, t) => s + t[1], 0);
          const gSum = (E.etage.tot ?? 0) + (E.rez.tot ?? 0);
          const gEt = gSum > 0 ? (E.etage.tot ?? 0) / gSum : 0;
          const gEtP = Math.round(gEt * 100);

          /* ── Groupes extérieurs ── */
          const GS = G.map((g) => {
            const zs = g.zones.map((z) => zinfo(z.e));
            const run = zs.filter((z) => z.running).length, on = zs.filter((z) => z.on).length;
            const heat = zs.some((z) => z.running && (['heating', 'preheating'].includes(z.act) || (!z.act && z.mode === 'heat')));
            const cool = zs.some((z) => z.running && (z.act === 'cooling' || (!z.act && z.mode === 'cool')));
            const defrost = zs.some((z) => z.act === 'defrosting');
            const sat = (heat && run * IU.heat > OU.heat) || (cool && run * IU.cool > OU.cool);
            const gw = PW[g.key];
            const active = gw != null && gw > 40;
            const short = gw != null && run > 0 && !defrost && gw < SHORT;
            const col = defrost ? '#e0f2fe' : heat && cool ? '#f43f5e' : heat ? '#fb923c' : cool ? '#38bdf8' : on ? '#94a3b8' : '#475569';
            const lbl = defrost ? 'DÉGIVRAGE' : heat && cool ? 'CONFLIT MODE' : heat ? 'CHAUFFE' : cool ? 'REFROIDIT' : on ? 'EN VEILLE' : 'ARRÊT';
            return { ...g, zs, run, on, heat, cool, defrost, sat, w: gw, active, short, col, lbl, e: E[g.key] };
          });
          const nRun = GS.reduce((s, g) => s + g.run, 0);

          /* ── Rendu d'un groupe extérieur ── */
          const unit = (g, i) => {
            const gp = g.w != null ? clamp(g.w / g.maxW, 0, 1) : 0;
            const sp = +clamp(2.2 - 1.8 * gp, .35, 2.2).toFixed(2);
            const fc = g.active ? g.col : '#334155';
            const blades = [0, 72, 144, 216, 288].map((r) => `<path d="M50 50 C 47 38, 52 28, 60 27 C 62 36, 57 44, 50 50 Z" fill="${fc}" opacity="${g.active ? .85 : .6}" transform="rotate(${r} 50 50)"/>`).join('');
            const grill = [0, 1, 2, 3].map((k) => `<line x1="6" x2="94" y1="${20 + k * 20}" y2="${20 + k * 20}"/><line y1="6" y2="94" x1="${20 + k * 20}" x2="${20 + k * 20}"/>`).join('');
            const out = g.active ? Array.from({ length: 5 }, (_, k) => `<span class="pf" style="top:${18 + k * 15}%;${AA('cl-out', 1.6 + (k % 3) * .3, 'ease-out', k * .37 + i)}"></span>`).join('') : '';
            const ports = Array.from({ length: OU.ports }, (_, k) => { const z = g.zs[k]; return `<i class="${z ? (z.running ? 'r' : 'u') : ''}" style="--pc:${z ? z.c[0] : '#334155'}"></i>`; }).join('');
            const [gv, gu] = fmtW(g.w);
            const n = g.zones.length;
            const ratio = Math.round(n * IU.heat / OU.heat * 100);
            const tags = [
              g.sat ? '<span class="tg2 sat"><ha-icon icon="mdi:gauge-full"></ha-icon>SATURÉ</span>' : '',
              g.short ? '<span class="tg2 low"><ha-icon icon="mdi:sine-wave"></ha-icon>BASSE CHARGE</span>' : ''
            ].join('');
            /* bilan du jour du groupe */
            const e = g.e;
            const eSrc = (e.sol ?? 0) + (e.grid ?? 0);
            const eSp = eSrc > 0 ? (e.sol ?? 0) / eSrc : 0;
            const eCost = costKwh != null && e.tot != null ? e.tot * costKwh : null;
            return `
            <div class="ou ${g.active ? 'on' : ''}" style="--c:${g.col};--gc:${GCOL[g.key]}">
              <div class="ou-h">
                <div><div class="ou-n"><i class="gdot"></i>${esc(g.name)}</div><div class="ou-s">${esc(g.sub)} · <span class="mono">${OU.model}</span></div></div>
                <span class="st"><i></i>${g.lbl}</span>
              </div>
              ${tags ? `<div class="tags">${tags}</div>` : ''}
              <div class="box">
                <div class="fan">
                  <svg viewBox="0 0 100 100">
                    <circle cx="50" cy="50" r="44" fill="#050a14" stroke="rgba(255,255,255,.1)" stroke-width="2"/>
                    <g style="transform-origin:50px 50px;${g.active ? AA('cl-spin', sp) : ''}">${blades}</g>
                    <circle cx="50" cy="50" r="7" fill="#1e293b" stroke="${fc}" stroke-width="2"/>
                    <g stroke="rgba(148,163,184,.25)" stroke-width="1.2">${grill}</g>
                  </svg>
                </div>
                <div class="side"><span class="led"></span><div class="pipes"><i></i><i></i></div></div>
                <div class="flowout">${out}</div>
              </div>
              <div class="ou-m">
                <div><span>PUISS. MESURÉE</span><b class="mono">${gv}<small>${gu}</small></b></div>
                <div class="pt"><span>PORTS ${n}/${OU.ports}</span><div class="pd">${ports}</div></div>
              </div>
              <div class="gb"><i style="width:${gp * 100}%"></i></div>
              <div class="ge">
                <div><span>AUJOURD'HUI</span><b class="mono">${kwh(e.tot)}<small>kWh</small></b></div>
                <div class="ge-r">
                  <span class="ec mono">${eCost != null ? '≈ ' + eur(eCost) : ''}</span>
                  <div class="ge-s" style="${eSrc > 0 ? '' : 'background:rgba(255,255,255,.07)'}"><i style="width:${eSp * 100}%"></i></div>
                  <em class="mono"><ha-icon icon="mdi:solar-power-variant"></ha-icon>${eSrc > 0 ? Math.round(eSp * 100) + ' % solaire' : '—'}</em>
                </div>
              </div>
              <div class="cap">
                <span class="${g.heat ? 'hh' : ''}"><ha-icon icon="mdi:fire"></ha-icon>${dec(OU.heat)} kW <em>${OU.heatR}</em></span>
                <span class="${g.cool ? 'hc' : ''}"><ha-icon icon="mdi:snowflake"></ha-icon>${dec(OU.cool)} kW <em>${OU.coolR}</em></span>
              </div>
              <div class="rc">${n} × ${IU.model} · <b class="mono">${dec(n * IU.heat)} kW</b> raccordés en chaud (<b class="mono">${ratio} %</b>)</div>
              <div class="ou-z">${g.zs.map((z, k) => `<span class="zc ${z.running ? 'r' : ''}" style="--zc:${z.c[0]}"><ha-icon icon="${z.c[1]}"></ha-icon>${esc(g.zones[k].s)}</span>`).join('')}</div>
            </div>`;
          };

          const N = 24, lit = Math.round(pct * N);
          const led = Array.from({ length: N }, (_, k) => k < lit ? `<i class="on" style="--k:${k / N};${live ? AA('cl-led', 1.4, 'ease-in-out', k * .06) : ''}"></i>` : '<i></i>').join('');
          const [ev, eu] = fmtW(PW.etage), [rv, ru] = fmtW(PW.rez);

          return `
