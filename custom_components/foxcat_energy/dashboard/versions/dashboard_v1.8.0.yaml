        custom_fields:
          content: |
            [[[
              /* ==========================================================
                 FOXCAT ENERGY V1.5.0
                 CONSOMMATION APPAREILS — COMPTABILITÉ NATIVE FOXCAT

                 Priorité : entités natives FoxCat Energy V1.5.0
                 Fallback : anciens capteurs uniquement si nécessaire.
                 Une carte n'est affichée que si sa gestion FoxCat est active.
                 ========================================================== */


              /* ==========================================================
                 OUTILS
                 ========================================================== */

              const norm = (value) =>
                String(value ?? '')
                  .normalize('NFD')
                  .replace(/[\u0300-\u036f]/g, '')
                  .toLowerCase()
                  .replace(/[^a-z0-9]+/g, ' ')
                  .trim();


              const validState = (id) => {

                const s =
                  id
                    ? states[id]
                    : null;

                return (
                  !!s &&
                  ![
                    'unknown',
                    'unavailable',
                    'none',
                    ''
                  ].includes(
                    String(s.state)
                  )
                );
              };


              const stateOf = (
                id,
                fallback = '—'
              ) =>
                validState(id)
                  ? states[id].state
                  : fallback;


              const numberOf = (
                id,
                fallback = 0
              ) => {

                if (!validState(id)) {
                  return fallback;
                }

                const v =
                  Number.parseFloat(
                    states[id].state
                  );

                return Number.isFinite(v)
                  ? v
                  : fallback;
              };


              const isOn = (id) =>
                !!id &&
                states[id]?.state === 'on';


              const clamp = (
                v,
                min,
                max
              ) =>
                Math.min(
                  Math.max(
                    Number(v) || 0,
                    min
                  ),
                  max
                );


              const fmtEnergy = (v) =>
                `${Math.max(
                  0,
                  Number(v) || 0
                ).toFixed(2)} kWh`;


              const fmtEuro = (v) =>
                `${Number(
                  v || 0
                ).toFixed(2)} €`;


              const fmtPrice = (v) =>
                Number.isFinite(
                  Number(v)
                )
                  ? `${Number(v).toFixed(4)} €/kWh`
                  : '—';


              const fmtPower = (v) => {

                const x =
                  Math.max(
                    0,
                    Number(v) || 0
                  );

                return x >= 1000
                  ? `${(x / 1000).toFixed(2)} kW`
                  : `${Math.round(x)} W`;
              };


              /* ==========================================================
                 REGISTRE CENTRAL DES ENTITÉS
                 FOXCAT ENERGY V1.5.0

                 ============================================
                 C'EST ICI QU'IL FAUT MODIFIER LES ENTITÉS
                 ============================================

                 Une valeur vide :
                   ''

                 signifie :
                   → recherche automatique de l'entité FoxCat

                 Une valeur renseignée :
                   '[[foxcat:legacy.sensor_xxx]]'

                 signifie :
                   → cette entité est prioritaire

                 Les anciennes entités restent en secours.
                 ========================================================== */

              const ENTITIES = {

                /* ========================================================
                   FOXCAT GLOBAL — ENTITÉS NATIVES CONFIRMÉES DANS EMS Entity.pdf
                   ======================================================== */

                foxcat: {
                  mode_ems: '[[foxcat:ems.mode]]',
