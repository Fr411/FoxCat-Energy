        icon: mdi:solar-power-variant
        color: '#facc15'
    - type: custom:button-card
      template: fc_panel
      custom_fields:
        c: |
          [[[
            /* ONDULEUR FOXCAT · scène animée, oscilloscope triphasé, relais RRCR */
            const E = {
              ackRrcr: '[[foxcat:inverter.ack_rrcr]]', ackInv: '[[foxcat:inverter.ack_inverter]]', ackGrid: '[[foxcat:inverter.ack_grid]]',
              ackLogo: '[[foxcat:inverter.ack_logo]]', avail: '[[foxcat:inverter.command_availability]]', logo: '[[foxcat:inverter.logo_online]]',
              code: '[[foxcat:inverter.rrcr_code]]', reason: '[[foxcat:inverter.reason]]', dir: '[[foxcat:inverter.direction]]',
              lvl: '[[foxcat:inverter.level_current]]', tgt: '[[foxcat:inverter.level_target]]',
              scoreC: '[[foxcat:inverter.score_current]]', scoreT: '[[foxcat:inverter.score_target]]', pvTarget: '[[foxcat:inverter.target_pv]]',
              impPlan: '[[foxcat:inverter.predicted_import]]', expPlan: '[[foxcat:inverter.predicted_export]]',
              state: '[[foxcat:inverter.state]]', ceilPv: '[[foxcat:inverter.pv_limit]]', ceilUse: '[[foxcat:inverter.limit_usage]]', potential: '[[foxcat:inverter.solar_potential]]',
              actStat: '[[foxcat:inverter.actuator_status]]', actTgt: '[[foxcat:inverter.actuator_target]]', frames: '[[foxcat:inverter.processed_frames]]',
              enabled: '[[foxcat:inverter.enabled]]', mode: '[[foxcat:ems.mode]]', lastFrame: '[[foxcat:ems.last_frame]]',
              rl: ['[[foxcat:inverter.rrcr_l1]]', '[[foxcat:inverter.rrcr_l2]]', '[[foxcat:inverter.rrcr_l3]]', '[[foxcat:inverter.rrcr_l4]]'],
              rr: ['[[foxcat:inverter.rrcr_ret_l1]]', '[[foxcat:inverter.rrcr_ret_l2]]', '[[foxcat:inverter.rrcr_ret_l3]]', '[[foxcat:inverter.rrcr_ret_l4]]'],
              house: '[[foxcat:legacy.sensor_foxcat_energy_energie_puissance_de_consommation_maison]]',
              exp: '[[foxcat:legacy.sensor_foxcat_energy_energie_puissance_reinjectee_au_reseau]]',
              imp: '[[foxcat:legacy.sensor_foxcat_energy_energie_puissance_prelevee_au_reseau]]',
              nominal: 'number.foxcat_energy_onduleur_puissance_nominale_onduleur',
              policy: 'sensor.foxcat_energy_tarification_politique_reseau_active',
              ac: 'sensor.solaredge_ac_power', iA: 'sensor.solaredge_ac_current_a', iB: 'sensor.solaredge_ac_current_b', iC: 'sensor.solaredge_ac_current_c',
              kwh: 'sensor.solaredge_ac_energy_kwh', freq: 'sensor.solaredge_ac_frequency', pf: 'sensor.solaredge_ac_pf', va: 'sensor.solaredge_ac_va', vr: 'sensor.solaredge_ac_var',
              uan: 'sensor.solaredge_ac_voltage_an', ubn: 'sensor.solaredge_ac_voltage_bn', ucn: 'sensor.solaredge_ac_voltage_cn',
              uab: 'sensor.solaredge_ac_voltage_ab', ubc: 'sensor.solaredge_ac_voltage_bc', uca: 'sensor.solaredge_ac_voltage_ca',
              dcW: 'sensor.solaredge_dc_power', dcA: 'sensor.solaredge_dc_current', dcV: 'sensor.solaredge_dc_voltage',
              status: 'sensor.solaredge_status', vendor: 'sensor.solaredge_status_vendor', temp: 'sensor.solaredge_temp_sink'
            };
            const BAD = ['unknown', 'unavailable', 'none', ''];
            const raw = (id) => { const s = id ? states[id] : null; if (!s || BAD.includes(String(s.state).toLowerCase())) return null; const v = Number.parseFloat(s.state); return Number.isFinite(v) ? { v, u: String(s.attributes?.unit_of_measurement || '') } : null; };
            const has = (id) => !!raw(id);
            const plain = (id, fb = 0) => { const r = raw(id); return r ? r.v : fb; };
            const scaled = (id, fb = 0) => { const r = raw(id); if (!r) return fb; const p = r.u.charAt(0); if (r.u.length > 1 && p === 'k') return r.v * 1e3; if (r.u.length > 1 && p === 'M') return r.v * 1e6; return r.v; };
            const text = (id, fb = '—') => { const s = id ? states[id] : null; return (!s || BAD.includes(String(s.state).toLowerCase())) ? fb : s.state; };
            const on = (id) => id && states[id] && ['on', 'true', '1'].includes(String(states[id].state).toLowerCase());
            const clamp = (n, a = 0, b = 100) => Math.min(b, Math.max(a, Number(n) || 0));
            const norm = (v) => String(v ?? '').normalize('NFD').replace(/[^ -~]/g, '').toLowerCase();
            const esc = (v) => String(v ?? '—').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
            const nf = (n, d = 1) => Number(n).toLocaleString('fr-BE', { minimumFractionDigits: d, maximumFractionDigits: d });
            const pw = (v) => { const n = Math.abs(Number(v) || 0); return n >= 1000 ? nf(n / 1000, 2) + ' kW' : Math.round(n) + ' W'; };
            const NOW = Date.now() / 1000;
            const ph = (d, o = 0) => `-${((((NOW + o) % d) + d) % d).toFixed(2)}s`;
            const AA = (n, d, tf = 'linear', o = 0) => `animation:${n} ${d}s ${tf} ${ph(d, o)} infinite;`;

            /* ---------- mesures ---------- */
            const PANELS = 22;
            const NOM = Math.max(500, scaled(E.nominal, 4000));
            const acW = Math.max(0, scaled(E.ac)), dcW = Math.max(0, scaled(E.dcW));
            const dcV = plain(E.dcV), dcA = plain(E.dcA);
            const exp = Math.max(0, scaled(E.exp)), imp = Math.max(0, scaled(E.imp)), houseW = Math.max(0, scaled(E.house));
            const toHouse = Math.max(0, acW - exp);
            const eff = dcW > 50 ? clamp(acW / dcW * 100) : 0;
            const temp = plain(E.temp, NaN), freq = plain(E.freq, NaN);
            const pfRaw = plain(E.pf, NaN), pf = Number.isFinite(pfRaw) ? (Math.abs(pfRaw) > 1.5 ? pfRaw / 100 : pfRaw) : NaN;
            const sVA = scaled(E.va, 0), qVar = scaled(E.vr, 0);
            const I = [plain(E.iA), plain(E.iB), plain(E.iC)];
            const Un = [plain(E.uan, NaN), plain(E.ubn, NaN), plain(E.ucn, NaN)];
            const Ul = [plain(E.uab, NaN), plain(E.ubc, NaN), plain(E.uca, NaN)];
            const Iavg = (I[0] + I[1] + I[2]) / 3;
            const imb = Iavg > 0.5 ? (Math.max(...I) - Math.min(...I)) / Iavg * 100 : 0;
            const uLine = Ul.filter(Number.isFinite);
            const nomA = NOM / (Math.sqrt(3) * ((uLine.length ? uLine.reduce((a, b) => a + b, 0) / uLine.length : 400)));
            const kwhTot = (() => { const r = raw(E.kwh); return r ? (r.u === 'Wh' ? r.v / 1e3 : r.u === 'MWh' ? r.v * 1e3 : r.v) : null; })();

            /* ---------- niveau PRI et statut ---------- */
            const hasPri = has(E.lvl);
            const priCur = hasPri ? clamp(plain(E.lvl)) : 100, priTgt = has(E.tgt) ? clamp(plain(E.tgt)) : priCur;
            const capW = NOM * priCur / 100;
            const priRed = priCur < 99.5, atCap = priRed && acW >= .92 * capW, atMax = acW >= .92 * NOM;
            const stRaw = text(E.status, '—');
            const numMap = { 1: 'off', 2: 'sleep', 3: 'start', 4: 'prod', 5: 'throttle', 6: 'stop', 7: 'fault', 8: 'standby' };
            const stN = /^[0-9]+$/.test(String(stRaw)) ? (numMap[Number(stRaw)] || 'unk') : norm(stRaw);
            const kind = (stN.includes('mppt') || stN.includes('produc') || stN === 'prod') ? 'prod' : (stN.includes('throttl') || stN.includes('brid') || stN.includes('limit')) ? 'throttle' : (stN.includes('sleep') || stN.includes('veille') || stN.includes('night')) ? 'sleep' : (stN.includes('fault') || stN.includes('defaut') || stN.includes('erreur')) ? 'fault' : (stN.includes('start') || stN.includes('demarr')) ? 'start' : (stN.includes('standby') || stN.includes('attente')) ? 'standby' : (stN.includes('shut') || stN.includes('stop')) ? 'stop' : (stN.includes('off') || stN.includes('arret')) ? 'off' : 'unk';
            const STAT = { prod: ['Production', '#36e59b', 'mdi:solar-power-variant'], throttle: ['Production bridée', '#ffad42', 'mdi:speedometer-slow'], sleep: ['Veille', '#64748b', 'mdi:weather-night'], start: ['Démarrage', '#19d8ff', 'mdi:power-plug'], standby: ['Attente', '#8b9bb0', 'mdi:pause-circle-outline'], stop: ['Arrêt en cours', '#8b9bb0', 'mdi:power-sleep'], off: ['Arrêté', '#64748b', 'mdi:power-off'], fault: ['Défaut', '#fb7185', 'mdi:alert-octagon'], maxprod: ['Production max', '#36e59b', 'mdi:solar-power-variant'], unk: [String(stRaw), '#19d8ff', 'mdi:help-circle-outline'] };
            let eff2 = kind, note = '';
