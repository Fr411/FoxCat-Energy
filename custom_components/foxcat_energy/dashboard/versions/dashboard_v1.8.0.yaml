                    ${kpi('mdi:sine-wave', 'Fréquence', Number.isFinite(freq) ? nf(freq, 2) + '<small> Hz</small>' : '—', !Number.isFinite(freq) ? 'Indisponible' : (freq >= 49.8 && freq <= 50.2) ? 'Réseau stable' : 'Hors plage', freqC)}
                    ${kpi('mdi:angle-acute', 'Facteur de puissance', Number.isFinite(pf) ? nf(pf, 2) : '—', 'cos φ', pfC, Number.isFinite(pf) ? Math.abs(pf) * 100 : 0)}
                    ${kpi('mdi:flash', 'Apparente', pw(sVA).replace(' W', ' VA').replace('kW', 'kVA'), 'S = √(P² + Q²)', '#c4b5fd')}
