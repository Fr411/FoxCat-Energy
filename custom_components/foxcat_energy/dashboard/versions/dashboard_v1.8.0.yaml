- type: panel
  path: technique
  title: Technique
  icon: mdi:tune-vertical-variant
  theme: ios-dark-mode-blue-red
  cards:
  - type: vertical-stack
    cards:
    - type: custom:button-card
      template: fc_panel
      styles:
        card:
        - border-radius: 18px 18px 0 0
      custom_fields:
        c: |
          [[[
            const OUTDOOR = 'weather.momignies'; // <- adapte ton entité météo
            const d = new Date();
            const date = d.toLocaleDateString('fr-BE',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
            const time = d.toLocaleTimeString('fr-BE',{hour:'2-digit',minute:'2-digit'});
            const temp = states[OUTDOOR]?.attributes?.temperature;
            return `
            <div class="p" style="display:flex;align-items:center;justify-content:space-between;padding:12px 20px">
              <div style="display:flex;align-items:center;gap:12px">
                <div class="img" style="width:44px;height:44px;background-image:url(/homeassistant/custom_components/foxcat_energy/dashboard/assets/hero_house.webp)"></div>
                <div>
                  <div style="font-size:20px;font-weight:800;letter-spacing:.04em"><span style="color:#38bdf8">FOX</span>CAT <span style="font-weight:500">ENERGY</span></div>
                  <div class="k">Home Assistant • EMS intelligent</div>
                </div>
              </div>
              <div style="display:flex;align-items:center;gap:28px">
                <div style="text-align:right"><div class="k">${date}</div><div style="font-size:20px;font-weight:600">${time}</div></div>
                <div style="text-align:right"><div style="font-size:18px;font-weight:700"><span class="o">☀</span> ${temp!==undefined?Number(temp).toFixed(1).replace('.',','):'—'} °C</div><div class="k">Extérieur</div></div>
              </div>
            </div>`;
          ]]]
    - type: custom:button-card
      template: fc_navbar
    - type: custom:button-card
      template: fc_head
      variables:
        title: Paramètres
        subtitle: Moteur, contrat énergie, boiler, onduleur et maintenance
        icon: mdi:tune-vertical-variant
        color: '#ff922b'
    - type: grid
      columns: 3
      square: false
      cards:
      - type: custom:vertical-stack-in-card
        cards:
        - type: markdown
          content: |
            ### 1 · Comportement du moteur
            **Éco** applique les règles économiques de façon stricte. **Confort** conserve l’optimisation mais autorise davantage d’assouplissement.  **Manuel** désactive les décisions automatiques.
        - type: entities
          show_header_toggle: false
          entities:
          - entity: [[foxcat:ems.mode]]
            name: Comportement EMS
          - entity: [[foxcat:ems.regulation_active]]
            name: Régulation FoxCat
        card_mod:
          style: 'ha-card { background: radial-gradient(circle at 3% 0%, rgba(255,120,20,0.10), transparent 30%), radial-gradient(circle at 98% 0%, rgba(0,210,255,0.09), transparent 32%), linear-gradient(135deg, #080d16 0%, #0a1420 48%, #071827 100%); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.30), inset 0 1px 0 rgba(255,255,255,0.035); overflow: hidden; color: #e8f1fb; }'
      - type: custom:vertical-stack-in-card
        cards:
        - type: markdown
          content: |
            ### 2 · Énergie, distribution et réseau
            Le **contrat énergie** détermine le prix d’achat. Le **profil distribution** décrit la structure du réseau belge. La **politique réseau** définit le traitement de l’injection.
        - type: entities
          show_header_toggle: false
          entities:
          - entity: [[foxcat:pricing.regime]]
            name: Contrat énergie
          - entity: select.foxcat_energy_tarification_profil_distribution_belgique
            name: Politique réseau
          - entity: [[foxcat:pricing.network_policy]]
        card_mod:
          style: 'ha-card { background: radial-gradient(circle at 3% 0%, rgba(255,120,20,0.10), transparent 30%), radial-gradient(circle at 98% 0%, rgba(0,210,255,0.09), transparent 32%), linear-gradient(135deg, #080d16 0%, #0a1420 48%, #071827 100%); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.30), inset 0 1px 0 rgba(255,255,255,0.035); overflow: hidden; color: #e8f1fb; }'
      - type: conditional
        conditions:
        - entity: [[foxcat:pricing.regime]]
          state: Dynamique
        card:
          type: custom:vertical-stack-in-card
          cards:
          - type: markdown
            content: |
              ### 3 · Réglages Dynamic
              Le **seuil favorable** définit le bas de la courbe Day-Ahead. Le **plafond acceptable** bloque les nouveaux achats flexibles au-delà de cette position.
          - type: entities
            show_header_toggle: false
            entities:
            - entity: [[foxcat:legacy.number_foxcat_energy_tarification_seuil_prix_favorable_day_ahead]]
              name: Seuil favorable
            - entity: [[foxcat:legacy.number_foxcat_energy_tarification_seuil_zone_pic_day_ahead]]
              name: Plafond acceptable
            - entity: [[foxcat:legacy.switch_foxcat_energy_tarification_predictif_prix_dynamique]]
              name: Planification prix
            - entity: [[foxcat:legacy.switch_foxcat_energy_tarification_optimisation_economique_des_charges_flexibles]]
              name: Arbitrage prévision solaire
          card_mod:
            style: 'ha-card { background: radial-gradient(circle at 3% 0%, rgba(255,120,20,0.10), transparent 30%), radial-gradient(circle at 98% 0%, rgba(0,210,255,0.09), transparent 32%), linear-gradient(135deg, #080d16 0%, #0a1420 48%, #071827 100%); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.30), inset 0 1px 0 rgba(255,255,255,0.035); overflow: hidden; color: #e8f1fb; }'
      - type: custom:vertical-stack-in-card
        cards:
        - type: markdown
          content: |
            ### 4 · Boiler · charge flexible
            La sonde dans le **doigt de gant bas** est fiable pour la sécurité.  Le capteur en **contact sur la tête de cuve** est utilisé pour la  tendance et la détection de puisage.
        - type: entities
          show_header_toggle: false
          entities:
          - entity: [[foxcat:legacy.switch_foxcat_energy_boiler_boiler_gere_par_foxcat]]
            name: Charge flexible Boiler
          - entity: [[foxcat:legacy.number_foxcat_energy_boiler_temperature_reprise_boiler]]
            name: Température de reprise
          - entity: [[foxcat:legacy.number_foxcat_energy_boiler_temperature_confort_boiler]]
            name: Cible confort réseau
          - entity: [[foxcat:legacy.number_foxcat_energy_boiler_temperature_boost_solaire]]
            name: Stockage solaire / boost
          - entity: [[foxcat:legacy.number_foxcat_energy_boiler_securite_temperature_boiler]]
            name: Sécurité absolue
        card_mod:
          style: 'ha-card { background: radial-gradient(circle at 3% 0%, rgba(255,120,20,0.10), transparent 30%), radial-gradient(circle at 98% 0%, rgba(0,210,255,0.09), transparent 32%), linear-gradient(135deg, #080d16 0%, #0a1420 48%, #071827 100%); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.30), inset 0 1px 0 rgba(255,255,255,0.035); overflow: hidden; color: #e8f1fb; }'
      - type: custom:vertical-stack-in-card
        cards:
        - type: markdown
          content: |
            ### 5 · Onduleur / PRI
            Le PRI reste indépendant du comportement tarifaire. En **Zéro injection**, il vise une réinjection quasi nulle ; en **Compensation**, la production reste libérée.
        - type: entities
          show_header_toggle: false
          entities:
          - entity: [[foxcat:legacy.sensor_foxcat_energy_onduleur_ems_onduleur_etat]]
            name: Régulation PRI
          - entity: [[foxcat:legacy.number_foxcat_energy_ems_injection_maximale_toleree]]
            name: Injection maximale tolérée
          - entity: [[foxcat:legacy.number_foxcat_energy_ems_import_cible]]
            name: Import cible
          - entity: [[foxcat:legacy.number_foxcat_energy_ems_import_maximal_avant_liberation_pv]]
            name: Import maximal avant libération PV
        card_mod:
          style: 'ha-card { background: radial-gradient(circle at 3% 0%, rgba(255,120,20,0.10), transparent 30%), radial-gradient(circle at 98% 0%, rgba(0,210,255,0.09), transparent 32%), linear-gradient(135deg, #080d16 0%, #0a1420 48%, #071827 100%); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.30), inset 0 1px 0 rgba(255,255,255,0.035); overflow: hidden; color: #e8f1fb; }'
      - type: custom:vertical-stack-in-card
        cards:
        - type: markdown
          content: |
            ### 6 · Maintenance
            La régénération du dashboard utilise le registre FoxCat et crée une sauvegarde du fichier existant avant remplacement.
        - type: entities
          show_header_toggle: false
          entities:
          - entity: [[foxcat:legacy.button_foxcat_energy_diagnostic_regenerer_le_dashboard_foxcat]]
            name: Régénérer le dashboard
          - entity: [[foxcat:legacy.button_foxcat_energy_diagnostic_lancer_un_diagnostic_ems]]
            name: Lancer diagnostic
          - entity: [[foxcat:legacy.button_foxcat_energy_ems_reinitialiser_le_cycle_ems]]
            name: Réinitialiser cycle EMS
          - entity: [[foxcat:legacy.input_boolean_ems_head_menu]]
          - entity: [[foxcat:legacy.input_boolean_ems_head_lateral]]
        card_mod:
          style: 'ha-card { background: radial-gradient(circle at 3% 0%, rgba(255,120,20,0.10), transparent 30%), radial-gradient(circle at 98% 0%, rgba(0,210,255,0.09), transparent 32%), linear-gradient(135deg, #080d16 0%, #0a1420 48%, #071827 100%); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.30), inset 0 1px 0 rgba(255,255,255,0.035); overflow: hidden; color: #e8f1fb; }'
  show_icon_and_title: false
  subview: true
