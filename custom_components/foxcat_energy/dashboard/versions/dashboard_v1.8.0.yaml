            let gLabel = 'ÉQUILIBRE', gW = 0, gCol = '#94a3b8', gDir = 'none';
            if (exp > 30 && exp >= imp) { gLabel = 'RÉINJECTION'; gW = exp; gCol = '#36e59b'; gDir = 'out'; }
            else if (imp > 30) { gLabel = 'PRÉLÈVEMENT'; gW = imp; gCol = '#fb7185'; gDir = 'in'; }

