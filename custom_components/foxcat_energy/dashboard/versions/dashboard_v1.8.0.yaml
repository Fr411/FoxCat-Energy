            else if (kind === 'throttle') { eff2 = atMax ? 'maxprod' : 'prod'; note = atMax ? `Maximum de l'onduleur : ${pw(NOM)}` : 'Statut « bridé » sans réduction PRI'; }
            else if (priRed && kind === 'prod') note = `PRI à ${Math.round(priCur)} % · plafond ${pw(capW)} non atteint`;
            else if (kind === 'prod' && atMax) { eff2 = 'maxprod'; note = `Maximum de l'onduleur : ${pw(NOM)}`; }
            const [stLabel, stCol, stIcon] = STAT[eff2];
            const producing = eff2 === 'prod' || eff2 === 'throttle' || eff2 === 'maxprod' || acW > 30;

