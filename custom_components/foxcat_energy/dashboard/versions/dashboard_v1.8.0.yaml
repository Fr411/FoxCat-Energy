              const W=v=>v>=1000?(v/1000).toFixed(2).replace('.',',')+' kW':Math.round(v)+' W';
              const pv=N('[[foxcat:legacy.sensor_foxcat_energy_energie_puissance_de_production_photovoltaique]]'),h=N('[[foxcat:legacy.sensor_foxcat_energy_energie_puissance_de_consommation_maison]]'),im=N('[[foxcat:legacy.sensor_foxcat_energy_energie_puissance_prelevee_au_reseau]]'),ex=N('[[foxcat:legacy.sensor_foxcat_energy_energie_puissance_reinjectee_au_reseau]]');
