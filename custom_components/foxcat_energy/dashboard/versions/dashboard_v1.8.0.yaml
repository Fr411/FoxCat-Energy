              .of .gv small{font-size:16px;color:${col};margin-left:2px}
              .of .gs{margin-top:6px;font-size:11px;color:#64748b}
              .of .br{margin-bottom:12px}
              .of .bl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:11.5px;color:#94a3b8}
              .of .bl span{display:inline-flex;align-items:center;gap:6px}.of .bl ha-icon{--mdc-icon-size:15px;color:#ff922b}
              .of .bl b{color:#f1f5f9;font-size:14px}.of .bl small{color:#64748b;font-size:10px}
              .of .bt{height:7px;margin-top:6px;border-radius:7px;background:rgba(255,255,255,.07);overflow:hidden}
              .of .bt i{display:block;height:100%;border-radius:7px;transition:width .6s}
              .of .grp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
              .of .gp{padding:10px 12px;border-radius:14px;background:rgba(2,6,14,.45);border:1px solid rgba(255,255,255,.06)}
              .of .gp span{display:block;font-size:9px;font-weight:800;letter-spacing:.14em;color:#64748b}
              .of .gp b{display:block;margin-top:4px;font-size:20px;font-weight:700;color:${oE || oR ? '#ff922b' : '#94a3b8'}}
              .of .cps{display:grid;grid-template-columns:1fr 1fr;gap:7px}
              .of .cp{display:flex;align-items:center;gap:7px;padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.06);font-size:11px;color:#94a3b8;min-width:0}
              .of .cp ha-icon{--mdc-icon-size:15px;color:#19d8ff;flex:none}.of .cp span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.of .cp b{color:#e2e8f0;font-size:12px}
              .of .msg{position:relative;margin-top:14px;padding:11px 14px;border-radius:14px;font-size:12px;line-height:1.5;color:#cbd5e1;background:linear-gradient(135deg,${col}14,transparent);border:1px solid ${col}33}
              .of .msg ha-icon{--mdc-icon-size:16px;color:${col};vertical-align:-3px;margin-right:6px}
              @media (max-width:900px){.of .body{grid-template-columns:1fr}.of .g{margin:0 auto}}
              @media (prefers-reduced-motion:reduce){.of *{animation:none!important}}
              @keyframes of-ping{0%{transform:scale(.6);opacity:1}100%{transform:scale(2.6);opacity:0}}
              @keyframes of-glow{0%,100%{text-shadow:0 0 10px ${col}33}50%{text-shadow:0 0 28px ${col}aa}}
            </style>
            <div class="of">
              <div class="hd"><div><div class="eye">FOXCAT ENERGY · SOLAIRE</div><div class="h1">Décalage de consigne</div></div>
                <span class="st"><i></i>${act ? 'DÉCALAGE ACTIF' : sol ? 'EN VEILLE' : 'FONCTION DÉSACTIVÉE'}</span></div>
              <div class="body">
                <div class="g"><svg viewBox="0 0 140 140">
                  <circle cx="70" cy="70" r="${R}" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${(C * .75).toFixed(1)} ${C.toFixed(1)}" transform="rotate(135 70 70)"/>
                  <circle cx="70" cy="70" r="${R}" fill="none" stroke="${col}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${(C * .75 * pct).toFixed(1)} ${C.toFixed(1)}" transform="rotate(135 70 70)" style="filter:drop-shadow(0 0 6px ${col}aa)"/>
                  ${ticks}</svg>
                  <div class="gc"><div class="gl">DÉCALAGE</div><div class="gv mono">+${dec(off)}<small>°C</small></div><div class="gs">${steps} / ${nTick} pas · max ${dec(max)} °C</div></div></div>
                <div>
