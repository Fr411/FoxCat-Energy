                      /* ==================================================
                         HC
                         ================================================== */

                      const hcEntity =
                        firstExisting(
                          device.registry.consommation_hc_jour
                        )
                        ||
                        nativeApplianceSensor(
                          device,
                          [
                            'consommation',
                            'hc',
                            'aujourd'
                          ]
                        )
                        ||
                        legacyCandidate(
                          device.legacy.hc
                        );


                      /* ==================================================
                         TARIF ACTUEL APPAREIL
                         ================================================== */

                      const tariffNowEntity =
                        firstExisting(
                          device.registry.tarif_actuel
                        )
                        ||
                        nativeApplianceSensor(
                          device,
                          [
                            'tarif',
                            'actuel'
                          ]
                        );


                      /* ==================================================
                         PUISSANCE
                         ================================================== */

                      let powerEntity =
                        null;


                      if (
                        device.id === 'boiler'
                      ) {

                        powerEntity =
                          findFox(
                            'sensor',
                            [
                              'puissance',
                              'chauffe',
                              'eau'
                            ],
                            entityList(
                              device.registry.puissance
                            )
                          )
                          ||
                          findPowerSensor(
                            device.nativeNames,
                            device.powerCandidates
                          );
                      }

                      else {

                        powerEntity =
                          findPowerSensor(
                            device.nativeNames,
                            device.powerCandidates
                          );
                      }


                      /* ==================================================
                         CYCLE
                         ================================================== */

                      let cycleEntity =
                        null;


                      if (
                        device.id === 'boiler'
                      ) {

                        cycleEntity =
                          findFox(
                            'binary_sensor',
                            [
                              'boiler',
                              'physique'
                            ],
                            entityList(
                              device.registry.cycle
                            )
                          )
                          ||
                          device.cycleCandidates.find(
                            (id) =>
                              states[id]
                          )
                          ||
                          null;
                      }

                      else {

                        cycleEntity =
                          device.cycleCandidates.find(
                            (id) =>
                              states[id]
                          )
                          ||
                          null;
                      }


                      /* ==================================================
                         VALEURS
                         ================================================== */

                      const energy =
                        Math.max(
                          numberOf(
                            energyEntity,
                            0
                          ),
                          0
                        );


                      const solar =
                        Math.max(
                          numberOf(
                            solarEntity,
                            0
                          ),
                          0
                        );


                      const grid =
                        Math.max(
                          numberOf(
                            gridEntity,
                            Math.max(
                              energy - solar,
                              0
                            )
                          ),
                          0
                        );


                      const hp =
                        Math.max(
                          numberOf(
                            hpEntity,
                            0
                          ),
                          0
                        );


                      const hc =
                        Math.max(
                          numberOf(
                            hcEntity,
                            0
                          ),
                          0
                        );


                      /*
                       * Si FoxCat possède un vrai coût :
                       * → on l'utilise.
                       *
                       * Sinon :
                       * → secours énergie × prix actif.
                       */

                      const cost =
                        Math.max(
                          numberOf(
                            costEntity,
                            energy *
                            Math.max(
                              activePrice,
                              0
                            )
                          ),
                          0
                        );


                      const power =
                        Math.max(
                          numberOf(
                            powerEntity,
                            0
                          ),
                          0
                        );


                      const tariffNow =
                        stateOf(
                          tariffNowEntity,
                          tariffPeriod
                        );


                      const running =
                        (
                          cycleEntity
                          &&
                          isOn(
                            cycleEntity
                          )
                        )
                        ||
                        power > 20;


                      const tariffTotal =
                        hp +
                        hc;


                      const partHC =
                        tariffTotal > 0
                          ? clamp(
                              (
                                hc /
                                tariffTotal
                              ) * 100,
                              0,
                              100
                            )
                          : 0;


                      const partHP =
                        tariffTotal > 0
                          ? clamp(
                              (
                                hp /
                                tariffTotal
                              ) * 100,
                              0,
                              100
                            )
                          : 0;


                      const solarShare =
                        energy > 0
                          ? clamp(
                              (
                                solar /
                                energy
                              ) * 100,
                              0,
                              100
                            )
                          : 0;


                      const gridShare =
                        energy > 0
                          ? clamp(
                              (
                                grid /
                                energy
                              ) * 100,
                              0,
                              100
                            )
                          : 0;


                      const avgPrice =
                        energy > 0
                          ? cost / energy
                          : 0;


                      /*
                       * Détermine si la comptabilité utilisée
                       * est native FoxCat.
                       */

                      const nativeAccounting =
                        !!(
                          firstExisting(
                            device.registry.energie_jour,
                            device.registry.part_solaire_jour,
                            device.registry.part_reseau_jour,
                            device.registry.cout_jour,
                            device.registry.consommation_hp_jour,
                            device.registry.consommation_hc_jour,
                            device.registry.tarif_actuel
                          )
                          ||
                          solarEntity
                          ||
                          gridEntity
                          ||
                          (
                            costEntity
                            &&
                            norm(
                              costEntity
                            ).includes(
                              'foxcat energy'
                            )
                          )
                        );


                      return {

                        ...device,

                        energyEntity,
                        solarEntity,
                        gridEntity,
                        costEntity,
                        hpEntity,
                        hcEntity,
                        tariffNowEntity,

                        powerEntity,
                        cycleEntity,

                        energy,
                        solar,
                        grid,
                        hp,
                        hc,
                        cost,
                        power,
                        tariffNow,

                        running,
                        partHC,
                        partHP,
                        solarShare,
                        gridShare,
                        avgPrice,
                        nativeAccounting

                      };
                    }
                  );


              /* ==========================================================
                 TOTAUX
                 ========================================================== */

              const activeEnergy =
                activeDevices.reduce(
                  (
                    sum,
                    d
                  ) =>
                    sum +
                    d.energy,
                  0
                );


              const activeSolar =
                activeDevices.reduce(
                  (
                    sum,
                    d
                  ) =>
                    sum +
                    d.solar,
                  0
                );


              const activeGrid =
                activeDevices.reduce(
                  (
                    sum,
                    d
                  ) =>
                    sum +
                    d.grid,
                  0
                );


              const activeCost =
                activeDevices.reduce(
                  (
                    sum,
                    d
                  ) =>
                    sum +
                    d.cost,
                  0
                );


              const runningCount =
                activeDevices.filter(
                  (d) =>
                    d.running
                ).length;


              /* ==========================================================
                 COULEUR PRIX
                 ========================================================== */

              const priceColor =
                (() => {

                  const p =
                    norm(
                      priceStatus
                    );


                  if (
                    p.includes(
                      'avantage'
                    )
                    ||
                    p.includes(
                      'bas'
                    )
                    ||
                    p.includes(
                      'negatif'
                    )
                  ) {

                    return '#35e59d';
                  }


                  if (
                    p.includes(
                      'eleve'
                    )
                    ||
                    p.includes(
                      'cher'
                    )
                  ) {

                    return '#fb7185';
                  }


                  return '#facc15';

                })();


              /* ==========================================================
                 CARTES APPAREILS
                 ========================================================== */

              const cardHtml =
                activeDevices

                  .map(
                    (d) => {

                      const stateColor =
                        d.running
                          ? '#35e59d'
                          : '#64748b';


                      const tariffColor =
                        norm(
                          d.tariffNow
                        ).includes(
                          'hp'
                        )
                          ? '#ff922b'
                          : '#19d8ff';


                      const hasSplit =
                        d.hpEntity
                        ||
                        d.hcEntity
                        ||
                        (
                          d.hp +
                          d.hc
                        ) > 0;


                      return `

                        <div
                          class="device-card"
                          style="
                            --device:${d.color};
                          "
                        >


                          <!-- HEADER APPAREIL -->

                          <div class="device-header">


                            <div class="device-name-block">


                              <div class="device-icon">

                                <ha-icon
                                  icon="${d.icon}">
                                </ha-icon>

                              </div>


                              <div>

                                <div class="device-name">
                                  ${d.name}
                                </div>


                                <div class="native-line">

                                  <span class="native-dot"></span>

                                  ${
                                    d.management.native
                                      ? 'GESTION FOXCAT'
                                      : 'GESTION LEGACY'
                                  }

                                  ·

                                  ${
                                    d.nativeAccounting
                                      ? 'COMPTABILITÉ FOXCAT'
                                      : 'FALLBACK'
                                  }

                                </div>

                              </div>


                            </div>



                            <div
                              class="running"
                              style="
                                color:${stateColor};
                              "
                            >

                              ${
                                d.running
                                  ? '● EN COURS'
                                  : '○ EN ATTENTE'
                              }

                            </div>


                          </div>



                          <!-- ÉNERGIE / COÛT -->

                          <div class="main-values">


                            <div>

                              <div class="small-label">
                                ÉNERGIE AUJOURD'HUI
                              </div>

                              <div class="energy-value">
                                ${fmtEnergy(d.energy)}
                              </div>

                            </div>



                            <div class="cost-block">

                              <div class="small-label">
                                COÛT FOXCAT
                              </div>

                              <div class="cost-value">
                                ${fmtEuro(d.cost)}
                              </div>

                              <div class="cost-source">

                                ${
                                  d.nativeAccounting
                                    ? 'COMPTABILISÉ V1.5.0'
                                    : 'SECOURS / ESTIMÉ'
                                }

                              </div>

                            </div>


                          </div>



                          <!-- PUISSANCE -->

                          <div class="power-line">

                            <span>
                              Puissance actuelle
                            </span>

                            <strong>
                              ${fmtPower(d.power)}
                            </strong>

                          </div>



                          <!-- PART SOLAIRE / RÉSEAU -->

                          <div class="source-grid">


                            <div>

                              <span class="solar-label">
                                PART SOLAIRE
                              </span>

                              <strong>
                                ${fmtEnergy(d.solar)}
                              </strong>

                              <small>
                                ${d.solarShare.toFixed(0)} %
                              </small>

                            </div>



                            <div>

                              <span class="grid-label">
                                PART RÉSEAU
                              </span>

                              <strong>
                                ${fmtEnergy(d.grid)}
                              </strong>

                              <small>
                                ${d.gridShare.toFixed(0)} %
                              </small>

                            </div>


                          </div>



                          <div class="source-bar">

                            <div
                              class="solar-fill"
                              style="
                                width:${d.solarShare}%;
                              "
                            ></div>

                            <div
                              class="grid-fill"
                              style="
                                width:${d.gridShare}%;
                              "
                            ></div>

                          </div>



                          <!-- HP / HC -->

                          ${
                            hasSplit
                              ? `

                                <div class="tariff-title">
                                  RÉPARTITION HP / HC
                                </div>


                                <div class="tariff-values">


                                  <div>

                                    <span class="hc-label">
                                      HEURES CREUSES
                                    </span>

                                    <strong>
                                      ${fmtEnergy(d.hc)}
                                    </strong>

                                    <small>
                                      ${d.partHC.toFixed(1)} %
                                    </small>

                                  </div>



                                  <div>

                                    <span class="hp-label">
                                      HEURES PLEINES
                                    </span>

                                    <strong>
                                      ${fmtEnergy(d.hp)}
                                    </strong>

                                    <small>
                                      ${d.partHP.toFixed(1)} %
                                    </small>

                                  </div>


                                </div>



                                <div class="split-bar">

                                  <div
                                    class="hc-fill"
                                    style="
                                      width:${d.partHC}%;
                                    "
                                  ></div>

                                  <div
                                    class="hp-fill"
                                    style="
                                      width:${d.partHP}%;
                                    "
                                  ></div>

                                </div>

                              `
                              : `

                                <div class="tariff-unavailable">
                                  Aucune répartition HP / HC enregistrée aujourd'hui
                                </div>

                              `
                          }



                          <!-- FOOTER APPAREIL -->

                          <div class="device-footer">


                            <div>

                              <span>
                                TARIF APPAREIL
                              </span>

                              <strong
                                style="
                                  color:${tariffColor};
                                "
                              >
                                ${d.tariffNow}
                              </strong>

                            </div>



                            <div>

                              <span>
                                PRIX MOYEN
                              </span>

                              <strong>

                                ${
                                  d.energy > 0
                                    ? `${d.avgPrice.toFixed(3)} €/kWh`
                                    : '—'
                                }

                              </strong>

                            </div>


                          </div>


                        </div>

                      `;
                    }
                  )

                  .join('');


              /* ==========================================================
                 AUCUN APPAREIL
                 ========================================================== */

              const emptyHtml = `

                <div class="empty">

                  <ha-icon
                    icon="mdi:power-plug-off-outline">
                  </ha-icon>

                  <div>

                    <strong>
                      Aucun appareil géré par FoxCat
                    </strong>

                    <span>
                      Active la gestion d'un appareil dans FoxCat EMS
                      pour afficher sa comptabilité énergétique.
                    </span>

                  </div>

                </div>

              `;


              /* ==========================================================
                 RENDU
                 ========================================================== */

              return `

                <style>

                  * {
                    box-sizing:border-box;
                  }


                  .wrap {

                    padding:22px;

                    color:#f8fafc;

                    font-family:
                      -apple-system,
                      BlinkMacSystemFont,
                      "Segoe UI",
                      Roboto,
                      sans-serif;
                  }


                  /* =====================================================
                     HEADER
                     ===================================================== */

                  .header {

                    display:flex;

                    align-items:flex-start;

                    justify-content:space-between;

                    gap:15px;

                    margin-bottom:15px;
                  }


                  .brand {

                    display:flex;

                    align-items:center;

                    gap:12px;
                  }


                  .logo {

                    width:46px;

                    height:46px;

                    flex:none;

                    display:flex;

                    align-items:center;

                    justify-content:center;

                    border-radius:14px;

                    color:#19d8ff;

                    background:
                      linear-gradient(
                        135deg,
                        rgba(255,146,43,.10),
                        rgba(25,216,255,.10)
                      );

                    border:
                      1px solid rgba(255,255,255,.08);
                  }


                  .logo ha-icon {
                    --mdc-icon-size:25px;
                  }


                  .brand-name {

                    color:#19d8ff;

                    font-size:9px;

                    font-weight:900;

                    letter-spacing:2px;
                  }


                  .title {

                    margin-top:4px;

                    font-size:23px;

                    font-weight:900;
                  }


                  .subtitle {

                    margin-top:3px;

                    color:#64748b;

                    font-size:8px;
                  }


                  .count {

                    padding:8px 10px;

                    border-radius:13px;

                    color:#35e59d;

                    background:
                      rgba(53,229,157,.06);

                    border:
                      1px solid rgba(53,229,157,.14);

                    font-size:8px;

                    font-weight:900;

                    white-space:nowrap;
                  }


                  /* =====================================================
                     CONTEXTE
                     ===================================================== */

                  .context {

                    display:grid;

                    grid-template-columns:
                      repeat(
                        4,
                        minmax(0,1fr)
                      );

                    gap:8px;

                    margin-bottom:10px;
                  }


                  .context-box {

                    min-width:0;

                    padding:11px 12px;

                    border-radius:14px;

                    background:
                      rgba(255,255,255,.02);

                    border:
                      1px solid rgba(255,255,255,.045);
                  }


                  .context-box span {

                    display:block;

                    color:#526174;

                    font-size:6px;

                    font-weight:900;

                    letter-spacing:.08em;
                  }


                  .context-box strong {

                    display:block;

                    margin-top:4px;

                    color:#dbe5f1;

                    font-size:9px;

                    white-space:nowrap;

                    overflow:hidden;

                    text-overflow:ellipsis;
                  }


                  /* =====================================================
                     RÉSUMÉ
                     ===================================================== */

                  .summary {

                    display:grid;

                    grid-template-columns:
                      repeat(
                        4,
                        minmax(0,1fr)
                      );

                    gap:8px;

                    margin-bottom:13px;
                  }


                  .summary-box {

                    padding:13px 14px;

                    border-radius:16px;

                    background:
                      rgba(255,255,255,.024);

                    border:
                      1px solid rgba(255,255,255,.05);
                  }


                  .small-label {

                    color:#718096;

                    font-size:7px;

                    font-weight:900;

                    letter-spacing:.10em;
                  }


                  .summary-value {

                    margin-top:5px;

                    font-size:20px;

                    font-weight:900;
                  }


                  .summary-box.cost .summary-value {
                    color:#35e59d;
                  }


                  .summary-box.solar .summary-value {
                    color:#ff922b;
                  }


                  .summary-box.grid .summary-value {
                    color:#fb7185;
                  }


                  /* =====================================================
                     BANDEAU ÉTAT
                     ===================================================== */

                  .status-strip {

                    display:flex;

                    justify-content:space-between;

                    align-items:center;

                    gap:10px;

                    margin-bottom:13px;

                    padding:10px 12px;

                    border-radius:14px;

                    background:
                      rgba(25,216,255,.025);

                    border:
                      1px solid rgba(25,216,255,.07);

                    font-size:7px;

                    color:#64748b;
                  }


                  .status-strip strong {

                    color:#cbd5e1;

                    font-size:8px;
                  }


                  /* =====================================================
                     GRILLE APPAREILS
                     ===================================================== */

                  .device-grid {

                    display:grid;

                    grid-template-columns:
                      repeat(
                        auto-fit,
                        minmax(
                          255px,
                          1fr
                        )
                      );

                    gap:11px;
                  }


                  .device-card {

                    min-width:0;

                    padding:16px;

                    border-radius:19px;

                    background:
                      linear-gradient(
                        145deg,
                        rgba(255,255,255,.032),
                        rgba(255,255,255,.014)
                      );

                    border:
                      1px solid rgba(255,255,255,.06);

                    box-shadow:
                      inset 0 1px 0 rgba(255,255,255,.025);
                  }


                  .device-card::before {

                    content:"";

                    display:block;

                    height:2px;

                    margin:
                      -16px
                      -16px
                      14px;

                    background:
                      linear-gradient(
                        90deg,
                        var(--device),
                        transparent 80%
                      );

                    opacity:.8;
                  }


                  /* =====================================================
                     HEADER APPAREIL
                     ===================================================== */

                  .device-header {

                    display:flex;

                    align-items:flex-start;

                    justify-content:space-between;

                    gap:10px;
                  }


                  .device-name-block {

                    display:flex;

                    align-items:center;

                    gap:10px;

                    min-width:0;
                  }


                  .device-icon {

                    width:38px;

                    height:38px;

                    flex:none;

                    display:flex;

                    align-items:center;

                    justify-content:center;

                    border-radius:12px;

                    color:
                      var(--device);

                    background:
                      rgba(255,255,255,.035);

                    border:
                      1px solid rgba(255,255,255,.055);
                  }


                  .device-icon ha-icon {
                    --mdc-icon-size:21px;
                  }


                  .device-name {

                    color:#f8fafc;

                    font-size:13px;

                    font-weight:900;
                  }


                  .native-line {

                    display:flex;

                    align-items:center;

                    gap:4px;

                    margin-top:4px;

                    color:#64748b;

                    font-size:5.5px;

                    font-weight:900;

                    letter-spacing:.05em;
                  }


                  .native-dot {

                    width:5px;

                    height:5px;

                    border-radius:50%;

                    background:#35e59d;

                    box-shadow:
                      0 0 6px rgba(53,229,157,.7);
                  }


                  .running {

                    flex:none;

                    font-size:7px;

                    font-weight:900;

                    white-space:nowrap;
                  }


                  /* =====================================================
                     ÉNERGIE / COÛT
                     ===================================================== */

                  .main-values {

                    display:grid;

                    grid-template-columns:
                      1fr 1fr;

                    gap:10px;

                    margin-top:15px;
                  }


                  .energy-value {

                    margin-top:5px;

                    color:
                      var(--device);

                    font-size:22px;

                    font-weight:900;
                  }


                  .cost-block {
                    text-align:right;
                  }


                  .cost-value {

                    margin-top:5px;

                    color:#35e59d;

                    font-size:22px;

                    font-weight:900;
                  }


                  .cost-source {

                    margin-top:3px;

                    color:#526174;

                    font-size:5.5px;

                    font-weight:800;

                    letter-spacing:.06em;
                  }


                  /* =====================================================
                     PUISSANCE
                     ===================================================== */

                  .power-line {

                    display:flex;

                    align-items:center;

                    justify-content:space-between;

                    gap:10px;

                    margin-top:12px;

                    padding-top:10px;

                    border-top:
                      1px solid rgba(255,255,255,.045);

                    color:#64748b;

                    font-size:8px;
                  }


                  .power-line strong {

                    color:#e2e8f0;

                    font-size:9px;
                  }


                  /* =====================================================
                     PART SOLAIRE / RÉSEAU
                     ===================================================== */

                  .source-grid {

                    display:grid;

                    grid-template-columns:
                      1fr 1fr;

                    gap:10px;

                    margin-top:13px;
                  }


                  .source-grid > div {

                    display:flex;

                    flex-direction:column;
                  }


                  .source-grid span {

                    font-size:7px;

                    font-weight:900;
                  }


                  .source-grid strong {

                    margin-top:4px;

                    color:#f1f5f9;

                    font-size:12px;
                  }


                  .source-grid small {

                    margin-top:2px;

                    color:#64748b;

                    font-size:7px;
                  }


                  .solar-label {
                    color:#ff922b;
                  }


                  .grid-label {
                    color:#fb7185;
                  }


                  .source-bar,
                  .split-bar {

                    display:flex;

                    width:100%;

                    height:6px;

                    margin-top:9px;

                    overflow:hidden;

                    border-radius:10px;

                    background:
                      rgba(255,255,255,.05);
                  }


                  .solar-fill {

                    height:100%;

                    background:#ff922b;
                  }


                  .grid-fill {

                    height:100%;

                    background:#fb7185;
                  }


                  /* =====================================================
                     HP / HC
                     ===================================================== */

                  .tariff-title {

                    margin-top:13px;

                    color:#526174;

                    font-size:6px;

                    font-weight:900;

                    letter-spacing:.12em;
                  }


                  .tariff-values {

                    display:grid;

                    grid-template-columns:
                      1fr 1fr;

                    gap:10px;

                    margin-top:8px;
                  }


                  .tariff-values > div {

                    display:flex;

                    flex-direction:column;
                  }


                  .tariff-values span {

                    font-size:7px;

                    font-weight:900;
                  }


                  .tariff-values strong {

                    margin-top:4px;

                    color:#f1f5f9;

                    font-size:12px;
                  }


                  .tariff-values small {

                    margin-top:2px;

                    color:#64748b;

                    font-size:7px;
                  }


                  .hc-label {
                    color:#19d8ff;
                  }


                  .hp-label {
                    color:#ff922b;
                  }


                  .hc-fill {

                    height:100%;

                    background:#19d8ff;
                  }


                  .hp-fill {

                    height:100%;

                    background:#ff922b;
                  }


                  .tariff-unavailable {

                    margin-top:13px;

                    padding:9px;

                    border-radius:10px;

                    color:#526174;

                    background:
                      rgba(255,255,255,.018);

