            const tgtIdx = (() => { let best = -1, bd = 1e9; TABLE.forEach((r, j) => { const dd = Math.abs(r[0] - priTgt); if (dd < bd) { bd = dd; best = j; } }); return has(E.tgt) ? best : -1; })();
