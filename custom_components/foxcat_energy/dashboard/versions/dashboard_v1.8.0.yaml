              .of .mono{font-family:'JetBrains Mono','SF Mono',ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
              .of::before{content:"";position:absolute;top:-80px;right:-60px;width:260px;height:260px;border-radius:50%;background:${col};filter:blur(80px);opacity:${act ? .22 : .08};pointer-events:none}
              .of .hd{position:relative;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
              .of .eye{font-size:10.5px;font-weight:800;letter-spacing:.24em;color:#ff922b}
              .of .h1{margin-top:3px;font-size:22px;font-weight:800;letter-spacing:-.02em;color:#f8fafc}
              .of .st{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:999px;font-size:10.5px;font-weight:800;letter-spacing:.1em;color:${col};background:${col}16;border:1px solid ${col}45}
              .of .st i{position:relative;width:7px;height:7px;border-radius:50%;background:${col}}
              .of .st i::after{content:"";position:absolute;inset:0;border-radius:50%;border:1.5px solid ${col};${act ? AA('of-ping', 1.4, 'ease-out') : 'display:none'}}
              .of .body{position:relative;display:grid;grid-template-columns:200px minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:center;margin-top:14px}
              .of .g{position:relative;width:200px;height:200px}
