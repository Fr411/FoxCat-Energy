                  .r-v small{font-size:17px;color:#94a3b8;font-weight:700;letter-spacing:0;text-shadow:none}
                  .r-t{display:inline-flex;align-items:center;gap:6px;margin-top:9px;padding:5px 10px;border-radius:999px;font-size:11px;font-weight:800;color:${reached ? '#34d399' : '#19d8ff'};background:${reached ? 'rgba(52,211,153,.08)' : 'rgba(25,216,255,.08)'};border:1px solid ${reached ? 'rgba(52,211,153,.25)' : 'rgba(25,216,255,.22)'}}
                  .r-t ha-icon{--mdc-icon-size:14px}
                  .prog{margin-top:10px;height:5px;border-radius:5px;background:rgba(255,255,255,.07);overflow:hidden}
                  .prog i{display:block;height:100%;width:${prog}%;border-radius:5px;background:linear-gradient(90deg,${botColor},${tempColor},#fff,${tempColor});background-size:300% 100%;${A('shine', running ? 2 : 6)}}
                  .r-n{margin-top:8px;color:#64748b;font-size:11px}
                  .r-n b{color:#cbd5e1}
                  .nx{display:flex;align-items:center;gap:12px;margin-top:10px;padding:10px 13px;border-radius:16px;background:linear-gradient(135deg,${nxt.c}18,${nxt.c}05);border:1px solid ${nxt.c}44}
                  .nx-ico{width:34px;height:34px;flex:none;display:grid;place-items:center;border-radius:11px;color:${nxt.c};background:${nxt.c}1f}
                  .nx-ico ha-icon{--mdc-icon-size:19px}
                  .nx-l{color:#8493a8;font-size:9px;font-weight:800;letter-spacing:.16em}
                  .nx-v{margin-top:2px;font-size:19px;line-height:1;font-weight:800;color:${nxt.c}}
                  .nx-s{margin-left:auto;color:#94a3b8;font-size:11px;text-align:right}
                  .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
                  .st{padding:10px 11px;border-radius:14px;background:linear-gradient(160deg,rgba(255,255,255,.04),rgba(255,255,255,.012));border:1px solid rgba(255,255,255,.07)}
                  .st-top{display:flex;align-items:center;gap:6px;color:#7c8ba1;font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
                  .st-top ha-icon{--mdc-icon-size:14px;color:#ff922b}
                  .st b{display:block;margin-top:6px;font-size:15px;font-weight:800}
                  @keyframes wave{from{transform:translateX(0)}to{transform:translateX(-50%)}}
                  @keyframes rise{0%{bottom:2%;transform:translateX(0) scale(.6);opacity:0}15%{opacity:.85}50%{transform:translateX(3px) scale(.9)}75%{transform:translateX(-2px) scale(1)}100%{bottom:94%;transform:translateX(2px) scale(1.15);opacity:0}}
                  @keyframes steam{0%{transform:translateY(16px) scaleX(.5);opacity:0}30%{opacity:.75}100%{transform:translateY(-24px) scaleX(1.7) rotate(8deg);opacity:0}}
                  @keyframes hot{0%,100%{opacity:.7}50%{opacity:1}}
                  @keyframes breath{0%,100%{opacity:.5}50%{opacity:1}}
                  @keyframes spin{to{transform:rotate(360deg)}}
                  @keyframes shine{from{background-position:100% 0}to{background-position:-150% 0}}
                  @media(prefers-reduced-motion:reduce){.bc *,.bc *::before,.bc *::after{animation:none!important}}
                </style>

                <div class="bc">
                  <div class="head">
                    <div class="brand">
                      <div class="logo"><ha-icon icon="mdi:water-boiler"></ha-icon></div>
                      <div><div class="eyebrow">FOXCAT ENERGY · ${esc(mode)}</div><div class="title">Boiler ECS</div></div>
                    </div>
                    <div class="status"><ha-icon icon="${statusIcon}"></ha-icon>${status}</div>
                  </div>

                  <div class="stage">
                    <div class="tank">
                      <div class="steam">${steam}</div>
                      <div class="glass">
                        <div class="water">
                          ${wave(topColor, 'w2')}
                          ${wave(topColor, 'w1')}
                          <div class="inner">${bubbles}</div>
                        </div>
                        <div class="hglow"></div>
                        <svg class="heater" viewBox="0 0 62 30"><path d="M2 15 H12 L17 4 L25 26 L33 4 L41 26 L46 15 H60"/></svg>
                      </div>
                      <div class="pipe t"></div><div class="pipe b"></div>
                    </div>
                    <div class="read">
                      <div class="r-l">TEMPÉRATURE DE L'EAU</div>
                      <div class="r-v">${Number.isFinite(temperature) ? temperature.toFixed(1).replace('.', ',') : '—'}<small> °C</small></div>
                      <div class="r-t"><ha-icon icon="${reached ? 'mdi:check-circle' : 'mdi:target'}"></ha-icon>${reached ? 'Consigne atteinte' : 'Consigne ' + F(target, '°C', 0)}</div>
                      <div class="prog"><i></i></div>
                      <div class="r-n">${Number.isFinite(t) && Number.isFinite(target) && !reached ? `Reste <b>${F(target - t, '°C')}</b> à chauffer` : `Sécurité ${F(safeLimit, '°C', 0)}`}</div>
                    </div>
                  </div>

                  <div class="nx">
                    <div class="nx-ico"><ha-icon icon="${nxt.i}"></ha-icon></div>
                    <div><div class="nx-l">PROCHAIN DÉMARRAGE</div><div class="nx-v">${nxt.v}</div></div>
                    <div class="nx-s">${nxt.s}</div>
                  </div>

                  <div class="grid">
                    ${stat('mdi:flash', 'Puissance', Number.isFinite(power) ? F(power, 'W', 0) : '—', running ? '#fb923c' : '#f1f5f9')}
                    ${stat('mdi:fire-alert', 'Manquant', F(missing, 'kWh', 2))}
                    ${stat('mdi:timer-sand', 'Durée', F(duration, 'h', 2))}
                  </div>
                </div>
              `;
            ]]]
      - type: custom:button-card
        template: fc_panel
        tap_action:
          action: navigate
          navigation_path: appareils
        show_icon: false
        show_name: false
        show_state: false
        triggers_update: all
        custom_fields:
          c: |
            [[[
              /* FOXCAT ENERGY — CHARGES PILOTÉES · carte Accueil (tablette), même modèle que le mobile */
              const DEV = [
                { name: 'Boiler ECS', icon: 'mdi:water-boiler', col: '#fb923c', max: 3000, pw: 'sensor.homefoxcat_load_chauffe_eau', sw: '[[foxcat:legacy.switch_chauffe_eau]]', cy: '', cmd: 'sensor.foxcat_energy_fonctions_utilisateur_boiler_commande_utilisateur', temp: 'sensor.foxcat_energy_boiler_temperature_chauffe_eau' },
                { name: 'Lave-linge', icon: 'mdi:washing-machine', col: '#60a5fa', max: 2200, pw: '[[foxcat:legacy.sensor_lave_linge_puissance]]', sw: '[[foxcat:machines.washer.switch]]', cy: 'sensor.lave_linge_cycle', cmd: 'sensor.foxcat_energy_fonctions_utilisateur_lave_linge_commande_utilisateur' },
                { name: 'Sèche-linge', icon: 'mdi:tumble-dryer', col: '#c4b5fd', max: 2800, pw: '[[foxcat:legacy.sensor_seche_linge_puissance]]', sw: '[[foxcat:machines.dryer.switch]]', cy: 'sensor.seche_linge_cycle', cmd: 'sensor.foxcat_energy_fonctions_utilisateur_seche_linge_commande_utilisateur' },
                { name: 'Lave-vaisselle', icon: 'mdi:dishwasher', col: '#34d399', max: 2200, pw: '[[foxcat:legacy.sensor_lave_vaisselle_puissance]]', sw: '[[foxcat:machines.dishwasher.switch]]', cy: 'sensor.lave_vaisselle_cycle', cmd: 'sensor.foxcat_energy_fonctions_utilisateur_lave_vaisselle_commande_utilisateur' }
              ];
              const IDLE = ['idle','off','none','unknown','unavailable','standby','ready','','termine','terminé','fin'];
              const CMD = { auto: 'AUTO', off: 'ARRÊT', arret: 'ARRÊT', start: 'MARCHE', demarrage: 'MARCHE', on: 'MARCHE', marche: 'MARCHE' };
              const st = (id) => (id && states[id]) ? states[id] : null;
              const val = (id) => st(id)?.state ?? null;
              const num = (id) => { const v = parseFloat(val(id)); return isFinite(v) ? v : null; };
              const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
              const esc = (t) => String(t ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
              const fmt = (w) => w == null ? ['—', ''] : w >= 1000 ? [(w / 1000).toFixed(2).replace('.', ','), 'kW'] : [String(Math.round(w)), 'W'];
              const heat = (v) => v == null ? null : v < 35 ? '#38bdf8' : v < 45 ? '#22d3ee' : v < 55 ? '#fbbf24' : v < 65 ? '#fb923c' : '#f87171';
              const NOW = Date.now() / 1000;
              const ph = (d, o = 0) => `-${((((NOW + o) % d) + d) % d).toFixed(2)}s`;
              const AA = (n, d, tf = 'linear', o = 0) => `animation:${n} ${d}s ${tf} ${ph(d, o)} infinite;`;

              const R = DEV.map((d) => {
                const w = num(d.pw), cyc = val(d.cy), cr = val(d.cmd);
                const plug = st(d.sw) ? val(d.sw) === 'on' : null;
                const cycleOn = cyc != null && !IDLE.includes(String(cyc).toLowerCase());
                const on = (w != null && w > 20) || cycleOn;
                const dead = [d.pw, d.sw].filter(Boolean).every(id => !st(id) || val(id) === 'unavailable');
                const [status, scol] = dead ? ['INDISPONIBLE', '#94a3b8'] : plug === false ? ['PRISE COUPÉE', '#fb7185'] : on ? ['EN MARCHE', d.col] : ['EN VEILLE', '#64748b'];
                const cmd = (cr == null || ['unknown','unavailable'].includes(cr)) ? null : (CMD[String(cr).toLowerCase()] || String(cr).toUpperCase());
                return { ...d, w, on, dead, status, scol, cmd, pct: w != null ? clamp(w / d.max, 0, 1) : 0, t: num(d.temp) };
              });
              const total = R.reduce((s, r) => s + (r.w > 0 ? r.w : 0), 0);
              const nOn = R.filter(r => r.on).length;
              const [tv, tu] = fmt(total);
              const prot = states['binary_sensor.foxcat_energy_machines_machine_protegee_active']?.state === 'on';

              const cells = R.map((r, i) => {
                const [v, u] = fmt(r.w);
                const spin = r.on ? AA('mspin', Math.max(0.9, 3.4 - 2.4 * r.pct), 'linear', i) : '';
                const tcol = r.t != null ? heat(r.t) : null;
                return `
                  <div class="cell ${r.on ? 'on' : ''}" style="--c:${r.col};--s:${r.scol}">
                    <div class="ico"><span class="halo"></span><ha-icon icon="${r.icon}" style="${r.on ? AA('mpulse', 2.2, 'ease-in-out', i) : ''}"></ha-icon>${r.on ? `<svg class="orb" viewBox="0 0 50 50" style="${spin}"><circle cx="25" cy="25" r="23" /></svg>` : ''}</div>
                    <div class="mid">
                      <div class="top"><b>${esc(r.name)}</b><span class="chip">${r.status}</span></div>
                      <div class="bar"><i style="width:${(r.pct * 100).toFixed(0)}%"></i></div>
                      <div class="sub">${r.cmd ? `<em>${r.cmd}</em>` : ''}${tcol ? `<em style="color:${tcol}">${r.t.toFixed(1).replace('.', ',')} °C</em>` : ''}<span>${r.w != null ? Math.round(r.pct * 100) + ' % de ' + (r.max / 1000).toString().replace('.', ',') + ' kW' : 'mesure indisponible'}</span></div>
                    </div>
                    <div class="pw"><b>${v}</b><small>${u}</small></div>
                  </div>`;
              }).join('');

              return `
                <style>
                  *{box-sizing:border-box}
                  ha-icon{display:inline-flex}
                  .fc{padding:16px 16px 14px;color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;text-align:left;background:radial-gradient(120% 80% at 0% 0%,rgba(96,165,250,.12),transparent 55%),radial-gradient(100% 70% at 100% 100%,rgba(167,139,250,.09),transparent 55%)}
                  .hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
                  .eb{color:#ff922b;font-size:9px;font-weight:800;letter-spacing:.2em}
                  .ti{margin-top:3px;font-size:18px;font-weight:800;letter-spacing:-.01em}
                  .tot{text-align:right}
                  .tot b{font-size:24px;font-weight:800;letter-spacing:-.03em;color:${nOn ? '#19d8ff' : '#94a3b8'}}
                  .tot small{font-size:12px;color:#94a3b8;margin-left:3px}
                  .tot div{margin-top:2px;font-size:9px;font-weight:800;letter-spacing:.12em;color:#64748b}
                  .list{display:flex;flex-direction:column;gap:8px}
                  .cell{position:relative;overflow:hidden;display:grid;grid-template-columns:52px minmax(0,1fr) auto;align-items:center;gap:12px;padding:9px 14px 9px 9px;border-radius:18px;background:linear-gradient(135deg,rgba(255,255,255,.035),rgba(255,255,255,.01));border:1px solid rgba(255,255,255,.07)}
                  .cell.on{border-color:color-mix(in srgb,var(--c) 45%,transparent);background:linear-gradient(135deg,color-mix(in srgb,var(--c) 12%,transparent),rgba(255,255,255,.01))}
                  .ico{position:relative;width:52px;height:52px;display:grid;place-items:center;border-radius:16px;color:${'#64748b'};background:rgba(255,255,255,.04)}
                  .cell.on .ico{color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent);box-shadow:0 0 18px color-mix(in srgb,var(--c) 35%,transparent)}
                  .ico ha-icon{--mdc-icon-size:28px;position:relative;z-index:1}
                  .orb{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
                  .orb circle{fill:none;stroke:var(--c);stroke-width:1.6;stroke-dasharray:10 24;stroke-linecap:round;opacity:.8}
                  .mid{min-width:0}
                  .top{display:flex;align-items:center;gap:8px}
                  .top b{font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
                  .chip{padding:3px 7px;border-radius:999px;font-size:8px;font-weight:800;letter-spacing:.08em;white-space:nowrap;color:var(--s);background:color-mix(in srgb,var(--s) 13%,transparent);border:1px solid color-mix(in srgb,var(--s) 35%,transparent)}
                  .bar{height:5px;margin:8px 0 6px;border-radius:5px;background:rgba(255,255,255,.07);overflow:hidden}
                  .bar i{display:block;height:100%;border-radius:5px;background:var(--c);box-shadow:0 0 8px var(--c)}
                  .sub{display:flex;align-items:center;gap:8px;font-size:10px;color:#7c8ba1;white-space:nowrap;overflow:hidden}
                  .sub em{font-style:normal;font-weight:800;font-size:9px;letter-spacing:.06em;color:#cbd5e1;padding:1px 6px;border-radius:6px;background:rgba(255,255,255,.06)}
                  .pw{text-align:right}
                  .pw b{font-size:20px;font-weight:800;letter-spacing:-.02em}
                  .cell.on .pw b{color:var(--c)}
                  .pw small{margin-left:2px;font-size:10px;color:#94a3b8;font-weight:700}
                  .ft{display:flex;align-items:center;gap:8px;margin-top:10px;padding:8px 11px;border-radius:12px;font-size:10px;font-weight:700;color:${prot ? '#35e59d' : '#94a3b8'};background:${prot ? 'rgba(53,229,157,.07)' : 'rgba(255,255,255,.03)'};border:1px solid ${prot ? 'rgba(53,229,157,.25)' : 'rgba(255,255,255,.06)'}}
                  .ft ha-icon{--mdc-icon-size:15px}
                  .ft span:last-child{margin-left:auto;color:#64748b;font-weight:800;letter-spacing:.08em}
                  @keyframes mspin{to{transform:rotate(360deg)}}
                  @keyframes mpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
                  @media(prefers-reduced-motion:reduce){.fc *{animation:none!important}}
                </style>
                <div class="fc">
                  <div class="hd">
                    <div><div class="eb">FOXCAT ENERGY</div><div class="ti">Charges pilotées</div></div>
                    <div class="tot"><b>${tv}</b><small>${tu}</small><div>${nOn} / ${R.length} ACTIVES</div></div>
                  </div>
                  <div class="list">${cells}</div>
                  <div class="ft"><ha-icon icon="${prot ? 'mdi:shield-check' : 'mdi:shield-outline'}"></ha-icon><span>${prot ? 'Protection de cycle active' : 'Protection de cycle inactive'}</span><span>APPUI : DÉTAIL</span></div>
                </div>
              `;
            ]]]
