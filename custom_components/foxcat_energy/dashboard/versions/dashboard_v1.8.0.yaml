        c:
        - width: 100%
    custom_fields:
      c: |
        [[[
          const Z = variables.z;
          const POWER = { etage: '[[foxcat:legacy.sensor_homefoxcat_load_autre]]', rez: 'sensor.homefoxcat_load_toshiba_rez' };
          const GRP = { etage: ['[[foxcat:legacy.climate_chambre_parentale]]', '[[foxcat:legacy.climate_chambre_natheo_2]]', '[[foxcat:legacy.climate_salle_de_bain_2]]'], rez: ['climate.salon_salle_a_manger'] };
          const BAD = ['', 'unknown', 'unavailable'];
          const RUN = ['heating', 'cooling', 'drying', 'preheating', 'defrosting'];
          const fnum = (v) => { const x = parseFloat(v); return isFinite(x) ? x : null; };
          const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
          const dec = (v, d = 1) => v == null ? '—' : v.toFixed(d).replace('.', ',');
          const NOW = Date.now() / 1000;
          const ph = (d, o = 0) => `-${((((NOW + o) % d) + d) % d).toFixed(2)}s`;
          const AA = (n, d, tf = 'linear', o = 0) => `animation:${n} ${d}s ${tf} ${ph(d, o)} infinite;`;
          const MODE = { heat: ['Chauffage', '#fb923c', 'mdi:fire'], cool: ['Clim', '#38bdf8', 'mdi:snowflake'], heat_cool: ['Auto', '#a78bfa', 'mdi:sun-snowflake-variant'], auto: ['Auto', '#a78bfa', 'mdi:sun-snowflake-variant'], dry: ['Déshumid.', '#2dd4bf', 'mdi:water-percent'], fan_only: ['Ventilation', '#94a3b8', 'mdi:fan'], off: ['Arrêt', '#475569', 'mdi:power'] };
          const isRun = (id) => { const z = states[id]; if (!z || BAD.includes(z.state)) return false; const ac = z.attributes?.hvac_action; return ac ? RUN.includes(ac) : !['off', 'fan_only'].includes(z.state); };
          const s = states[Z.id]; const ok = !!s && !BAD.includes(s.state); const at = ok ? (s.attributes || {}) : {};
          const mode = ok ? s.state : 'off'; const m = ok ? (MODE[mode] || [mode, '#94a3b8', 'mdi:thermostat']) : ['Indisponible', '#475569', 'mdi:lan-disconnect'];
          const on = ok && mode !== 'off'; const running = isRun(Z.id);
          const cur = fnum(at.current_temperature), hum = fnum(at.current_humidity), t1 = fnum(at.temperature), lo = fnum(at.target_temp_low), hi = fnum(at.target_temp_high);
          const tgt = t1 ?? (lo != null && hi != null ? (lo + hi) / 2 : null);
          const col = m[1], fan = at.fan_mode ?? null; const pos = (v) => clamp((v - 14) / 16 * 100, 0, 100);
          const gk = GRP.rez.includes(Z.id) ? 'rez' : 'etage'; const gw = fnum(states[POWER[gk]]?.state);
          const solo = GRP[gk].length === 1; const nR = GRP[gk].filter(isRun).length;
          const zw = solo ? gw : (!running ? 0 : gw == null ? null : nR ? (gw > 20 ? gw / nR : 0) : 0);
          const zwTxt = zw == null ? '—' : zw >= 1000 ? (zw / 1000).toFixed(2).replace('.', ',') + ' kW' : Math.round(zw) + ' W';
          const sp = { low: 1.6, medium: 1.1, high: .7, auto: 1.1 }[String(fan).toLowerCase()] || 1.2;
          const air = (running || mode === 'fan_only') ? Array.from({ length: 9 }, (_, k) => `<i style="left:${6 + k * 11}%;${AA('zn-air', +(sp + (k % 3) * .25).toFixed(2), 'ease-in', k * .17)}"></i>`).join('') : '';
          return `
          <style>
            .zn{position:relative;overflow:hidden;padding:14px;border-radius:20px;font-family:Inter,'Segoe UI',system-ui,sans-serif;color:#e2e8f0;text-align:left;box-sizing:border-box;background:${running ? `radial-gradient(120% 90% at 0% 0%,${col}24,transparent 60%),rgba(255,255,255,.03)` : 'rgba(255,255,255,.025)'};border:1px solid ${running ? col + '60' : 'rgba(255,255,255,.07)'};${running ? AA('zn-glow', 3, 'ease-in-out') : ''}}
            .zn *{box-sizing:border-box}.zn ha-icon{display:inline-flex}
            .zn .mono{font-family:'JetBrains Mono','SF Mono',ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
            .zn .t{display:flex;align-items:center;justify-content:space-between;gap:8px}.zn .nm{display:flex;align-items:center;gap:8px;min-width:0}
            .zn .nm ha-icon{--mdc-icon-size:18px;color:#94a3b8}.zn .nm b{font-size:14px;font-weight:800;color:#f8fafc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
            .zn .md{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:999px;font-size:10px;font-weight:800;letter-spacing:.06em;color:${col};background:${col}1c;border:1px solid ${col}45;white-space:nowrap}
            .zn .md ha-icon{--mdc-icon-size:13px}
            .zn .ac{position:relative;margin-top:10px;height:30px;border-radius:10px 10px 14px 14px;background:linear-gradient(180deg,#e5e9f0,#c4ccd8);box-shadow:inset 0 -3px 0 rgba(0,0,0,.12),0 4px 10px rgba(0,0,0,.3);${on ? '' : 'filter:brightness(.5)'}}
            .zn .ac::before{content:"";position:absolute;left:10%;right:10%;bottom:6px;height:3px;border-radius:2px;background:rgba(0,0,0,.25)}
            .zn .ac .l{position:absolute;right:10px;top:8px;width:5px;height:5px;border-radius:50%;background:${on ? col : '#64748b'};box-shadow:${on ? '0 0 6px ' + col : 'none'}}
            .zn .ac .d{position:absolute;left:10px;top:6px;font-size:10px;font-weight:700;color:#0f172a}
            .zn .air{position:relative;height:26px;overflow:hidden;margin:0 8%}.zn .air i{position:absolute;top:0;width:2px;height:16px;border-radius:2px;background:linear-gradient(180deg,${running ? col : 'rgba(148,163,184,.4)'},transparent);opacity:0}
            .zn .v{display:flex;align-items:baseline;justify-content:space-between;gap:8px}.zn .cur{font-size:30px;font-weight:700;line-height:1;color:#f8fafc}.zn .cur small{font-size:14px;color:#64748b}
            .zn .tg{text-align:right;font-size:10px;font-weight:800;letter-spacing:.1em;color:#64748b}.zn .tg b{display:block;margin-top:1px;font-size:16px;color:${col}}
            .zn .bar{position:relative;height:6px;margin-top:10px;border-radius:6px;background:linear-gradient(90deg,#38bdf8,#22d3ee 30%,#34d399 50%,#fbbf24 70%,#fb7185)}
            .zn .bar .c{position:absolute;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px #0b1220,0 0 8px #fff}
            .zn .bar .g{position:absolute;top:-4px;width:2px;height:14px;margin-left:-1px;border-radius:2px;background:${col};box-shadow:0 0 6px ${col}}
            .zn .ft{display:flex;justify-content:space-between;gap:8px;margin-top:10px;font-size:11px;color:#64748b}.zn .ft b{color:${running ? col : '#94a3b8'}}
            @media (prefers-reduced-motion:reduce){.zn,.zn *{animation:none!important}}
            @keyframes zn-glow{0%,100%{box-shadow:0 0 0 0 ${col}00}50%{box-shadow:0 0 22px 0 ${col}38}}
            @keyframes zn-air{0%{transform:translateY(-6px);opacity:0}25%{opacity:.9}100%{transform:translateY(24px);opacity:0}}
          </style>
          <div class="zn">
            <div class="t"><div class="nm"><ha-icon icon="${Z.icon}"></ha-icon><b>${Z.name}</b></div><span class="md"><ha-icon icon="${m[2]}"></ha-icon>${m[0]}</span></div>
            <div class="ac"><span class="d mono">${on && tgt != null ? dec(tgt) + '°' : ''}</span><span class="l"></span></div>
            <div class="air">${air}</div>
            <div class="v"><div class="cur mono">${dec(cur)}<small>°C</small></div><div class="tg">CONSIGNE<b class="mono">${on ? (tgt != null ? dec(tgt) + '°' : '—') : '—'}</b></div></div>
            <div class="bar">${tgt != null && on ? `<span class="g" style="left:${pos(tgt)}%"></span>` : ''}${cur != null ? `<span class="c" style="left:${pos(cur)}%"></span>` : ''}</div>
            <div class="ft"><span><b>${running ? 'En demande' : 'Au repos'}</b> · ≈ ${zwTxt}</span><span>${hum != null ? Math.round(hum) + ' %' : ''}${fan ? ' · ' + fan : ''}</span></div>
          </div>`;
        ]]]
