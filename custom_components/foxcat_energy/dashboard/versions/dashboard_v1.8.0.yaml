                  <div class="grp"><div class="gp"><span>TOSHIBA ÉTAGE</span><b class="mono">+${dec(oE)} °C</b></div><div class="gp"><span>TOSHIBA REZ</span><b class="mono">+${dec(oR)} °C</b></div></div>
                </div>
                <div class="cps">
                  ${chip('mdi:stairs-up', 'Pas', dec(step) + ' °C')}${chip('mdi:timer-outline', 'Délai', delay == null ? '—' : Math.round(delay) + ' s')}
