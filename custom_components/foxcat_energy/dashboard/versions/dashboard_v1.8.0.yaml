                  </div>
                  <div class="bt" style="margin-top:14px"><span>COURANTS PAR PHASE</span><small>DÉSÉQUILIBRE ${nf(imb, 0)} %</small></div>
                  <div class="phs">${phase(0)}${phase(1)}${phase(2)}</div>
                  <div class="bt" style="margin-top:14px"><span>RÉPARTITION DE LA PRODUCTION</span><small>${pw(acW)} AC</small></div>
                  <div class="sb">${acW > 30 ? `<i style="flex:${Math.max(toHouse, 1)};background:#21d7ff;box-shadow:0 0 8px #21d7ff88"></i><i style="flex:${Math.max(exp, 0.001)};background:#36e59b;box-shadow:0 0 8px #36e59b88"></i>` : ''}</div>
                  <div class="lg"><span><i style="background:#21d7ff"></i>Maison <b class="mono">${pw(toHouse)}</b></span><span><i style="background:#36e59b"></i>Injection <b class="mono">${pw(exp)}</b></span><span><i style="background:#fb7185"></i>Import réseau <b class="mono">${pw(imp)}</b></span></div>
                  <div class="bt" style="margin-top:14px"><span>TENSIONS DU RÉSEAU</span><small>MESURÉES PAR L'ONDULEUR</small></div>
                  <div class="vts">${[['AN', Un[0]], ['BN', Un[1]], ['CN', Un[2]], ['AB', Ul[0]], ['BC', Ul[1]], ['CA', Ul[2]]].map((v) => `<div class="vt"><span>${v[0]}</span><b class="mono">${Number.isFinite(v[1]) ? nf(v[1], 0) + ' V' : '—'}</b></div>`).join('')}</div>
                </div>
              </div>

              <div class="acks">${ack('ACK RRCR', E.ackRrcr)}${ack('ONDULEUR', E.ackInv)}${ack('RÉSEAU', E.ackGrid)}${ack('LOGO', E.ackLogo)}${ack('COMMANDE', E.avail)}</div>

              <div class="dec">
