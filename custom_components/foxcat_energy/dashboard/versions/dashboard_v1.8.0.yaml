                  legacy_hc: 'sensor.foxcat_energy_energie_chauffe_eau_consommation_hc_aujourdhui',
                  legacy_hp: 'sensor.foxcat_energy_energie_chauffe_eau_consommation_hp_aujourdhui'
                },

