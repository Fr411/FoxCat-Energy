            show:
              extremas: false
            data_generator: |
              if (!entity || !entity.attributes || !entity.attributes.today) return []; const rows = [...(entity.attributes.today || []), ...(entity.attributes.tomorrow || [])]; const valid = rows.filter(r => r.start != null && Number.isFinite(Number(r.all_in))).map(r => ({t: new Date(r.start).getTime(), p: Number(r.all_in)})); if(valid.length === 0) return []; const maxP = Math.max(...valid.map(v => v.p)); const now = new Date(); now.setMinutes(0,0,0); const future = valid.filter(r => r.t >= now.getTime()); if(future.length === 0) return []; let bestTime = future[0].t; let minP = future[0].p; for(let r of future) { if(r.p < minP) { minP = r.p; bestTime = r.t; } } return valid.map(r => [r.t, r.t === bestTime ? maxP : 0]);
