    - type: custom:button-card
      template: fc_panel
      triggers_update: all
      custom_fields:
        c: |
          [[[
            const OU = { model: 'RAS-3M18G3AVG-E', ports: 3 };
            const POWER = { etage: '[[foxcat:legacy.sensor_homefoxcat_load_autre]]', rez: 'sensor.homefoxcat_load_toshiba_rez' };
            const EP = 'sensor.foxcat_energy_energie_toshiba_';
            const G = [
              { name: 'Groupe 1', sub: 'Étage', key: 'etage', maxW: 2500, cost: 'sensor.foxcat_energy_tarification_toshiba_cout_aujourdhui', tarif: 'sensor.foxcat_energy_tarification_toshiba_tarif_actuel', zones: ['[[foxcat:legacy.climate_chambre_parentale]]', '[[foxcat:legacy.climate_chambre_natheo_2]]', '[[foxcat:legacy.climate_salle_de_bain_2]]'] },
              { name: 'Groupe 2', sub: 'Rez-de-chaussée', key: 'rez', maxW: 1500, cost: 'sensor.foxcat_energy_tarification_toshiba_rez_cout_aujourdhui', tarif: 'sensor.foxcat_energy_tarification_toshiba_rez_tarif_actuel', zones: ['climate.salon_salle_a_manger'] }
            ];
            const GC = { etage: '#818cf8', rez: '#2dd4bf' };
            const BAD = ['', 'unknown', 'unavailable'];
            const num = (id) => { const v = parseFloat(states[id]?.state); return isFinite(v) ? v : null; };
            const kv = (id) => { const v = num(id); if (v == null) return null; return states[id]?.attributes?.unit_of_measurement === 'Wh' ? v / 1000 : v; };
            const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
            const dec = (v, d = 1) => v == null ? '—' : v.toFixed(d).replace('.', ',');
            const eur = (v) => v == null ? '—' : v.toFixed(2).replace('.', ',') + ' €';
            const fmtW = (v) => v == null ? ['—', ''] : v >= 1000 ? [(v / 1000).toFixed(2).replace('.', ','), 'kW'] : [String(Math.round(v)), 'W'];
            const NOW = Date.now() / 1000;
            const ph = (d, o = 0) => `-${((((NOW + o) % d) + d) % d).toFixed(2)}s`;
            const AA = (n, d, tf = 'linear', o = 0) => `animation:${n} ${d}s ${tf} ${ph(d, o)} infinite;`;
            const zrun = (id) => { const z = states[id]; if (!z || BAD.includes(z.state)) return null; const m = z.state, a = z.attributes?.hvac_action; const run = a ? ['heating', 'cooling', 'drying', 'preheating', 'defrosting'].includes(a) : !['off', 'fan_only'].includes(m); return { run, heat: run && (['heating', 'preheating'].includes(a) || (!a && m === 'heat')), cool: run && (a === 'cooling' || (!a && m === 'cool')), on: m !== 'off' }; };
            const text = num('sensor.temperature_exterieure');
            const PW = { etage: num(POWER.etage), rez: num(POWER.rez) };
            const w = (PW.etage ?? 0) + (PW.rez ?? 0);
            const live = w > 40;
            const costT = (kv(G[0].cost) ?? 0) + (kv(G[1].cost) ?? 0);
            const unit = (g, i) => {
              const gw = PW[g.key], active = gw != null && gw > 40;
              const zs = g.zones.map(zrun).filter(Boolean);
              const heat = zs.some(z => z.heat), cool = zs.some(z => z.cool), run = zs.filter(z => z.run).length;
              const col = heat && cool ? '#f43f5e' : heat ? '#fb923c' : cool ? '#38bdf8' : zs.some(z => z.on) ? '#94a3b8' : '#475569';
              const lbl = heat && cool ? 'CONFLIT' : heat ? 'CHAUFFE' : cool ? 'REFROIDIT' : zs.some(z => z.on) ? 'EN VEILLE' : 'ARRÊT';
              const gp = gw != null ? clamp(gw / g.maxW, 0, 1) : 0;
              const sp = +clamp(2.2 - 1.8 * gp, .35, 2.2).toFixed(2);
              const fc = active ? col : '#334155';
              const blades = [0, 72, 144, 216, 288].map(r => `<path d="M50 50 C 47 38, 52 28, 60 27 C 62 36, 57 44, 50 50 Z" fill="${fc}" opacity="${active ? .85 : .6}" transform="rotate(${r} 50 50)"/>`).join('');
              const e = kv(`${EP}${g.key}_energie_aujourdhui`), sl = kv(`${EP}${g.key}_part_solaire_aujourdhui`), gr = kv(`${EP}${g.key}_part_reseau_aujourdhui`);
              const src = (sl ?? 0) + (gr ?? 0), sp2 = src > 0 ? (sl ?? 0) / src : 0;
              const [gv, gu] = fmtW(gw);
              return `<div class="ou ${active ? 'on' : ''}" style="--c:${col};--gc:${GC[g.key]}">
                <div class="oh"><div><b><i class="gd"></i>${g.name}</b><span>${g.sub} · ${OU.model}</span></div><em>${lbl}</em></div>
                <div class="box"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="#050a14" stroke="rgba(255,255,255,.1)" stroke-width="2"/><g style="transform-origin:50px 50px;${active ? AA('cl-spin', sp) : ''}">${blades}</g><circle cx="50" cy="50" r="7" fill="#1e293b" stroke="${fc}" stroke-width="2"/></svg></div>
                <div class="om"><div><span>PUISSANCE</span><b class="mono">${gv}<small>${gu}</small></b></div><div class="r"><span>${run}/${g.zones.length} UNITÉS</span><b class="mono">${eur(kv(g.cost))}</b></div></div>
                <div class="gb"><i style="width:${gp * 100}%"></i></div>
                <div class="ge"><div><span>AUJOURD'HUI</span><b class="mono">${dec(e, 2)}<small>kWh</small></b></div><div class="r"><div class="sb"><i style="width:${sp2 * 100}%"></i></div><em class="mono">${src > 0 ? Math.round(sp2 * 100) + ' % solaire' : '—'}</em></div></div>
                <div class="tr">Tarif <b>${states[g.tarif]?.state ?? '—'}</b></div></div>`;
            };
            const [wv, wu] = fmtW(w || null);
            return `
            <style>
              .cl{position:relative;padding:18px 20px;font-family:Inter,'Segoe UI',system-ui,sans-serif;color:#e2e8f0;text-align:left}
              .cl *{box-sizing:border-box}.cl ha-icon{display:inline-flex}
