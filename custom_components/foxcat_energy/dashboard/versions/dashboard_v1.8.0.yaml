                  <div class="code"><span>CODE<br>L4 → L1</span><div class="cd">${String(codeTxt).split('').map((b, i) => `<div class="cdd ${b === '1' ? 'on' : ''}"><b class="mono">${esc(b)}</b><em>${['L4', 'L3', 'L2', 'L1'][i] || ''}</em></div>`).join('')}</div></div>
                  <div class="tbl"><div class="th"><span>NIVEAU</span><span></span><span style="text-align:right">P.OUT MAX</span><span>L4-L1</span><span></span></div>${rows}</div>
                </div>
                <div class="bx">
                  <div class="bt"><span>MESURES ONDULEUR</span><small>${has(E.vendor) ? 'CODE VENDEUR ' + esc(text(E.vendor)) : ''}</small></div>
