                    <div class="kp" style="--c:${effC}"><div class="kt"><ha-icon icon="mdi:swap-horizontal-bold"></ha-icon>Rendement</div><div class="eff">${ring}<div class="ks" style="margin:0">DC ${pw(dcW)}<br>AC ${pw(acW)}</div></div></div>
