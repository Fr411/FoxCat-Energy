                ||
                null;


              /* ==========================================================
                 RECHERCHE AUTOMATIQUE
                 ========================================================== */

              const entityText = (id) => {

                const s =
                  states[id];

                return norm(
                  `${id} ${s?.attributes?.friendly_name || ''}`
                );
              };


              const findEntity = (
                domain,
                requiredWords = [],
                candidates = [],
                rejectedWords = []
              ) => {

                for (
                  const id
                  of candidates
                ) {

                  if (
                    states[id]
                  ) {
                    return id;
                  }
                }


                const wanted =
                  requiredWords
                    .map(norm)
                    .filter(Boolean);


                const rejected =
                  rejectedWords
                    .map(norm)
                    .filter(Boolean);


                return (
                  Object.keys(states)

                    .filter(
                      (id) =>
                        id.startsWith(
                          `${domain}.`
                        )
                    )

                    .find(
                      (id) => {

                        const text =
                          entityText(id);


                        return (
                          wanted.every(
                            (w) =>
                              text.includes(w)
                          )
                          &&
                          !rejected.some(
                            (w) =>
                              text.includes(w)
                          )
                        );
                      }
                    )
                  ||
                  null
                );
              };


              const findFox = (
                domain,
                requiredWords = [],
                candidates = [],
                rejectedWords = []
              ) => {

                /*
                 * 1 — Registre prioritaire.
                 */

                for (
                  const id
                  of candidates
                ) {

                  if (
                    states[id]
                  ) {
                    return id;
                  }
                }


                /*
                 * 2 — Recherche automatique FoxCat.
                 */

                const wanted =
                  requiredWords
                    .map(norm)
                    .filter(Boolean);


                const rejected =
                  rejectedWords
                    .map(norm)
                    .filter(Boolean);


                return (
                  Object.keys(states)

                    .filter(
                      (id) =>
                        id.startsWith(
                          `${domain}.`
                        )
                    )

                    .find(
                      (id) => {

                        const text =
                          entityText(id);


                        const fox =
                          text.includes(
                            'foxcat energy'
                          )
                          ||
                          norm(id).includes(
                            'foxcat energy'
                          );


                        return (
                          fox
                          &&
                          wanted.every(
                            (w) =>
                              text.includes(w)
                          )
                          &&
                          !rejected.some(
                            (w) =>
                              text.includes(w)
                          )
                        );
                      }
                    )
                  ||
                  null
                );
              };


              const findPowerSensor = (
                deviceWords = [],
                candidates = []
              ) => {

                /*
                 * Registre / anciennes entités prioritaires.
                 */

                for (
                  const id
                  of candidates
                ) {

                  if (
                    states[id]
                  ) {
                    return id;
                  }
                }


                const wanted =
                  deviceWords
                    .map(norm)
                    .filter(Boolean);


                return (
                  Object.keys(states)

                    .filter(
                      (id) =>
                        id.startsWith(
                          'sensor.'
                        )
                    )

                    .find(
                      (id) => {

                        const s =
                          states[id];


                        const text =
                          entityText(id);


                        const unit =
                          s?.attributes?.unit_of_measurement
                          ||
                          '';


                        const cls =
                          s?.attributes?.device_class
                          ||
                          '';


                        return (
                          wanted.some(
                            (w) =>
                              text.includes(w)
                          )
                          &&
                          (
                            cls === 'power'
                            ||
                            unit === 'W'
                            ||
                            unit === 'kW'
                          )
                        );
                      }
                    )
                  ||
                  null
                );
              };


              /* ==========================================================
                 GESTION FOXCAT
                 ========================================================== */

              const management = (
                words,
                legacy = null,
                preferred = null
              ) => {

                /*
                 * 1 — Entité renseignée dans le registre.
                 * 2 — Détection automatique FoxCat.
                 */

                const native =
                  findFox(
                    'switch',
                    words,
                    entityList(
                      preferred
                    )
                  );


                if (
                  native
                ) {

                  return {

                    entity:
                      native,

                    enabled:
                      isOn(native),

                    native:
                      true
                  };
                }


                /*
                 * Secours legacy.
                 */

                const legacyEntity =
                  firstExisting(
                    legacy
                  );


                if (
                  legacyEntity
                ) {

                  return {

                    entity:
                      legacyEntity,

                    enabled:
                      isOn(
                        legacyEntity
                      ),

                    native:
                      false
                  };
                }


                return {

                  entity:
                    null,

                  enabled:
                    false,

                  native:
                    false
                };
              };


              /* ==========================================================
                 CONTEXTE FOXCAT
                 ========================================================== */

              const modeEntity =
                findFox(
                  'select',
                  [
                    'mode',
