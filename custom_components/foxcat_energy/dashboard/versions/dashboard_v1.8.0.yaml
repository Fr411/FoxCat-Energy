              @keyframes oc-tilt{0%,100%{transform:rotate(-2.4deg)}50%{transform:rotate(2.4deg)}} @keyframes oc-tilt2{0%,100%{transform:rotate(-4.5deg) translateY(1px)}50%{transform:rotate(4.5deg)}} @keyframes oc-droop{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(3px) rotate(1deg)}} @keyframes oc-blink2{0%,86%,100%{transform:scaleY(1)}88%{transform:scaleY(.08)}90%{transform:scaleY(1)}92%{transform:scaleY(.08)}94%{transform:scaleY(1)}} @keyframes oc-brow{0%,70%,100%{transform:translateY(0)}80%,90%{transform:translateY(-4px)}} @keyframes oc-browb{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}} @keyframes oc-laugh{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.6)}} @keyframes oc-smile{0%,100%{transform:scaleX(1) scaleY(1)}50%{transform:scaleX(1.12) scaleY(1.15)}} @keyframes oc-rise{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:1}100%{transform:translateY(-58px) scale(1.1);opacity:0}} @keyframes oc-note{0%{transform:translate(0,0) rotate(-8deg);opacity:0}15%{opacity:1}50%{transform:translate(8px,-26px) rotate(8deg)}100%{transform:translate(-4px,-54px) rotate(-8deg);opacity:0}} @keyframes oc-rain{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(46px);opacity:0}} @keyframes oc-puff{0%{transform:translateY(0) scale(.4);opacity:0}25%{opacity:.7}100%{transform:translateY(-52px) scale(1.5);opacity:0}} @keyframes oc-spin{to{transform:rotate(360deg)}} @keyframes oc-pup{0%,100%{transform:scale(1)}50%{transform:scale(1.5)}} @keyframes oc-bang{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-7px) scale(1.15)}} @keyframes oc-sway{0%,100%{transform:rotate(calc(var(--a) * -1))}50%{transform:rotate(var(--a))}} @keyframes oc-flick{0%{opacity:1}50%{opacity:.15}}
            </style>
            <div class="oc">
