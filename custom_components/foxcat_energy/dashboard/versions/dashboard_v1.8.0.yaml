- type: panel
  title: Boiler ECS
  path: boiler
  icon: mdi:water-boiler
  subview: true
  cards:
  - type: vertical-stack
    cards:
    - type: custom:button-card
      template: fc_panel
      styles:
        card:
        - border-radius: 18px 18px 0 0
      custom_fields:
        c: |
          [[[
            const OUTDOOR = 'weather.momignies'; // <- adapte ton entité météo
            const d = new Date();
            const date = d.toLocaleDateString('fr-BE',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
            const time = d.toLocaleTimeString('fr-BE',{hour:'2-digit',minute:'2-digit'});
            const temp = states[OUTDOOR]?.attributes?.temperature;
            return `
            <div class="p" style="display:flex;align-items:center;justify-content:space-between;padding:12px 20px">
              <div style="display:flex;align-items:center;gap:12px">
                <div class="img" style="width:44px;height:44px;background-image:url(/homeassistant/custom_components/foxcat_energy/dashboard/assets/hero_house.webp)"></div>
                <div>
                  <div style="font-size:20px;font-weight:800;letter-spacing:.04em"><span style="color:#38bdf8">FOX</span>CAT <span style="font-weight:500">ENERGY</span></div>
                  <div class="k">Home Assistant • EMS intelligent</div>
                </div>
              </div>
              <div style="display:flex;align-items:center;gap:28px">
                <div style="text-align:right"><div class="k">${date}</div><div style="font-size:20px;font-weight:600">${time}</div></div>
                <div style="text-align:right"><div style="font-size:18px;font-weight:700"><span class="o">☀</span> ${temp!==undefined?Number(temp).toFixed(1).replace('.',','):'—'} °C</div><div class="k">Extérieur</div></div>
              </div>
            </div>`;
          ]]]
    - type: custom:button-card
      template: fc_navbar
    - type: custom:button-card
      template: fc_head
      variables:
        title: Boiler ECS
        subtitle: Température · Chauffe · Historique
        icon: mdi:water-boiler
        color: '#fb923c'
    - type: custom:button-card
      entity: sensor.foxcat_energy_boiler_temperature_chauffe_eau
      show_name: false
      show_icon: false
      show_state: false
      triggers_update: all
      tap_action:
        action: more-info
        entity: sensor.foxcat_energy_boiler_temperature_chauffe_eau
      hold_action:
        action: more-info
        entity: sensor.foxcat_energy_boiler_etat_dexecution_chauffe_eau
      styles:
        card:
        - padding: 0
        - border-radius: 30px
        - overflow: hidden
        - color: '#f8fafc'
        - border: 1px solid rgba(255,255,255,0.09)
        - box-shadow: 0 24px 60px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.06)
        - background: 'radial-gradient(110% 70% at 0% 0%, rgba(255,120,20,0.10), transparent 52%), radial-gradient(100% 70% at 100% 100%, rgba(0,210,255,0.10), transparent 55%), linear-gradient(160deg, #0f1a2e 0%, #0a1222 55%, #060b16 100%)'
        grid:
        - grid-template-areas: '"card"'
        - grid-template-columns: 1fr
        custom_fields:
          card:
          - width: 100%
      custom_fields:
        card: |
          [[[
            const BAD = ['unknown', 'unavailable', 'none', ''];
            const S = (id, fb = '—') => { const v = states[id]?.state; return (!v || BAD.includes(v)) ? fb : v; };
            const N = (id) => { const v = parseFloat(states[id]?.state); return Number.isFinite(v) ? v : NaN; };
            const on = (id) => states[id]?.state === 'on';
            const clamp = (n, a = 0, b = 100) => Math.min(b, Math.max(a, Number(n) || 0));
            const F = (v, unit = '', d = 1) => Number.isFinite(v) ? `${v.toFixed(d).replace('.', ',')}${unit ? ' ' + unit : ''}` : '—';
            const esc = (v) => String(v ?? '—').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

            const NOW = Date.now() / 1000;
            const ph = (d, o = 0) => `-${((NOW + o) % d).toFixed(2)}s`;
            const A = (name, d, timing = 'linear', o = 0, extra = 'infinite') => `animation:${name} ${d}s ${timing} ${ph(d, o)} ${extra}`;

            const temperature = N('sensor.foxcat_energy_boiler_temperature_chauffe_eau');
            const power = N('[[foxcat:legacy.sensor_foxcat_energy_boiler_puissance_chauffe_eau]]');
            const estimatedTemperature = N('sensor.foxcat_energy_boiler_boiler_temperature_thermique_estimee');
            const missingEnergy = N('sensor.foxcat_energy_boiler_boiler_energie_thermique_manquante');
            const duration = N('sensor.foxcat_energy_boiler_boiler_duree_de_chauffe_estimee');
            const confidence = N('sensor.foxcat_energy_boiler_boiler_confiance_estimation');
            const capacity = N('sensor.foxcat_energy_boiler_boiler_capacite_thermique_confort');
            const nominalPower = N('sensor.foxcat_energy_boiler_boiler_puissance_nominale_resistance');
            const target = N('[[foxcat:legacy.number_foxcat_energy_boiler_temperature_confort_boiler]]');
            const safeLimit = N('[[foxcat:legacy.number_foxcat_energy_boiler_securite_temperature_boiler]]');

            const mode = S('[[foxcat:ems.mode]]', 'Indisponible');
            const demand = S('[[foxcat:legacy.sensor_foxcat_energy_boiler_demande_chauffe_eau]]', 'Aucune');
            const origin = S('[[foxcat:legacy.sensor_foxcat_energy_boiler_origine_de_la_demande_chauffe_eau]]', 'Non définie');
            const execution = S('sensor.foxcat_energy_boiler_etat_dexecution_chauffe_eau', 'Indisponible');
            const securitySource = S('sensor.foxcat_energy_boiler_source_securite_thermique', 'Indisponible');

            const securityActive = on('binary_sensor.foxcat_energy_boiler_securite_thermique_resistance');
            const physical = on('[[foxcat:legacy.binary_sensor_foxcat_energy_boiler_boiler_physique]]');
            const ecsEnabled = on('[[foxcat:legacy.switch_foxcat_energy_boiler_boiler_ecs_active]]');
            const managed = on('[[foxcat:legacy.switch_foxcat_energy_boiler_boiler_gere_par_foxcat]]');
            const authorizedHC = on('switch.foxcat_energy_boiler_boiler_autorise_en_heures_creuses');

            const running = physical && Number.isFinite(power) && power > 100;
            const t = Number.isFinite(temperature) ? temperature : estimatedTemperature;
            const steamOn = running || (Number.isFinite(t) && t >= 50);

            const T_MIN = 20;
            const T_MAX = Math.max(70, Number.isFinite(safeLimit) ? Math.ceil(safeLimit / 5) * 5 : 70);
            const pos = (v) => clamp(((v - T_MIN) / (T_MAX - T_MIN)) * 100);
            const fill = Number.isFinite(t) ? pos(t) : 0;

            const heat = (v) => {
              if (!Number.isFinite(v)) return '#64748b';
              if (v < 35) return '#38bdf8';
              if (v < 45) return '#22d3ee';
              if (v < 55) return '#fbbf24';
              if (v < 65) return '#fb923c';
              return '#f87171';
            };
            const tempColor = securityActive ? '#f87171' : heat(t);
            const topColor = securityActive ? '#f87171' : heat(t + 6);
            const botColor = heat(t - 14);
            const runColor = securityActive ? '#f87171' : running ? '#fb923c' : '#64748b';

            const reached = Number.isFinite(target) && Number.isFinite(t) && t >= target;

            const plannerAttr = states['sensor.foxcat_energy_machines_planificateur_charges_flexibles']?.attributes || {};
            const dayAheadAttr = states['sensor.foxcat_energy_tarification_planificateur_day_ahead']?.attributes || {};
            const nowD = new Date();
            const segs = (plannerAttr.boiler?.segments || [])
              .map((s) => ({ a: new Date(s.start), b: new Date(s.end) }))
              .filter((s) => !isNaN(s.a) && s.b > nowD)
              .sort((x, y) => x.a - y.a);
            let startAt = segs.length ? segs[0].a : null;
            if (!startAt && dayAheadAttr.boiler_creneau_reserve_debut) {
              const d = new Date(dayAheadAttr.boiler_creneau_reserve_debut);
              if (!isNaN(d) && d > nowD) startAt = d;
            }
            const startNow = !running && !!startAt && startAt <= nowD;
            const hm = (d) => d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
            const dayLabel = (d) => {
              const t0 = new Date(nowD.getFullYear(), nowD.getMonth(), nowD.getDate());
              const diff = Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - t0) / 864e5);
              return diff === 0 ? "Aujourd'hui" : diff === 1 ? 'Demain' : d.toLocaleDateString('fr-FR', { weekday: 'long' });
            };
            const until = (d) => {
              const m = Math.max(0, Math.round((d - nowD) / 60000));
              return m < 60 ? `dans ${m} min` : `dans ${Math.floor(m / 60)} h ${String(m % 60).padStart(2, '0')}`;
            };
            const nxt = running
              ? { v: 'En chauffe', s: Number.isFinite(duration) ? `fin estimée dans ${F(duration, 'h', 2)}` : 'chauffe en cours', c: '#fb923c', i: 'mdi:fire' }
              : securityActive
              ? { v: 'Bloqué', s: 'sécurité thermique active', c: '#f87171', i: 'mdi:shield-alert' }
              : startNow
              ? { v: 'Maintenant', s: 'créneau favorable en cours', c: '#34d399', i: 'mdi:play-circle' }
              : startAt
              ? { v: hm(startAt), s: `${dayLabel(startAt)} · ${until(startAt)}`, c: '#19d8ff', i: 'mdi:clock-start' }
              : { v: '—', s: reached ? 'consigne atteinte, aucun besoin' : 'aucun démarrage planifié', c: '#64748b', i: 'mdi:clock-outline' };

            const status = securityActive ? 'SÉCURITÉ THERMIQUE' : running ? 'CHAUFFE EN COURS' : physical ? 'EN ATTENTE' : 'BALLON NON DÉTECTÉ';
            const statusIcon = securityActive ? 'mdi:shield-alert' : running ? 'mdi:fire' : physical ? 'mdi:pause-circle-outline' : 'mdi:help-circle-outline';

            const powerPct = (Number.isFinite(power) && Number.isFinite(nominalPower) && nominalPower > 0) ? clamp((power / nominalPower) * 100) : 0;
            const chargePct = (Number.isFinite(capacity) && capacity > 0 && Number.isFinite(missingEnergy)) ? clamp((1 - missingEnergy / capacity) * 100) : (reached ? 100 : 0);
            const confPct = Number.isFinite(confidence) ? clamp(confidence) : 0;

            const R = 28, C = 2 * Math.PI * R;
            const ring = (pct, color, label, sub, val, spin = false) => `
              <div class="rg">
                <svg viewBox="0 0 72 72" class="ring">
                  ${spin ? `<circle cx="36" cy="36" r="34" class="ring-spin" style="stroke:${color}"/>` : ''}
                  <circle cx="36" cy="36" r="${R}" class="ring-bg"/>
                  <circle cx="36" cy="36" r="${R}" class="ring-fg" transform="rotate(-90 36 36)" style="stroke:${color};filter:drop-shadow(0 0 4px ${color});stroke-dasharray:${(pct / 100 * C).toFixed(1)} ${C.toFixed(1)}"/>
                  <text x="36" y="41" class="ring-num">${val}</text>
                </svg>
                <div class="rg-l">${label}</div>
                <div class="rg-s">${sub}</div>
              </div>`;

            const stat = (icon, label, value, color = '#f1f5f9', cls = '') => `
              <div class="st"><div class="st-top"><ha-icon class="${cls}" icon="${icon}"></ha-icon><span>${label}</span></div><b style="color:${color}">${value}</b></div>`;

            const pill = (label, ok, yes = 'OUI', no = 'NON', warn = false) => {
              const c = ok ? '#34d399' : (warn ? '#f87171' : '#64748b');
              return `<div class="pl ${ok ? 'ok' : ''} ${!ok && warn ? 'ko' : ''}" style="--c:${c}"><i></i><span>${label}</span><b>${ok ? yes : no}</b></div>`;
            };

            const row = (label, value) => `<div class="row"><span>${label}</span><b>${esc(value)}</b></div>`;

            const nb = running ? 12 : (physical ? 4 : 0);
            const bubbles = Array.from({ length: nb }, (_, i) => {
              const left = 10 + ((i * 37) % 78);
              const dur = running ? +(2.6 + ((i * 53) % 25) / 10).toFixed(1) : 6 + (i % 3);
              const size = running ? 3 + ((i * 7) % 7) : 3;
              return `<span class="bub" style="left:${left}%;width:${size}px;height:${size}px;${A('rise', dur, 'ease-in', i * 0.83)}"></span>`;
            }).join('');

            const steam = steamOn ? [0, 1, 2].map((i) =>
              `<span class="stm" style="left:${28 + i * 20}%;${A('steam', +(3.4 + i * 0.6).toFixed(1), 'ease-out', i * 1.3)}"></span>`
            ).join('') : '';

            const CABLE = 'M2 14 C 16 14, 20 30, 32 30 S 48 14, 58 14';
            const electrons = running ? [0, 1, 2, 3].map((i) =>
              `<circle r="2.4" class="el"><animateMotion dur="1.2s" repeatCount="indefinite" begin="${ph(1.2, i * 0.3)}" path="${CABLE}"/></circle>`
            ).join('') : '';

            const wave = (col, cls) => `
              <svg class="wave ${cls}" viewBox="0 0 200 20" preserveAspectRatio="none">
                <path d="M0 10 Q 25 0 50 10 T 100 10 T 150 10 T 200 10 V 20 H 0 Z" fill="${col}"/>
              </svg>`;

            const mark = (v, color, label) => Number.isFinite(v) ? `
              <div class="mk" style="bottom:${pos(v)}%;--c:${color}"><i></i><span>${label} ${F(v, '°', 0)}</span></div>` : '';

            return `
              <style>
                *{box-sizing:border-box}
                ha-icon{display:inline-flex}
                .bc{position:relative;padding:26px;color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;overflow:hidden;text-align:left}
                .bc>*:not(.aur):not(.sweep){position:relative;z-index:1}

                .aur{position:absolute;inset:0;z-index:0;pointer-events:none}
                .aur span{position:absolute;width:320px;height:320px;border-radius:50%;filter:blur(70px);opacity:.22}
                .aur .a1{top:-120px;left:-80px;background:#ff922b;${A('drift1', 18, 'ease-in-out', 0, 'infinite alternate')}}
                .aur .a2{bottom:-140px;right:-90px;background:${tempColor};opacity:${running ? .32 : .16};${A('drift2', 22, 'ease-in-out', 0, 'infinite alternate')}}
                .sweep{position:absolute;top:0;left:-40%;z-index:2;width:40%;height:2px;background:linear-gradient(90deg,transparent,${tempColor},transparent);${A('sweep', running ? 3.5 : 7, 'ease-in-out')}}

                .head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px}
                .brand{display:flex;align-items:center;gap:14px;min-width:0}
                .logo{position:relative;overflow:hidden;width:54px;height:54px;flex:none;display:grid;place-items:center;border-radius:18px;color:${tempColor};box-shadow:0 0 30px ${tempColor}30}
                .logo::before{content:"";position:absolute;inset:-50%;background:conic-gradient(from 0deg,transparent 0 55%,${tempColor} 75%,transparent 95%);${A('spin', running ? 2.6 : 8)}}
                .logo::after{content:"";position:absolute;inset:2px;border-radius:16px;background:linear-gradient(135deg,#13233a,#1d1a24)}
                .logo ha-icon{position:relative;z-index:1;--mdc-icon-size:28px;${running ? A('flicker', 1.8, 'ease-in-out') : ''}}
                .eyebrow{color:#ff922b;font-size:11px;font-weight:800;letter-spacing:.22em}
                .title{margin-top:4px;font-size:26px;font-weight:800;letter-spacing:-.02em;background:linear-gradient(90deg,#fff 0%,#a9bbd0 40%,#fff 50%,#a9bbd0 60%,#fff 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;${A('shine', 6)}}
                .sub{margin-top:3px;color:#64748b;font-size:12px}
                .status{display:flex;align-items:center;gap:8px;padding:10px 15px;border-radius:999px;border:1px solid ${runColor}55;background:${runColor}14;color:${runColor};font-size:11px;font-weight:800;letter-spacing:.08em;white-space:nowrap;box-shadow:0 0 24px ${runColor}1f;${running || securityActive ? A('glow', 2.4, 'ease-in-out') : ''}}
                .status ha-icon{--mdc-icon-size:18px}
                .dot{position:relative;width:8px;height:8px;border-radius:50%;background:${runColor};flex:none}
                .dot::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid ${runColor};${A('ping', running || securityActive ? 1.4 : 3, 'ease-out')}}

                .alert{display:flex;gap:12px;align-items:flex-start;margin-bottom:16px;padding:14px 16px;border-radius:18px;border:1px solid rgba(248,113,113,.4);background:repeating-linear-gradient(-45deg,rgba(248,113,113,.13) 0 12px,rgba(248,113,113,.04) 12px 24px);background-size:34px 34px;color:#fecaca;font-size:13px;line-height:1.5;animation:hazard 1.2s linear infinite,glow 2s ease-in-out infinite}
                .alert ha-icon{--mdc-icon-size:22px;color:#f87171;flex:none;${A('blink', 1, 'steps(2)')}}

                .stage{display:flex;align-items:center;justify-content:center;gap:34px;padding:56px 14px 22px;border-radius:26px;background:linear-gradient(160deg,rgba(255,255,255,.045),rgba(255,255,255,.012));border:1px solid rgba(255,255,255,.08);box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}

                .rig{position:relative;display:flex;align-items:center}
                .src{width:34px;height:34px;flex:none;display:grid;place-items:center;border-radius:11px;color:${running ? '#fde047' : '#475569'};background:${running ? 'rgba(253,224,71,.10)' : 'rgba(255,255,255,.03)'};border:1px solid ${running ? 'rgba(253,224,71,.35)' : 'rgba(255,255,255,.06)'};${running ? 'box-shadow:0 0 18px rgba(253,224,71,.35);' + A('zap', 1.6, 'ease-in-out') : ''}}
                .src ha-icon{--mdc-icon-size:20px}
                .cable{width:60px;height:40px;flex:none;margin:0 -4px 0 2px;overflow:visible}
                .cable path{fill:none;stroke-linecap:round}
                .cable .ct{stroke:rgba(255,255,255,.08);stroke-width:5}
                .cable .cd{stroke:${runColor};stroke-width:3;stroke-dasharray:1 10;filter:drop-shadow(0 0 4px ${runColor});opacity:${running ? .8 : .15};${running ? A('flow', .7) : ''}}
                .cable .el{fill:#fff7d6;filter:drop-shadow(0 0 5px #fde047)}

                .tank{position:relative;width:128px;height:268px;flex:none;border-radius:64px;padding:11px;background:linear-gradient(100deg,#0b1220 0%,#3b4a60 20%,#172235 46%,#0b1220 75%,#52627a 100%);border:2px solid rgba(148,163,184,.4);box-shadow:inset 6px 0 10px rgba(255,255,255,.08),inset -8px 0 12px rgba(0,0,0,.55),0 18px 34px rgba(0,0,0,.5),0 0 44px ${tempColor}${running ? '40' : '14'};${running ? A('tankglow', 3, 'ease-in-out') : ''}}
                .steam{position:absolute;left:0;right:0;top:-50px;height:56px;pointer-events:none}
                .stm{position:absolute;bottom:0;width:18px;height:36px;margin-left:-9px;border-radius:50%;background:radial-gradient(ellipse at center,rgba(226,232,240,.5),rgba(226,232,240,0) 70%);filter:blur(4px)}
                .glass{position:relative;width:100%;height:100%;overflow:hidden;border-radius:54px;background:linear-gradient(180deg,#09182a,#060e1a);border:1px solid rgba(255,255,255,.08)}
                .glass::after{content:"";position:absolute;top:0;bottom:0;left:12%;width:9%;border-radius:20px;background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0));opacity:.5;pointer-events:none;z-index:3}
                .water{position:absolute;left:0;right:0;bottom:0;height:${fill}%;min-height:6px;background:linear-gradient(180deg,${topColor}d0 0%,${tempColor}90 45%,${botColor}70 100%)}
                .wave{position:absolute;top:-9px;left:0;width:200%;height:12px}
                .wave.w1{opacity:.9;${A('wave', running ? 3 : 5)}}
                .wave.w2{opacity:.45;top:-12px;${A('wave', running ? 5 : 8, 'linear', 0, 'infinite reverse')}}
                .inner{position:absolute;inset:0;overflow:hidden}
                .caus{position:absolute;top:0;bottom:0;left:-50%;width:200%;background:repeating-linear-gradient(115deg,rgba(255,255,255,0) 0 16px,rgba(255,255,255,.07) 16px 20px);${A('caus', 7, 'ease-in-out', 0, 'infinite alternate')}}
                .conv{position:absolute;inset:6% 8% 4%;width:84%;height:90%;opacity:${running ? .55 : 0}}
                .conv path{fill:none;stroke:rgba(255,255,255,.7);stroke-width:1.6;stroke-linecap:round;stroke-dasharray:3 9;vector-effect:non-scaling-stroke;${running ? A('flow', .9) : ''}}
                .bub{position:absolute;bottom:2%;border-radius:50%;background:rgba(255,255,255,.6);box-shadow:0 0 4px rgba(255,255,255,.5)}
                .shimmer{position:absolute;inset:0;background:linear-gradient(180deg,transparent,${tempColor}30);opacity:${running ? 1 : 0};${running ? A('breath', 2.6, 'ease-in-out') : ''}}

                .hglow{position:absolute;left:50%;top:66%;width:110px;height:70px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(ellipse at center,${runColor}70,transparent 65%);opacity:${running ? 1 : 0};z-index:2;${running ? A('breath', 1.6, 'ease-in-out') : ''}}
                .heater{position:absolute;left:50%;top:66%;width:62px;height:30px;transform:translate(-50%,-50%);opacity:${running ? 1 : .3};z-index:2}
                .heater path{fill:none;stroke:${runColor};stroke-width:4;stroke-linecap:round;stroke-linejoin:round;${running ? `filter:drop-shadow(0 0 6px ${runColor});` + A('hot', 1.6, 'ease-in-out') : ''}}
                .heater .hl{stroke:#fff3c4;stroke-width:2;stroke-dasharray:14 80;opacity:${running ? .9 : 0};${running ? A('coil', 1.4) : ''}}

                .pipe{position:absolute;right:-9px;width:16px;height:10px;border-radius:0 6px 6px 0;background:linear-gradient(90deg,#64748b,#cbd5e1,#475569)}
                .pipe.t{top:34px}.pipe.b{bottom:34px}

                .scale{position:relative;width:80px;height:268px;flex:none}
                .scale::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:4px;border-radius:4px;background:linear-gradient(180deg,#f87171,#fb923c 25%,#fbbf24 45%,#22d3ee 75%,#38bdf8)}
                .scale-in{position:absolute;left:0;right:0;top:8px;bottom:8px}
                .spark{position:absolute;left:-3px;bottom:0;width:10px;height:10px;margin-bottom:-5px;border-radius:50%;background:#fff;box-shadow:0 0 10px ${tempColor},0 0 20px ${tempColor};${A('spark', 2.2, 'ease-in')}}
                .mk{position:absolute;left:0;display:flex;align-items:center;gap:8px;transform:translateY(50%);color:var(--c);font-size:11px;font-weight:800;white-space:nowrap}
                .mk i{display:block;width:12px;height:2px;margin-left:-4px;background:var(--c);box-shadow:0 0 8px var(--c)}
                .mk span{padding:2px 7px;border-radius:8px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.06)}
                .mk.now{left:-2px}
                .mk.now::before{content:"";position:absolute;left:-7px;top:50%;width:12px;height:12px;margin-top:-6px;border-radius:50%;border:2px solid var(--c);${A('ping', 2, 'ease-out')}}
                .mk.now i{width:18px;height:4px;border-radius:3px}
                .mk.now span{background:${tempColor}22;border-color:${tempColor}55;font-size:12px}

                .read{min-width:0}
                .r-l{color:#8493a8;font-size:11px;font-weight:800;letter-spacing:.16em}
                .r-v{margin-top:6px;font-size:54px;line-height:1;font-weight:800;letter-spacing:-.04em;color:${tempColor};text-shadow:0 0 36px ${tempColor}55;${running ? A('tglow', 2.4, 'ease-in-out') : ''}}
                .r-v small{font-size:22px;color:#94a3b8;font-weight:700;letter-spacing:0;text-shadow:none}
                .r-t{display:inline-flex;align-items:center;gap:7px;margin-top:12px;padding:7px 12px;border-radius:999px;font-size:12px;font-weight:800;color:${reached ? '#34d399' : '#19d8ff'};background:${reached ? 'rgba(52,211,153,.08)' : 'rgba(25,216,255,.08)'};border:1px solid ${reached ? 'rgba(52,211,153,.25)' : 'rgba(25,216,255,.22)'}}
                .r-t ha-icon{--mdc-icon-size:16px;${reached ? A('pop', 2.4, 'ease-in-out') : A('spin', 6)}}
                .r-n{margin-top:12px;color:#64748b;font-size:12px;line-height:1.5}
                .r-n b{color:#cbd5e1}
                .prog{margin-top:10px;height:5px;border-radius:5px;background:rgba(255,255,255,.07);overflow:hidden}
                .prog i{display:block;height:100%;width:${Number.isFinite(t) && Number.isFinite(target) && target > T_MIN ? clamp(((t - T_MIN) / (target - T_MIN)) * 100) : 0}%;border-radius:5px;background:linear-gradient(90deg,${botColor},${tempColor},#fff,${tempColor});background-size:300% 100%;${A('shine', running ? 2 : 6)}}

                .nx{display:flex;align-items:center;gap:16px;margin-top:14px;padding:16px 18px;border-radius:20px;background:linear-gradient(135deg,${nxt.c}18,${nxt.c}05);border:1px solid ${nxt.c}44}
                .nx-ico{width:46px;height:46px;flex:none;display:grid;place-items:center;border-radius:14px;color:${nxt.c};background:${nxt.c}1f;box-shadow:0 0 22px ${nxt.c}30;${A('shield', 3, 'ease-in-out')}}
                .nx-ico ha-icon{--mdc-icon-size:24px}
                .nx-l{color:#8493a8;font-size:11px;font-weight:800;letter-spacing:.16em}
                .nx-v{margin-top:4px;font-size:30px;line-height:1;font-weight:800;letter-spacing:-.03em;color:${nxt.c};text-shadow:0 0 28px ${nxt.c}55}
                .nx-s{margin-top:5px;color:#94a3b8;font-size:12px}

                .rings{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
                .rg{display:flex;flex-direction:column;align-items:center;text-align:center;padding:16px 8px 14px;border-radius:20px;background:linear-gradient(160deg,rgba(255,255,255,.04),rgba(255,255,255,.012));border:1px solid rgba(255,255,255,.07);transition:transform .25s}
                .rg:hover{transform:translateY(-3px)}
                .ring{width:84px;height:84px;overflow:visible}
                .ring-bg{fill:none;stroke:rgba(255,255,255,.07);stroke-width:6}
                .ring-fg{fill:none;stroke-width:6;stroke-linecap:round}
                .ring-spin{fill:none;stroke-width:1.5;stroke-dasharray:3 7;opacity:.6;transform-box:fill-box;transform-origin:center;${A('spin', 4)}}
                .ring-num{fill:#f8fafc;font-size:14px;font-weight:800;text-anchor:middle}
                .rg-l{margin-top:9px;color:#e2e8f0;font-size:12px;font-weight:700}
                .rg-s{margin-top:2px;color:#64748b;font-size:11px}

                .sec{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:26px 2px 12px}
                .sec span{color:#8493a8;font-size:11px;font-weight:800;letter-spacing:.2em}
                .sec small{color:#475569;font-size:10px;font-weight:700;letter-spacing:.1em}
                .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
                .st{position:relative;overflow:hidden;padding:15px;border-radius:18px;background:linear-gradient(160deg,rgba(255,255,255,.04),rgba(255,255,255,.012));border:1px solid rgba(255,255,255,.07);transition:transform .25s,border-color .25s}
                .st::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent);transform:skewX(-20deg);${A('gleam', 8, 'ease-in-out')}}
                .st:nth-child(2)::after{animation-delay:${ph(8, 1)}}.st:nth-child(3)::after{animation-delay:${ph(8, 2)}}
                .st:nth-child(4)::after{animation-delay:${ph(8, 3)}}.st:nth-child(5)::after{animation-delay:${ph(8, 4)}}
                .st:nth-child(6)::after{animation-delay:${ph(8, 5)}}
                .st:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.14)}
                .st-top{display:flex;align-items:center;gap:8px;color:#7c8ba1;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
                .st-top ha-icon{--mdc-icon-size:17px;color:#ff922b}
                .st b{display:block;margin-top:10px;font-size:20px;font-weight:800;letter-spacing:-.02em}
                .a-sand{${A('sand', 4, 'ease-in-out')}}
                ${running ? `.a-flash{color:#fde047!important;${A('zap', 1.6, 'ease-in-out')}} .a-fire{color:#fb923c!important;${A('flicker', 1.2, 'ease-in-out')}}` : ''}

                .panel{padding:6px 18px;border-radius:20px;background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.06)}
                .row{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:13px}
                .row:last-child{border-bottom:none}
                .row span{color:#7c8ba1}
                .row b{text-align:right;font-weight:700;color:#e2e8f0;max-width:62%;overflow-wrap:anywhere}

                .pills{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
                .pl{display:flex;align-items:center;gap:9px;padding:12px 14px;border-radius:15px;background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.06)}
                .pl i{position:relative;width:8px;height:8px;border-radius:50%;flex:none;background:var(--c);box-shadow:0 0 9px var(--c)}
                .pl.ok i::after,.pl.ko i::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--c);${A('ping', 2.4, 'ease-out')}}
                .pl span{color:#8293aa;font-size:12px;flex:1}
                .pl b{color:var(--c);font-size:11px;font-weight:800;letter-spacing:.08em}

                .foot{display:flex;gap:14px;align-items:flex-start;margin-top:18px;padding:16px 18px;border-radius:20px;border:1px solid ${securityActive ? 'rgba(248,113,113,.35)' : 'rgba(25,216,255,.18)'};background:${securityActive ? 'linear-gradient(135deg,rgba(248,113,113,.12),rgba(248,113,113,.03))' : 'linear-gradient(135deg,rgba(25,216,255,.08),rgba(25,216,255,.02))'}}
                .foot-ico{width:42px;height:42px;flex:none;display:grid;place-items:center;border-radius:13px;color:${securityActive ? '#f87171' : '#19d8ff'};background:${securityActive ? 'rgba(248,113,113,.16)' : 'rgba(25,216,255,.12)'};${A('shield', 3, 'ease-in-out')}}
                .foot-ico ha-icon{--mdc-icon-size:22px}
                .foot-t{color:${securityActive ? '#f87171' : '#19d8ff'};font-size:11px;font-weight:800;letter-spacing:.16em}
                .foot-x{margin-top:6px;color:#aab8cb;font-size:12px;line-height:1.55}

                @media(min-width:900px){
                  .bc{padding:30px 34px}
                  .stage{gap:64px;padding:64px 24px 28px}
                  .tank{width:150px;height:300px;border-radius:75px}
                  .glass{border-radius:64px}
                  .scale{height:300px}
                  .r-v{font-size:68px}
                  .grid{grid-template-columns:repeat(6,minmax(0,1fr))}
                  .cols{display:grid;grid-template-columns:1fr 1fr;gap:0 22px}
                }

                @keyframes wave{from{transform:translateX(0)}to{transform:translateX(-50%)}}
                @keyframes rise{0%{bottom:2%;transform:translateX(0) scale(.6);opacity:0}15%{opacity:.85}50%{transform:translateX(4px) scale(.9)}75%{transform:translateX(-3px) scale(1)}100%{bottom:94%;transform:translateX(2px) scale(1.15);opacity:0}}
                @keyframes steam{0%{transform:translateY(22px) scaleX(.5);opacity:0}30%{opacity:.75}100%{transform:translateY(-34px) scaleX(1.7) rotate(8deg);opacity:0}}
                @keyframes flow{to{stroke-dashoffset:-12}}
                @keyframes hot{0%,100%{opacity:.7}50%{opacity:1}}
                @keyframes coil{from{stroke-dashoffset:94}to{stroke-dashoffset:0}}
                @keyframes breath{0%,100%{opacity:.5}50%{opacity:1}}
                @keyframes glow{0%,100%{box-shadow:0 0 14px ${runColor}22}50%{box-shadow:0 0 34px ${runColor}66}}
                @keyframes tankglow{0%,100%{box-shadow:inset 6px 0 10px rgba(255,255,255,.08),inset -8px 0 12px rgba(0,0,0,.55),0 18px 34px rgba(0,0,0,.5),0 0 30px ${tempColor}30}50%{box-shadow:inset 6px 0 10px rgba(255,255,255,.08),inset -8px 0 12px rgba(0,0,0,.55),0 18px 34px rgba(0,0,0,.5),0 0 60px ${tempColor}60}}
                @keyframes tglow{0%,100%{text-shadow:0 0 24px ${tempColor}44}50%{text-shadow:0 0 48px ${tempColor}aa}}
                @keyframes caus{from{transform:translateX(-8%)}to{transform:translateX(8%)}}
                @keyframes spark{0%{bottom:0%;opacity:0}15%{opacity:1}100%{bottom:${fill}%;opacity:0}}
                @keyframes ping{0%{transform:scale(.5);opacity:1}100%{transform:scale(2.4);opacity:0}}
                @keyframes spin{to{transform:rotate(360deg)}}
                @keyframes shine{from{background-position:100% 0}to{background-position:-150% 0}}
                @keyframes flicker{0%,100%{opacity:1;transform:scale(1)}30%{opacity:.8;transform:scale(.95)}60%{opacity:1;transform:scale(1.07)}80%{opacity:.85}}
                @keyframes zap{0%,100%{opacity:1}45%{opacity:1}50%{opacity:.35}55%{opacity:1}65%{opacity:.5}70%{opacity:1}}
                @keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
                @keyframes sand{0%,40%{transform:rotate(0)}50%,90%{transform:rotate(180deg)}100%{transform:rotate(360deg)}}
                @keyframes gleam{0%,70%{left:-60%}100%{left:130%}}
                @keyframes sweep{from{left:-40%}to{left:100%}}
                @keyframes drift1{from{transform:translate(0,0)}to{transform:translate(120px,80px)}}
                @keyframes drift2{from{transform:translate(0,0)}to{transform:translate(-140px,-70px)}}
                @keyframes hazard{to{background-position:34px 0}}
                @keyframes blink{0%{opacity:1}50%{opacity:.3}}
                @keyframes shield{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
                @media(prefers-reduced-motion:reduce){.bc *,.bc *::before,.bc *::after{animation:none!important}}
              </style>

              <div class="bc">
                <div class="aur"><span class="a1"></span><span class="a2"></span></div>
                <div class="sweep"></div>

                <div class="head">
                  <div class="brand">
                    <div class="logo"><ha-icon icon="mdi:water-boiler"></ha-icon></div>
                    <div>
                      <div class="eyebrow">FOXCAT ENERGY</div>
                      <div class="title">Boiler ECS</div>
                      <div class="sub">Gestion thermique · ${esc(mode)}</div>
                    </div>
                  </div>
                  <div class="status"><span class="dot"></span><ha-icon icon="${statusIcon}"></ha-icon>${status}</div>
                </div>

                ${securityActive ? `
                <div class="alert">
                  <ha-icon icon="mdi:alert-octagon"></ha-icon>
                  <div><b>Sécurité thermique active.</b> La sécurité de la résistance est signalée active. Vérifier le diagnostic FoxCat.</div>
                </div>` : ''}

                <div class="stage">

                  <div class="rig">
                    <div class="src"><ha-icon icon="mdi:lightning-bolt"></ha-icon></div>
                    <svg class="cable" viewBox="0 0 60 40">
                      <path class="ct" d="${CABLE}"/>
                      <path class="cd" d="${CABLE}"/>
                      ${electrons}
                    </svg>
                    <div class="tank">
                      <div class="steam">${steam}</div>
                      <div class="glass">
                        <div class="water">
                          ${wave(topColor, 'w2')}
                          ${wave(topColor, 'w1')}
                          <div class="inner">
                            <div class="caus"></div>
                            <div class="shimmer"></div>
                            <svg class="conv" viewBox="0 0 100 240" preserveAspectRatio="none">
                              <path d="M50 225 C 42 170, 58 110, 50 25"/>
                              <path d="M48 25 C 12 40, 8 170, 40 228"/>
                              <path d="M52 25 C 88 40, 92 170, 60 228"/>
                            </svg>
                            ${bubbles}
                          </div>
                        </div>
                        <div class="hglow"></div>
                        <svg class="heater" viewBox="0 0 62 30">
                          <path d="M2 15 H12 L17 4 L25 26 L33 4 L41 26 L46 15 H60"/>
                          <path class="hl" d="M2 15 H12 L17 4 L25 26 L33 4 L41 26 L46 15 H60"/>
                        </svg>
                      </div>
                      <div class="pipe t"></div><div class="pipe b"></div>
                    </div>
                  </div>

                  <div class="scale"><div class="scale-in">
                    ${running && fill > 2 ? '<div class="spark"></div>' : ''}
                    ${mark(safeLimit, '#f87171', 'Sécurité')}
                    ${mark(target, '#34d399', 'Confort')}
                    ${Number.isFinite(t) ? `<div class="mk now" style="bottom:${fill}%;--c:${tempColor}"><i></i><span>${F(t, '°', 1)}</span></div>` : ''}
                  </div></div>

                  <div class="read">
                    <div class="r-l">TEMPÉRATURE DE L'EAU</div>
                    <div class="r-v">${Number.isFinite(temperature) ? temperature.toFixed(1).replace('.', ',') : '—'}<small> °C</small></div>
                    <div class="r-t">
                      <ha-icon icon="${reached ? 'mdi:check-circle' : 'mdi:target'}"></ha-icon>
                      ${reached ? 'Consigne atteinte' : 'Consigne ' + F(target, '°C', 0)}
                    </div>
                    <div class="prog"><i></i></div>
                    <div class="r-n">
                      ${Number.isFinite(t) && Number.isFinite(target) && !reached ? `Reste <b>${F(target - t, '°C')}</b> à chauffer` : `Échelle ${T_MIN}–${T_MAX} °C`}
                      ${running && Number.isFinite(duration) ? `<br>Fin estimée dans <b>${F(duration, 'h', 2)}</b>` : ''}
                    </div>
                  </div>

                </div>

                <div class="nx">
                  <div class="nx-ico"><ha-icon icon="${nxt.i}"></ha-icon></div>
                  <div>
                    <div class="nx-l">PROCHAIN DÉMARRAGE</div>
                    <div class="nx-v">${nxt.v}</div>
                    <div class="nx-s">${nxt.s}</div>
                  </div>
                </div>

                <div class="rings">
                  ${ring(powerPct, runColor, 'Puissance', Number.isFinite(power) ? F(power, 'W', 0) : '—', `${Math.round(powerPct)}%`, running)}
                  ${ring(chargePct, '#19d8ff', 'Charge thermique', Number.isFinite(missingEnergy) ? 'manque ' + F(missingEnergy, 'kWh', 2) : 'confort', `${Math.round(chargePct)}%`, running)}
                  ${ring(confPct, '#a78bfa', 'Confiance', 'estimation', `${Math.round(confPct)}%`)}
                </div>

                <div class="sec"><span>ESTIMATIONS</span><small>MODÈLE THERMIQUE</small></div>
                <div class="grid">
                  ${stat('mdi:flash', 'Puissance nominale', F(nominalPower, 'W', 0), '#f1f5f9', 'a-flash')}
                  ${stat('mdi:thermometer-lines', 'Temp. estimée', F(estimatedTemperature, '°C'))}
                  ${stat('mdi:battery-heart-variant', 'Capacité confort', F(capacity, 'kWh', 2))}
                  ${stat('mdi:fire-alert', 'Énergie manquante', F(missingEnergy, 'kWh', 2), '#fb923c', 'a-fire')}
                  ${stat('mdi:timer-sand', 'Durée estimée', F(duration, 'h', 2), '#f1f5f9', 'a-sand')}
                  ${stat('mdi:chart-bell-curve-cumulative', 'Confiance', F(confidence, '%', 0), '#a78bfa')}
                </div>

                <div class="cols">
                  <div>
                    <div class="sec"><span>PILOTAGE FOXCAT</span><small>EMS</small></div>
                    <div class="panel">
                      ${row('Mode EMS', mode)}
                      ${row('Demande ECS', demand)}
                      ${row('Origine de la demande', origin)}
                      ${row("État d'exécution", execution)}
                    </div>
                  </div>
                  <div>
                    <div class="sec"><span>AUTORISATIONS &amp; SÉCURITÉS</span><small>ÉTAT DES VERROUS</small></div>
                    <div class="pills">
                      ${pill('Ballon physique détecté', physical, 'OUI', 'NON', true)}
                      ${pill('Gestion par FoxCat', managed, 'ACTIVE', 'INACTIVE')}
                      ${pill('Autorisation ECS', ecsEnabled, 'ACTIVE', 'INACTIVE')}
                      ${pill('Heures creuses', authorizedHC, 'OUI', 'NON')}
                    </div>
                    <div class="panel" style="margin-top:10px">
                      ${row('Source de sécurité thermique', securitySource)}
                      ${row('Seuil de sécurité configuré', F(safeLimit, '°C'))}
                    </div>
                  </div>
                </div>

                <div class="foot">
                  <div class="foot-ico"><ha-icon icon="${securityActive ? 'mdi:shield-alert' : 'mdi:shield-check'}"></ha-icon></div>
                  <div>
