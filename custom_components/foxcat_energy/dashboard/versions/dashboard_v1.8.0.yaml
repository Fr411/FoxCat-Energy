          [[[
            const N = (id) => { const v = parseFloat(states[id]?.state); return Number.isFinite(v) ? v : null; };
            const on = (id) => states[id]?.state === 'on';
            const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
            const dec = (v, d = 1) => v == null ? '—' : v.toFixed(d).replace('.', ',');
            const esc = (t) => String(t ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
            const NOW = Date.now() / 1000;
            const ph = (d, o = 0) => `-${((((NOW + o) % d) + d) % d).toFixed(2)}s`;
            const AA = (n, d, tf = 'linear', o = 0) => `animation:${n} ${d}s ${tf} ${ph(d, o)} infinite;`;
            const P = 'number.foxcat_energy_ems_chauffage_';
            const off = N('sensor.foxcat_energy_ems_chauffage_decalage_de_consigne') ?? 0;
            const max = N(P + 'decalage_maximal') ?? 2, step = N(P + 'pas_de_decalage') ?? 1;
            const steps = N('sensor.foxcat_energy_ems_chauffage_pas_accordes') ?? 0;
            const req = N(P + 'surplus_requis_par_pas') ?? 500, impMax = N(P + 'import_maximal_avant_baisse') ?? 300;
            const sur = N('sensor.foxcat_energy_ems_chauffage_surplus_calcule') ?? 0;
            const imp = Math.max(N('[[foxcat:legacy.sensor_foxcat_energy_energie_puissance_prelevee_au_reseau]]') ?? 0, 0);
            const lim = N(P + 'limite_de_puissance_du_groupe'), delay = N(P + 'delai_avant_augmentation'), res = N(P + 'marge_de_reserve');
            const act = on('binary_sensor.foxcat_energy_ems_chauffage_decalage_actif');
            const sol = on('switch.foxcat_energy_ems_chauffage_decalage_de_consigne_solaire');
            const empty = on('switch.foxcat_energy_ems_chauffage_uniquement_maison_vide');
            const txt = states['sensor.foxcat_energy_ems_chauffage_statut']?.state || '—';
            const oE = N('sensor.foxcat_energy_chauffage_decalage_de_consigne_toshiba_etage') ?? 0;
