            const bar = (label, val, lim2, unit, good, icon) => { const p = lim2 > 0 ? clamp(val / lim2, 0, 1) : 0; const c = good ? '#34d399' : '#fb7185'; return `<div class="br"><div class="bl"><span><ha-icon icon="${icon}"></ha-icon>${label}</span><b class="mono">${Math.round(val)} <small>/ ${Math.round(lim2)} ${unit}</small></b></div><div class="bt"><i style="width:${(p * 100).toFixed(0)}%;background:linear-gradient(90deg,${c}88,${c});box-shadow:0 0 8px ${c}77"></i></div></div>`; };
            const chip = (icon, l, v) => `<div class="cp"><ha-icon icon="${icon}"></ha-icon><span>${l}</span><b class="mono">${v}</b></div>`;
            return `
