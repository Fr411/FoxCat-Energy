    - type: custom:button-card
      template: fc_head
      variables:
        title: Flux
        subtitle: Où va l'énergie · sources, réseau et charges en temps réel
        icon: mdi:graph-outline
        color: '#19d8ff'
    - type: custom:button-card
      template: fc_panel
      triggers_update: all
      custom_fields:
        c: |
          [[[
            const num = (id) => { const v = parseFloat(states[id]?.state); return isFinite(v) ? v : null; };
            const pos0 = (id) => { const v = num(id); return v == null ? null : Math.max(v, 0); };
            const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
            const esc = (t) => String(t ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
            const fmtW = (w) => w >= 1000 ? (w / 1000).toFixed(2).replace('.', ',') + ' kW' : Math.round(w) + ' W';
            const NOW = Date.now() / 1000;
            const ph = (d, o = 0) => `-${((((NOW + o) % d) + d) % d).toFixed(2)}s`;
            const AA = (n, d, tf = 'linear', o = 0) => `animation:${n} ${d}s ${tf} ${ph(d, o)} infinite;`;

            const pv = pos0('[[foxcat:legacy.sensor_foxcat_energy_energie_puissance_de_production_photovoltaique]]') ?? 0;
            const imp = pos0('[[foxcat:legacy.sensor_foxcat_energy_energie_puissance_prelevee_au_reseau]]') ?? 0;
            const exp = pos0('[[foxcat:legacy.sensor_foxcat_energy_energie_puissance_reinjectee_au_reseau]]') ?? 0;
            const house = pos0('[[foxcat:legacy.sensor_foxcat_energy_energie_puissance_de_consommation_maison]]');
            const L = [
              { n: 'Boiler ECS', i: 'mdi:water-boiler', c: '#fb923c', w: pos0('sensor.homefoxcat_load_chauffe_eau') },
              { n: 'Lave-linge', i: 'mdi:washing-machine', c: '#60a5fa', w: pos0('[[foxcat:legacy.sensor_lave_linge_puissance]]') },
              { n: 'Sèche-linge', i: 'mdi:tumble-dryer', c: '#c4b5fd', w: pos0('[[foxcat:legacy.sensor_seche_linge_puissance]]') },
              { n: 'Lave-vaisselle', i: 'mdi:dishwasher', c: '#34d399', w: pos0('[[foxcat:legacy.sensor_lave_vaisselle_puissance]]') },
              { n: 'Clim étage', i: 'mdi:hvac', c: '#818cf8', w: pos0('[[foxcat:legacy.sensor_homefoxcat_load_autre]]') },
              { n: 'Clim rez', i: 'mdi:air-conditioner', c: '#2dd4bf', w: pos0('sensor.homefoxcat_load_toshiba_rez') },
              { n: 'Chauffage sol', i: 'mdi:heating-coil', c: '#fb7185', w: pos0('sensor.homefoxcat_load_chauffage_sdb') ?? pos0('sensor.chauffage_sol_power') }
            ].map(x => ({ ...x, w: x.w ?? 0 }));
            const known = L.reduce((s, x) => s + x.w, 0);
            const other = house != null ? Math.max(house - known, 0) : 0;
            L.push({ n: 'Autres', i: 'mdi:home-lightning-bolt', c: '#94a3b8', w: other });
            const total = Math.max(house ?? 0, known + other, 1);
            const solarUse = Math.min(pv, total);
            const selfPct = total > 1 ? Math.round(solarUse / total * 100) : 0;
            const gridDir = imp > 20 ? 'in' : exp > 20 ? 'out' : 'none';
            const gridW = gridDir === 'out' ? exp : imp;

            const W = 1000, H = 620, CX = 500, CY = 310;
            const R0 = 82;
            const place = (deg, rx = 410, ry = 250) => { const a = deg * Math.PI / 180; return [CX + rx * Math.cos(a), CY + ry * Math.sin(a)]; };
            const cAngles = [-115, -80, -45, -15, 15, 45, 80, 115];
            const nodes = [
              { key: 'pv', n: 'Solaire', i: 'mdi:solar-power-variant', c: '#facc15', w: pv, p: place(-150), from: true, share: pv / total },
              { key: 'grid', n: gridDir === 'out' ? 'Injection' : 'Réseau', i: 'mdi:transmission-tower', c: gridDir === 'out' ? '#34d399' : '#38bdf8', w: gridW, p: place(150), from: gridDir !== 'out', share: gridW / total }
            ].concat(L.map((x, k) => ({ key: 'l' + k, n: x.n, i: x.i, c: x.c, w: x.w, p: place(cAngles[k]), from: false, share: x.w / total })));

            const WIG = (total >= 4000 || imp >= 3000) ? [.5, 1.2] : (total < 150 && pv < 50) ? [8, .25] : exp > 200 ? [1.6, 1.4] : [3.6, .7];
            const arm = (nd, idx) => {
              const [x, y] = nd.p; const dx = x - CX, dy = y - CY; const len = Math.hypot(dx, dy); const ux = dx / len, uy = dy / len;
              const p0 = [CX + ux * R0, CY + uy * R0], p1 = [x - ux * 54, y - uy * 54];
              const ddx = p1[0] - p0[0], ddy = p1[1] - p0[1], dl = Math.hypot(ddx, ddy);
              const nx = -ddy / dl, ny = ddx / dl; const s = (idx % 2 ? 1 : -1) * dl * 0.17;
              const c1 = [p0[0] + ddx * .33 + nx * s, p0[1] + ddy * .33 + ny * s], c2 = [p0[0] + ddx * .68 - nx * s * .8, p0[1] + ddy * .68 - ny * s * .8];
              const fwd = `M${p0[0].toFixed(1)} ${p0[1].toFixed(1)} C${c1[0].toFixed(1)} ${c1[1].toFixed(1)} ${c2[0].toFixed(1)} ${c2[1].toFixed(1)} ${p1[0].toFixed(1)} ${p1[1].toFixed(1)}`;
              const rev = `M${p1[0].toFixed(1)} ${p1[1].toFixed(1)} C${c2[0].toFixed(1)} ${c2[1].toFixed(1)} ${c1[0].toFixed(1)} ${c1[1].toFixed(1)} ${p0[0].toFixed(1)} ${p0[1].toFixed(1)}`;
              const on = nd.w > 20; const wid = 3 + 13 * Math.sqrt(clamp(nd.share, 0, 1));
              const flow = nd.from ? rev : fwd;
              const nP = on ? clamp(Math.round(nd.w / 250) + 1, 1, 6) : 0; const dur = +clamp(3.4 - nd.w / 1200, 1.2, 3.4).toFixed(2);
              const dots = Array.from({ length: nP }, (_, k) => `<circle r="${(3.2 + wid / 6).toFixed(1)}" fill="#fff" style="filter:drop-shadow(0 0 5px ${nd.c}) drop-shadow(0 0 10px ${nd.c})"><animateMotion dur="${dur}s" repeatCount="indefinite" begin="${ph(dur, k * dur / nP)}" path="${flow}"/></circle>`).join('');
              return `<g style="transform-origin:${CX}px ${CY}px;--a:${WIG[1]}deg;${AA('oc-sway', WIG[0], 'ease-in-out', idx * .9)}"><path d="${fwd}" fill="none" stroke="${nd.c}" stroke-opacity="${on ? .14 : .06}" stroke-width="${(wid + 9).toFixed(1)}" stroke-linecap="round"/>
                <path d="${fwd}" fill="none" stroke="${nd.c}" stroke-opacity="${on ? .85 : .22}" stroke-width="${on ? wid.toFixed(1) : 2}" stroke-linecap="round" ${on ? '' : 'stroke-dasharray="3 9"'} style="${on ? 'filter:drop-shadow(0 0 6px ' + nd.c + '88)' : ''}"/>${dots}</g>`;
            };
            const arms = nodes.map(arm).join('');
            const nodeHtml = nodes.map((nd) => { const on = nd.w > 20; return `<div class="nd ${on ? 'on' : ''}" style="left:${(nd.p[0] / W * 100).toFixed(2)}%;top:${(nd.p[1] / H * 100).toFixed(2)}%;--c:${nd.c}"><div class="ic"><ha-icon icon="${nd.i}"></ha-icon></div><b>${esc(nd.n)}</b><span class="mono">${fmtW(nd.w)}</span><em class="mono">${Math.round(nd.share * 100)} %</em></div>`; }).join('');

            const top = L.filter(x => x.w > 20).sort((a, b) => b.w - a.w)[0];
            const look = top ? nodes.find(n => n.n === top.n) : null;
            const lx = look ? clamp((look.p[0] - CX) / 410, -1, 1) * 4 : 0, ly = look ? clamp((look.p[1] - CY) / 250, -1, 1) * 3 : 0;
            const R2 = 96, C2 = 2 * Math.PI * R2;

            /* ---------- ÉMOTION de la pieuvre ---------- */
            const moodKey = (total < 150 && pv < 50) ? 'sleep'
              : exp > 200 ? 'joy'
              : (total >= 4000 || imp >= 3000) ? 'panic'
              : imp >= 1500 ? 'worried'
              : selfPct >= 60 ? 'happy'
              : selfPct >= 25 ? 'content'
              : imp > 300 ? 'sad'
              : 'calm';
            const MOODS = {
              sleep:   { c: '#64748b', t: 'Zzz… la maison dort', i: 'mdi:sleep' },
              joy:     { c: '#34d399', t: "J'injecte du soleil sur le réseau !", i: 'mdi:party-popper' },
              happy:   { c: '#facc15', t: 'Je profite du soleil', i: 'mdi:white-balance-sunny' },
              content: { c: '#a3e635', t: 'Soleil et réseau : ça va', i: 'mdi:emoticon-happy-outline' },
              calm:    { c: '#19d8ff', t: 'Tout est calme', i: 'mdi:emoticon-neutral-outline' },
              sad:     { c: '#38bdf8', t: 'Je dépends du réseau…', i: 'mdi:emoticon-sad-outline' },
              worried: { c: '#fb923c', t: 'Ça tire fort sur le réseau', i: 'mdi:emoticon-confused-outline' },
              panic:   { c: '#f87171', t: 'La maison consomme beaucoup !', i: 'mdi:emoticon-dead-outline' }
            };
            const MD = MOODS[moodKey];
            const star = (x, y, r, col, d, o) => `<path d="M${x} ${y - r} L${x + r * .28} ${y - r * .28} L${x + r} ${y} L${x + r * .28} ${y + r * .28} L${x} ${y + r} L${x - r * .28} ${y + r * .28} L${x - r} ${y} L${x - r * .28} ${y - r * .28} Z" fill="${col}" style="transform-box:fill-box;transform-origin:center;${AA('oc-twinkle', d, 'ease-in-out', o)}"/>`;
            const eyeX = [CX - 27, CX + 27], eyeY = CY - 40;
            const mc = MD.c, LID = '#16233a';
            const FD = `<defs>
              <radialGradient id="oiris" cx="50%" cy="38%" r="65%"><stop offset="0" stop-color="${mc}" stop-opacity=".95"/><stop offset=".55" stop-color="${mc}"/><stop offset="1" stop-color="#0b1626"/></radialGradient>
              <radialGradient id="osclera" cx="45%" cy="35%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#cbd5e1"/></radialGradient>
              <radialGradient id="osheen" cx="30%" cy="18%" r="62%"><stop offset="0" stop-color="#fff" stop-opacity=".30"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
              <radialGradient id="oshade" cx="50%" cy="50%" r="50%"><stop offset=".7" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".38"/></radialGradient>
              <radialGradient id="oblush" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fb7185" stop-opacity=".75"/><stop offset="1" stop-color="#fb7185" stop-opacity="0"/></radialGradient>
              <linearGradient id="odrop" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e0f2fe"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
              <linearGradient id="omouth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b0a14"/><stop offset="1" stop-color="#4a1426"/></linearGradient>
              <clipPath id="oeL"><circle cx="${eyeX[0]}" cy="${eyeY}" r="19"/></clipPath><clipPath id="oeR"><circle cx="${eyeX[1]}" cy="${eyeY}" r="19"/></clipPath>
            </defs>`;
            const spots = [[-50, -56, 7], [54, -50, 5], [-18, -72, 4], [28, -70, 5.5], [-68, -14, 4.5], [68, -12, 5], [-60, 38, 5], [62, 34, 4.5]]
              .map(([a, b, r]) => `<circle cx="${CX + a}" cy="${CY + b}" r="${r}" fill="${mc}" opacity=".16"/><circle cx="${CX + a}" cy="${CY + b}" r="${r}" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="1.2"/>`).join('');
            const DECOR = FD + `<circle cx="${CX}" cy="${CY}" r="${R0}" fill="url(#oshade)"/>` + spots + `<circle cx="${CX}" cy="${CY}" r="${R0}" fill="url(#osheen)"/><path d="M${CX - 58} ${CY - 44} Q${CX - 44} ${CY - 66} ${CX - 20} ${CY - 74}" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".22"/>`;
            const eyeFull = (side, r, pr, lid, slope, wet) => {
              const x = eyeX[side], ir = r * .66, base = eyeY - r + 2 * r * lid;
              const yL = side === 0 ? base + slope : base - slope, yR = side === 0 ? base - slope : base + slope;
              const lidPath = (lid > 0 || slope) ? `<path d="M${x - r - 3} ${eyeY - r - 4} H${x + r + 3} V${yR} Q${x} ${base + 2} ${x - r - 3} ${yL} Z" fill="${LID}"/><path d="M${x - r - 3} ${yL} Q${x} ${base + 2} ${x + r + 3} ${yR}" fill="none" stroke="rgba(0,0,0,.4)" stroke-width="2"/>` : '';
              return `<g class="eye"><circle cx="${x}" cy="${eyeY}" r="${r + 2.5}" fill="#000" opacity=".22"/><circle cx="${x}" cy="${eyeY}" r="${r}" fill="url(#osclera)"/>
                <g clip-path="url(#oe${side ? 'R' : 'L'})"><g style="${AA('oc-look', 7, 'ease-in-out', side * 1.7)}">
                  <circle cx="${x + lx}" cy="${eyeY + ly}" r="${ir}" fill="url(#oiris)"/><circle cx="${x + lx}" cy="${eyeY + ly}" r="${pr}" fill="#05080f" style="transform-box:fill-box;transform-origin:center;${PUP}"/>
                  <circle cx="${x + lx - ir * .32}" cy="${eyeY + ly - ir * .38}" r="${ir * .28}" fill="#fff"/><circle cx="${x + lx + ir * .3}" cy="${eyeY + ly + ir * .32}" r="${ir * .13}" fill="#fff" opacity=".85"/>
                </g>${lidPath}</g>
                ${wet ? `<path d="M${x - r * .75} ${eyeY + r * .62} Q${x} ${eyeY + r * 1.05} ${x + r * .75} ${eyeY + r * .62}" fill="none" stroke="#bae6fd" stroke-width="2.2" stroke-linecap="round" opacity=".85"/>` : ''}</g>`;
            };
            const eyes = (r, pr, lid = 0, slope = 0, wet = false) => eyeFull(0, r, pr, lid, slope, wet) + eyeFull(1, r, pr, lid, slope, wet);
            const eyeArc2 = (up) => eyeX.map((x, i) => { const s = i ? 1 : -1; const y0 = eyeY + (up ? 5 : -2), y1 = eyeY + (up ? -13 : 9);
              const lashes = up ? `<path d="M${x + s * 13} ${y0} l${s * 7} -4 M${x + s * 13} ${y0 - 4} l${s * 7} -7" stroke="#f8fafc" stroke-width="3" stroke-linecap="round"/>` : `<path d="M${x + s * 13} ${y0} l${s * 6} 5 M${x + s * 10} ${y0 + 4} l${s * 5} 7" stroke="#f8fafc" stroke-width="3" stroke-linecap="round"/>`;
              return `<path d="M${x - 13} ${y0} Q${x} ${y1} ${x + 13} ${y0}" fill="none" stroke="#f8fafc" stroke-width="5.5" stroke-linecap="round"/>${lashes}`; }).join('');
            const brow = (side, inner, outer, bend) => { const s = side ? 1 : -1, xi = CX + s * 15, xo = CX + s * 43; return `<path d="M${xo} ${eyeY - outer} Q${(xi + xo) / 2} ${eyeY - (inner + outer) / 2 - bend} ${xi} ${eyeY - inner}" fill="none" stroke="#e2e8f0" stroke-width="5" stroke-linecap="round"/>`; };
            const brows = (inner, outer, bend = 4) => `<g style="${BROW}">` + brow(0, inner, outer, bend) + brow(1, inner, outer, bend) + '</g>';
            const MY = CY - 6;
            const crease = `<path d="M${CX - 34} ${MY - 4} q-5 6 0 12 M${CX + 34} ${MY - 4} q5 6 0 12" stroke="#f8fafc" stroke-width="2.5" fill="none" opacity=".55" stroke-linecap="round"/>`;
            const teeth = (w) => `<path d="M${CX - w} ${MY - 1} Q${CX} ${MY + 6} ${CX + w} ${MY - 1} L${CX + w - 2} ${MY + 5} Q${CX} ${MY + 11} ${CX - w + 2} ${MY + 5} Z" fill="#fff"/>`;
            const mouths = {
              smile:  `<path d="M${CX - 22} ${MY} Q${CX} ${MY + 20} ${CX + 22} ${MY}" fill="none" stroke="#f8fafc" stroke-width="4.5" stroke-linecap="round"/><path d="M${CX - 22} ${MY} q-4 -1 -6 -5 M${CX + 22} ${MY} q4 -1 6 -5" fill="none" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" opacity=".7"/>`,
              big:    `<path d="M${CX - 28} ${MY - 3} Q${CX} ${MY + 36} ${CX + 28} ${MY - 3} Q${CX} ${MY + 3} ${CX - 28} ${MY - 3} Z" fill="url(#omouth)" stroke="#f8fafc" stroke-width="3.5" stroke-linejoin="round"/>${teeth(22)}<ellipse cx="${CX}" cy="${MY + 17}" rx="11" ry="6" fill="#fb7185"/><path d="M${CX} ${MY + 12} v10" stroke="#e11d48" stroke-width="1.6" opacity=".6"/>${crease}`,
              small:  `<path d="M${CX - 13} ${MY + 2} Q${CX} ${MY + 12} ${CX + 13} ${MY + 2}" fill="none" stroke="#f8fafc" stroke-width="4" stroke-linecap="round"/><path d="M${CX - 13} ${MY + 2} q-3 0 -4 -3 M${CX + 13} ${MY + 2} q3 0 4 -3" fill="none" stroke="#f8fafc" stroke-width="2.4" stroke-linecap="round" opacity=".6"/>`,
              flat:   `<path d="M${CX - 13} ${MY + 5} Q${CX} ${MY + 2} ${CX + 13} ${MY + 5}" fill="none" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>`,
              frown:  `<g style="${AA('oc-tremble', 1.6, 'ease-in-out')}"><path d="M${CX - 19} ${MY + 11} Q${CX} ${MY - 8} ${CX + 19} ${MY + 11}" fill="none" stroke="#f8fafc" stroke-width="4.5" stroke-linecap="round"/><path d="M${CX - 8} ${MY + 15} Q${CX} ${MY + 19} ${CX + 8} ${MY + 15}" fill="none" stroke="#f8fafc" stroke-width="2.4" stroke-linecap="round" opacity=".5"/></g>`,
              wavy:   `<g style="${AA('oc-wave', 1.2, 'ease-in-out')}"><path d="M${CX - 22} ${MY + 6} q5.5 -7 11 0 t11 0 t11 0 t11 0" fill="none" stroke="#f8fafc" stroke-width="4" stroke-linecap="round"/></g>`,
              open:   `<g style="transform-box:fill-box;transform-origin:center;${AA('oc-pant', .2, 'ease-in-out')}"><ellipse cx="${CX}" cy="${MY + 8}" rx="13" ry="15" fill="url(#omouth)" stroke="#f8fafc" stroke-width="3.5"/><path d="M${CX - 9} ${MY - 2} Q${CX} ${MY + 3} ${CX + 9} ${MY - 2} L${CX + 8} ${MY + 3} Q${CX} ${MY + 7} ${CX - 8} ${MY + 3} Z" fill="#fff"/><ellipse cx="${CX}" cy="${MY + 17}" rx="7" ry="4" fill="#fb7185"/></g>`,
              sleep:  `<ellipse cx="${CX}" cy="${MY + 6}" rx="5" ry="4" fill="#0b1220" stroke="#cbd5e1" stroke-width="2.5"/><g style="transform-box:fill-box;transform-origin:left center;${AA('oc-bubble', 4, 'ease-in-out')}"><circle cx="${CX + 9}" cy="${MY + 4}" r="9" fill="#bae6fd" fill-opacity=".22" stroke="#e0f2fe" stroke-width="1.6"/><circle cx="${CX + 6}" cy="${MY + 1}" r="2.2" fill="#fff" opacity=".8"/></g>`
            };
            const blush = [CX - 54, CX + 54].map(x => `<ellipse cx="${x}" cy="${CY - 16}" rx="14" ry="8" fill="url(#oblush)"/><path d="M${x - 7} ${CY - 18} l3 5 M${x - 1} ${CY - 18} l3 5 M${x + 5} ${CY - 18} l3 5" stroke="#fda4af" stroke-width="1.6" stroke-linecap="round" opacity=".8"/>`).join('');
            const drop = (x, y, d, o) => `<g style="${AA('oc-drop', d, 'ease-in', o)}"><path d="M${x} ${y} q-8 12 0 18 q8 -6 0 -18 Z" fill="url(#odrop)" stroke="#e0f2fe" stroke-width=".8"/><circle cx="${x - 2}" cy="${y + 12}" r="1.6" fill="#fff"/></g>`;
            const shock = [-1, 1].map(s => [0, 1, 2].map(k => `<path d="M${CX + s * (96 + k * 7)} ${CY - 30 + k * 14} q${s * 6} 7 0 14" fill="none" stroke="#fca5a5" stroke-width="3" stroke-linecap="round" style="${AA('oc-flick', .5, 'steps(2)', k * .15)}"/>`).join('')).join('');
            const joyEye = (x) => `<circle cx="${x}" cy="${eyeY}" r="17" fill="#fde047" opacity=".18" style="${AA('oc-breath', 1.2, 'ease-in-out')}"/>` + star(x, eyeY, 14, '#fde047', 1.4, x) + star(x + 8, eyeY - 9, 4, '#fff', 1.1, x);
            const mw = (s, a, d) => `<g style="transform-box:fill-box;transform-origin:center top;${AA(a, d, 'ease-in-out')}">${s}</g>`;
            const BROW = { joy: AA('oc-browb', .55, 'ease-in-out'), worried: AA('oc-browb', 1.3, 'ease-in-out'), panic: AA('oc-browb', .35, 'ease-in-out') }[moodKey] || AA('oc-brow', 7.5, 'ease-in-out');
            const PUP = moodKey === 'panic' ? AA('oc-pup', .7, 'ease-in-out') : '';
            const TILT = { joy: AA('oc-tilt2', 1.4, 'ease-in-out'), happy: AA('oc-tilt', 3.2, 'ease-in-out'), content: AA('oc-tilt', 5, 'ease-in-out'), calm: AA('oc-tilt', 9, 'ease-in-out'), sad: AA('oc-droop', 5.5, 'ease-in-out'), sleep: AA('oc-droop', 7, 'ease-in-out'), worried: AA('oc-tilt', 1.1, 'ease-in-out') }[moodKey] || '';
            const heart = (x, y, s, c, d, o) => `<g transform="translate(${x} ${y}) scale(${s})"><g style="${AA('oc-rise', d, 'ease-out', o)}"><path d="M0 4 C-7 -4 -13 3 0 13 C13 3 7 -4 0 4 Z" fill="${c}" stroke="#fff" stroke-opacity=".5" stroke-width="1"/></g></g>`;
            const note = (x, y, c, d, o) => `<text x="${x}" y="${y}" fill="${c}" font-size="32" font-weight="800" style="${AA('oc-note', d, 'ease-out', o)}">♪</text>`;
            const bub = (x, y, r, d, o) => `<g style="${AA('oc-rise', d, 'ease-out', o)}"><circle cx="${x}" cy="${y}" r="${r}" fill="none" stroke="#bae6fd" stroke-width="1.6" opacity=".7"/></g>`;
            const puff = (x, y, r, d, o) => `<g style="${AA('oc-puff', d, 'ease-out', o)}"><circle cx="${x}" cy="${y}" r="${r}" fill="#cbd5e1" opacity=".6"/></g>`;
            const rdrop = (x, d, o) => `<g style="${AA('oc-rain', d, 'ease-in', o)}"><path d="M${x} ${CY - 90} q-4 8 0 11 q4 -3 0 -11 Z" fill="#7dd3fc"/></g>`;
            const PARTS = {
              joy: [[-70, -62, 1.5, '#fb7185', 2.8, 0], [-30, -86, 1.2, '#fda4af', 3.2, .9], [46, -84, 1.4, '#fb7185', 3, 1.7], [78, -56, 1.1, '#fda4af', 2.6, 2.3], [8, -92, .95, '#fecdd3', 3.4, .4]].map(a => heart(CX + a[0], CY + a[1], a[2], a[3], a[4], a[5])).join(''),
              happy: `<g style="transform-origin:${CX}px ${CY}px;${AA('oc-spin', 24)}">${Array.from({ length: 14 }, (_, k) => { const a = k / 14 * Math.PI * 2, r1 = R0 + 18, r2 = R0 + (k % 2 ? 26 : 32); return `<line x1="${(CX + r1 * Math.cos(a)).toFixed(1)}" y1="${(CY + r1 * Math.sin(a)).toFixed(1)}" x2="${(CX + r2 * Math.cos(a)).toFixed(1)}" y2="${(CY + r2 * Math.sin(a)).toFixed(1)}" stroke="#facc15" stroke-width="3" stroke-linecap="round" opacity=".55"/>`; }).join('')}</g>`,
              content: note(CX + 70, CY - 66, '#a3e635', 3.6, 0) + note(CX - 86, CY - 46, '#bef264', 4.2, 1.8),
              calm: bub(CX - 60, CY - 66, 5, 5, 0) + bub(CX + 52, CY - 74, 4, 5.4, 1.7) + bub(CX + 8, CY - 84, 3.2, 4.6, 3.2),
              sad: `<circle cx="${CX - 22}" cy="${CY - 104}" r="15" fill="#64748b"/><circle cx="${CX + 2}" cy="${CY - 113}" r="19" fill="#71819a"/><circle cx="${CX + 28}" cy="${CY - 103}" r="14" fill="#64748b"/><rect x="${CX - 36}" y="${CY - 106}" width="78" height="14" rx="7" fill="#64748b"/>` + rdrop(CX - 14, 1.2, 0) + rdrop(CX + 8, 1.2, .4) + rdrop(CX + 26, 1.2, .8),
              worried: `<text x="${CX + 74}" y="${CY - 74}" fill="#fb923c" font-size="32" font-weight="800" style="${AA('oc-tremble', .8, 'ease-in-out')}">?</text><text x="${CX - 90}" y="${CY - 56}" fill="#fdba74" font-size="22" font-weight="800" style="${AA('oc-tremble', 1, 'ease-in-out', .3)}">?</text>`,
              panic: `<text x="${CX + 78}" y="${CY - 72}" fill="#f87171" font-size="34" font-weight="900" style="${AA('oc-bang', .5, 'ease-in-out')}">!</text><text x="${CX - 96}" y="${CY - 60}" fill="#fca5a5" font-size="26" font-weight="900" style="${AA('oc-bang', .5, 'ease-in-out', .25)}">!</text>` + puff(CX - 34, CY - 84, 9, 1.6, 0) + puff(CX + 30, CY - 86, 8, 1.6, .55) + puff(CX - 2, CY - 90, 10, 1.6, 1.1)
            }[moodKey] || '';
            const FACE = {
              sleep:   eyeArc2(false) + brows(16, 12, 3) + mouths.sleep + blush + `<text x="${CX + 62}" y="${CY - 52}" fill="#94a3b8" font-size="22" font-weight="800" style="${AA('oc-zzz', 3.2, 'ease-in-out')}">z</text><text x="${CX + 80}" y="${CY - 72}" fill="#94a3b8" font-size="30" font-weight="800" style="${AA('oc-zzz', 3.2, 'ease-in-out', 1.1)}">Z</text>`,
              joy:     joyEye(eyeX[0]) + joyEye(eyeX[1]) + brows(31, 26, 7) + mw(mouths.big, 'oc-laugh', .5) + blush + star(CX - 96, CY - 70, 11, '#fde047', 1.6, 0) + star(CX + 100, CY - 60, 9, '#34d399', 1.3, .5) + star(CX + 70, CY - 98, 7, '#fff', 1.1, .9) + star(CX - 70, CY - 100, 8, '#34d399', 1.5, .3),
              happy:   eyeArc2(true) + brows(29, 24, 6) + mw(mouths.smile, 'oc-smile', 2.6) + blush + star(CX + 92, CY - 76, 9, '#facc15', 2, 0),
              content: eyes(14, 5.5) + brows(25, 22, 4) + mw(mouths.small, 'oc-smile', 3.4),
              calm:    eyes(14, 5.5, .2) + brows(23, 23, 2) + mouths.flat,
              sad:     eyes(14, 5.5, .3, 6, true) + brows(27, 14, 3) + mouths.frown + drop(eyeX[0] - 4, eyeY + 17, 2.6, 0),
              worried: eyes(16, 4.8) + brows(31, 16, 6) + mouths.wavy + drop(CX + 62, CY - 62, 2.2, 0),
              panic:   eyes(17.5, 3) + brows(37, 28, 10) + mouths.open + drop(CX + 64, CY - 64, 1.3, 0) + drop(CX - 64, CY - 50, 1.5, .6) + shock
