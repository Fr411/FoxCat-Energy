kiosk_mode:
  hide_header: '{{ is_state("[[foxcat:legacy.input_boolean_ems_head_menu]]", "on") }}'
  hide_sidebar: '{{ is_state("[[foxcat:legacy.input_boolean_ems_head_lateral]]", "on") }}'
button_card_templates:
  fc_panel:
    show_name: false
    show_icon: false
    show_state: false
    triggers_update: all
    tap_action:
      action: none
    hold_action:
      action: none
    styles:
      card:
      - padding: 0
      - border-radius: 20px
      - overflow: hidden
      - color: '#e8f1fb'
      - background: 'radial-gradient(circle at 3% 50%, rgba(255,120,20,0.12), transparent 26%), radial-gradient(circle at 95% 30%, rgba(0,210,255,0.10), transparent 30%), linear-gradient(135deg, #080d16 0%, #0a1420 48%, #071827 100%)'
      - border: 1px solid rgba(255,255,255,0.08)
      - box-shadow: 0 10px 30px rgba(0,0,0,0.30), inset 0 1px 0 rgba(255,255,255,0.035)
      grid:
      - grid-template-areas: '"c"'
      - grid-template-columns: 1fr
      custom_fields:
        c:
        - width: 100%
    extra_styles: |
      .p{padding:16px 18px;font-family:-apple-system,"Segoe UI",Roboto,sans-serif;text-align:left;box-sizing:border-box}
      .t{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:15px;font-weight:700;margin-bottom:12px}
      .t small{font-weight:400;color:#8fa6bf;font-size:12px}
      .t ha-icon{--mdc-icon-size:20px;color:#ff922b;margin-right:6px}
      .g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
      .g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
      .tile{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07)}
      .tile ha-icon{--mdc-icon-size:26px;flex:none}
      .tile span{display:block;font-size:11px;color:#9bb3cc}
      .tile b{font-size:17px}
      .stat{padding:9px 6px;border-radius:12px;background:rgba(255,255,255,.04);text-align:center}
      .stat span{display:block;font-size:10px;color:#8fa6bf}
      .stat b{display:block;font-size:14px;margin-top:3px}
      .k{font-size:11px;color:#8fa6bf}
      .v{font-size:20px;font-weight:800}
      .bar{height:5px;border-radius:5px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:8px}
      .bar i{display:block;height:100%;border-radius:5px}
      .chip{display:inline-block;padding:3px 9px;border-radius:7px;font-size:11px;font-weight:600}
      .row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;font-size:13px;border-top:1px solid rgba(255,255,255,.05)}
      .dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:8px}
      .o{color:#ffb020}.b{color:#38bdf8}.r{color:#f87171}.gr{color:#34d399}.pu{color:#a78bfa}
      .ring{border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
      .ring>div{border-radius:50%;background:#070b14;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800}
      .ring small{font-size:9px;color:#8fa6bf;font-weight:400}
      .flux{display:grid;grid-template-columns:1fr 54px 1fr 54px 1fr;align-items:center;text-align:center;gap:6px}
      .n ha-icon{--mdc-icon-size:34px}
      .n b{display:block;font-size:20px;font-weight:800}
      .n span{font-size:11px;color:#9bb3cc}
      .ar{font-size:28px;font-weight:300}
      .img{height:96px;background-size:contain;background-repeat:no-repeat;background-position:center}
      .seg{display:flex;height:9px;border-radius:9px;overflow:hidden;margin:8px 0 10px}
      .legend{display:flex;justify-content:space-between;font-size:11px}
      .legend b{display:block;font-size:15px;color:#fff}
      .legend span{color:#8fa6bf}
      .quote{font-style:italic;color:#8fa6bf;font-size:12px;text-align:right;margin-top:10px}
  fc_nav:
    show_name: true
    show_icon: true
    variables:
      path: ''
    tap_action:
      action: navigate
      navigation_path: |
        [[[
          const base = window.location.pathname.replace(/\/[^\/]*$/, '');
          return `${base}/${variables.path}`;
        ]]]
    styles:
      card:
      - padding: 11px 6px
      - border-radius: 12px
      - background: |
          [[[ return location.pathname.toLowerCase().endsWith('/'+variables.path.toLowerCase()) ? 'linear-gradient(135deg,rgba(255,126,25,.14),rgba(0,211,255,.12))' : 'rgba(255,255,255,.03)'; ]]]
      - border: |
          [[[ return location.pathname.toLowerCase().endsWith('/'+variables.path.toLowerCase()) ? '1px solid rgba(25,216,255,.55)' : '1px solid rgba(255,255,255,.07)'; ]]]
      - color: |
          [[[ return location.pathname.toLowerCase().endsWith('/'+variables.path.toLowerCase()) ? '#19d8ff' : '#c4d4e6'; ]]]
      grid:
      - grid-template-areas: '"i n"'
      - grid-template-columns: auto auto
      - justify-content: center
      - column-gap: 7px
      icon:
      - width: 18px
      - color: |
          [[[ return location.pathname.toLowerCase().endsWith('/'+variables.path.toLowerCase()) ? '#19d8ff' : '#8fa6bf'; ]]]
      name:
      - font-size: 12px
      - font-weight: 600
  fc_navbar:
    show_name: false
    show_icon: false
    show_state: false
    styles:
      card:
      - padding: 0
      - background: transparent
      - box-shadow: none
      - border: none
      grid:
      - grid-template-areas: '"a b c d e f g h i j k"'
      - grid-template-columns: repeat(11,1fr)
      - column-gap: 8px
    custom_fields:
      a:
        card:
          type: custom:button-card
          template: fc_nav
          name: Accueil
          icon: mdi:home
          variables:
            path: Emsdash
      b:
        card:
          type: custom:button-card
          template: fc_nav
          name: Énergie
          icon: mdi:lightning-bolt
          variables:
            path: energie
      c:
        card:
          type: custom:button-card
          template: fc_nav
          name: Flux
          icon: mdi:graph-outline
          variables:
            path: flux
      d:
        card:
          type: custom:button-card
          template: fc_nav
          name: Onduleur
          icon: mdi:solar-power
          variables:
            path: onduleur
      e:
        card:
          type: custom:button-card
          template: fc_nav
          name: Boiler
          icon: mdi:water-boiler
          variables:
            path: boiler
      f:
        card:
          type: custom:button-card
          template: fc_nav
          name: Machines
          icon: mdi:washing-machine
          variables:
            path: appareils
      g:
        card:
          type: custom:button-card
          template: fc_nav
          name: Chauffage
          icon: mdi:radiator
          variables:
            path: chauffage
      h:
        card:
          type: custom:button-card
          template: fc_nav
          name: Délestage
          icon: mdi:flash-alert
          variables:
            path: delestage
      i:
        card:
          type: custom:button-card
          template: fc_nav
          name: Économie
          icon: mdi:chart-timeline-variant-shimmer
          variables:
            path: marche
      j:
        card:
          type: custom:button-card
          template: fc_nav
          name: Diagnostic
          icon: mdi:stethoscope
          variables:
            path: diagnostic
      k:
        card:
          type: custom:button-card
          template: fc_nav
          name: Paramètres
          icon: mdi:cog
          variables:
            path: technique
  fc_head:
    template: fc_panel
    variables:
      title: ''
      subtitle: ''
      icon: mdi:home
      color: '#38bdf8'
    custom_fields:
      c: |
        [[[
          return `<div class="p" style="display:flex;align-items:center;gap:14px;padding:14px 20px">
            <div class="ring" style="width:46px;height:46px;background:linear-gradient(135deg,rgba(255,126,25,.15),rgba(0,211,255,.12));border:1px solid rgba(255,255,255,.10);box-shadow:-5px 0 20px rgba(255,110,15,.12),5px 0 20px rgba(0,210,255,.12)"><ha-icon icon="${variables.icon}" style="color:${variables.color}"></ha-icon></div>
            <div><div style="font-size:22px;font-weight:800;letter-spacing:.03em">${variables.title}</div>
            <div class="k">${variables.subtitle}</div></div>
            <div style="margin-left:auto;font-weight:800;letter-spacing:.04em"><span style="color:#ff922b">FOX</span><span style="color:#19d8ff">CAT</span> <span style="font-weight:500;color:#cbd5e1">ENERGY</span></div>
          </div>`;
        ]]]
  fc_list:
    template: fc_panel
    variables:
      title: ''
      icon: mdi:information
      rows: []
    custom_fields:
      c: |
        [[[
          const fmt=id=>{const s=states[id];if(!s)return ['—','#64748b'];const v=s.state;
            if(['unknown','unavailable','none',''].includes(v))return ['—','#64748b'];
            if(v==='on')return ['Actif','#34d399'];
            if(v==='off')return ['Inactif','#8fa6bf'];
            if(!isNaN(Number(v))){const n=Number(v),u=s.attributes.unit_of_measurement||'';return [(Number.isInteger(n)?n:n.toFixed(2).replace('.',','))+(u?' '+u:''),''];}
            return [v,''];};
          const rows=(variables.rows||[]).map(r=>{const f=fmt(r[1]);
            return `<div class="row"><span class="k" style="font-size:12px">${r[0]}</span><b style="font-size:13px;text-align:right;max-width:58%;${f[1]?'color:'+f[1]:''}">${f[0]}</b></div>`}).join('');
          return `<div class="p"><div class="t"><span><ha-icon icon="${variables.icon}"></ha-icon>${variables.title}</span></div>${rows}</div>`;
        ]]]
  fc_btn:
    show_name: true
    show_icon: true
    styles:
      card:
      - padding: 12px 6px
      - border-radius: 12px
      - background: rgba(255,255,255,.04)
      - border: 1px solid rgba(255,255,255,.08)
      - color: '#e8f1fb'
      icon:
      - width: 22px
      - color: '#ffb020'
      name:
      - font-size: 12px
      - font-weight: 700
  fc_device:
    template: fc_panel
    variables:
      name: ''
      sub: Charge pilotée EMS
      emoji: ⚙️
      col: '#38bdf8'
      cy: ''
      pw: ''
      sw: ''
    tap_action:
      action: toggle
    hold_action:
      action: more-info
    custom_fields:
      c: |
        [[[
          const v=variables;
          const pw=Math.max(parseFloat(states[v.pw]?.state)||0,0);
          const cyc=states[v.cy]?.state==='on';
          const sock=states[v.sw]?.state==='on';
          let st='ARRÊT',col='#64748b';
          if(cyc||pw>20){st=cyc?'EN COURS':'EN MARCHE';col='#34d399'}else if(sock){st='PRÊT';col='#facc15'}
          return `<div class="p" style="text-align:center;height:250px;display:flex;flex-direction:column;align-items:center;justify-content:center">
            <div class="ring" style="width:54px;height:54px;border-radius:17px;background:${v.col}22;font-size:28px">${v.emoji}</div>
            <div style="margin-top:10px;font-size:10px;font-weight:800;color:${col}"><span class="dot" style="background:${col};width:7px;height:7px;margin-right:5px;${cyc||pw>20?'box-shadow:0 0 9px '+col:''}"></span>${st}</div>
            <div style="font-size:19px;font-weight:800;margin-top:6px">${v.name}</div>
            <div class="k">${v.sub}</div>
            <div class="stat" style="width:88%;margin-top:12px;padding:12px 6px"><b style="font-size:28px">${Math.round(pw)}<span style="font-size:11px;opacity:.5"> W</span></b><span>PUISSANCE ACTUELLE</span></div>
            <div class="k" style="margin-top:10px;font-size:11px">${sock?'⚡ Prise active':'○ Prise coupée'}</div>
          </div>`;
        ]]]
  fc_machine:
    show_name: false
    show_icon: false
    show_state: false
    triggers_update: all
    tap_action:
      action: none
    hold_action:
      action: none
    styles:
      card:
      - padding: 0
      - background: transparent
      - border: none
      - box-shadow: none
      - overflow: visible
      grid:
      - grid-template-areas: '"c"'
      - grid-template-columns: 1fr
      custom_fields:
        c:
        - width: 100%
    custom_fields:
      c: |
        [[[
          const V = variables.v;
          const CFG = {
            name: V.name, sub: V.sub, icon: V.icon, kind: V.kind, color: V.col || '#60a5fa', maxW: Number(V.max) || 2200,
            power: V.pw, energy: V.energy || '', cycle: V.cy || '', plug: V.sw || '', cmd: V.cmd_sensor || '',
            idle: ['idle','off','none','unknown','unavailable','standby','ready','','termine','terminé','fin']
          };
          const st = (id) => (id && states[id]) ? states[id] : null;
          const val = (id) => { const s = st(id); return s ? s.state : null; };
          const num = (id) => { const v = parseFloat(val(id)); return isFinite(v) ? v : null; };
          const clamp = (x,a,b) => Math.min(b, Math.max(a, x));
          const esc = (t) => String(t ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
          const w = num(CFG.power), kwh = num(CFG.energy);
          const cycleRaw = val(CFG.cycle), cmdRaw = val(CFG.cmd);
          const plugOn = st(CFG.plug) ? val(CFG.plug) === 'on' : null;
          const cycleActive = cycleRaw != null && !CFG.idle.includes(String(cycleRaw).toLowerCase());
          const running = (w != null && w > 20) || cycleActive;
          const unavailable = [CFG.power, CFG.plug].filter(Boolean).every(id => !st(id) || val(id) === 'unavailable');
          let status, scol;
          if (unavailable)          { status = 'INDISPONIBLE'; scol = '#94a3b8'; }
          else if (plugOn === false){ status = 'PRISE OFF';    scol = '#fb7185'; }
          else if (running)         { status = 'EN COURS';     scol = CFG.color; }
          else                      { status = 'PRÊT';         scol = '#34d399'; }
          const col = CFG.color;
          const pct = w != null ? clamp(w / CFG.maxW, 0, 1) : 0;
          const R = 47, C = 2 * Math.PI * R;
          const wTxt = w == null ? '—' : (w >= 1000 ? (w/1000).toFixed(2) : Math.round(w));
          const wUnit = w != null && w >= 1000 ? 'kW' : 'W';
          const cmdMap = { auto:'AUTO', off:'OFF', start:'DÉMARRAGE', demarrage:'DÉMARRAGE', on:'ON' };
          const cmdTxt = (cmdRaw == null || ['unknown','unavailable'].includes(cmdRaw)) ? null : (cmdMap[String(cmdRaw).toLowerCase()] || String(cmdRaw).toUpperCase());
          const uid = 'fx' + String(CFG.kind).replace(/[^a-zA-Z0-9]/g,'');

          const NOW = Date.now() / 1000;
          const ph = (d, o = 0) => `-${((NOW + o) % d).toFixed(2)}s`;
          const PS = running ? 'running' : 'paused';
          const A  = (n, d, tf = 'linear', o = 0, x = 'infinite') => `animation:${n} ${d}s ${tf} ${ph(d, o)} ${x};animation-play-state:${PS};`;
          const AA = (n, d, tf = 'linear', o = 0, x = 'infinite') => `animation:${n} ${d}s ${tf} ${ph(d, o)} ${x};`;
          const rot = (d, rev = false, ox = 50, oy = 50) => `transform-origin:${ox}px ${oy}px;${A(rev ? 'fx-spinr' : 'fx-spin', d)}`;

          const sp = running ? Math.max(0.8, Math.round((3.4 - 2.6 * pct) * 5) / 5) : 3.4;
          const shake = running && pct > 0.6 && CFG.kind === 'washer';

          const tC = num(V.temp);
          const heat = (v) => v == null ? col : v < 35 ? '#38bdf8' : v < 45 ? '#22d3ee' : v < 55 ? '#fbbf24' : v < 65 ? '#fb923c' : '#f87171';
          const wcol = CFG.kind === 'boiler' ? heat(tC) : col;
          const steamOn = running || (tC != null && tC >= 50);

          const wave = (y, fill) => `<path d="M-50 ${y} q12.5 -5 25 0 t25 0 t25 0 t25 0 t25 0 t25 0 t25 0 t25 0 V110 H-50 Z" fill="${fill}"/>`;
          const parts = (n, x0, x1, y, h, d0, fill = '#fff') => !running ? '' : Array.from({ length: n }, (_, i) => {
            const x = x0 + (((i * 37) % 100) / 100) * (x1 - x0);
            const d = +(d0 + ((i * 53) % 10) / 10).toFixed(1);
            return `<circle cx="${x.toFixed(1)}" cy="${y}" r="${(1.2 + (i % 3) * .6).toFixed(1)}" fill="${fill}" style="--h:-${h}px;${A('fx-bub', d, 'ease-in', i * .7)}"/>`;
          }).join('');
          const steam = (xs, y) => xs.map((x, i) => `<ellipse class="fx-stm" cx="${x}" cy="${y}" rx="3" ry="5" fill="#e2e8f0" style="${AA('fx-steam', +(3 + i * .5).toFixed(1), 'ease-out', i * 1.1)}"/>`).join('');
          const holes = (r, n, rr) => Array.from({ length: n }, (_, i) => { const a = i / n * 2 * Math.PI; return `<circle cx="${(50 + r * Math.cos(a)).toFixed(1)}" cy="${(50 + r * Math.sin(a)).toFixed(1)}" r="${rr}"/>`; }).join('');
          const glint = `<rect x="-24" y="0" width="9" height="100" fill="#fff" opacity=".09" style="${AA('fx-glint', 7, 'ease-in-out')}"/>`;
          const rim = `<circle cx="50" cy="50" r="31" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="1"/>
              <path d="M30 36 A26 26 0 0 1 46 24" stroke="rgba(255,255,255,.35)" stroke-width="2" fill="none" stroke-linecap="round"/>`;
          const clothes = `<g style="${rot(sp)}">
              <circle cx="50" cy="26" r="7" fill="#f472b6" opacity=".9"/><circle cx="73" cy="58" r="6" fill="#fbbf24" opacity=".9"/>
              <circle cx="30" cy="62" r="7.5" fill="#60a5fa" opacity=".9"/><circle cx="58" cy="44" r="5" fill="#a78bfa" opacity=".85"/></g>`;

          let scene = '';
          if (CFG.kind === 'washer') {
            scene = `
              <clipPath id="${uid}c"><circle cx="50" cy="50" r="31"/></clipPath>
              <circle cx="50" cy="50" r="36" fill="rgba(255,255,255,.05)" stroke="${col}" stroke-opacity=".55" stroke-width="2.4"/>
              <g fill="${col}" opacity=".5" style="${rot(14, true)}">${holes(33.6, 12, .9)}</g>
              <circle cx="50" cy="50" r="31" fill="#07101d"/>
              <g clip-path="url(#${uid}c)">
                <g fill="rgba(255,255,255,.07)" style="${rot(sp)}">${holes(26, 14, 1.3)}${holes(17, 9, 1.1)}</g>
                <g style="transform:translateY(${running ? 0 : 6}px);transition:transform 1s">
                  <g style="transform-origin:50px 50px;${A('fx-slosh', 2.4, 'ease-in-out', 0, 'infinite alternate')}">
                    <g style="${A('fx-wave', 2.6)}">${wave(52, col + '88')}</g>
                    <g style="${A('fx-wave', 3.8, 'linear', 0, 'infinite reverse')}">${wave(56, col + '55')}</g>
                  </g>
                </g>
                ${clothes}
                ${parts(8, 26, 74, 76, 34, 1.8)}
                ${glint}
              </g>
              ${rim}`;
          } else if (CFG.kind === 'dryer') {
            scene = `
              <clipPath id="${uid}c"><circle cx="50" cy="50" r="31"/></clipPath>
              <radialGradient id="${uid}g"><stop offset="0" stop-color="${col}" stop-opacity="${running ? .55 : .12}"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></radialGradient>
              <circle cx="50" cy="50" r="36" fill="rgba(255,255,255,.05)" stroke="${col}" stroke-opacity=".55" stroke-width="2.4"/>
              <g fill="${col}" opacity=".5" style="${rot(14, true)}">${holes(33.6, 12, .9)}</g>
              <circle cx="50" cy="50" r="31" fill="#07101d"/>
              <circle cx="50" cy="50" r="31" fill="url(#${uid}g)" style="${running ? AA('fx-breath', 1.8, 'ease-in-out') : 'opacity:.5'}"/>
              <g clip-path="url(#${uid}c)">
                <g stroke="rgba(255,255,255,.14)" stroke-width="2.2" stroke-linecap="round" style="${rot(sp)}">
                  <path d="M50 19 V30 M76.8 65.5 L67.3 60 M23.2 65.5 L32.7 60"/>
                </g>
                ${clothes}
                ${running ? [0,1,2].map(i => `<path d="M${36+i*14} 74 q4 -6 0 -12 t0 -12" fill="none" stroke="${col}" stroke-width="2" stroke-linecap="round" style="${A('fx-heat', 2, 'ease-in-out', i * .5)}"/>`).join('') : ''}
                ${parts(6, 28, 72, 78, 40, 1.4, '#fde68a')}
                ${glint}
              </g>
              ${rim}`;
          } else if (CFG.kind === 'dish') {
            scene = `
              <clipPath id="${uid}c"><rect x="17" y="17" width="66" height="66" rx="12"/></clipPath>
              <rect x="15" y="15" width="70" height="70" rx="14" fill="rgba(255,255,255,.05)" stroke="${col}" stroke-opacity=".55" stroke-width="2.4"/>
              <rect x="17" y="17" width="66" height="66" rx="12" fill="#07101d"/>
              <g clip-path="url(#${uid}c)">
                <g opacity="${running ? .12 : 0}"><rect x="17" y="17" width="66" height="66" fill="${col}" style="${running ? AA('fx-breath', 2.2, 'ease-in-out') : ''}"/></g>
                <rect x="17" y="62" width="66" height="22" fill="${col}" opacity="${running ? .2 : .06}"/>
                <g style="${A('fx-wave', 2.4)}">${wave(80, col + '44')}</g>
                <g stroke="rgba(255,255,255,.35)" stroke-width="1.4" fill="none" stroke-linecap="round">
                  <path d="M24 66 h52"/><path d="M26 66 v-10 M34 66 v-10 M42 66 v-10 M58 66 v-10 M66 66 v-10 M74 66 v-10"/>
                  <ellipse cx="30" cy="56" rx="2" ry="9"/><ellipse cx="46" cy="56" rx="2" ry="9"/><ellipse cx="62" cy="56" rx="2" ry="9"/><ellipse cx="72" cy="56" rx="2" ry="9"/>
                </g>
                <g style="${rot(+(sp * .7).toFixed(1), false, 50, 41.7)}">
                  <rect x="24" y="40" width="52" height="3.4" rx="1.7" fill="${col}"/>
                  <circle cx="50" cy="41.7" r="3.4" fill="#fff" opacity=".9"/>
                  ${running ? `<path d="M25 40 q-2 -5 2 -9 M75 43.4 q2 5 -2 9" stroke="${col}" stroke-width="1.2" stroke-dasharray="1.5 2" fill="none" stroke-linecap="round" style="${A('fx-flow', .5)}"/>` : ''}
                </g>
