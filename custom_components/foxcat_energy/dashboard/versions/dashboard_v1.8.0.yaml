                  const digits = code.split('').map((b, i) => `<span style="display:inline-block;width:34px;text-align:center;font:800 26px 'JetBrains Mono',ui-monospace,monospace;color:${b === '1' ? '#ffad42' : '#475569'}">${b}</span>`).join('');
