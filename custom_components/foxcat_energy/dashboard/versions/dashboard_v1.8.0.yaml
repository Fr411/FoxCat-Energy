            const ackCol = (v) => { const n = norm(v); if (n.startsWith('nok')) return '#ffad42'; if (n.includes('fail') || n.includes('erreur') || n.includes('indispon') || n.includes('absent') || n.includes('bloque')) return '#fb7185'; if (n.includes('pend') || n.includes('attente') || n.includes('degrad')) return '#facc15'; if (n === 'ok' || n.includes('dispon')) return '#36e59b'; return '#64748b'; };
