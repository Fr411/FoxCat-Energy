              @keyframes iv-ping{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.6);opacity:.5}}
              @keyframes iv-row{0%,100%{box-shadow:0 0 0 0 transparent}50%{box-shadow:0 0 18px #facc1544}}
              @keyframes iv-halo{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:.8;transform:scale(1.04)}}
              @keyframes iv-shine{0%{transform:translateX(-60px)}100%{transform:translateX(220px)}}
