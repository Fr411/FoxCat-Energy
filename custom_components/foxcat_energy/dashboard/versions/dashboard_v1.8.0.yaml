                const v = states[i].state;
                return ['unknown', 'unavailable', 'none', ''].includes(v) ? f : v;
              };

              const N = (i, f = 0) => {
                const v = parseFloat(S(i, ''));
                return isFinite(v) ? v : f;
              };

              const W = v => {
                v = Math.abs(v);
                return v >= 1000 ? (v / 1000).toFixed(2).replace('.', ',') + ' kW' : Math.round(v) + ' W';
              };

              // 2. Récupération des variables
              const lvl = Math.min(Math.max(N(F('sensor', ['niveau', 'puissance', 'pri', 'actuel']), 100), 0), 100);
              const tgt = Math.round(N(F('sensor', ['niveau', 'puissance', 'pri', 'cible']), lvl));
              const dir = S(F('sensor', ['direction', 'pri']), 'Maintien');
              const ackInv = S(F('sensor', ['ack', 'onduleur']));
              const ackR = S(F('sensor', ['ack', 'rrcr']));
              const ackL = S(F('sensor', ['ack', 'logo']));
              const ok = !/FAILED|ERREUR/i.test(ackInv + ackR + ackL);
              const ackCls = v => /FAIL|ERR/i.test(v) ? ['#fb7185', 'ÉCHEC'] : /^NOK/i.test(v) ? ['#fbbf24', 'ÉCART'] : /^OK|DONE|CONFIRM/i.test(v) ? ['#35e59d', 'OK'] : /WAIT|PEND|ATTENTE|SENT/i.test(v) ? ['#fbbf24', 'ATTENTE'] : /IDLE|—/i.test(v) ? ['#64748b', 'REPOS'] : ['#19d8ff', String(v).toUpperCase().slice(0, 9)];
              const relays = [['RRCR', ackR], ['LOGO', ackL], ['ONDULEUR', ackInv]].map(([n, v]) => { const [c, l] = ackCls(v); return `<div class="rly" style="--c:${c}"><i></i><span>${n}</span><b>${l}</b></div>`; }).join('');
              const pv = Math.max(N('[[foxcat:legacy.sensor_foxcat_energy_energie_puissance_de_production_photovoltaique]]'), 0);
              const ex = Math.max(N('[[foxcat:legacy.sensor_foxcat_energy_energie_puissance_reinjectee_au_reseau]]'), 0);

              // 3. Calcul de la jauge SVG
              const radius = 40;
              const circumference = 2 * Math.PI * radius;
              const dashoffset = circumference - (circumference * lvl / 100);

              // Couleurs dynamiques
              const statusColor = ok ? '#35e59d' : '#fb7185';
              const statusBg = ok ? 'rgba(53,229,157,0.12)' : 'rgba(251,113,133,0.12)';
              const dirColor = dir.toLowerCase().includes('baisse') ? '#35e59d' : dir.toLowerCase().includes('hausse') ? '#fb7185' : '#19d8ff';

              // 4. Rendu HTML Premium
              return `
                <style>
                  * { box-sizing: border-box; }
                  .prem-card {
                    padding: 20px;
                    color: #f8fafc;
                    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                    background: linear-gradient(145deg, rgba(11,20,31,0.6), rgba(8,14,22,0.8));
                    border-radius: 24px;
                  }

                  /* En-tête */
                  .prem-header {
                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                    margin-bottom: 24px;
                  }
                  .prem-title {
                    display: flex;
                    align-items: center;
                    gap: 10px;
                    font-size: 15px;
                    font-weight: 800;
                    color: #ffffff;
                    letter-spacing: 0.02em;
                  }
                  .prem-title ha-icon {
                    color: #19d8ff;
                    --mdc-icon-size: 22px;
                    filter: drop-shadow(0 0 8px rgba(25,216,255,0.4));
                  }
                  .prem-chip {
                    display: flex;
                    align-items: center;
                    gap: 6px;
                    padding: 5px 10px;
                    border-radius: 12px;
                    font-size: 9px;
                    font-weight: 900;
                    letter-spacing: 0.05em;
                    border: 1px solid transparent;
                  }
                  .prem-dot {
                    width: 6px;
                    height: 6px;
                    border-radius: 50%;
                  }

                  /* Section centrale */
                  .prem-body {
                    display: flex;
                    align-items: center;
                    justify-content: space-between;
                    margin-bottom: 24px;
                    padding: 0 10px;
                  }

                  /* Onduleur CSS 3D */
                  .css-inverter {
                    width: 76px;
                    height: 100px;
                    border-radius: 12px;
                    background: linear-gradient(145deg, #1e293b, #0f172a);
                    border: 1px solid rgba(255,255,255,0.1);
                    box-shadow:
                      0 15px 25px rgba(0,0,0,0.5),
                      inset 0 2px 0 rgba(255,255,255,0.08),
                      inset 0 -2px 0 rgba(0,0,0,0.4);
                    display: flex;
                    flex-direction: column;
                    align-items: center;
                    justify-content: center;
                    position: relative;
                    flex: none;
                  }
                  .css-inverter ha-icon {
                    color: #94a3b8;
                    --mdc-icon-size: 32px;
                    opacity: 0.6;
                  }
                  .css-inverter .led {
                    position: absolute;
                    bottom: 16px;
                    width: 34px;
                    height: 3px;
                    background: #19d8ff;
                    border-radius: 3px;
                    box-shadow: 0 0 10px #19d8ff;
                  }

                  /* Jauge SVG */
                  .svg-gauge {
                    position: relative;
                    width: 120px;
                    height: 120px;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    flex: none;
                  }
                  .svg-gauge svg {
                    position: absolute;
                    top: 0;
                    left: 0;
                    width: 100%;
                    height: 100%;
                    transform: rotate(-90deg);
                    filter: drop-shadow(0 0 8px rgba(25,216,255,0.4));
                  }
                  .svg-bg {
                    fill: none;
                    stroke: rgba(255,255,255,0.05);
                    stroke-width: 6;
                  }
                  .svg-val {
                    fill: none;
                    stroke: #19d8ff;
                    stroke-width: 6;
                    stroke-linecap: round;
                    stroke-dasharray: ${circumference};
                    stroke-dashoffset: ${dashoffset};
                    transition: stroke-dashoffset 1s ease-out;
                  }
                  .gauge-center {
                    text-align: center;
                    z-index: 2;
                  }
                  .gauge-val {
                    font-size: 26px;
                    font-weight: 900;
                    color: #ffffff;
                    line-height: 1;
                  }
                  .gauge-lbl {
                    display: block;
                    margin-top: 4px;
                    font-size: 8px;
                    font-weight: 800;
                    color: #94a3b8;
                    letter-spacing: 0.05em;
                  }

                  /* Cible */
                  .target-block {
                    text-align: right;
                    display: flex;
                    flex-direction: column;
                    align-items: flex-end;
                  }
                  .t-lbl { font-size: 8px; color: #64748b; font-weight: 900; letter-spacing: 0.1em; }
                  .t-val { font-size: 22px; font-weight: 900; color: #ffffff; margin: 2px 0; }
                  .t-dir { font-size: 10px; font-weight: 800; color: ${dirColor}; }
                  .t-max { margin-top: 8px; font-size: 9px; color: #475569; font-weight: 800; background: rgba(255,255,255,0.03); padding: 4px 8px; border-radius: 8px; }

                  /* Ligne du bas */
                  .prem-footer {
                    display: grid;
                    grid-template-columns: repeat(2, 1fr);
                    gap: 10px;
                    padding-top: 16px;
                    border-top: 1px solid rgba(255,255,255,0.05);
                  }
                  .metric {
                    background: rgba(255,255,255,0.02);
                    border: 1px solid rgba(255,255,255,0.04);
                    padding: 12px;
                    border-radius: 14px;
                    text-align: center;
                  }
                  .m-val { display: block; font-size: 16px; font-weight: 900; }
                  .m-lbl { display: block; margin-top: 4px; font-size: 8px; font-weight: 800; color: #64748b; letter-spacing: 0.05em; }

                  .rly-box { margin-top: 10px; padding: 10px 12px; border-radius: 14px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.04); }
                  .rly-t { font-size: 8px; font-weight: 900; letter-spacing: 0.12em; color: #64748b; margin-bottom: 8px; }
                  .rly-g { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
                  .rly { display: flex; align-items: center; gap: 6px; padding: 7px 8px; border-radius: 10px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); }
                  .rly i { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--c); box-shadow: 0 0 8px var(--c); }
                  .rly span { font-size: 9px; font-weight: 800; color: #94a3b8; letter-spacing: 0.04em; flex: 1; }
                  .rly b { font-size: 9px; font-weight: 900; color: var(--c); letter-spacing: 0.04em; }
                  .c-solar { color: #ff982f; }
                  .c-export { color: #35e59d; }
                  .c-neutral { color: #cbd5e1; }
                </style>

                <div class="prem-card">

                  <!-- HEADER -->
                  <div class="prem-header">
                    <div class="prem-title">
                      <ha-icon icon="mdi:solar-power-variant"></ha-icon>
                      <span>Onduleur SolarEdge</span>
                    </div>
                    <div class="prem-chip" style="color: ${statusColor}; background: ${statusBg}; border-color: ${statusColor}40;">
                      <span class="prem-dot" style="background: ${statusColor}; box-shadow: 0 0 6px ${statusColor};"></span>
                      ${ok ? 'CONNECTÉ' : 'DÉFAUT'}
                    </div>
                  </div>

                  <!-- BODY -->
                  <div class="prem-body">

                    <!-- Inverter 3D CSS -->
                    <div class="css-inverter">
                      <ha-icon icon="mdi:solar-power"></ha-icon>
                      <div class="led"></div>
                    </div>

                    <!-- Jauge SVG -->
                    <div class="svg-gauge">
                      <svg>
                        <circle class="svg-bg" cx="60" cy="60" r="40"></circle>
                        <circle class="svg-val" cx="60" cy="60" r="40"></circle>
                      </svg>
                      <div class="gauge-center">
                        <div class="gauge-val">${Math.round(lvl)} <span style="font-size:14px;">%</span></div>
                        <div class="gauge-lbl">PALIER ACTUEL</div>
                      </div>
                    </div>

                    <!-- Infos Cible -->
                    <div class="target-block">
                      <span class="t-lbl">CIBLE EMS</span>
                      <span class="t-val">${tgt} %</span>
                      <span class="t-dir">${dir}</span>
                      <span class="t-max">Max ${Math.round(lvl * 40)} W</span>
                    </div>

                  </div>

                  <!-- FOOTER -->
                  <div class="prem-footer">
                    <div class="metric">
                      <span class="m-val c-solar">${W(pv)}</span>
                      <span class="m-lbl">PRODUCTION PV</span>
                    </div>
                    <div class="metric">
                      <span class="m-val c-export">${W(ex)}</span>
                      <span class="m-lbl">RÉINJECTION</span>
                    </div>
                  </div>
                  <div class="rly-box">
                    <div class="rly-t">ACQUISITION DES RELAIS</div>
                    <div class="rly-g">${relays}</div>
                  </div>

                </div>
              `;
            ]]]
      - type: custom:button-card
        entity: sensor.foxcat_energy_boiler_temperature_chauffe_eau
        show_name: false
        show_icon: false
        show_state: false
        triggers_update: all
        tap_action:
          action: more-info
          entity: sensor.foxcat_energy_boiler_temperature_chauffe_eau
        hold_action:
          action: more-info
          entity: sensor.foxcat_energy_boiler_etat_dexecution_chauffe_eau
        styles:
          card:
          - padding: 0
          - border-radius: 20px
          - overflow: hidden
          - color: '#f8fafc'
          - background: 'radial-gradient(circle at 3% 50%, rgba(255,120,20,0.12), transparent 26%), radial-gradient(circle at 95% 30%, rgba(0,210,255,0.10), transparent 30%), linear-gradient(135deg, #080d16 0%, #0a1420 48%, #071827 100%)'
          - border: 1px solid rgba(255,255,255,0.08)
          - box-shadow: 0 10px 30px rgba(0,0,0,0.30), inset 0 1px 0 rgba(255,255,255,0.035)
          grid:
          - grid-template-areas: '"card"'
          - grid-template-columns: 1fr
          custom_fields:
            card:
            - width: 100%
        custom_fields:
          card: |
            [[[
              /* FOXCAT ENERGY — BOILER ECS · carte compacte Accueil (tablette) */
              const BAD = ['unknown', 'unavailable', 'none', ''];
              const S = (id, fb = '—') => { const v = states[id]?.state; return (!v || BAD.includes(v)) ? fb : v; };
              const N = (id) => { const v = parseFloat(states[id]?.state); return Number.isFinite(v) ? v : NaN; };
              const on = (id) => states[id]?.state === 'on';
              const clamp = (n, a = 0, b = 100) => Math.min(b, Math.max(a, Number(n) || 0));
              const F = (v, unit = '', d = 1) => Number.isFinite(v) ? `${v.toFixed(d).replace('.', ',')}${unit ? ' ' + unit : ''}` : '—';
              const esc = (v) => String(v ?? '—').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

              const NOW = Date.now() / 1000;
              const ph = (d, o = 0) => `-${((NOW + o) % d).toFixed(2)}s`;
              const A = (name, d, timing = 'linear', o = 0, extra = 'infinite') => `animation:${name} ${d}s ${timing} ${ph(d, o)} ${extra}`;

              const temperature = N('sensor.foxcat_energy_boiler_temperature_chauffe_eau');
              const power = N('[[foxcat:legacy.sensor_foxcat_energy_boiler_puissance_chauffe_eau]]');
              const estT = N('sensor.foxcat_energy_boiler_boiler_temperature_thermique_estimee');
              const missing = N('sensor.foxcat_energy_boiler_boiler_energie_thermique_manquante');
              const duration = N('sensor.foxcat_energy_boiler_boiler_duree_de_chauffe_estimee');
              const target = N('[[foxcat:legacy.number_foxcat_energy_boiler_temperature_confort_boiler]]');
              const safeLimit = N('[[foxcat:legacy.number_foxcat_energy_boiler_securite_temperature_boiler]]');
              const mode = S('[[foxcat:ems.mode]]', 'Indisponible');

              const securityActive = on('binary_sensor.foxcat_energy_boiler_securite_thermique_resistance');
              const physical = on('[[foxcat:legacy.binary_sensor_foxcat_energy_boiler_boiler_physique]]');
              const running = physical && Number.isFinite(power) && power > 100;
              const t = Number.isFinite(temperature) ? temperature : estT;
              const steamOn = running || (Number.isFinite(t) && t >= 50);

              const T_MIN = 20;
              const T_MAX = Math.max(70, Number.isFinite(safeLimit) ? Math.ceil(safeLimit / 5) * 5 : 70);
              const fill = Number.isFinite(t) ? clamp(((t - T_MIN) / (T_MAX - T_MIN)) * 100) : 0;
              const heat = (v) => !Number.isFinite(v) ? '#64748b' : v < 35 ? '#38bdf8' : v < 45 ? '#22d3ee' : v < 55 ? '#fbbf24' : v < 65 ? '#fb923c' : '#f87171';
              const tempColor = securityActive ? '#f87171' : heat(t);
              const topColor = securityActive ? '#f87171' : heat(t + 6);
              const botColor = heat(t - 14);
              const runColor = securityActive ? '#f87171' : running ? '#fb923c' : '#64748b';
              const reached = Number.isFinite(target) && Number.isFinite(t) && t >= target;
              const prog = Number.isFinite(t) && Number.isFinite(target) && target > T_MIN ? clamp(((t - T_MIN) / (target - T_MIN)) * 100) : 0;

              const plannerAttr = states['sensor.foxcat_energy_machines_planificateur_charges_flexibles']?.attributes || {};
              const dayAheadAttr = states['sensor.foxcat_energy_tarification_planificateur_day_ahead']?.attributes || {};
              const nowD = new Date();
              const segs = (plannerAttr.boiler?.segments || []).map((s) => ({ a: new Date(s.start), b: new Date(s.end) }))
                .filter((s) => !isNaN(s.a) && s.b > nowD).sort((x, y) => x.a - y.a);
              let startAt = segs.length ? segs[0].a : null;
              if (!startAt && dayAheadAttr.boiler_creneau_reserve_debut) {
                const d = new Date(dayAheadAttr.boiler_creneau_reserve_debut);
                if (!isNaN(d) && d > nowD) startAt = d;
              }
              const startNow = !running && !!startAt && startAt <= nowD;
              const hm = (d) => d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
              const until = (d) => { const m = Math.max(0, Math.round((d - nowD) / 60000)); return m < 60 ? `dans ${m} min` : `dans ${Math.floor(m / 60)} h ${String(m % 60).padStart(2, '0')}`; };
              const t0 = new Date(nowD.getFullYear(), nowD.getMonth(), nowD.getDate());
              const dayLabel = (d) => { const diff = Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - t0) / 864e5); return diff === 0 ? "Aujourd'hui" : diff === 1 ? 'Demain' : d.toLocaleDateString('fr-FR', { weekday: 'long' }); };
              const nxt = running
                ? { v: 'En chauffe', s: Number.isFinite(duration) ? `fin estimée dans ${F(duration, 'h', 2)}` : 'chauffe en cours', c: '#fb923c', i: 'mdi:fire' }
                : securityActive ? { v: 'Bloqué', s: 'sécurité thermique active', c: '#f87171', i: 'mdi:shield-alert' }
                : startNow ? { v: 'Maintenant', s: 'créneau favorable en cours', c: '#34d399', i: 'mdi:play-circle' }
                : startAt ? { v: hm(startAt), s: `${dayLabel(startAt)} · ${until(startAt)}`, c: '#19d8ff', i: 'mdi:clock-start' }
                : { v: '—', s: reached ? 'consigne atteinte, aucun besoin' : 'aucun démarrage planifié', c: '#64748b', i: 'mdi:clock-outline' };

              const status = securityActive ? 'SÉCURITÉ THERMIQUE' : running ? 'CHAUFFE EN COURS' : physical ? 'EN ATTENTE' : 'NON DÉTECTÉ';
              const statusIcon = securityActive ? 'mdi:shield-alert' : running ? 'mdi:fire' : physical ? 'mdi:pause-circle-outline' : 'mdi:help-circle-outline';

              const nb = running ? 8 : (physical ? 3 : 0);
              const bubbles = Array.from({ length: nb }, (_, i) => {
                const left = 12 + ((i * 37) % 72);
                const dur = running ? +(2.4 + ((i * 53) % 25) / 10).toFixed(1) : 6 + (i % 3);
                const size = running ? 3 + ((i * 7) % 5) : 3;
                return `<span class="bub" style="left:${left}%;width:${size}px;height:${size}px;${A('rise', dur, 'ease-in', i * 0.83)}"></span>`;
              }).join('');
              const steam = steamOn ? [0, 1, 2].map((i) => `<span class="stm" style="left:${28 + i * 22}%;${A('steam', +(3.4 + i * 0.6).toFixed(1), 'ease-out', i * 1.3)}"></span>`).join('') : '';
              const wave = (col, cls) => `<svg class="wave ${cls}" viewBox="0 0 200 20" preserveAspectRatio="none"><path d="M0 10 Q 25 0 50 10 T 100 10 T 150 10 T 200 10 V 20 H 0 Z" fill="${col}"/></svg>`;
              const stat = (icon, label, value, color = '#f1f5f9') => `<div class="st"><div class="st-top"><ha-icon icon="${icon}"></ha-icon><span>${label}</span></div><b style="color:${color}">${value}</b></div>`;

              return `
                <style>
                  *{box-sizing:border-box}
                  ha-icon{display:inline-flex}
                  .bc{position:relative;padding:16px 18px 18px;color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;text-align:left;overflow:hidden}
                  .bc::before{content:"";position:absolute;top:-90px;right:-70px;width:240px;height:240px;border-radius:50%;background:${tempColor};filter:blur(70px);opacity:${running ? .22 : .10};pointer-events:none}
                  .bc>*{position:relative}
                  .head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
                  .brand{display:flex;align-items:center;gap:11px;min-width:0}
                  .logo{position:relative;overflow:hidden;width:38px;height:38px;flex:none;display:grid;place-items:center;border-radius:13px;color:${tempColor};box-shadow:0 0 20px ${tempColor}30}
                  .logo::before{content:"";position:absolute;inset:-50%;background:conic-gradient(from 0deg,transparent 0 55%,${tempColor} 75%,transparent 95%);${A('spin', running ? 2.6 : 8)}}
                  .logo::after{content:"";position:absolute;inset:2px;border-radius:11px;background:linear-gradient(135deg,#13233a,#1d1a24)}
                  .logo ha-icon{position:relative;z-index:1;--mdc-icon-size:21px}
                  .eyebrow{color:#ff922b;font-size:9px;font-weight:800;letter-spacing:.2em}
                  .title{margin-top:2px;font-size:18px;font-weight:800;letter-spacing:-.01em}
                  .status{display:flex;align-items:center;gap:6px;padding:7px 11px;border-radius:999px;border:1px solid ${runColor}55;background:${runColor}14;color:${runColor};font-size:9px;font-weight:800;letter-spacing:.08em;white-space:nowrap}
                  .status ha-icon{--mdc-icon-size:14px}
                  .stage{display:flex;align-items:center;gap:20px;padding:30px 14px 12px;border-radius:20px;background:linear-gradient(160deg,rgba(255,255,255,.045),rgba(255,255,255,.012));border:1px solid rgba(255,255,255,.07)}
                  .tank{position:relative;width:70px;height:132px;flex:none;border-radius:35px;padding:7px;background:linear-gradient(100deg,#0b1220 0%,#3b4a60 20%,#172235 46%,#0b1220 75%,#52627a 100%);border:2px solid rgba(148,163,184,.4);box-shadow:inset 4px 0 7px rgba(255,255,255,.08),inset -5px 0 8px rgba(0,0,0,.55),0 10px 20px rgba(0,0,0,.5),0 0 30px ${tempColor}${running ? '40' : '14'}}
                  .steam{position:absolute;left:0;right:0;top:-30px;height:34px;pointer-events:none}
                  .stm{position:absolute;bottom:0;width:12px;height:24px;margin-left:-6px;border-radius:50%;background:radial-gradient(ellipse at center,rgba(226,232,240,.5),rgba(226,232,240,0) 70%);filter:blur(3px)}
                  .glass{position:relative;width:100%;height:100%;overflow:hidden;border-radius:28px;background:linear-gradient(180deg,#09182a,#060e1a);border:1px solid rgba(255,255,255,.08)}
                  .water{position:absolute;left:0;right:0;bottom:0;height:${fill}%;min-height:5px;background:linear-gradient(180deg,${topColor}d0 0%,${tempColor}90 45%,${botColor}70 100%)}
                  .wave{position:absolute;top:-7px;left:0;width:200%;height:9px}
                  .wave.w1{opacity:.9;${A('wave', running ? 3 : 5)}}
                  .wave.w2{opacity:.45;top:-9px;${A('wave', running ? 5 : 8, 'linear', 0, 'infinite reverse')}}
                  .inner{position:absolute;inset:0;overflow:hidden}
                  .bub{position:absolute;bottom:2%;border-radius:50%;background:rgba(255,255,255,.6);box-shadow:0 0 4px rgba(255,255,255,.5)}
                  .hglow{position:absolute;left:50%;top:70%;width:64px;height:44px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(ellipse at center,${runColor}70,transparent 65%);opacity:${running ? 1 : 0};z-index:2;${running ? A('breath', 1.6, 'ease-in-out') : ''}}
                  .heater{position:absolute;left:50%;top:70%;width:38px;height:19px;transform:translate(-50%,-50%);opacity:${running ? 1 : .3};z-index:2}
                  .heater path{fill:none;stroke:${runColor};stroke-width:4;stroke-linecap:round;stroke-linejoin:round;${running ? `filter:drop-shadow(0 0 5px ${runColor});` + A('hot', 1.6, 'ease-in-out') : ''}}
                  .pipe{position:absolute;right:-8px;width:12px;height:7px;border-radius:0 5px 5px 0;background:linear-gradient(90deg,#64748b,#cbd5e1,#475569)}
