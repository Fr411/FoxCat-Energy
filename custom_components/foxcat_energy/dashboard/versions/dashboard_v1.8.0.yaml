                  ${row('Dernière trame', esc(text(E.lastFrame)))}
                  ${row('Code RRCR commandé', `<span class="mono" style="color:#facc15">${esc(codeTxt)}</span>`)}
                  <div class="sws">${sw('Régulation PRI', E.enabled)}${sw('LOGO en ligne', E.logo)}</div>
                </div>
              </div>
            </div>`;
          ]]]
