              /* ==========================================================
                 OUTILS DU REGISTRE
                 ========================================================== */

              const entityList = (
                ...values
              ) =>
                values
                  .flat(Infinity)
                  .filter(
                    (id) =>
                      typeof id === 'string'
                      &&
                      id.trim() !== ''
                  );


              const firstExisting = (
                ...values
