                <span class="st"><ha-icon icon="${stIcon}"></ha-icon>${esc(stLabel.toUpperCase())}<i></i></span></div>

              <div class="scene"><svg viewBox="0 0 1000 340" preserveAspectRatio="xMidYMid meet">
                <defs>
                  <linearGradient id="ivcell" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e3a5f"/><stop offset="1" stop-color="#0b1b30"/></linearGradient>
                  <clipPath id="ivclip"><rect x="392" y="96" width="216" height="108" rx="10"/></clipPath>
                  <clipPath id="ivpv"><rect x="40" y="96" width="190" height="148" rx="12"/></clipPath>
                </defs>
                ${dcFlow}${houseFlow}${gridFlow}
                <g>
