                          device.registry.part_reseau_jour
                        )
                        ||
                        nativeApplianceSensor(
                          device,
                          [
                            'part',
                            'reseau',
                            'aujourd'
                          ]
                        );


                      /* ==================================================
                         COÛT JOUR
                         ================================================== */

                      const costEntity =
                        firstExisting(
                          device.registry.cout_jour
                        )
                        ||
                        nativeApplianceSensor(
                          device,
                          [
                            'cout',
                            'aujourd'
                          ]
                        )
                        ||
                        legacyCandidate(
                          device.legacy.cost
                        );


                      /* ==================================================
