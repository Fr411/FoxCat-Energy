                        <b style="color:${c}">${ok ? 'Combinaison valide : niveau ' + lvl + ' % (' + (lvl * 40) + ' W max)' : 'Combinaison hors table RRCR'}</b><br>
                        ${ok ? 'Touchez un niveau pour envoyer la combinaison complète, vérifiée par FoxCat (relecture du code et ACK RRCR).' : 'Cette combinaison n\'existe pas dans la table : l\'onduleur peut l\'ignorer. Choisissez un niveau pour revenir à une combinaison valide.'}
                      </div>
                    </div>
                    <div class="k" style="margin-top:10px;font-size:11px">Contacts : un appui ouvre ou ferme un relais (confirmation demandée). Niveaux : le plus sûr, il commande les 4 relais ensemble.</div>
