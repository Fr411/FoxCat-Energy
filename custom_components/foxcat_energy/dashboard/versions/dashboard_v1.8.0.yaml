                  ${Array.from({ length: PANELS }, (_, k) => `<rect x="${(50 + (k % 11) * 15.2).toFixed(1)}" y="${108 + Math.floor(k / 11) * 62}" width="13.4" height="58" rx="2" fill="url(#ivcell)" stroke="rgba(255,255,255,.14)"/>`).join('')}
                  ${dcW > 30 ? `<g clip-path="url(#ivpv)"><rect x="0" y="80" width="46" height="180" fill="#fde68a" opacity=".16" transform="skewX(-20)" style="${AA('iv-shine', 3.4, 'ease-in-out')}"/></g>` : ''}
                  <text x="135" y="270" text-anchor="middle" class="t1">CHAMP PV · ${PANELS} PANNEAUX</text>
                        <text x="135" y="288" text-anchor="middle" class="t3">${dcW > 30 ? '≈ ' + Math.round(dcW / PANELS) + ' W par panneau' : 'au repos'}</text>
                  <text x="135" y="68" text-anchor="middle" class="t2" style="fill:#ffad42">${pw(dcW)}</text>
                  <text x="135" y="86" text-anchor="middle" class="t3">${nf(dcV, 0)} V · ${nf(dcA, 1)} A</text>
                </g>
                <g>
                  ${producing ? `<rect x="364" y="46" width="272" height="244" rx="26" fill="none" stroke="${stCol}" stroke-width="2" style="transform-box:fill-box;transform-origin:center;${AA('iv-halo', 3, 'ease-in-out')}"/>` : ''}
                  <rect x="372" y="54" width="256" height="228" rx="22" fill="#0b1626" stroke="${stCol}" stroke-opacity=".6" stroke-width="2.5" style="filter:drop-shadow(0 0 18px ${stCol}33)"/>
                  <text x="500" y="80" text-anchor="middle" class="t1">SORTIE AC · ${Number.isFinite(freq) ? nf(freq, 2) + ' Hz' : '—'}</text>
                  <rect x="392" y="96" width="216" height="108" rx="10" fill="#050b14" stroke="rgba(255,255,255,.08)"/>
                  <g clip-path="url(#ivclip)"><g transform="translate(396 0)">${[0, 1, 2].map(wave).join('')}</g></g>
                  <text x="500" y="232" text-anchor="middle" class="t2" style="font-size:30px">${pw(acW)}</text>
                  <text x="500" y="250" text-anchor="middle" class="t3">η ${eff > 0 ? nf(eff, 1) + ' %' : '—'} · ${Number.isFinite(temp) ? nf(temp, 0) + ' °C' : '—'} · ${Number.isFinite(pf) ? 'cos φ ' + nf(pf, 2) : 'cos φ —'}</text>
                  <rect x="372" y="300" width="256" height="9" rx="5" fill="rgba(255,255,255,.08)"/>
                  <rect x="372" y="300" width="${Math.max(2, accX - 372).toFixed(1)}" height="9" rx="5" fill="${stCol}" style="filter:drop-shadow(0 0 6px ${stCol})"/>
                  ${priRed ? `<line x1="${capX.toFixed(1)}" y1="294" x2="${capX.toFixed(1)}" y2="316" stroke="#f87171" stroke-width="3" stroke-linecap="round"/><text x="${Math.min(capX, 600).toFixed(1)}" y="330" text-anchor="middle" class="t3" style="fill:#fca5a5">PRI ${Math.round(priCur)} % · ${pw(capW)}</text>` : `<text x="500" y="330" text-anchor="middle" class="t3">Max ${pw(NOM)} · PRI libéré</text>`}
                </g>
                <g>
                  <rect x="790" y="46" width="170" height="92" rx="16" fill="#0a1424" stroke="#21d7ff44" stroke-width="2"/>
                  <text x="875" y="72" text-anchor="middle" class="t1">MAISON</text><text x="875" y="100" text-anchor="middle" class="t2" style="fill:#21d7ff;font-size:20px">${pw(houseW)}</text>
                  <text x="875" y="122" text-anchor="middle" class="t3">${toHouse > 30 ? 'solaire ' + pw(toHouse) : 'pas de solaire'}</text>
                  <rect x="790" y="204" width="170" height="92" rx="16" fill="#0a1424" stroke="${gCol}55" stroke-width="2"/>
                  <text x="875" y="230" text-anchor="middle" class="t1" style="fill:${gCol}">${gLabel}</text><text x="875" y="258" text-anchor="middle" class="t2" style="fill:${gCol};font-size:20px">${pw(gW)}</text>
                  <text x="875" y="280" text-anchor="middle" class="t3">${esc(text(E.policy, 'Politique —'))}</text>
                </g>
              </svg></div>

              <div class="grid2">
                <div class="bx">
                  <div class="bt"><span>RELAIS RRCR · L1–L4</span><small>${manual ? 'COMMANDE MANUELLE' : 'AUTOMATIQUE'}</small></div>
