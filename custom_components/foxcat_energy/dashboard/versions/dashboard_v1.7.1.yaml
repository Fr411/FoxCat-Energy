          \ */\n\n  const emptyHtml = `\n\n    <div class=\"empty\">\n\n      <ha-icon\n        icon=\"mdi:power-plug-off-outline\">\n      </ha-icon>\n\n      <div>\n\n        <strong>\n          Aucun appareil géré par FoxCat\n        </strong>\n\n        <span>\n          Active la gestion d'un appareil dans FoxCat EMS\n          pour afficher sa comptabilité énergétique.\n        </span>\n\n      </div>\n\n    </div>\n\n  `;\n\n\n  /* ==========================================================\n     RENDU\n     ========================================================== */\n\n  return `\n\n    <style>\n\n      * {\n        box-sizing:border-box;\n      }\n\n\n      .wrap {\n\n        padding:22px;\n\n        color:#f8fafc;\n\n        font-family:\n          -apple-system,\n          BlinkMacSystemFont,\n          \"Segoe UI\",\n          Roboto,\n          sans-serif;\n      }\n\n\n      /* =====================================================\n         HEADER\n         ===================================================== */\n\n      .header {\n\n        display:flex;\n\n        align-items:flex-start;\n\n        justify-content:space-between;\n\n        gap:15px;\n\n        margin-bottom:15px;\n      }\n\n\n      .brand {\n\n        display:flex;\n\n        align-items:center;\n\n        gap:12px;\n      }\n\n\n      .logo {\n\n        width:46px;\n\n        height:46px;\n\n        flex:none;\n\n        display:flex;\n\n        align-items:center;\n\n        justify-content:center;\n\n        border-radius:14px;\n\n        color:#19d8ff;\n\n        background:\n          linear-gradient(\n            135deg,\n            rgba(255,146,43,.10),\n            rgba(25,216,255,.10)\n          );\n\n        border:\n          1px solid rgba(255,255,255,.08);\n      }\n\n\n      .logo ha-icon {\n        --mdc-icon-size:25px;\n      }\n\n\n      .brand-name {\n\n        color:#19d8ff;\n\n        font-size:9px;\n\n        font-weight:900;\n\n        letter-spacing:2px;\n      }\n\n\n      .title {\n\n        margin-top:4px;\n\n        font-size:23px;\n\n        font-weight:900;\n      }\n\n\n      .subtitle {\n\n        margin-top:3px;\n\n        color:#64748b;\n\n        font-size:8px;\n      }\n\n\n      .count {\n\n        padding:8px 10px;\n\n        border-radius:13px;\n\n        color:#35e59d;\n\n        background:\n          rgba(53,229,157,.06);\n\n        border:\n          1px solid rgba(53,229,157,.14);\n\n        font-size:8px;\n\n        font-weight:900;\n\n        white-space:nowrap;\n      }\n\n\n      /* =====================================================\n         CONTEXTE\n         ===================================================== */\n\n      .context {\n\n        display:grid;\n\n        grid-template-columns:\n          repeat(\n            4,\n            minmax(0,1fr)\n          );\n\n        gap:8px;\n\n        margin-bottom:10px;\n      }\n\n\n      .context-box {\n\n        min-width:0;\n\n        padding:11px 12px;\n\n        border-radius:14px;\n\n        background:\n          rgba(255,255,255,.02);\n\n        border:\n          1px solid rgba(255,255,255,.045);\n      }\n\n\n      .context-box span {\n\n        display:block;\n\n        color:#526174;\n\n        font-size:6px;\n\n        font-weight:900;\n\n        letter-spacing:.08em;\n      }\n\n\n      .context-box strong {\n\n        display:block;\n\n        margin-top:4px;\n\n        color:#dbe5f1;\n\n        font-size:9px;\n\n        white-space:nowrap;\n\n        overflow:hidden;\n\n        text-overflow:ellipsis;\n      }\n\n\n      /* =====================================================\n         RÉSUMÉ\n         ===================================================== */\n\n      .summary {\n\n        display:grid;\n\n        grid-template-columns:\n          repeat(\n            4,\n            minmax(0,1fr)\n          );\n\n        gap:8px;\n\n        margin-bottom:13px;\n      }\n\n\n      .summary-box {\n\n        padding:13px 14px;\