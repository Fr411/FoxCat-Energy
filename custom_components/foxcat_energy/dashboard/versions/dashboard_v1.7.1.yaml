      styles: ".bubble-button-card-container {\n  height: 74px !important;\n  border-radius: 22px !important;\n\n  background: ${state === 'off'\n    ? 'linear-gradient(135deg, rgba(156,39,176,0.28), rgba(103,58,183,0.12))'\n    : 'rgba(255,255,255,0.055)'} !important;\n\n  border: 1px solid ${state === 'off'\n    ? 'rgba(206,147,216,0.48)'\n    : 'rgba(255,255,255,0.10)'} !important;\n\n  box-shadow: ${state === 'off'\n    ? '0 8px 25px rgba(156,39,176,0.18)'\n    : '0 5px 18px rgba(0,0,0,0.20)'} !important;\n\n  backdrop-filter: blur(14px);\n  transition: all 0.25s ease;\n}\n\n.bubble-icon-container {\n  background: ${state === 'off'\n    ? 'rgba(171,71,188,0.23)'\n    : 'rgba(255,255,255,0.07)'} !important;\n  border-radius: 16px !important;\n}\n\n.bubble-icon {\n  color: ${state === 'off'\n    ? '#ce93d8'\n    : 'rgba(255,255,255,0.45)'} !important;\n}\n\n.bubble-name {\n  font-size: 15px !important;\n  font-weight: 700 !important;\n  letter-spacing: 0.4px;\n}\n\n.bubble-name::after {\n  content: \"${state === 'off' ? 'VISIBLE' : 'MASQUÉ'}\";\n  display: block;\n  font-size: 9px;\n  font-weight: 600;\n  letter-spacing: 1.1px;\n  margin-top: 3px;\n  color: ${state === 'off'\n    ? '#ce93d8'\n    : 'rgba(255,255,255,0.35)'};\n}\n"
    - type: markdown
      content: <div style="text-align:center;font-size:10px;opacity:.48;padding:8px">FoxCat Energy {{ states('[[foxcat:diagnostic.engine_version]]') }} • Dashboard {{ states('[[foxcat:diagnostic.dashboard_version]]') }}</div>
