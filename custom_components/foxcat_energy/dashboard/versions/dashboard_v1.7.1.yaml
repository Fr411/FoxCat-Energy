- type: sections
  max_columns: 4
  title: Day-Ahead
  path: day-ahead
  icon: mdi:chart-timeline-variant-shimmer
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Dynamic · Marché & tendance
      heading_style: title
      icon: mdi:chart-line
    - type: entities
      title: Price Analyzer V2
      entities:
      - '[[foxcat:pricing.price_analyzer]]'
      - '[[foxcat:pricing.price_analyzer_etat]]'
      - '[[foxcat:pricing.price_analyzer_min_j]]'
      - '[[foxcat:pricing.price_analyzer_min_j1]]'
      - '[[foxcat:pricing.price_analyzer_temps_restant]]'
    - type: custom:button-card
      show_name: false
      show_icon: false
      show_state: false
      triggers_update: all
      custom_fields:
        content: "[[[\n  const BUY='sensor.luminus_luminus_dynamic_wallonia_prix_actuel';\n  const NEXT='sensor.luminus_luminus_dynamic_wallonia_prix_heure_suivante';\n  const TOMORROW='binary_sensor.luminus_luminus_dynamic_wallonia_prix_de_demain_disponibles';\n  const POS='[[foxcat:pricing.dynamic_curve_position]]';\n  const PLAN='[[foxcat:pricing.day_ahead.plan]]';\n  const buy=states[BUY], next=states[NEXT], tomorrow=states[TOMORROW];\n  const pos=Number(states[POS]?.state);\n  const plan=states[PLAN];\n  const now=Date.now();\n  const rows=[...(buy?.attributes?.today||[]),...(buy?.attributes?.tomorrow||[])]\n    .map(r=>({time:new Date(r.start).getTime(),price:Number(r.all_in)}))\n    .filter(r=>Number.isFinite(r.time)&&Number.isFinite(r.price)).sort((a,b)=>a.time-b.time);\n  const currentPrice=Number(buy?.state), nextPrice=Number(next?.state);\n  const future=rows.filter(r=>r.time>=now);\n  let trend='Stable', trendIcon='→';\n  if(Number.isFinite(currentPrice)&&future.length){\n    const u=future.slice(0,3).map(r=>r.price);\n    const mean=u.reduce((a,b)=>a+b,0)/u.length;\n    const delta=currentPrice!==0?(mean-currentPrice)/Math.abs(currentPrice):0;\n    if(delta>0.04){trend='Hausse';trendIcon='↗';}\n    else if(delta<-0.04){trend='Baisse';trendIcon='↘';}\n  }\n  const low=plan?.attributes?.prochain_creux;\n  const high=plan?.attributes?.prochain_pic;\n  const fmt=v=>Number.isFinite(v)?v.toFixed(3).replace('.',',')+' €/kWh':'—';\n  const pct=v=>Number.isFinite(v)?v.toFixed(1).replace('.',',')+' %':'—';\n  const hour=v=>{const raw=(v&&typeof v==='object')?v.start:v;if(!raw)return '—';const d=new Date(raw);return Number.isNaN(d.getTime())?'—':d.toLocaleTimeString('fr-BE',{hour:'2-digit',minute:'2-digit'});};\n  const tomorrowText=tomorrow?.state==='on'?'Demain disponible':'Demain en attente';\n  const favorable=plan?.attributes?.prix_favorable===true?'FAVORABLE':'ATTENTE';\n  return `<div class=\"main\">\n    <div class=\"title\">MARCHÉ & TENDANCE</div>\n    <div class=\"subtitle\">Luminus Dynamic · référence financière FoxCat</div>\n    <div class=\"price-zone\"><div class=\"label\">PRIX ACTUEL</div><div class=\"price\">${fmt(currentPrice)}</div><div class=\"source\">LUMINUS DYNAMIC</div></div>\n    <div class=\"grid\">\n      <div class=\"box\"><div class=\"label\">HEURE SUIVANTE</div><div class=\"value\">${fmt(nextPrice)}</div><div class=\"note\">Luminus Dynamic</div></div>\n      <div class=\"box\"><div class=\"label\">POSITION DAY-AHEAD</div><div class=\"value\">${pct(pos)}</div><div class=\"note\">FoxCat · courbe Luminus</div></div>\n      <div class=\"box\"><div class=\"label\">PROCHAIN CREUX</div><div class=\"value\">${hour(low)}</div><div class=\"note\">fenêtre favorable</div></div>\n      <div class=\"box\"><div class=\"label\">PROCHAIN PIC</div><div class=\"value\">${hour(high)}</div><div class=\"note\">zone à éviter</div></div>\n      <div class=\"box\"><div class=\"label\">TENDANCE</div><div class=\"value\">${trendIcon} ${trend}</div><div class=\"note\">Luminus Dynamic</div></div>\n      <div class=\"box\"><div class=\"label\">DAY-AHEAD</div><div class=\"value small\">${tomorrowText}</div><div class=\"note\">${favorable}</div></div>\n    </div></div>`;\n]]]\n"
      styles:
        card:
        - padding: 24px
        - border-radius: 24px
        - background: linear-gradient(145deg,rgba(25,28,34,.98),rgba(12,14,18,.98))
        - border: 1px solid rgba(255,255,255,.08)
        custom_fields:
          content:
          - width: 100%
          - text-align: center
      extra_styles: '.main{width:100%;display:flex;flex-direction:column;align-items:center;text-align:center}.title{width:100%;font-size:22px;font-weight:800;letter-spacing:1.4px}.subtitle{width:100%;margin-top:6px;font-size:11px;opacity:.48}.price-zone{width:100%;padding:26px 0 24px}.label{width:100%;font-size:10px;opacity:.52;letter-spacing:1px}.price{width:100%;margin-top:6px;font-size:35px;font-weight:800}.source{width:100%;margin-top:5px;font-size:10px;opacity:.42}.grid{width:100%;max-width:540px;display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:0 auto}.box{min-height:94px;padding:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:18px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.06)}.value{width:100%;margin-top:6px;font-size:19px;font-weight:750}.value.small{font-size:15px}.note{width:100%;margin-top:4px;font-size:10px;opacity:.42}

        '
