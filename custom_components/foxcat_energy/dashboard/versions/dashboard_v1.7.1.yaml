      extra_styles: "* { box-sizing: border-box; }\n\n.foxcat {\n  padding: 22px;\n  color: #f8fafc;\n  font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, sans-serif;\n}\n\n.header, .topline, .section-head, .rt-foot, .boiler-main, .pri-main, .footer {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n}\n\n.header { gap: 14px; }\n.brand { font-size: 21px; font-weight: 950; letter-spacing: 1.5px; }\n.brand .cat { color: #fb923c; }\n.brand .energy { margin-left: 7px; color: #22d3ee; font-size: 11px; letter-spacing: 2.5px; }\n.subtitle { margin-top: 4px; color: #64748b; font-size: 9px; letter-spacing: .8px; }\n\n.system-pill {\n  display: flex;\n  align-items: center;\n  gap: 7px;\n  padding: 8px 11px;\n  border-radius: 20px;\n  border: 1px solid;\n  font-size: 9px;\n  font-weight: 900;\n  letter-spacing: .8px;\n  white-space: nowrap;\n}\n\n.live-dot { width: 7px; height: 7px; border-radius: 50%; }\n\n.topline {\n  margin-top: 20px;\n  padding-bottom: 16px;\n  border-bottom: 1px solid rgba(255,255,255,.06);\n}\n\n.eyebrow { color: #64748b; font-size: 9px; font-weight: 800; letter-spacing: 1.4px; }\n.mode { margin-top: 5px; font-size: 18px; font-weight: 950; }\n.core-mini { display: flex; gap: 7px; flex-wrap: wrap; justify-content: flex-end; }\n.core-mini span { padding: 6px 8px; border-radius: 10px; background: rgba(255,255,255,.035); color: #64748b; font-size: 8px; }\n.core-mini b { color: #e2e8f0; }\n\n.realtime-grid {\n  display: grid;\n  grid-template-columns: repeat(2, minmax(0, 1fr));\n  gap: 10px;\n  margin-top: 16px;\n}\n\n.rt-card {\n  min-width: 0;\n  padding: 14px;\n  border-radius: 19px;\n  border: 1px solid rgba(255,255,255,.05);\n  background: rgba(255,255,255,.026);\n}\n\n.pv-card { background: radial-gradient(circle at 100% 0%, rgba(250,204,21,.09), transparent 48%), rgba(255,255,255,.026); }\n.grid-card { background: radial-gradient(circle at 100% 0%, rgba(96,165,250,.08), transparent 48%), rgba(255,255,255,.026); }\n.pri-card { background: radial-gradient(circle at 100% 0%, rgba(167,139,250,.09), transparent 48%), rgba(255,255,255,.026); }\n.boiler-card { background: radial-gradient(circle at 100% 0%, rgba(251,146,60,.09), transparent 48%), rgba(255,255,255,.026); }\n\n.rt-head { display: flex; align-items: center; gap: 7px; color: #94a3b8; font-size: 9px; font-weight: 900; letter-spacing: .9px; }\n.rt-value { margin-top: 10px; font-size: 27px; font-weight: 950; letter-spacing: -.5px; }\n.rt-value.pv { color: #facc15; }\n.rt-sub { margin-top: 1px; color: #64748b; font-size: 8px; }\n\n.rt-foot { gap: 12px; margin-top: 8px; padding-top: 7px; border-top: 1px solid rgba(255,255,255,.04); color: #64748b; font-size: 8px; }\n.rt-foot b { color: #e2e8f0; font-size: 9px; text-align: right; overflow: hidden; text-overflow: ellipsis; }\n\n.mini-bar { height: 6px; margin-top: 10px; border-radius: 10px; overflow: hidden; background: rgba(255,255,255,.07); }\n.mini-fill { height: 100%; border-radius: 10px; transition: width .4s ease; }\n.mini-fill.solar { background: linear-gradient(90deg,#f59e0b,#facc15,#34d399); }\n\n.pri-main { margin-top: 1px; gap: 10px; }\n.pri-target { padding: 6px 9px; border-radius: 10px; background: rgba(255,255,255,.035); color: #cbd5e1; font-size: 12px; font-weight: 900; }\n\n.ack-row { display: grid; grid-template-columns: repeat(3,1fr); gap: 5px; margin-top: 8px; }\n.ack-chip { padding: 5px 4px; border-radius: 8px; background: rgba(255,255,255,.035); color: #94a3b8; font-size: 6.5px; font-weight: 800; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\n\n.boiler-state { font-size: 9px; font-weight: 900; }\n\n.solar-panel {\n  margin-top: 12px;\n  padding: 14px;\n  border-radius: 19px;\n  border: 1px solid;\n  background: radial-gradient(circle at 100% 0%, rgba(250,204,21,.06), transparent 50%), rgba(255,255,255,.022);\n}\n\n.section-head { color: #94a3b8; font-size: 9px; font-weight: 900; letter-spacing: .9px; gap: 10px; }\n.section-icon { font-size: 15px; }\n.section-muted { color: #475569; font-weight: 500; }\n\
        .solar-status { font-size: 8px; letter-spacing: .6px; }\n\n.solar-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 7px; margin-top: 12px; }\n.solar-stat { min-width: 0; padding: 9px 7px; border-radius: 11px; background: rgba(255,255,255,.026); text-align: center; }\n.solar-stat span { display: block; color: #64748b; font-size: 7px; }\n.solar-stat b { display: block; margin-top: 4px; color: #e2e8f0; font-size: 9px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\n\n.confidence-bar { height: 5px; margin-top: 10px; border-radius: 10px; overflow: hidden; background: rgba(255,255,255,.06); }\n.confidence-bar div { height: 100%; border-radius: 10px; background: linear-gradient(90deg,#64748b,#facc15,#34d399); }\n.reason { margin-top: 9px; color: #94a3b8; font-size: 8px; line-height: 1.35; }\n\n.decision-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 10px; margin-top: 12px; }\n.decision-card { min-width: 0; padding: 12px; border-radius: 15px; border: 1px solid rgba(255,255,255,.045); background: rgba(255,255,255,.022); }\n.decision-title { color: #94a3b8; font-size: 8px; font-weight: 900; letter-spacing: .7px; }\n.decision-text { margin-top: 6px; color: #cbd5e1; font-size: 8px; line-height: 1.35; }\n\n.tariff-row { display: grid; grid-template-columns: repeat(3,1fr); gap: 7px; margin-top: 12px; }\n.tariff-row > div { padding: 9px; border-radius: 12px; background: rgba(255,255,255,.022); border: 1px solid rgba(255,255,255,.04); text-align: center; }\n.tariff-row span { display: block; color: #64748b; font-size: 7px; }\n.tariff-row b { display: block; margin-top: 3px; color: #e2e8f0; font-size: 9px; }\n\n.today { margin-top: 12px; padding: 14px; border-radius: 18px; background: rgba(255,255,255,.022); border: 1px solid rgba(255,255,255,.045); }\n.today-grid { display: grid; grid-template-columns: repeat(5,1fr); gap: 7px; margin-top: 11px; }\n.today-item { padding: 8px 4px; border-radius: 11px; background: rgba(255,255,255,.018); text-align: center; }\n.today-item span { display: block; font-size: 16px; }\n.today-item b { display: block; margin-top: 4px; color: #f8fafc; font-size: 10px; }\n.today-item small { display: block; margin-top: 2px; color: #64748b; font-size: 6.5px; }\n\n.footer { gap: 10px; margin-top: 14px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,.04); color: #475569; font-size: 7px; letter-spacing: .7px; }\n\n@media (max-width: 700px) {\n  .foxcat { padding: 15px; }\n  .realtime-grid { grid-template-columns: 1fr; }\n  .solar-grid { grid-template-columns: repeat(2,1fr); }\n  .decision-grid { grid-template-columns: 1fr; }\n  .today-grid { grid-template-columns: repeat(2,1fr); }\n  .tariff-row { grid-template-columns: 1fr; }\n  .topline { align-items: center; gap: 10px; }\n  .core-mini { max-width: 45%; }\n  .mode { font-size: 15px; }\n  .brand { font-size: 18px; }\n  .system-pill { padding: 6px 8px; font-size: 7.5px; }\n}\n"
