mall-label\">\n                  PART RÉSEAU\n                </div>\n\n                <div class=\"summary-value\">\n                  ${fmtEnergy(activeGrid)}\n                </div>\n\n              </div>\n\n\n            </div>\n\n\n\n            <!-- ==============================================\n                 ÉTAT EMS\n                 ============================================== -->\n\n            <div class=\"status-strip\">\n\n\n              <span>\n\n                Fenêtre machines :\n\n                <strong>\n                  ${\n                    machineWindow\n                      ? 'OUVERTE'\n                      : 'FERMÉE'\n                  }\n                </strong>\n\n                ·\n\n                Machine protégée :\n\n                <strong>\n                  ${\n                    protectedMachine\n                      ? 'OUI'\n                      : 'NON'\n                  }\n                </strong>\n\n                ·\n\n                En fonctionnement :\n\n                <strong>\n                  ${runningCount}\n                </strong>\n\n              </span>\n\n\n\n              <span>\n\n                Prix :\n\n                <strong\n                  style=\"\n                    color:${priceColor};\n                  \"\n                >\n                  ${priceStatus}\n                </strong>\n\n                ·\n\n                Délestage :\n\n                <strong\n                  style=\"\n                    color:${\n                      highLoad\n                        ? '#fb7185'\n                        : '#35e59d'\n                    };\n                  \"\n                >\n                  ${loadSheddingStatus}\n                </strong>\n\n              </span>\n\n\n            </div>\n\n\n\n            <!-- ==============================================\n                 APPAREILS\n                 ============================================== -->\n\n            <div class=\"device-grid\">\n\n              ${cardHtml}\n\n            </div>\n\n\n         \
          \ `\n          :\n          emptyHtml\n      }\n\n\n\n      <!-- ====================================================\n           BILAN GLOBAL FOXCAT\n           ==================================================== -->\n\n      ${\n        (\n          totalHouseEnergy > 0\n          ||\n          totalHouseCost !== 0\n        )\n          ? `\n\n            <div\n              class=\"status-strip\"\n              style=\"\n                margin-top:13px;\n                margin-bottom:0;\n              \"\n            >\n\n              <span>\n\n                Bilan maison FoxCat :\n\n                <strong>\n                  ${fmtEnergy(totalHouseEnergy)}\n                </strong>\n\n              </span>\n\n\n              <span>\n\n                Coût net maison :\n\n                <strong\n                  style=\"\n                    color:#35e59d;\n                  \"\n                >\n                  ${fmtEuro(totalHouseCost)}\n                </strong>\n\n              </span>\n\n\n            </div>\n\n          `\n          :\n          ''\n      }\n\n\n    </div>\n\n  `;\n]]]\n"
