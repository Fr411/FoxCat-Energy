-columns:\n            repeat(\n              2,\n              minmax(0,1fr)\n            );\n        }\n\n      }\n\n\n      @media(max-width:600px) {\n\n        .wrap {\n          padding:16px;\n        }\n\n\n        .header {\n\n          align-items:flex-start;\n\n          flex-direction:column;\n        }\n\n\n        .device-grid {\n\n          grid-template-columns:\n            1fr;\n        }\n\n\n        .title {\n          font-size:20px;\n        }\n\n\n        .energy-value,\n        .cost-value {\n          font-size:20px;\n        }\n\n\n        .status-strip {\n\n          align-items:flex-start;\n\n          flex-direction:column;\n        }\n\n      }\n\n    </style>\n\n\n\n    <div class=\"wrap\">\n\n\n      <!-- ====================================================\n           HEADER\n           ==================================================== -->\n\n      <div class=\"header\">\n\n\n        <div class=\"brand\">\n\n\n          <div class=\"logo\">\n\n            <ha-icon\n              icon=\"mdi:home-lightning-bolt-outline\">\n            </ha-icon>\n\n          </div>\n\n\n          <div>\n\n            <div class=\"brand-name\">\n              HOMEFOXCAT ENERGY\n            </div>\n\n            <div class=\"title\">\n              Consommation appareils\n            </div>\n\n            <div class=\"subtitle\">\n              Comptabilité native FoxCat Energy V1.5.0\n            </div>\n\n          </div>\n\n\n        </div>\n\n\n\n        <div class=\"count\">\n\n          ${activeDevices.length}\n\n          APPAREIL${\n            activeDevices.length > 1\n              ? 'S'\n              : ''\n          }\n\n          GÉRÉ${\n            activeDevices.length > 1\n              ? 'S'\n              : ''\n          }\n\n        </div>\n\n\n      </div>\n\n\n\n      <!-- ====================================================\n           CONTEXTE EMS\n           ==================================================== -->\n\n      <div cl