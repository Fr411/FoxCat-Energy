findFox(\n      'switch',\n      ['boiler', 'gere', 'foxcat']\n    );\n\n  const solarAdvisorEntity =\n    findFox(\n      'switch',\n      ['conseiller', 'solaire', 'ems', '2']\n    );\n\n  const highLoadEntity =\n    findFox(\n      'switch',\n      ['delestage', 'haute', 'consommation']\n    );\n\n\n  /* ============================================\n     CORE EMS\n     ============================================ */\n\n  const phaseEntity =\n    findFox(\n      'sensor',\n      ['phase', 'regulation']\n    );\n\n  const ackEntity =\n    findFox(\n      'sensor',\n      ['validation', 'execution', 'ems']\n    );\n\n  const coreDecisionEntity =\n    findFox(\n      'sensor',\n      ['derniere', 'decision', 'ems']\n    );\n\n  const pendingEntity =\n    findFox(\n      'sensor',\n      ['action', 'attente']\n    );\n\n  const lastActionEntity =\n    findFox(\n      'sensor',\n      ['derniere', 'action', 'ems']\n    );\n\n\n  /* ============================================\n     CORE ONDULEUR\n     ============================================ */\n\n  const inverterStateEntity =\n    findFox(\n      'sensor',\n      ['ems', 'onduleur', 'etat']\n    );\n\n  const inverterDecisionEntity =\n    findFox(\n      'sensor',\n      ['derniere', 'decision', 'pri']\n    );\n\n  const priCurrentEntity =\n    findFox(\n      'sensor',\n      ['niveau', 'pri', 'actuel']\n    );\n\n  const priTargetEntity =\n    findFox(\n      'sensor',\n      ['niveau', 'pri', 'cible']\n    );\n\n  const inverterPotentialEntity =\n    findFox(\n      'sensor',\n      ['ems', 'onduleur', 'potentiel']\n    );\n\n\n  /* ============================================\n     TARIFICATION\n     ============================================ */\n\n  const tariffActiveEntity =\n    findFox(\n      'sensor',\n      ['regime', 'tarifaire', 'actif']\n    );\n\n  const tariffPeriodEntity =\n    findFox(\n      'sensor',\n      ['periode', 'tarifaire']\n    );\n\n  const priceStatusEntity =\n    findFox(\n      'sensor',\n      ['statut', 'prix']\n    );\n\n  const activePriceEntity =\n    findFox(\n      'sensor',\n\
          \      ['prix', 'achat', 'actif']\n    );\n\n  const policyActiveEntity =\n    findFox(\n      'sensor',\n      ['politique', 'reseau', 'active']\n    );\n\n\n  /* ============================================\n     VALEURS\n     ============================================ */\n\n  const mode =\n    stateOf(\n      modeEntity,\n      '—'\n    );\n\n  const tariff =\n    stateOf(\n      tariffEntity,\n      stateOf(\n        tariffActiveEntity,\n        '—'\n      )\n    );\n\n  const policy =\n    stateOf(\n      networkPolicyEntity,\n      stateOf(\n        policyActiveEntity,\n        '—'\n      )\n    );\n\n  const tariffPeriod =\n    stateOf(\n      tariffPeriodEntity,\n      '—'\n    );\n\n  const priceStatus =\n    stateOf(\n      priceStatusEntity,\n      '—'\n    );\n\n  const activePrice =\n    parseFloat(\n      stateOf(\n        activePriceEntity,\n        '0'\n      )\n    ) || 0;\n\n\n  const phase =\n    stateOf(\n      phaseEntity,\n      '—'\n    );\n\n  const coreAck =\n    stateOf(\n      ackEntity,\n      '—'\n    );\n\n  const coreDecision =\n    stateOf(\n      coreDecisionEntity,\n      'Aucune décision EMS.'\n    );\n\n  const pending =\n    stateOf(\n      pendingEntity,\n      'Aucune'\n    );\n\n  const lastAction =\n    stateOf(\n      lastActionEntity,\n      '—'\n    );\n\n\n  const inverterState =\n    stateOf(\n      inverterStateEntity,\n      '—'\n    );\n\n  const inverterDecision =\n    stateOf(\n      inverterDecisionEntity,\n      'Aucune décision onduleur.'\n    );\n\n  const priCurrent =\n    parseFloat(\n      stateOf(\n        priCurrentEntity,\n        '100'\n      )\n    ) || 0;\n\n  const priTarget =\n    parseFloat(\n      stateOf(\n        priTargetEntity,\n        String(priCurrent)\n      )\n    ) || 0;\n\n  const inverterPotential =\n    stateOf(\n      inverterPotentialEntity,\n      '—'\n    );\n\n\n  /* ============================================\n     COULEURS\n     ============================================ */\n\n  const booleanState = (\n    entity,\n    labelOn = 'ACTIF',\n    labelOff = 'INACTIF'\n  ) => {\n\n    const active =\n      isOn(entity);\n\n    return {\n      active,\n      text:\n        active\n          ? labelOn\n          : labelOff,\n\n      color:\n        active\n          ? '#35e59d'\n          : '#64748b'\n    };\n  };\n\n\n  const regulation =\n    booleanState(\n      regulationEntity\n    );\n\n  const priEnabled =\n    booleanState(\n      priEnabledEntity\n    );\n\n  const boilerEnabled =\n    booleanState(\n      boilerEnabledEntity\n    );\n\n  const advisor =\n    booleanState(\n      solarAdvisorEntity\n    );\n\n  const highLoad =\n    booleanState(\n      highLoadEntity\n    );\n\n\n  let modeColor =\n    '#19d8ff';\n\n  if (\n    norm(mode).includes('economie')\n  )\n    modeColor = '#35e59d';\n\n  else if (\n    norm(mode).includes('zero')\n  )\n    modeColor = '#fb7185';\n\n  else if (\n    norm(mode).includes('ecs')\n  )\n    modeColor = '#ff922b';\n\n  else if (\n    norm(mode).includes('dynamique')\n  )\n    modeColor = '#a78bfa';\n\n  else if (\n    norm(mode).includes('manuel')\n  )\n    modeColor = '#60a5fa';\n\n\n  let tariffColor =\n    '#19d8ff';\n\n  if (\n    norm(tariff).includes('dynamique')\n  )\n    tariffColor = '#a78bfa';\n\n  else if (\n    norm(tariffPeriod).includes('hp')\n  )\n    tariffColor = '#ff922b';\n\n\n  let policyColor =\n    '#35e59d';\n\n  if (\n    (norm(policy).includes('injection tarifee') || norm(policy).includes('injection facturee'))\n  )\n    policyColor = '#facc15';\n\n\n  return `\n\n    <style>\n\n      * {\n        box-sizing:border-box;\n      }\n\n      .wrap {\n        padding:22px;\n        color:#f8fafc;\n        font-family:\n          -apple-system,\n          BlinkMacSystemFont,\n          \"Segoe UI\",\n          Roboto,\n          sans-serif;\n      }\n\n      .header {\n        display:flex;\n        justify-content:space-between;\n        align-items:center;\n        gap:15px;\n        margin-bottom:17px;\n      }\n\n      .brand {\n        display:flex;\n        align-items:center;\n\
