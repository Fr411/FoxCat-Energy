- type: sections
  max_columns: 4
  icon: mdi:flash
  path: energie
  sections:
  - type: grid
    cards:
    - type: custom:button-card
      show_name: false
      show_icon: false
      show_state: false
      grid_options:
        columns: full
      custom_fields:
        panel: "[[[\n  /* =========================================================\n     FOXCAT ENERGY V1.3.200\n     ONGLET ÉNERGIE\n     ========================================================= */\n\n  /* =========================\n     OUTILS\n     ========================= */\n\n  const norm = (value) =>\n    String(value ?? '')\n      .normalize('NFD')\n      .replace(/[\\u0300-\\u036f]/g, '')\n      .toLowerCase()\n      .replace(/[^a-z0-9]+/g, ' ')\n      .trim();\n\n  const exists = (id) =>\n    !!(id && states[id]);\n\n  const findFox = (\n    domain,\n    words = [],\n    candidates = []\n  ) => {\n\n    for (const id of candidates) {\n      if (exists(id)) {\n        return id;\n      }\n    }\n\n    const wanted =\n      words\n        .map(norm)\n        .filter(Boolean);\n\n    const prefix =\n      `${domain}.`;\n\n    const ids =\n      Object\n        .keys(states)\n        .filter(\n          (id) =>\n            id.startsWith(prefix)\n        );\n\n    return (\n      ids.find(\n        (id) => {\n\n          const st =\n            states[id];\n\n          const friendly =\n            st?.attributes?.friendly_name || '';\n\n          const haystack =\n            norm(\n              `${id} ${friendly}`\n            );\n\n          const foxcat =\n            haystack.includes(\n              'foxcat energy'\n            )\n            ||\n            norm(id).includes(\n              'foxcat energy'\n            );\n\n          return (\n            foxcat\n            &&\n            wanted.every(\n              (word) =>\n                haystack.includes(word)\n            )\n          );\n        }\n      )\n      ||\n      null\n    );\n  };\n\n\n  const stateOf = (\n    id,\n    fallback = '—'\n  ) => {\n\n    if (\n      !id ||\n      !states[id]\n    ) {\n      return fallback;\n    }\n\n    const value =\n      states[id].state;\n\n    if (\n      value === undefined ||\n      value === null ||\n      value === '' ||\n      value === 'unknown' ||\n      value === 'unavailable' ||\n      value === 'none'\n    ) {\n      return fallback;\n    }\n\n    return value;\n  };\n\n\n  const numberOf = (\n    id,\n    fallback = 0\n  ) => {\n\n    const value =\n      Number.parseFloat(\n        stateOf(\n          id,\n          ''\n        )\n      );\n\n    return Number.isFinite(value)\n      ? value\n      : fallback;\n  };\n\n\n  const isOn = (id) =>\n    id &&\n    states[id]?.state === 'on';\n\n\n  const clamp = (\n    value,\n    min,\n    max\n  ) =>\n    Math.min(\n      Math.max(\n        Number(value) || 0,\n        min\n      ),\n      max\n    );\n\n\n  const fmtPower = (value) => {\n\n    const v =\n      Math.abs(\n        Number(value) || 0\n      );\n\n    if (v >= 1000) {\n\n      return (\n        `${(v / 1000).toFixed(2)} kW`\n      );\n    }\n\n    return (\n      `${Math.round(v)} W`\n    );\n  };\n\n\n  const fmtEnergy = (value) => {\n\n    const v =\n      Number(value);\n\n    if (\n      !Number.isFinite(v)\n    ) {\n      return '—';\n    }\n\n    return (\n      `${v.toFixed(2)} kWh`\n    );\n  };\n\n\n  const fmtPercent = (value) =>\n    `${clamp(value, 0, 100).toFixed(0)} %`;\n\n\n  const fmtEuro = (value) =>\n    `${Number(value || 0).toFixed(2)} €`;\n\n\n  /* =========================================================\n     ENTITÉS FOXCAT V1.3.200\n     ========================================================= */\n\n  const E = {\n\n    mode:\n      findFox(\n        'select',\n        [\n          'mode',\n          'ems'\n        ],\n        [\n          '[[foxcat:ems.mode]]'\n        ]\n      ),\n\n\n    pv:\n      findFox(\n        'sensor',\n        [\n          'production',\n          'photovoltaique'\n        ],\n        [\n          '[[foxcat:energy.pv_power]]'\n        ]\n      ),\n\n\n    house:\n      findFox(\n        'sensor',\n        [\n          'consommation',\n          'maison'\n        ],\n        [\n          '[[foxcat:energy.house_power]]'\n        ]\n      ),\n\n\n    export:\n      findFox(\n        'sensor',\n        [\n          'reinjection',\n\
          \          'reseau'\n        ],\n        [\n          '[[foxcat:energy.grid_export]]'\n        ]\n      ),\n\n\n    import:\n      findFox(\n        'sensor',\n        [\n          'prelevement',\n          'reseau'\n        ],\n        [\n          '[[foxcat:energy.grid_import]]'\n        ]\n      ),\n\n\n    balance:\n      findFox(\n        'sensor',\n        [\n          'balance',\n          'reseau'\n        ],\n        [\n          '[[foxcat:energy.grid_power]]'\n        ]\n      ),\n\n\n    priLevel:\n      findFox(\n        'sensor',\n        [\n          'niveau',\n          'pri',\n          'actuel'\n        ]\n      ),\n\n\n    priTarget:\n      findFox(\n        'sensor',\n        [\n          'niveau',\n          'pri',\n          'cible'\n        ]\n      ),\n\n\n    priDirection:\n      findFox(\n        'sensor',\n        [\n          'direction',\n          'pri'\n        ]\n      ),\n\n\n    priAckGrid:\n      findFox(\n        'sensor',\n        [\n          'ack',\n          'reseau',\n          'pri'\n        ]\n      ),\n\n\n    priReason:\n      findFox(\n        'sensor',\n        [\n          'derniere',\n          'decision',\n          'pri'\n        ]\n      ),\n\n\n    boilerTemp:\n      findFox(\n        'sensor',\n        [\n          'temperature',\n          'boiler'\n        ]\n      ),\n\n\n    boilerPower:\n      findFox(\n        'sensor',\n        [\n          'puissance',\n          'boiler'\n        ]\n      ),\n\n\n    boilerDemand:\n      findFox(\n        'sensor',\n        [\n          'demande',\n          'boiler'\n        ]\n      ),\n\n\n    boilerOrigin:\n      findFox(\n        'sensor',\n        [\n          'origine',\n          'boiler'\n        ]\n      ),\n\n\n    boilerPhysical:\n      findFox(\n        'binary_sensor',\n        [\n          'boiler',\n          'physique'\n        ]\n      ),\n\n\n    solarConfidence:\n      findFox(\n        'sensor',\n        [\n          'confiance',\n          'solaire'\n        ]\n      ),\n\n\n    solarPotential:\n      findFox(\n        'sensor',\n        [\n          'potentiel',\n          'solaire'\n        ]\n      ),\n\n\n    solarTrend:\n      findFox(\n        'sensor',\n        [\n          'tendance',\n          'solaire'\n        ]\n      ),\n\n\n    currentPrice:\n      findFox(\n        'sensor',\n        [\n          'prix',\n          'dynamique',\n          'actuel'\n        ]\n      ),\n\n\n    nextPrice:\n      findFox(\n        'sensor',\n        [\n          'prix',\n          'dynamique',\n          'heure',\n          'suivante'\n        ]\n      )\n  };\n\n\n  /* =========================================================\n     PUISSANCES INSTANTANÉES\n     ========================================================= */\n\n  const pvPower =\n    Math.max(\n      numberOf(\n        E.pv,\n        numberOf(\n          '[[foxcat:sources.pv]]',\n          0\n        )\n      ),\n      0\n    );\n\n\n  const housePower =\n    Math.max(\n      numberOf(\n        E.house,\n        numberOf(\n          '[[foxcat:legacy.sensor_consommation_reelle_maison]]',\n          0\n        )\n      ),\n      0\n    );\n\n\n  const importPower =\n    Math.max(\n      numberOf(\n        E.import,\n        numberOf(\n          '[[foxcat:sources.grid_signed]]',\n          0\n        )\n      ),\n      0\n    );\n\n\n  const exportPower =\n    Math.max(\n      numberOf(\n        E.export,\n        numberOf(\n          '[[foxcat:sources.grid_fallback]]',\n          0\n        )\n      ),\n      0\n    );\n\n\n  const gridBalance =\n    E.balance\n      ? numberOf(\n          E.balance,\n          exportPower -\n          importPower\n        )\n      : exportPower -\n        importPower;\n\n\n  const solarCoverage =\n    housePower > 0\n      ? clamp(\n          (\n            pvPower /\n            housePower\n          ) * 100,\n          0,\n          100\n        )\n      : pvPower > 0\n        ? 100\n        : 0;\n\n\n  /* =========================================================\n     COMPTEURS JOUR — NATIFS FOXCAT\n\
          \     ========================================================= */\n\n  const consumptionDay = Math.max(numberOf('[[foxcat:energy.today.house]]', 0), 0);\n  const gridDay = Math.max(numberOf('[[foxcat:energy.today.import]]', 0), 0);\n  const exportDay = Math.max(numberOf('[[foxcat:energy.today.export]]', 0), 0);\n  const pvDay = Math.max(numberOf('[[foxcat:energy.today.pv]]', 0), 0);\n  const solarSelfConsumed = Math.max(numberOf('[[foxcat:energy.today.self_consumed]]', 0), 0);\n  const selfConsumptionRate = clamp(numberOf('[[foxcat:energy.today.self_consumption_pct]]', 0), 0, 100);\n  const autonomyRate = clamp(numberOf('[[foxcat:energy.today.autonomy_pct]]', 0), 0, 100);\n\n  /* =========================================================\n     PRIX — le régime FoxCat choisit automatiquement la source\n     ========================================================= */\n\n  const currentPrice = numberOf('[[foxcat:pricing.active_buy]]', 0);\n  const nextPrice = numberOf('[[foxcat:pricing.next_buy]]', currentPrice);\n  const activePriceLabel = stateOf('[[foxcat:pricing.active_label]]', 'TARIF ACTIF');\n  const nextPriceLabel = stateOf('[[foxcat:pricing.next_label]]', 'TARIF SUIVANT');\n  const estimatedCost = Math.max(numberOf('[[foxcat:pricing.cost_today]]', 0), 0);\n  const solarSaving = Math.max(numberOf('[[foxcat:pricing.solar_gain_today]]', 0), 0);\n  const economicDecision = stateOf('[[foxcat:pricing.economic_decision]]', '—');\n  const economicBestSlot = stateOf('[[foxcat:pricing.economic_best_slot]]', 'Maintenant');\n  const economicSaving = Math.max(numberOf('[[foxcat:pricing.economic_saving]]', 0), 0);\n\n  let priceState = stateOf('[[foxcat:pricing.status]]', 'NORMAL');\n  let priceColor = '#facc15';\n  const priceNorm = norm(priceState);\n\n  if (priceNorm.includes('avantage') || priceNorm.includes('bas') || priceNorm.includes('hc') || priceNorm.includes('negatif')) {\n    priceColor = '#34d399';\n  }\n  else if (priceNorm.includes('eleve') || priceNorm.includes('cher')) {\n    priceColor = '#fb7185';\n  }\n  else if (priceNorm.includes('hp')) {\n    priceColor = '#fb923c';\n  }\n\n  const priceDelta = nextPrice - currentPrice;\n  let nextTrend = '→ stable';\n  let nextTrendColor = '#94a3b8';\n\n  if (priceDelta > 0.01) {\n    nextTrend = '↗ hausse';\n    nextTrendColor = '#fb7185';\n  }\n  else if (priceDelta < -0.01) {\n    nextTrend = '↘ baisse';\n    nextTrendColor = '#34d399';\n  }\n\n  /* =========================================================\n     ÉTAT RÉSEAU\n     ========================================================= */\n\n  let gridState =\n    'ÉQUILIBRE';\n\n  let gridPower =\n    0;\n\n  let gridClass =\n    'neutral';\n\n  let gridIcon =\n    'mdi:transmission-tower';\n\n  let gridArrow =\n    '↔';\n\n\n  if (\n    exportPower > 30 &&\n    exportPower >= importPower\n  ) {\n\n    gridState =\n      'RÉINJECTION';\n\n    gridPower =\n      exportPower;\n\n    gridClass =\n      'export';\n\n    gridIcon =\n      'mdi:transmission-tower-export';\n\n    gridArrow =\n      '↑';\n  }\n\n  else if (\n    importPower > 30\n  ) {\n\n    gridState =\n      'PRÉLÈVEMENT';\n\n    gridPower =\n      importPower;\n\n    gridClass =\n      'import';\n\n    gridIcon =\n      'mdi:transmission-tower-import';\n\n    gridArrow =\n      '↓';\n  }\n\n\n  /* =========================================================\n     PRI\n     ========================================================= */\n\n  const priLevel =\n    clamp(\n      numberOf(\n        E.priLevel,\n        100\n      ),\n      0,\n      100\n    );\n\n\n  const priTarget =\n    clamp(\n      numberOf(\n        E.priTarget,\n        priLevel\n      ),\n      0,\n      100\n    );\n\n\n  const priDirection =\n    stateOf(\n      E.priDirection,\n      'maintien'\n    );\n\n\n  const priAckGrid =\n    stateOf(\n      E.priAckGrid,\n      '—'\n    );\n\n\n  const priReason =\n    stateOf(\n      E.priReason,\n      'Aucune décision PRI disponible'\n    );\n\n\n  /* =========================================================\n     BOILER\n     =========================================================\
          \ */\n\n  const boilerTemp =\n    numberOf(\n      E.boilerTemp,\n      numberOf(\n        '[[foxcat:boiler.temperature_source]]',\n        0\n      )\n    );\n\n\n  const boilerPower =\n    Math.max(\n      numberOf(\n        E.boilerPower,\n        numberOf(\n          '[[foxcat:boiler.power_source]]',\n          0\n        )\n      ),\n      0\n    );\n\n\n  const boilerRunning =\n    E.boilerPhysical\n      ? isOn(\n          E.boilerPhysical\n        )\n      : boilerPower > 200;\n\n\n  const boilerDemand =\n    stateOf(\n      E.boilerDemand,\n      'AUCUNE'\n    );\n\n\n  const boilerOrigin =\n    stateOf(\n      E.boilerOrigin,\n      'AUCUNE'\n    );\n\n\n  /* =========================================================\n     EMS\n     ========================================================= */\n\n  const mode =\n    stateOf(\n      E.mode,\n      'Inconnu'\n    );\n\n\n  const solarConfidence =\n    clamp(\n      numberOf(\n        E.solarConfidence,\n        0\n      ),\n      0,\n      100\n    );\n\n\n  const solarPotential =\n    stateOf(\n      E.solarPotential,\n      '—'\n    );\n\n\n  const solarTrend =\n    stateOf(\n      E.solarTrend,\n      '—'\n    );\n\n\n  const modeMap = {\n\n    'Économie énergie':\n      [\n        '\U0001F33F',\n        '#34d399'\n      ],\n\n    'Economie énergie':\n      [\n        '\U0001F33F',\n        '#34d399'\n      ],\n\n    'Zéro injection':\n      [\n        '⛔',\n        '#fb7185'\n      ],\n\n    'Bihoraire':\n      [\n        '♨️',\n        '#fb923c'\n      ],\n\n    'Dynamique':\n      [\n        '\U0001F4C8',\n        '#a78bfa'\n      ],\n\n    'Confort':\n      [\n        '\U0001F3E0',\n        '#38bdf8'\n      ],\n\n    'Manuel':\n      [\n        '\U0001F590️',\n        '#60a5fa'\n      ]\n  };\n\n\n  const [\n    modeIcon,\n    modeColor\n  ] =\n    modeMap[mode]\n    ||\n    [\n      '⚡',\n      '#c4b5fd'\n    ];\n\n\n  /* =========================================================\n     SYNTHÈSE\n     ========================================================= */\n\n  let summary =\n    'Équilibre énergétique stable.';\n\n  let summaryColor =\n    '#60a5fa';\n\n  let summaryIcon =\n    'mdi:chart-line';\n\n\n  if (\n    exportPower > 150\n  ) {\n\n    summary =\n      `Surplus solaire : ${fmtPower(exportPower)} sont actuellement réinjectés.`;\n\n    summaryColor =\n      '#34d399';\n\n    summaryIcon =\n      'mdi:solar-power-variant';\n  }\n\n  else if (\n    importPower > 500\n  ) {\n\n    summary =\n      `La maison prélève actuellement ${fmtPower(importPower)} sur le réseau.`;\n\n    summaryColor =\n      '#fb7185';\n\n    summaryIcon =\n      'mdi:transmission-tower-import';\n  }\n\n  else if (\n    pvPower > 50 &&\n    solarCoverage >= 95\n  ) {\n\n    summary =\n      'Le solaire couvre pratiquement toute la consommation actuelle.';\n\n    summaryColor =\n      '#facc15';\n\n    summaryIcon =\n      'mdi:white-balance-sunny';\n  }\n\n  else if (\n    pvPower > 50\n  ) {\n\n    summary =\n      `Le photovoltaïque couvre actuellement ${fmtPercent(solarCoverage)} des besoins de la maison.`;\n\n    summaryColor =\n      '#22d3ee';\n\n    summaryIcon =\n      'mdi:solar-power';\n  }\n\n\n  /* =========================================================\n     RENDU\n     ========================================================= */\n\n  return `\n\n    <div class=\"energy-card\">\n\n\n      <!-- HEADER -->\n\n      <div class=\"header\">\n\n        <div class=\"brand\">\n\n          <div class=\"brand-icon\">\n            <ha-icon icon=\"mdi:lightning-bolt\"></ha-icon>\n          </div>\n\n          <div>\n\n            <div class=\"brand-name\">\n              HOME<span class=\"fox\">FOX</span><span class=\"cat\">CAT</span>\n              <span class=\"energy-name\">ENERGY</span>\n            </div>\n\n            <div class=\"brand-subtitle\">\n              ENERGY MANAGEMENT SYSTEM\n            </div>\n\n          </div>\n\n        </div>\n\n\n        <div\n          class=\"mode-pill\"\n          style=\"\n            color:${modeColor};\n            border-color:${modeColor}35;\n\
          \            background:${modeColor}10;\n          \"\n        >\n          ${modeIcon}\n          ${mode}\n        </div>\n\n      </div>\n\n\n\n      <!-- FLUX PRINCIPAL -->\n\n      <div class=\"flow-card\">\n\n        <div class=\"flow-title-row\">\n\n          <div>\n\n            <div class=\"section-kicker\">\n              FLUX ÉNERGÉTIQUE\n            </div>\n\n            <div class=\"flow-summary\">\n              situation instantanée de l'installation\n            </div>\n\n          </div>\n\n          <div class=\"live\">\n            <span class=\"live-dot\"></span>\n            TEMPS RÉEL\n          </div>\n\n        </div>\n\n\n        <div class=\"flow-grid\">\n\n\n          <!-- PV -->\n\n          <div class=\"flow-node solar-node\">\n\n            <div class=\"flow-icon\">\n              <ha-icon icon=\"mdi:solar-power\"></ha-icon>\n            </div>\n\n            <div class=\"flow-label\">\n              SOLAIRE\n            </div>\n\n            <div class=\"flow-value\">\n              ${fmtPower(pvPower)}\n            </div>\n\n          </div>\n\n\n          <div class=\"flow-arrow\">\n            →\n          </div>\n\n\n          <!-- MAISON -->\n\n          <div class=\"flow-node house-node\">\n\n            <div class=\"flow-icon\">\n              <ha-icon icon=\"mdi:home-lightning-bolt\"></ha-icon>\n            </div>\n\n            <div class=\"flow-label\">\n              MAISON\n            </div>\n\n            <div class=\"flow-value\">\n              ${fmtPower(housePower)}\n            </div>\n\n          </div>\n\n\n          <div class=\"flow-arrow\">\n            ↔\n          </div>\n\n\n          <!-- RÉSEAU -->\n\n          <div class=\"flow-node grid-node ${gridClass}\">\n\n            <div class=\"flow-icon\">\n              <ha-icon icon=\"${gridIcon}\"></ha-icon>\n            </div>\n\n            <div class=\"flow-label\">\n              RÉSEAU\n            </div>\n\n            <div class=\"flow-value\">\n              ${fmtPower(gridPower)}\n            </div>\n\n          </div>\n\n        </div>\n\n\n        <div class=\"network-line ${gridClass}\">\n\n          <div>\n\n            <span>\n              ÉCHANGE RÉSEAU\n            </span>\n\n            <strong>\n              ${gridState}\n            </strong>\n\n          </div>\n\n          <div class=\"network-balance\">\n            ${gridArrow}\n            ${fmtPower(gridPower)}\n          </div>\n\n        </div>\n\n      </div>\n\n\n\n      <!-- AUJOURD'HUI -->\n\n      <div class=\"section-title\">\n\n        <span>\n          AUJOURD'HUI\n        </span>\n\n        <small>\n          BILAN ÉNERGÉTIQUE\n        </small>\n\n      </div>\n\n\n      <div class=\"kpi-grid\">\n\n\n        <div class=\"kpi solar\">\n\n          <div class=\"kpi-icon\">\n            <ha-icon icon=\"mdi:white-balance-sunny\"></ha-icon>\n          </div>\n\n          <div class=\"kpi-label\">\n            PRODUCTION PV\n          </div>\n\n          <div class=\"kpi-value\">\n            ${fmtEnergy(pvDay)}\n          </div>\n\n          <div class=\"kpi-foot\">\n            énergie produite aujourd'hui\n          </div>\n\n        </div>\n\n\n\n        <div class=\"kpi consumption\">\n\n          <div class=\"kpi-icon\">\n            <ha-icon icon=\"mdi:home-lightning-bolt-outline\"></ha-icon>\n          </div>\n\n          <div class=\"kpi-label\">\n            CONSOMMATION\n          </div>\n\n          <div class=\"kpi-value\">\n            ${fmtEnergy(consumptionDay)}\n          </div>\n\n          <div class=\"kpi-foot\">\n            énergie consommée par la maison\n          </div>\n\n        </div>\n\n\n\n        <div class=\"kpi import\">\n\n          <div class=\"kpi-icon\">\n            <ha-icon icon=\"mdi:transmission-tower-import\"></ha-icon>\n          </div>\n\n          <div class=\"kpi-label\">\n            RÉSEAU PRÉLEVÉ\n          </div>\n\n          <div class=\"kpi-value\">\n            ${fmtEnergy(gridDay)}\n          </div>\n\n          <div class=\"kpi-foot\">\n            énergie prélevée au réseau\
          \ aujourd'hui\n          </div>\n\n        </div>\n\n\n\n        <div class=\"kpi self\">\n\n          <div class=\"kpi-icon\">\n            <ha-icon icon=\"mdi:home-battery-outline\"></ha-icon>\n          </div>\n\n          <div class=\"kpi-label\">\n            AUTOCONSOMMÉ\n          </div>\n\n          <div class=\"kpi-value\">\n            ${fmtEnergy(solarSelfConsumed)}\n          </div>\n\n          <div class=\"kpi-foot\">\n            solaire utilisé directement\n          </div>\n\n        </div>\n\n\n\n        <div class=\"kpi export\">\n\n          <div class=\"kpi-icon\">\n            <ha-icon icon=\"mdi:transmission-tower-export\"></ha-icon>\n          </div>\n\n          <div class=\"kpi-label\">\n            RÉINJECTION\n          </div>\n\n          <div class=\"kpi-value\">\n            ${fmtEnergy(exportDay)}\n          </div>\n\n          <div class=\"kpi-foot\">\n            énergie envoyée vers le réseau\n          </div>\n\n        </div>\n\n\n      </div>\n\n\n\n      <!-- PERFORMANCE + COÛT -->\n\n      <div class=\"double-grid\">\n\n\n        <div class=\"panel\">\n\n          <div class=\"panel-title\">\n            PERFORMANCE SOLAIRE\n          </div>\n\n\n          <div class=\"metric-row\">\n\n            <div>\n\n              <span>\n                Couverture actuelle\n              </span>\n\n              <strong>\n                ${fmtPercent(solarCoverage)}\n              </strong>\n\n            </div>\n\n            <div class=\"bar\">\n\n              <div\n                class=\"bar-fill cyan\"\n                style=\"\n                  width:${solarCoverage}%;\n                \"\n              ></div>\n\n            </div>\n\n          </div>\n\n\n          <div class=\"metric-row\">\n\n            <div>\n\n              <span>\n                Autoconsommation\n              </span>\n\n              <strong>\n                ${fmtPercent(selfConsumptionRate)}\n              </strong>\n\n            </div>\n\n            <div class=\"bar\">\n\n              <div\n                class=\"bar-fill orange\"\n                style=\"\n                  width:${selfConsumptionRate}%;\n                \"\n              ></div>\n\n            </div>\n\n          </div>\n\n\n          <div class=\"metric-row\">\n\n            <div>\n\n              <span>\n                Autonomie solaire\n              </span>\n\n              <strong>\n                ${fmtPercent(autonomyRate)}\n              </strong>\n\n            </div>\n\n            <div class=\"bar\">\n\n              <div\n                class=\"bar-fill green\"\n                style=\"\n                  width:${autonomyRate}%;\n                \"\n              ></div>\n\n            </div>\n\n          </div>\n\n        </div>\n\n\n\n        <!-- COÛT -->\n\n        <div class=\"panel cost-panel\">\n\n          <div class=\"panel-title\">\n            COÛT ÉNERGIE\n          </div>\n\n\n          <div class=\"cost-hero\">\n\n            <div class=\"cost-value\">\n              ${fmtEuro(estimatedCost)}\n            </div>\n\n            <div class=\"cost-caption\">\n              coût réseau intégré aujourd'hui\n            </div>\n\n          </div>\n\n\n          <div class=\"row\">\n\n            <span>\n              Réseau prélevé\n            </span>\n\n            <strong>\n              ${fmtEnergy(gridDay)}\n            </strong>\n\n          </div>\n\n\n          <div class=\"row\">\n\n            <span>\n              ${activePriceLabel}\n            </span>\n\n            <strong>\n              ${currentPrice.toFixed(3)} €/kWh\n            </strong>\n\n          </div>\n\n\n          <div class=\"row\">\n\n            <span>\n              ${nextPriceLabel}\n            </span>\n\n            <strong\n              style=\"\n                color:${nextTrendColor};\n              \"\n            >\n              ${nextPrice.toFixed(3)} €/kWh\n              ${nextTrend}\n            </strong>\n\n          </div>\n\n\n          <div class=\"row\">\n\n            <span>\n              Décision économique\
          \ EMS\n            </span>\n\n            <strong>\n              ${economicDecision}\n            </strong>\n\n          </div>\n\n          <div class=\"row\">\n\n            <span>\n              Meilleur créneau\n            </span>\n\n            <strong>\n              ${economicBestSlot}${economicSaving > 0 ? ` · ${economicSaving.toFixed(3)} €/kWh` : ''}\n            </strong>\n\n          </div>\n\n          <div class=\"row saving-row\">\n\n            <span>\n              Économie solaire\n            </span>\n\n            <strong>\n              ${fmtEuro(solarSaving)}\n            </strong>\n\n          </div>\n\n\n          <div\n            class=\"price-badge\"\n            style=\"\n              color:${priceColor};\n              background:${priceColor}0d;\n              border-color:${priceColor}30;\n            \"\n          >\n            ${priceState}\n          </div>\n\n        </div>\n\n      </div>\n\n\n\n      <!-- FOXCAT -->\n\n      <div class=\"section-title\">\n\n        <span>\n          FOXCAT ENERGY\n        </span>\n\n        <small>\n          EMS · PRI · ECS\n        </small>\n\n      </div>\n\n\n      <div class=\"foxcat-grid\">\n\n\n        <!-- PRI -->\n\n        <div class=\"mini pri\">\n\n          <div class=\"mini-top\">\n\n            <span>\n              ONDULEUR SOLAREDGE\n            </span>\n\n            <ha-icon icon=\"mdi:solar-power-variant\"></ha-icon>\n\n          </div>\n\n\n          <div class=\"mini-main\">\n            ${Math.round(priLevel)} %\n          </div>\n\n\n          <div class=\"mini-sub\">\n\n            Cible\n            <strong>\n              ${Math.round(priTarget)} %\n            </strong>\n\n            ·\n\n            ${priDirection}\n\n          </div>\n\n\n          <div class=\"mini-bar\">\n\n            <div\n              style=\"\n                width:${priLevel}%;\n              \"\n            ></div>\n\n          </div>\n\n\n          <div class=\"mini-foot\">\n\n            ACK réseau :\n            ${priAckGrid}\n\n          </div>\n\n        </div>\n\n\n\n        <!-- BOILER -->\n\n        <div class=\"mini boiler\">\n\n          <div class=\"mini-top\">\n\n            <span>\n              BOILER\n            </span>\n\n            <ha-icon icon=\"mdi:water-boiler\"></ha-icon>\n\n          </div>\n\n\n          <div class=\"mini-main\">\n            ${boilerTemp.toFixed(1)} °C\n          </div>\n\n\n          <div class=\"mini-sub\">\n\n            ${\n              boilerRunning\n                ? '● Chauffe'\n                : '○ Attente'\n            }\n\n            ·\n\n            ${fmtPower(boilerPower)}\n\n          </div>\n\n\n          <div class=\"mini-foot\">\n\n            Demande :\n            ${boilerDemand}\n\n            <br>\n\n            Origine :\n            ${boilerOrigin}\n\n          </div>\n\n        </div>\n\n\n\n        <!-- IA -->\n\n        <div class=\"mini forecast\">\n\n          <div class=\"mini-top\">\n\n            <span>\n              IA SOLAIRE\n            </span>\n\n            <ha-icon icon=\"mdi:weather-sunny-alert\"></ha-icon>\n\n          </div>\n\n\n          <div class=\"mini-main\">\n            ${Math.round(solarConfidence)} %\n          </div>\n\n\n          <div class=\"mini-sub\">\n\n            Potentiel :\n            ${solarPotential}\n\n          </div>\n\n\n          <div class=\"mini-bar forecast-bar\">\n\n            <div\n              style=\"\n                width:${solarConfidence}%;\n              \"\n            ></div>\n\n          </div>\n\n\n          <div class=\"mini-foot\">\n\n            Tendance :\n            ${solarTrend}\n\n          </div>\n\n        </div>\n\n\n      </div>\n\n\n\n      <!-- SYNTHÈSE -->\n\n      <div\n        class=\"summary\"\n        style=\"\n          border-color:${summaryColor}25;\n          background:${summaryColor}0d;\n        \"\n      >\n\n        <div\n          class=\"summary-icon\"\n          style=\"\n            color:${summaryColor};\n            background:${summaryColor}10;\n          \"\n        >\n\
          \n          <ha-icon icon=\"${summaryIcon}\"></ha-icon>\n\n        </div>\n\n\n        <div>\n\n          <div class=\"summary-label\">\n            ANALYSE ÉNERGÉTIQUE\n          </div>\n\n          <div class=\"summary-value\">\n            ${summary}\n          </div>\n\n        </div>\n\n      </div>\n\n\n\n      <!-- FOOTER -->\n\n      <div class=\"footer\">\n\n        <span>\n          FOXCAT ENERGY V1.3.200\n        </span>\n\n        <span>\n          Production · Consommation · Optimisation\n        </span>\n\n      </div>\n\n\n    </div>\n\n  `;\n]]]\n"
      styles:
        card:
        - padding: 0
        - overflow: hidden
        - border-radius: 28px
        - border: 1px solid rgba(148,163,184,.12)
        - background: "radial-gradient(\n  circle at 0% 0%,\n  rgba(255,132,28,.10),\n  transparent 26%\n),\nradial-gradient(\n  circle at 100% 0%,\n  rgba(22,211,255,.08),\n  transparent 28%\n),\nlinear-gradient(\n  145deg,\n  #070b14 0%,\n  #0b1421 52%,\n  #07101b 100%\n)\n"
        - box-shadow: 'inset 0 1px 0 rgba(255,255,255,.045),

            0 18px 45px rgba(0,0,0,.28)

            '
        grid:
        - grid-template-areas: '"panel"'
        - grid-template-columns: 1fr
        custom_fields:
          panel:
          - width: 100%
      extra_styles: "\n* {\n  box-sizing: border-box;\n}\n\n\n.energy-card {\n\n  width: 100%;\n\n  padding: 24px;\n\n  color: #f8fafc;\n\n  font-family:\n    -apple-system,\n    BlinkMacSystemFont,\n    \"Segoe UI\",\n    Roboto,\n    sans-serif;\n}\n\n\n/* =========================================================\n   HEADER\n   ========================================================= */\n\n.header {\n\n  display: flex;\n\n  align-items: center;\n\n  justify-content: space-between;\n\n  gap: 16px;\n\n  margin-bottom: 18px;\n}\n\n\n.brand {\n\n  display: flex;\n\n  align-items: center;\n\n  gap: 14px;\n}\n\n\n.brand-icon {\n\n  width: 50px;\n\n  height: 50px;\n\n  flex: none;\n\n  display: flex;\n\n  align-items: center;\n\n  justify-content: center;\n\n  border-radius: 15px;\n\n  background:\n    linear-gradient(\n      135deg,\n      rgba(255,138,38,.15),\n      rgba(25,216,255,.13)\n    );\n\n  border:\n    1px solid rgba(255,255,255,.09);\n}\n\n\n.brand-icon ha-icon {\n\n  --mdc-icon-size: 28px;\n\n  color: #f8fafc;\n\n  filter:\n    drop-shadow(\n      -3px 0 7px rgba(255,138,38,.4)\n    )\n    drop-shadow(\n      3px 0 7px rgba(25,216,255,.4)\n    );\n}\n\n\n.brand-name {\n\n  font-size: 21px;\n\n  line-height: 1;\n\n  font-weight: 900;\n\n  letter-spacing: .045em;\n\n  white-space: nowrap;\n}\n\n\n.fox {\n  color: #ff8a26;\n}\n\n\n.cat {\n  color: #19d8ff;\n}\n\n\n.energy-name {\n\n  margin-left: 7px;\n\n  color: #94a3b8;\n\n  font-weight: 600;\n}\n\n\n.brand-subtitle {\n\n  margin-top: 7px;\n\n  color: #64748b;\n\n  font-size: 8px;\n\n  font-weight: 700;\n\n  letter-spacing: .23em;\n}\n\n\n.mode-pill {\n\n  padding: 8px 11px;\n\n  border-radius: 14px;\n\n  border: 1px solid;\n\n  font-size: 9px;\n\n  font-weight: 900;\n\n  white-space: nowrap;\n}\n\n\n/* =========================================================\n   FLUX\n   ========================================================= */\n\n.flow-card {\n\n  padding: 18px;\n\n  border-radius: 22px;\n\n  background:\n    rgba(255,255,255,.026);\n\n  border:\n    1px solid rgba(255,255,255,.055);\n}\n\n\n.flow-title-row {\n\n  display: flex;\n\n  justify-content: space-between;\n\n  align-items: center;\n\n  gap: 12px;\n}\n\n\n.section-kicker {\n\n  color: #94a3b8;\n\n  font-size: 8px;\n\n  font-weight: 900;\n\n  letter-spacing: .16em;\n}\n\n\n.flow-summary {\n\n  margin-top: 4px;\n\n  color: #526174;\n\n  font-size: 8px;\n}\n\n\n.live {\n\n  display: flex;\n\n  align-items: center;\n\n  gap: 7px;\n\n  padding: 7px 10px;\n\n  border-radius: 18px;\n\n  color: #34d399;\n\n  background:\n    rgba(52,211,153,.06);\n\n  border:\n    1px solid rgba(52,211,153,.13);\n\n  font-size: 8px;\n\n  font-weight: 900;\n}\n\n\n.live-dot {\n\n  width: 7px;\n\n  height: 7px;\n\n  border-radius: 50%;\n\n  background:\n    #34d399;\n\n  box-shadow:\n    0 0 8px rgba(52,211,153,.85);\n}\n\n\n.flow-grid {\n\n  display: grid;\n\n  grid-template-columns:\n    1fr\n    28px\n    1fr\n    28px\n    1fr;\n\n  align-items: center;\n\n  gap: 4px;\n\n  margin-top: 18px;\n}\n\n\n.flow-node {\n\n  min-width: 0;\n\n  padding: 16px 10px;\n\n  border-radius: 17px;\n\n  text-align: center;\n\n  background:\n    rgba(255,255,255,.018);\n}\n\n\n.flow-icon {\n\n  height: 30px;\n\n  display: flex;\n\n  align-items: center;\n\n  justify-content: center;\n}\n\n\n.flow-icon ha-icon {\n  --mdc-icon-size: 26px;\n}\n\n\n.flow-label {\n\n  margin-top: 7px;\n\n  color: #64748b;\n\n  font-size: 8px;\n\n  font-weight: 800;\n\n  letter-spacing: .08em;\n}\n\n\n.flow-value {\n\n  margin-top: 4px;\n\n  font-size: 21px;\n\n  font-weight: 900;\n\n  white-space: nowrap;\n}\n\n\n.solar-node .flow-icon,\n.solar-node .flow-value {\n  color: #ff982f;\n}\n\n\n.house-node .flow-icon,\n.house-node .flow-value {\n  color: #21d7ff;\n}\n\n\n.grid-node.export .flow-icon,\n.grid-node.export .flow-value {\n  color: #34d399;\n}\n\n\n.grid-node.import .flow-icon,\n.grid-node.import .flow-value {\n  color: #fb7185;\n}\n\n\n.flow-arrow {\n\n  color: #334155;\n\n  text-align: center;\n\n  font-size: 18px;\n}\n\n\n.network-line {\n\n  display: flex;\n\
        \n  align-items: center;\n\n  justify-content: space-between;\n\n  gap: 12px;\n\n  margin-top: 12px;\n\n  padding: 10px 12px;\n\n  border-radius: 13px;\n\n  background:\n    rgba(255,255,255,.02);\n\n  border:\n    1px solid rgba(255,255,255,.04);\n}\n\n\n.network-line span {\n\n  display: block;\n\n  color: #64748b;\n\n  font-size: 7px;\n\n  font-weight: 800;\n\n  letter-spacing: .12em;\n}\n\n\n.network-line strong {\n\n  display: block;\n\n  margin-top: 2px;\n\n  color: #cbd5e1;\n\n  font-size: 10px;\n}\n\n\n.network-line.export strong,\n.network-line.export .network-balance {\n  color: #34d399;\n}\n\n\n.network-line.import strong,\n.network-line.import .network-balance {\n  color: #fb7185;\n}\n\n\n.network-balance {\n\n  color: #94a3b8;\n\n  font-size: 11px;\n\n  font-weight: 900;\n}\n\n\n/* =========================================================\n   TITRES\n   ========================================================= */\n\n.section-title {\n\n  display: flex;\n\n  justify-content: space-between;\n\n  align-items: center;\n\n  gap: 10px;\n\n  margin:\n    22px 1px 10px;\n}\n\n\n.section-title span {\n\n  color: #718096;\n\n  font-size: 8px;\n\n  font-weight: 900;\n\n  letter-spacing: .17em;\n}\n\n\n.section-title small {\n\n  color: #475569;\n\n  font-size: 7px;\n\n  font-weight: 800;\n\n  letter-spacing: .08em;\n}\n\n\n/* =========================================================\n   KPI JOUR\n   ========================================================= */\n\n.kpi-grid {\n\n  display: grid;\n\n  grid-template-columns:\n    repeat(\n      5,\n      minmax(0,1fr)\n    );\n\n  gap: 10px;\n}\n\n\n.kpi {\n\n  min-width: 0;\n\n  padding: 15px;\n\n  border-radius: 17px;\n\n  background:\n    rgba(255,255,255,.022);\n\n  border:\n    1px solid rgba(255,255,255,.05);\n}\n\n\n.kpi-icon {\n\n  width: 34px;\n\n  height: 34px;\n\n  display: flex;\n\n  align-items: center;\n\n  justify-content: center;\n\n  border-radius: 10px;\n\n  background:\n    rgba(255,255,255,.035);\n}\n\n\n.kpi-icon ha-icon {\n  --mdc-icon-size: 19px;\n}\n\n\n.kpi-label {\n\n  margin-top: 12px;\n\n  color: #64748b;\n\n  font-size: 7px;\n\n  font-weight: 800;\n\n  letter-spacing: .07em;\n}\n\n\n.kpi-value {\n\n  margin-top: 4px;\n\n  color: #f1f5f9;\n\n  font-size: 18px;\n\n  font-weight: 900;\n\n  white-space: nowrap;\n}\n\n\n.kpi-foot {\n\n  margin-top: 4px;\n\n  color: #526174;\n\n  font-size: 7px;\n\n  line-height: 1.35;\n}\n\n\n.solar .kpi-icon,\n.solar .kpi-value {\n  color: #ff982f;\n}\n\n\n.consumption .kpi-icon,\n.consumption .kpi-value {\n  color: #21d7ff;\n}\n\n\n.self .kpi-icon,\n.self .kpi-value {\n  color: #facc15;\n}\n\n\n.export .kpi-icon,\n.export .kpi-value {\n  color: #34d399;\n}\n\n\n.import .kpi-icon,\n.import .kpi-value {\n  color: #fb7185;\n}\n\n\n/* =========================================================\n   PANNEAUX\n   ========================================================= */\n\n.double-grid {\n\n  display: grid;\n\n  grid-template-columns:\n    1fr 1fr;\n\n  gap: 10px;\n\n  margin-top: 14px;\n}\n\n\n.panel {\n\n  padding: 16px;\n\n  border-radius: 18px;\n\n  background:\n    rgba(255,255,255,.025);\n\n  border:\n    1px solid rgba(255,255,255,.05);\n}\n\n\n.panel-title {\n\n  color: #718096;\n\n  font-size: 8px;\n\n  font-weight: 900;\n\n  letter-spacing: .12em;\n}\n\n\n.metric-row {\n  margin-top: 13px;\n}\n\n\n.metric-row > div:first-child {\n\n  display: flex;\n\n  align-items: center;\n\n  justify-content: space-between;\n\n  gap: 10px;\n}\n\n\n.metric-row span {\n\n  color: #64748b;\n\n  font-size: 9px;\n}\n\n\n.metric-row strong {\n\n  color: #f8fafc;\n\n  font-size: 11px;\n}\n\n\n.bar {\n\n  height: 6px;\n\n  margin-top: 7px;\n\n  overflow: hidden;\n\n  border-radius: 20px;\n\n  background:\n    rgba(255,255,255,.055);\n}\n\n\n.bar-fill {\n\n  height: 100%;\n\n  border-radius: 20px;\n}\n\n\n.bar-fill.cyan {\n  background: #21d7ff;\n}\n\n\n.bar-fill.orange {\n  background: #ff982f;\n}\n\n\n.bar-fill.green {\n  background: #34d399;\n}\n\n\n/* =========================================================\n   COÛT\n   =========================================================\
        \ */\n\n.cost-panel {\n\n  position: relative;\n\n  background:\n    radial-gradient(\n      circle at 100% 0%,\n      rgba(52,211,153,.075),\n      transparent 50%\n    ),\n    rgba(255,255,255,.025);\n}\n\n\n.cost-hero {\n\n  margin:\n    12px 0 11px;\n\n  text-align: center;\n}\n\n\n.cost-value {\n\n  color: #34d399;\n\n  font-size: 31px;\n\n  line-height: 1;\n\n  font-weight: 950;\n}\n\n\n.cost-caption {\n\n  margin-top: 4px;\n\n  color: #64748b;\n\n  font-size: 8px;\n}\n\n\n.row {\n\n  display: flex;\n\n  align-items: center;\n\n  justify-content: space-between;\n\n  gap: 10px;\n\n  margin-top: 8px;\n\n  padding-top: 8px;\n\n  border-top:\n    1px solid rgba(255,255,255,.04);\n\n  color: #64748b;\n\n  font-size: 9px;\n}\n\n\n.row strong {\n\n  color: #e2e8f0;\n\n  text-align: right;\n\n  font-size: 9px;\n}\n\n\n.saving-row strong {\n  color: #34d399;\n}\n\n\n.price-badge {\n\n  margin-top: 10px;\n\n  padding: 7px 9px;\n\n  border-radius: 11px;\n\n  border: 1px solid;\n\n  text-align: center;\n\n  font-size: 8px;\n\n  font-weight: 900;\n\n  letter-spacing: .11em;\n}\n\n\n/* =========================================================\n   FOXCAT\n   ========================================================= */\n\n.foxcat-grid {\n\n  display: grid;\n\n  grid-template-columns:\n    repeat(\n      3,\n      minmax(0,1fr)\n    );\n\n  gap: 10px;\n}\n\n\n.mini {\n\n  min-width: 0;\n\n  padding: 15px;\n\n  border-radius: 17px;\n\n  background:\n    rgba(255,255,255,.022);\n\n  border:\n    1px solid rgba(255,255,255,.05);\n}\n\n\n.mini-top {\n\n  display: flex;\n\n  align-items: center;\n\n  justify-content: space-between;\n\n  gap: 8px;\n\n  color: #718096;\n\n  font-size: 7px;\n\n  font-weight: 900;\n\n  letter-spacing: .09em;\n}\n\n\n.mini-top ha-icon {\n  --mdc-icon-size: 18px;\n}\n\n\n.pri .mini-top ha-icon {\n  color: #facc15;\n}\n\n\n.boiler .mini-top ha-icon {\n  color: #fb923c;\n}\n\n\n.forecast .mini-top ha-icon {\n  color: #21d7ff;\n}\n\n\n.mini-main {\n\n  margin-top: 9px;\n\n  color: #f8fafc;\n\n  font-size: 25px;\n\n  font-weight: 950;\n}\n\n\n.mini-sub {\n\n  margin-top: 3px;\n\n  color: #64748b;\n\n  font-size: 8px;\n\n  line-height: 1.35;\n}\n\n\n.mini-bar {\n\n  height: 5px;\n\n  margin-top: 10px;\n\n  overflow: hidden;\n\n  border-radius: 20px;\n\n  background:\n    rgba(255,255,255,.055);\n}\n\n\n.mini-bar > div {\n\n  height: 100%;\n\n  border-radius: 20px;\n\n  background:\n    #facc15;\n}\n\n\n.forecast-bar > div {\n  background: #21d7ff;\n}\n\n\n.mini-foot {\n\n  margin-top: 8px;\n\n  color: #526174;\n\n  font-size: 7px;\n\n  line-height: 1.4;\n}\n\n\n/* =========================================================\n   SYNTHÈSE\n   ========================================================= */\n\n.summary {\n\n  display: flex;\n\n  align-items: center;\n\n  gap: 12px;\n\n  margin-top: 14px;\n\n  padding: 14px 15px;\n\n  border-radius: 16px;\n\n  border: 1px solid;\n}\n\n\n.summary-icon {\n\n  flex: none;\n\n  width: 38px;\n\n  height: 38px;\n\n  display: flex;\n\n  align-items: center;\n\n  justify-content: center;\n\n  border-radius: 11px;\n}\n\n\n.summary-icon ha-icon {\n  --mdc-icon-size: 21px;\n}\n\n\n.summary-label {\n\n  color: #718096;\n\n  font-size: 7px;\n\n  font-weight: 900;\n\n  letter-spacing: .12em;\n}\n\n\n.summary-value {\n\n  margin-top: 4px;\n\n  color: #cbd5e1;\n\n  font-size: 9px;\n\n  line-height: 1.45;\n}\n\n\n/* =========================================================\n   FOOTER\n   ========================================================= */\n\n.footer {\n\n  display: flex;\n\n  justify-content: space-between;\n\n  gap: 10px;\n\n  margin-top: 16px;\n\n  padding-top: 11px;\n\n  border-top:\n    1px solid rgba(255,255,255,.04);\n\n  color: #475569;\n\n  font-size: 7px;\n\n  letter-spacing: .08em;\n}\n\n\n/* =========================================================\n   RESPONSIVE TABLETTE / MOBILE\n   ========================================================= */\n\n@media (max-width: 900px) {\n\n  .kpi-grid {\n\n    grid-template-columns:\n      repeat(\n        2,\n        minmax(0,1fr)\n\
        \      );\n  }\n\n}\n\n\n@media (max-width: 700px) {\n\n  .energy-card {\n    padding: 17px;\n  }\n\n\n  .header {\n\n    align-items: flex-start;\n\n    flex-direction: column;\n  }\n\n\n  .brand-name {\n    font-size: 17px;\n  }\n\n\n  .flow-grid {\n\n    grid-template-columns:\n      1fr\n      16px\n      1fr\n      16px\n      1fr;\n  }\n\n\n  .flow-value {\n    font-size: 15px;\n  }\n\n\n  .flow-node {\n    padding: 13px 5px;\n  }\n\n\n  .double-grid,\n  .foxcat-grid {\n\n    grid-template-columns:\n      1fr;\n  }\n\n\n  .footer {\n    flex-direction: column;\n  }\n\n}\n"
