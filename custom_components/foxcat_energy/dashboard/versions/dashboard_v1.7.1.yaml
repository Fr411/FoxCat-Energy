        font-size:6px;\n        font-weight:900;\n      }\n\n      .decision p {\n        margin:5px\
          \ 0 0;\n        color:#cbd5e1;\n        font-size:8px;\n        line-height:1.45;\n      }\n\n\n      /* FONCTIONS */\n\n      .features {\n        display:grid;\n        grid-template-columns:\n          repeat(5,minmax(0,1fr));\n        gap:7px;\n      }\n\n      .feature {\n        padding:10px;\n        text-align:center;\n        border-radius:13px;\n        background:rgba(255,255,255,.018);\n        border:1px solid rgba(255,255,255,.045);\n      }\n\n      .feature span {\n        display:block;\n        color:#526174;\n        font-size:5px;\n        font-weight:900;\n      }\n\n      .feature strong {\n        display:block;\n        margin-top:5px;\n        font-size:8px;\n      }\n\n\n      /* BUS */\n\n      .bus {\n        display:grid;\n        grid-template-columns:1fr auto 1fr;\n        align-items:center;\n        gap:11px;\n        margin-top:10px;\n        padding:13px;\n        border-radius:15px;\n        background:\n          linear-gradient(\n            90deg,\n            rgba(25,216,255,.035),\n            rgba(250,204,21,.035)\n          );\n        border:1px solid rgba(255,255,255,.05);\n      }\n\n      .bus-core {\n        text-align:center;\n      }\n\n      .bus-core span {\n        display:block;\n        color:#526174;\n        font-size:6px;\n      }\n\n      .bus-core strong {\n        display:block;\n        margin-top:3px;\n        font-size:9px;\n      }\n\n      .bus-arrow {\n        color:#94a3b8;\n        font-size:18px;\n      }\n\n\n      /* FOOTER */\n\n      .footer {\n        display:flex;\n        justify-content:space-between;\n        gap:10px;\n        margin-top:12px;\n        padding-top:10px;\n        border-top:1px solid rgba(255,255,255,.04);\n        color:#526174;\n        font-size:6px;\n      }\n\n\n      @media(max-width:750px) {\n\n        .wrap {\n          padding:16px;\n        }\n\n        .header {\n          align-items:flex-start;\n          flex-direction:column;\n        }\n\n        .config-grid {\n          grid-template-columns:1fr;\n        }\n\n        .cores {\n          grid-template-columns:1fr;\n        }\n\n        .features {\n          grid-template-columns:\n            repeat(2,minmax(0,1fr));\n        }\n\n      }\n\n    </style>\n\n\n    <div class=\"wrap\">\n\n\n      <div class=\"header\">\n\n        <div class=\"brand\">\n\n          <div class=\"logo\">\n            <ha-icon icon=\"mdi:home-lightning-bolt\"></ha-icon>\n          </div>\n\n          <div>\n\n            <div class=\"brand-small\">\n              FOXCAT ENERGY V1.5.0\n            </div>\n\n            <div class=\"title\">\n              Configuration EMS\n            </div>\n\n            <div class=\"subtitle\">\n              Double cœur · stratégie · tarification\n            </div>\n\n          </div>\n\n        </div>\n\n\n        <div class=\"live\">\n          ${\n            regulation.active\n              ? '● RÉGULATION ACTIVE'\n              : '○ RÉGULATION ARRÊTÉE'\n          }\n        </div>\n\n      </div>\n\n\n\n      <!-- CONFIGURATION PRINCIPALE -->\n\n      <div class=\"config-grid\">\n\n\n        <div class=\"config\">\n\n          <div class=\"config-label\">\n            MODE DE CONSOMMATION / EMS\n          </div>\n\n          <div\n            class=\"config-value\"\n            style=\"color:${modeColor};\"\n          >\n            ${mode}\n          </div>\n\n          <div class=\"config-sub\">\n            stratégie consommateurs\n          </div>\n\n        </div>\n\n\n\n        <div class=\"config\">\n\n          <div class=\"config-label\">\n            RÉGIME TARIFAIRE\n          </div>\n\n          <div\n            class=\"config-value\"\n            style=\"color:${tariffColor};\"\n          >\n            ${tariff}\n          </div>\n\n          <div class=\"config-sub\">\n            période actuelle · ${tariffPeriod}\n          </div>\n\n        </div>\n\n\n\n        <div class=\"config\">\n\n          <div class=\"config-label\">\n            POLITIQUE RÉSEAU\n          </div>\n\n          <div\n            class=\"\
          config-value\"\n            style=\"color:${policyColor};\"\n          >\n            ${policy}\n          </div>\n\n          <div class=\"config-sub\">\n            stratégie EMS Onduleur\n          </div>\n\n        </div>\n\n\n      </div>\n\n\n\n      <!-- TARIFICATION -->\n\n      <div class=\"section-title\">\n\n        TARIFICATION\n\n        <span>\n          FOXCAT PRICING\n        </span>\n\n      </div>\n\n\n      <div class=\"config-grid\">\n\n\n        <div class=\"config\">\n\n          <div class=\"config-label\">\n            TARIF ACTUEL\n          </div>\n\n          <div\n            class=\"config-value\"\n            style=\"color:${tariffColor};\"\n          >\n            ${activePrice.toFixed(4)} €/kWh\n          </div>\n\n        </div>\n\n\n\n        <div class=\"config\">\n\n          <div class=\"config-label\">\n            PÉRIODE\n          </div>\n\n          <div class=\"config-value\">\n            ${tariffPeriod}\n          </div>\n\n        </div>\n\n\n\n        <div class=\"config\">\n\n          <div class=\"config-label\">\n            STATUT PRIX\n          </div>\n\n          <div class=\"config-value\">\n            ${priceStatus}\n          </div>\n\n        </div>\n\n\n      </div>\n\n\n\n      <!-- DOUBLE CORE -->\n\n      <div class=\"section-title\">\n\n        DÉCISIONS DES DEUX CŒURS\n\n        <span>\n          EMS CORE ↔ ENERGYBUS ↔ ONDULEUR\n        </span>\n\n      </div>\n\n\n      <div class=\"cores\">\n\n\n        <!-- CORE 1 -->\n\n        <div class=\"core ems\">\n\n          <div class=\"core-head\">\n\n            <div>\n\n              <div class=\"core-name\">\n                EMS CORE\n              </div>\n\n              <div class=\"core-type\">\n                CONSOMMATEURS / SÉCURITÉ\n              </div>\n\n            </div>\n\n            <div class=\"core-icon\">\n              <ha-icon icon=\"mdi:brain\"></ha-icon>\n            </div>\n\n          </div>\n\n\n          <div class=\"core-data\">\n\n            <div>\n\n              <span>\n                PHASE\n              </span>\n\n              <strong>\n                ${phase}\n              </strong>\n\n            </div>\n\n\n            <div>\n\n              <span>\n                ACK\n              </span>\n\n              <strong>\n                ${coreAck}\n              </strong>\n\n            </div>\n\n\n            <div>\n\n              <span>\n                ACTION ATTENTE\n              </span>\n\n              <strong>\n                ${pending}\n              </strong>\n\n            </div>\n\n\n            <div>\n\n              <span>\n                DERNIÈRE ACTION\n              </span>\n\n              <strong>\n                ${lastAction}\n              </strong>\n\n            </div>\n\n          </div>\n\n\n          <div class=\"decision\">\n\n            <span>\n              DÉCISION EMS CORE\n            </span>\n\n            <p>\n              ${coreDecision}\n            </p>\n\n          </div>\n\n        </div>\n\n\n\n        <!-- CORE 2 -->\n\n        <div class=\"core inverter\">\n\n          <div class=\"core-head\">\n\n            <div>\n\n              <div class=\"core-name\">\n                EMS ONDULEUR\n              </div>\n\n              <div class=\"core-type\">\n                PV / ONDULEUR / RRCR\n              </div>\n\n            </div>\n\n            <div class=\"core-icon\">\n              <ha-icon icon=\"mdi:solar-power-variant\"></ha-icon>\n            </div>\n\n          </div>\n\n\n          <div class=\"core-data\">\n\n            <div>\n\n              <span>\n                ÉTAT\n              </span>\n\n              <strong>\n                ${inverterState}\n              </strong>\n\n            </div>\n\n\n            <div>\n\n              <span>\n                POTENTIEL PV\n              </span>\n\n              <strong>\n                ${inverterPotential}\n              </strong>\n\n            </div>\n\n\n            <div>\n\n              <span>\n                ONDULEUR ACTUEL\n              </span>\n\
          \n              <strong>\n                ${Math.round(priCurrent)} %\n              </strong>\n\n            </div>\n\n\n            <div>\n\n              <span>\n                ONDULEUR CIBLE\n              </span>\n\n              <strong>\n                ${Math.round(priTarget)} %\n              </strong>\n\n            </div>\n\n          </div>\n\n\n          <div class=\"decision\">\n\n            <span>\n              DÉCISION EMS ONDULEUR\n            </span>\n\n            <p>\n              ${inverterDecision}\n            </p>\n\n          </div>\n\n        </div>\n\n\n      </div>\n\n\n\n      <!-- ENERGY BUS -->\n\n      <div class=\"bus\">\n\n        <div class=\"bus-core\">\n\n          <span>\n            CORE 1\n          </span>\n\n          <strong style=\"color:#19d8ff;\">\n            EMS\n          </strong>\n\n        </div>\n\n\n        <div class=\"bus-arrow\">\n          ⇄\n        </div>\n\n\n        <div class=\"bus-core\">\n\n          <span>\n            CORE 2\n          </span>\n\n          <strong style=\"color:#facc15;\">\n            ONDULEUR\n          </strong>\n\n        </div>\n\n      </div>\n\n\n\n      <!-- FONCTIONS -->\n\n      <div class=\"section-title\">\n\n        MODULES FOXCAT\n\n        <span>\n          ÉTAT CONFIGURATION\n        </span>\n\n      </div>\n\n\n      <div class=\"features\">\n\n\n        <div class=\"feature\">\n\n          <span>\n            PRI\n          </span>\n\n          <strong style=\"color:${priEnabled.color};\">\n            ${priEnabled.text}\n          </strong>\n\n        </div>\n\n\n\n        <div class=\"feature\">\n\n          <span>\n            BOILER\n          </span>\n\n          <strong style=\"color:${boilerEnabled.color};\">\n            ${boilerEnabled.text}\n          </strong>\n\n        </div>\n\n\n\n        <div class=\"feature\">\n\n          <span>\n            IA\n          </span>\n\n          <strong style=\"color:${advisor.color};\">\n            ${advisor.text}\n          </strong>\n\n        </div>\n\n\n\n        <div class=\"feature\">\n\n          <span>\n            DÉLESTAGE\n          </span>\n\n          <strong style=\"color:${highLoad.color};\">\n            ${highLoad.text}\n          </strong>\n\n        </div>\n\n\n\n        <div class=\"feature\">\n\n          <span>\n            RÉGULATION\n          </span>\n\n          <strong style=\"color:${regulation.color};\">\n            ${regulation.text}\n          </strong>\n\n        </div>\n\n\n      </div>\n\n\n\n      <div class=\"footer\">\n\n        <span>\n          EMS CORE responsable des consommateurs\n        </span>\n\n        <span>\n          EMS Onduleur responsable PV / RRCR\n        </span>\n\n      </div>\n\n\n    </div>\n\n  `;\n]]]\n"
      tap_action:
