        custom_fields:
          header:
          - width: 100%
      extra_styles: "\n.hfc-header {\n  position: relative;\n\n  width: 100%;\n\n  display: flex;\n  align-items: center;\n\n  gap: 16px;\n\n  box-sizing: border-box;\n}\n\n\n/* ==========================================\n   LOGO\n   ========================================== */\n\n.hfc-logo {\n  position: relative;\n\n  width: 54px;\n  height: 54px;\n\n  flex: 0 0 54px;\n\n  display: flex;\n  align-items: center;\n  justify-content: center;\n\n  border-radius: 16px;\n\n  background:\n    linear-gradient(\n      135deg,\n      rgba(255,126,25,0.15),\n      rgba(0,211,255,0.12)\n    );\n\n  border: 1px solid rgba(255,255,255,0.10);\n\n  box-shadow:\n    -5px 0 20px rgba(255,110,15,0.12),\n    5px 0 20px rgba(0,210,255,0.12);\n}\n\n\n.hfc-logo::before {\n  content: \"\";\n\n  position: absolute;\n\n  inset: 3px;\n\n  border-radius: 13px;\n\n  border-top:\n    1px solid rgba(255,137,37,0.45);\n\n  border-right:\n    1px solid rgba(0,216,255,0.40);\n}\n\n\n.hfc-logo ha-icon {\n  position: relative;\n\n  color: #ffffff;\n\n  --mdc-icon-size: 31px;\n\n  filter:\n    drop-shadow(-3px 0 5px rgba(255,110,20,0.55))\n    drop-shadow(3px 0 5px rgba(0,210,255,0.50));\n}\n\n\n/* ==========================================\n   NOM\n   ========================================== */\n\n.hfc-name {\n  display: flex;\n  flex-direction: column;\n\n  justify-content: center;\n}\n\n\n.hfc-title {\n  white-space: nowrap;\n\n  font-size: 24px;\n  font-weight: 850;\n\n  line-height: 1;\n\n  letter-spacing: 0.055em;\n}\n\n\n.hfc-title .home {\n  color: #ffffff;\n}\n\n\n/* RENARD */\n\n.hfc-title .fox {\n  color: #ff8a26;\n\n  text-shadow:\n    0 0 12px rgba(255,120,20,0.25);\n}\n\n\n/* CHAT */\n\n.hfc-title .cat {\n  color: #19d8ff;\n\n  text-shadow:\n    0 0 12px rgba(0,210,255,0.25);\n}\n\n\n/* ENERGY */\n\n.hfc-title .energy {\n  margin-left: 9px;\n\n  color: #a9bdcc;\n\n  font-weight: 600;\n}\n\n\n/* ==========================================\n   SOUS-TITRE\n   ========================================== */\n\n.hfc-subtitle {\n  margin-top: 7px;\n\n  color: #71899d;\n\n  font-size: 8px;\n  font-weight: 600;\n\n  letter-spacing: 0.28em;\n}\n\n\n/* ==========================================\n   LIGNE SIGNATURE\n   ========================================== */\n\n.hfc-line {\n  height: 2px;\n\n  flex: 1;\n\n  min-width: 60px;\n\n  margin-left: 12px;\n\n  display: flex;\n\n  border-radius: 10px;\n\n  overflow: hidden;\n\n  opacity: 0.75;\n}\n\n\n.line-orange {\n  width: 38%;\n\n  background:\n    linear-gradient(\n      90deg,\n      rgba(255,130,25,0),\n      #ff8125\n    );\n\n  box-shadow:\n    0 0 10px rgba(255,120,20,0.40);\n}\n\n\n.line-blue {\n  flex: 1;\n\n  background:\n    linear-gradient(\n      90deg,\n      #00d8ff,\n      rgba(0,216,255,0)\n    );\n\n  box-shadow:\n    0 0 10px rgba(0,216,255,0.40);\n}\n"
  - type: grid
    cards:
    - type: custom:button-card
      show_name: false
      show_icon: false
      show_state: false
      triggers_update: all
      styles:
        card:
        - padding: 0
        - border-radius: 26px
        - overflow: hidden
        - background: linear-gradient(145deg, rgba(7,11,20,0.98), rgba(12,22,38,0.98))
        - border: 1px solid rgba(255,255,255,0.08)
        - box-shadow: 0 16px 38px rgba(0,0,0,0.35)
        grid:
        - grid-template-areas: '"content"'
        - grid-template-columns: 1fr
        custom_fields:
          content:
          - width: 100%
      custom_fields:
        content: "[[[\n  /* ==========================================================\n     FOXCAT ENERGY V1.3.200\n     TARIFICATION PRINCIPALE + COÛT JOURNALIER\n\n     Régimes :\n     - Bi-horaire HP/HC\n     - Dynamique\n     - Compensation\n     ========================================================== */\n\n\n  /* ==========================================================\n     OUTILS\n     ========================================================== */\n\n  const norm = (value) =>\n    String(value ?? '')\n      .normalize('NFD')\n      .replace(/[\\u0300-\\u036f]/g, '')\n      .toLowerCase()\n      .replace(/[^a-z0-9]+/g, ' ')\n      .trim();\n\n\n  const exists = (id) =>\n    !!(id && states[id]);\n\n\n  const findFox = (\n    domain,\n    words = [],\n    candidates = []\n  ) => {\n\n    for (const id of candidates) {\n\n      if (exists(id)) {\n        return id;\n      }\n    }\n\n\n    const wanted =\n      words\n        .map(norm)\n        .filter(Boolean);\n\n\n    const prefix =\n      `${domain}.`;\n\n\n    const ids =\n      Object.keys(states)\n        .filter(\n          (id) =>\n            id.startsWith(prefix)\n        );\n\n\n    return (\n      ids.find(\n        (id) => {\n\n          const st =\n            states[id];\n\n\n          const friendly =\n            st?.attributes?.friendly_name || '';\n\n\n          const text =\n            norm(\n              `${id} ${friendly}`\n            );\n\n\n          const foxcat =\n            text.includes('foxcat energy')\n            ||\n            norm(id).includes('foxcat energy');\n\n\n          return (\n            foxcat\n            &&\n            wanted.every(\n              (word) =>\n                text.includes(word)\n            )\n          );\n        }\n      )\n      ||\n      null\n    );\n  };\n\n\n  const stateOf = (\n    id,\n    fallback = '—'\n  ) => {\n\n    if (\n      !id ||\n      !states[id]\n    ) {\n      return fallback;\n    }\n\n\n    const value =\n      states[id].state;\n\n\n    if (\n      value === undefined ||\n      value === null ||\n      value === '' ||\n      value === 'unknown' ||\n      value === 'unavailable' ||\n      value === 'none'\n    ) {\n      return fallback;\n    }\n\n\n    return value;\n  };\n\n\n  const numberOf = (\n    id,\n    fallback = null\n  ) => {\n\n    if (\n      !id ||\n      !states[id]\n    ) {\n      return fallback;\n    }\n\n\n    const raw =\n      states[id].state;\n\n\n    if (\n      raw === undefined ||\n      raw === null ||\n      raw === '' ||\n      raw === 'unknown' ||\n      raw === 'unavailable' ||\n      raw === 'none'\n    ) {\n      return fallback;\n    }\n\n\n    const value =\n      Number.parseFloat(raw);\n\n\n    return Number.isFinite(value)\n      ? value\n      : fallback;\n  };\n\n\n  const fmtPrice = (value) => {\n\n    if (!Number.isFinite(value)) {\n      return '—';\n    }\n\n    return `${value.toFixed(4)} €/kWh`;\n  };\n\n\n  const fmtRate = (value) => {\n\n    if (!Number.isFinite(value)) {\n      return '—';\n    }\n\n    return `${value.toFixed(3)} €/h`;\n  };\n\n\n  const fmtEuro = (value) => {\n\n    if (!Number.isFinite(value)) {\n      return '—';\n    }\n\n    return `${value.toFixed(2)} €`;\n  };\n\n\n  const fmtEnergy = (value) => {\n\n    if (!Number.isFinite(value)) {\n      return '—';\n    }\n\n    return `${Math.max(0, value).toFixed(2)} kWh`;\n  };\n\n\n  const fmtDelta = (value) => {\n\n    if (!Number.isFinite(value)) {\n      return '—';\n    }\n\n\n    const sign =\n      value > 0\n        ? '+'\n        : '';\n\n\n    return `${sign}${value.toFixed(4)} €/kWh`;\n  };\n\n\n  /* ==========================================================\n     ENTITÉS FOXCAT V1.3.200\n     ========================================================== */\n\n  const E = {\n\n    regimeSelect:\n      findFox(\n        'select',\n        [\n          'regime',\n          'tarifaire'\n        ],\n        [\n          '[[foxcat:pricing.regime]]'\n        ]\n      ),\n\n\n    regimeActive:\n      findFox(\n        'sensor',\n        [\n          'regime',\n\
          \          'tarifaire',\n          'actif'\n        ]\n      ),\n\n\n    period:\n      findFox(\n        'sensor',\n        [\n          'periode',\n          'tarifaire'\n        ]\n      ),\n\n\n    priceStatus:\n      findFox(\n        'sensor',\n        [\n          'statut',\n          'prix'\n        ]\n      ),\n\n\n    costModel:\n      findFox(\n        'sensor',\n        [\n          'modele',\n          'cout'\n        ]\n      ),\n\n\n    activeBuy:\n      findFox(\n        'sensor',\n        [\n          'prix',\n          'achat',\n          'actif'\n        ]\n      ),\n\n\n    exportValue:\n      findFox(\n        'sensor',\n        [\n          'valeur',\n          'economique',\n          'reinjection'\n        ]\n      ),\n\n\n    hpPrice:\n      findFox(\n        'sensor',\n        [\n          'prix',\n          'heures',\n          'pleines'\n        ]\n      ),\n\n\n    hcPrice:\n      findFox(\n        'sensor',\n        [\n          'prix',\n          'heures',\n          'creuses'\n        ]\n      ),\n\n\n    fixedInjection:\n      findFox(\n        'sensor',\n        [\n          'prix',\n          'fixe',\n          'reinjection'\n        ]\n      ),\n\n\n    hpSource:\n      findFox(\n        'sensor',\n        [\n          'source',\n          'prix',\n          'heures',\n          'pleines'\n        ]\n      ),\n\n\n    hcSource:\n      findFox(\n        'sensor',\n        [\n          'source',\n          'prix',\n          'heures',\n          'creuses'\n        ]\n      ),\n\n\n    dynamicCurrent:\n      findFox(\n        'sensor',\n        [\n          'prix',\n          'dynamique',\n          'actuel'\n        ]\n      ),\n\n\n    dynamicNext:\n      findFox(\n        'sensor',\n        [\n          'prix',\n          'dynamique',\n          'heure',\n          'suivante'\n        ]\n      ),\n\n\n    dynamicInjection:\n      findFox(\n        'sensor',\n        [\n          'prix',\n          'dynamique',\n          'reinjection',\n          'brut'\n        ]\n      ),\n\n\n    negativePrice:\n      findFox(\n        'sensor',\n        [\n          'prix',\n          'dynamique',\n          'negatif',\n          'actif'\n        ]\n      ),\n\n\n    importRate:\n      findFox(\n        'sensor',\n        [\n          'cout',\n          'instantane',\n          'prelevement'\n        ]\n      ),\n\n\n    exportRate:\n      findFox(\n        'sensor',\n        [\n          'valeur',\n          'instantanee',\n          'reinjection'\n        ]\n      ),\n\n\n    netRate:\n      findFox(\n        'sensor',\n        [\n          'solde',\n          'financier',\n          'instantane',\n          'reseau'\n        ]\n      )\n\n  };\n\n\n  /* ==========================================================\n     RÉGIME TARIFAIRE\n     ========================================================== */\n\n  const selectedRegime =\n    stateOf(\n      E.regimeSelect,\n      stateOf(\n        E.regimeActive,\n        'Compensation'\n      )\n    );\n\n\n  const activeRegime =\n    stateOf(\n      E.regimeActive,\n      selectedRegime\n    );\n\n\n  const period =\n    stateOf(\n      E.period,\n      '—'\n    );\n\n\n  const priceStatus =\n    stateOf(\n      E.priceStatus,\n      '—'\n    );\n\n\n  const costModel =\n    stateOf(\n      E.costModel,\n      '—'\n    );\n\n\n  const normalizedRegime =\n    norm(selectedRegime);\n\n\n  const isDynamic =\n    normalizedRegime.includes(\n      'dynamique'\n    );\n\n\n  const isTou =\n    normalizedRegime.includes(\n      'bi horaire'\n    )\n    ||\n    normalizedRegime.includes(\n      'hp hc'\n    );\n\n\n  const isCompensation =\n    !isDynamic &&\n    !isTou;\n\n\n  /* ==========================================================\n     PRIX FOXCAT\n     ========================================================== */\n\n  const hpPrice =\n    numberOf(\n      E.hpPrice\n    );\n\n\n  const hcPrice =\n    numberOf(\n      E.hcPrice\n    );\n\n\n  const fixedInjection =\n    numberOf(\n      E.fixedInjection\n    );\n\n\n  const dynamicCurrent =\n\
          \    numberOf(\n      E.dynamicCurrent\n    );\n\n\n  const dynamicNext =\n    numberOf(\n      E.dynamicNext\n    );\n\n\n  const dynamicInjectionRaw =\n    numberOf(\n      E.dynamicInjection\n    );\n\n\n  /*\n   * Valeur économique NORMALISÉE FoxCat.\n   *\n   * Important :\n   * le capteur brut Luminus d'injection peut être signé.\n   * FoxCat normalise déjà cette valeur.\n   */\n\n  const exportEconomicValue =\n    numberOf(\n      E.exportValue\n    );\n\n\n  let activeBuy =\n    numberOf(\n      E.activeBuy\n    );\n\n\n  if (\n    !Number.isFinite(activeBuy)\n  ) {\n\n    if (\n      isDynamic\n    ) {\n\n      activeBuy =\n        dynamicCurrent;\n    }\n\n\n    else if (\n      isTou ||\n      isCompensation\n    ) {\n\n      activeBuy =\n        period === 'HP'\n          ? hpPrice\n          : hcPrice;\n    }\n\n  }\n\n\n  const hpSource =\n    stateOf(\n      E.hpSource,\n      '—'\n    );\n\n\n  const hcSource =\n    stateOf(\n      E.hcSource,\n      '—'\n    );\n\n\n  const negativePrice =\n    stateOf(\n      E.negativePrice,\n      'NON'\n    );\n\n\n  /* ==========================================================\n     COÛTS INSTANTANÉS FOXCAT\n     ========================================================== */\n\n  const importRate =\n    numberOf(\n      E.importRate\n    );\n\n\n  const exportRate =\n    numberOf(\n      E.exportRate\n    );\n\n\n  const netRate =\n    numberOf(\n      E.netRate\n    );\n\n\n  /* ==========================================================\n     COMPTEURS JOURNALIERS NATIFS FOXCAT\n     ========================================================== */\n\n  const houseDay = Math.max(numberOf('[[foxcat:energy.today.house]]', 0), 0);\n  const pvDay = Math.max(numberOf('[[foxcat:energy.today.pv]]', 0), 0);\n  const importDay = Math.max(numberOf('[[foxcat:energy.today.import]]', 0), 0);\n  const exportDay = Math.max(numberOf('[[foxcat:energy.today.export]]', 0), 0);\n  const selfConsumed = Math.max(numberOf('[[foxcat:energy.today.self_consumed]]', 0), 0);\n\n  /* ==========================================================\n     BILAN FINANCIER JOURNALIER NATIF\n\n     EnergyAccounting intègre chaque trame avec le prix actif\n     au moment de la trame. Le coût reste donc cohérent en HP/HC\n     comme en tarification dynamique.\n     ========================================================== */\n\n  const grossDailyCost = Math.max(numberOf('[[foxcat:pricing.cost_today]]', 0), 0);\n  const exportDailyValue = numberOf('[[foxcat:pricing.export_value_today]]', 0);\n  const exportDailyRevenue = Math.max(numberOf('[[foxcat:pricing.export_revenue_today]]', Math.max(exportDailyValue, 0)), 0);\n  const exportDailyCost = Math.max(numberOf('[[foxcat:pricing.export_cost_today]]', Math.max(-exportDailyValue, 0)), 0);\n  const dailyNetCost = numberOf('[[foxcat:pricing.net_today]]', grossDailyCost + exportDailyCost - exportDailyRevenue);\n  const photovoltaicBenefit = numberOf('[[foxcat:pricing.solar_gain_today]]', 0);\n  const solarDailySaving = Math.max(photovoltaicBenefit - exportDailyRevenue + exportDailyCost, 0);\n  const theoreticalWithoutPv = Math.max(grossDailyCost + solarDailySaving, 0);\n  const compensatedEnergy = isCompensation ? Math.min(importDay, exportDay) : 0;\n  const netGridDay = importDay - exportDay;\n\n  /* ==========================================================\n     INDICATION PRÉCISION JOURNALIÈRE\n     ========================================================== */\n\n  let dailyMethod = 'COMPTABILITÉ FOXCAT';\n  let dailyNote = 'Coût intégré trame par trame avec le tarif réellement actif.';\n\n  if (isDynamic) {\n    dailyMethod = 'DYNAMIQUE · INTÉGRÉ';\n    dailyNote = 'Chaque trame est valorisée avec le prix dynamique actif au moment de la consommation et de la réinjection.';\n  }\n  else if (isTou) {\n    dailyMethod = 'HP / HC · INTÉGRÉ';\n    dailyNote = `Chaque trame est valorisée avec le tarif ${period} actif au moment du prélèvement. Les changements HP/HC sont intégrés automatiquement.`;\n  }\n  else {\n    dailyMethod = 'COMPENSATION · SUIVI';\n    dailyNote\
          \ = 'Le suivi énergétique est natif FoxCat. La compensation de facturation reste dépendante des règles du contrat et de la période de relevé.';\n  }\n\n  /* ==========================================================\n     STYLE DU RÉGIME\n     ========================================================== */\n\n  let primaryColor =\n    '#21d7ff';\n\n\n  let regimeIcon =\n    'mdi:cash-sync';\n\n\n  let regimeShort =\n    selectedRegime;\n\n\n  if (\n    isDynamic\n  ) {\n\n    primaryColor =\n      '#a78bfa';\n\n    regimeIcon =\n      'mdi:chart-line';\n\n    regimeShort =\n      'DYNAMIQUE';\n  }\n\n\n  else if (\n    isTou\n  ) {\n\n    primaryColor =\n      period === 'HP'\n        ? '#ff922b'\n        : '#19d8ff';\n\n    regimeIcon =\n      'mdi:clock-outline';\n\n    regimeShort =\n      'HP / HC';\n  }\n\n\n  else {\n\n    primaryColor =\n      '#35e59d';\n\n    regimeIcon =\n      'mdi:swap-horizontal';\n\n    regimeShort =\n      'COMPENSATION';\n  }\n\n\n  /* ==========================================================\n     STATUT PRIX\n     ========================================================== */\n\n  let statusColor =\n    '#facc15';\n\n\n  const statusNorm =\n    norm(\n      priceStatus\n    );\n\n\n  if (\n    statusNorm.includes(\n      'avantage'\n    )\n    ||\n    statusNorm.includes(\n      'bas'\n    )\n    ||\n    statusNorm.includes(\n      'negatif'\n    )\n  ) {\n\n    statusColor =\n      '#35e59d';\n  }\n\n\n  else if (\n    statusNorm.includes(\n      'eleve'\n    )\n    ||\n    statusNorm.includes(\n      'cher'\n    )\n  ) {\n\n    statusColor =\n      '#fb7185';\n  }\n\n\n  /* ==========================================================\n     TENDANCE DYNAMIQUE\n     ========================================================== */\n\n  let dynamicTrend =\n    'STABLE';\n\n\n  let dynamicTrendIcon =\n    '→';\n\n\n  let dynamicTrendColor =\n    '#94a3b8';\n\n\n  let dynamicDelta =\n    null;\n\n\n  if (\n    Number.isFinite(\n      dynamicCurrent\n    )\n    &&\n    Number.isFinite(\n      dynamicNext\n    )\n  ) {\n\n    dynamicDelta =\n      dynamicNext -\n      dynamicCurrent;\n\n\n    if (\n      dynamicDelta > 0.01\n    ) {\n\n      dynamicTrend =\n        'HAUSSE';\n\n      dynamicTrendIcon =\n        '↗';\n\n      dynamicTrendColor =\n        '#fb7185';\n    }\n\n\n    else if (\n      dynamicDelta < -0.01\n    ) {\n\n      dynamicTrend =\n        'BAISSE';\n\n      dynamicTrendIcon =\n        '↘';\n\n      dynamicTrendColor =\n        '#35e59d';\n    }\n\n  }\n\n\n  /* ==========================================================\n     ANALYSE\n     ========================================================== */\n\n  let analysisIcon =\n    'mdi:information-outline';\n\n\n  let analysisTitle =\n    'Tarification active';\n\n\n  let analysisText =\n    '';\n\n\n  let analysisColor =\n    primaryColor;\n\n\n  if (\n    isDynamic\n  ) {\n\n    analysisIcon =\n      'mdi:chart-line';\n\n\n    if (\n      negativePrice === 'OUI'\n    ) {\n\n      analysisTitle =\n        'Prix négatif actif';\n\n\n      analysisColor =\n        '#35e59d';\n\n\n      analysisText =\n        `Le prix d'achat est actuellement négatif : ${fmtPrice(dynamicCurrent)}.`;\n    }\n\n\n    else if (\n      dynamicTrend === 'HAUSSE'\n    ) {\n\n      analysisTitle =\n        'Hausse prévue';\n\n\n      analysisColor =\n        '#fb7185';\n\n\n      analysisText =\n        `${fmtPrice(dynamicCurrent)} actuellement → ${fmtPrice(dynamicNext)} à l'heure suivante.`;\n    }\n\n\n    else if (\n      dynamicTrend === 'BAISSE'\n    ) {\n\n      analysisTitle =\n        'Baisse prévue';\n\n\n      analysisColor =\n        '#35e59d';\n\n\n      analysisText =\n        `${fmtPrice(dynamicCurrent)} actuellement → ${fmtPrice(dynamicNext)} à l'heure suivante.`;\n    }\n\n\n    else {\n\n      analysisTitle =\n        'Prix relativement stable';\n\n\n      analysisText =\n        'Le prix actuel et le prix de l’heure suivante sont proches.';\n    }\n\n  }\n\n\n  else if (\n    isTou\n  ) {\n\n    analysisIcon =\n      period === 'HP'\n\
          \        ? 'mdi:weather-sunny-alert'\n        : 'mdi:weather-night';\n\n\n    analysisTitle =\n      period === 'HP'\n        ? 'Heures pleines actives'\n        : 'Heures creuses actives';\n\n\n    analysisColor =\n      period === 'HP'\n        ? '#ff922b'\n        : '#19d8ff';\n\n\n    analysisText =\n      period === 'HP'\n        ? `FoxCat applique actuellement le tarif HP : ${fmtPrice(activeBuy)}.`\n        : `FoxCat applique actuellement le tarif HC : ${fmtPrice(activeBuy)}.`;\n\n  }\n\n\n  else {\n\n    analysisIcon =\n      'mdi:swap-horizontal-bold';\n\n\n    analysisTitle =\n      'Régime compensation';\n\n\n    analysisColor =\n      '#35e59d';\n\n\n    analysisText =\n      'FoxCat utilise actuellement le modèle de compensation pour le bilan réseau.';\n  }\n\n\n  /* ==========================================================\n     HTML HP / HC\n     ========================================================== */\n\n  const touHtml = `\n\n    <div class=\"tariff-grid\">\n\n\n      <div\n        class=\"\n          tariff-box\n          ${period === 'HP' ? 'active' : ''}\n        \"\n        style=\"\n          --accent:#ff922b;\n        \"\n      >\n\n        <div class=\"tariff-head\">\n\n          <span>\n            HEURES PLEINES\n          </span>\n\n          <ha-icon\n            icon=\"mdi:weather-sunny\">\n          </ha-icon>\n\n        </div>\n\n\n        <div class=\"tariff-price\">\n          ${fmtPrice(hpPrice)}\n        </div>\n\n\n        <div class=\"tariff-source\">\n          Source · ${hpSource}\n        </div>\n\n      </div>\n\n\n\n      <div\n        class=\"\n          tariff-box\n          ${period === 'HC' ? 'active' : ''}\n        \"\n        style=\"\n          --accent:#19d8ff;\n        \"\n      >\n\n        <div class=\"tariff-head\">\n\n          <span>\n            HEURES CREUSES\n          </span>\n\n          <ha-icon\n            icon=\"mdi:weather-night\">\n          </ha-icon>\n\n        </div>\n\n\n        <div class=\"tariff-price\">\n          ${fmtPrice(hcPrice)}\n        </div>\n\n\n        <div class=\"tariff-source\">\n          Source · ${hcSource}\n        </div>\n\n      </div>\n\n    </div>\n\n\n\n    <div\n      class=\"period\"\n      style=\"\n        --accent:${\n          period === 'HP'\n            ? '#ff922b'\n            : '#19d8ff'\n        };\n      \"\n    >\n\n      <div class=\"period-icon\">\n\n        <ha-icon\n          icon=\"${\n            period === 'HP'\n              ? 'mdi:clock-alert-outline'\n              : 'mdi:clock-check-outline'\n          }\">\n        </ha-icon>\n\n      </div>\n\n\n      <div>\n\n        <div class=\"small-label\">\n          PÉRIODE ACTUELLE\n        </div>\n\n        <div class=\"period-name\">\n          ${period}\n        </div>\n\n      </div>\n\n\n      <div class=\"period-price\">\n        ${fmtPrice(activeBuy)}\n      </div>\n\n    </div>\n\n\n\n    <div class=\"details-grid\">\n\n\n      <div class=\"detail\">\n\n        <span>\n          Prix réinjection\n        </span>\n\n        <strong>\n          ${fmtPrice(fixedInjection)}\n        </strong>\n\n      </div>\n\n\n      <div class=\"detail\">\n\n        <span>\n          Statut du prix\n        </span>\n\n        <strong\n          style=\"\n            color:${statusColor};\n          \"\n        >\n          ${priceStatus}\n        </strong>\n\n      </div>\n\n    </div>\n\n  `;\n\n\n  /* ==========================================================\n     HTML DYNAMIQUE\n     ========================================================== */\n\n  const dynamicHtml = `\n\n    <div class=\"dynamic-main\">\n\n\n      <div>\n\n        <div class=\"small-label\">\n          PRIX DYNAMIQUE ACTUEL\n        </div>\n\n\n        <div class=\"dynamic-price\">\n          ${fmtPrice(dynamicCurrent)}\n        </div>\n\n      </div>\n\n\n      <div\n        class=\"trend\"\n        style=\"\n          color:${dynamicTrendColor};\n          border-color:${dynamicTrendColor}35;\n          background:${dynamicTrendColor}0d;\n        \"\n      >\n\n        <strong>\n\
          \          ${dynamicTrendIcon}\n          ${dynamicTrend}\n        </strong>\n\n\n        <span>\n          ${fmtDelta(dynamicDelta)}\n        </span>\n\n      </div>\n\n    </div>\n\n\n\n    <div class=\"tariff-grid\">\n\n\n      <div\n        class=\"tariff-box\"\n        style=\"\n          --accent:#a78bfa;\n        \"\n      >\n\n        <div class=\"tariff-head\">\n\n          <span>\n            HEURE SUIVANTE\n          </span>\n\n          <ha-icon\n            icon=\"mdi:clock-fast\">\n          </ha-icon>\n\n        </div>\n\n\n        <div class=\"tariff-price\">\n          ${fmtPrice(dynamicNext)}\n        </div>\n\n\n        <div class=\"tariff-source\">\n          Prochaine période tarifaire\n        </div>\n\n      </div>\n\n\n\n      <div\n        class=\"tariff-box\"\n        style=\"\n          --accent:#35e59d;\n        \"\n      >\n\n        <div class=\"tariff-head\">\n\n          <span>\n            VALEUR RÉINJECTION\n          </span>\n\n          <ha-icon\n            icon=\"mdi:transmission-tower-export\">\n          </ha-icon>\n\n        </div>\n\n\n        <div class=\"tariff-price\">\n          ${fmtPrice(exportEconomicValue)}\n        </div>\n\n\n        <div class=\"tariff-source\">\n\n          Brut :\n          ${fmtPrice(dynamicInjectionRaw)}\n\n        </div>\n\n      </div>\n\n    </div>\n\n\n\n    <div class=\"details-grid dynamic-details\">\n\n\n      <div class=\"detail\">\n\n        <span>\n          Prix achat actif\n        </span>\n\n        <strong>\n          ${fmtPrice(activeBuy)}\n        </strong>\n\n      </div>\n\n\n      <div class=\"detail\">\n\n        <span>\n          Prix négatif\n        </span>\n\n        <strong\n          style=\"\n            color:${\n              negativePrice === 'OUI'\n                ? '#35e59d'\n                : '#94a3b8'\n            };\n          \"\n        >\n          ${negativePrice}\n        </strong>\n\n      </div>\n\n\n      <div class=\"detail\">\n\n        <span>\n          Statut du prix\n        </span>\n\n        <strong\n          style=\"\n            color:${statusColor};\n          \"\n        >\n          ${priceStatus}\n        </strong>\n\n      </div>\n\n    </div>\n\n  `;\n\n\n  /* ==========================================================\n     HTML COMPENSATION\n     ========================================================== */\n\n  const compensationHtml = `\n\n    <div class=\"compensation\">\n\n      <div class=\"compensation-icon\">\n\n        <ha-icon\n          icon=\"mdi:swap-horizontal-bold\">\n        </ha-icon>\n\n      </div>\n\n\n      <div>\n\n        <div class=\"small-label\">\n          RÉGIME ACTIF\n        </div>\n\n\n        <div class=\"compensation-title\">\n          COMPENSATION\n        </div>\n\n\n        <div class=\"compensation-text\">\n          La réinjection vient compenser énergétiquement\n          le prélèvement réseau.\n        </div>\n\n      </div>\n\n    </div>\n\n\n\n    <div class=\"details-grid\">\n\n\n      <div class=\"detail\">\n\n        <span>\n          Prix achat actif\n        </span>\n\n        <strong>\n          ${fmtPrice(activeBuy)}\n        </strong>\n\n      </div>\n\n\n      <div class=\"detail\">\n\n        <span>\n          Modèle\n        </span>\n\n        <strong>\n          ESTIMATION COMPENSATION\n        </strong>\n\n      </div>\n\n    </div>\n\n  `;\n\n\n  const tariffHtml =\n    isDynamic\n      ? dynamicHtml\n      : isTou\n        ? touHtml\n        : compensationHtml;\n\n\n  /* ==========================================================\n     RENDU\n     ========================================================== */\n\n  return `\n\n    <style>\n\n      * {\n        box-sizing:border-box;\n      }\n\n\n      .wrap {\n\n        padding:22px;\n\n        color:#f8fafc;\n\n        font-family:\n          -apple-system,\n          BlinkMacSystemFont,\n          \"Segoe UI\",\n          Roboto,\n          sans-serif;\n      }\n\n\n      /* =====================================================\n         HEADER\n         =====================================================\
          \ */\n\n      .header {\n\n        display:flex;\n\n        justify-content:space-between;\n\n        align-items:flex-start;\n\n        gap:14px;\n\n        margin-bottom:16px;\n      }\n\n\n      .brand {\n\n        display:flex;\n\n        align-items:center;\n\n        gap:12px;\n      }\n\n\n      .logo {\n\n        width:47px;\n\n        height:47px;\n\n        flex:none;\n\n        display:flex;\n\n        align-items:center;\n\n        justify-content:center;\n\n        border-radius:15px;\n\n        color:${primaryColor};\n\n        background:${primaryColor}10;\n\n        border:\n          1px solid ${primaryColor}25;\n      }\n\n\n      .logo ha-icon {\n        --mdc-icon-size:25px;\n      }\n\n\n      .brand-name {\n\n        color:#19d8ff;\n\n        font-size:9px;\n\n        font-weight:900;\n\n        letter-spacing:2px;\n      }\n\n\n      .title {\n\n        margin-top:4px;\n\n        font-size:23px;\n\n        font-weight:900;\n      }\n\n\n      .subtitle {\n\n        margin-top:3px;\n\n        color:#64748b;\n\n        font-size:8px;\n      }\n\n\n      /* =====================================================\n         TARIFICATION PRINCIPALE\n         ===================================================== */\n\n      .main-badge {\n\n        flex:none;\n\n        padding:9px 11px;\n\n        border-radius:14px;\n\n        text-align:right;\n\n        color:${primaryColor};\n\n        background:${primaryColor}0d;\n\n        border:\n          1px solid ${primaryColor}28;\n      }\n\n\n      .main-badge span {\n\n        display:block;\n\n        color:#64748b;\n\n        font-size:6px;\n\n        font-weight:900;\n\n        letter-spacing:.12em;\n      }\n\n\n      .main-badge strong {\n\n        display:block;\n\n        margin-top:3px;\n\n        font-size:12px;\n\n        font-weight:950;\n      }\n\n\n      /* =====================================================\n         RÉGIME ACTIF\n         ===================================================== */\n\n      .primary {\n\n        display:grid;\n\n        grid-template-columns:\n          1fr auto;\n\n        align-items:center;\n\n        gap:15px;\n\n        padding:16px;\n\n        border-radius:18px;\n\n        background:\n          linear-gradient(\n            135deg,\n            ${primaryColor}0d,\n            rgba(255,255,255,.018)\n          );\n\n        border:\n          1px solid ${primaryColor}20;\n      }\n\n\n      .primary-left {\n\n        display:flex;\n\n        align-items:center;\n\n        gap:11px;\n      }\n\n\n      .primary-icon {\n\n        width:41px;\n\n        height:41px;\n\n        flex:none;\n\n        display:flex;\n\n        align-items:center;\n\n        justify-content:center;\n\n        border-radius:12px;\n\n        color:${primaryColor};\n\n        background:${primaryColor}10;\n      }\n\n\n      .primary-icon ha-icon {\n        --mdc-icon-size:23px;\n      }\n\n\n      .small-label {\n\n        color:#64748b;\n\n        font-size:7px;\n\n        font-weight:900;\n\n        letter-spacing:.1em;\n      }\n\n\n      .primary-name {\n\n        margin-top:3px;\n\n        color:${primaryColor};\n\n        font-size:16px;\n\n        font-weight:950;\n      }\n\n\n      .active-price {\n        text-align:right;\n      }\n\n\n      .active-price strong {\n\n        display:block;\n\n        font-size:21px;\n\n        font-weight:950;\n      }\n\n\n      .active-price span {\n\n        display:block;\n\n        margin-top:3px;\n\n        color:#526174;\n\n        font-size:7px;\n      }\n\n\n      /* =====================================================\n         TITRES\n         ===================================================== */\n\n      .section-title {\n\n        display:flex;\n\n        justify-content:space-between;\n\n        align-items:center;\n\n        gap:10px;\n\n        margin:\n          19px 1px\n          9px;\n\n        color:#718096;\n\n        font-size:7px;\n\n        font-weight:900;\n\n        letter-spacing:.14em;\n      }\n\n\n      .section-title span {\n\n        color:#475569;\n\
          \n        font-size:6px;\n      }\n\n\n      /* =====================================================\n         TARIFS\n         ===================================================== */\n\n      .tariff-grid {\n\n        display:grid;\n\n        grid-template-columns:\n          1fr 1fr;\n\n        gap:10px;\n      }\n\n\n      .tariff-box {\n\n        padding:15px;\n\n        border-radius:17px;\n\n        background:\n          rgba(255,255,255,.022);\n\n        border:\n          1px solid rgba(255,255,255,.05);\n      }\n\n\n      .tariff-box.active {\n\n        background:\n          linear-gradient(\n            145deg,\n            rgba(255,255,255,.045),\n            rgba(255,255,255,.018)\n          );\n\n        border-color:\n          var(--accent);\n      }\n\n\n      .tariff-head {\n\n        display:flex;\n\n        justify-content:space-between;\n\n        align-items:center;\n\n        gap:10px;\n\n        color:\n          var(--accent);\n\n        font-size:7px;\n\n        font-weight:900;\n      }\n\n\n      .tariff-head ha-icon {\n        --mdc-icon-size:18px;\n      }\n\n\n      .tariff-price {\n\n        margin-top:11px;\n\n        font-size:20px;\n\n        font-weight:950;\n      }\n\n\n      .tariff-source {\n\n        margin-top:5px;\n\n        color:#526174;\n\n        font-size:7px;\n\n        overflow:hidden;\n\n        white-space:nowrap;\n\n        text-overflow:ellipsis;\n      }\n\n\n      /* =====================================================\n         PÉRIODE HP/HC\n         ===================================================== */\n\n      .period {\n\n        display:grid;\n\n        grid-template-columns:\n          auto\n          1fr\n          auto;\n\n        align-items:center;\n\n        gap:11px;\n\n        margin-top:10px;\n\n        padding:13px 14px;\n\n        border-radius:15px;\n\n        background:\n          rgba(255,255,255,.02);\n\n        border:\n          1px solid var(--accent);\n      }\n\n\n      .period-icon {\n\n        width:34px;\n\n        height:34px;\n\n        display:flex;\n\n        align-items:center;\n\n        justify-content:center;\n\n        border-radius:10px;\n\n        color:\n          var(--accent);\n\n        background:\n          rgba(255,255,255,.03);\n      }\n\n\n      .period-icon ha-icon {\n        --mdc-icon-size:19px;\n      }\n\n\n      .period-name {\n\n        margin-top:2px;\n\n        color:\n          var(--accent);\n\n        font-size:13px;\n\n        font-weight:950;\n      }\n\n\n      .period-price {\n\n        font-size:14px;\n\n        font-weight:900;\n      }\n\n\n      /* =====================================================\n         DYNAMIQUE\n         ===================================================== */\n\n      .dynamic-main {\n\n        display:flex;\n\n        justify-content:space-between;\n\n        align-items:center;\n\n        gap:14px;\n\n        margin-bottom:10px;\n\n        padding:16px;\n\n        border-radius:18px;\n\n        background:\n          linear-gradient(\n            135deg,\n            rgba(167,139,250,.08),\n            rgba(255,255,255,.015)\n          );\n\n        border:\n          1px solid rgba(167,139,250,.15);\n      }\n\n\n      .dynamic-price {\n\n        margin-top:4px;\n\n        color:#a78bfa;\n\n        font-size:28px;\n\n        font-weight:950;\n      }\n\n\n      .trend {\n\n        padding:8px 10px;\n\n        border-radius:12px;\n\n        border:1px solid;\n\n        text-align:right;\n      }\n\n\n      .trend strong {\n\n        display:block;\n\n        font-size:9px;\n\n        font-weight:950;\n      }\n\n\n      .trend span {\n\n        display:block;\n\n        margin-top:2px;\n\n        font-size:7px;\n      }\n\n\n      /* =====================================================\n         DÉTAILS\n         ===================================================== */\n\n      .details-grid {\n\n        display:grid;\n\n        grid-template-columns:\n          repeat(\n            2,\n            minmax(0,1fr)\n          );\n\n        gap:8px;\n\n\
          \        margin-top:10px;\n      }\n\n\n      .dynamic-details {\n\n        grid-template-columns:\n          repeat(\n            3,\n            minmax(0,1fr)\n          );\n      }\n\n\n      .detail {\n\n        padding:10px 11px;\n\n        border-radius:13px;\n\n        background:\n          rgba(255,255,255,.018);\n\n        border:\n          1px solid rgba(255,255,255,.04);\n      }\n\n\n      .detail span {\n\n        display:block;\n\n        color:#526174;\n\n        font-size:6px;\n\n        font-weight:900;\n      }\n\n\n      .detail strong {\n\n        display:block;\n\n        margin-top:4px;\n\n        color:#cbd5e1;\n\n        font-size:9px;\n      }\n\n\n      /* =====================================================\n         COMPENSATION\n         ===================================================== */\n\n      .compensation {\n\n        display:flex;\n\n        align-items:center;\n\n        gap:12px;\n\n        padding:16px;\n\n        border-radius:17px;\n\n        background:\n          rgba(53,229,157,.045);\n\n        border:\n          1px solid rgba(53,229,157,.11);\n      }\n\n\n      .compensation-icon {\n\n        width:42px;\n\n        height:42px;\n\n        flex:none;\n\n        display:flex;\n\n        align-items:center;\n\n        justify-content:center;\n\n        border-radius:13px;\n\n        color:#35e59d;\n\n        background:\n          rgba(53,229,157,.08);\n      }\n\n\n      .compensation-icon ha-icon {\n        --mdc-icon-size:23px;\n      }\n\n\n      .compensation-title {\n\n        margin-top:3px;\n\n        color:#35e59d;\n\n        font-size:14px;\n\n        font-weight:950;\n      }\n\n\n      .compensation-text {\n\n        margin-top:4px;\n\n        color:#64748b;\n\n        font-size:8px;\n\n        line-height:1.4;\n      }\n\n\n      /* =====================================================\n         IMPACT INSTANTANÉ\n         ===================================================== */\n\n      .finance {\n\n        display:grid;\n\n        grid-template-columns:\n          repeat(\n            3,\n            minmax(0,1fr)\n          );\n\n        gap:8px;\n      }\n\n\n      .finance-box {\n\n        padding:12px;\n\n        border-radius:14px;\n\n        background:\n          rgba(255,255,255,.02);\n\n        border:\n          1px solid rgba(255,255,255,.045);\n      }\n\n\n      .finance-box span {\n\n        display:block;\n\n        color:#526174;\n\n        font-size:6px;\n\n        font-weight:900;\n      }\n\n\n      .finance-box strong {\n\n        display:block;\n\n        margin-top:5px;\n\n        font-size:13px;\n\n        font-weight:900;\n      }\n\n\n      .finance-import strong {\n        color:#fb7185;\n      }\n\n\n      .finance-export strong {\n        color:#35e59d;\n      }\n\n\n      .finance-net strong {\n        color:#19d8ff;\n      }\n\n\n      /* =====================================================\n         COÛT JOURNALIER PRINCIPAL\n         ===================================================== */\n\n      .daily-cost-hero {\n\n        display:flex;\n\n        justify-content:space-between;\n\n        align-items:center;\n\n        gap:15px;\n\n        padding:17px;\n\n        border-radius:19px;\n\n        background:\n          radial-gradient(\n            circle at 100% 0%,\n            rgba(53,229,157,.08),\n            transparent 48%\n          ),\n          linear-gradient(\n            135deg,\n            rgba(25,216,255,.05),\n            rgba(255,255,255,.015)\n          );\n\n        border:\n          1px solid rgba(25,216,255,.11);\n      }\n\n\n      .daily-main-value {\n\n        margin-top:5px;\n\n        color:#35e59d;\n\n        font-size:34px;\n\n        line-height:1;\n\n        font-weight:950;\n      }\n\n\n      .daily-method {\n\n        display:inline-block;\n\n        margin-top:8px;\n\n        padding:4px 7px;\n\n        border-radius:8px;\n\n        color:#94a3b8;\n\n        background:\n          rgba(255,255,255,.035);\n\n        font-size:6px;\n\n        font-weight:900;\n\n        letter-spacing:.09em;\n\
          \      }\n\n\n      .daily-energy {\n\n        text-align:right;\n      }\n\n\n      .daily-energy span {\n\n        display:block;\n\n        color:#526174;\n\n        font-size:6px;\n\n        font-weight:900;\n\n        letter-spacing:.1em;\n      }\n\n\n      .daily-energy strong {\n\n        display:block;\n\n        margin-top:5px;\n\n        color:#f8fafc;\n\n        font-size:17px;\n\n        font-weight:900;\n      }\n\n\n      /* =====================================================\n         DÉTAIL COÛT JOUR\n         ===================================================== */\n\n      .daily-grid {\n\n        display:grid;\n\n        grid-template-columns:\n          repeat(\n            4,\n            minmax(0,1fr)\n          );\n\n        gap:8px;\n\n        margin-top:9px;\n      }\n\n\n      .daily-box {\n\n        min-width:0;\n\n        padding:13px;\n\n        border-radius:15px;\n\n        background:\n          rgba(255,255,255,.02);\n\n        border:\n          1px solid rgba(255,255,255,.045);\n      }\n\n\n      .daily-icon {\n\n        width:31px;\n\n        height:31px;\n\n        display:flex;\n\n        align-items:center;\n\n        justify-content:center;\n\n        border-radius:9px;\n      }\n\n\n      .daily-icon ha-icon {\n        --mdc-icon-size:17px;\n      }\n\n\n      .red-bg {\n\n        color:#fb7185;\n\n        background:\n          rgba(251,113,133,.07);\n      }\n\n\n      .green-bg {\n\n        color:#35e59d;\n\n        background:\n          rgba(53,229,157,.07);\n      }\n\n\n      .orange-bg {\n\n        color:#ff922b;\n\n        background:\n          rgba(255,146,43,.07);\n      }\n\n\n      .cyan-bg {\n\n        color:#19d8ff;\n\n        background:\n          rgba(25,216,255,.07);\n      }\n\n\n      .daily-label {\n\n        margin-top:9px;\n\n        color:#64748b;\n\n        font-size:6px;\n\n        font-weight:900;\n\n        letter-spacing:.08em;\n      }\n\n\n      .daily-value {\n\n        margin-top:4px;\n\n        color:#f8fafc;\n\n        font-size:18px;\n\n        font-weight:950;\n      }\n\n\n      .daily-sub {\n\n        margin-top:4px;\n\n        color:#475569;\n\n        font-size:6px;\n\n        line-height:1.35;\n      }\n\n\n      .red {\n        color:#fb7185 !important;\n      }\n\n\n      .green {\n        color:#35e59d !important;\n      }\n\n\n      .orange {\n        color:#ff922b !important;\n      }\n\n\n      .cyan {\n        color:#19d8ff !important;\n      }\n\n\n      /* =====================================================\n         BILAN ÉNERGÉTIQUE JOUR\n         ===================================================== */\n\n      .daily-summary {\n\n        display:grid;\n\n        grid-template-columns:\n          repeat(\n            4,\n            minmax(0,1fr)\n          );\n\n        gap:1px;\n\n        margin-top:9px;\n\n        overflow:hidden;\n\n        border-radius:13px;\n\n        background:\n          rgba(255,255,255,.04);\n      }\n\n\n      .daily-summary > div {\n\n        padding:9px 10px;\n\n        background:#09131f;\n      }\n\n\n      .daily-summary span {\n\n        display:block;\n\n        color:#526174;\n\n        font-size:5px;\n\n        font-weight:900;\n\n        letter-spacing:.08em;\n      }\n\n\n      .daily-summary strong {\n\n        display:block;\n\n        margin-top:4px;\n\n        font-size:10px;\n      }\n\n\n      /* =====================================================\n         AVANTAGE PV\n         ===================================================== */\n\n      .solar-benefit {\n\n        display:flex;\n\n        justify-content:space-between;\n\n        align-items:center;\n\n        gap:14px;\n\n        margin-top:9px;\n\n        padding:13px 14px;\n\n        border-radius:15px;\n\n        background:\n          linear-gradient(\n            90deg,\n            rgba(53,229,157,.045),\n            rgba(255,146,43,.025)\n          );\n\n        border:\n          1px solid rgba(53,229,157,.09);\n      }\n\n\n      .solar-benefit-left {\n\n        display:flex;\n\n        align-items:center;\n\
          \n        gap:10px;\n      }\n\n\n      .solar-benefit-icon {\n\n        width:35px;\n\n        height:35px;\n\n        display:flex;\n\n        align-items:center;\n\n        justify-content:center;\n\n        border-radius:10px;\n\n        color:#35e59d;\n\n        background:\n          rgba(53,229,157,.07);\n      }\n\n\n      .solar-benefit-icon ha-icon {\n        --mdc-icon-size:20px;\n      }\n\n\n      .solar-benefit-value {\n\n        margin-top:3px;\n\n        color:#35e59d;\n\n        font-size:19px;\n\n        font-weight:950;\n      }\n\n\n      .solar-benefit-right {\n\n        text-align:right;\n\n        color:#64748b;\n\n        font-size:7px;\n      }\n\n\n      .solar-benefit-right strong {\n\n        display:block;\n\n        margin-top:3px;\n\n        color:#ff922b;\n\n        font-size:13px;\n      }\n\n\n      /* =====================================================\n         NOTE\n         ===================================================== */\n\n      .daily-note {\n\n        display:flex;\n\n        align-items:flex-start;\n\n        gap:7px;\n\n        margin-top:9px;\n\n        padding:8px 10px;\n\n        border-radius:11px;\n\n        color:#526174;\n\n        background:\n          rgba(255,255,255,.015);\n\n        font-size:6px;\n\n        line-height:1.45;\n      }\n\n\n      .daily-note ha-icon {\n\n        flex:none;\n\n        --mdc-icon-size:14px;\n      }\n\n\n      /* =====================================================\n         ANALYSE\n         ===================================================== */\n\n      .analysis {\n\n        display:flex;\n\n        align-items:center;\n\n        gap:11px;\n\n        margin-top:12px;\n\n        padding:13px 14px;\n\n        border-radius:16px;\n\n        background:${analysisColor}0b;\n\n        border:\n          1px solid ${analysisColor}20;\n      }\n\n\n      .analysis-icon {\n\n        width:37px;\n\n        height:37px;\n\n        flex:none;\n\n        display:flex;\n\n        align-items:center;\n\n        justify-content:center;\n\n        border-radius:11px;\n\n        color:${analysisColor};\n\n        background:${analysisColor}0d;\n      }\n\n\n      .analysis-icon ha-icon {\n        --mdc-icon-size:20px;\n      }\n\n\n      .analysis-title {\n\n        color:${analysisColor};\n\n        font-size:10px;\n\n        font-weight:900;\n      }\n\n\n      .analysis-text {\n\n        margin-top:3px;\n\n        color:#94a3b8;\n\n        font-size:8px;\n\n        line-height:1.4;\n      }\n\n\n      /* =====================================================\n         FOOTER\n         ===================================================== */\n\n      .footer {\n\n        display:flex;\n\n        justify-content:space-between;\n\n        gap:10px;\n\n        margin-top:13px;\n\n        padding-top:10px;\n\n        border-top:\n          1px solid rgba(255,255,255,.04);\n\n        color:#475569;\n\n        font-size:7px;\n      }\n\n\n      .footer strong {\n        color:#718096;\n      }\n\n\n      /* =====================================================\n         RESPONSIVE\n         ===================================================== */\n\n      @media (max-width:750px) {\n\n        .daily-grid {\n\n          grid-template-columns:\n            repeat(\n              2,\n              minmax(0,1fr)\n            );\n        }\n\n\n        .daily-summary {\n\n          grid-template-columns:\n            repeat(\n              2,\n              minmax(0,1fr)\n            );\n        }\n\n      }\n\n\n      @media (max-width:650px) {\n\n        .wrap {\n          padding:16px;\n        }\n\n\n        .header {\n          flex-direction:column;\n        }\n\n\n        .main-badge {\n          text-align:left;\n        }\n\n\n        .primary {\n\n          grid-template-columns:\n            1fr;\n        }\n\n\n        .active-price {\n          text-align:left;\n        }\n\n\n        .tariff-grid,\n        .details-grid,\n        .dynamic-details,\n        .finance {\n\n          grid-template-columns:\n            1fr;\n  \
          \      }\n\n\n        .dynamic-main {\n\n          align-items:flex-start;\n\n          flex-direction:column;\n        }\n\n\n        .trend {\n          text-align:left;\n        }\n\n\n        .daily-cost-hero {\n\n          align-items:flex-start;\n\n          flex-direction:column;\n        }\n\n\n        .daily-energy {\n          text-align:left;\n        }\n\n      }\n\n    </style>\n\n\n    <div class=\"wrap\">\n\n\n      <!-- ====================================================\n           HEADER\n           ==================================================== -->\n\n      <div class=\"header\">\n\n\n        <div class=\"brand\">\n\n          <div class=\"logo\">\n\n            <ha-icon\n              icon=\"mdi:cash-sync\">\n            </ha-icon>\n\n          </div>\n\n\n          <div>\n\n            <div class=\"brand-name\">\n              HOMEFOXCAT ENERGY\n            </div>\n\n            <div class=\"title\">\n              Tarification\n            </div>\n\n            <div class=\"subtitle\">\n              Gestion financière FoxCat Energy\n            </div>\n\n          </div>\n\n        </div>\n\n\n\n        <div class=\"main-badge\">\n\n          <span>\n            TARIFICATION PRINCIPALE\n          </span>\n\n          <strong>\n            ${regimeShort}\n          </strong>\n\n        </div>\n\n      </div>\n\n\n\n      <!-- ====================================================\n           RÉGIME PRINCIPAL\n           ==================================================== -->\n\n      <div class=\"primary\">\n\n\n        <div class=\"primary-left\">\n\n          <div class=\"primary-icon\">\n\n            <ha-icon\n              icon=\"${regimeIcon}\">\n            </ha-icon>\n\n          </div>\n\n\n          <div>\n\n            <div class=\"small-label\">\n              RÉGIME TARIFAIRE SÉLECTIONNÉ\n            </div>\n\n            <div class=\"primary-name\">\n              ${selectedRegime}\n            </div>\n\n          </div>\n\n        </div>\n\n\n\n        <div class=\"active-price\">\n\n          <strong>\n            ${fmtPrice(activeBuy)}\n          </strong>\n\n          <span>\n            prix d'achat actif FoxCat\n          </span>\n\n        </div>\n\n      </div>\n\n\n\n      <!-- ====================================================\n           TARIFICATION ACTIVE\n           ==================================================== -->\n\n      <div class=\"section-title\">\n\n        TARIFICATION ACTIVE\n\n        <span>\n\n          ${\n            isDynamic\n              ? 'TEMPS RÉEL'\n              : isTou\n                ? `PÉRIODE ${period}`\n                : 'COMPENSATION'\n          }\n\n        </span>\n\n      </div>\n\n\n      ${tariffHtml}\n\n\n\n      <!-- ====================================================\n           IMPACT FINANCIER INSTANTANÉ\n           ==================================================== -->\n\n      <div class=\"section-title\">\n\n        IMPACT FINANCIER INSTANTANÉ\n\n        <span>\n          €/HEURE\n        </span>\n\n      </div>\n\n\n      <div class=\"finance\">\n\n\n        <div class=\"finance-box finance-import\">\n\n          <span>\n            COÛT PRÉLÈVEMENT\n          </span>\n\n          <strong>\n            ${fmtRate(importRate)}\n          </strong>\n\n        </div>\n\n\n\n        <div class=\"finance-box finance-export\">\n\n          <span>\n            VALEUR RÉINJECTION\n          </span>\n\n          <strong>\n            ${fmtRate(exportRate)}\n          </strong>\n\n        </div>\n\n\n\n        <div class=\"finance-box finance-net\">\n\n          <span>\n            SOLDE RÉSEAU\n          </span>\n\n          <strong>\n            ${fmtRate(netRate)}\n          </strong>\n\n        </div>\n\n\n      </div>\n\n\n\n      <!-- ====================================================\n           COÛT JOURNALIER\n           ==================================================== -->\n\n      <div class=\"section-title\">\n\n        COÛT JOURNALIER\n\n        <span>\n          DEPUIS 00:00\n        </span>\n\n\
          \      </div>\n\n\n      <div class=\"daily-cost-hero\">\n\n\n        <div>\n\n          <div class=\"small-label\">\n            COÛT NET DU JOUR\n          </div>\n\n\n          <div class=\"daily-main-value\">\n            ${fmtEuro(dailyNetCost)}\n          </div>\n\n\n          <div class=\"daily-method\">\n            ${dailyMethod}\n          </div>\n\n        </div>\n\n\n\n        <div class=\"daily-energy\">\n\n          <span>\n            PRÉLÈVEMENT RÉSEAU\n          </span>\n\n          <strong>\n            ${fmtEnergy(importDay)}\n          </strong>\n\n        </div>\n\n      </div>\n\n\n\n      <!-- ====================================================\n           DÉTAIL FINANCIER JOUR\n           ==================================================== -->\n\n      <div class=\"daily-grid\">\n\n\n        <!-- COÛT BRUT -->\n\n        <div class=\"daily-box\">\n\n          <div class=\"daily-icon red-bg\">\n\n            <ha-icon\n              icon=\"mdi:cash-minus\">\n            </ha-icon>\n\n          </div>\n\n\n          <div class=\"daily-label\">\n            COÛT BRUT RÉSEAU\n          </div>\n\n\n          <div class=\"daily-value red\">\n            ${fmtEuro(grossDailyCost)}\n          </div>\n\n\n          <div class=\"daily-sub\">\n            ${fmtEnergy(importDay)}\n            prélevés\n          </div>\n\n        </div>\n\n\n\n        <!-- RÉINJECTION -->\n\n        <div class=\"daily-box\">\n\n          <div class=\"daily-icon green-bg\">\n\n            <ha-icon\n              icon=\"mdi:transmission-tower-export\">\n            </ha-icon>\n\n          </div>\n\n\n          <div class=\"daily-label\">\n\n            ${\n              isCompensation\n                ? 'VALEUR COMPENSÉE'\n                : 'SOLDE RÉINJECTION'\n            }\n\n          </div>\n\n\n          <div class=\"daily-value green\">\n            ${fmtEuro(exportDailyValue)}\n          </div>\n\n\n          <div class=\"daily-sub\">\n\n            ${\n              isCompensation\n                ? `${fmtEnergy(compensatedEnergy)} compensés`\n                : `${fmtEnergy(exportDay)} réinjectés`\n            }\n\n          </div>\n\n        </div>\n\n\n\n        <!-- SOLAIRE -->\n\n        <div class=\"daily-box\">\n\n          <div class=\"daily-icon orange-bg\">\n\n            <ha-icon\n              icon=\"mdi:home-solar-panel\">\n            </ha-icon>\n\n          </div>\n\n\n          <div class=\"daily-label\">\n            ÉCONOMIE SOLAIRE\n          </div>\n\n\n          <div class=\"daily-value orange\">\n            ${fmtEuro(solarDailySaving)}\n          </div>\n\n\n          <div class=\"daily-sub\">\n            ${fmtEnergy(selfConsumed)}\n            autoconsommés\n          </div>\n\n        </div>\n\n\n\n        <!-- SANS PV -->\n\n        <div class=\"daily-box\">\n\n          <div class=\"daily-icon cyan-bg\">\n\n            <ha-icon\n              icon=\"mdi:home-lightning-bolt-outline\">\n            </ha-icon>\n\n          </div>\n\n\n          <div class=\"daily-label\">\n            COÛT SANS PV\n          </div>\n\n\n          <div class=\"daily-value cyan\">\n            ${fmtEuro(theoreticalWithoutPv)}\n          </div>\n\n\n          <div class=\"daily-sub\">\n            ${fmtEnergy(houseDay)}\n            consommation maison\n          </div>\n\n        </div>\n\n      </div>\n\n\n\n      <!-- ====================================================\n           BILAN ÉNERGÉTIQUE\n           ==================================================== -->\n\n      <div class=\"daily-summary\">\n\n\n        <div>\n\n          <span>\n            PRÉLÈVEMENT\n          </span>\n\n          <strong class=\"red\">\n            ${fmtEnergy(importDay)}\n          </strong>\n\n        </div>\n\n\n\n        <div>\n\n          <span>\n            RÉINJECTION\n          </span>\n\n          <strong class=\"green\">\n            ${fmtEnergy(exportDay)}\n          </strong>\n\n        </div>\n\n\n\n        <div>\n\n          <span>\n            PV AUTOCONSOMMÉ\n          </span>\n\n          <strong class=\"\
          orange\">\n            ${fmtEnergy(selfConsumed)}\n          </strong>\n\n        </div>\n\n\n\n        <div>\n\n          <span>\n            SOLDE RÉSEAU\n          </span>\n\n          <strong\n            class=\"${\n              netGridDay <= 0\n                ? 'green'\n                : 'cyan'\n            }\"\n          >\n\n            ${\n              netGridDay >= 0\n                ? fmtEnergy(netGridDay)\n                : `−${fmtEnergy(Math.abs(netGridDay))}`\n            }\n\n          </strong>\n\n        </div>\n\n      </div>\n\n\n\n      <!-- ====================================================\n           AVANTAGE PHOTOVOLTAÏQUE\n           ==================================================== -->\n\n      <div class=\"solar-benefit\">\n\n\n        <div class=\"solar-benefit-left\">\n\n          <div class=\"solar-benefit-icon\">\n\n            <ha-icon\n              icon=\"mdi:piggy-bank-outline\">\n            </ha-icon>\n\n          </div>\n\n\n          <div>\n\n            <div class=\"small-label\">\n              AVANTAGE PHOTOVOLTAÏQUE\n            </div>\n\n            <div class=\"solar-benefit-value\">\n              ${fmtEuro(photovoltaicBenefit)}\n            </div>\n\n          </div>\n\n        </div>\n\n\n\n        <div class=\"solar-benefit-right\">\n\n          COÛT THÉORIQUE SANS PV\n\n          <strong>\n            ${fmtEuro(theoreticalWithoutPv)}\n          </strong>\n\n        </div>\n\n      </div>\n\n\n\n      <!-- ====================================================\n           NOTE MÉTHODE\n           ==================================================== -->\n\n      <div class=\"daily-note\">\n\n        <ha-icon\n          icon=\"mdi:information-outline\">\n        </ha-icon>\n\n        <span>\n          ${dailyNote}\n        </span>\n\n      </div>\n\n\n\n      <!-- ====================================================\n           ANALYSE\n           ==================================================== -->\n\n      <div class=\"analysis\">\n\n\n        <div class=\"analysis-icon\">\n\n          <ha-icon\n            icon=\"${analysisIcon}\">\n          </ha-icon>\n\n        </div>\n\n\n        <div>\n\n          <div class=\"analysis-title\">\n            ${analysisTitle}\n          </div>\n\n          <div class=\"analysis-text\">\n            ${analysisText}\n          </div>\n\n        </div>\n\n      </div>\n\n\n\n      <!-- ====================================================\n           FOOTER\n           ==================================================== -->\n\n      <div class=\"footer\">\n\n        <span>\n          Modèle FoxCat ·\n          <strong>\n            ${costModel}\n          </strong>\n        </span>\n\n        <span>\n          Régime actif ·\n          <strong>\n            ${activeRegime}\n          </strong>\n        </span>\n\n      </div>\n\n\n    </div>\n\n  `;\n]]]\n"
      tap_action:
        action: none
      hold_action:
        action: none
      double_tap_action:
        action: none
  - type: grid
    cards:
    - type: custom:button-card
      show_name: false
      show_icon: false
      show_state: false
      triggers_update: all
      styles:
        card:
        - padding: 0
        - border-radius: 26px
        - overflow: hidden
        - background: linear-gradient(145deg, rgba(7,11,20,0.98), rgba(12,22,38,0.98))
        - border: 1px solid rgba(255,255,255,0.08)
        - box-shadow: 0 16px 38px rgba(0,0,0,0.35)
        grid:
        - grid-template-areas: '"content"'
        - grid-template-columns: 1fr
        custom_fields:
          content:
          - width: 100%
      custom_fields:
        content: "[[[\n  /* ==========================================================\n     FOXCAT ENERGY V1.5.0\n     CONSOMMATION APPAREILS — COMPTABILITÉ NATIVE FOXCAT\n\n     Priorité : entités natives FoxCat Energy V1.5.0\n     Fallback : anciens capteurs uniquement si nécessaire.\n     Une carte n'est affichée que si sa gestion FoxCat est active.\n     ========================================================== */\n\n\n  /* ==========================================================\n     OUTILS\n     ========================================================== */\n\n  const norm = (value) =>\n    String(value ?? '')\n      .normalize('NFD')\n      .replace(/[\\u0300-\\u036f]/g, '')\n      .toLowerCase()\n      .replace(/[^a-z0-9]+/g, ' ')\n      .trim();\n\n\n  const validState = (id) => {\n\n    const s =\n      id\n        ? states[id]\n        : null;\n\n    return (\n      !!s &&\n      ![\n        'unknown',\n        'unavailable',\n        'none',\n        ''\n      ].includes(\n        String(s.state)\n      )\n    );\n  };\n\n\n  const stateOf = (\n    id,\n    fallback = '—'\n  ) =>\n    validState(id)\n      ? states[id].state\n      : fallback;\n\n\n  const numberOf = (\n    id,\n    fallback = 0\n  ) => {\n\n    if (!validState(id)) {\n      return fallback;\n    }\n\n    const v =\n      Number.parseFloat(\n        states[id].state\n      );\n\n    return Number.isFinite(v)\n      ? v\n      : fallback;\n  };\n\n\n  const isOn = (id) =>\n    !!id &&\n    states[id]?.state === 'on';\n\n\n  const clamp = (\n    v,\n    min,\n    max\n  ) =>\n    Math.min(\n      Math.max(\n        Number(v) || 0,\n        min\n      ),\n      max\n    );\n\n\n  const fmtEnergy = (v) =>\n    `${Math.max(\n      0,\n      Number(v) || 0\n    ).toFixed(2)} kWh`;\n\n\n  const fmtEuro = (v) =>\n    `${Number(\n      v || 0\n    ).toFixed(2)} €`;\n\n\n  const fmtPrice = (v) =>\n    Number.isFinite(\n      Number(v)\n    )\n      ? `${Number(v).toFixed(4)} €/kWh`\n      : '—';\n\n\n  const fmtPower = (v) => {\n\n    const x =\n      Math.max(\n        0,\n        Number(v) || 0\n      );\n\n    return x >= 1000\n      ? `${(x / 1000).toFixed(2)} kW`\n      : `${Math.round(x)} W`;\n  };\n\n\n  /* ==========================================================\n     REGISTRE CENTRAL DES ENTITÉS\n     FOXCAT ENERGY V1.5.0\n\n     ============================================\n     C'EST ICI QU'IL FAUT MODIFIER LES ENTITÉS\n     ============================================\n\n     Une valeur vide :\n       ''\n\n     signifie :\n       → recherche automatique de l'entité FoxCat\n\n     Une valeur renseignée :\n       '[[foxcat:legacy.sensor_xxx]]'\n\n     signifie :\n       → cette entité est prioritaire\n\n     Les anciennes entités restent en secours.\n     ========================================================== */\n\n  const ENTITIES = {\n\n\n    /* ========================================================\n       FOXCAT GLOBAL\n       ======================================================== */\n\n    foxcat: {\n\n      /* Mode EMS */\n      mode_ems:\n        '',\n\n      /* Régime tarifaire sélectionné */\n      regime_tarifaire:\n        '',\n\n      /* Régime tarifaire réellement actif */\n      regime_tarifaire_actif:\n        '',\n\n      /* HP / HC / dynamique */\n      periode_tarifaire:\n        '',\n\n      /* Prix réellement utilisé par FoxCat */\n      prix_achat_actif:\n        '',\n\n      /* AVANTAGEUX / NORMAL / ÉLEVÉ */\n      statut_prix:\n        '',\n\n      /* Fenêtre autorisation machines */\n      fenetre_machines:\n        '',\n\n      /* Machine protégée active */\n      machine_protegee_active:\n        '',\n\n      /* Délestage haute consommation */\n      delestage_haute_consommation_actif:\n        '',\n\n      /* État du délestage */\n      statut_delestage_haute_consommation:\n        '',\n\n      /* Comptabilité globale maison */\n      consommation_maison_aujourdhui:\n        '',\n\n      cout_net_maison_aujourdhui:\n        ''\n\n    },\n\n\n    /* ========================================================\n\
          \       ENTITÉS EXTÉRIEURES DE SECOURS\n       ======================================================== */\n\n    external: {\n\n      prix_luminus_fallback:\n        '[[foxcat:pricing.active_buy]]'\n\n    },\n\n\n    /* ========================================================\n       BOILER ECS\n       ======================================================== */\n\n    boiler: {\n\n      /* -------- NATIF FOXCAT -------- */\n\n      gestion:\n        '',\n\n      energie_jour:\n        '',\n\n      part_solaire_jour:\n        '',\n\n      part_reseau_jour:\n        '',\n\n      cout_jour:\n        '',\n\n      consommation_hp_jour:\n        '',\n\n      consommation_hc_jour:\n        '',\n\n      tarif_actuel:\n        '',\n\n      puissance:\n        '',\n\n      cycle:\n        '',\n\n\n      /* -------- LEGACY / SECOURS -------- */\n\n      legacy_gestion:\n        '[[foxcat:legacy.input_boolean_ems_boiler]]',\n\n      legacy_puissance:\n        '[[foxcat:boiler.power_source]]',\n\n      legacy_cycle:\n        '[[foxcat:boiler.binary_source]]',\n\n      legacy_cycle_2:\n        '[[foxcat:legacy.binary_sensor_boiler_physique]]',\n\n      legacy_energie:\n        '[[foxcat:legacy.sensor_boiler_energy_daily]]',\n\n      legacy_cout:\n        '[[foxcat:legacy.sensor_boiler_energy_daily_cost]]',\n\n      legacy_hc:\n        '[[foxcat:legacy.sensor_boiler_puissance_hc_energy]]',\n\n      legacy_hp:\n        '[[foxcat:legacy.sensor_boiler_puissance_hp_energy]]'\n\n    },\n\n\n    /* ========================================================\n       LAVE-LINGE\n       ======================================================== */\n\n    lave_linge: {\n\n      /* -------- NATIF FOXCAT -------- */\n\n      gestion:\n        '',\n\n      energie_jour:\n        '',\n\n      part_solaire_jour:\n        '',\n\n      part_reseau_jour:\n        '',\n\n      cout_jour:\n        '',\n\n      consommation_hp_jour:\n        '',\n\n      consommation_hc_jour:\n        '',\n\n      tarif_actuel:\n        '',\n\n      puissance:\n        '',\n\n      cycle:\n        '',\n\n\n      /* -------- LEGACY / SECOURS -------- */\n\n      legacy_gestion:\n        '[[foxcat:legacy.input_boolean_ems_lave_linge]]',\n\n      legacy_puissance:\n        '[[foxcat:legacy.sensor_lave_linge_puissance]]',\n\n      legacy_puissance_2:\n        '[[foxcat:legacy.sensor_lave_linge_power]]',\n\n      legacy_cycle:\n        '[[foxcat:machines.washer.cycle]]',\n\n      legacy_cycle_2:\n        '[[foxcat:legacy.binary_sensor_lave_linge_en_cours]]',\n\n      legacy_energie:\n        '[[foxcat:legacy.sensor_lave_linge_energy_daily]]',\n\n      legacy_energie_2:\n        '[[foxcat:legacy.sensor_lave_linge_energie_journaliere]]',\n\n      legacy_cout:\n        '[[foxcat:legacy.sensor_lave_linge_energy_daily_cost]]',\n\n      legacy_cout_2:\n        '[[foxcat:legacy.sensor_lave_linge_cout_journalier]]',\n\n      legacy_hc:\n        '[[foxcat:legacy.sensor_lave_linge_puissance_hc_energy]]',\n\n      legacy_hc_2:\n        '[[foxcat:legacy.sensor_lave_linge_hc_energy]]',\n\n      legacy_hp:\n        '[[foxcat:legacy.sensor_lave_linge_puissance_hp_energy]]',\n\n      legacy_hp_2:\n        '[[foxcat:legacy.sensor_lave_linge_hp_energy]]'\n\n    },\n\n\n    /* ========================================================\n       SÈCHE-LINGE\n       ======================================================== */\n\n    seche_linge: {\n\n      /* -------- NATIF FOXCAT -------- */\n\n      gestion:\n        '',\n\n      energie_jour:\n        '',\n\n      part_solaire_jour:\n        '',\n\n      part_reseau_jour:\n        '',\n\n      cout_jour:\n        '',\n\n      consommation_hp_jour:\n        '',\n\n      consommation_hc_jour:\n        '',\n\n      tarif_actuel:\n        '',\n\n      puissance:\n        '',\n\n      cycle:\n        '',\n\n\n      /* -------- LEGACY / SECOURS -------- */\n\n      legacy_gestion:\n        '[[foxcat:legacy.input_boolean_ems_seche_linge]]',\n\n      legacy_puissance:\n        '[[foxcat:legacy.sensor_seche_linge_puissance]]',\n\n      legacy_puissance_2:\n\
          \        '[[foxcat:legacy.sensor_seche_linge_power]]',\n\n      legacy_cycle:\n        '[[foxcat:machines.dryer.cycle]]',\n\n      legacy_cycle_2:\n        '[[foxcat:legacy.binary_sensor_seche_linge_en_cours]]',\n\n      legacy_energie:\n        '[[foxcat:legacy.sensor_seche_linge_energy_daily]]',\n\n      legacy_energie_2:\n        '[[foxcat:legacy.sensor_seche_linge_energie_journaliere]]',\n\n      legacy_cout:\n        '[[foxcat:legacy.sensor_seche_linge_energy_daily_cost]]',\n\n      legacy_cout_2:\n        '[[foxcat:legacy.sensor_seche_linge_cout_journalier]]',\n\n      legacy_hc:\n        '[[foxcat:legacy.sensor_seche_linge_puissance_hc_energy]]',\n\n      legacy_hc_2:\n        '[[foxcat:legacy.sensor_seche_linge_hc_energy]]',\n\n      legacy_hp:\n        '[[foxcat:legacy.sensor_seche_linge_puissance_hp_energy]]',\n\n      legacy_hp_2:\n        '[[foxcat:legacy.sensor_seche_linge_hp_energy]]'\n\n    },\n\n\n    /* ========================================================\n       LAVE-VAISSELLE\n       ======================================================== */\n\n    lave_vaisselle: {\n\n      /* -------- NATIF FOXCAT -------- */\n\n      gestion:\n        '',\n\n      energie_jour:\n        '',\n\n      part_solaire_jour:\n        '',\n\n      part_reseau_jour:\n        '',\n\n      cout_jour:\n        '',\n\n      consommation_hp_jour:\n        '',\n\n      consommation_hc_jour:\n        '',\n\n      tarif_actuel:\n        '',\n\n      puissance:\n        '',\n\n      cycle:\n        '',\n\n\n      /* -------- LEGACY / SECOURS -------- */\n\n      legacy_gestion:\n        '[[foxcat:legacy.input_boolean_ems_lave_vaisselle]]',\n\n      legacy_puissance:\n        '[[foxcat:legacy.sensor_lave_vaisselle_puissance]]',\n\n      legacy_puissance_2:\n        '[[foxcat:legacy.sensor_lave_vaisselle_power]]',\n\n      legacy_cycle:\n        '[[foxcat:machines.dishwasher.cycle]]',\n\n      legacy_cycle_2:\n        '[[foxcat:legacy.binary_sensor_lave_vaisselle_en_cours]]',\n\n      legacy_energie:\n        '[[foxcat:legacy.sensor_lave_vaisselle_energy_daily]]',\n\n      legacy_energie_2:\n        '[[foxcat:legacy.sensor_lave_vaisselle_energie_journaliere]]',\n\n      legacy_cout:\n        '[[foxcat:legacy.sensor_lave_vaisselle_energy_daily_cost]]',\n\n      legacy_cout_2:\n        '[[foxcat:legacy.sensor_lave_vaisselle_cout_journalier]]',\n\n      legacy_hc:\n        '[[foxcat:legacy.sensor_lave_vaisselle_puissance_hc_energy]]',\n\n      legacy_hc_2:\n        '[[foxcat:legacy.sensor_lave_vaisselle_hc_energy]]',\n\n      legacy_hp:\n        '[[foxcat:legacy.sensor_lave_vaisselle_puissance_hp_energy]]',\n\n      legacy_hp_2:\n        '[[foxcat:legacy.sensor_lave_vaisselle_hp_energy]]'\n\n    }\n\n  };\n\n\n  /* ==========================================================\n     OUTILS DU REGISTRE\n     ========================================================== */\n\n  const entityList = (\n    ...values\n  ) =>\n    values\n      .flat(Infinity)\n      .filter(\n        (id) =>\n          typeof id === 'string'\n          &&\n          id.trim() !== ''\n      );\n\n\n  const firstExisting = (\n    ...values\n  ) =>\n    entityList(\n      ...values\n    )\n      .find(\n        (id) =>\n          !!states[id]\n      )\n    ||\n    null;\n\n\n  /* ==========================================================\n     RECHERCHE AUTOMATIQUE\n     ========================================================== */\n\n  const entityText = (id) => {\n\n    const s =\n      states[id];\n\n    return norm(\n      `${id} ${s?.attributes?.friendly_name || ''}`\n    );\n  };\n\n\n  const findEntity = (\n    domain,\n    requiredWords = [],\n    candidates = [],\n    rejectedWords = []\n  ) => {\n\n    for (\n      const id\n      of candidates\n    ) {\n\n      if (\n        states[id]\n      ) {\n        return id;\n      }\n    }\n\n\n    const wanted =\n      requiredWords\n        .map(norm)\n        .filter(Boolean);\n\n\n    const rejected =\n      rejectedWords\n        .map(norm)\n        .filter(Boolean);\n\n\n    return (\n      Object.keys(states)\n\
          \n        .filter(\n          (id) =>\n            id.startsWith(\n              `${domain}.`\n            )\n        )\n\n        .find(\n          (id) => {\n\n            const text =\n              entityText(id);\n\n\n            return (\n              wanted.every(\n                (w) =>\n                  text.includes(w)\n              )\n              &&\n              !rejected.some(\n                (w) =>\n                  text.includes(w)\n              )\n            );\n          }\n        )\n      ||\n      null\n    );\n  };\n\n\n  const findFox = (\n    domain,\n    requiredWords = [],\n    candidates = [],\n    rejectedWords = []\n  ) => {\n\n    /*\n     * 1 — Registre prioritaire.\n     */\n\n    for (\n      const id\n      of candidates\n    ) {\n\n      if (\n        states[id]\n      ) {\n        return id;\n      }\n    }\n\n\n    /*\n     * 2 — Recherche automatique FoxCat.\n     */\n\n    const wanted =\n      requiredWords\n        .map(norm)\n        .filter(Boolean);\n\n\n    const rejected =\n      rejectedWords\n        .map(norm)\n        .filter(Boolean);\n\n\n    return (\n      Object.keys(states)\n\n        .filter(\n          (id) =>\n            id.startsWith(\n              `${domain}.`\n            )\n        )\n\n        .find(\n          (id) => {\n\n            const text =\n              entityText(id);\n\n\n            const fox =\n              text.includes(\n                'foxcat energy'\n              )\n              ||\n              norm(id).includes(\n                'foxcat energy'\n              );\n\n\n            return (\n              fox\n              &&\n              wanted.every(\n                (w) =>\n                  text.includes(w)\n              )\n              &&\n              !rejected.some(\n                (w) =>\n                  text.includes(w)\n              )\n            );\n          }\n        )\n      ||\n      null\n    );\n  };\n\n\n  const findPowerSensor = (\n    deviceWords = [],\n    candidates = []\n  ) => {\n\n    /*\n     * Registre / anciennes entités prioritaires.\n     */\n\n    for (\n      const id\n      of candidates\n    ) {\n\n      if (\n        states[id]\n      ) {\n        return id;\n      }\n    }\n\n\n    const wanted =\n      deviceWords\n        .map(norm)\n        .filter(Boolean);\n\n\n    return (\n      Object.keys(states)\n\n        .filter(\n          (id) =>\n            id.startsWith(\n              'sensor.'\n            )\n        )\n\n        .find(\n          (id) => {\n\n            const s =\n              states[id];\n\n\n            const text =\n              entityText(id);\n\n\n            const unit =\n              s?.attributes?.unit_of_measurement\n              ||\n              '';\n\n\n            const cls =\n              s?.attributes?.device_class\n              ||\n              '';\n\n\n            return (\n              wanted.some(\n                (w) =>\n                  text.includes(w)\n              )\n              &&\n              (\n                cls === 'power'\n                ||\n                unit === 'W'\n                ||\n                unit === 'kW'\n              )\n            );\n          }\n        )\n      ||\n      null\n    );\n  };\n\n\n  /* ==========================================================\n     GESTION FOXCAT\n     ========================================================== */\n\n  const management = (\n    words,\n    legacy = null,\n    preferred = null\n  ) => {\n\n    /*\n     * 1 — Entité renseignée dans le registre.\n     * 2 — Détection automatique FoxCat.\n     */\n\n    const native =\n      findFox(\n        'switch',\n        words,\n        entityList(\n          preferred\n        )\n      );\n\n\n    if (\n      native\n    ) {\n\n      return {\n\n        entity:\n          native,\n\n        enabled:\n          isOn(native),\n\n        native:\n          true\n      };\n    }\n\n\n    /*\n     * Secours legacy.\n     */\n\n    const legacyEntity =\n      firstExisting(\n        legacy\n      );\n\n\n\
          \    if (\n      legacyEntity\n    ) {\n\n      return {\n\n        entity:\n          legacyEntity,\n\n        enabled:\n          isOn(\n            legacyEntity\n          ),\n\n        native:\n          false\n      };\n    }\n\n\n    return {\n\n      entity:\n        null,\n\n      enabled:\n        false,\n\n      native:\n        false\n    };\n  };\n\n\n  /* ==========================================================\n     CONTEXTE FOXCAT\n     ========================================================== */\n\n  const modeEntity =\n    findFox(\n      'select',\n      [\n        'mode',\n        'ems'\n      ],\n      entityList(\n        ENTITIES.foxcat.mode_ems\n      )\n    );\n\n\n  const tariffEntity =\n    findFox(\n      'select',\n      [\n        'regime',\n        'tarifaire'\n      ],\n      entityList(\n        ENTITIES.foxcat.regime_tarifaire\n      )\n    );\n\n\n  const tariffActiveEntity =\n    findFox(\n      'sensor',\n      [\n        'regime',\n        'tarifaire',\n        'actif'\n      ],\n      entityList(\n        ENTITIES.foxcat.regime_tarifaire_actif\n      )\n    );\n\n\n  const periodEntity =\n    findFox(\n      'sensor',\n      [\n        'periode',\n        'tarifaire'\n      ],\n      entityList(\n        ENTITIES.foxcat.periode_tarifaire\n      )\n    );\n\n\n  const activePriceEntity =\n    findFox(\n      'sensor',\n      [\n        'prix',\n        'achat',\n        'actif'\n      ],\n      entityList(\n        ENTITIES.foxcat.prix_achat_actif\n      )\n    );\n\n\n  const priceStatusEntity =\n    findFox(\n      'sensor',\n      [\n        'statut',\n        'prix'\n      ],\n      entityList(\n        ENTITIES.foxcat.statut_prix\n      )\n    );\n\n\n  const machineWindowEntity =\n    findFox(\n      'binary_sensor',\n      [\n        'fenetre',\n        'machines'\n      ],\n      entityList(\n        ENTITIES.foxcat.fenetre_machines\n      )\n    );\n\n\n  const protectedMachineEntity =\n    findFox(\n      'binary_sensor',\n      [\n        'machine',\n        'protegee',\n        'active'\n      ],\n      entityList(\n        ENTITIES.foxcat.machine_protegee_active\n      )\n    );\n\n\n  const highLoadEntity =\n    findFox(\n      'binary_sensor',\n      [\n        'delestage',\n        'haute',\n        'consommation',\n        'actif'\n      ],\n      entityList(\n        ENTITIES.foxcat.delestage_haute_consommation_actif\n      )\n    );\n\n\n  const loadSheddingStatusEntity =\n    findFox(\n      'sensor',\n      [\n        'statut',\n        'delestage',\n        'haute',\n        'consommation'\n      ],\n      entityList(\n        ENTITIES.foxcat.statut_delestage_haute_consommation\n      )\n    );\n\n\n  const mode =\n    stateOf(\n      modeEntity,\n      '—'\n    );\n\n\n  const tariff =\n    stateOf(\n      tariffEntity,\n      stateOf(\n        tariffActiveEntity,\n        '—'\n      )\n    );\n\n\n  const tariffPeriod =\n    stateOf(\n      periodEntity,\n      '—'\n    );\n\n\n  const activePrice =\n    numberOf(\n      activePriceEntity,\n      numberOf(\n        ENTITIES.external.prix_luminus_fallback,\n        0\n      )\n    );\n\n\n  const priceStatus =\n    stateOf(\n      priceStatusEntity,\n      '—'\n    );\n\n\n  const machineWindow =\n    isOn(\n      machineWindowEntity\n    );\n\n\n  const protectedMachine =\n    isOn(\n      protectedMachineEntity\n    );\n\n\n  const highLoad =\n    isOn(\n      highLoadEntity\n    );\n\n\n  const loadSheddingStatus =\n    stateOf(\n      loadSheddingStatusEntity,\n      highLoad\n        ? 'ACTIF'\n        : 'NORMAL'\n    );\n\n\n  /* ==========================================================\n     BILAN MAISON FOXCAT\n     ========================================================== */\n\n  const houseAccountingEntity =\n    findFox(\n      'sensor',\n      [\n        'maison',\n        'consommation',\n        'aujourd'\n      ],\n      entityList(\n        ENTITIES.foxcat.consommation_maison_aujourdhui\n      )\n    );\n\n\n  const houseCostEntity =\n    findFox(\n      'sensor',\n      [\n        'maison',\n\
          \        'cout',\n        'net',\n        'aujourd'\n      ],\n      entityList(\n        ENTITIES.foxcat.cout_net_maison_aujourdhui\n      )\n    );\n\n\n  const totalHouseEnergy =\n    numberOf(\n      houseAccountingEntity,\n      0\n    );\n\n\n  const totalHouseCost =\n    numberOf(\n      houseCostEntity,\n      0\n    );\n\n\n  /* ==========================================================\n     CONFIGURATION DES APPAREILS\n     ========================================================== */\n\n  const devices = [\n\n\n    /* ========================================================\n       BOILER\n       ======================================================== */\n\n    {\n\n      id:\n        'boiler',\n\n      registry:\n        ENTITIES.boiler,\n\n      nativeNames: [\n        'chauffe eau',\n        'boiler'\n      ],\n\n      name:\n        'Boiler ECS',\n\n      nativeLabel:\n        'Chauffe-eau',\n\n      icon:\n        'mdi:water-boiler',\n\n      color:\n        '#ff922b',\n\n\n      management:\n        management(\n          [\n            'boiler',\n            'gere',\n            'foxcat'\n          ],\n          ENTITIES.boiler.legacy_gestion,\n          ENTITIES.boiler.gestion\n        ),\n\n\n      powerCandidates:\n        entityList(\n          ENTITIES.boiler.puissance,\n          ENTITIES.boiler.legacy_puissance\n        ),\n\n\n      cycleCandidates:\n        entityList(\n          ENTITIES.boiler.cycle,\n          ENTITIES.boiler.legacy_cycle_2,\n          ENTITIES.boiler.legacy_cycle\n        ),\n\n\n      legacy: {\n\n        energy:\n          entityList(\n            ENTITIES.boiler.legacy_energie\n          ),\n\n        cost:\n          entityList(\n            ENTITIES.boiler.legacy_cout\n          ),\n\n        hc:\n          entityList(\n            ENTITIES.boiler.legacy_hc\n          ),\n\n        hp:\n          entityList(\n            ENTITIES.boiler.legacy_hp\n          )\n      }\n\n    },\n\n\n    /* ========================================================\n       LAVE-LINGE\n       ======================================================== */\n\n    {\n\n      id:\n        'washer',\n\n      registry:\n        ENTITIES.lave_linge,\n\n      nativeNames: [\n        'lave linge',\n        'washer'\n      ],\n\n      name:\n        'Lave-linge',\n\n      nativeLabel:\n        'Lave-linge',\n\n      icon:\n        'mdi:washing-machine',\n\n      color:\n        '#19d8ff',\n\n\n      management:\n        management(\n          [\n            'gestion',\n            'lave linge'\n          ],\n          ENTITIES.lave_linge.legacy_gestion,\n          ENTITIES.lave_linge.gestion\n        ),\n\n\n      powerCandidates:\n        entityList(\n          ENTITIES.lave_linge.puissance,\n          ENTITIES.lave_linge.legacy_puissance,\n          ENTITIES.lave_linge.legacy_puissance_2\n        ),\n\n\n      cycleCandidates:\n        entityList(\n          ENTITIES.lave_linge.cycle,\n          ENTITIES.lave_linge.legacy_cycle,\n          ENTITIES.lave_linge.legacy_cycle_2\n        ),\n\n\n      legacy: {\n\n        energy:\n          entityList(\n            ENTITIES.lave_linge.legacy_energie,\n            ENTITIES.lave_linge.legacy_energie_2\n          ),\n\n        cost:\n          entityList(\n            ENTITIES.lave_linge.legacy_cout,\n            ENTITIES.lave_linge.legacy_cout_2\n          ),\n\n        hc:\n          entityList(\n            ENTITIES.lave_linge.legacy_hc,\n            ENTITIES.lave_linge.legacy_hc_2\n          ),\n\n        hp:\n          entityList(\n            ENTITIES.lave_linge.legacy_hp,\n            ENTITIES.lave_linge.legacy_hp_2\n          )\n      }\n\n    },\n\n\n    /* ========================================================\n       SÈCHE-LINGE\n       ======================================================== */\n\n    {\n\n      id:\n        'dryer',\n\n      registry:\n        ENTITIES.seche_linge,\n\n      nativeNames: [\n        'seche linge',\n        'dryer'\n      ],\n\n      name:\n        'Sèche-linge',\n\n      nativeLabel:\n        'Sèche-linge',\n\
          \n      icon:\n        'mdi:tumble-dryer',\n\n      color:\n        '#a78bfa',\n\n\n      management:\n        management(\n          [\n            'gestion',\n            'seche linge'\n          ],\n          ENTITIES.seche_linge.legacy_gestion,\n          ENTITIES.seche_linge.gestion\n        ),\n\n\n      powerCandidates:\n        entityList(\n          ENTITIES.seche_linge.puissance,\n          ENTITIES.seche_linge.legacy_puissance,\n          ENTITIES.seche_linge.legacy_puissance_2\n        ),\n\n\n      cycleCandidates:\n        entityList(\n          ENTITIES.seche_linge.cycle,\n          ENTITIES.seche_linge.legacy_cycle,\n          ENTITIES.seche_linge.legacy_cycle_2\n        ),\n\n\n      legacy: {\n\n        energy:\n          entityList(\n            ENTITIES.seche_linge.legacy_energie,\n            ENTITIES.seche_linge.legacy_energie_2\n          ),\n\n        cost:\n          entityList(\n            ENTITIES.seche_linge.legacy_cout,\n            ENTITIES.seche_linge.legacy_cout_2\n          ),\n\n        hc:\n          entityList(\n            ENTITIES.seche_linge.legacy_hc,\n            ENTITIES.seche_linge.legacy_hc_2\n          ),\n\n        hp:\n          entityList(\n            ENTITIES.seche_linge.legacy_hp,\n            ENTITIES.seche_linge.legacy_hp_2\n          )\n      }\n\n    },\n\n\n    /* ========================================================\n       LAVE-VAISSELLE\n       ======================================================== */\n\n    {\n\n      id:\n        'dishwasher',\n\n      registry:\n        ENTITIES.lave_vaisselle,\n\n      nativeNames: [\n        'lave vaisselle',\n        'dishwasher'\n      ],\n\n      name:\n        'Lave-vaisselle',\n\n      nativeLabel:\n        'Lave-vaisselle',\n\n      icon:\n        'mdi:dishwasher',\n\n      color:\n        '#35e59d',\n\n\n      management:\n        management(\n          [\n            'gestion',\n            'lave vaisselle'\n          ],\n          ENTITIES.lave_vaisselle.legacy_gestion,\n          ENTITIES.lave_vaisselle.gestion\n        ),\n\n\n      powerCandidates:\n        entityList(\n          ENTITIES.lave_vaisselle.puissance,\n          ENTITIES.lave_vaisselle.legacy_puissance,\n          ENTITIES.lave_vaisselle.legacy_puissance_2\n        ),\n\n\n      cycleCandidates:\n        entityList(\n          ENTITIES.lave_vaisselle.cycle,\n          ENTITIES.lave_vaisselle.legacy_cycle,\n          ENTITIES.lave_vaisselle.legacy_cycle_2\n        ),\n\n\n      legacy: {\n\n        energy:\n          entityList(\n            ENTITIES.lave_vaisselle.legacy_energie,\n            ENTITIES.lave_vaisselle.legacy_energie_2\n          ),\n\n        cost:\n          entityList(\n            ENTITIES.lave_vaisselle.legacy_cout,\n            ENTITIES.lave_vaisselle.legacy_cout_2\n          ),\n\n        hc:\n          entityList(\n            ENTITIES.lave_vaisselle.legacy_hc,\n            ENTITIES.lave_vaisselle.legacy_hc_2\n          ),\n\n        hp:\n          entityList(\n            ENTITIES.lave_vaisselle.legacy_hp,\n            ENTITIES.lave_vaisselle.legacy_hp_2\n          )\n      }\n\n    }\n\n  ];\n\n\n  /* ==========================================================\n     CAPTEURS NATIFS FOXCAT PAR APPAREIL\n     ========================================================== */\n\n  const nativeApplianceSensor = (\n    device,\n    metricWords,\n    rejected = []\n  ) => {\n\n    for (\n      const deviceWord\n      of device.nativeNames\n    ) {\n\n      const id =\n        findFox(\n          'sensor',\n          [\n            deviceWord,\n            ...metricWords\n          ],\n          [],\n          rejected\n        );\n\n\n      if (\n        id\n      ) {\n        return id;\n      }\n    }\n\n\n    return null;\n  };\n\n\n  const legacyCandidate = (\n    ids = []\n  ) =>\n    ids.find(\n      (id) =>\n        states[id]\n    )\n    ||\n    null;\n\n\n  /* ==========================================================\n     CONSTRUCTION DES DONNÉES\n     ========================================================== */\n\
          \n  const activeDevices =\n    devices\n\n      /* ======================================================\n         AFFICHAGE UNIQUEMENT SI GÉRÉ PAR FOXCAT\n         ====================================================== */\n\n      .filter(\n        (device) =>\n          device.management.enabled\n      )\n\n\n      .map(\n        (device) => {\n\n\n          /* ==================================================\n             ÉNERGIE JOUR\n             ================================================== */\n\n          const energyEntity =\n            firstExisting(\n              device.registry.energie_jour\n            )\n            ||\n            nativeApplianceSensor(\n              device,\n              [\n                'energie',\n                'aujourd'\n              ]\n            )\n            ||\n            legacyCandidate(\n              device.legacy.energy\n            );\n\n\n          /* ==================================================\n             PART SOLAIRE\n             ================================================== */\n\n          const solarEntity =\n            firstExisting(\n              device.registry.part_solaire_jour\n            )\n            ||\n            nativeApplianceSensor(\n              device,\n              [\n                'part',\n                'solaire',\n                'aujourd'\n              ]\n            );\n\n\n          /* ==================================================\n             PART RÉSEAU\n             ================================================== */\n\n          const gridEntity =\n            firstExisting(\n              device.registry.part_reseau_jour\n            )\n            ||\n            nativeApplianceSensor(\n              device,\n              [\n                'part',\n                'reseau',\n                'aujourd'\n              ]\n            );\n\n\n          /* ==================================================\n             COÛT JOUR\n             ================================================== */\n\n          const costEntity =\n            firstExisting(\n              device.registry.cout_jour\n            )\n            ||\n            nativeApplianceSensor(\n              device,\n              [\n                'cout',\n                'aujourd'\n              ]\n            )\n            ||\n            legacyCandidate(\n              device.legacy.cost\n            );\n\n\n          /* ==================================================\n             HP\n             ================================================== */\n\n          const hpEntity =\n            firstExisting(\n              device.registry.consommation_hp_jour\n            )\n            ||\n            nativeApplianceSensor(\n              device,\n              [\n                'consommation',\n                'hp',\n                'aujourd'\n              ]\n            )\n            ||\n            legacyCandidate(\n              device.legacy.hp\n            );\n\n\n          /* ==================================================\n             HC\n             ================================================== */\n\n          const hcEntity =\n            firstExisting(\n              device.registry.consommation_hc_jour\n            )\n            ||\n            nativeApplianceSensor(\n              device,\n              [\n                'consommation',\n                'hc',\n                'aujourd'\n              ]\n            )\n            ||\n            legacyCandidate(\n              device.legacy.hc\n            );\n\n\n          /* ==================================================\n             TARIF ACTUEL APPAREIL\n             ================================================== */\n\n          const tariffNowEntity =\n            firstExisting(\n              device.registry.tarif_actuel\n            )\n            ||\n            nativeApplianceSensor(\n              device,\n              [\n                'tarif',\n                'actuel'\n              ]\n            );\n\n\n    \
          \      /* ==================================================\n             PUISSANCE\n             ================================================== */\n\n          let powerEntity =\n            null;\n\n\n          if (\n            device.id === 'boiler'\n          ) {\n\n            powerEntity =\n              findFox(\n                'sensor',\n                [\n                  'puissance',\n                  'chauffe',\n                  'eau'\n                ],\n                entityList(\n                  device.registry.puissance\n                )\n              )\n              ||\n              findPowerSensor(\n                device.nativeNames,\n                device.powerCandidates\n              );\n          }\n\n          else {\n\n            powerEntity =\n              findPowerSensor(\n                device.nativeNames,\n                device.powerCandidates\n              );\n          }\n\n\n          /* ==================================================\n             CYCLE\n             ================================================== */\n\n          let cycleEntity =\n            null;\n\n\n          if (\n            device.id === 'boiler'\n          ) {\n\n            cycleEntity =\n              findFox(\n                'binary_sensor',\n                [\n                  'boiler',\n                  'physique'\n                ],\n                entityList(\n                  device.registry.cycle\n                )\n              )\n              ||\n              device.cycleCandidates.find(\n                (id) =>\n                  states[id]\n              )\n              ||\n              null;\n          }\n\n          else {\n\n            cycleEntity =\n              device.cycleCandidates.find(\n                (id) =>\n                  states[id]\n              )\n              ||\n              null;\n          }\n\n\n          /* ==================================================\n             VALEURS\n             ================================================== */\n\n          const energy =\n            Math.max(\n              numberOf(\n                energyEntity,\n                0\n              ),\n              0\n            );\n\n\n          const solar =\n            Math.max(\n              numberOf(\n                solarEntity,\n                0\n              ),\n              0\n            );\n\n\n          const grid =\n            Math.max(\n              numberOf(\n                gridEntity,\n                Math.max(\n                  energy - solar,\n                  0\n                )\n              ),\n              0\n            );\n\n\n          const hp =\n            Math.max(\n              numberOf(\n                hpEntity,\n                0\n              ),\n              0\n            );\n\n\n          const hc =\n            Math.max(\n              numberOf(\n                hcEntity,\n                0\n              ),\n              0\n            );\n\n\n          /*\n           * Si FoxCat possède un vrai coût :\n           * → on l'utilise.\n           *\n           * Sinon :\n           * → secours énergie × prix actif.\n           */\n\n          const cost =\n            Math.max(\n              numberOf(\n                costEntity,\n                energy *\n                Math.max(\n                  activePrice,\n                  0\n                )\n              ),\n              0\n            );\n\n\n          const power =\n            Math.max(\n              numberOf(\n                powerEntity,\n                0\n              ),\n              0\n            );\n\n\n          const tariffNow =\n            stateOf(\n              tariffNowEntity,\n              tariffPeriod\n            );\n\n\n          const running =\n            (\n              cycleEntity\n              &&\n              isOn(\n                cycleEntity\n              )\n            )\n            ||\n            power > 20;\n\n\n          const tariffTotal =\n            hp +\n            hc;\n\n\
          \n          const partHC =\n            tariffTotal > 0\n              ? clamp(\n                  (\n                    hc /\n                    tariffTotal\n                  ) * 100,\n                  0,\n                  100\n                )\n              : 0;\n\n\n          const partHP =\n            tariffTotal > 0\n              ? clamp(\n                  (\n                    hp /\n                    tariffTotal\n                  ) * 100,\n                  0,\n                  100\n                )\n              : 0;\n\n\n          const solarShare =\n            energy > 0\n              ? clamp(\n                  (\n                    solar /\n                    energy\n                  ) * 100,\n                  0,\n                  100\n                )\n              : 0;\n\n\n          const gridShare =\n            energy > 0\n              ? clamp(\n                  (\n                    grid /\n                    energy\n                  ) * 100,\n                  0,\n                  100\n                )\n              : 0;\n\n\n          const avgPrice =\n            energy > 0\n              ? cost / energy\n              : 0;\n\n\n          /*\n           * Détermine si la comptabilité utilisée\n           * est native FoxCat.\n           */\n\n          const nativeAccounting =\n            !!(\n              firstExisting(\n                device.registry.energie_jour,\n                device.registry.part_solaire_jour,\n                device.registry.part_reseau_jour,\n                device.registry.cout_jour,\n                device.registry.consommation_hp_jour,\n                device.registry.consommation_hc_jour,\n                device.registry.tarif_actuel\n              )\n              ||\n              solarEntity\n              ||\n              gridEntity\n              ||\n              (\n                costEntity\n                &&\n                norm(\n                  costEntity\n                ).includes(\n                  'foxcat energy'\n                )\n              )\n            );\n\n\n          return {\n\n            ...device,\n\n            energyEntity,\n            solarEntity,\n            gridEntity,\n            costEntity,\n            hpEntity,\n            hcEntity,\n            tariffNowEntity,\n\n            powerEntity,\n            cycleEntity,\n\n            energy,\n            solar,\n            grid,\n            hp,\n            hc,\n            cost,\n            power,\n            tariffNow,\n\n            running,\n            partHC,\n            partHP,\n            solarShare,\n            gridShare,\n            avgPrice,\n            nativeAccounting\n\n          };\n        }\n      );\n\n\n  /* ==========================================================\n     TOTAUX\n     ========================================================== */\n\n  const activeEnergy =\n    activeDevices.reduce(\n      (\n        sum,\n        d\n      ) =>\n        sum +\n        d.energy,\n      0\n    );\n\n\n  const activeSolar =\n    activeDevices.reduce(\n      (\n        sum,\n        d\n      ) =>\n        sum +\n        d.solar,\n      0\n    );\n\n\n  const activeGrid =\n    activeDevices.reduce(\n      (\n        sum,\n        d\n      ) =>\n        sum +\n        d.grid,\n      0\n    );\n\n\n  const activeCost =\n    activeDevices.reduce(\n      (\n        sum,\n        d\n      ) =>\n        sum +\n        d.cost,\n      0\n    );\n\n\n  const runningCount =\n    activeDevices.filter(\n      (d) =>\n        d.running\n    ).length;\n\n\n  /* ==========================================================\n     COULEUR PRIX\n     ========================================================== */\n\n  const priceColor =\n    (() => {\n\n      const p =\n        norm(\n          priceStatus\n        );\n\n\n      if (\n        p.includes(\n          'avantage'\n        )\n        ||\n        p.includes(\n          'bas'\n        )\n        ||\n        p.includes(\n          'negatif'\n        )\n      ) {\n\n        return\
          \ '#35e59d';\n      }\n\n\n      if (\n        p.includes(\n          'eleve'\n        )\n        ||\n        p.includes(\n          'cher'\n        )\n      ) {\n\n        return '#fb7185';\n      }\n\n\n      return '#facc15';\n\n    })();\n\n\n  /* ==========================================================\n     CARTES APPAREILS\n     ========================================================== */\n\n  const cardHtml =\n    activeDevices\n\n      .map(\n        (d) => {\n\n          const stateColor =\n            d.running\n              ? '#35e59d'\n              : '#64748b';\n\n\n          const tariffColor =\n            norm(\n              d.tariffNow\n            ).includes(\n              'hp'\n            )\n              ? '#ff922b'\n              : '#19d8ff';\n\n\n          const hasSplit =\n            d.hpEntity\n            ||\n            d.hcEntity\n            ||\n            (\n              d.hp +\n              d.hc\n            ) > 0;\n\n\n          return `\n\n            <div\n              class=\"device-card\"\n              style=\"\n                --device:${d.color};\n              \"\n            >\n\n\n              <!-- HEADER APPAREIL -->\n\n              <div class=\"device-header\">\n\n\n                <div class=\"device-name-block\">\n\n\n                  <div class=\"device-icon\">\n\n                    <ha-icon\n                      icon=\"${d.icon}\">\n                    </ha-icon>\n\n                  </div>\n\n\n                  <div>\n\n                    <div class=\"device-name\">\n                      ${d.name}\n                    </div>\n\n\n                    <div class=\"native-line\">\n\n                      <span class=\"native-dot\"></span>\n\n                      ${\n                        d.management.native\n                          ? 'GESTION FOXCAT'\n                          : 'GESTION LEGACY'\n                      }\n\n                      ·\n\n                      ${\n                        d.nativeAccounting\n                          ? 'COMPTABILITÉ FOXCAT'\n                          : 'FALLBACK'\n                      }\n\n                    </div>\n\n                  </div>\n\n\n                </div>\n\n\n\n                <div\n                  class=\"running\"\n                  style=\"\n                    color:${stateColor};\n                  \"\n                >\n\n                  ${\n                    d.running\n                      ? '● EN COURS'\n                      : '○ EN ATTENTE'\n                  }\n\n                </div>\n\n\n              </div>\n\n\n\n              <!-- ÉNERGIE / COÛT -->\n\n              <div class=\"main-values\">\n\n\n                <div>\n\n                  <div class=\"small-label\">\n                    ÉNERGIE AUJOURD'HUI\n                  </div>\n\n                  <div class=\"energy-value\">\n                    ${fmtEnergy(d.energy)}\n                  </div>\n\n                </div>\n\n\n\n                <div class=\"cost-block\">\n\n                  <div class=\"small-label\">\n                    COÛT FOXCAT\n                  </div>\n\n                  <div class=\"cost-value\">\n                    ${fmtEuro(d.cost)}\n                  </div>\n\n                  <div class=\"cost-source\">\n\n                    ${\n                      d.nativeAccounting\n                        ? 'COMPTABILISÉ V1.5.0'\n                        : 'SECOURS / ESTIMÉ'\n                    }\n\n                  </div>\n\n                </div>\n\n\n              </div>\n\n\n\n              <!-- PUISSANCE -->\n\n              <div class=\"power-line\">\n\n                <span>\n                  Puissance actuelle\n                </span>\n\n                <strong>\n                  ${fmtPower(d.power)}\n                </strong>\n\n              </div>\n\n\n\n              <!-- PART SOLAIRE / RÉSEAU -->\n\n              <div class=\"source-grid\">\n\n\n                <div>\n\n                  <span class=\"solar-label\">\n                    PART SOLAIRE\n              \
          \    </span>\n\n                  <strong>\n                    ${fmtEnergy(d.solar)}\n                  </strong>\n\n                  <small>\n                    ${d.solarShare.toFixed(0)} %\n                  </small>\n\n                </div>\n\n\n\n                <div>\n\n                  <span class=\"grid-label\">\n                    PART RÉSEAU\n                  </span>\n\n                  <strong>\n                    ${fmtEnergy(d.grid)}\n                  </strong>\n\n                  <small>\n                    ${d.gridShare.toFixed(0)} %\n                  </small>\n\n                </div>\n\n\n              </div>\n\n\n\n              <div class=\"source-bar\">\n\n                <div\n                  class=\"solar-fill\"\n                  style=\"\n                    width:${d.solarShare}%;\n                  \"\n                ></div>\n\n                <div\n                  class=\"grid-fill\"\n                  style=\"\n                    width:${d.gridShare}%;\n                  \"\n                ></div>\n\n              </div>\n\n\n\n              <!-- HP / HC -->\n\n              ${\n                hasSplit\n                  ? `\n\n                    <div class=\"tariff-title\">\n                      RÉPARTITION HP / HC\n                    </div>\n\n\n                    <div class=\"tariff-values\">\n\n\n                      <div>\n\n                        <span class=\"hc-label\">\n                          HEURES CREUSES\n                        </span>\n\n                        <strong>\n                          ${fmtEnergy(d.hc)}\n                        </strong>\n\n                        <small>\n                          ${d.partHC.toFixed(1)} %\n                        </small>\n\n                      </div>\n\n\n\n                      <div>\n\n                        <span class=\"hp-label\">\n                          HEURES PLEINES\n                        </span>\n\n                        <strong>\n                          ${fmtEnergy(d.hp)}\n                        </strong>\n\n                        <small>\n                          ${d.partHP.toFixed(1)} %\n                        </small>\n\n                      </div>\n\n\n                    </div>\n\n\n\n                    <div class=\"split-bar\">\n\n                      <div\n                        class=\"hc-fill\"\n                        style=\"\n                          width:${d.partHC}%;\n                        \"\n                      ></div>\n\n                      <div\n                        class=\"hp-fill\"\n                        style=\"\n                          width:${d.partHP}%;\n                        \"\n                      ></div>\n\n                    </div>\n\n                  `\n                  : `\n\n                    <div class=\"tariff-unavailable\">\n                      Aucune répartition HP / HC enregistrée aujourd'hui\n                    </div>\n\n                  `\n              }\n\n\n\n              <!-- FOOTER APPAREIL -->\n\n              <div class=\"device-footer\">\n\n\n                <div>\n\n                  <span>\n                    TARIF APPAREIL\n                  </span>\n\n                  <strong\n                    style=\"\n                      color:${tariffColor};\n                    \"\n                  >\n                    ${d.tariffNow}\n                  </strong>\n\n                </div>\n\n\n\n                <div>\n\n                  <span>\n                    PRIX MOYEN\n                  </span>\n\n                  <strong>\n\n                    ${\n                      d.energy > 0\n                        ? `${d.avgPrice.toFixed(3)} €/kWh`\n                        : '—'\n                    }\n\n                  </strong>\n\n                </div>\n\n\n              </div>\n\n\n            </div>\n\n          `;\n        }\n      )\n\n      .join('');\n\n\n  /* =========================