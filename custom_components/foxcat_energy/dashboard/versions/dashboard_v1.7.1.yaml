  - type: grid
    cards:
    - type: heading
      heading: Courbe Luminus Dynamic
      heading_style: title
      icon: mdi:chart-areaspline
    - type: custom:apexcharts-card
      update_interval: 1min
      graph_span: 2d
      span:
        start: day
      now:
        show: true
        label: Maintenant
      header:
        show: true
        title: Prix achat & réinjection
        show_states: false
      yaxis:
      - decimals: 3
      apex_config:
        chart:
          height: 350
          toolbar:
            show: true
          zoom:
            enabled: true
        legend:
          show: true
          position: bottom
        grid:
          borderColor: rgba(255,255,255,0.08)
        stroke:
          curve: smooth
          dashArray:
          - 0
          - 6
          - 5
          - 0
        markers:
          size:
          - 0
          - 0
          - 0
          - 7
          strokeWidth: 3
        xaxis:
          type: datetime
          labels:
            datetimeUTC: false
        tooltip:
          shared: true
          x:
            format: dd/MM HH:mm
      series:
      - entity: sensor.luminus_luminus_dynamic_wallonia_prix_actuel
        name: Achat
        type: area
        unit: €/kWh
        stroke_width: 3
        opacity: 0.18
        float_precision: 3
        show:
          in_header: false
          extremas: true
        data_generator: 'const rows=[...(entity.attributes.today||[]),...(entity.attributes.tomorrow||[])];

          return rows.filter(r=>r.start!=null&&Number.isFinite(Number(r.all_in))).map(r=>[new Date(r.start).getTime(),Number(r.all_in)]);

          '
      - entity: sensor.luminus_luminus_dynamic_wallonia_prix_actuel
        name: Tendance
        type: line
        unit: €/kWh
        stroke_width: 2
        opacity: 0.75
        float_precision: 3
        show:
          in_header: false
        data_generator: "const rows=[...(entity.attributes.today||[]),...(entity.attributes.tomorrow||[])]\n  .filter(r=>r.start!=null&&Number.isFinite(Number(r.all_in))).map(r=>({time:new Date(r.start).getTime(),price:Number(r.all_in)})).sort((a,b)=>a.time-b.time);\nreturn rows.map((r,i)=>{const w=rows.slice(Math.max(0,i-1),Math.min(rows.length,i+2));return [r.time,w.reduce((s,x)=>s+x.price,0)/w.length];});\n"
      - entity: sensor.luminus_luminus_dynamic_wallonia_prix_d_injection
        name: Réinjection
        type: line
        unit: €/kWh
        stroke_width: 2
        opacity: 0.75
        float_precision: 3
        show:
          in_header: false
        data_generator: 'const rows=[...(entity.attributes.today||[]),...(entity.attributes.tomorrow||[])];

          return rows.filter(r=>r.start!=null&&Number.isFinite(Number(r.injection))).map(r=>[new Date(r.start).getTime(),Number(r.injection)]);

          '
      - entity: sensor.luminus_luminus_dynamic_wallonia_prix_actuel
        name: Maintenant
        type: line
        unit: €/kWh
        stroke_width: 0
        opacity: 1
        float_precision: 3
        show:
          in_header: false
        data_generator: 'const value=Number(entity.state);if(!Number.isFinite(value))return [];return [[Date.now(),value]];

          '
