            panel: "[[[\n  const running =\n    states['[[foxcat:legacy.binary_sensor_lave_vaisselle]]']?.state === 'on';\n\n  const cycle =\n    states['[[foxcat:machines.dishwasher.cycle]]']?.state === 'on';\n\n  const socket =\n    states['[[foxcat:machines.dishwasher.switch]]']?.state === 'on';\n\n  const power =\n    Math.max(\n      parseFloat(\n        states['[[foxcat:legacy.sensor_lave_vaisselle_puissance]]']?.state || 0\n      ),\n      0\n    );\n\n  let color = '#64748b';\n  let status = 'ARRÊT';\n\n  if (cycle) {\n    color = '#34d399';\n    status = 'CYCLE EN COURS';\n  }\n  else if (running) {\n    color = '#34d399';\n    status = 'EN MARCHE';\n  }\n  else if (socket) {\n    color = '#facc15';\n    status = 'PRÊT';\n  }\n\n  return `\n    <div class=\"app-panel\">\n\n      <div class=\"app-icon dishwasher-icon\">\n        \U0001F37D️\n      </div>\n\n      <div\n        class=\"app-status\"\n        style=\"color:${color};\"\n      >\n\n        <span\n          class=\"status-dot\"\n          style=\"\n            background:${color};\n            box-shadow:${\n              running || cycle\n                ? `0 0 9px ${color}`\n                : 'none'\n            };\n          \"\n        ></span>\n\n        <span>\n          ${status}\n        </span>\n\n      </div>\n\n      <div class=\"app-title\">\n        Lave-vaisselle\n      </div>\n\n      <div class=\"app-subtitle\">\n        Charge cyclique EMS\n      </div>\n\n      <div class=\"power-box\">\n\n        <div class=\"power-value\">\n          ${Math.round(power)}\n          <span>W</span>\n        </div>\n\n        <div class=\"power-label\">\n          PUISSANCE ACTUELLE\n        </div>\n\n      </div>\n\n      <div class=\"app-detail\">\n\n        <span class=\"detail-icon\">\n          ${cycle ? '\U0001F9FC' : '✓'}\n        </span>\n\n        <span>\n          ${\n            cycle\n              ? 'Lavage en cours'\n              : 'Disponible'\n          }\n        </span>\n\n      </div>\n\n      <div class=\"socket-state\">\n\n        ${\n          socket\n            ? '⚡ Prise active'\n            : '○ Prise coupée'\n        }\n\n      </div>\n\n    </div>\n  `;\n]]]\n"
          styles:
            card:
            - height: 300px
            - padding: 0
            - border-radius: 26px
            - overflow: hidden
            - color: white
            - background: "radial-gradient(\n  circle at 100% 0%,\n  rgba(52,211,153,.15),\n  transparent 50%\n),\nlinear-gradient(\n  145deg,\n  #070b14,\n  #101827 55%,\n  #080d16\n)\n"
            - border: 1px solid rgba(52,211,153,.14)
            custom_fields:
              panel:
              - width: 100%
              - height: 100%
              - display: flex
              - justify-content: center
              - align-items: center
              - text-align: center
          extra_styles: "\n* {\n  box-sizing:border-box;\n}\n\n.app-panel {\n\n  width:100%;\n  height:100%;\n\n  padding:18px 16px;\n\n  display:flex;\n  flex-direction:column;\n\n  align-items:center;\n  justify-content:center;\n\n  text-align:center;\n}\n\n\n.app-icon {\n\n  width:54px;\n  height:54px;\n\n  flex:0 0 54px;\n\n  display:flex;\n  align-items:center;\n  justify-content:center;\n\n  margin:0 auto;\n\n  border-radius:17px;\n\n  font-size:28px;\n  line-height:1;\n\n  text-align:center;\n}\n\n\n.boiler-icon {\n  background:rgba(251,146,60,.10);\n}\n\n\n.washing-icon {\n  background:rgba(96,165,250,.10);\n}\n\n\n.dryer-icon {\n  background:rgba(196,181,253,.10);\n}\n\n\n.dishwasher-icon {\n  background:rgba(52,211,153,.10);\n}\n\n\n.app-status {\n\n  width:100%;\n  min-height:14px;\n\n  margin:10px 0 0 0;\n\n  display:flex;\n  align-items:center;\n  justify-content:center;\n\n  gap:6px;\n\n  text-align:center;\n\n  font-size:9px;\n  font-weight:900;\n  letter-spacing:.04em;\n  line-height:1.2;\n}\n\n\n.status-dot {\n\n  width:7px;\n  height:7px;\n\n  flex:0 0 7px;\n\n  border-radius:50%;\n}\n\n\n.app-title {\n\n  width:100%;\n  min-height:23px;\n\n  margin:10px 0 0 0;\n\n  display:flex;\n  align-items:center;\n  justify-content:center;\n\n  text-align:center;\n\n  font-size:20px;\n  font-weight:900;\n\n  line-height:1.1;\n}\n\n\n.app-subtitle {\n\n  width:100%;\n  min-height:11px;\n\n  margin:3px 0 0 0;\n\n  display:flex;\n  align-items:center;\n  justify-content:center;\n\n  text-align:center;\n\n  font-size:9px;\n  line-height:1.1;\n\n  opacity:.4;\n}\n\n\n.power-box {\n\n  width:88%;\n  min-height:72px;\n\n  margin:14px auto 0 auto;\n  padding:10px 6px;\n\n  display:flex;\n  flex-direction:column;\n\n  align-items:center;\n  justify-content:center;\n\n  text-align:center;\n\n  border-radius:16px;\n\n  background:\n    rgba(255,255,255,.035);\n\n  border:\n    1px solid rgba(255,255,255,.05);\n}\n\n\n.power-value {\n\n  width:100%;\n\n  display:flex;\n  align-items:baseline;\n  justify-content:center;\n\n  gap:4px;\n\n  text-align:center;\n\n  font-size:29px;\n  font-weight:900;\n\n  line-height:1;\n}\n\n\n.power-value span {\n\n  font-size:11px;\n\n  opacity:.45;\n}\n\n\n.power-label {\n\n  width:100%;\n\n  margin:7px 0 0 0;\n\n  display:flex;\n  align-items:center;\n  justify-content:center;\n\n  text-align:center;\n\n  font-size:8px;\n  font-weight:800;\n\n  line-height:1;\n\n  letter-spacing:.07em;\n\n  opacity:.35;\n}\n\n\n.app-detail {\n\n  width:100%;\n  min-height:30px;\n\n  margin:9px 0 0 0;\n\n  display:flex;\n\n  align-items:center;\n  justify-content:center;\n\n  gap:7px;\n\n  text-align:center;\n\n  font-size:10px;\n  font-weight:800;\n\n  line-height:1.2;\n}\n\n\n.detail-icon {\n\n  flex:none;\n\n  display:flex;\n  align-items:center;\n  justify-content:center;\n\n  font-size:16px;\n  line-height:1;\n}\n\n\n.socket-state {\n\n  width:88%;\n  min-height:20px;\n\n  margin:5px auto 0 auto;\n  padding:7px 0 0 0;\n\n  display:flex;\n  align-items:center;\n  justify-content:center;\n\n  text-align:center;\n\n  border-top:\n    1px solid rgba(255,255,255,.06);\n\n  font-size:8px;\n  line-height:1;\n\n  opacity:.45;\n}\n"
  - type: grid
    cards:
    - type: custom:button-card
      show_name: false
      show_state: false
      show_icon: false
      grid_options:
        columns: full
      custom_fields:
        panel: "[[[\n  // =========================================================\n  // CONFIGURATION DES UNITÉS\n  // =========================================================\n\n  const units = [\n\n    {\n      name: 'Salon',\n      icon: '\U0001F6CB️',\n      entity: '[[foxcat:legacy.climate_salon_2]]',\n      slope: null\n    },\n\n    {\n      name: 'Chambre parentale',\n      icon: '\U0001F6CF️',\n      entity: '[[foxcat:legacy.climate_chambre_parentale]]',\n      slope: '[[foxcat:legacy.sensor_chambre_parentale_temperature_slope]]'\n    },\n\n    {\n      name: 'Chambre Nathéo',\n      icon: '\U0001F9F8',\n      entity: '[[foxcat:legacy.climate_chambre_natheo_2]]',\n      slope: '[[foxcat:legacy.sensor_chambre_natheo_temperature_slope]]'\n    },\n\n    {\n      name: 'Salle de bain',\n      icon: '\U0001F6BF',\n      entity: '[[foxcat:legacy.climate_salle_de_bain_2]]',\n      slope: '[[foxcat:legacy.sensor_salle_de_bain_temperature_slope]]'\n    },\n\n    {\n      name: 'Chauffage sol',\n      icon: '♨️',\n      entity: '[[foxcat:legacy.climate_chauffage_sol_2]]',\n      slope: null\n    },\n\n    {\n      name: 'Insert a Pellet',\n      icon: '\U0001F373',\n      entity: '[[foxcat:legacy.climate_poele_a_pellet]]',\n      slope: null\n    }\n\n  ];\n\n\n  // =========================================================\n  // FONCTIONS\n  // =========================================================\n\n  function info(unit) {\n\n    const st = states[unit.entity];\n\n    if (!st) {\n      return {\n        available: false,\n        name: unit.name,\n        icon: unit.icon,\n        state: 'unavailable',\n        action: 'unavailable',\n        current: null,\n        target: null,\n        slope: null\n      };\n    }\n\n    const action =\n      st.attributes?.hvac_action || 'idle';\n\n    const current =\n      parseFloat(\n        st.attributes?.current_temperature\n      );\n\n    const target =\n      parseFloat(\n        st.attributes?.temperature\n      );\n\n    let slope = null;\n\n    if (unit.slope) {\n\n      const slopeEntity =\n        states[unit.slope];\n\n      if (slopeEntity) {\n        slope =\n          parseFloat(slopeEntity.state);\n      }\n\n    } else {\n\n      const attrSlope =\n        parseFloat(\n          st.attributes?.temperature_slope\n        );\n\n      if (!isNaN(attrSlope)) {\n        slope = attrSlope;\n      }\n\n    }\n\n    return {\n      available: true,\n      name: unit.name,\n      icon: unit.icon,\n      state: st.state,\n      action,\n      current:\n        isNaN(current)\n          ? null\n          : current,\n      target:\n        isNaN(target)\n          ? null\n          : target,\n      slope:\n        isNaN(slope)\n          ? null\n          : slope\n    };\n  }\n\n\n  function actionData(action, state) {\n\n    if (state === 'off') {\n      return {\n        text: 'ARRÊT',\n        icon: '○',\n        color: '#64748b'\n      };\n    }\n\n    if (action === 'heating') {\n      return {\n        text: 'CHAUFFE',\n        icon: '\U0001F525',\n        color: '#fb923c'\n      };\n    }\n\n    if (action === 'cooling') {\n      return {\n        text: 'RAFRAÎCHIT',\n        icon: '❄️',\n        color: '#60a5fa'\n      };\n    }\n\n    if (action === 'drying') {\n      return {\n        text: 'DÉSHUMIDIFIE',\n        icon: '\U0001F4A7',\n        color: '#38bdf8'\n      };\n    }\n\n    if (\n      action === 'fan' ||\n      action === 'fan_only'\n    ) {\n      return {\n        text: 'VENTILATION',\n        icon: '\U0001F300',\n        color: '#c4b5fd'\n      };\n    }\n\n    if (action === 'unavailable') {\n      return {\n        text: 'INDISPONIBLE',\n        icon: '⚠️',\n        color: '#ef4444'\n      };\n    }\n\n    return {\n      text: 'EN VEILLE',\n      icon: '\U0001F4A4',\n      color: '#94a3b8'\n    };\n  }\n\n\n  // =========================================================\n  // CALCUL GLOBAL\n  // =========================================================\n\n  const data =\n    units.map(info);\n\n  const active =\n    data.filter(x =>\n      [\n \
          \       'heating',\n        'cooling',\n        'drying',\n        'fan',\n        'fan_only'\n      ].includes(x.action)\n    );\n\n  const heating =\n    data.filter(\n      x => x.action === 'heating'\n    ).length;\n\n  const cooling =\n    data.filter(\n      x => x.action === 'cooling'\n    ).length;\n\n  const idle =\n    data.filter(\n      x =>\n        x.available &&\n        x.state !== 'off' &&\n        x.action === 'idle'\n    ).length;\n\n  const off =\n    data.filter(\n      x => x.state === 'off'\n    ).length;\n\n  const centralMode =\n    states['[[foxcat:legacy.select_central_mode]]']?.state || '-';\n\n\n  // =========================================================\n  // MODE CENTRAL\n  // =========================================================\n\n  let centralText = centralMode;\n  let centralIcon = '⚙️';\n  let centralColor = '#c4b5fd';\n\n  if (centralMode === 'Auto') {\n    centralText = 'Automatique';\n    centralIcon = '\U0001F916';\n    centralColor = '#c4b5fd';\n  }\n\n  if (centralMode === 'Stopped') {\n    centralText = 'Arrêt général';\n    centralIcon = '⛔';\n    centralColor = '#64748b';\n  }\n\n  if (centralMode === 'Heat only') {\n    centralText = 'Chauffage seul';\n    centralIcon = '\U0001F525';\n    centralColor = '#fb923c';\n  }\n\n  if (centralMode === 'Cool only') {\n    centralText = 'Rafraîchissement seul';\n    centralIcon = '❄️';\n    centralColor = '#60a5fa';\n  }\n\n  if (centralMode === 'Frost protection') {\n    centralText = 'Protection hors gel';\n    centralIcon = '\U0001F9CA';\n    centralColor = '#38bdf8';\n  }\n\n\n  // =========================================================\n  // GÉNÉRATION DES UNITÉS\n  // =========================================================\n\n  const rows = data.map(x => {\n\n    const a =\n      actionData(\n        x.action,\n        x.state\n      );\n\n    const currentText =\n      x.current !== null\n        ? `${x.current.toFixed(1)}°`\n        : '--';\n\n    const targetText =\n      x.target !== null\n        ? `${x.target.toFixed(1)}°`\n        : '--';\n\n    let slopeHtml = '';\n\n    if (x.slope !== null) {\n\n      let slopeColor = '#94a3b8';\n      let slopeIcon = '→';\n\n      if (x.slope > 0.01) {\n        slopeColor = '#fb923c';\n        slopeIcon = '↗';\n      }\n\n      if (x.slope < -0.01) {\n        slopeColor = '#60a5fa';\n        slopeIcon = '↘';\n      }\n\n      slopeHtml = `\n        <div style=\"\n          margin-top:7px;\n          font-size:9px;\n          color:${slopeColor};\n          opacity:.75;\n        \">\n          ${slopeIcon}\n          ${x.slope.toFixed(3)} °C/min\n        </div>\n      `;\n    }\n\n    return `\n      <div style=\"\n        width:100%;\n        min-width:0;\n        box-sizing:border-box;\n\n        padding:20px 15px;\n\n        border-radius:22px;\n\n        text-align:center;\n\n        background:\n          radial-gradient(\n            circle at 50% 0%,\n            ${a.color}12,\n            transparent 55%\n          ),\n          rgba(255,255,255,.025);\n\n        border:\n          1px solid ${a.color}25;\n      \">\n\n        <!-- ICONE -->\n\n        <div style=\"\n          width:50px;\n          height:50px;\n\n          margin:0 auto;\n\n          display:flex;\n          align-items:center;\n          justify-content:center;\n\n          border-radius:16px;\n\n          background:${a.color}12;\n\n          font-size:25px;\n        \">\n          ${x.icon}\n        </div>\n\n\n        <!-- NOM -->\n\n        <div style=\"\n          margin-top:11px;\n\n          font-size:17px;\n          font-weight:900;\n\n          color:white;\n        \">\n          ${x.name}\n        </div>\n\n\n        <!-- ETAT -->\n\n        <div style=\"\n          margin-top:8px;\n\n          display:flex;\n          justify-content:center;\n          align-items:center;\n\n          gap:5px;\n\n          font-size:9px;\n          font-weight:900;\n\n          color:${a.color};\n        \">\n\n          <span style=\"\n            width:6px;\n            height:6px;\n\n      \
          \      border-radius:50%;\n\n            background:${a.color};\n\n            box-shadow:${\n              active.includes(x)\n                ? `0 0 9px ${a.color}`\n                : 'none'\n            };\n          \">\n          </span>\n\n          ${a.icon}\n          ${a.text}\n\n        </div>\n\n\n        <!-- TEMP -->\n\n        <div style=\"\n          margin-top:16px;\n\n          font-size:32px;\n          line-height:1;\n\n          font-weight:900;\n        \">\n          ${currentText}\n        </div>\n\n        <div style=\"\n          margin-top:5px;\n\n          font-size:8px;\n          letter-spacing:.08em;\n\n          opacity:.35;\n        \">\n          TEMPÉRATURE\n        </div>\n\n\n        <!-- CONSIGNE -->\n\n        <div style=\"\n          margin-top:13px;\n\n          padding:10px;\n\n          border-radius:14px;\n\n          background:\n            rgba(255,255,255,.035);\n\n          border:\n            1px solid rgba(255,255,255,.05);\n        \">\n\n          <div style=\"\n            font-size:9px;\n            opacity:.4;\n          \">\n            CONSIGNE\n          </div>\n\n          <div style=\"\n            margin-top:3px;\n\n            font-size:17px;\n            font-weight:900;\n\n            color:${a.color};\n          \">\n            ${targetText}\n          </div>\n\n        </div>\n\n        ${slopeHtml}\n\n      </div>\n    `;\n\n  }).join('');\n\n\n  // =========================================================\n  // HTML FINAL\n  // =========================================================\n\n  return `\n\n    <div style=\"\n      width:100%;\n      box-sizing:border-box;\n\n      padding:24px;\n\n      border-radius:30px;\n\n      color:white;\n\n      background:\n        radial-gradient(\n          circle at 100% 0%,\n          rgba(139,92,246,.13),\n          transparent 38%\n        ),\n        radial-gradient(\n          circle at 0% 100%,\n          rgba(59,130,246,.10),\n          transparent 40%\n        ),\n        linear-gradient(\n          145deg,\n          #070b14,\n          #101827 55%,\n          #080d16\n        );\n\n      border:\n        1px solid rgba(255,255,255,.07);\n\n      box-shadow:\n        inset 0 1px 0 rgba(255,255,255,.06),\n        0 20px 55px rgba(0,0,0,.35);\n    \">\n\n\n      <!-- ==================================================\n           TITRE\n           ================================================== -->\n\n      <div style=\"\n        text-align:center;\n      \">\n\n        <div style=\"\n          font-size:27px;\n          font-weight:900;\n          letter-spacing:.07em;\n        \">\n          \U0001F321️ CHAUFFAGE & CLIMATISATION\n        </div>\n\n        <div style=\"\n          margin-top:5px;\n\n          font-size:9px;\n          font-weight:700;\n\n          letter-spacing:.16em;\n\n          opacity:.4;\n        \">\n          HOMEFOXCAT ENERGY · SUPERVISION\n        </div>\n\n      </div>\n\n\n      <!-- ==================================================\n           MODE CENTRAL\n           ================================================== -->\n\n      <div style=\"\n        margin-top:20px;\n\n        padding:15px 17px;\n\n        display:flex;\n        align-items:center;\n        justify-content:space-between;\n\n        gap:12px;\n\n        border-radius:18px;\n\n        background:${centralColor}0d;\n\n        border:\n          1px solid ${centralColor}25;\n      \">\n\n        <div style=\"\n          text-align:left;\n        \">\n\n          <div style=\"\n            font-size:9px;\n            font-weight:800;\n\n            letter-spacing:.1em;\n\n            opacity:.4;\n          \">\n            MODE CENTRAL\n          </div>\n\n          <div style=\"\n            margin-top:4px;\n\n            font-size:17px;\n            font-weight:900;\n\n            color:${centralColor};\n          \">\n            ${centralIcon}\n            ${centralText}\n          </div>\n\n        </div>\n\n        <div style=\"\n          font-size:9px;\n          opacity:.35;\n        \">\n\
          \          Lecture seule\n        </div>\n\n      </div>\n\n\n      <!-- ==================================================\n           RÉSUMÉ\n           ================================================== -->\n\n      <div style=\"\n        display:grid;\n\n        grid-template-columns:\n          repeat(4,minmax(0,1fr));\n\n        gap:8px;\n\n        margin-top:12px;\n      \">\n\n\n        <div style=\"\n          padding:13px 5px;\n          text-align:center;\n\n          border-radius:16px;\n\n          background:\n            rgba(52,211,153,.06);\n\n          border:\n            1px solid rgba(52,211,153,.12);\n        \">\n\n          <div style=\"\n            font-size:23px;\n            font-weight:900;\n\n            color:#34d399;\n          \">\n            ${active.length}\n          </div>\n\n          <div style=\"\n            margin-top:4px;\n            font-size:8px;\n            opacity:.4;\n          \">\n            ACTIVES\n          </div>\n\n        </div>\n\n\n        <div style=\"\n          padding:13px 5px;\n          text-align:center;\n\n          border-radius:16px;\n\n          background:\n            rgba(251,146,60,.06);\n\n          border:\n            1px solid rgba(251,146,60,.12);\n        \">\n\n          <div style=\"\n            font-size:23px;\n            font-weight:900;\n\n            color:#fb923c;\n          \">\n            ${heating}\n          </div>\n\n          <div style=\"\n            margin-top:4px;\n            font-size:8px;\n            opacity:.4;\n          \">\n            CHAUFFE\n          </div>\n\n        </div>\n\n\n        <div style=\"\n          padding:13px 5px;\n          text-align:center;\n\n          border-radius:16px;\n\n          background:\n            rgba(96,165,250,.06);\n\n          border:\n            1px solid rgba(96,165,250,.12);\n        \">\n\n          <div style=\"\n            font-size:23px;\n            font-weight:900;\n\n            color:#60a5fa;\n          \">\n            ${cooling}\n          </div>\n\n          <div style=\"\n            margin-top:4px;\n            font-size:8px;\n            opacity:.4;\n          \">\n            CLIM\n          </div>\n\n        </div>\n\n\n        <div style=\"\n          padding:13px 5px;\n          text-align:center;\n\n          border-radius:16px;\n\n          background:\n            rgba(148,163,184,.05);\n\n          border:\n            1px solid rgba(148,163,184,.10);\n        \">\n\n          <div style=\"\n            font-size:23px;\n            font-weight:900;\n\n            color:#94a3b8;\n          \">\n            ${idle + off}\n          </div>\n\n          <div style=\"\n            margin-top:4px;\n            font-size:8px;\n            opacity:.4;\n          \">\n            REPOS\n          </div>\n\n        </div>\n\n      </div>\n\n\n      <!-- ==================================================\n           UNITÉS\n           ================================================== -->\n\n      <div style=\"\n        display:grid;\n\n        grid-template-columns:\n          repeat(2,minmax(0,1fr));\n\n        gap:10px;\n\n        margin-top:14px;\n      \">\n\n        ${rows}\n\n      </div>\n\n    </div>\n  `;\n]]]\n"
