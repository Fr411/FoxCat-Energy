x\">\n\n        <div class=\"power-value\">\n          ${Math.round(power)}\n          <span>W</span>\n        </div>\n\n        <div class=\"power-label\">\n          PUISSANCE ACTUELLE\n        </div>\n\n      </div>\n\n      <div class=\"app-detail\">\n\n        <span class=\"detail-icon\">\n          ${detailIcon}\n        </span>\n\n        <span>\n          ${detail}\n        </span>\n\n      </div>\n\n      <div class=\"socket-state\">\n\n        ${\n          socket\n            ? '⚡ Prise active'\n            : '○ Prise coupée'\n        }\n\n      </div>\n\n    </div>\n  `;\n]]]\n"
