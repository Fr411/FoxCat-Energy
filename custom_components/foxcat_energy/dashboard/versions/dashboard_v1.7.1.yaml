class=\"cell\"><span>DOIGT DE GANT BAS</span><b>${fmt(temp,'°C')}</b></div><div class=\"cell\"><span>MOYENNE BALLON</span><b>${fmt(avg,'°C')}</b></div><div class=\"cell\"><span>PUISSANCE</span><b>${fmt(power,'W',0)}</b></div><div class=\"cell\"><span>ÉNERGIE MANQUANTE</span><b>${fmt(missing,'kWh',2)}</b></div><div class=\"cell\"><span>DURÉE ESTIMÉE</span><b>${fmt(duration,'h',2)}</b></div><div class=\"cell\"><span>EXÉCUTION</span><b>${execution}</b></div></div><div class=\"fcb-dynamic ${dynamic?'active':''}\"><div class=\"fcb-dyn-title\">DYNAMIC BOILER</div><div class=\"fcb-dyn-grid\"><div><span>POSITION</span><b>${fmt(position,'%',1)}</b></div><div><span>ZONE</span><b>${zone}</b></div><div><span>FAVORABLE</span><b>${fmt(low,'%',0)}</b></div><div><span>PLAFOND</span><b>${fmt(high,'%',0)}</b></div></div><div class=\"fcb-decision\" style=\"color:${decisionColor}\">${decision}</div><div class=\"fcb-note\">BOOST 65 °C = solaire uniquement · réseau ≤ plafond = confort 45 °C</div></div></div>`;\n]]]\n"
