views:
- type: sections
  max_columns: 4
  title: Accueil
  path: Emsdash
  icon: mdi:home
  show_icon_and_title: false
  sections:
  - type: grid
    cards:
    - type: custom:button-card
      show_name: false
      show_icon: false
      show_state: false
      custom_fields:
        header: "[[[\n  return `\n    <div class=\"hfc-header\">\n\n      <div class=\"hfc-logo\">\n        <div class=\"fox-glow\"></div>\n        <ha-icon icon=\"mdi:cat\"></ha-icon>\n      </div>\n\n      <div class=\"hfc-name\">\n\n        <div class=\"hfc-title\">\n          <span class=\"home\"></span><span class=\"fox\">FOX</span><span class=\"cat\">CAT</span>\n          <span class=\"energy\">ENERGY</span>\n        </div>\n\n        <div class=\"hfc-subtitle\">\n          ENERGY MANAGEMENT SYSTEM\n        </div>\n\n      </div>\n\n      <div class=\"hfc-line\">\n        <span class=\"line-orange\"></span>\n        <span class=\"line-blue\"></span>\n      </div>\n\n    </div>\n  `;\n]]]\n"
      styles:
        card:
        - padding: 17px 22px
        - border-radius: 20px
        - overflow: hidden
        - background: "radial-gradient(\n  circle at 3% 50%,\n  rgba(255,120,20,0.15),\n  transparent 24%\n), radial-gradient(\n  circle at 95% 30%,\n  rgba(0,210,255,0.11),\n  transparent 28%\n), linear-gradient(\n  135deg,\n  #080d16 0%,\n  #0a1420 48%,\n  #071827 100%\n)\n"
        - border: 1px solid rgba(255,255,255,0.08)
        - box-shadow: '0 10px 30px rgba(0,0,0,0.30), inset 0 1px 0 rgba(255,255,255,0.035)

            '
        grid:
        - grid-template-areas: '"header"'
        - grid-template-columns: 1fr
        - grid-template-rows: auto
        custom_fields:
          header:
          - width: 100%
      extra_styles: "\n.hfc-header {\n  position: relative;\n\n  width: 100%;\n\n  display: flex;\n  align-items: center;\n\n  gap: 16px;\n\n  box-sizing: border-box;\n}\n\n\n/* ==========================================\n   LOGO\n   ========================================== */\n\n.hfc-logo {\n  position: relative;\n\n  width: 54px;\n  height: 54px;\n\n  flex: 0 0 54px;\n\n  display: flex;\n  align-items: center;\n  justify-content: center;\n\n  border-radius: 16px;\n\n  background:\n    linear-gradient(\n      135deg,\n      rgba(255,126,25,0.15),\n      rgba(0,211,255,0.12)\n    );\n\n  border: 1px solid rgba(255,255,255,0.10);\n\n  box-shadow:\n    -5px 0 20px rgba(255,110,15,0.12),\n    5px 0 20px rgba(0,210,255,0.12);\n}\n\n\n.hfc-logo::before {\n  content: \"\";\n\n  position: absolute;\n\n  inset: 3px;\n\n  border-radius: 13px;\n\n  border-top:\n    1px solid rgba(255,137,37,0.45);\n\n  border-right:\n    1px solid rgba(0,216,255,0.40);\n}\n\n\n.hfc-logo ha-icon {\n  position: relative;\n\n  color: #ffffff;\n\n  --mdc-icon-size: 31px;\n\n  filter:\n    drop-shadow(-3px 0 5px rgba(255,110,20,0.55))\n    drop-shadow(3px 0 5px rgba(0,210,255,0.50));\n}\n\n\n/* ==========================================\n   NOM\n   ========================================== */\n\n.hfc-name {\n  display: flex;\n  flex-direction: column;\n\n  justify-content: center;\n}\n\n\n.hfc-title {\n  white-space: nowrap;\n\n  font-size: 24px;\n  font-weight: 850;\n\n  line-height: 1;\n\n  letter-spacing: 0.055em;\n}\n\n\n.hfc-title .home {\n  color: #ffffff;\n}\n\n\n/* RENARD */\n\n.hfc-title .fox {\n  color: #ff8a26;\n\n  text-shadow:\n    0 0 12px rgba(255,120,20,0.25);\n}\n\n\n/* CHAT */\n\n.hfc-title .cat {\n  color: #19d8ff;\n\n  text-shadow:\n    0 0 12px rgba(0,210,255,0.25);\n}\n\n\n/* ENERGY */\n\n.hfc-title .energy {\n  margin-left: 9px;\n\n  color: #a9bdcc;\n\n  font-weight: 600;\n}\n\n\n/* ==========================================\n   SOUS-TITRE\n   ========================================== */\n\n.hfc-subtitle {\n  margin-top: 7px;\n\n  color: #71899d;\n\n  font-size: 8px;\n  font-weight: 600;\n\n  letter-spacing: 0.28em;\n}\n\n\n/* ==========================================\n   LIGNE SIGNATURE\n   ========================================== */\n\n.hfc-line {\n  height: 2px;\n\n  flex: 1;\n\n  min-width: 60px;\n\n  margin-left: 12px;\n\n  display: flex;\n\n  border-radius: 10px;\n\n  overflow: hidden;\n\n  opacity: 0.75;\n}\n\n\n.line-orange {\n  width: 38%;\n\n  background:\n    linear-gradient(\n      90deg,\n      rgba(255,130,25,0),\n      #ff8125\n    );\n\n  box-shadow:\n    0 0 10px rgba(255,120,20,0.40);\n}\n\n\n.line-blue {\n  flex: 1;\n\n  background:\n    linear-gradient(\n      90deg,\n      #00d8ff,\n      rgba(0,216,255,0)\n    );\n\n  box-shadow:\n    0 0 10px rgba(0,216,255,0.40);\n}\n"
    - type: custom:bubble-card
      card_type: select
      entity:
      - - foxcat:ems.mode
      name: Mode EMS
      icon: mdi:lightning-bolt-circle
      sub_button:
        main: []
        bottom: []
      force_icon: false
      show_state: true
      show_last_changed: false
      show_last_updated: false
      show_attribute: false
      card_layout: large
      theme: ios-dark-mode-dark-blue
      rows: '1'
      styles: ".bubble-button-card-container {\n  position: relative;\n  min-height: 78px !important;\n  border-radius: 22px !important;\n  overflow: hidden;\n\n  background:\n    linear-gradient(\n      145deg,\n      rgba(14, 20, 31, 0.96),\n      rgba(8, 13, 22, 0.98)\n    ) !important;\n\n  border: 1px solid rgba(255,255,255,0.07) !important;\n\n  box-shadow:\n    0 14px 36px rgba(0,0,0,0.30),\n    inset 0 1px 0 rgba(255,255,255,0.035) !important;\n\n  backdrop-filter: blur(18px);\n}\n\n/* Barre d'accent verticale */\n.bubble-button-card-container::before {\n  content: \"\";\n  position: absolute;\n  left: 0;\n  top: 14px;\n  bottom: 14px;\n  width: 4px;\n  border-radius: 0 8px 8px 0;\n\n  background:\n    ${state === 'Économie énergie'\n      ? '#22d3ee'\n    : state === 'Réinjection autorisée'\n      ? '#38bdf8'\n    : state === 'Réinjection refusée'\n      ? '#fb7185'\n    : state === 'Bihoraire'\n      ? '#fbbf24'\n    : state === 'Tarification dynamique'\n      ? '#c084fc'\n    : state === 'Confort'\n      ? '#f472b6'\n    : '#64748b'};\n}\n\n/* Halo discret */\n.bubble-button-card-container::after {\n  content: \"\";\n  position: absolute;\n  left: 0;\n  top: 0;\n  width: 120px;\n  height: 100%;\n  pointer-events: none;\n\n  background:\n    ${state === 'Économie énergie'\n      ? 'linear-gradient(90deg, rgba(34,211,238,0.08), transparent)'\n    : state === 'Réinjection autorisée'\n      ? 'linear-gradient(90deg, rgba(56,189,248,0.08), transparent)'\n    : state === 'Réinjection refusée'\n      ? 'linear-gradient(90deg, rgba(251,113,133,0.08), transparent)'\n    : state === 'Bihoraire'\n      ? 'linear-gradient(90deg, rgba(251,191,36,0.08), transparent)'\n    : state === 'Tarification dynamique'\n      ? 'linear-gradient(90deg, rgba(192,132,252,0.08), transparent)'\n    : state === 'Confort'\n      ? 'linear-gradient(90deg, rgba(244,114,182,0.08), transparent)'\n    : 'transparent'};\n}\n\n.bubble-icon-container {\n  width: 48px !important;\n  height: 48px !important;\n  margin-left: 6px !important;\n  border-radius: 15px !important;\n\n  background:\n    ${state === 'Économie énergie'\n      ? 'rgba(34,211,238,0.10)'\n    : state === 'Réinjection autorisée'\n      ? 'rgba(56,189,248,0.10)'\n    : state === 'Réinjection refusée'\n      ? 'rgba(251,113,133,0.10)'\n    : state === 'Bihoraire'\n      ? 'rgba(251,191,36,0.10)'\n    : state === 'Tarification dynamique'\n      ? 'rgba(192,132,252,0.10)'\n    : state === 'Confort'\n      ? 'rgba(244,114,182,0.10)'\n    : 'rgba(255,255,255,0.05)'} !important;\n\n  border:\n    1px solid\n    ${state === 'Économie énergie'\n      ? 'rgba(34,211,238,0.16)'\n    : state === 'Réinjection autorisée'\n      ? 'rgba(56,189,248,0.16)'\n    : state === 'Réinjection refusée'\n      ? 'rgba(251,113,133,0.16)'\n    : state === 'Bihoraire'\n      ? 'rgba(251,191,36,0.16)'\n    : state === 'Tarification dynamique'\n      ? 'rgba(192,132,252,0.16)'\n    : state === 'Confort'\n      ? 'rgba(244,114,182,0.16)'\n    : 'rgba(255,255,255,0.06)'} !important;\n}\n\n.bubble-icon {\n  color:\n    ${state === 'Économie énergie'\n      ? '#22d3ee'\n    : state === 'Réinjection autorisée'\n      ? '#38bdf8'\n    : state === 'Réinjection refusée'\n      ? '#fb7185'\n    : state === 'Bihoraire'\n      ? '#fbbf24'\n    : state === 'Tarification dynamique'\n      ? '#c084fc'\n    : state === 'Confort'\n      ? '#f472b6'\n    : '#94a3b8'} !important;\n\n  filter:\n    ${state === 'Économie énergie'\n      ? 'drop-shadow(0 0 8px rgba(34,211,238,0.35))'\n    : state === 'Réinjection autorisée'\n      ? 'drop-shadow(0 0 8px rgba(56,189,248,0.35))'\n    : state === 'Réinjection refusée'\n      ? 'drop-shadow(0 0 8px rgba(251,113,133,0.35))'\n    : state === 'Bihoraire'\n      ? 'drop-shadow(0 0 8px rgba(251,191,36,0.35))'\n    : state === 'Tarification dynamique'\n      ? 'drop-shadow(0 0 8px rgba(192,132,252,0.35))'\n    : state === 'Confort'\n      ? 'drop-shadow(0 0 8px rgba(244,114,182,0.35))'\n    : 'none'};\n}\n\n.bubble-name {\n  font-size: 10px !important;\n  font-weight: 800 !important;\n  text-transform:\
        \ uppercase;\n  letter-spacing: 1.5px;\n  color: rgba(255,255,255,0.38) !important;\n  margin-bottom: 2px !important;\n}\n\n.bubble-state {\n  font-size: 18px !important;\n  font-weight: 850 !important;\n  letter-spacing: -0.2px;\n\n  color:\n    ${state === 'Économie énergie'\n      ? '#a5f3fc'\n    : state === 'Réinjection autorisée'\n      ? '#bae6fd'\n    : state === 'Réinjection refusée'\n      ? '#fecdd3'\n    : state === 'Bihoraire'\n      ? '#fde68a'\n    : state === 'Tarification dynamique'\n      ? '#e9d5ff'\n    : state === 'Confort'\n      ? '#fbcfe8'\n    : '#f8fafc'} !important;\n}\n\n.bubble-select-card {\n  border-radius: 16px !important;\n  background: rgba(255,255,255,0.035) !important;\n  border: 1px solid rgba(255,255,255,0.05) !important;\n}\n\n.bubble-dropdown-container {\n  background: rgba(255,255,255,0.03) !important;\n  border-radius: 14px !important;\n}\n"
    - type: custom:bubble-card
      card_type: select
      entity:
      - - foxcat:pricing.network_policy
      grid_options:
        columns: 6
    - type: custom:bubble-card
      card_type: select
      entity:
      - - foxcat:pricing.regime
      grid_options:
        columns: 6
  - type: grid
    cards:
    - type: custom:button-card
      show_name: false
      show_state: false
      show_icon: false
      grid_options:
        columns: full
      custom_fields:
        main: "[[[\n  /* ==========================================================\n     FOXCAT ENERGY V1.3.200 — COCKPIT EMS\n     Données prioritaires : entités natives FoxCat Energy.\n     Fallbacks conservés uniquement pour les mesures journalières\n     et pour faciliter la migration depuis l'ancienne carte.\n     ========================================================== */\n\n  const norm = (value) => String(value ?? '')\n    .normalize('NFD')\n    .replace(/[\\u0300-\\u036f]/g, '')\n    .toLowerCase()\n    .replace(/[^a-z0-9]+/g, ' ')\n    .trim();\n\n  const entityExists = (id) => !!(id && states[id]);\n\n  const findFox = (domain, words = [], candidates = []) => {\n    for (const id of candidates) {\n      if (entityExists(id)) return id;\n    }\n\n    const wanted = words.map(norm).filter(Boolean);\n    const prefix = `${domain}.`;\n    const ids = Object.keys(states).filter((id) => id.startsWith(prefix));\n\n    const match = ids.find((id) => {\n      const st = states[id];\n      const friendly = st?.attributes?.friendly_name || '';\n      const haystack = norm(`${id} ${friendly}`);\n      const isFox = haystack.includes('foxcat energy') || norm(id).includes('foxcat energy');\n      return isFox && wanted.every((w) => haystack.includes(w));\n    });\n\n    return match || null;\n  };\n\n  const stateOf = (id, fallback = '—') => {\n    if (!id || !states[id]) return fallback;\n    const value = states[id].state;\n    if (value === undefined || value === null || value === '' ||\n        value === 'unknown' || value === 'unavailable') return fallback;\n    return value;\n  };\n\n  const numberOf = (id, fallback = 0) => {\n    const value = Number.parseFloat(stateOf(id, ''));\n    return Number.isFinite(value) ? value : fallback;\n  };\n\n  const isOn = (id) => id && states[id]?.state === 'on';\n\n  const fmtW = (value) => {\n    const v = Math.abs(Number(value) || 0);\n    return v >= 1000 ? `${(v / 1000).toFixed(2)} kW` : `${Math.round(v)} W`;\n  };\n\n  const fmtSignedW = (value) => {\n    const n = Number(value) || 0;\n    const sign = n > 0 ? '+' : n < 0 ? '−' : '';\n    return `${sign}${fmtW(n)}`;\n  };\n\n  const fmtPct = (value) => `${Math.round(Number(value) || 0)} %`;\n  const fmtKwh = (value) => `${Number(value || 0).toFixed(1)} kWh`;\n  const fmtEuro = (value) => `${Number(value || 0).toFixed(2)} €`;\n  const clamp = (value, min, max) => Math.min(Math.max(Number(value) || 0, min), max);\n\n  /* ==========================================================\n     RÉSOLUTION DES ENTITÉS NATIVES FOXCAT\n     ========================================================== */\n\n  const E = {\n    mode: findFox('select', ['mode', 'ems'], [\n      '[[foxcat:ems.mode]]'\n    ]),\n\n    regulation: findFox('switch', ['regulation', 'foxcat', 'active'], [\n      '[[foxcat:ems.regulation_active]]'\n    ]),\n\n    dataValid: findFox('binary_sensor', ['donnees', 'energetiques', 'valides']),\n\n    phase: findFox('sensor', ['phase', 'regulation']),\n    coreAck: findFox('sensor', ['validation', 'execution', 'ems']),\n    lastDecision: findFox('sensor', ['derniere', 'decision', 'ems']),\n\n    pv: findFox('sensor', ['puissance', 'production', 'photovoltaique'], [\n      '[[foxcat:energy.pv_power]]'\n    ]),\n    house: findFox('sensor', ['puissance', 'consommation', 'maison'], [\n      '[[foxcat:energy.house_power]]'\n    ]),\n    export: findFox('sensor', ['puissance', 'reinjectee', 'reseau'], [\n      '[[foxcat:energy.grid_export]]'\n    ]),\n    import: findFox('sensor', ['puissance', 'prelevee', 'reseau'], [\n      '[[foxcat:energy.grid_import]]'\n    ]),\n    gridNet: findFox('sensor', ['puissance', 'nette', 'reseau'], [\n      '[[foxcat:energy.grid_power]]'\n    ]),\n\n    priLevel: findFox('sensor', ['niveau', 'puissance', 'pri', 'actuel']),\n    priTarget: findFox('sensor', ['niveau', 'puissance', 'pri', 'cible']),\n    priDirection: findFox('sensor', ['direction', 'pri']),\n    priCode: findFox('sensor', ['code', 'rrcr']),\n    priAckRrcr: findFox('sensor', ['ack', 'rrcr']),\n    priAckInverter: findFox('sensor', ['ack',\
          \ 'onduleur']),\n    priAckGrid: findFox('sensor', ['ack', 'reseau']),\n    priReason: findFox('sensor', ['derniere', 'decision', 'pri']),\n\n    boilerTemp: findFox('sensor', ['temperature', 'chauffe', 'eau']),\n    boilerPower: findFox('sensor', ['puissance', 'chauffe', 'eau']),\n    boilerDemand: findFox('sensor', ['demande', 'chauffe', 'eau']),\n    boilerOrigin: findFox('sensor', ['origine', 'demande', 'chauffe', 'eau']),\n    boilerExec: findFox('sensor', ['etat', 'execution', 'chauffe', 'eau']),\n    boilerPhysical: findFox('binary_sensor', ['boiler', 'physique']),\n\n    solarWindow: findFox('binary_sensor', ['fenetre', 'solaire', 'exploitable']),\n    solarConfidence: findFox('sensor', ['confiance', 'solaire']),\n    solarPotential: findFox('sensor', ['potentiel', 'solaire']),\n    solarTrend: findFox('sensor', ['tendance', 'solaire']),\n    solarStart: findFox('sensor', ['debut', 'fenetre', 'solaire']),\n    solarEnd: findFox('sensor', ['fin', 'fenetre', 'solaire']),\n    solarReason: findFox('sensor', ['raison', 'prevision', 'solaire']),\n\n    buyPrice: findFox('sensor', ['prix', 'achat', 'actif']),\n    tariffPeriod: findFox('sensor', ['periode', 'tarifaire']),\n    priceStatus: findFox('sensor', ['statut', 'prix'])\n  };\n\n  /* ==========================================================\n     VALEURS INSTANTANÉES\n     ========================================================== */\n\n  const pv = Math.max(numberOf(E.pv, numberOf('[[foxcat:sources.pv]]', 0)), 0);\n  const house = Math.max(numberOf(E.house, numberOf('[[foxcat:legacy.sensor_consommation_reelle_maison]]', 0)), 0);\n  const gridExport = Math.max(numberOf(E.export, numberOf('[[foxcat:sources.grid_fallback]]', 0)), 0);\n  const gridImport = Math.max(numberOf(E.import, numberOf('[[foxcat:sources.grid_signed]]', 0)), 0);\n  const gridNet = E.gridNet ? numberOf(E.gridNet, gridExport - gridImport) : gridExport - gridImport;\n\n  const solarCover = house > 0 ? clamp((pv / house) * 100, 0, 100) : (pv > 0 ? 100 : 0);\n\n  const priLevel = clamp(numberOf(E.priLevel, 100), 0, 100);\n  const priTarget = clamp(numberOf(E.priTarget, priLevel), 0, 100);\n  const priDirection = stateOf(E.priDirection, 'maintien');\n  const priCode = stateOf(E.priCode, '—');\n  const priAckRrcr = stateOf(E.priAckRrcr, '—');\n  const priAckInverter = stateOf(E.priAckInverter, '—');\n  const priAckGrid = stateOf(E.priAckGrid, '—');\n  const priReason = stateOf(E.priReason, 'Aucune décision PRI disponible.');\n\n  const boilerTemp = numberOf(E.boilerTemp,\n    numberOf('[[foxcat:boiler.temperature_source]]', 0));\n  const boilerPower = Math.max(numberOf(E.boilerPower,\n    numberOf('[[foxcat:boiler.power_source]]', 0)), 0);\n  const boilerRunning = E.boilerPhysical ? isOn(E.boilerPhysical) : boilerPower > 200;\n  const boilerDemand = stateOf(E.boilerDemand, 'AUCUNE');\n  const boilerOrigin = stateOf(E.boilerOrigin, 'AUCUNE');\n  const boilerExec = stateOf(E.boilerExec, boilerRunning ? 'EN COURS' : 'IDLE');\n\n  const solarWindow = isOn(E.solarWindow);\n  const solarConfidence = clamp(numberOf(E.solarConfidence, 0), 0, 100);\n  const solarPotential = stateOf(E.solarPotential, 'Aucun');\n  const solarTrend = stateOf(E.solarTrend, '—');\n  const solarStart = stateOf(E.solarStart, '--:--');\n  const solarEnd = stateOf(E.solarEnd, '--:--');\n  const solarReason = stateOf(E.solarReason, 'Aucune analyse solaire disponible.');\n\n  const mode = stateOf(E.mode, 'Inconnu');\n  const regulationActive = E.regulation ? isOn(E.regulation) : true;\n  const dataValid = E.dataValid ? isOn(E.dataValid) : true;\n  const phase = stateOf(E.phase, '—');\n  const coreAck = stateOf(E.coreAck, '—');\n  const lastDecision = stateOf(E.lastDecision, 'Aucune décision EMS disponible.');\n\n  /* ==========================================================\n     TARIF NATIF FOXCAT\n     ========================================================== */\n\n  const buyPrice = numberOf(E.buyPrice,\n    numberOf('[[foxcat:pricing.active_buy]]', 0));\n  const tariffPeriod = stateOf(E.tariffPeriod, '—');\n  const priceStatus\
          \ = stateOf(E.priceStatus, '—');\n\n  /* ==========================================================\n     BILAN JOURNALIER — comptabilité native FoxCat\n     ========================================================== */\n\n  const productionToday = Math.max(numberOf('[[foxcat:energy.today.pv]]', 0), 0);\n  const consumptionToday = Math.max(numberOf('[[foxcat:energy.today.house]]', 0), 0);\n  const injectionToday = Math.max(numberOf('[[foxcat:energy.today.export]]', 0), 0);\n  const selfConsumed = Math.max(numberOf('[[foxcat:energy.today.self_consumed]]', 0), 0);\n  const selfConsumption = clamp(numberOf('[[foxcat:energy.today.self_consumption_pct]]', 0), 0, 100);\n  const gridEnergyToday = Math.max(numberOf('[[foxcat:energy.today.import]]', 0), 0);\n  const dailyCost = Math.max(numberOf('[[foxcat:pricing.cost_today]]', 0), 0);\n\n  /* ==========================================================\n     COULEURS / ÉTATS\n     ========================================================== */\n\n  const modeMap = {\n    'Économie énergie': ['\U0001F33F', '#34d399'],\n    'Economie énergie': ['\U0001F33F', '#34d399'],\n    'Bihoraire': ['♨️', '#fb923c'],\n    'Zéro injection': ['⛔', '#fb7185'],\n    'Dynamique': ['\U0001F4C8', '#a78bfa'],\n    'Manuel': ['\U0001F590️', '#60a5fa']\n  };\n  const [modeIcon, modeColor] = modeMap[mode] || ['⚡', '#c4b5fd'];\n\n  let gridIcon = '⚖️';\n  let gridLabel = 'Équilibre';\n  let gridColor = '#94a3b8';\n  let gridValue = 0;\n\n  if (gridExport > 20) {\n    gridIcon = '↗';\n    gridLabel = 'Réinjection';\n    gridColor = '#34d399';\n    gridValue = gridExport;\n  } else if (gridImport > 20) {\n    gridIcon = '↙';\n    gridLabel = 'Prélèvement';\n    gridColor = '#fb7185';\n    gridValue = gridImport;\n  }\n\n  let priColor = '#34d399';\n  if (priLevel < 100) priColor = '#facc15';\n  if (priAckRrcr === 'FAILED' || priAckInverter === 'FAILED' || priAckGrid === 'FAILED') priColor = '#fb7185';\n  if (String(priAckGrid).toUpperCase().includes('PENDING')) priColor = '#60a5fa';\n\n  const priArrow = priTarget > priLevel ? '↑' : priTarget < priLevel ? '↓' : '→';\n\n  const boilerColor = boilerRunning ? '#fb923c' : '#94a3b8';\n  const solarColor = solarWindow ? '#facc15' : '#64748b';\n  const systemColor = regulationActive && dataValid ? '#34d399' : '#fb7185';\n\n  /* ==========================================================\n     RENDU\n     ========================================================== */\n\n  return `\n    <div class=\"foxcat\">\n\n      <div class=\"header\">\n        <div>\n          <div class=\"brand\"><span>FOX</span><span class=\"cat\">CAT</span><span class=\"energy\">ENERGY</span></div>\n          <div class=\"subtitle\">EMS V1.3.200 · COCKPIT TEMPS RÉEL</div>\n        </div>\n        <div class=\"system-pill\" style=\"color:${systemColor};border-color:${systemColor}35;background:${systemColor}10;\">\n          <span class=\"live-dot\" style=\"background:${systemColor};box-shadow:0 0 10px ${systemColor};\"></span>\n          ${regulationActive ? (dataValid ? 'EMS ACTIF' : 'DONNÉES INVALIDES') : 'EMS EN VEILLE'}\n        </div>\n      </div>\n\n      <div class=\"topline\">\n        <div>\n          <div class=\"eyebrow\">MODE ACTUEL</div>\n          <div class=\"mode\" style=\"color:${modeColor};\">${modeIcon} ${mode}</div>\n        </div>\n        <div class=\"core-mini\">\n          <span>CORE <b>${phase}</b></span>\n          <span>ACK <b>${coreAck}</b></span>\n        </div>\n      </div>\n\n      <div class=\"realtime-grid\">\n\n        <div class=\"rt-card pv-card\">\n          <div class=\"rt-head\"><span>☀️</span><span>PV ACTUEL</span></div>\n          <div class=\"rt-value pv\">${fmtW(pv)}</div>\n          <div class=\"rt-sub\">Production photovoltaïque</div>\n          <div class=\"mini-bar\"><div class=\"mini-fill solar\" style=\"width:${solarCover}%;\"></div></div>\n          <div class=\"rt-foot\"><span>Couverture maison</span><b>${Math.round(solarCover)} %</b></div>\n        </div>\n\n        <div class=\"rt-card grid-card\">\n          <div class=\"rt-head\"><span\
          \ style=\"color:${gridColor};\">${gridIcon}</span><span>RÉSEAU</span></div>\n          <div class=\"rt-value\" style=\"color:${gridColor};\">${fmtW(gridValue)}</div>\n          <div class=\"rt-sub\" style=\"color:${gridColor};\">${gridLabel}</div>\n          <div class=\"rt-foot\"><span>Export</span><b>${fmtW(gridExport)}</b></div>\n          <div class=\"rt-foot\"><span>Import</span><b>${fmtW(gridImport)}</b></div>\n          <div class=\"rt-foot\"><span>Net FoxCat</span><b>${fmtSignedW(gridNet)}</b></div>\n        </div>\n\n        <div class=\"rt-card pri-card\">\n          <div class=\"rt-head\"><span>⚙️</span><span>ONDULEUR SOLAREDGE</span></div>\n          <div class=\"pri-main\">\n            <div class=\"rt-value\" style=\"color:${priColor};\">${Math.round(priLevel)} %</div>\n            <div class=\"pri-target\">${priArrow} ${Math.round(priTarget)} %</div>\n          </div>\n          <div class=\"mini-bar\"><div class=\"mini-fill pri\" style=\"width:${priLevel}%;background:${priColor};\"></div></div>\n          <div class=\"rt-foot\"><span>Direction</span><b>${priDirection}</b></div>\n          <div class=\"rt-foot\"><span>RRCR</span><b>${priCode}</b></div>\n          <div class=\"ack-row\">\n            <span class=\"ack-chip\">RRCR ${priAckRrcr}</span>\n            <span class=\"ack-chip\">INV ${priAckInverter}</span>\n            <span class=\"ack-chip\">RÉSEAU ${priAckGrid}</span>\n          </div>\n        </div>\n\n        <div class=\"rt-card boiler-card\">\n          <div class=\"rt-head\"><span>♨️</span><span>BOILER</span></div>\n          <div class=\"boiler-main\">\n            <div class=\"rt-value\">${boilerTemp.toFixed(1)}°</div>\n            <div class=\"boiler-state\" style=\"color:${boilerColor};\">${boilerRunning ? '● CHAUFFE' : '○ ATTENTE'}</div>\n          </div>\n          <div class=\"rt-foot\"><span>Puissance</span><b>${fmtW(boilerPower)}</b></div>\n          <div class=\"rt-foot\"><span>Demande</span><b>${boilerDemand}</b></div>\n          <div class=\"rt-foot\"><span>Origine</span><b>${boilerOrigin}</b></div>\n          <div class=\"rt-foot\"><span>Exécution</span><b>${boilerExec}</b></div>\n        </div>\n\n      </div>\n\n      <div class=\"solar-panel\" style=\"border-color:${solarColor}30;\">\n        <div class=\"section-head\">\n          <div><span class=\"section-icon\">\U0001F324️</span> IA · SOLAIRE</div>\n          <div class=\"solar-status\" style=\"color:${solarColor};\">${solarWindow ? '● FENÊTRE EXPLOITABLE' : '○ SURVEILLANCE'}</div>\n        </div>\n\n        <div class=\"solar-grid\">\n          <div class=\"solar-stat\"><span>Confiance</span><b>${fmtPct(solarConfidence)}</b></div>\n          <div class=\"solar-stat\"><span>Potentiel</span><b>${solarPotential}</b></div>\n          <div class=\"solar-stat\"><span>Tendance</span><b>${solarTrend}</b></div>\n          <div class=\"solar-stat\"><span>Fenêtre</span><b>${solarStart} → ${solarEnd}</b></div>\n        </div>\n\n        <div class=\"confidence-bar\"><div style=\"width:${solarConfidence}%;\"></div></div>\n        <div class=\"reason\">${solarReason}</div>\n      </div>\n\n      <div class=\"decision-grid\">\n        <div class=\"decision-card\">\n          <div class=\"decision-title\">⚡ DERNIÈRE DÉCISION EMS</div>\n          <div class=\"decision-text\">${lastDecision}</div>\n        </div>\n        <div class=\"decision-card\">\n          <div class=\"decision-title\">⚙️ DERNIÈRE DÉCISION ONDULEUR</div>\n          <div class=\"decision-text\">${priReason}</div>\n        </div>\n      </div>\n\n      <div class=\"tariff-row\">\n        <div><span>Tarif FoxCat</span><b>${tariffPeriod}</b></div>\n        <div><span>Prix achat actif</span><b>${buyPrice.toFixed(3)} €/kWh</b></div>\n        <div><span>Statut prix</span><b>${priceStatus}</b></div>\n      </div>\n\n      <div class=\"today\">\n        <div class=\"section-head\"><div>AUJOURD’HUI</div><div class=\"section-muted\">bilan énergétique</div></div>\n        <div class=\"today-grid\">\n          <div class=\"today-item\"><span>☀️</span><b>${fmtKwh(productionToday)}</b><small>Production</small></div>\n\
          \          <div class=\"today-item\"><span>\U0001F3E0</span><b>${fmtKwh(consumptionToday)}</b><small>Consommation</small></div>\n          <div class=\"today-item\"><span>↗️</span><b>${fmtKwh(injectionToday)}</b><small>Injection</small></div>\n          <div class=\"today-item\"><span>♻️</span><b>${fmtPct(selfConsumption)}</b><small>Autoconsommation</small></div>\n          <div class=\"today-item\"><span>\U0001F4B6</span><b>${fmtEuro(dailyCost)}</b><small>Coût estimé</small></div>\n        </div>\n      </div>\n\n      <div class=\"footer\">\n        <span>FOXCAT ENERGY V1.3.200</span>\n        <span>Données natives FoxCat · temps réel</span>\n      </div>\n    </div>\n  `;\n]]]\n"
      styles:
