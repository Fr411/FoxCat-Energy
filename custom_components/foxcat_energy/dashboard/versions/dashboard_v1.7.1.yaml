      custom_fields:
        content: "[[[\n  const norm = (v) =>\n    String(v ?? '')\n      .normalize('NFD')\n      .replace(/[\\u0300-\\u036f]/g, '')\n      .toLowerCase()\n      .replace(/[^a-z0-9]+/g, ' ')\n      .trim();\n\n  const exists = (id) =>\n    !!(id && states[id]);\n\n  const findFox = (domain, words = [], candidates = []) => {\n\n    for (const id of candidates) {\n      if (exists(id)) return id;\n    }\n\n    const wanted =\n      words.map(norm).filter(Boolean);\n\n    const prefix =\n      `${domain}.`;\n\n    return (\n      Object.keys(states)\n        .filter(id => id.startsWith(prefix))\n        .find(id => {\n\n          const s =\n            states[id];\n\n          const friendly =\n            s?.attributes?.friendly_name || '';\n\n          const text =\n            norm(`${id} ${friendly}`);\n\n          const foxcat =\n            text.includes('foxcat energy') ||\n            norm(id).includes('foxcat energy');\n\n          return (\n            foxcat &&\n            wanted.every(word =>\n              text.includes(word)\n            )\n          );\n        })\n      || null\n    );\n  };\n\n  const stateOf = (id, fallback = '—') => {\n\n    if (!id || !states[id])\n      return fallback;\n\n    const v =\n      states[id].state;\n\n    if (\n      v === undefined ||\n      v === null ||\n      v === '' ||\n      v === 'unknown' ||\n      v === 'unavailable' ||\n      v === 'none'\n    )\n      return fallback;\n\n    return v;\n  };\n\n  const numberOf = (id, fallback = 0) => {\n\n    const v =\n      parseFloat(\n        stateOf(id, '')\n      );\n\n    return Number.isFinite(v)\n      ? v\n      : fallback;\n  };\n\n  const clamp = (v, min, max) =>\n    Math.min(\n      Math.max(Number(v) || 0, min),\n      max\n    );\n\n  const fmtPower = (value) => {\n\n    const v =\n      Math.abs(Number(value) || 0);\n\n    return v >= 1000\n      ? `${(v / 1000).toFixed(2)} kW`\n      : `${Math.round(v)} W`;\n  };\n\n\n  /* ============================================\n     ENTITÉS V1.5.0\n     ============================================ */\n\n  const E = {\n\n    pv:\n      findFox(\n        'sensor',\n        ['puissance', 'production', 'photovoltaique']\n      ),\n\n    export:\n      findFox(\n        'sensor',\n        ['puissance', 'reinjectee', 'reseau']\n      ),\n\n    import:\n      findFox(\n        'sensor',\n        ['puissance', 'prelevee', 'reseau']\n      ),\n\n    policy:\n      findFox(\n        'sensor',\n        ['politique', 'reseau', 'active']\n      ),\n\n    inverterState:\n      findFox(\n        'sensor',\n        ['ems', 'onduleur', 'etat']\n      ),\n\n    ceiling:\n      findFox(\n        'sensor',\n        ['ems', 'onduleur', 'plafond', 'pv']\n      ),\n\n    ceilingUse:\n      findFox(\n        'sensor',\n        ['ems', 'onduleur', 'utilisation', 'plafond']\n      ),\n\n    potential:\n      findFox(\n        'sensor',\n        ['ems', 'onduleur', 'potentiel', 'solaire']\n      ),\n\n    priCurrent:\n      findFox(\n        'sensor',\n        ['niveau', 'puissance', 'pri', 'actuel']\n      ),\n\n    priTarget:\n      findFox(\n        'sensor',\n        ['niveau', 'puissance', 'pri', 'cible']\n      ),\n\n    direction:\n      findFox(\n        'sensor',\n        ['direction', 'pri']\n      ),\n\n    code:\n      findFox(\n        'sensor',\n        ['code', 'rrcr']\n      ),\n\n    ackRrcr:\n      findFox(\n        'sensor',\n        ['ack', 'rrcr']\n      ),\n\n    ackInverter:\n      findFox(\n        'sensor',\n        ['ack', 'onduleur']\n      ),\n\n    ackGrid:\n      findFox(\n        'sensor',\n        ['ack', 'reseau']\n      ),\n\n    reason:\n      findFox(\n        'sensor',\n        ['derniere', 'decision', 'pri']\n      ),\n\n    lastFrame:\n      findFox(\n        'sensor',\n        ['derniere', 'trame', 'energetique']\n      )\n  };\n\n\n  /* ============================================\n     VALEURS\n     ============================================ */\n\n  const pv =\n    Math.max(\n      numberOf(E.pv),\n      0\n    );\n\n  const gridExport =\n    Math.max(\n\
          \      numberOf(E.export),\n      0\n    );\n\n  const gridImport =\n    Math.max(\n      numberOf(E.import),\n      0\n    );\n\n  const current =\n    clamp(\n      numberOf(E.priCurrent, 100),\n      0,\n      100\n    );\n\n  const target =\n    clamp(\n      numberOf(E.priTarget, current),\n      0,\n      100\n    );\n\n  const ceiling =\n    Math.max(\n      numberOf(E.ceiling),\n      0\n    );\n\n  const ceilingUse =\n    clamp(\n      numberOf(E.ceilingUse),\n      0,\n      100\n    );\n\n  const state =\n    stateOf(\n      E.inverterState,\n      '—'\n    );\n\n  const direction =\n    stateOf(\n      E.direction,\n      'MAINTIEN'\n    );\n\n  const potential =\n    stateOf(\n      E.potential,\n      'STABLE'\n    );\n\n  const policy =\n    stateOf(\n      E.policy,\n      'Compensation'\n    );\n\n  const rrcrCode =\n    stateOf(\n      E.code,\n      '—'\n    );\n\n  const ackRrcr =\n    stateOf(\n      E.ackRrcr,\n      '—'\n    );\n\n  const ackInverter =\n    stateOf(\n      E.ackInverter,\n      '—'\n    );\n\n  const ackGrid =\n    stateOf(\n      E.ackGrid,\n      '—'\n    );\n\n  const reason =\n    stateOf(\n      E.reason,\n      'Aucune décision disponible.'\n    );\n\n  const lastFrame =\n    stateOf(\n      E.lastFrame,\n      '—'\n    );\n\n\n  /* ============================================\n     COULEURS\n     ============================================ */\n\n  const stateNorm =\n    norm(state);\n\n  let stateColor =\n    '#94a3b8';\n\n  if (\n    stateNorm.includes('liberation')\n  )\n    stateColor = '#35e59d';\n\n  else if (\n    stateNorm.includes('reduction')\n  )\n    stateColor = '#ff922b';\n\n  else if (\n    stateNorm.includes('maintien')\n  )\n    stateColor = '#19d8ff';\n\n  else if (\n    stateNorm.includes('invalide') ||\n    stateNorm.includes('failed')\n  )\n    stateColor = '#fb7185';\n\n\n  const potentialNorm =\n    norm(potential);\n\n  let potentialColor =\n    '#94a3b8';\n\n  if (\n    potentialNorm.includes('plus possible')\n  )\n    potentialColor = '#35e59d';\n\n  else if (\n    potentialNorm.includes('max solaire')\n  )\n    potentialColor = '#ff922b';\n\n  else\n    potentialColor = '#19d8ff';\n\n\n  const ackColor = (value) => {\n\n    const v =\n      norm(value);\n\n    if (v.includes('ok'))\n      return '#35e59d';\n\n    if (\n      v.includes('pending') ||\n      v.includes('attente')\n    )\n      return '#facc15';\n\n    if (\n      v.includes('failed') ||\n      v.includes('erreur')\n    )\n      return '#fb7185';\n\n    return '#64748b';\n  };\n\n\n  /* ============================================\n     RÉSEAU\n     ============================================ */\n\n  let gridState =\n    'ÉQUILIBRE';\n\n  let gridValue =\n    0;\n\n  let gridColor =\n    '#94a3b8';\n\n  let gridIcon =\n    'mdi:transmission-tower';\n\n  if (\n    gridExport > 30 &&\n    gridExport >= gridImport\n  ) {\n\n    gridState =\n      'RÉINJECTION';\n\n    gridValue =\n      gridExport;\n\n    gridColor =\n      '#35e59d';\n\n    gridIcon =\n      'mdi:transmission-tower-export';\n  }\n\n  else if (\n    gridImport > 30\n  ) {\n\n    gridState =\n      'PRÉLÈVEMENT';\n\n    gridValue =\n      gridImport;\n\n    gridColor =\n      '#fb7185';\n\n    gridIcon =\n      'mdi:transmission-tower-import';\n  }\n\n\n  return `\n\n    <style>\n\n      * {\n        box-sizing:border-box;\n      }\n\n      .wrap {\n        padding:22px;\n        color:#f8fafc;\n        font-family:\n          -apple-system,\n          BlinkMacSystemFont,\n          \"Segoe UI\",\n          Roboto,\n          sans-serif;\n      }\n\n      .header {\n        display:flex;\n        justify-content:space-between;\n        align-items:center;\n        gap:15px;\n        margin-bottom:17px;\n      }\n\n      .brand {\n        display:flex;\n        align-items:center;\n        gap:12px;\n      }\n\n      .logo {\n        width:48px;\n        height:48px;\n        display:flex;\n        align-items:center;\n        justify-content:center;\n        border-radius:15px;\n        color:#facc15;\n        background:rgba(250,204,21,.07);\n\
          \        border:1px solid rgba(250,204,21,.14);\n      }\n\n      .logo ha-icon {\n        --mdc-icon-size:27px;\n      }\n\n      .brand-small {\n        color:#19d8ff;\n        font-size:8px;\n        font-weight:900;\n        letter-spacing:2px;\n      }\n\n      .title {\n        margin-top:3px;\n        font-size:22px;\n        font-weight:950;\n      }\n\n      .subtitle {\n        margin-top:3px;\n        color:#64748b;\n        font-size:7px;\n      }\n\n      .state {\n        padding:8px 11px;\n        border-radius:13px;\n        font-size:8px;\n        font-weight:900;\n      }\n\n\n      /* NIVEAU PRI */\n\n      .pri-main {\n        display:grid;\n        grid-template-columns:1fr auto;\n        align-items:center;\n        gap:16px;\n        padding:17px;\n        border-radius:19px;\n        background:\n          linear-gradient(\n            135deg,\n            rgba(250,204,21,.06),\n            rgba(255,255,255,.016)\n          );\n        border:1px solid rgba(250,204,21,.12);\n      }\n\n      .small {\n        color:#64748b;\n        font-size:6px;\n        font-weight:900;\n        letter-spacing:.1em;\n      }\n\n      .pri-value {\n        margin-top:5px;\n        color:#facc15;\n        font-size:34px;\n        font-weight:950;\n      }\n\n      .target {\n        text-align:right;\n      }\n\n      .target span {\n        display:block;\n        color:#64748b;\n        font-size:6px;\n      }\n\n      .target strong {\n        display:block;\n        margin-top:4px;\n        font-size:19px;\n      }\n\n      .bar {\n        width:100%;\n        height:7px;\n        margin-top:12px;\n        overflow:hidden;\n        border-radius:10px;\n        background:rgba(255,255,255,.06);\n      }\n\n      .fill {\n        height:100%;\n        border-radius:10px;\n        background:\n          linear-gradient(\n            90deg,\n            #fb7185,\n            #facc15,\n            #35e59d\n          );\n      }\n\n\n      /* 4 KPI */\n\n      .grid4 {\n        display:grid;\n        grid-template-columns:repeat(4,minmax(0,1fr));\n        gap:8px;\n        margin-top:10px;\n      }\n\n      .box {\n        padding:13px;\n        min-width:0;\n        border-radius:15px;\n        background:rgba(255,255,255,.022);\n        border:1px solid rgba(255,255,255,.05);\n      }\n\n      .box-label {\n        color:#64748b;\n        font-size:6px;\n        font-weight:900;\n      }\n\n      .box-value {\n        margin-top:6px;\n        font-size:15px;\n        font-weight:950;\n      }\n\n      .box-sub {\n        margin-top:3px;\n        color:#475569;\n        font-size:6px;\n      }\n\n\n      /* PLAFOND */\n\n      .ceiling {\n        margin-top:10px;\n        padding:14px;\n        border-radius:16px;\n        background:rgba(25,216,255,.025);\n        border:1px solid rgba(25,216,255,.07);\n      }\n\n      .ceiling-head {\n        display:flex;\n        justify-content:space-between;\n        gap:10px;\n        align-items:center;\n      }\n\n      .ceiling-title {\n        color:#718096;\n        font-size:7px;\n        font-weight:900;\n      }\n\n      .ceiling-value {\n        color:#19d8ff;\n        font-size:14px;\n        font-weight:900;\n      }\n\n      .ceiling-bar {\n        height:6px;\n        margin-top:10px;\n        overflow:hidden;\n        border-radius:10px;\n        background:rgba(255,255,255,.055);\n      }\n\n      .ceiling-fill {\n        height:100%;\n        background:#19d8ff;\n      }\n\n      .potential {\n        margin-top:8px;\n        font-size:8px;\n        font-weight:900;\n      }\n\n\n      /* ACK */\n\n      .ack-grid {\n        display:grid;\n        grid-template-columns:repeat(3,minmax(0,1fr));\n        gap:8px;\n        margin-top:10px;\n      }\n\n      .ack {\n        padding:11px;\n        text-align:center;\n        border-radius:13px;\n        background:rgba(255,255,255,.018);\n        border:1px solid rgba(255,255,255,.045);\n      }\n\n      .ack span {\n        display:block;\n        color:#526174;\n        font-size:6px;\n        font-weight:900;\n\
          \      }\n\n      .ack strong {\n        display:block;\n        margin-top:4px;\n        font-size:10px;\n      }\n\n\n      /* DÉCISION */\n\n      .decision {\n        display:flex;\n        gap:11px;\n        align-items:flex-start;\n        margin-top:10px;\n        padding:14px;\n        border-radius:16px;\n        background:${stateColor}0b;\n        border:1px solid ${stateColor}20;\n      }\n\n      .decision-icon {\n        width:37px;\n        height:37px;\n        flex:none;\n        display:flex;\n        align-items:center;\n        justify-content:center;\n        border-radius:11px;\n        color:${stateColor};\n        background:${stateColor}0d;\n      }\n\n      .decision-icon ha-icon {\n        --mdc-icon-size:20px;\n      }\n\n      .decision-title {\n        color:${stateColor};\n        font-size:9px;\n        font-weight:900;\n      }\n\n      .decision-text {\n        margin-top:4px;\n        color:#94a3b8;\n        font-size:8px;\n        line-height:1.45;\n      }\n\n      .footer {\n        display:flex;\n        justify-content:space-between;\n        gap:10px;\n        margin-top:12px;\n        padding-top:10px;\n        border-top:1px solid rgba(255,255,255,.04);\n        color:#526174;\n        font-size:6px;\n      }\n\n      @media(max-width:700px) {\n\n        .wrap {\n          padding:16px;\n        }\n\n        .header {\n          align-items:flex-start;\n          flex-direction:column;\n        }\n\n        .grid4 {\n          grid-template-columns:repeat(2,minmax(0,1fr));\n        }\n\n        .ack-grid {\n          grid-template-columns:1fr;\n        }\n\n      }\n\n    </style>\n\n\n    <div class=\"wrap\">\n\n\n      <div class=\"header\">\n\n        <div class=\"brand\">\n\n          <div class=\"logo\">\n            <ha-icon icon=\"mdi:solar-power-variant\"></ha-icon>\n          </div>\n\n          <div>\n\n            <div class=\"brand-small\">\n              FOXCAT ENERGY V1.5.0\n            </div>\n\n            <div class=\"title\">\n              Onduleur\n            </div>\n\n            <div class=\"subtitle\">\n              EMS Onduleur · SolarEdge · RRCR\n            </div>\n\n          </div>\n\n        </div>\n\n\n        <div\n          class=\"state\"\n          style=\"\n            color:${stateColor};\n            background:${stateColor}0d;\n            border:1px solid ${stateColor}25;\n          \"\n        >\n          ${state}\n        </div>\n\n      </div>\n\n\n\n      <div class=\"pri-main\">\n\n        <div>\n\n          <div class=\"small\">\n            NIVEAU ONDULEUR ACTUEL\n          </div>\n\n          <div class=\"pri-value\">\n            ${Math.round(current)} %\n          </div>\n\n        </div>\n\n\n        <div class=\"target\">\n\n          <span>\n            CIBLE\n          </span>\n\n          <strong>\n            ${Math.round(target)} %\n          </strong>\n\n          <span style=\"margin-top:4px;color:${stateColor};\">\n            ${direction}\n          </span>\n\n        </div>\n\n      </div>\n\n\n      <div class=\"bar\">\n\n        <div\n          class=\"fill\"\n          style=\"width:${current}%;\">\n        </div>\n\n      </div>\n\n\n\n      <div class=\"grid4\">\n\n\n        <div class=\"box\">\n\n          <div class=\"box-label\">\n            PRODUCTION PV\n          </div>\n\n          <div\n            class=\"box-value\"\n            style=\"color:#ff922b;\"\n          >\n            ${fmtPower(pv)}\n          </div>\n\n          <div class=\"box-sub\">\n            production instantanée\n          </div>\n\n        </div>\n\n\n\n        <div class=\"box\">\n\n          <div class=\"box-label\">\n            PLAFOND ONDULEUR\n          </div>\n\n          <div\n            class=\"box-value\"\n            style=\"color:#facc15;\"\n          >\n            ${fmtPower(ceiling)}\n          </div>\n\n          <div class=\"box-sub\">\n            plafond calculé\n          </div>\n\n        </div>\n\n\n\n        <div class=\"box\">\n\n          <div class=\"box-label\">\n            RÉSEAU\n        \
          \  </div>\n\n          <div\n            class=\"box-value\"\n            style=\"color:${gridColor};\"\n          >\n            ${fmtPower(gridValue)}\n          </div>\n\n          <div class=\"box-sub\">\n            ${gridState}\n          </div>\n\n        </div>\n\n\n\n        <div class=\"box\">\n\n          <div class=\"box-label\">\n            CODE RRCR\n          </div>\n\n          <div class=\"box-value\">\n            ${rrcrCode}\n          </div>\n\n          <div class=\"box-sub\">\n            commande relais\n          </div>\n\n        </div>\n\n\n      </div>\n\n\n\n      <div class=\"ceiling\">\n\n        <div class=\"ceiling-head\">\n\n          <div>\n\n            <div class=\"ceiling-title\">\n              UTILISATION DU PLAFOND ONDULEUR\n            </div>\n\n          </div>\n\n          <div class=\"ceiling-value\">\n            ${Math.round(ceilingUse)} %\n          </div>\n\n        </div>\n\n\n        <div class=\"ceiling-bar\">\n\n          <div\n            class=\"ceiling-fill\"\n            style=\"width:${ceilingUse}%;\">\n          </div>\n\n        </div>\n\n\n        <div\n          class=\"potential\"\n          style=\"color:${potentialColor};\"\n        >\n          ${potential}\n        </div>\n\n      </div>\n\n\n\n      <div class=\"grid4\">\n\n\n        <div class=\"box\">\n\n          <div class=\"box-label\">\n            POLITIQUE RÉSEAU\n          </div>\n\n          <div\n            class=\"box-value\"\n            style=\"font-size:11px;color:#a78bfa;\"\n          >\n            ${policy}\n          </div>\n\n        </div>\n\n\n        <div class=\"box\">\n\n          <div class=\"box-label\">\n            IMPORT\n          </div>\n\n          <div\n            class=\"box-value\"\n            style=\"color:#fb7185;\"\n          >\n            ${fmtPower(gridImport)}\n          </div>\n\n        </div>\n\n\n        <div class=\"box\">\n\n          <div class=\"box-label\">\n            RÉINJECTION\n          </div>\n\n          <div\n            class=\"box-value\"\n            style=\"color:#35e59d;\"\n          >\n            ${fmtPower(gridExport)}\n          </div>\n\n        </div>\n\n\n        <div class=\"box\">\n\n          <div class=\"box-label\">\n            DIRECTION\n          </div>\n\n          <div\n            class=\"box-value\"\n            style=\"font-size:11px;color:${stateColor};\"\n          >\n            ${direction}\n          </div>\n\n        </div>\n\n      </div>\n\n\n\n      <div class=\"ack-grid\">\n\n\n        <div class=\"ack\">\n\n          <span>\n            ACK RRCR\n          </span>\n\n          <strong\n            style=\"color:${ackColor(ackRrcr)};\"\n          >\n            ${ackRrcr}\n          </strong>\n\n        </div>\n\n\n        <div class=\"ack\">\n\n          <span>\n            ACK ONDULEUR\n          </span>\n\n          <strong\n            style=\"color:${ackColor(ackInverter)};\"\n          >\n            ${ackInverter}\n          </strong>\n\n        </div>\n\n\n        <div class=\"ack\">\n\n          <span>\n            ACK RÉSEAU\n          </span>\n\n          <strong\n            style=\"color:${ackColor(ackGrid)};\"\n          >\n            ${ackGrid}\n          </strong>\n\n        </div>\n\n\n      </div>\n\n\n\n      <div class=\"decision\">\n\n        <div class=\"decision-icon\">\n\n          <ha-icon icon=\"mdi:brain\"></ha-icon>\n\n        </div>\n\n\n        <div>\n\n          <div class=\"decision-title\">\n            DÉCISION EMS ONDULEUR\n          </div>\n\n          <div class=\"decision-text\">\n            ${reason}\n          </div>\n\n        </div>\n\n      </div>\n\n\n\n      <div class=\"footer\">\n\n        <span>\n          EMS CORE ↔ EnergyBus ↔ EMS Onduleur\n        </span>\n\n        <span>\n          Dernière trame · ${lastFrame}\n        </span>\n\n      </div>\n\n\n    </div>\n\n  `;\n]]]\n"
