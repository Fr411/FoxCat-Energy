                        <div class="row"><span class="k">${S('sensor.foxcat_energy_tarification_libelle_prix_actif','Tarif actif')}</span><b>${f3(N('sensor.foxcat_energy_tarification_prix_d_achat_actif'))} €/kWh</b></div>
                        <div class="row"><span class="k">${S('sensor.foxcat_energy_tarification_libelle_prix_suivant','Tarif suivant')}</span><b>${f3(N('sensor.foxcat_energy_tarification_prix_d_achat_suivant'))} €/kWh</b></div>
                        <div class="row"><span class="k">Économie solaire</span><b class="gr">${e(N('sensor.foxcat_energy_tarification_pv_gain_solaire_estime_aujourdhui'))}</b></div>
                        <div class="row"><span class="k">Décision économique</span><b>${S('sensor.foxcat_energy_tarification_decision_economique_ems')}</b></div></div>`;
