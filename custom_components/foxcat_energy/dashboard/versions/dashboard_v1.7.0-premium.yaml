                      color: '#ff922b'
                      float_precision: 3
                      data_generator: >
                        const hpState =
                        hass.states['sensor.foxcat_energy_tarification_prix_heures_pleines_hp']?.state;
                        const hcState =
                        hass.states['sensor.foxcat_energy_tarification_prix_heures_creuses_hc']?.state;
                        if (!hpState || !hcState ||
                        !Number.isFinite(Number(hpState)) ||
                        !Number.isFinite(Number(hcState))) return []; const hp =
                        Number(hpState); const start = new Date();
                        start.setHours(0,0,0,0); const data = []; for (let i =
                        0; i <= 96; i++) {
                          const d = new Date(start.getTime() + i * 30 * 60000);
                          const h = d.getHours();
                          const isHC = h >= 22 || h < 7 || (h >= 11 && h < 17);
                          data.push([d.getTime(), isHC ? null : hp]);
                        } return data;
                    - entity: sensor.foxcat_energy_tarification_prix_heures_creuses_hc
                      name: Tarif HC
                      type: line
                      color: '#19d8ff'
                      float_precision: 3
                      data_generator: >
                        const hpState =
                        hass.states['sensor.foxcat_energy_tarification_prix_heures_pleines_hp']?.state;
                        const hcState =
                        hass.states['sensor.foxcat_energy_tarification_prix_heures_creuses_hc']?.state;
                        if (!hpState || !hcState ||
                        !Number.isFinite(Number(hpState)) ||
                        !Number.isFinite(Number(hcState))) return []; const hc =
                        Number(hcState); const start = new Date();
                        start.setHours(0,0,0,0); const data = []; for (let i =
                        0; i <= 96; i++) {
                          const d = new Date(start.getTime() + i * 30 * 60000);
                          const h = d.getHours();
                          const isHC = h >= 22 || h < 7 || (h >= 11 && h < 17);
                          data.push([d.getTime(), isHC ? hc : null]);
                        } return data;
                - type: custom:button-card
