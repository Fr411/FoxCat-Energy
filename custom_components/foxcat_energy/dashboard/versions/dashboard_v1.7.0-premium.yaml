                              <div style="font-size:12px;color:#38bdf8;font-weight:900;margin-bottom:12px">BILAN JOURNALIER</div>
                              <div style="display:flex;justify-content:space-between;padding:10px 0;color:#94a3b8;font-size:12px">Prélèvement <b style="color:#fb7185">${fmt(imp,' kWh')}</b></div>
                              <div style="display:flex;justify-content:space-between;padding:10px 0;color:#94a3b8;font-size:12px">Réinjection <b style="color:#35e59d">${fmt(exp,' kWh')}</b></div>
                              <div style="display:flex;justify-content:space-between;padding:14px 0 0;border-top:1px solid #ffffff12;color:white;font-size:12px">Coût net <b style="color:#38bdf8;font-size:20px">${fmt(cost,' €')}</b></div>
                            </div>
                            <div style="padding:18px;border:1px solid #ffffff12;border-radius:16px">
                              <div style="font-size:12px;color:#a78bfa;font-weight:900;margin-bottom:12px">CRÉNEAUX MACHINES</div>
                              <div style="display:flex;justify-content:space-between;padding:10px 0;color:#94a3b8;font-size:12px">Lave-linge <b style="color:white">Désactivé</b></div>
                              <div style="display:flex;justify-content:space-between;padding:10px 0;color:#94a3b8;font-size:12px">Sèche-linge <b style="color:white">Désactivé</b></div>
                              <div style="display:flex;justify-content:space-between;padding:10px 0;color:#94a3b8;font-size:12px">Lave-vaisselle <b style="color:white">Désactivé</b></div>
