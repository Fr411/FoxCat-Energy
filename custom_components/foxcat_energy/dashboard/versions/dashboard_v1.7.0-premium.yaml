                        [[[
                          const N=(i)=>{const v=parseFloat(states[i]?.state);return isFinite(v)&&v>0?v:0};
                          const d=[
                            ['Production PV',N('sensor.foxcat_energy_energie_pv_production_aujourdhui'),'#ffb020'],
                            ['Consommation',N('sensor.foxcat_energy_energie_maison_consommation_aujourdhui'),'#38bdf8'],
                            ['Réseau',N('sensor.foxcat_energy_energie_maison_prelevement_reseau_aujourdhui'),'#f87171'],
                            ['Autoconsommé',N('sensor.foxcat_energy_energie_pv_energie_autoconsommee_aujourdhui'),'#34d399'],
                            ['Réinjection',N('sensor.foxcat_energy_energie_pv_reinjection_aujourdhui'),'#a7f3d0']
                          ];
