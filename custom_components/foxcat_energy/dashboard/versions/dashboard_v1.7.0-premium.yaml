kiosk_mode:
  hide_header: '{{ is_state("[[foxcat:legacy.input_boolean_ems_head_menu]]", "on") }}'
  hide_sidebar: '{{ is_state("[[foxcat:legacy.input_boolean_ems_head_lateral]]", "on") }}'
button_card_templates:
  fc_panel:
    show_name: false
    show_icon: false
    show_state: false
    triggers_update: all
    tap_action:
      action: none
    hold_action:
      action: none
    styles:
      card:
        - padding: 0
        - border-radius: 18px
        - overflow: hidden
        - color: '#e8f1fb'
        - background: linear-gradient(160deg,#0d1a2c,#08111e)
        - border: 1px solid rgba(90,150,220,.18)
        - box-shadow: 0 10px 30px rgba(0,0,0,.35)
      grid:
        - grid-template-areas: '"c"'
        - grid-template-columns: 1fr
      custom_fields:
        c:
          - width: 100%
    extra_styles: >
      .p{padding:16px 18px;font-family:-apple-system,"Segoe
      UI",Roboto,sans-serif;text-align:left;box-sizing:border-box}

      .t{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:15px;font-weight:700;margin-bottom:12px}

      .t small{font-weight:400;color:#8fa6bf;font-size:12px}

      .t ha-icon{--mdc-icon-size:20px;color:#38bdf8;margin-right:6px}

      .g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

      .g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

      .tile{display:flex;align-items:center;gap:10px;padding:10px
      12px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid
      rgba(255,255,255,.06)}

      .tile ha-icon{--mdc-icon-size:26px;flex:none}

      .tile span{display:block;font-size:11px;color:#9bb3cc}

      .tile b{font-size:17px}

      .stat{padding:9px
      6px;border-radius:12px;background:rgba(255,255,255,.04);text-align:center}

      .stat span{display:block;font-size:10px;color:#8fa6bf}

      .stat b{display:block;font-size:14px;margin-top:3px}

      .k{font-size:11px;color:#8fa6bf}

      .v{font-size:20px;font-weight:800}

      .bar{height:5px;border-radius:5px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:8px}

      .bar i{display:block;height:100%;border-radius:5px}

      .chip{display:inline-block;padding:3px
      9px;border-radius:7px;font-size:11px;font-weight:600}

      .row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px
      0;font-size:13px;border-top:1px solid rgba(255,255,255,.05)}

      .dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:8px}

      .o{color:#ffb020}.b{color:#38bdf8}.r{color:#f87171}.gr{color:#34d399}.pu{color:#a78bfa}

      .ring{border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}

      .ring>div{border-radius:50%;background:#0b1626;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800}

      .ring small{font-size:9px;color:#8fa6bf;font-weight:400}

      .flux{display:grid;grid-template-columns:1fr 54px 1fr 54px
      1fr;align-items:center;text-align:center;gap:6px}

      .n ha-icon{--mdc-icon-size:34px}

      .n b{display:block;font-size:20px;font-weight:800}

      .n span{font-size:11px;color:#9bb3cc}

      .ar{font-size:28px;font-weight:300}

      .img{height:96px;background-size:contain;background-repeat:no-repeat;background-position:center}

      .seg{display:flex;height:9px;border-radius:9px;overflow:hidden;margin:8px
      0 10px}

      .legend{display:flex;justify-content:space-between;font-size:11px}

      .legend b{display:block;font-size:15px;color:#fff}

      .legend span{color:#8fa6bf}

      .quote{font-style:italic;color:#8fa6bf;font-size:12px;text-align:right;margin-top:10px}
  fc_nav:
    show_name: true
    show_icon: true
    variables:
      path: ''
    tap_action:
      action: navigate
      navigation_path: |
        [[[
          const base = window.location.pathname.replace(/\/[^\/]*$/, '');
          return `${base}/${variables.path}`;
        ]]]
    styles:
      card:
        - padding: 11px 6px
        - border-radius: 12px
        - background: >
            [[[ return
            location.pathname.toLowerCase().endsWith('/'+variables.path.toLowerCase())
            ? 'rgba(56,189,248,.12)' : 'rgba(255,255,255,.03)'; ]]]
        - border: >
            [[[ return
            location.pathname.toLowerCase().endsWith('/'+variables.path.toLowerCase())
            ? '1px solid rgba(56,189,248,.6)' : '1px solid
            rgba(255,255,255,.07)'; ]]]
        - color: >
            [[[ return
            location.pathname.toLowerCase().endsWith('/'+variables.path.toLowerCase())
            ? '#38bdf8' : '#c4d4e6'; ]]]
      grid:
        - grid-template-areas: '"i n"'
        - grid-template-columns: auto auto
        - justify-content: center
        - column-gap: 7px
      icon:
        - width: 18px
        - color: >
            [[[ return
            location.pathname.toLowerCase().endsWith('/'+variables.path.toLowerCase())
            ? '#38bdf8' : '#8fa6bf'; ]]]
      name:
        - font-size: 12px
        - font-weight: 600
  fc_navbar:
    show_name: false
    show_icon: false
    show_state: false
    styles:
      card:
        - padding: 0
        - background: transparent
        - box-shadow: none
        - border: none
      grid:
        - grid-template-areas: '"a b c d e f g h"'
        - grid-template-columns: repeat(8,1fr)
        - column-gap: 8px
    custom_fields:
      a:
        card:
          type: custom:button-card
          template: fc_nav
          name: Accueil
          icon: mdi:home
          variables:
            path: Emsdash
      b:
        card:
          type: custom:button-card
          template: fc_nav
          name: Énergie
          icon: mdi:lightning-bolt
          variables:
            path: energie
      c:
        card:
          type: custom:button-card
          template: fc_nav
          name: Onduleur
          icon: mdi:solar-power
          variables:
            path: onduleur
      d:
        card:
          type: custom:button-card
          template: fc_nav
          name: Boiler
          icon: mdi:water-boiler
          variables:
            path: boiler
      e:
        card:
          type: custom:button-card
          template: fc_nav
          name: Machines
          icon: mdi:washing-machine
          variables:
            path: appareils
      f:
        card:
          type: custom:button-card
          template: fc_nav
          name: Économie
          icon: mdi:chart-timeline-variant-shimmer
          variables:
            path: marche
      g:
        card:
          type: custom:button-card
          template: fc_nav
          name: Diagnostic
          icon: mdi:stethoscope
          variables:
            path: diagnostic
      h:
        card:
          type: custom:button-card
          template: fc_nav
          name: Paramètres
          icon: mdi:cog
          variables:
            path: technique
  fc_head:
    template: fc_panel
    variables:
      title: ''
      subtitle: ''
      icon: mdi:home
      color: '#38bdf8'
    custom_fields:
      c: |
        [[[
          return `<div class="p" style="display:flex;align-items:center;gap:14px;padding:14px 20px">
            <div class="ring" style="width:46px;height:46px;background:rgba(56,189,248,.12)"><ha-icon icon="${variables.icon}" style="color:${variables.color}"></ha-icon></div>
            <div><div style="font-size:22px;font-weight:800;letter-spacing:.03em">${variables.title}</div>
            <div class="k">${variables.subtitle}</div></div>
            <div style="margin-left:auto;font-weight:800;letter-spacing:.04em"><span style="color:#38bdf8">FOX</span>CAT <span style="font-weight:500">ENERGY</span></div>
          </div>`;
        ]]]
  fc_list:
    template: fc_panel
    variables:
      title: ''
      icon: mdi:information
      rows: []
    custom_fields:
      c: |
        [[[
          const fmt=id=>{const s=states[id];if(!s)return ['—','#64748b'];const v=s.state;
            if(['unknown','unavailable','none',''].includes(v))return ['—','#64748b'];
            if(v==='on')return ['Actif','#34d399'];
            if(v==='off')return ['Inactif','#8fa6bf'];
            if(!isNaN(Number(v))){const n=Number(v),u=s.attributes.unit_of_measurement||'';return [(Number.isInteger(n)?n:n.toFixed(2).replace('.',','))+(u?' '+u:''),''];}
            return [v,''];};
          const rows=(variables.rows||[]).map(r=>{const f=fmt(r[1]);
            return `<div class="row"><span class="k" style="font-size:12px">${r[0]}</span><b style="font-size:13px;text-align:right;max-width:58%;${f[1]?'color:'+f[1]:''}">${f[0]}</b></div>`}).join('');
          return `<div class="p"><div class="t"><span><ha-icon icon="${variables.icon}"></ha-icon>${variables.title}</span></div>${rows}</div>`;
        ]]]
  fc_btn:
    show_name: true
    show_icon: true
    styles:
      card:
        - padding: 12px 6px
        - border-radius: 12px
        - background: rgba(255,255,255,.04)
        - border: 1px solid rgba(255,255,255,.08)
        - color: '#e8f1fb'
      icon:
        - width: 22px
        - color: '#ffb020'
      name:
        - font-size: 12px
        - font-weight: 700
  fc_device:
    template: fc_panel
    variables:
      name: ''
      sub: Charge pilotée EMS
      emoji: ⚙️
      col: '#38bdf8'
      cy: ''
      pw: ''
      sw: ''
    tap_action:
      action: toggle
    hold_action:
      action: more-info
    custom_fields:
      c: |
        [[[
          const v=variables;
          const pw=Math.max(parseFloat(states[v.pw]?.state)||0,0);
          const cyc=states[v.cy]?.state==='on';
          const sock=states[v.sw]?.state==='on';
          let st='ARRÊT',col='#64748b';
          if(cyc||pw>20){st=cyc?'EN COURS':'EN MARCHE';col='#34d399'}else if(sock){st='PRÊT';col='#facc15'}
          return `<div class="p" style="text-align:center;height:250px;display:flex;flex-direction:column;align-items:center;justify-content:center">
            <div class="ring" style="width:54px;height:54px;border-radius:17px;background:${v.col}22;font-size:28px">${v.emoji}</div>
            <div style="margin-top:10px;font-size:10px;font-weight:800;color:${col}"><span class="dot" style="background:${col};width:7px;height:7px;margin-right:5px;${cyc||pw>20?'box-shadow:0 0 9px '+col:''}"></span>${st}</div>
            <div style="font-size:19px;font-weight:800;margin-top:6px">${v.name}</div>
            <div class="k">${v.sub}</div>
            <div class="stat" style="width:88%;margin-top:12px;padding:12px 6px"><b style="font-size:28px">${Math.round(pw)}<span style="font-size:11px;opacity:.5"> W</span></b><span>PUISSANCE ACTUELLE</span></div>
            <div class="k" style="margin-top:10px;font-size:11px">${sock?'⚡ Prise active':'○ Prise coupée'}</div>
          </div>`;
        ]]]
views:
  - type: panel
    title: Accueil
    path: Emsdash
    icon: mdi:home
    cards:
      - type: vertical-stack
        cards:
          - type: custom:button-card
            template: fc_panel
            styles:
              card:
                - border-radius: 18px 18px 0 0
            custom_fields:
              c: |
                [[[
                  const OUTDOOR = 'weather.momignies'; // <- adapte ton entité météo
                  const d = new Date();
                  const date = d.toLocaleDateString('fr-BE',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
                  const time = d.toLocaleTimeString('fr-BE',{hour:'2-digit',minute:'2-digit'});
                  const temp = states[OUTDOOR]?.attributes?.temperature;
                  return `
                  <div class="p" style="display:flex;align-items:center;justify-content:space-between;padding:12px 20px">
                    <div style="display:flex;align-items:center;gap:12px">
                      <div class="img" style="width:44px;height:44px;background-image:url(/homeassistant/custom_components/foxcat_energy/dashboard/assets/hero_house.webp)"></div>
                      <div>
                        <div style="font-size:20px;font-weight:800;letter-spacing:.04em"><span style="color:#38bdf8">FOX</span>CAT <span style="font-weight:500">ENERGY</span></div>
                        <div class="k">Home Assistant • EMS intelligent</div>
                      </div>
                    </div>
                    <div style="display:flex;align-items:center;gap:28px">
                      <div style="text-align:right"><div class="k">${date}</div><div style="font-size:20px;font-weight:600">${time}</div></div>
                      <div style="text-align:right"><div style="font-size:18px;font-weight:700"><span class="o">☀</span> ${temp!==undefined?Number(temp).toFixed(1).replace('.',','):'—'} °C</div><div class="k">Extérieur</div></div>
                    </div>
                  </div>`;
                ]]]
          - type: custom:button-card
            template: fc_navbar
          - type: custom:button-card
            template: fc_panel
            styles:
              card:
                - border-radius: 0
                - min-height: 170px
                - background: >
                    linear-gradient(90deg,rgba(6,13,24,.95),rgba(6,13,24,.35)
                    55%,rgba(6,13,24,.9)),

                    url('/foxcat_energy_assets/hero.jpg') center/cover,

                    linear-gradient(160deg,#0d1a2c,#08111e)
            custom_fields:
              c: |
                [[[
                  const nm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
                  const F=(d,w)=>Object.keys(states).find(i=>{if(!i.startsWith(d+'.'))return false;const t=nm(i+' '+(states[i].attributes.friendly_name||''));return t.includes('foxcat energy')&&w.every(x=>t.includes(nm(x)))})||null;
                  const S=(i,f='—')=>{if(!i||!states[i])return f;const v=states[i].state;return ['unknown','unavailable','none',''].includes(v)?f:v};
                  const N=(i,f=0)=>{const v=parseFloat(S(i,''));return isFinite(v)?v:f};
                  const regOn=states['switch.foxcat_energy_ems_regulation_foxcat_active']?.state==='on';
                  const valid=states[F('binary_sensor',['donnees','energetiques','valides'])]?.state!=='off';
                  const ok=regOn&&valid;
                  const mode=S('select.foxcat_energy_ems_mode_ems');
                  const period=S(F('sensor',['periode','tarifaire']));
                  const price=N('sensor.foxcat_energy_tarification_prix_d_achat_actif').toFixed(3).replace('.',',');
                  const nextLbl=S('sensor.foxcat_energy_tarification_libelle_prix_suivant','Prochain tarif');
                  const nextP=N('sensor.foxcat_energy_tarification_prix_d_achat_suivant').toFixed(3).replace('.',',');
                  const col=ok?'#34d399':'#f87171';
                  return `
                  <div class="p" style="display:flex;justify-content:space-between;min-height:140px">
                    <div style="align-self:center">
                      <div style="font-size:38px;font-weight:800;letter-spacing:.03em"><span style="color:#67e8f9">FOXCAT</span> ENERGY</div>
                      <div style="font-size:17px;margin-top:6px;line-height:1.35">Une énergie plus intelligente<br>pour une maison plus durable</div>
                      <div class="k" style="margin-top:12px;font-size:13px;color:#cfe0f2"><span class="gr">🍃</span> Optimiser aujourd'hui.<br>&nbsp;&nbsp;&nbsp;&nbsp;Préserver demain.</div>
                    </div>
                    <div style="display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end">
                      <div style="display:flex;gap:26px">
                        <div style="display:flex;gap:9px"><span class="dot" style="background:${col};box-shadow:0 0 10px ${col};margin-top:5px"></span><div><b>${ok?'Système OK':'Attention'}</b><div class="k">${ok?'Tout fonctionne normalement':'Vérifier le diagnostic'}</div></div></div>
                        <div style="display:flex;gap:9px"><span class="gr" style="font-size:20px">🍃</span><div><b>Mode EMS</b><div class="k">${mode}</div></div></div>
                        <div style="display:flex;gap:9px"><span class="o" style="font-size:20px">🪙</span><div><b>Tarif actuel</b><div class="k">${period}<br><b style="color:#fff">${price} €/kWh</b></div></div></div>
                        <div style="display:flex;gap:9px"><span class="b" style="font-size:20px">🕒</span><div><b>${nextLbl}</b><div class="k"><b style="color:#fff">${nextP} €/kWh</b></div></div></div>
                      </div>
                      <div class="quote">« L'énergie la plus propre<br>est celle qu'on utilise intelligemment. »</div>
                    </div>
                  </div>`;
                ]]]
          - square: false
            type: grid
            columns: 3
            cards:
              - type: custom:button-card
                template: fc_panel
                custom_fields:
                  c: |
                    [[[
                      // 1. Outils et normalisation
                      const nm = s => String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
                      const F = (d, w) => Object.keys(states).find(i => {
                        if (!i.startsWith(d + '.')) return false;
                        const t = nm(i + ' ' + (states[i].attributes.friendly_name || ''));
                        return t.includes('foxcat energy') && w.every(x => t.includes(nm(x)));
                      }) || null;
                      
                      const S = (i, f = '—') => {
                        if (!i || !states[i]) return f;
                        const v = states[i].state;
                        return ['unknown', 'unavailable', 'none', ''].includes(v) ? f : v;
                      };
                      
                      const N = (i, f = 0) => {
                        const v = parseFloat(S(i, ''));
                        return isFinite(v) ? v : f;
                      };
                      
                      const W = (v, decimals = 2) => {
                        v = Math.abs(v);
                        return v >= 1000 ? (v / 1000).toFixed(decimals).replace('.', ',') + ' kW' : Math.round(v) + ' W';
                      };

                      // 2. Récupération des données FoxCat
                      const pv = Math.max(N('sensor.foxcat_energy_energie_puissance_de_production_photovoltaique'), 0);
                      const house = Math.max(N('sensor.foxcat_energy_energie_puissance_de_consommation_maison'), 0);
                      const imp = Math.max(N('sensor.foxcat_energy_energie_puissance_prelevee_au_reseau'), 0);
                      const exp = Math.max(N('sensor.foxcat_energy_energie_puissance_reinjectee_au_reseau'), 0);
                      
                      const priId = F('sensor', ['niveau', 'puissance', 'pri', 'actuel']);
                      const pri = N(priId, 100);
                      
                      const bT = N('[[foxcat:boiler.temperature_source]]');
                      const bP = Math.max(N('sensor.foxcat_energy_boiler_source_securite_thermique'), 0);

                      // 3. Logique d'état des flux
                      const hasImport = imp > 20;
                      const hasExport = exp > 20;
                      const hasSolar = pv > 20;

                      // 4. Rendu HTML & CSS
                      return `
                        <style>
                          .fc-flux-container {
                            width: 100%;
                            padding: 10px 5px;
                            color: #f8fafc;
                            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                          }
                          .fc-header {
                            display: flex;
                            align-items: center;
                            gap: 10px;
                            margin-bottom: 25px;
                            font-size: 14px;
                            font-weight: 800;
                            color: #ffffff;
                          }
                          .fc-header ha-icon {
                            color: #19d8ff;
                            --mdc-icon-size: 22px;
                          }
                          .fc-grid {
                            display: grid;
                            grid-template-columns: 1fr 40px 1fr 40px 1fr;
                            grid-template-rows: auto auto auto;
                            gap: 20px 0;
                            align-items: center;
                            justify-items: center;
                            position: relative;
                          }
                          
                          /* Noeuds */
                          .node {
                            display: flex;
                            flex-direction: column;
                            align-items: center;
                            text-align: center;
                            z-index: 2;
                          }
                          .node ha-icon {
                            --mdc-icon-size: 34px;
                            margin-bottom: 6px;
                          }
                          .node .img-wrapper {
                            height: 60px;
                            width: 60px;
                            background-size: contain;
                            background-repeat: no-repeat;
                            background-position: center;
                            margin-bottom: 6px;
                            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.4));
                          }
                          .lbl { font-size: 9px; font-weight: 800; letter-spacing: 1px; opacity: 0.6; text-transform: uppercase; }
                          .val { font-size: 18px; font-weight: 900; margin-top: 4px; line-height: 1; }
                          .sub { font-size: 9px; opacity: 0.5; margin-top: 4px; font-weight: bold; }
                          
                          /* Couleurs Spécifiques et Glow */
                          .c-solar { color: #ff982f; }
                          .c-solar ha-icon { filter: drop-shadow(0 0 10px rgba(255,152,47,0.5)); }
                          
                          .c-house { color: #21d7ff; }
                          .c-house ha-icon { filter: drop-shadow(0 0 10px rgba(33,215,255,0.5)); }
                          
                          .c-import { color: #fb7185; }
                          .c-import ha-icon { filter: drop-shadow(0 0 10px rgba(251,113,133,0.5)); }
                          
                          .c-export { color: #35e59d; }
                          .c-export ha-icon { filter: drop-shadow(0 0 10px rgba(53,229,157,0.5)); }
                          
                          .c-neutral { color: #cbd5e1; }
                          
                          /* Placement sur la Grille */
                          .n-solar { grid-column: 3; grid-row: 1; }
                          .n-import { grid-column: 1; grid-row: 2; }
                          .n-house { grid-column: 3; grid-row: 2; }
                          .n-export { grid-column: 5; grid-row: 2; }
                          .n-inverter { grid-column: 1; grid-row: 3; }
                          .n-boiler { grid-column: 5; grid-row: 3; }
                          
                          /* Flèches et Lignes */
                          .arrow-h {
                            grid-row: 2;
                            width: 100%;
                            display: flex;
                            align-items: center;
                            justify-content: center;
                            font-size: 24px;
                            font-weight: bold;
                            opacity: 0.2;
                            transition: all 0.3s ease;
                          }
                          .arrow-v {
                            grid-column: 3;
                            grid-row: 1 / 3;
                            width: 2px;
                            height: 100%;
                            background: rgba(255, 152, 47, 0.2);
                            z-index: 1;
                            border-radius: 2px;
                          }
                          
                          /* Animations de Flux */
                          @keyframes pulse-flow {
                            0% { transform: scale(0.95) translateX(-2px); opacity: 0.5; }
                            50% { transform: scale(1.1) translateX(2px); opacity: 1; }
                            100% { transform: scale(0.95) translateX(-2px); opacity: 0.5; }
                          }
                          .active-imp { color: #fb7185; opacity: 1; animation: pulse-flow 1.5s infinite ease-in-out; }
