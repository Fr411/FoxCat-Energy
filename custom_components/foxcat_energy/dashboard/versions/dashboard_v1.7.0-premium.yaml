                            gap: 10px;
                            font-size: 15px;
                            font-weight: 800;
                            color: #ffffff;
                            letter-spacing: 0.02em;
                          }
                          .prem-title ha-icon {
                            color: #19d8ff;
                            --mdc-icon-size: 22px;
                            filter: drop-shadow(0 0 8px rgba(25,216,255,0.4));
                          }
                          .prem-chip {
                            display: flex;
                            align-items: center;
                            gap: 6px;
                            padding: 5px 10px;
                            border-radius: 12px;
                            font-size: 9px;
                            font-weight: 900;
                            letter-spacing: 0.05em;
                            border: 1px solid transparent;
                          }
                          .prem-dot {
                            width: 6px;
                            height: 6px;
                            border-radius: 50%;
                          }
                          
