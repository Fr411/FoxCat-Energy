                      return `<div class="p"><div class="t"><span><ha-icon icon="mdi:thermometer"></ha-icon>Chauffage & climatisation</span><span class="chip" style="color:#c4b5fd;background:rgba(196,181,253,.12)">Mode ${mode}</span></div><div class="g3">${cells}</div></div>`;
                    ]]]
