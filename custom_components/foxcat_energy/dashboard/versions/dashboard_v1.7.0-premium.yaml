                            <div class="seg">${d.map(x=>`<i style="width:${x[1]/tot*100}%;background:${x[2]}"></i>`).join('')}</div>
                            <div class="legend">${d.map(x=>`<div><b>${x[1].toFixed(2).replace('.',',')}</b><span>${x[0]}</span></div>`).join('')}</div>
                          </div>`;
