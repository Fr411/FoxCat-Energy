                              1px solid rgba(255,255,255,.06);

                            box-shadow:
                              inset 0 1px 0 rgba(255,255,255,.025);
                          }


                          .device-card::before {

                            content:"";

                            display:block;

                            height:2px;

                            margin:
                              -16px
                              -16px
                              14px;

                            background:
                              linear-gradient(
                                90deg,
                                var(--device),
                                transparent 80%
                              );

                            opacity:.8;
                          }


                          /* =====================================================
                             HEADER APPAREIL
                             ===================================================== */

                          .device-header {

                            display:flex;

                            align-items:flex-start;

                            justify-content:space-between;

                            gap:10px;
                          }


                          .device-name-block {

                            display:flex;

                            align-items:center;

                            gap:10px;

                            min-width:0;
