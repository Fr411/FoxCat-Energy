                            width:46px;

                            height:46px;

                            flex:none;

                            display:flex;

                            align-items:center;

                            justify-content:center;

                            border-radius:14px;

                            color:#19d8ff;

                            background:
                              linear-gradient(
                                135deg,
                                rgba(255,146,43,.10),
                                rgba(25,216,255,.10)
                              );

                            border:
                              1px solid rgba(255,255,255,.08);
                          }


                          .logo ha-icon {
                            --mdc-icon-size:25px;
                          }


                          .brand-name {

                            color:#19d8ff;

                            font-size:9px;

                            font-weight:900;

                            letter-spacing:2px;
                          }


                          .title {

                            margin-top:4px;

                            font-size:23px;

                            font-weight:900;
                          }


                          .subtitle {

                            margin-top:3px;

                            color:#64748b;

                            font-size:8px;
                          }


                          .count {

                            padding:8px 10px;

                            border-radius:13px;

                            color:#35e59d;

                            background:
                              rgba(53,229,157,.06);

                            border:
                              1px solid rgba(53,229,157,.14);

                            font-size:8px;

                            font-weight:900;

                            white-space:nowrap;
                          }


                          /* =====================================================
                             CONTEXTE
                             ===================================================== */

                          .context {

                            display:grid;

                            grid-template-columns:
                              repeat(
                                4,
                                minmax(0,1fr)
                              );

                            gap:8px;

                            margin-bottom:10px;
                          }


                          .context-box {

                            min-width:0;

                            padding:11px 12px;

                            border-radius:14px;

                            background:
                              rgba(255,255,255,.02);

                            border:
                              1px solid rgba(255,255,255,.045);
                          }


                          .context-box span {

                            display:block;

                            color:#526174;

                            font-size:6px;

                            font-weight:900;

                            letter-spacing:.08em;
                          }


                          .context-box strong {

                            display:block;

                            margin-top:4px;

                            color:#dbe5f1;

                            font-size:9px;

                            white-space:nowrap;

                            overflow:hidden;

                            text-overflow:ellipsis;
                          }


                          /* =====================================================
                             RÉSUMÉ
                             ===================================================== */

                          .summary {

                            display:grid;

                            grid-template-columns:
                              repeat(
                                4,
                                minmax(0,1fr)
                              );

                            gap:8px;

                            margin-bottom:13px;
                          }


                          .summary-box {

                            padding:13px 14px;

                            border-radius:16px;

                            background:
                              rgba(255,255,255,.024);

                            border:
                              1px solid rgba(255,255,255,.05);
                          }


                          .small-label {

                            color:#718096;

                            font-size:7px;

                            font-weight:900;

                            letter-spacing:.10em;
                          }


                          .summary-value {

                            margin-top:5px;

                            font-size:20px;

                            font-weight:900;
                          }


                          .summary-box.cost .summary-value {
                            color:#35e59d;
                          }


                          .summary-box.solar .summary-value {
                            color:#ff922b;
                          }


                          .summary-box.grid .summary-value {
                            color:#fb7185;
                          }


                          /* =====================================================
                             BANDEAU ÉTAT
                             ===================================================== */

                          .status-strip {

                            display:flex;

                            justify-content:space-between;

                            align-items:center;

                            gap:10px;

                            margin-bottom:13px;

                            padding:10px 12px;

                            border-radius:14px;

                            background:
                              rgba(25,216,255,.025);

                            border:
                              1px solid rgba(25,216,255,.07);

                            font-size:7px;

                            color:#64748b;
                          }


                          .status-strip strong {

                            color:#cbd5e1;

                            font-size:8px;
                          }


                          /* =====================================================
                             GRILLE APPAREILS
                             ===================================================== */

                          .device-grid {

                            display:grid;

                            grid-template-columns:
                              repeat(
                                auto-fit,
                                minmax(
                                  255px,
                                  1fr
                                )
                              );

                            gap:11px;
                          }


                          .device-card {

                            min-width:0;

                            padding:16px;

                            border-radius:19px;

                            background:
                              linear-gradient(
                                145deg,
