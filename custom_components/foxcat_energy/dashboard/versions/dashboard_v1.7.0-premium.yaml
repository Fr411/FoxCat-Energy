            square: false
            cards:
              - type: custom:button-card
                template: fc_panel
                custom_fields:
                  c: |
                    [[[
                      const units=[
                        ['Salon','🛋️','[[foxcat:legacy.climate_salon_2]]'],
                        ['Chambre parentale','🛏️','[[foxcat:legacy.climate_chambre_parentale]]'],
                        ['Chambre Nathéo','🧸','[[foxcat:legacy.climate_chambre_natheo_2]]'],
                        ['Salle de bain','🚿','[[foxcat:legacy.climate_salle_de_bain_2]]'],
                        ['Chauffage sol','♨️','[[foxcat:legacy.climate_chauffage_sol_2]]'],
                        ['Insert à pellet','🍳','[[foxcat:legacy.climate_poele_a_pellet]]']];
                      const mode=states['[[foxcat:legacy.select_central_mode]]']?.state||'—';
                      const act={heating:['CHAUFFE','#fb923c'],cooling:['RAFRAÎCHIT','#60a5fa'],drying:['DÉSHUMIDIFIE','#38bdf8'],fan:['VENTILATION','#c4b5fd'],fan_only:['VENTILATION','#c4b5fd']};
                      const cells=units.map(u=>{const s=states[u[2]];if(!s)return '';
                        const a=s.state==='off'?['ARRÊT','#64748b']:act[s.attributes.hvac_action]||['EN VEILLE','#94a3b8'];
                        const cur=parseFloat(s.attributes.current_temperature),tg=parseFloat(s.attributes.temperature);
