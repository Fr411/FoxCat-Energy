                    - ['Sèche-linge · énergie', '[[foxcat:legacy.sensor_seche_linge_energy_daily]]']
                    - ['Sèche-linge · coût', '[[foxcat:legacy.sensor_seche_linge_energy_daily_cost]]']
                    - ['Lave-vaisselle · énergie', '[[foxcat:legacy.sensor_lave_vaisselle_energy_daily]]']
                    - ['Lave-vaisselle · coût', '[[foxcat:legacy.sensor_lave_vaisselle_energy_daily_cost]]']

  # ====================================================================
  # ÉCONOMIE (Marché & Réseau)
  # ====================================================================
  - type: panel
    title: Marché & Réseau
    path: marche
    icon: mdi:chart-timeline-variant-shimmer
    subview: true
    cards:
      - type: vertical-stack
        cards:
          - type: custom:button-card
            template: fc_navbar
          - type: custom:button-card
            template: fc_head
            variables: {title: Économie, subtitle: 'Contrat · Distribution · Prix', icon: mdi:chart-timeline-variant-shimmer, color: '#22d3ee'}
          - type: grid
            columns: 3
            square: false
            cards:
              - type: conditional
                conditions:
                  - {entity: '[[foxcat:pricing.regime]]', state: Dynamique}
                card:
                  type: custom:button-card
                  template: fc_panel
                  custom_fields:
                    c: |
                      [[[
                        const f=(id,d=3)=>{const v=Number(states[id]?.state);return Number.isFinite(v)?v.toFixed(d).replace('.',','):'—'};
                        const a=states['[[foxcat:pricing.day_ahead.plan]]']?.attributes||{};
                        const remain=a.temps_restant_creux||'—',end=a.fin_creux_actuel||'—';
                        return `<div class="p"><div class="k" style="font-weight:800;letter-spacing:.14em">CONTRAT DYNAMIQUE · DAY-AHEAD</div>
                          <div style="font-size:34px;font-weight:900;color:#67ddff;margin:12px 0">${f('[[foxcat:pricing.current]]')} <small style="font-size:12px;opacity:.6">€/kWh</small></div>
                          <div class="g2" style="grid-template-columns:repeat(4,1fr)"><div class="stat"><span>H+1</span><b>${f('[[foxcat:pricing.next]]')}</b></div><div class="stat"><span>POSITION</span><b>${f('[[foxcat:pricing.dynamic_curve_position]]',1)} %</b></div><div class="stat"><span>FAVORABLE</span><b>${a.seuil_favorable_pct??'—'} %</b></div><div class="stat"><span>PLAFOND</span><b>${a.seuil_pic_pct??'—'} %</b></div></div>
                          <div style="margin-top:10px;padding:12px;border-radius:14px;background:linear-gradient(90deg,rgba(0,207,255,.09),rgba(255,178,56,.05))"><div class="k" style="font-size:9px">CREUX ACTUEL &lt; SEUIL FAVORABLE</div><b style="font-size:15px">${remain==='—'?'Aucun creux actif':remain+' restantes'}</b>${end==='—'?'':`<div class="k" style="font-size:10px">Fin estimée : ${end}</div>`}</div></div>`;
                      ]]]
              - type: custom:button-card
                template: fc_panel
                custom_fields:
                  c: |
                    [[[
                      const N=(i,d=0)=>{const v=parseFloat(states[i]?.state);return isFinite(v)?v:d};
                      const e=v=>v.toFixed(2).replace('.',',')+' €';
                      const k=v=>Math.max(v,0).toFixed(2).replace('.',',')+' kWh';
                      const gross=Math.max(N('[[foxcat:pricing.cost_today]]'),0),revenue=Math.max(N('[[foxcat:pricing.export_revenue_today]]'),0),net=N('[[foxcat:pricing.net_today]]',gross-revenue);
                      const gain=N('[[foxcat:pricing.solar_gain_today]]');
                      return `<div class="p"><div class="t"><span><ha-icon class="gr" icon="mdi:cash-sync"></ha-icon>Coût journalier</span><small>depuis 00:00</small></div>
                        <div style="text-align:center;margin-bottom:8px"><div class="k">COÛT NET DU JOUR</div><div class="v gr" style="font-size:34px">${e(net)}</div></div>
                        <div class="g2">
                          <div class="stat"><span>COÛT BRUT RÉSEAU</span><b class="r">${e(gross)}</b><span>${k(N('[[foxcat:energy.today.import]]'))} prélevés</span></div>
                          <div class="stat"><span>REVENU RÉINJECTION</span><b class="gr">${e(revenue)}</b><span>${k(N('[[foxcat:energy.today.export]]'))} réinjectés</span></div>
                          <div class="stat"><span>AVANTAGE PV</span><b class="o">${e(gain)}</b><span>${k(N('[[foxcat:energy.today.self_consumed]]'))} autoconsommés</span></div>
                          <div class="stat"><span>COÛT SANS PV</span><b class="b">${e(gross+gain)}</b><span>${k(N('[[foxcat:energy.today.house]]'))} maison</span></div>
                        </div></div>`;
                    ]]]
              - type: custom:button-card
                template: fc_list
                variables:
                  title: Configuration active
                  icon: mdi:cog-outline
                  rows:
                    - ['Contrat énergie', '[[foxcat:pricing.regime]]']
                    - ['Distribution / comptage', '[[foxcat:pricing.distribution_profile]]']
                    - ['Période distribution', '[[foxcat:pricing.distribution_period]]']
                    - ['Politique réseau', '[[foxcat:pricing.network_policy]]']
                    - ['Prix achat actif', '[[foxcat:pricing.active_buy]]']
                    - ['Décision économique', '[[foxcat:pricing.economic_decision]]']
          - type: conditional
            conditions:
              - {entity: '[[foxcat:pricing.regime]]', state: Dynamique}
            card:
              type: custom:apexcharts-card
              update_interval: 1min
              graph_span: 2d
              span: {start: day}
              now: {show: true, label: Maintenant}
              header: {show: true, title: Courbe Luminus Dynamic, show_states: false}
              yaxis:
                - {decimals: 3}
              apex_config:
                chart: {height: 320, background: transparent, toolbar: {show: true}, zoom: {enabled: true}}
                legend: {show: true, position: bottom, labels: {colors: '#9bb3cc'}}
                grid: {borderColor: 'rgba(255,255,255,.06)'}
                stroke: {curve: smooth}
                xaxis: {type: datetime, labels: {datetimeUTC: false}}
              series:
                - entity: '[[foxcat:pricing.source.current]]'
                  name: Achat
                  type: area
                  unit: €/kWh
                  stroke_width: 3
                  opacity: 0.16
                  color: '#38bdf8'
                  data_generator: |
                    const rows=[...(entity.attributes.today||[]),...(entity.attributes.tomorrow||[])];
                    return rows.filter(r=>r.start!=null&&Number.isFinite(Number(r.all_in))).map(r=>[new Date(r.start).getTime(),Number(r.all_in)]);
                - entity: '[[foxcat:pricing.source.injection]]'
                  name: Injection
                  type: line
                  unit: €/kWh
                  stroke_width: 2
                  color: '#34d399'
                  data_generator: |
                    const rows=[...(entity.attributes.today||[]),...(entity.attributes.tomorrow||[])];
                    return rows.filter(r=>r.start!=null&&Number.isFinite(Number(r.injection))).map(r=>[new Date(r.start).getTime(),Number(r.injection)]);
              card_mod:
                style: |
                  ha-card{background:linear-gradient(160deg,#0d1a2c,#08111e)!important;border:1px solid rgba(90,150,220,.18)!important;border-radius:18px!important;box-shadow:0 10px 30px rgba(0,0,0,.35)!important}
          - type: grid
            columns: 3
            square: false
            cards:
              - type: conditional
                conditions:
                  - {entity: '[[foxcat:pricing.regime]]', state: Bi-horaire HP/HC}
                card:
                  type: custom:button-card
                  template: fc_list
                  variables:
                    title: Contrat bihoraire
                    icon: mdi:clock-outline
                    rows:
                      - ['Période actuelle', '[[foxcat:pricing.period]]']
                      - ['Prix heures pleines', '[[foxcat:pricing.source.hp]]']
                      - ['Prix heures creuses', '[[foxcat:pricing.source.hc]]']
                      - ['Prix actif', '[[foxcat:pricing.current]]']
                      - ['Injection tarifée', '[[foxcat:pricing.injection]]']
              - type: conditional
                conditions:
                  - {entity: '[[foxcat:pricing.regime]]', state: Fixe / Monohoraire}
                card:
                  type: custom:button-card
                  template: fc_list
                  variables:
                    title: Contrat fixe / monohoraire
                    icon: mdi:cash
                    rows:
                      - ['Prix actif', '[[foxcat:pricing.current]]']
                      - ['Prix injection', '[[foxcat:pricing.injection]]']
                      - ['Politique réseau', '[[foxcat:pricing.network_policy]]']
              - type: conditional
                conditions:
                  - {entity: '[[foxcat:pricing.distribution_profile]]', state: Wallonie · Impact}
                card:
                  type: custom:button-card
                  template: fc_panel
                  custom_fields:
                    c: |
                      [[[
                        const p=states['[[foxcat:pricing.distribution_period]]']?.state??'—';
                        const m={ECO:['01–07 · 11–17','Déplacer les charges ici','#34d399'],MEDIUM:['07–11 · 22–01','Zone intermédiaire','#facc15'],PIC:['17–22','Éviter les nouvelles grosses charges','#f87171']};
                        const v=m[p]||['—','Profil Impact actif','#94a3b8'];
                        return `<div class="p"><div class="k" style="font-weight:800;letter-spacing:.13em">TARIF DE DISTRIBUTION · IMPACT</div><div style="font-size:30px;font-weight:900;color:${v[2]};margin:10px 0">${p}</div><b>${v[0]}</b><div class="k" style="margin-top:5px">${v[1]}</div></div>`;
                      ]]]

