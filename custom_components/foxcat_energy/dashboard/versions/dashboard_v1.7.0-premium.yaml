                                ENTITIES.seche_linge.legacy_hp_2
                              )
                          }

                        },


                        /* ========================================================
                           LAVE-VAISSELLE
                           ======================================================== */

                        {

                          id:
                            'dishwasher',

                          registry:
                            ENTITIES.lave_vaisselle,

                          nativeNames: [
                            'lave vaisselle',
                            'dishwasher'
                          ],

                          name:
                            'Lave-vaisselle',

                          nativeLabel:
                            'Lave-vaisselle',

                          icon:
                            'mdi:dishwasher',

                          color:
                            '#35e59d',


                          management:
                            management(
                              [
                                'gestion',
                                'lave vaisselle'
                              ],
                              ENTITIES.lave_vaisselle.legacy_gestion,
                              ENTITIES.lave_vaisselle.gestion
                            ),


                          powerCandidates:
                            entityList(
                              ENTITIES.lave_vaisselle.puissance,
                              ENTITIES.lave_vaisselle.legacy_puissance,
                              ENTITIES.lave_vaisselle.legacy_puissance_2
                            ),


                          cycleCandidates:
                            entityList(
                              ENTITIES.lave_vaisselle.cycle,
                              ENTITIES.lave_vaisselle.legacy_cycle,
                              ENTITIES.lave_vaisselle.legacy_cycle_2
                            ),


                          legacy: {

                            energy:
                              entityList(
                                ENTITIES.lave_vaisselle.legacy_energie,
                                ENTITIES.lave_vaisselle.legacy_energie_2
                              ),

                            cost:
                              entityList(
                                ENTITIES.lave_vaisselle.legacy_cout,
                                ENTITIES.lave_vaisselle.legacy_cout_2
                              ),

                            hc:
                              entityList(
                                ENTITIES.lave_vaisselle.legacy_hc,
                                ENTITIES.lave_vaisselle.legacy_hc_2
                              ),

                            hp:
                              entityList(
                                ENTITIES.lave_vaisselle.legacy_hp,
                                ENTITIES.lave_vaisselle.legacy_hp_2
                              )
                          }

                        }

                      ];


                      /* ==========================================================
                         CAPTEURS NATIFS FOXCAT PAR APPAREIL
                         ========================================================== */

                      const nativeApplianceSensor = (
                        device,
                        metricWords,
                        rejected = []
                      ) => {

                        for (
                          const deviceWord
                          of device.nativeNames
                        ) {

                          const id =
                            findFox(
                              'sensor',
                              [
                                deviceWord,
                                ...metricWords
                              ],
                              [],
                              rejected
                            );


                          if (
                            id
                          ) {
                            return id;
                          }
                        }


                        return null;
                      };


                      const legacyCandidate = (
                        ids = []
                      ) =>
                        ids.find(
                          (id) =>
                            states[id]
                        )
                        ||
                        null;


                      /* ==========================================================
                         CONSTRUCTION DES DONNÉES
                         ========================================================== */

                      const activeDevices =
                        devices

                          /* ======================================================
                             AFFICHAGE UNIQUEMENT SI GÉRÉ PAR FOXCAT
                             ====================================================== */

                          .filter(
                            (device) =>
                              device.management.enabled
                          )


                          .map(
                            (device) => {


                              /* ==================================================
                                 ÉNERGIE JOUR
                                 ================================================== */

                              const energyEntity =
                                firstExisting(
                                  device.registry.energie_jour
                                )
                                ||
                                nativeApplianceSensor(
                                  device,
                                  [
                                    'energie',
                                    'aujourd'
                                  ]
                                )
                                ||
                                legacyCandidate(
                                  device.legacy.energy
                                );


                              /* ==================================================
                                 PART SOLAIRE
                                 ================================================== */

                              const solarEntity =
                                firstExisting(
                                  device.registry.part_solaire_jour
                                )
                                ||
                                nativeApplianceSensor(
                                  device,
                                  [
                                    'part',
                                    'solaire',
                                    'aujourd'
                                  ]
                                );


                              /* ==================================================
                                 PART RÉSEAU
                                 ================================================== */

                              const gridEntity =
                                firstExisting(
                                  device.registry.part_reseau_jour
                                )
                                ||
                                nativeApplianceSensor(
                                  device,
                                  [
                                    'part',
                                    'reseau',
                                    'aujourd'
                                  ]
                                );


                              /* ==================================================
                                 COÛT JOUR
                                 ================================================== */

                              const costEntity =
                                firstExisting(
                                  device.registry.cout_jour
                                )
                                ||
                                nativeApplianceSensor(
                                  device,
                                  [
                                    'cout',
                                    'aujourd'
                                  ]
                                )
                                ||
                                legacyCandidate(
                                  device.legacy.cost
                                );


                              /* ==================================================
                                 HP
                                 ================================================== */

                              const hpEntity =
                                firstExisting(
                                  device.registry.consommation_hp_jour
                                )
                                ||
                                nativeApplianceSensor(
                                  device,
                                  [
                                    'consommation',
                                    'hp',
                                    'aujourd'
                                  ]
                                )
                                ||
                                legacyCandidate(
                                  device.legacy.hp
                                );


                              /* ==================================================
                                 HC
                                 ================================================== */

                              const hcEntity =
                                firstExisting(
                                  device.registry.consommation_hc_jour
                                )
                                ||
                                nativeApplianceSensor(
                                  device,
                                  [
                                    'consommation',
                                    'hc',
                                    'aujourd'
                                  ]
                                )
                                ||
                                legacyCandidate(
                                  device.legacy.hc
                                );


                              /* ==================================================
                                 TARIF ACTUEL APPAREIL
                                 ================================================== */

                              const tariffNowEntity =
                                firstExisting(
                                  device.registry.tarif_actuel
                                )
                                ||
                                nativeApplianceSensor(
                                  device,
                                  [
                                    'tarif',
                                    'actuel'
                                  ]
                                );


                              /* ==================================================
                                 PUISSANCE
                                 ================================================== */

                              let powerEntity =
                                null;


                              if (
                                device.id === 'boiler'
                              ) {

                                powerEntity =
                                  findFox(
                                    'sensor',
                                    [
                                      'puissance',
                                      'chauffe',
                                      'eau'
                                    ],
                                    entityList(
                                      device.registry.puissance
                                    )
                                  )
                                  ||
                                  findPowerSensor(
                                    device.nativeNames,
                                    device.powerCandidates
                                  );
                              }

                              else {

                                powerEntity =
                                  findPowerSensor(
                                    device.nativeNames,
                                    device.powerCandidates
                                  );
                              }


                              /* ==================================================
                                 CYCLE
                                 ================================================== */

                              let cycleEntity =
                                null;


                              if (
                                device.id === 'boiler'
                              ) {

                                cycleEntity =
                                  findFox(
                                    'binary_sensor',
                                    [
                                      'boiler',
                                      'physique'
                                    ],
                                    entityList(
                                      device.registry.cycle
                                    )
                                  )
                                  ||
                                  device.cycleCandidates.find(
                                    (id) =>
                                      states[id]
                                  )
                                  ||
                                  null;
                              }

                              else {

                                cycleEntity =
                                  device.cycleCandidates.find(
                                    (id) =>
                                      states[id]
                                  )
                                  ||
                                  null;
                              }


                              /* ==================================================
                                 VALEURS
                                 ================================================== */

                              const energy =
                                Math.max(
                                  numberOf(
                                    energyEntity,
                                    0
                                  ),
                                  0
                                );


                              const solar =
                                Math.max(
                                  numberOf(
                                    solarEntity,
                                    0
                                  ),
                                  0
                                );


                              const grid =
                                Math.max(
                                  numberOf(
                                    gridEntity,
                                    Math.max(
                                      energy - solar,
                                      0
                                    )
                                  ),
                                  0
                                );


                              const hp =
                                Math.max(
                                  numberOf(
                                    hpEntity,
                                    0
                                  ),
                                  0
                                );


                              const hc =
                                Math.max(
                                  numberOf(
                                    hcEntity,
                                    0
                                  ),
                                  0
                                );


                              /*
                               * Si FoxCat possède un vrai coût :
                               * → on l'utilise.
                               *
                               * Sinon :
                               * → secours énergie × prix actif.
                               */

                              const cost =
                                Math.max(
                                  numberOf(
                                    costEntity,
                                    energy *
                                    Math.max(
                                      activePrice,
                                      0
                                    )
                                  ),
                                  0
                                );


                              const power =
                                Math.max(
                                  numberOf(
                                    powerEntity,
                                    0
                                  ),
                                  0
                                );


                              const tariffNow =
                                stateOf(
                                  tariffNowEntity,
                                  tariffPeriod
                                );


                              const running =
                                (
                                  cycleEntity
                                  &&
                                  isOn(
                                    cycleEntity
                                  )
                                )
                                ||
                                power > 20;


                              const tariffTotal =
                                hp +
                                hc;


                              const partHC =
                                tariffTotal > 0
                                  ? clamp(
                                      (
                                        hc /
                                        tariffTotal
                                      ) * 100,
                                      0,
                                      100
                                    )
                                  : 0;


                              const partHP =
                                tariffTotal > 0
                                  ? clamp(
                                      (
                                        hp /
                                        tariffTotal
                                      ) * 100,
                                      0,
                                      100
                                    )
                                  : 0;


                              const solarShare =
                                energy > 0
                                  ? clamp(
                                      (
                                        solar /
                                        energy
                                      ) * 100,
                                      0,
                                      100
                                    )
                                  : 0;


                              const gridShare =
                                energy > 0
                                  ? clamp(
                                      (
                                        grid /
                                        energy
                                      ) * 100,
                                      0,
                                      100
                                    )
                                  : 0;


                              const avgPrice =
                                energy > 0
                                  ? cost / energy
                                  : 0;


                              /*
                               * Détermine si la comptabilité utilisée
                               * est native FoxCat.
                               */

                              const nativeAccounting =
                                !!(
                                  firstExisting(
                                    device.registry.energie_jour,
                                    device.registry.part_solaire_jour,
                                    device.registry.part_reseau_jour,
                                    device.registry.cout_jour,
                                    device.registry.consommation_hp_jour,
                                    device.registry.consommation_hc_jour,
                                    device.registry.tarif_actuel
                                  )
                                  ||
                                  solarEntity
                                  ||
                                  gridEntity
                                  ||
                                  (
                                    costEntity
                                    &&
                                    norm(
                                      costEntity
                                    ).includes(
                                      'foxcat energy'
                                    )
                                  )
                                );


                              return {

                                ...device,

                                energyEntity,
                                solarEntity,
                                gridEntity,
                                costEntity,
                                hpEntity,
                                hcEntity,
                                tariffNowEntity,

                                powerEntity,
                                cycleEntity,

                                energy,
                                solar,
                                grid,
                                hp,
                                hc,
                                cost,
                                power,
                                tariffNow,

                                running,
                                partHC,
                                partHP,
                                solarShare,
                                gridShare,
                                avgPrice,
                                nativeAccounting

                              };
                            }
                          );


                      /* ==========================================================
                         TOTAUX
                         ========================================================== */

                      const activeEnergy =
                        activeDevices.reduce(
                          (
                            sum,
                            d
                          ) =>
                            sum +
                            d.energy,
                          0
                        );


                      const activeSolar =
                        activeDevices.reduce(
                          (
                            sum,
                            d
                          ) =>
                            sum +
                            d.solar,
                          0
                        );


                      const activeGrid =
                        activeDevices.reduce(
                          (
                            sum,
                            d
                          ) =>
                            sum +
                            d.grid,
                          0
                        );


                      const activeCost =
                        activeDevices.reduce(
                          (
                            sum,
                            d
                          ) =>
                            sum +
                            d.cost,
                          0
                        );


                      const runningCount =
                        activeDevices.filter(
                          (d) =>
                            d.running
                        ).length;


                      /* ==========================================================
                         COULEUR PRIX
                         ========================================================== */

                      const priceColor =
                        (() => {

                          const p =
                            norm(
                              priceStatus
                            );


                          if (
                            p.includes(
                              'avantage'
                            )
                            ||
                            p.includes(
                              'bas'
                            )
                            ||
                            p.includes(
                              'negatif'
                            )
                          ) {

                            return '#35e59d';
                          }


                          if (
                            p.includes(
                              'eleve'
                            )
                            ||
                            p.includes(
                              'cher'
                            )
                          ) {

                            return '#fb7185';
                          }


                          return '#facc15';

                        })();


                      /* ==========================================================
                         CARTES APPAREILS
                         ========================================================== */

                      const cardHtml =
                        activeDevices

                          .map(
                            (d) => {

                              const stateColor =
                                d.running
                                  ? '#35e59d'
                                  : '#64748b';


                              const tariffColor =
                                norm(
                                  d.tariffNow
                                ).includes(
                                  'hp'
                                )
                                  ? '#ff922b'
                                  : '#19d8ff';


                              const hasSplit =
                                d.hpEntity
                                ||
                                d.hcEntity
                                ||
                                (
                                  d.hp +
                                  d.hc
                                ) > 0;


                              return `

                                <div
                                  class="device-card"
                                  style="
                                    --device:${d.color};
                                  "
                                >


                                  <!-- HEADER APPAREIL -->

                                  <div class="device-header">


                                    <div class="device-name-block">


                                      <div class="device-icon">

                                        <ha-icon
                                          icon="${d.icon}">
                                        </ha-icon>

                                      </div>


                                      <div>

                                        <div class="device-name">
                                          ${d.name}
                                        </div>


                                        <div class="native-line">

                                          <span class="native-dot"></span>

                                          ${
                                            d.management.native
                                              ? 'GESTION FOXCAT'
                                              : 'GESTION LEGACY'
                                          }

                                          ·

                                          ${
                                            d.nativeAccounting
                                              ? 'COMPTABILITÉ FOXCAT'
                                              : 'FALLBACK'
                                          }

                                        </div>

                                      </div>


                                    </div>



                                    <div
                                      class="running"
                                      style="
                                        color:${stateColor};
                                      "
                                    >

                                      ${
                                        d.running
                                          ? '● EN COURS'
                                          : '○ EN ATTENTE'
                                      }

                                    </div>


                                  </div>



                                  <!-- ÉNERGIE / COÛT -->

                                  <div class="main-values">


                                    <div>

                                      <div class="small-label">
                                        ÉNERGIE AUJOURD'HUI
                                      </div>

                                      <div class="energy-value">
                                        ${fmtEnergy(d.energy)}
                                      </div>

                                    </div>



                                    <div class="cost-block">

                                      <div class="small-label">
                                        COÛT FOXCAT
                                      </div>

                                      <div class="cost-value">
                                        ${fmtEuro(d.cost)}
                                      </div>

                                      <div class="cost-source">

                                        ${
                                          d.nativeAccounting
                                            ? 'COMPTABILISÉ V1.5.0'
                                            : 'SECOURS / ESTIMÉ'
                                        }

                                      </div>

                                    </div>


                                  </div>



                                  <!-- PUISSANCE -->

                                  <div class="power-line">

                                    <span>
                                      Puissance actuelle
                                    </span>

                                    <strong>
                                      ${fmtPower(d.power)}
                                    </strong>

                                  </div>



                                  <!-- PART SOLAIRE / RÉSEAU -->

                                  <div class="source-grid">


                                    <div>

                                      <span class="solar-label">
                                        PART SOLAIRE
                                      </span>

                                      <strong>
                                        ${fmtEnergy(d.solar)}
                                      </strong>

                                      <small>
                                        ${d.solarShare.toFixed(0)} %
                                      </small>

                                    </div>



                                    <div>

                                      <span class="grid-label">
                                        PART RÉSEAU
                                      </span>

                                      <strong>
                                        ${fmtEnergy(d.grid)}
                                      </strong>

                                      <small>
                                        ${d.gridShare.toFixed(0)} %
                                      </small>

                                    </div>


                                  </div>



                                  <div class="source-bar">

                                    <div
                                      class="solar-fill"
                                      style="
                                        width:${d.solarShare}%;
                                      "
                                    ></div>

                                    <div
                                      class="grid-fill"
                                      style="
                                        width:${d.gridShare}%;
                                      "
                                    ></div>

                                  </div>



                                  <!-- HP / HC -->

                                  ${
                                    hasSplit
                                      ? `

                                        <div class="tariff-title">
                                          RÉPARTITION HP / HC
                                        </div>


                                        <div class="tariff-values">


                                          <div>

                                            <span class="hc-label">
                                              HEURES CREUSES
                                            </span>

                                            <strong>
                                              ${fmtEnergy(d.hc)}
                                            </strong>

                                            <small>
                                              ${d.partHC.toFixed(1)} %
                                            </small>

                                          </div>



                                          <div>

                                            <span class="hp-label">
                                              HEURES PLEINES
                                            </span>

                                            <strong>
                                              ${fmtEnergy(d.hp)}
                                            </strong>

                                            <small>
                                              ${d.partHP.toFixed(1)} %
                                            </small>

                                          </div>


                                        </div>



                                        <div class="split-bar">

                                          <div
                                            class="hc-fill"
                                            style="
                                              width:${d.partHC}%;
                                            "
                                          ></div>

                                          <div
                                            class="hp-fill"
                                            style="
                                              width:${d.partHP}%;
                                            "
                                          ></div>

                                        </div>

                                      `
                                      : `

                                        <div class="tariff-unavailable">
                                          Aucune répartition HP / HC enregistrée aujourd'hui
                                        </div>

                                      `
                                  }



                                  <!-- FOOTER APPAREIL -->

                                  <div class="device-footer">


                                    <div>

                                      <span>
                                        TARIF APPAREIL
                                      </span>

                                      <strong
                                        style="
                                          color:${tariffColor};
                                        "
                                      >
                                        ${d.tariffNow}
                                      </strong>

                                    </div>



                                    <div>

                                      <span>
                                        PRIX MOYEN
                                      </span>

                                      <strong>

                                        ${
                                          d.energy > 0
                                            ? `${d.avgPrice.toFixed(3)} €/kWh`
                                            : '—'
                                        }

                                      </strong>

                                    </div>


                                  </div>


                                </div>

                              `;
                            }
                          )

                          .join('');


                      /* ==========================================================
                         AUCUN APPAREIL
                         ========================================================== */

                      const emptyHtml = `

                        <div class="empty">

                          <ha-icon
                            icon="mdi:power-plug-off-outline">
                          </ha-icon>

                          <div>

                            <strong>
                              Aucun appareil géré par FoxCat
                            </strong>

                            <span>
                              Active la gestion d'un appareil dans FoxCat EMS
                              pour afficher sa comptabilité énergétique.
                            </span>

                          </div>

                        </div>

                      `;


                      /* ==========================================================
                         RENDU
                         ========================================================== */

                      return `

                        <style>

                          * {
                            box-sizing:border-box;
                          }


                          .wrap {

                            padding:22px;

                            color:#f8fafc;

                            font-family:
                              -apple-system,
                              BlinkMacSystemFont,
                              "Segoe UI",
                              Roboto,
                              sans-serif;
                          }


                          /* =====================================================
                             HEADER
                             ===================================================== */

                          .header {

                            display:flex;

                            align-items:flex-start;

                            justify-content:space-between;

                            gap:15px;

                            margin-bottom:15px;
                          }


