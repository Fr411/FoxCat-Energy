                        const imp = read('sensor.foxcat_energy_energie_dynamic_prelevement_reseau_aujourdhui');
                        const exp = read('sensor.foxcat_energy_energie_dynamic_reinjection_aujourdhui');
                        const cost = read('sensor.foxcat_energy_tarification_dynamic_cout_net_aujourdhui');

                        return `
