                            'dryer'
                          ],

                          name:
                            'Sèche-linge',

                          nativeLabel:
                            'Sèche-linge',

                          icon:
                            'mdi:tumble-dryer',

                          color:
                            '#a78bfa',


                          management:
                            management(
                              [
                                'gestion',
                                'seche linge'
                              ],
                              ENTITIES.seche_linge.legacy_gestion,
                              ENTITIES.seche_linge.gestion
                            ),


                          powerCandidates:
                            entityList(
                              ENTITIES.seche_linge.puissance,
                              ENTITIES.seche_linge.legacy_puissance,
                              ENTITIES.seche_linge.legacy_puissance_2
                            ),


                          cycleCandidates:
                            entityList(
                              ENTITIES.seche_linge.cycle,
                              ENTITIES.seche_linge.legacy_cycle,
                              ENTITIES.seche_linge.legacy_cycle_2
                            ),


                          legacy: {

                            energy:
                              entityList(
                                ENTITIES.seche_linge.legacy_energie,
