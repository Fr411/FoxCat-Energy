                            border-right: 3px solid ${runColor};
                          }

                          .boiler-pipe {
                            position: absolute;
                            right: -7px;
                            width: 13px;
                            height: 8px;
                            border-radius: 0 5px 5px 0;
                            background: linear-gradient(90deg,#64748b,#cbd5e1,#475569);
