                            color:#f8fafc;

                            font-size:13px;

                            font-weight:900;
                          }


                          .native-line {

                            display:flex;

                            align-items:center;

                            gap:4px;

                            margin-top:4px;

                            color:#64748b;

                            font-size:5.5px;

                            font-weight:900;

                            letter-spacing:.05em;
                          }


                          .native-dot {

                            width:5px;

                            height:5px;

                            border-radius:50%;

                            background:#35e59d;

                            box-shadow:
                              0 0 6px rgba(53,229,157,.7);
                          }


                          .running {

                            flex:none;

                            font-size:7px;

                            font-weight:900;

                            white-space:nowrap;
