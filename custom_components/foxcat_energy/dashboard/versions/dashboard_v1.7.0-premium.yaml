              - type: custom:button-card
                template: fc_panel
                custom_fields:
                  c: |
                    [[[
                      const N = (i, f = 0) => { const v = parseFloat(states[i]?.state); return isFinite(v) ? v: f };
                      const K = v => v.toFixed(2).replace('.', ',') + ' kWh';
                      const E = v => v.toFixed(2).replace('.', ',') + ' €';

                      // Récupération du régime tarifaire actif
                      const regime = states['select.foxcat_energy_tarification_regime_tarifaire']?.state || 'Mono-horaire';

                      // Données énergétiques globales communes
                      const pv = N('sensor.foxcat_energy_energie_pv_production_aujourdhui');
                      const hs = N('sensor.foxcat_energy_energie_maison_consommation_aujourdhui');
                      const ex = N('sensor.foxcat_energy_energie_pv_reinjection_aujourdhui');
                      const pct = Math.min(Math.max(N('sensor.foxcat_energy_energie_pv_taux_dautoconsommation_aujourdhui'), 0), 100);

                      // Données spécifiques selon le régime
                      let imp = 0;
                      let costNet = 0;
                      let extraHtml = '';

                      if (regime.includes('Bi-horaire')) {
                        const impHp = N('sensor.foxcat_energy_energie_hp_prelevement_reseau_aujourdhui');
                        const impHc = N('sensor.foxcat_energy_energie_hc_prelevement_reseau_aujourdhui');
                        imp = impHp + impHc;
                        costNet = N('sensor.foxcat_energy_tarification_maison_cout_net_aujourdhui');
                        extraHtml = `
                          <div class="tile"><ha-icon class="b" icon="mdi:clock-time-three"></ha-icon><div><span>Réseau HP</span><b>${K(impHp)}</b></div></div>
                          <div class="tile"><ha-icon class="b" icon="mdi:clock-time-eleven"></ha-icon><div><span>Réseau HC</span><b>${K(impHc)}</b></div></div>
                        `;
                      } else if (regime.includes('Dynamique')) {
                        imp = N('sensor.foxcat_energy_energie_dynamic_prelevement_reseau_aujourdhui');
                        costNet = N('sensor.foxcat_energy_tarification_dynamic_cout_net_aujourdhui');
                        const prixActuel = N('sensor.foxcat_energy_tarification_prix_dynamique_actuel');
                        extraHtml = `
                          <div class="tile"><ha-icon class="o" icon="mdi:currency-eur"></ha-icon><div><span>Prix Actuel</span><b>${prixActuel.toFixed(3).replace('.', ',')} €/kWh</b></div></div>
                          <div class="tile"><ha-icon class="gr" icon="mdi:chart-line"></ha-icon><div><span>Coût Achat Jour</span><b>${E(N('sensor.foxcat_energy_tarification_dynamic_cout_achat_aujourdhui'))}</b></div></div>
                        `;
                      } else {
                        // Mono-horaire / Fixe
                        imp = N('sensor.foxcat_energy_energie_maison_prelevement_reseau_aujourdhui');
                        costNet = N('sensor.foxcat_energy_tarification_maison_cout_net_aujourdhui');
                      }

                      const date = new Date().toLocaleDateString('fr-BE', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

                      return `
                      <div class="p">
                        <div class="t">
                          <span><ha-icon icon="mdi:chart-donut"></ha-icon>Bilan du jour (${regime})</span>
                          <small style="text-transform:capitalize">${date}</small>
                        </div>
                        <div class="g2">
                          <div class="tile"><ha-icon class="o" icon="mdi:white-balance-sunny"></ha-icon><div><span>Production PV</span><b>${K(pv)}</b></div></div>
                          <div class="tile"><ha-icon class="b" icon="mdi:home"></ha-icon><div><span>Consommation maison</span><b>${K(hs)}</b></div></div>
                          <div class="tile"><ha-icon class="r" icon="mdi:transmission-tower-import"></ha-icon><div><span>Réseau prélevé (Total)</span><b>${K(imp)}</b></div></div>
                          <div class="tile"><ha-icon class="gr" icon="mdi:cash"></ha-icon><div><span>Coût Net du Jour</span><b>${E(costNet)}</b></div></div>
                        </div>
                        <div class="g2" style="margin-top:8px;">
                          ${extraHtml}
                        </div>
                        <div style="display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:12px">
                          <div class="tile" style="flex:1"><ha-icon class="gr" icon="mdi:transmission-tower-export"></ha-icon><div><span>Réinjection réseau</span><b>${K(ex)}</b></div></div>
                          <div class="ring" style="width:104px;height:104px;background:conic-gradient(#34d399 ${pct * 3.6}deg,rgba(255,255,255,.08) 0)">
                            <div style="width:80px;height:80px;font-size:20px">${Math.round(pct)} %<small>Autoconsommation</small></div>
                          </div>
                        </div>
                      </div>`;
                    ]]]
              - type: vertical-stack
                cards:
                  - type: custom:button-card
                    template: fc_panel
                    styles:
                      card:
                        - border-radius: 18px 18px 0 0
                        - border-bottom: none
                    custom_fields:
                      c: >
                        [[[ return `<div class="p" style="padding-bottom:0"><div
                        class="t"><span>Production et
                        consommation</span><small>Aujourd'hui
                        ▾</small></div></div>`; ]]]
                  - type: custom:apexcharts-card
                    graph_span: 24h
                    span:
                      start: day
                    update_interval: 5min
                    header:
                      show: false
                    apex_config:
                      chart:
                        height: 220
                        background: transparent
                        toolbar:
                          show: false
                      theme:
                        mode: dark
                      legend:
                        position: top
                        labels:
                          colors: '#9bb3cc'
                      grid:
                        borderColor: rgba(255,255,255,.08)
                        strokeDashArray: 3
                      stroke:
                        width: 2
                        curve: smooth
                      fill:
                        type:
                          - gradient
