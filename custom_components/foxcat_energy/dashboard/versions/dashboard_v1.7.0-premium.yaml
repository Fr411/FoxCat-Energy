                            </div>
                            <div style="padding:20px 10px;text-align:center;border:1px solid #ffffff12;border-radius:16px;background:#ffffff04">
                              <div style="font-size:10px;color:#a78bfa;font-weight:900">PRIX ACTUEL</div>
                              <div style="font-size:25px;color:white;font-weight:950;margin-top:10px">${fmt(current)} €</div>
                              <div style="font-size:10px;color:#94a3b8;margin-top:6px">Capteur FoxCat</div>
                            </div>
                          </div>
                          <div style="margin-top:18px;padding:14px 16px;border-radius:14px;background:#ffffff04;color:#94a3b8;font-size:12px;line-height:1.7">
                            <b style="color:#f8fafc">Horaires configurés</b><br>
                            HC : 22 h–07 h et 11 h–17 h<br>
                            HP : 07 h–11 h et 17 h–22 h<br>
                            Tous les jours, selon le calendrier tarifaire configuré.
                          </div>
                        `;
                      ]]]
                - type: custom:apexcharts-card
                  graph_span: 24h
                  span:
                    start: day
                  update_interval: 5min
                  header:
                    show: false
                  apex_config:
                    chart:
                      height: 160
                      background: transparent
                      toolbar:
                        show: false
                    theme:
                      mode: dark
                    legend:
                      show: false
                    grid:
                      borderColor: rgba(255,255,255,.08)
                      strokeDashArray: 3
                    stroke:
                      width: 2
                      curve: stepline
                    fill:
                      type: gradient
                      gradient:
                        shade: dark
                        type: vertical
                        shadeIntensity: 0.5
                        opacityFrom: 0.4
                        opacityTo: 0.05
                        stops:
                          - 0
                          - 100
                    xaxis:
                      labels:
                        datetimeUTC: false
                      tooltip:
                        enabled: false
                    yaxis:
                      - decimals: 3
                        labels:
                          formatter: |
                            EVAL:function(value) {
                              return value.toFixed(3) + " €";
                            }
                  series:
                    - entity: sensor.foxcat_energy_tarification_prix_d_achat_actif
                      name: Prix d'achat
                      type: area
                      color: '#38bdf8'
                      extend_to: now
                      float_precision: 3
                  card_mod:
                    style: >
                      ha-card{background:linear-gradient(160deg,#0d1a2c,#08111e)!important;border:1px
                      solid
                      rgba(90,150,220,.18)!important;border-top:none!important;border-radius:0
                      0 18px 18px!important;box-shadow:none!important}
                - type: custom:button-card
                  show_name: false
                  show_icon: false
                  show_state: false
                  triggers_update: all
                  styles:
                    card:
                      - padding: 22px
                      - border-radius: 22px
                      - background: linear-gradient(145deg,#141a23,#0a0e14)
                      - border: 1px solid rgba(25,216,255,.15)
                      - filter: grayscale(1)
                      - opacity: 0.4
                    grid:
                      - grid-template-areas: '"content"'
                  custom_fields:
                    content: |
                      [[[
                        const read = id => {
                          const s = states[id]?.state;
                          if (!s || ['unknown','unavailable'].includes(s)) return null;
                          const n = Number(s);
                          return Number.isFinite(n) ? n : null;
                        };
                        const fmt = (v, suffix) => v === null ? '—' : v.toFixed(2).replace('.', ',') + suffix;
                        
                        const imp = read('sensor.foxcat_energy_energie_dynamic_prelevement_reseau_aujourdhui');
                        const exp = read('sensor.foxcat_energy_energie_dynamic_reinjection_aujourdhui');
                        const cost = read('sensor.foxcat_energy_tarification_dynamic_cout_net_aujourdhui');

                        return `
                          <div style="font-size:16px;font-weight:900;color:white;margin-bottom:18px">BILAN ET PLANIFICATION BI-HORAIRE</div>
                          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px">
                            <div style="padding:18px;border:1px solid #ffffff12;border-radius:16px">
                              <div style="font-size:12px;color:#38bdf8;font-weight:900;margin-bottom:12px">BILAN JOURNALIER</div>
                              <div style="display:flex;justify-content:space-between;padding:10px 0;color:#94a3b8;font-size:12px">Prélèvement <b style="color:#fb7185">${fmt(imp,' kWh')}</b></div>
                              <div style="display:flex;justify-content:space-between;padding:10px 0;color:#94a3b8;font-size:12px">Réinjection <b style="color:#35e59d">${fmt(exp,' kWh')}</b></div>
                              <div style="display:flex;justify-content:space-between;padding:14px 0 0;border-top:1px solid #ffffff12;color:white;font-size:12px">Coût net <b style="color:#38bdf8;font-size:20px">${fmt(cost,' €')}</b></div>
                            </div>
                            <div style="padding:18px;border:1px solid #ffffff12;border-radius:16px">
                              <div style="font-size:12px;color:#a78bfa;font-weight:900;margin-bottom:12px">CRÉNEAUX MACHINES</div>
                              <div style="display:flex;justify-content:space-between;padding:10px 0;color:#94a3b8;font-size:12px">Lave-linge <b style="color:white">Désactivé</b></div>
                              <div style="display:flex;justify-content:space-between;padding:10px 0;color:#94a3b8;font-size:12px">Sèche-linge <b style="color:white">Désactivé</b></div>
                              <div style="display:flex;justify-content:space-between;padding:10px 0;color:#94a3b8;font-size:12px">Lave-vaisselle <b style="color:white">Désactivé</b></div>
                            </div>
                          </div>
                        `;
                      ]]]
    theme: ios-dark-mode-blue-red
  - title: Diagnostic
    path: diagnostic
    icon: mdi:stethoscope
    subview: true
    type: sections
    max_columns: 4
    background: >-
      radial-gradient(circle at 7% 8%, rgba(255,160,39,.16), transparent 26%),
      radial-gradient(circle at 94% 9%, rgba(0,198,255,.18), transparent 29%),
      linear-gradient(150deg,#05080c,#0b121a 58%,#05070a)
    sections:
      - type: grid
        column_span: 4
        cards:
          - type: custom:button-card
            show_name: false
            show_icon: false
            custom_fields:
              content: |
                [[[
                  const mode=states['select.foxcat_energy_ems_mode_ems']?.state??'—', 
                        c=states['select.foxcat_energy_tarification_regime_tarifaire']?.state??'—', 
                        d=states['select.foxcat_energy_tarification_profil_distribution_belgique']?.state??'—', 
                        p=states['select.foxcat_energy_tarification_politique_reseau']?.state??'—';
                  return `<div class="confighead"><span>FOXCAT ENERGY · DIAGNOSTIC</span><h2>EMS DIAGNOSTIC</h2><p>État complet des capteurs, exécutions et variables internes.</p><div><b>${mode}</b><b>${c}</b><b>${d}</b><b>${p}</b></div></div>`;
                ]]]
            styles:
              card:
                - padding: 27px
                - border-radius: 30px
                - background: linear-gradient(130deg,rgba(15,35,30,.75),rgba(5,20,30,.82))
                - border: 1px solid rgba(53,229,157,.20)
                - box-shadow: 0 20px 60px rgba(0,0,0,.28)
            extra_styles: >
              .confighead>span{font-size:9px;font-weight:900;letter-spacing:.15em;opacity:.5;color:white;}.confighead
              h2{font-size:24px;letter-spacing:.08em;margin:6px
              0;color:white;}.confighead
              p{font-size:11px;opacity:.55;max-width:700px;color:white;}.confighead>div{display:flex;flex-wrap:wrap;gap:7px;margin-top:15px}.confighead
              b{font-size:10px;padding:8px
              10px;border-radius:14px;background:rgba(255,255,255,.055);border:1px
              solid rgba(255,255,255,.06);color:white;}
      - type: grid
        cards:
          - type: markdown
            content: |
              ### EMS · Moteur
              Variables de contrôle principales du cœur d'optimisation FoxCat.
          - type: entities
            show_header_toggle: false
            entities:
              - entity: select.foxcat_energy_ems_mode_ems
                name: Mode
              - entity: sensor.foxcat_energy_ems_phase_de_regulation
                name: Phase actuelle
              - entity: sensor.foxcat_energy_ems_action_en_attente
                name: Action en attente
              - entity: sensor.foxcat_energy_ems_validation_dexecution_ems
                name: État de validation
              - entity: switch.foxcat_energy_ems_regulation_foxcat_active
                name: Autorisation de régulation
      - type: grid
        cards:
          - type: markdown
            content: >
              ### Dernière décision

              Historique et justification de la dernière action générée par le
              moteur.
          - type: entities
            show_header_toggle: false
            entities:
              - entity: sensor.foxcat_energy_ems_derniere_decision_ems
                name: Justification EMS
              - entity: sensor.foxcat_energy_boiler_origine_de_la_demande_chauffe_eau
                name: Origine Boiler
              - entity: sensor.foxcat_energy_boiler_demande_chauffe_eau
                name: Demande Boiler
              - entity: sensor.foxcat_energy_ems_derniere_action_ems
                name: Ordre du CORE
      - type: grid
        cards:
          - type: markdown
            content: >
              ### Validité · Contrôle

              Paramètres de validation et tolérances appliquées aux
              vérifications de réseau.
          - type: entities
            show_header_toggle: false
            entities:
              - entity: number.foxcat_energy_ems_tolerance_stabilite_t0_t1
                name: 1 · Mesure de référence T0
              - entity: sensor.foxcat_energy_ems_reseau_avant_action
                name: 2 · Réseau avant action
              - entity: sensor.foxcat_energy_ems_reseau_attendu
                name: 3 · Réseau attendu
              - entity: sensor.foxcat_energy_ems_erreur_ack
                name: 4 · Erreur constatée
              - entity: sensor.foxcat_energy_ems_variation_attendue
                name: Variation prévue
              - entity: number.foxcat_energy_ems_tolerance_ack
                name: Tolérance validation
              - entity: number.foxcat_energy_ems_tolerance_stabilite_t0_t1
                name: Tolérance stabilité
      - type: grid
        cards:
          - type: markdown
            content: >
              ### Exécution · Chaîne Boiler

              Vérification de la transmission de l'ordre jusqu'à l'activation
              physique.
          - type: entities
            show_header_toggle: false
            entities:
              - entity: sensor.foxcat_energy_boiler_demande_chauffe_eau
                name: 1 · Demande stratégique
              - entity: sensor.foxcat_energy_ems_action_en_attente
                name: 2 · Ordre du CORE
              - entity: switch.foxcat_energy_boiler_boiler_ecs_active
                name: 3 · Commande Climate (Boiler)
              - entity: switch.chauffe_eau
                name: 4 · Alimentation Boiler (Prise physique)
              - entity: binary_sensor.foxcat_energy_boiler_boiler_physique
                name: 5 · État physique
              - entity: sensor.foxcat_energy_boiler_puissance_chauffe_eau
                name: 6 · Puissance mesurée
      - type: grid
        cards:
          - type: markdown
            content: |
              ### Énergie · Temps réel
              Valeurs brutes instantanées collectées.
          - type: entities
            show_header_toggle: false
            entities:
              - entity: sensor.foxcat_energy_energie_puissance_de_production_photovoltaique
                name: Production PV
              - entity: sensor.foxcat_energy_energie_puissance_de_consommation_maison
                name: Consommation maison
              - entity: sensor.foxcat_energy_energie_puissance_reinjectee_au_reseau
                name: Réinjection réseau
              - entity: sensor.foxcat_energy_energie_puissance_prelevee_au_reseau
                name: Prélèvement réseau
      - type: grid
        cards:
          - type: markdown
            content: |
              ### Boiler · Stockage thermique
              Diagnostics des capteurs de température.
          - type: entities
            show_header_toggle: false
            entities:
              - entity: sensor.garage_boiler_sonde_temperature_temperature
                name: Température basse (Eau froide)
              - entity: sensor.temperature_boiler_2sondes_moyenne
                name: Température isolant
              - entity: sensor.foxcat_energy_boiler_temperature_chauffe_eau
                name: Température FoxCat
              - entity: sensor.foxcat_energy_boiler_puissance_chauffe_eau
                name: Puissance de chauffe
      - type: grid
        cards:
          - type: markdown
            content: |
              ### Machines · Autorisations EMS
              Statut des cycles et permissions d'exécution.
          - type: entities
            show_header_toggle: false
            entities:
              - entity: switch.lave_linge_prise_1
                name: Lave-linge · cycle
              - entity: switch.seche_linge_prise_1
                name: Sèche-linge · cycle
              - entity: switch.lave_vaisselle_prise_1
                name: Lave-vaisselle · prise
              - entity: switch.foxcat_energy_machines_gestion_lave_linge
                name: Gestion EMS lave-linge
              - entity: switch.foxcat_energy_machines_gestion_seche_linge
                name: Gestion EMS sèche-linge
              - entity: switch.foxcat_energy_machines_gestion_lave_vaisselle
                name: Gestion EMS lave-vaisselle
    cards: []
    theme: ios-dark-mode-blue-red
    badges:
      - type: custom:button-card
        template: fc_navbar
  - title: Technique
    path: technique
    icon: mdi:tune-vertical-variant
    subview: true
    type: sections
    max_columns: 4
    background: >-
      radial-gradient(circle at 7% 8%, rgba(255,160,39,.16), transparent 26%),
      radial-gradient(circle at 94% 9%, rgba(0,198,255,.18), transparent 29%),
      linear-gradient(150deg,#05080c,#0b121a 58%,#05070a)
    sections:
      - type: grid
        column_span: 4
        cards:
          - type: custom:button-card
            show_name: false
            show_icon: false
            custom_fields:
              content: |
                [[[
                  const mode=states['select.foxcat_energy_ems_mode_ems']?.state??'—', 
                        c=states['select.foxcat_energy_tarification_regime_tarifaire']?.state??'—', 
                        d=states['select.foxcat_energy_tarification_profil_distribution_belgique']?.state??'—', 
                        p=states['select.foxcat_energy_tarification_politique_reseau']?.state??'—';
                  return `<div class="confighead"><span>FOXCAT ENERGY · 1.7.0</span><h2>EMS CONFIGURATOR</h2><p>Le comportement du moteur, le contrat d’énergie, la distribution et la politique réseau sont indépendants.</p><div><b>${mode}</b><b>${c}</b><b>${d}</b><b>${p}</b></div></div>`;
                ]]]
            styles:
              card:
                - padding: 27px
                - border-radius: 30px
                - background: linear-gradient(430deg,rgba(36,23,8,.75),rgba(5,31,46,.82))
                - border: 1px solid rgba(255,255,255,.10)
                - box-shadow: 0 40px 60px rgba(0,0,0,.240)
            extra_styles: >
              .confighead>span{font-size:9px;font-weight:900;letter-spacing:.15em;opacity:.5;color:white;}.confighead
              h2{font-size:24px;letter-spacing:.08em;margin:6px
              0;color:white;}.confighead
              p{font-size:11px;opacity:.55;max-width:700px;color:white;}.confighead>div{display:flex;flex-wrap:wrap;gap:7px;margin-top:15px}.confighead
              b{font-size:10px;padding:8px
              10px;border-radius:14px;background:rgba(255,255,255,.055);border:1px
              solid rgba(255,255,255,.06);color:white;}
      - type: grid
        cards:
          - type: markdown
            content: >
              ### 1 · Comportement du moteur

              **Éco** applique les règles économiques de façon stricte.
              **Confort** conserve l’optimisation mais autorise davantage
              d’assouplissement.  **Manuel** désactive les décisions
              automatiques.
          - type: entities
            show_header_toggle: false
            entities:
              - entity: select.foxcat_energy_ems_mode_ems
                name: Comportement EMS
              - entity: switch.foxcat_energy_ems_regulation_foxcat_active
                name: Régulation FoxCat
              - entity: number.foxcat_energy_ems_assouplissement_economique_mode_confort
                name: Assouplissement Confort
      - type: grid
        cards:
          - type: markdown
            content: >
              ### 2 · Énergie, distribution et réseau

              Le **contrat énergie** détermine le prix d’achat. Le **profil
              distribution** décrit la structure du réseau belge. La **politique
              réseau** définit le traitement de l’injection.
          - type: entities
            show_header_toggle: false
            entities:
              - entity: select.foxcat_energy_tarification_regime_tarifaire
                name: Contrat énergie
              - entity: select.foxcat_energy_tarification_politique_reseau
                name: Politique réseau
              - entity: select.foxcat_energy_tarification_regime_tarifaire
                name: Distribution / comptage
              - entity: select.foxcat_energy_tarification_source_du_prix
      - type: grid
        cards:
          - type: conditional
            conditions:
              - entity: select.foxcat_energy_tarification_regime_tarifaire
                state: Dynamique
            card:
              type: vertical-stack
              cards:
                - type: markdown
                  content: >
                    ### 3 · Réglages Dynamic

                    Le **seuil favorable** définit le bas de la courbe
                    Day-Ahead. Le **plafond acceptable** bloque les nouveaux
                    achats flexibles au-delà de cette position.
                - type: entities
                  show_header_toggle: false
                  entities:
                    - entity: number.foxcat_energy_tarification_seuil_prix_favorable_day_ahead
                      name: Seuil favorable
                    - entity: number.foxcat_energy_tarification_seuil_zone_pic_day_ahead
                      name: Plafond acceptable
                    - entity: switch.foxcat_energy_tarification_predictif_prix_dynamique
                      name: Planification prix
                    - entity: switch.foxcat_energy_tarification_optimisation_economique_des_charges_flexibles
                      name: Arbitrage prévision solaire
      - type: grid
        column_span: 2
        cards:
          - type: markdown
            content: >
              ### 4 · Boiler · charge flexible

              La sonde dans le **doigt de gant bas** est fiable pour la
              sécurité.  Le capteur en **contact sur la tête de cuve** est
              utilisé pour la  tendance et la détection de puisage.
          - type: entities
            show_header_toggle: false
            entities:
              - entity: switch.foxcat_energy_boiler_boiler_gere_par_foxcat
                name: Charge flexible Boiler
              - entity: number.foxcat_energy_boiler_temperature_reprise_boiler
                name: Température de reprise
              - entity: number.foxcat_energy_boiler_temperature_confort_boiler
                name: Cible confort réseau
              - entity: number.foxcat_energy_boiler_temperature_boost_solaire
                name: Stockage solaire / boost
              - entity: number.foxcat_energy_boiler_securite_temperature_boiler
                name: Sécurité absolue
              - entity: number.foxcat_energy_boiler_correction_sonde_haute_boiler
                name: Correction capteur tête cuve
              - entity: number.foxcat_energy_boiler_duree_influence_resistance_sur_sonde_basse
                name: Durée influence résistance
              - entity: number.foxcat_energy_boiler_chute_rapide_detectant_un_puisage_ecs
                name: Chute de température = puisage
              - entity: number.foxcat_energy_boiler_confiance_minimale_fallback_boiler
                name: Confiance minimale fallback
      - type: grid
        cards:
          - type: markdown
            content: >
              ### 5 · Onduleur / PRI

              Le PRI reste indépendant du comportement tarifaire. En **Zéro
              injection**, il vise une réinjection quasi nulle ; en
              **Compensation**, la production reste libérée.
          - type: entities
            show_header_toggle: false
            entities:
              - entity: sensor.foxcat_energy_onduleur_ems_onduleur_etat
                name: Régulation PRI
              - entity: number.foxcat_energy_ems_injection_maximale_toleree
                name: Injection maximale tolérée
              - entity: number.foxcat_energy_ems_import_cible
                name: Import cible
              - entity: number.foxcat_energy_ems_import_maximal_avant_liberation_pv
                name: Import maximal avant libération PV
      - type: grid
        cards:
          - type: markdown
            content: >
              ### 6 · Maintenance

              La régénération du dashboard utilise le registre FoxCat et crée
              une sauvegarde du fichier existant avant remplacement.
          - type: entities
            show_header_toggle: false
            entities:
              - entity: button.foxcat_energy_diagnostic_regenerer_le_dashboard_foxcat
                name: Régénérer le dashboard
              - entity: button.foxcat_energy_diagnostic_lancer_un_diagnostic_ems
                name: Lancer diagnostic
              - entity: button.foxcat_energy_ems_reinitialiser_le_cycle_ems
                name: Réinitialiser cycle EMS
              - entity: input_boolean.ems_head_menu
              - entity: input_boolean.ems_head_lateral
    theme: ios-dark-mode-blue-red
    badges:
      - type: custom:button-card
        template: fc_navbar
background:
  opacity: 60
  alignment: center
  size: cover
  repeat: repeat
  attachment: fixed
