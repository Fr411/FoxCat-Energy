            custom_fields:
              card: |
                [[[
                  const S = (id, fallback = '—') => {
                    const v = states[id]?.state;
                    return (!v || ['unknown', 'unavailable', 'none', ''].includes(v))
                      ? fallback : v;
                  };

                  const N = (id) => {
                    const v = parseFloat(states[id]?.state);
                    return Number.isFinite(v) ? v : NaN;
                  };

                  const F = (v, unit = '', decimals = 1) =>
                    Number.isFinite(v)
                      ? `${v.toFixed(decimals).replace('.', ',')}${unit ? ' ' + unit : ''}`
                      : '—';

                  const temperature = N(
                    'sensor.foxcat_energy_boiler_temperature_chauffe_eau'
                  );

                  const power = N(
                    'sensor.foxcat_energy_boiler_puissance_chauffe_eau'
                  );

                  const estimatedTemperature = N(
                    'sensor.foxcat_energy_boiler_boiler_temperature_thermique_estimee'
                  );

                  const missingEnergy = N(
                    'sensor.foxcat_energy_boiler_boiler_energie_thermique_manquante'
                  );

                  const duration = N(
                    'sensor.foxcat_energy_boiler_boiler_duree_de_chauffe_estimee'
                  );

                  const confidence = N(
                    'sensor.foxcat_energy_boiler_boiler_confiance_estimation'
                  );

                  const capacity = N(
                    'sensor.foxcat_energy_boiler_boiler_capacite_thermique_confort'
                  );

                  const nominalPower = N(
                    'sensor.foxcat_energy_boiler_boiler_puissance_nominale_resistance'
                  );

                  const mode = S('select.foxcat_energy_ems_mode_ems', 'Indisponible');

                  const demand = S(
                    'sensor.foxcat_energy_boiler_demande_chauffe_eau',
                    'Aucune'
                  );

                  const origin = S(
                    'sensor.foxcat_energy_boiler_origine_de_la_demande_chauffe_eau',
                    'Non définie'
                  );

                  const execution = S(
                    'sensor.foxcat_energy_boiler_etat_dexecution_chauffe_eau',
                    'Indisponible'
                  );

                  const securitySource = S(
                    'sensor.foxcat_energy_boiler_source_securite_thermique',
                    'Indisponible'
                  );

                  const securityActive =
                    states['binary_sensor.foxcat_energy_boiler_securite_thermique_resistance']?.state === 'on';

                  const physical =
                    states['binary_sensor.foxcat_energy_boiler_boiler_physique']?.state === 'on';

                  const ecsEnabled =
                    states['switch.foxcat_energy_boiler_boiler_ecs_active']?.state === 'on';

                  const managed =
                    states['switch.foxcat_energy_boiler_boiler_gere_par_foxcat']?.state === 'on';

                  const authorizedHC =
                    states['switch.foxcat_energy_boiler_boiler_autorise_en_heures_creuses']?.state === 'on';

                  const running = physical && Number.isFinite(power) && power > 100;

                  const t = Number.isFinite(temperature) ? temperature : estimatedTemperature;
                  const fill = Number.isFinite(t)
                    ? Math.max(0, Math.min(100, ((t - 20) / 50) * 100))
                    : 0;

                  const target = N(
                    'number.foxcat_energy_boiler_temperature_confort_boiler'
                  );

                  const safeLimit = N(
                    'number.foxcat_energy_boiler_securite_temperature_boiler'
                  );

                  const runColor = securityActive
                    ? '#f87171'
                    : running ? '#fb923c' : '#64748b';

                  const tempColor = securityActive
                    ? '#f87171'
                    : (Number.isFinite(target) && Number.isFinite(t) && t >= target)
                      ? '#34d399' : '#38bdf8';

                  const status = securityActive
                    ? 'SÉCURITÉ THERMIQUE'
                    : running ? 'CHAUFFE EN COURS'
                    : physical ? 'EN ATTENTE'
                    : 'BALLON NON DÉTECTÉ';

                  const statusBg = securityActive
                    ? 'rgba(248,113,113,.12)'
                    : running ? 'rgba(251,146,60,.12)'
                    : 'rgba(148,163,184,.08)';

                  const safeText = securityActive
                    ? 'Sécurité active'
                    : securitySource;

                  const fmtPower = Number.isFinite(power)
                    ? F(power, 'W', 0) : '—';

                  return `
