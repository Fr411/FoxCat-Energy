                          .boiler-pipe.top { top: 25px; }
                          .boiler-pipe.bottom { bottom: 25px; }

                          .temp-block { text-align: left; min-width: 0; }

                          .temp-label {
                            font-size: 9px;
                            color: #8fa6bf;
                            font-weight: 900;
                            letter-spacing: .12em;
                          }

                          .temp-value {
