                            flex-direction:column;
                          }


                          .tariff-values span {

                            font-size:7px;

                            font-weight:900;
                          }


                          .tariff-values strong {

                            margin-top:4px;

                            color:#f1f5f9;

                            font-size:12px;
                          }


                          .tariff-values small {

                            margin-top:2px;

                            color:#64748b;

                            font-size:7px;
                          }


                          .hc-label {
                            color:#19d8ff;
                          }


                          .hp-label {
                            color:#ff922b;
                          }


                          .hc-fill {

                            height:100%;

                            background:#19d8ff;
                          }


                          .hp-fill {

                            height:100%;

                            background:#ff922b;
                          }


                          .tariff-unavailable {

                            margin-top:13px;

                            padding:9px;

                            border-radius:10px;

                            color:#526174;

                            background:
                              rgba(255,255,255,.018);

                            font-size:7px;

                            text-align:center;
                          }


                          /* =====================================================
                             FOOTER APPAREIL
                             ===================================================== */

                          .device-footer {

