                          legacy_hp_2: 'sensor.foxcat_energy_energie_lave_vaisselle_consommation_hp_aujourdhui'
                        }

                      };


                      /* ==========================================================
                         OUTILS DU REGISTRE
                         ========================================================== */

                      const entityList = (
                        ...values
                      ) =>
                        values
                          .flat(Infinity)
                          .filter(
                            (id) =>
                              typeof id === 'string'
                              &&
                              id.trim() !== ''
                          );


                      const firstExisting = (
                        ...values
                      ) =>
                        entityList(
                          ...values
                        )
                          .find(
                            (id) =>
                              !!states[id]
                          )
                        ||
                        null;


                      /* ==========================================================
                         RECHERCHE AUTOMATIQUE
                         ========================================================== */

                      const entityText = (id) => {

                        const s =
                          states[id];

                        return norm(
                          `${id} ${s?.attributes?.friendly_name || ''}`
                        );
                      };


                      const findEntity = (
                        domain,
                        requiredWords = [],
                        candidates = [],
                        rejectedWords = []
                      ) => {

                        for (
                          const id
                          of candidates
                        ) {

                          if (
                            states[id]
                          ) {
                            return id;
                          }
                        }


                        const wanted =
                          requiredWords
                            .map(norm)
                            .filter(Boolean);


                        const rejected =
                          rejectedWords
                            .map(norm)
                            .filter(Boolean);


                        return (
                          Object.keys(states)

                            .filter(
                              (id) =>
                                id.startsWith(
                                  `${domain}.`
                                )
                            )

                            .find(
                              (id) => {

                                const text =
                                  entityText(id);


                                return (
                                  wanted.every(
                                    (w) =>
                                      text.includes(w)
                                  )
                                  &&
                                  !rejected.some(
                                    (w) =>
                                      text.includes(w)
                                  )
                                );
                              }
                            )
                          ||
                          null
                        );
                      };


                      const findFox = (
                        domain,
                        requiredWords = [],
                        candidates = [],
                        rejectedWords = []
                      ) => {

                        /*
                         * 1 — Registre prioritaire.
                         */

                        for (
                          const id
                          of candidates
                        ) {

                          if (
                            states[id]
                          ) {
                            return id;
                          }
                        }


                        /*
                         * 2 — Recherche automatique FoxCat.
                         */

                        const wanted =
                          requiredWords
                            .map(norm)
                            .filter(Boolean);


                        const rejected =
                          rejectedWords
                            .map(norm)
                            .filter(Boolean);


                        return (
                          Object.keys(states)

                            .filter(
                              (id) =>
                                id.startsWith(
                                  `${domain}.`
                                )
                            )

                            .find(
                              (id) => {

                                const text =
                                  entityText(id);


                                const fox =
                                  text.includes(
                                    'foxcat energy'
                                  )
                                  ||
                                  norm(id).includes(
                                    'foxcat energy'
                                  );


                                return (
                                  fox
                                  &&
                                  wanted.every(
                                    (w) =>
                                      text.includes(w)
                                  )
                                  &&
                                  !rejected.some(
                                    (w) =>
                                      text.includes(w)
                                  )
                                );
                              }
                            )
                          ||
                          null
                        );
                      };


                      const findPowerSensor = (
                        deviceWords = [],
                        candidates = []
                      ) => {

                        /*
                         * Registre / anciennes entités prioritaires.
                         */

                        for (
                          const id
                          of candidates
                        ) {

                          if (
                            states[id]
                          ) {
                            return id;
                          }
                        }


                        const wanted =
                          deviceWords
                            .map(norm)
                            .filter(Boolean);


                        return (
                          Object.keys(states)

                            .filter(
                              (id) =>
                                id.startsWith(
                                  'sensor.'
                                )
                            )

                            .find(
                              (id) => {

                                const s =
                                  states[id];


                                const text =
                                  entityText(id);


                                const unit =
                                  s?.attributes?.unit_of_measurement
                                  ||
                                  '';


                                const cls =
                                  s?.attributes?.device_class
                                  ||
                                  '';


                                return (
                                  wanted.some(
                                    (w) =>
                                      text.includes(w)
                                  )
                                  &&
                                  (
                                    cls === 'power'
                                    ||
                                    unit === 'W'
                                    ||
                                    unit === 'kW'
                                  )
                                );
                              }
                            )
                          ||
                          null
                        );
                      };


                      /* ==========================================================
                         GESTION FOXCAT
                         ========================================================== */

                      const management = (
                        words,
                        legacy = null,
                        preferred = null
                      ) => {

                        /*
                         * 1 — Entité renseignée dans le registre.
                         * 2 — Détection automatique FoxCat.
                         */

                        const native =
                          findFox(
                            'switch',
                            words,
                            entityList(
                              preferred
                            )
                          );


                        if (
                          native
                        ) {

                          return {

                            entity:
                              native,

                            enabled:
                              isOn(native),

                            native:
                              true
                          };
                        }


                        /*
                         * Secours legacy.
                         */

                        const legacyEntity =
                          firstExisting(
                            legacy
                          );


                        if (
                          legacyEntity
                        ) {

                          return {

                            entity:
                              legacyEntity,

                            enabled:
                              isOn(
                                legacyEntity
                              ),

                            native:
                              false
                          };
                        }


                        return {

                          entity:
                            null,

                          enabled:
                            false,

                          native:
                            false
                        };
                      };


                      /* ==========================================================
                         CONTEXTE FOXCAT
                         ========================================================== */

                      const modeEntity =
                        findFox(
                          'select',
                          [
                            'mode',
                            'ems'
                          ],
                          entityList(
                            ENTITIES.foxcat.mode_ems
                          )
                        );


                      const tariffEntity =
                        findFox(
                          'select',
                          [
                            'regime',
                            'tarifaire'
                          ],
                          entityList(
                            ENTITIES.foxcat.regime_tarifaire
                          )
                        );


                      const tariffActiveEntity =
                        findFox(
                          'sensor',
                          [
                            'regime',
                            'tarifaire',
                            'actif'
                          ],
                          entityList(
                            ENTITIES.foxcat.regime_tarifaire_actif
                          )
                        );


                      const periodEntity =
                        findFox(
                          'sensor',
                          [
                            'periode',
                            'tarifaire'
                          ],
                          entityList(
                            ENTITIES.foxcat.periode_tarifaire
                          )
                        );


                      const activePriceEntity =
                        findFox(
                          'sensor',
                          [
                            'prix',
                            'achat',
                            'actif'
                          ],
                          entityList(
                            ENTITIES.foxcat.prix_achat_actif
                          )
                        );


                      const priceStatusEntity =
                        findFox(
                          'sensor',
                          [
                            'statut',
                            'prix'
                          ],
                          entityList(
                            ENTITIES.foxcat.statut_prix
                          )
                        );


                      const machineWindowEntity =
                        findFox(
                          'binary_sensor',
                          [
                            'fenetre',
                            'machines'
                          ],
                          entityList(
                            ENTITIES.foxcat.fenetre_machines
                          )
                        );


                      const protectedMachineEntity =
                        findFox(
                          'binary_sensor',
                          [
                            'machine',
                            'protegee',
                            'active'
                          ],
                          entityList(
                            ENTITIES.foxcat.machine_protegee_active
                          )
                        );


                      const highLoadEntity =
                        findFox(
                          'binary_sensor',
                          [
                            'delestage',
                            'haute',
                            'consommation',
                            'actif'
                          ],
                          entityList(
                            ENTITIES.foxcat.delestage_haute_consommation_actif
                          )
                        );


                      const loadSheddingStatusEntity =
                        findFox(
                          'sensor',
                          [
                            'statut',
                            'delestage',
                            'haute',
                            'consommation'
                          ],
                          entityList(
                            ENTITIES.foxcat.statut_delestage_haute_consommation
                          )
                        );


                      const mode =
                        stateOf(
                          modeEntity,
                          '—'
                        );


                      const tariff =
                        stateOf(
                          tariffEntity,
                          stateOf(
                            tariffActiveEntity,
                            '—'
                          )
                        );


                      const tariffPeriod =
                        stateOf(
                          periodEntity,
                          '—'
                        );


                      const activePrice =
                        numberOf(
                          activePriceEntity,
                          numberOf(
                            ENTITIES.external.prix_luminus_fallback,
                            0
                          )
                        );


                      const priceStatus =
                        stateOf(
                          priceStatusEntity,
                          '—'
                        );


                      const machineWindow =
                        isOn(
                          machineWindowEntity
                        );


                      const protectedMachine =
                        isOn(
                          protectedMachineEntity
                        );


                      const highLoad =
                        isOn(
                          highLoadEntity
                        );


                      const loadSheddingStatus =
                        stateOf(
                          loadSheddingStatusEntity,
                          highLoad
                            ? 'ACTIF'
                            : 'NORMAL'
                        );


                      /* ==========================================================
                         BILAN MAISON FOXCAT
                         ========================================================== */

                      const houseAccountingEntity =
                        findFox(
                          'sensor',
                          [
                            'maison',
                            'consommation',
                            'aujourd'
                          ],
                          entityList(
                            ENTITIES.foxcat.consommation_maison_aujourdhui
                          )
                        );


                      const houseCostEntity =
                        findFox(
                          'sensor',
                          [
                            'maison',
                            'cout',
                            'net',
                            'aujourd'
                          ],
                          entityList(
                            ENTITIES.foxcat.cout_net_maison_aujourdhui
                          )
                        );


                      const totalHouseEnergy =
                        numberOf(
                          houseAccountingEntity,
                          0
                        );


                      const totalHouseCost =
                        numberOf(
                          houseCostEntity,
                          0
                        );


                      /* ==========================================================
                         CONFIGURATION DES APPAREILS
                         ========================================================== */

                      const devices = [


                        /* ========================================================
                           BOILER
                           ======================================================== */

                        {

                          id:
                            'boiler',

                          registry:
                            ENTITIES.boiler,

                          nativeNames: [
                            'chauffe eau',
                            'boiler'
                          ],

                          name:
                            'Boiler ECS',

                          nativeLabel:
                            'Chauffe-eau',

                          icon:
                            'mdi:water-boiler',

                          color:
                            '#ff922b',


                          management:
                            management(
                              [
                                'boiler',
                                'gere',
                                'foxcat'
                              ],
                              ENTITIES.boiler.legacy_gestion,
                              ENTITIES.boiler.gestion
                            ),


                          powerCandidates:
                            entityList(
                              ENTITIES.boiler.puissance,
                              ENTITIES.boiler.legacy_puissance
                            ),


                          cycleCandidates:
                            entityList(
                              ENTITIES.boiler.cycle,
                              ENTITIES.boiler.legacy_cycle_2,
                              ENTITIES.boiler.legacy_cycle
                            ),


                          legacy: {

                            energy:
                              entityList(
                                ENTITIES.boiler.legacy_energie
                              ),

                            cost:
                              entityList(
                                ENTITIES.boiler.legacy_cout
                              ),

                            hc:
                              entityList(
                                ENTITIES.boiler.legacy_hc
                              ),

                            hp:
                              entityList(
                                ENTITIES.boiler.legacy_hp
                              )
                          }

                        },


                        /* ========================================================
                           LAVE-LINGE
                           ======================================================== */

                        {

                          id:
                            'washer',

                          registry:
                            ENTITIES.lave_linge,

                          nativeNames: [
                            'lave linge',
                            'washer'
                          ],

                          name:
                            'Lave-linge',

                          nativeLabel:
                            'Lave-linge',

                          icon:
                            'mdi:washing-machine',

                          color:
                            '#19d8ff',


                          management:
                            management(
                              [
                                'gestion',
                                'lave linge'
                              ],
                              ENTITIES.lave_linge.legacy_gestion,
