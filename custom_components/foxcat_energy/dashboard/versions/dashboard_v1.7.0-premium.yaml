                    - border: 1px solid rgba(56,189,248,0.22)
                    - box-shadow: 0 12px 35px rgba(0,0,0,0.35)
                  grid:
                    - grid-template-areas: '"card"'
                    - grid-template-columns: 1fr
                  custom_fields:
                    card:
                      - width: 100%
                custom_fields:
                  card: |
                    [[[
                      const S = (id, fallback = '—') => {
                        const v = states[id]?.state;
                        return (!v || ['unknown', 'unavailable', 'none', ''].includes(v))
                          ? fallback : v;
                      };

                      const N = (id) => {
                        const v = parseFloat(states[id]?.state);
                        return Number.isFinite(v) ? v : NaN;
                      };

                      const F = (v, unit = '', decimals = 1) =>
                        Number.isFinite(v)
                          ? `${v.toFixed(decimals).replace('.', ',')}${unit ? ' ' + unit : ''}`
                          : '—';

                      const temperature = N(
                        'sensor.foxcat_energy_boiler_temperature_chauffe_eau'
                      );

                      const power = N(
                        'sensor.foxcat_energy_boiler_puissance_chauffe_eau'
                      );

                      const estimatedTemperature = N(
                        'sensor.foxcat_energy_boiler_boiler_temperature_thermique_estimee'
                      );

                      const missingEnergy = N(
                        'sensor.foxcat_energy_boiler_boiler_energie_thermique_manquante'
                      );

                      const duration = N(
                        'sensor.foxcat_energy_boiler_boiler_duree_de_chauffe_estimee'
                      );

                      const confidence = N(
                        'sensor.foxcat_energy_boiler_boiler_confiance_estimation'
                      );

                      const capacity = N(
                        'sensor.foxcat_energy_boiler_boiler_capacite_thermique_confort'
                      );

                      const nominalPower = N(
                        'sensor.foxcat_energy_boiler_boiler_puissance_nominale_resistance'
                      );

                      const mode = S('select.foxcat_energy_ems_mode_ems', 'Indisponible');

                      const demand = S(
                        'sensor.foxcat_energy_boiler_demande_chauffe_eau',
                        'Aucune'
                      );

                      const origin = S(
                        'sensor.foxcat_energy_boiler_origine_de_la_demande_chauffe_eau',
                        'Non définie'
                      );

                      const execution = S(
                        'sensor.foxcat_energy_boiler_etat_dexecution_chauffe_eau',
                        'Indisponible'
                      );

                      const securitySource = S(
                        'sensor.foxcat_energy_boiler_source_securite_thermique',
                        'Indisponible'
                      );

                      const securityActive =
                        states['binary_sensor.foxcat_energy_boiler_securite_thermique_resistance']?.state === 'on';

                      const physical =
                        states['binary_sensor.foxcat_energy_boiler_boiler_physique']?.state === 'on';

                      const ecsEnabled =
                        states['switch.foxcat_energy_boiler_boiler_ecs_active']?.state === 'on';

                      const managed =
                        states['switch.foxcat_energy_boiler_boiler_gere_par_foxcat']?.state === 'on';

                      const authorizedHC =
                        states['switch.foxcat_energy_boiler_boiler_autorise_en_heures_creuses']?.state === 'on';

                      const running = physical && Number.isFinite(power) && power > 100;

                      const t = Number.isFinite(temperature) ? temperature : estimatedTemperature;
                      const fill = Number.isFinite(t)
                        ? Math.max(0, Math.min(100, ((t - 20) / 50) * 100))
                        : 0;

                      const target = N(
                        'number.foxcat_energy_boiler_temperature_confort_boiler'
                      );

                      const safeLimit = N(
                        'number.foxcat_energy_boiler_securite_temperature_boiler'
                      );

                      const runColor = securityActive
                        ? '#f87171'
                        : running ? '#fb923c' : '#64748b';

                      const tempColor = securityActive
                        ? '#f87171'
                        : (Number.isFinite(target) && Number.isFinite(t) && t >= target)
                          ? '#34d399' : '#38bdf8';

                      const status = securityActive
                        ? 'SÉCURITÉ THERMIQUE'
                        : running ? 'CHAUFFE EN COURS'
                        : physical ? 'EN ATTENTE'
                        : 'BALLON NON DÉTECTÉ';

                      const statusBg = securityActive
                        ? 'rgba(248,113,113,.12)'
                        : running ? 'rgba(251,146,60,.12)'
                        : 'rgba(148,163,184,.08)';

                      const safeText = securityActive
                        ? 'Sécurité active'
                        : securitySource;

                      const fmtPower = Number.isFinite(power)
                        ? F(power, 'W', 0) : '—';

                      return `
                        <style>
                          * { box-sizing: border-box; }

                          .prem-card {
                            padding: 20px;
                            color: #f8fafc;
                            font-family: -apple-system, BlinkMacSystemFont,
                              "Segoe UI", Roboto, sans-serif;
                          }

                          .prem-head {
                            display: flex;
                            align-items: center;
                            justify-content: space-between;
                            gap: 12px;
                            margin-bottom: 20px;
                          }

                          .prem-title {
                            font-size: 19px;
                            font-weight: 900;
                            letter-spacing: .02em;
                          }

                          .prem-sub {
                            margin-top: 5px;
                            font-size: 10px;
                            color: #8fa6bf;
                            letter-spacing: .12em;
                            font-weight: 800;
                          }

                          .prem-status {
                            padding: 8px 10px;
                            border-radius: 10px;
                            border: 1px solid ${runColor}55;
                            background: ${statusBg};
                            color: ${runColor};
                            font-size: 9px;
                            font-weight: 900;
                            letter-spacing: .06em;
                            text-align: center;
                          }

                          .prem-body {
                            display: flex;
                            align-items: center;
                            justify-content: center;
                            gap: 28px;
                            padding: 8px 0 22px;
                          }

                          .css-boiler {
                            position: relative;
                            flex: 0 0 76px;
                            width: 76px;
                            height: 156px;
                            border-radius: 38px;
                            overflow: hidden;
                            background: linear-gradient(
                              100deg, #0b1220 0%, #334155 20%,
                              #172235 45%, #0b1220 75%, #475569 100%
                            );
                            border: 2px solid #64748b88;
                            box-shadow:
                              inset 5px 0 8px rgba(255,255,255,.07),
                              inset -7px 0 10px rgba(0,0,0,.55),
                              0 12px 22px rgba(0,0,0,.4);
                          }

                          .boiler-inner {
                            position: absolute;
                            left: 9px;
                            right: 9px;
                            top: 8px;
                            bottom: 8px;
                            overflow: hidden;
                            border-radius: 28px;
                            background: #081321;
                            border: 1px solid rgba(255,255,255,.08);
                          }

                          .boiler-water {
                            position: absolute;
                            bottom: 0;
                            left: 0;
                            right: 0;
                            height: ${fill}%;
                            min-height: 3px;
                            background: linear-gradient(
                              180deg,
                              ${tempColor}99 0%,
                              ${tempColor}55 45%,
                              ${tempColor}22 100%
                            );
                            transition: height .6s ease;
                            box-shadow: ${running ? `0 0 18px ${tempColor}66` : 'none'};
                          }

                          .boiler-water:before {
                            content: "";
                            position: absolute;
                            top: 0;
                            left: 0;
                            right: 0;
                            height: 5px;
                            background: ${tempColor};
                            opacity: .85;
                          }

                          .boiler-heater {
                            position: absolute;
                            left: 50%;
                            top: 48%;
                            width: 28px;
                            height: 44px;
                            transform: translate(-50%,-50%);
