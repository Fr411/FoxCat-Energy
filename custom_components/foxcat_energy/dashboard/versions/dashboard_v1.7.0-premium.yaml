                          /* =====================================================
                             ÉNERGIE / COÛT
                             ===================================================== */

                          .main-values {

                            display:grid;

                            grid-template-columns:
                              1fr 1fr;

                            gap:10px;

                            margin-top:15px;
                          }


                          .energy-value {

                            margin-top:5px;

                            color:
                              var(--device);

                            font-size:22px;

                            font-weight:900;
                          }


                          .cost-block {
                            text-align:right;
                          }


                          .cost-value {

                            margin-top:5px;

                            color:#35e59d;

                            font-size:22px;

                            font-weight:900;
                          }


                          .cost-source {

                            margin-top:3px;

                            color:#526174;

                            font-size:5.5px;

                            font-weight:800;

                            letter-spacing:.06em;
                          }


                          /* =====================================================
                             PUISSANCE
                             ===================================================== */

                          .power-line {

                            display:flex;

                            align-items:center;

                            justify-content:space-between;

                            gap:10px;

                            margin-top:12px;

                            padding-top:10px;

                            border-top:
                              1px solid rgba(255,255,255,.045);

                            color:#64748b;

                            font-size:8px;
                          }


                          .power-line strong {

                            color:#e2e8f0;

                            font-size:9px;
                          }


                          /* =====================================================
                             PART SOLAIRE / RÉSEAU
                             ===================================================== */

                          .source-grid {

                            display:grid;

                            grid-template-columns:
                              1fr 1fr;

                            gap:10px;

