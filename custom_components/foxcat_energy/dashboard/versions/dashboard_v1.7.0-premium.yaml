      - type: vertical-stack
        cards:
          - type: custom:button-card
            template: fc_navbar
          - type: custom:button-card
            template: fc_head
            variables: {title: EMS Configurator, subtitle: 'Comportement · Contrat · Distribution · Politique réseau · Installateur only', icon: mdi:cog, color: '#94a3b8'}
          - type: grid
            columns: 3
            square: false
            cards:
              - type: entities
                title: 1 · Comportement du moteur
                show_header_toggle: false
                entities:
                  - {entity: '[[foxcat:ems.mode]]', name: Comportement EMS}
                  - {entity: '[[foxcat:ems.regulation_active]]', name: Régulation FoxCat}
                  - {entity: '[[foxcat:pricing.behavior_relaxation]]', name: Assouplissement Confort}
                card_mod:
                  style: |
                    ha-card{background:linear-gradient(160deg,#0d1a2c,#08111e)!important;border:1px solid rgba(90,150,220,.18)!important;border-radius:18px!important;box-shadow:0 10px 30px rgba(0,0,0,.35)!important;color:#e8f1fb}
                    .card-header{font-size:15px!important;font-weight:700!important}
              - type: entities
                title: 2 · Énergie, distribution et réseau
                show_header_toggle: false
                entities:
                  - {entity: '[[foxcat:pricing.regime]]', name: Contrat énergie}
                  - {entity: '[[foxcat:pricing.distribution_profile]]', name: Distribution / comptage}
                  - {entity: '[[foxcat:pricing.network_policy]]', name: Politique réseau}
                  - {entity: '[[foxcat:pricing.distribution_period]]', name: Période distribution}
