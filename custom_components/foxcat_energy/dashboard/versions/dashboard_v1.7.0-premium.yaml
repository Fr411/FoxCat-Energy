                      const W=v=>v>=1000?(v/1000).toFixed(2).replace('.',',')+' kW':Math.round(v)+' W';
                      const pv=N('sensor.foxcat_energy_energie_puissance_de_production_photovoltaique'),h=N('sensor.foxcat_energy_energie_puissance_de_consommation_maison'),im=N('sensor.foxcat_energy_energie_puissance_prelevee_au_reseau'),ex=N('sensor.foxcat_energy_energie_puissance_reinjectee_au_reseau');
                      const cov=h>0?Math.min(pv/h*100,100):0;
                      let t='Équilibre énergétique stable.',c='#60a5fa';
                      if(ex>150){t=`Surplus solaire : ${W(ex)} sont actuellement réinjectés.`;c='#34d399'}
                      else if(im>500){t=`La maison prélève actuellement ${W(im)} sur le réseau.`;c='#fb7185'}
                      else if(pv>50&&cov>=95){t='Le solaire couvre pratiquement toute la consommation actuelle.';c='#facc15'}
                      else if(pv>50){t=`Le photovoltaïque couvre ${Math.round(cov)} % des besoins de la maison.`;c='#22d3ee'}
                      return `<div class="p"><div class="t"><span>✨ Analyse énergétique</span></div>
                        <div style="padding:14px;border-radius:14px;background:${c}14;border:1px solid ${c}55;font-size:14px;line-height:1.5">${t}</div>
                        <div class="quote">« Le bon kWh est celui qu'on n'achète pas. »</div></div>`;
