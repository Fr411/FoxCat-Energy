              - type: custom:button-card
                template: fc_panel
                custom_fields:
                  c: |
                    [[[
                      // 1. Outils et normalisation FoxCat
                      const nm = s => String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
                      const F = (d, w) => Object.keys(states).find(i => {
                        if (!i.startsWith(d + '.')) return false;
                        const t = nm(i + ' ' + (states[i].attributes.friendly_name || ''));
                        return t.includes('foxcat energy') && w.every(x => t.includes(nm(x)));
                      }) || null;
                      
                      const S = (i, f = '—') => {
                        if (!i || !states[i]) return f;
                        const v = states[i].state;
                        return ['unknown', 'unavailable', 'none', ''].includes(v) ? f : v;
                      };
                      
                      const N = (i, f = 0) => {
                        const v = parseFloat(S(i, ''));
                        return isFinite(v) ? v : f;
                      };
                      
                      const W = v => {
                        v = Math.abs(v);
                        return v >= 1000 ? (v / 1000).toFixed(2).replace('.', ',') + ' kW' : Math.round(v) + ' W';
                      };

                      // 2. Récupération des variables
                      const lvl = Math.min(Math.max(N(F('sensor', ['niveau', 'puissance', 'pri', 'actuel']), 100), 0), 100);
                      const tgt = Math.round(N(F('sensor', ['niveau', 'puissance', 'pri', 'cible']), lvl));
                      const dir = S(F('sensor', ['direction', 'pri']), 'Maintien');
                      const ackInv = S(F('sensor', ['ack', 'onduleur']));
                      const ackR = S(F('sensor', ['ack', 'rrcr']));
                      const ok = !/FAILED|ERREUR/i.test(ackInv + ackR);
                      const pv = Math.max(N('sensor.foxcat_energy_energie_puissance_de_production_photovoltaique'), 0);
                      const ex = Math.max(N('sensor.foxcat_energy_energie_puissance_reinjectee_au_reseau'), 0);

                      // 3. Calcul de la jauge SVG
                      const radius = 40;
                      const circumference = 2 * Math.PI * radius;
                      const dashoffset = circumference - (circumference * lvl / 100);
                      
                      // Couleurs dynamiques
                      const statusColor = ok ? '#35e59d' : '#fb7185';
                      const statusBg = ok ? 'rgba(53,229,157,0.12)' : 'rgba(251,113,133,0.12)';
                      const dirColor = dir.toLowerCase().includes('baisse') ? '#35e59d' : dir.toLowerCase().includes('hausse') ? '#fb7185' : '#19d8ff';

                      // 4. Rendu HTML Premium
