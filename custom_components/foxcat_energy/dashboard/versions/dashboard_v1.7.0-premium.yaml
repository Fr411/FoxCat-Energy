                      type: area
                      color: '#a78bfa'
                      stroke_width: 4
                      opacity: 1
                      float_precision: 3
                      show:
                        extremas: true
                      data_generator: >
                        if (!entity || !entity.attributes ||
                        !entity.attributes.today) return [];

                        const rows = [
                          ...(entity.attributes.today || []),
                          ...(entity.attributes.tomorrow || [])
                        ];

                        return rows
                          .filter(r => r.start != null && r.all_in != null && Number.isFinite(Number(r.all_in)))
                          .map(r => [new Date(r.start).getTime(), Number(r.all_in)])
                          .filter(p => Number.isFinite(p[0]) && Number.isFinite(p[1]))
                          .sort((a,b) => a[0] - b[0]);
