                          .temp-bar i {
                            display: block;
                            height: 100%;
                            width: ${fill}%;
                            background: ${tempColor};
                            border-radius: inherit;
                          }

                          .prem-grid {
                            display: grid;
                            grid-template-columns: repeat(3,minmax(0,1fr));
                            gap: 8px;
                          }

                          .prem-stat {
                            min-width: 0;
                            padding: 12px 8px;
                            border-radius: 13px;
                            background: rgba(255,255,255,.035);
                            border: 1px solid rgba(255,255,255,.06);
                          }

                          .prem-stat span {
                            display: block;
                            font-size: 8px;
                            color: #8fa6bf;
                            font-weight: 800;
                            letter-spacing: .07em;
                          }

                          .prem-stat b {
                            display: block;
                            margin-top: 7px;
                            font-size: 14px;
                            font-weight: 900;
                            overflow-wrap: anywhere;
                          }

                          .prem-section {
                            margin-top: 14px;
                            padding: 13px;
                            border-radius: 14px;
                            background: rgba(255,255,255,.025);
                            border: 1px solid rgba(255,255,255,.06);
                          }

                          .prem-section-title {
                            font-size: 9px;
                            font-weight: 900;
                            color: #38bdf8;
                            letter-spacing: .12em;
                            margin-bottom: 8px;
                          }

                          .prem-row {
                            display: flex;
                            align-items: flex-start;
                            justify-content: space-between;
                            gap: 12px;
                            padding: 8px 0;
                            border-bottom: 1px solid rgba(255,255,255,.045);
                            font-size: 11px;
                          }

                          .prem-row:last-child { border-bottom: none; }

                          .prem-row span { color: #8fa6bf; }

                          .prem-row b {
                            text-align: right;
                            font-weight: 800;
                            max-width: 62%;
                            overflow-wrap: anywhere;
                          }

                          .prem-footer {
                            margin-top: 14px;
                            padding: 11px;
                            border-radius: 12px;
                            background: ${securityActive
                              ? 'rgba(248,113,113,.1)'
                              : 'rgba(56,189,248,.06)'};
                            border: 1px solid ${securityActive
                              ? 'rgba(248,113,113,.3)'
                              : 'rgba(56,189,248,.15)'};
                            font-size: 10px;
                            line-height: 1.5;
                          }

                          @media (max-width: 450px) {
                            .prem-card { padding: 14px; }
                            .prem-body { gap: 18px; }
                            .css-boiler { transform: scale(.9); transform-origin: center; }
                            .temp-value { font-size: 30px; }
                            .prem-grid { gap: 6px; }
                            .prem-stat { padding: 10px 6px; }
                            .prem-stat b { font-size: 12px; }
                          }
                        </style>

                        <div class="prem-card">
                          <div class="prem-head">
                            <div>
                              <div class="prem-title">
                                <ha-icon icon="mdi:water-boiler"
                                  style="color:#38bdf8;--mdc-icon-size:22px;vertical-align:middle;margin-right:7px">
                                </ha-icon>
                                Boiler ECS
                              </div>
                              <div class="prem-sub">FOXCAT ENERGY · GESTION THERMIQUE</div>
                            </div>
                            <div class="prem-status">${status}</div>
                          </div>

                          <div class="prem-body">
                            <div style="position:relative">
                              <div class="css-boiler">
                                <div class="boiler-inner">
                                  <div class="boiler-water"></div>
                                  <div class="boiler-heater"></div>
                                </div>
                              </div>
                              <div class="boiler-pipe top"></div>
                              <div class="boiler-pipe bottom"></div>
                            </div>

                            <div class="temp-block">
                              <div class="temp-label">TEMPÉRATURE DE L'EAU</div>
                              <div class="temp-value">${F(temperature, '°C')}</div>
                              <div class="temp-target">
                                Consigne confort : ${F(target, '°C')}
                              </div>
                              <div class="temp-bar"><i></i></div>
                              <div class="temp-target">
                                ${F(fill, '%', 0)} de l'échelle visuelle 20–70 °C
                              </div>
                            </div>
                          </div>

                          <div class="prem-grid">
                            <div class="prem-stat">
                              <span>PUISSANCE ACTUELLE</span>
                              <b style="color:${runColor}">${fmtPower}</b>
                            </div>
                            <div class="prem-stat">
                              <span>PUISSANCE NOMINALE</span>
                              <b>${F(nominalPower, 'W', 0)}</b>
                            </div>
                            <div class="prem-stat">
                              <span>TEMP. ESTIMÉE</span>
                              <b>${F(estimatedTemperature, '°C')}</b>
                            </div>
                            <div class="prem-stat">
                              <span>ÉNERGIE MANQUANTE</span>
                              <b>${F(missingEnergy, 'kWh', 2)}</b>
                            </div>
                            <div class="prem-stat">
                              <span>DURÉE ESTIMÉE</span>
                              <b>${F(duration, 'h', 2)}</b>
                            </div>
                            <div class="prem-stat">
                              <span>CONFIANCE</span>
                              <b>${F(confidence, '%', 0)}</b>
                            </div>
                          </div>

                          <div class="prem-section">
                            <div class="prem-section-title">PILOTAGE FOXCAT</div>
                            <div class="prem-row">
                              <span>Mode EMS</span><b>${mode}</b>
                            </div>
                            <div class="prem-row">
                              <span>Demande ECS</span><b>${demand}</b>
                            </div>
                            <div class="prem-row">
                              <span>Origine de la demande</span><b>${origin}</b>
                            </div>
                            <div class="prem-row">
                              <span>État d'exécution</span><b>${execution}</b>
                            </div>
                            <div class="prem-row">
                              <span>Capacité thermique confort</span><b>${F(capacity, 'kWh', 2)}</b>
                            </div>
                          </div>

                          <div class="prem-section">
                            <div class="prem-section-title">AUTORISATIONS & SÉCURITÉS</div>
                            <div class="prem-row">
                              <span>Ballon physique détecté</span>
                              <b style="color:${physical ? '#34d399' : '#f87171'}">
                                ${physical ? 'OUI' : 'NON'}
                              </b>
                            </div>
                            <div class="prem-row">
                              <span>Gestion par FoxCat</span>
                              <b style="color:${managed ? '#34d399' : '#94a3b8'}">
                                ${managed ? 'ACTIVE' : 'INACTIVE'}
                              </b>
                            </div>
                            <div class="prem-row">
                              <span>Autorisation ECS</span>
                              <b style="color:${ecsEnabled ? '#34d399' : '#94a3b8'}">
                                ${ecsEnabled ? 'ACTIVE' : 'INACTIVE'}
                              </b>
                            </div>
                            <div class="prem-row">
                              <span>Autorisation heures creuses</span>
                              <b>${authorizedHC ? 'OUI' : 'NON'}</b>
                            </div>
                            <div class="prem-row">
                              <span>Source de sécurité thermique</span>
                              <b>${safeText}</b>
                            </div>
                            <div class="prem-row">
                              <span>Seuil de sécurité configuré</span>
                              <b>${F(safeLimit, '°C')}</b>
                            </div>
                          </div>

                          <div class="prem-footer">
                            <b style="color:${securityActive ? '#f87171' : '#38bdf8'}">
                              ${securityActive ? 'SÉCURITÉ THERMIQUE ACTIVE' : 'ÉTAT DE SÉCURITÉ'}
                            </b><br>
                            ${securityActive
                              ? 'La sécurité thermique de la résistance est signalée active. Vérifier le diagnostic FoxCat.'
                              : 'État de sécurité : ' + safeText + '.'}
                            <br>
                            L'affichage ne commande pas directement la résistance.
                          </div>
                        </div>
                      `;
                    ]]]
              - type: custom:button-card
                template: fc_panel
                tap_action:
                  action: navigate
                  navigation_path: appareils
                show_icon: false
                show_name: false
                show_state: false
                triggers_update: all
                custom_fields:
                  c: |
                    [[[
                      // =====================================================
                      // 1. OUTILS
                      // =====================================================
                      const norm = value => String(value ?? '')
                        .normalize('NFD')
                        .replace(/[\u0300-\u036f]/g, '')
                        .toLowerCase()
                        .replace(/[^a-z0-9]+/g, ' ')
                        .trim();

                      const entityText = entityId => {
                        const entity = states[entityId];
                        return norm(
                          entityId + ' ' +
                          (entity?.attributes?.friendly_name || '')
                        );
                      };

                      // Recherche prudente : priorité au premier groupe
                      // correspondant, sans confondre les domaines.
                      const findEntity = (domains, groups) => {
                        const ids = Object.keys(states);

                        for (const words of groups) {
                          const tokens = norm(words).split(' ').filter(Boolean);

                          const found = ids.find(id => {
                            if (!domains.includes(id.split('.')[0])) return false;

                            const text = entityText(id);
                            return tokens.every(token => text.includes(token));
                          });

                          if (found) return found;
                        }

                        return null;
                      };

                      // Mesure numérique valide ou null.
                      const getPower = entityId => {
                        if (!entityId || !states[entityId]) return null;

                        const raw = String(states[entityId].state ?? '').toLowerCase();

                        if (
                          ['unknown', 'unavailable', 'none', ''].includes(raw)
                        ) {
                          return null;
                        }

                        const value = Number(raw);
                        return Number.isFinite(value) ? Math.max(0, value) : null;
                      };

                      const isCycleActive = entityId => {
                        if (!entityId || !states[entityId]) return false;

                        const state = norm(states[entityId].state);

                        return [
                          'on',
                          'true',
                          'running',
                          'active',
                          'marche',
                          'en cours',
                          'washing',
                          'drying'
                        ].includes(state);
                      };

                      const esc = value => String(value ?? '')
                        .replace(/&/g, '&amp;')
                        .replace(/</g, '&lt;')
                        .replace(/>/g, '&gt;')
                        .replace(/"/g, '&quot;')
                        .replace(/'/g, '&#39;');

                      // =====================================================
                      // 2. PROTECTION DE CYCLE
                      // =====================================================
                      const protectionId =
                        'binary_sensor.foxcat_energy_machines_machine_protegee_active';

                      const protectionEntity = states[protectionId]
                        ? protectionId
                        : findEntity(
                            ['binary_sensor', 'sensor'],
                            [
                              'machine protegee active',
                              'protection cycle active'
                            ]
                          );

                      const protectionState = protectionEntity
                        ? norm(states[protectionEntity]?.state)
                        : '';

                      const protectionActive = [
                        'on',
                        'true',
                        'active',
                        'activee',
                        'protege',
                        'protection active'
                      ].includes(protectionState);

                      // =====================================================
                      // 3. MACHINES
                      // =====================================================
                      const devices = [
                        {
                          name: 'Lave-linge',
                          icon: 'mdi:washing-machine',
                          color: '#19d8ff',
                          max: 2200,
                          cycleWords: [
                            'foxcat energy machines lave linge cycle',
                            'foxcat energy machines washing machine cycle',
                            'lave linge cycle',
                            'lave linge en cours',
                            'washing machine cycle'
                          ],
                          powerWords: [
                            'foxcat legacy sensor lave linge puissance',
                            'foxcat energy machines lave linge puissance',
                            'lave linge puissance',
                            'washing machine power'
                          ]
                        },
                        {
                          name: 'Sèche-linge',
                          icon: 'mdi:tumble-dryer',
                          color: '#a78bfa',
                          max: 2500,
                          cycleWords: [
                            'foxcat energy machines seche linge cycle',
                            'foxcat energy machines dryer cycle',
                            'seche linge cycle',
                            'seche linge en cours',
                            'dryer cycle'
                          ],
                          powerWords: [
                            'foxcat legacy sensor seche linge puissance',
                            'foxcat energy machines seche linge puissance',
                            'seche linge puissance',
                            'dryer power'
                          ]
                        },
                        {
                          name: 'Lave-vaisselle',
                          icon: 'mdi:dishwasher',
                          color: '#35e59d',
                          max: 2000,
                          cycleWords: [
                            'foxcat energy machines lave vaisselle cycle',
                            'foxcat energy machines dishwasher cycle',
                            'lave vaisselle cycle',
                            'lave vaisselle en cours',
                            'dishwasher cycle'
                          ],
                          powerWords: [
                            'foxcat legacy sensor lave vaisselle puissance',
                            'foxcat energy machines lave vaisselle puissance',
                            'lave vaisselle puissance',
                            'dishwasher power'
                          ]
                        }
                      ];

                      // =====================================================
                      // 4. CARTES MACHINES
                      // =====================================================
                      const devHtml = devices.map(device => {
                        const cycleEntity = findEntity(
                          ['binary_sensor', 'sensor', 'input_boolean'],
                          device.cycleWords
                        );

                        const powerEntity = findEntity(
                          ['sensor'],
                          device.powerWords
                        );

                        const pw = getPower(powerEntity);
                        const powerKnown = pw !== null;
                        const powerValue = powerKnown ? pw : 0;
                        const cycle = isCycleActive(cycleEntity);
                        const running = cycle || (powerKnown && pw > 20);

                        let status = 'En attente';
                        let statusColor = '#94a3b8';
                        let statusBg = 'rgba(255,255,255,0.05)';
                        let effect = '';

                        if (cycle && protectionActive) {
                          status = 'Protégé';
                          statusColor = '#35e59d';
                          statusBg = 'rgba(53,229,157,0.15)';
                          effect =
                            'border:1px solid rgba(53,229,157,0.35);' +
                            'box-shadow:0 0 10px rgba(53,229,157,0.18);';
                        } else if (cycle) {
                          status = 'Cycle actif';
                          statusColor = device.color;
                          statusBg = `${device.color}25`;
                          effect = `border:1px solid ${device.color}55;`;
                        } else if (powerKnown && pw > 20) {
                          status = 'Consommation';
                          statusColor = device.color;
                          statusBg = `${device.color}25`;
                          effect = `border:1px solid ${device.color}45;`;
                        } else if (!cycleEntity && !powerEntity) {
                          status = 'À configurer';
                        } else if (!cycleEntity && !powerKnown) {
                          status = 'Mesures indisponibles';
                        }

                        const pct = Math.min(
                          Math.max((powerValue / device.max) * 100, 0),
                          100
                        );

                        const powerDisplay = powerKnown
                          ? `${Math.round(pw)} W`
                          : '— W';

                        const stateDisplay = cycle
                          ? 'Cycle détecté'
                          : powerKnown && pw > 20
