                            <div style="padding:20px 10px;text-align:center;border:1px solid ${isHP ? '#ff922b' : '#ffffff12'};border-radius:16px;background:${isHP ? '#ff922b12' : '#ffffff04'}">
                              <div style="font-size:10px;color:#ff922b;font-weight:900">HEURES PLEINES</div>
                              <div style="font-size:25px;color:white;font-weight:950;margin-top:10px">${fmt(hp)} €</div>
                              <div style="font-size:10px;color:#94a3b8;margin-top:6px">${isHP ? 'TARIF ACTIF' : 'Tarif HP'}</div>
