                          .source-grid small {

                            margin-top:2px;

                            color:#64748b;

                            font-size:7px;
                          }


                          .solar-label {
                            color:#ff922b;
                          }


                          .grid-label {
                            color:#fb7185;
                          }


                          .source-bar,
                          .split-bar {

                            display:flex;

                            width:100%;

                            height:6px;

                            margin-top:9px;

                            overflow:hidden;

                            border-radius:10px;

                            background:
                              rgba(255,255,255,.05);
                          }


                          .solar-fill {

                            height:100%;

                            background:#ff922b;
                          }


                          .grid-fill {

                            height:100%;

                            background:#fb7185;
                          }


                          /* =====================================================
                             HP / HC
                             ===================================================== */

                          .tariff-title {

                            margin-top:13px;

                            color:#526174;

                            font-size:6px;

                            font-weight:900;

                            letter-spacing:.12em;
                          }


                          .tariff-values {

                            display:grid;

                            grid-template-columns:
                              1fr 1fr;

                            gap:10px;

                            margin-top:8px;
                          }


                          .tariff-values > div {

